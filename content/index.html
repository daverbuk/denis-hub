<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:17px;line-height:1.35;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left}

.week{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;padding-top:4px}
.day{min-width:0;scroll-margin-top:140px}
.dh{display:flex;align-items:center;gap:10px;padding:14px 4px 8px;min-height:56px}

.dh .badge{margin-left:auto;font-size:13px;color:var(--sub);text-align:right}

.day.today .dw{color:var(--accent)}

.card{position:relative;background:var(--card);border-radius:12px;min-height:118px;display:flex;border:1px solid transparent;box-shadow:0 .5px 0 rgba(0,0,0,.04)}

.copen{flex:1;min-width:0;display:flex;flex-direction:column;align-items:stretch;padding:10px 12px 10px;border-radius:12px}
.copen:active{background:var(--fill)}
.lab{font-size:11px;color:var(--sub);display:flex;align-items:center;gap:5px;padding-right:30px;min-height:22px;text-transform:uppercase;letter-spacing:.2px;font-weight:600}
.lab span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;background:var(--dot-p)}
.dot.k{background:var(--accent)}
.lab.k{color:var(--accent)}
.ttl{font-size:15px;line-height:1.3;font-weight:500;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.card.needs .ttl{color:var(--sub);font-weight:400}
.foot{margin-top:auto;padding-top:6px;font-size:13px;color:var(--sub);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.foot .fm{min-width:0;overflow-wrap:anywhere}
.foot .tm::after{content:" \00b7"}
.pill{font-size:11px;border:1px solid var(--sep);border-radius:6px;padding:1px 6px;color:var(--sub)}
.card.done .ttl{color:var(--sub);text-decoration:line-through;text-decoration-color:var(--sub)}
.check{position:absolute;top:0;right:0;width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:12px}
.check i{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--sub);display:block;position:relative;transition:background .15s}
.check[aria-checked="true"] i{background:var(--accent);border-color:var(--accent)}
.check[aria-checked="true"] i::after{content:"";position:absolute;left:7px;top:3.5px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.plan{margin-top:20px;background:var(--card);border-radius:12px;padding:14px 16px;color:var(--sub);font-size:14px}
.plan b{color:var(--text);font-weight:600}
@media (min-width:640px) and (max-width:979px){ .cards{grid-template-columns:repeat(4,minmax(0,1fr))} }
@media (min-width:980px){

  .card{min-height:112px}
}
/* month */
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--sep);border-radius:12px;overflow:hidden;margin-top:12px;border:.5px solid var(--sep)}
.mh{background:var(--card);font-size:12px;color:var(--sub);text-align:center;padding:8px 0;text-transform:uppercase;letter-spacing:.3px}
.mc{background:var(--card);min-height:64px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.mc.out{background:var(--bg)}

.mc.off .n{color:var(--sub);opacity:.5}
.mc.today .n{background:var(--accent);color:#fff;font-weight:600}
.mc .ds{display:flex;gap:3px}
.mc .ds i{width:6px;height:6px;border-radius:50%;border:1.2px solid var(--dot-p);display:block}
.mc .ds i.k{border-color:var(--accent)}
.mc .ds i.on{background:var(--accent);border-color:var(--accent)}
.mc .fr{font-size:10px;color:var(--sub);line-height:1}
button.mc:active{background:var(--fill)}
@media (min-width:980px){ .mc{min-height:96px} .mc .ds i{width:8px;height:8px} .mc .fr{font-size:12px} }
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--sub);font-size:13px;padding:10px 4px}
.legend span{display:inline-flex;align-items:center;gap:6px}

.section-h{color:var(--sub);font-size:13px;text-transform:uppercase;letter-spacing:.3px;padding:18px 16px 6px}
.group{background:var(--card);border-radius:10px;overflow:hidden}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s;z-index:10}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:680px;max-height:92vh;max-height:92dvh;background:var(--bg);border-radius:12px 12px 0 0;transform:translateY(105%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s linear .3s;z-index:11;display:flex;flex-direction:column;box-shadow:0 -2px 20px rgba(0,0,0,.15)}
.sheet.on{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--sep);margin:6px auto 0}

.drow{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 16px;width:100%;text-align:left;position:relative}

.drow.link{color:var(--accent)}
.kv{padding:10px 16px;position:relative}

age)", "On-screen text: \"kids remember what they make\" / \"they forget what they watch\""]], ["Where", "text", "Studio. Filmed on Sunday studio day."], ["Checklist", "check", ["Film on Sunday studio day", "Cut to 45 to 75 seconds", "Add on-screen text and subtitles", "English caption, Spanish line", "No prices, no pitch", "Post on Kubot", "Reply to comments in the first hour"]]], "s": {"hooks": ["5 years teaching kids, and the best learners do one weird thing.", "After 5 years teaching kids, this is what actually works.", "Your kid isn't bad at learning. They're just watching instead of making", "The kid who takes your remote apart is going to be fine", "After 5 years teaching kids, I'd take hands-on over screens every time"], "body": "It's not the smartest kid in the room.\nIt's not the best app.\nHonestly, it's not the educational videos either.\nIt's the kid with the parts in their hands.\nThe kid who takes things apart to see what's inside.\nThe kid who wants to try before you finish explaining.\nHere's why.\nWhen a kid watches something, someone else did the thinking.\nWhen a kid makes something, they did every step themselves.\nThey picked the piece.\nThey got it wrong.\nThey fixed it.\nSo it sticks.\nKids remember what they make.\nThey forget what they watch.", "cta": "So tonight, swap one video for one thing they make.\nCardboard. Blocks. A broken toy.\nWhat's the first thing your kid ever built?", "src": "Denis's script, Oct 22", "kind": "new", "notes": "", "fillins": "", "format": ""}, "inspiration": ["https://youtube.com/shorts/HGbSB4LI9Ww?si=wxm-Xjf9xAqfJFXi"]}, "personal": []}, {"date": "2026-10-20", "dow": "Tue", "kubot": {"format": "Denis Builds", "title": "Kubot: Denis Builds", "sub": "Tank, part 2", "hook": "I let a kid review my tank", "badge": "", "needs": false, "film": [], "sections": [["Plan", "rows", [["Series", "Denis Builds: Denis on camera, building in public."], ["Episode", "More of the CyberBricks 3D printed tank. Hook and shot only. Pick an option after part 1 is filmed."], ["When to film", "Any time before it posts."]]], ["Inspo", "rows", [["Option A (lead)", "\"I let a kid review my tank\""], ["Option B", "\"Upgrading the tank\""]]], ["Shots", "list", ["Option A: the kid's first drive, one take", "Option A: the kid's score to camera, parent nearby", "Option B: printing and fitting [UPGRADE], then the rematch test", "Denis reaction"]], ["Where", "text", "[where you build]"], ["Checklist", "check", ["Pick option A or B", "Signed parent release if a kid is on camera, first name only", "Cut the Short", "No prices, no pitch", "Post on Kubot"]]], "s": {"hooks": ["I let a kid review my tank", "I let a kid review my tank, and the questions get increasingly more honest", "A kid drove my tank for the first time. Here's the score.", "Kids are the harshest reviewers.", "I built it. A kid judged it."], "body": "I let a kid review my 3D printed tank, and the questions get increasingly more honest.\n[kid's first name] has never driven it.\n[B-ROLL: the tank on the table, the kid walking up]\nQuestion one.\n\"Does it look cool?\"\n[the kid's answer, word for word]\nQuestion two.\n\"Drive it.\"\n[what happened on the first drive, one honest line]\nQuestion three.\n\"What would you change?\"\n[the kid's answer]\nQuestion four.\n\"Score out of 10?\"\n[the score]\nAnd honestly, that's a better review than I gave it.\nWhat should I print next?", "cta": "What should I print next? Let your kid answer. Waitlist link in bio.", "src": "kubot-builds-scripts.md Ep. 2 option A + the Ep. 1 escalating test format (adapted)", "kind": "adapted", "notes": "Signed parent release, first name only, no schools. If you go with option B (upgrade), use the Nov 10 script instead.", "fillins": "", "format": ""}, "inspiration": []}, "personal": []}, {"date": "2026-10-21", "dow": "Wed", "kubot": {"format": "Robot on the Street", "title": "Kubot: Robot on the Street", "sub": "Are you scared of AI for your kids?", "hook": "Are you scared of AI for your kids?", "badge": "", "needs": false, "film": [{"what": "Robot on the Street", "short": "Robot on the Street", "note": "Film today or earlier. Main question: Are you scared of AI for your kids?"}], "sections": [["Plan", "rows", [["Series", "Robot on the Street: the robot holds the mic and asks people one short question each."], ["Main question", "Are you scared of AI for your kids?"], ["Twist ending", "Gabriel steps in at the end: \"Robots don't teach here. Kids build them.\""], ["Goal", "5 to 6 good answers, a split reaction, then the twist. 30 to 45 seconds."], ["When to film", "Today or earlier."]]], ["Questions", "list", ["Would you let a robot teach your kid?", "Would you rather your kid use robots or build them?", "What should kids learn that school doesn't teach?", "Would your kid rather have an iPad or build a robot?", "Are you scared of AI for your kids?", "What did you build as a kid?", "If a robot could help with one thing at home, what would it be?", "Should kids learn to code or learn to build first?"]], ["Shots", "list", ["Opener: the robot turns to someone, mic up", "Opener line: \"Quick question from a robot. Got 5 seconds?\"", "Each answer: tight on the person, robot mic in frame", "Reactions: people laughing, pointing, filming the robot", "Wide establishing shot of the spot", "Gabriel walking in for the twist, then the line to camera"]], ["Where", "text", "[pick the spot]. Public sidewalks or a park. Ask before filming on private property. Robot at the edge of the walkway, not blocking it."], ["Checklist", "check", ["Pick the spot and time", "Charge the robot and the mic", "Print releases and bring pens", "Quick release from every face used, a parent's for kids", "Never mock anyone's answer", "Get 5 to 6 usable answers", "Film Gabriel's twist line", "Cut to 30 to 45 seconds with subtitles", "No prices, no pitch"]]], "s": {"hooks": ["Are you scared of AI for your kids?", "We asked Miami: are you scared of ai for your kids?", "A robot asked strangers one question, and the answers get more honest", "People had opinions. Fast.", "Quick question from a robot. Got 5 seconds?"], "body": "ROBOT: Quick question from a robot. Got 5 seconds?\nROBOT: Are you scared of AI for your kids?\n[answer 1, word for word]\n[answer 2]\n[answer 3, the one that surprised you]\n[answer 4]\n[answer 5, a kid if there's a signed parent release]\n[B-ROLL: reactions, people filming the robot]\n[the split: who said yes, who said no, in one line]\nGABRIEL (to camera): Robots don't teach here. Kids build them.", "cta": "What would you answer? Comment it. Waitlist link in bio.", "src": "Plan v2 Robot on the Street format + content.py question list (structure reused; answers are real only)", "kind": "adapted", "notes": "Unscripted. Quick release from every face, a parent's for kids. Never mock an answer.", "fillins": "", "format": ""}, "inspiration": []}, "personal": []}, {"date": "2026-10-22", "dow": "Thu", "kubot": {"format": "Why Build", "title": "Kubot: Why Build", "sub": "#6 Confidence", "hook": "the shy kid changes", "badge": "", "needs": false, "film": [], "sections": [["Plan", "rows", [["Show", "Why Build? with Gabriel. Gabriel to camera, 45 to 75 seconds."], ["Episode", "#6 Confidence"], ["Status", "Script ready."]]], ["Inspo", "rows", [["Text hook", "the shy kid changes"], ["On screen", "\"the robot takes the spotlight\" / \"tonight: let them teach you\""], ["Optional real moment", "Only if it's true, in Gabriel's own words, after \"And someone asks how it works.\" Never required."]]], ["Caption", "rows", [["Caption", "Telling a shy kid to speak up almost never works. Asking how their robot works does. When they explain what they made, the spotlight is on the robot, not on them. What could your kid explain for an hour? 👇"], ["Spanish line", "He visto a niños tímidos cambiar en una hora."]]], ["Shots", "list", ["Gabriel to camera, clean audio", "B-roll: A kid explaining their robot to camera (Friday class footage)", "On-screen text: \"the robot takes the spotlight\" / \"tonight: let them teach you\""]], ["Where", "text", "Studio. Filmed on Sunday studio day."], ["Checklist", "check", ["Film on Sunday studio day", "Cut to 45 to 75 seconds", "Add on-screen text and subtitles", "English caption, Spanish line", "No prices, no pitch", "Post on Kubot", "Reply to comments in the first hour"]]], "s": {"hooks": ["the shy kid changes", "I've watched shy kids change in one hour.", "Telling a shy kid to speak up almost never works.", "The robot takes the spotlight off them.", "What could your kid explain for an hour?"], "body": "I've watched shy kids change in one hour.\nNot because someone told them to speak up.\nHonestly, telling a shy kid to speak up almost never works.\nThe kid who hides behind mom at drop off.\nThe kid who won't say their name in the circle.\nThen they finish a robot.\nAnd someone asks how it works.\nHere's the thing.\nThey're not talking about themselves anymore.\nThey're talking about the thing they made.\nThat's easier.\nThe robot takes the spotlight off them.\nAnd nobody in the room knows that robot better than they do.\nEvery time they explain it, it gets a little easier.\nThat's confidence.\nIt comes from knowing something, not from being told to be brave.\nTonight, ask your kid to teach you how they made something.\nAnything.\nThen follow their steps exactly.\nWhat could your kid explain for an hour?", "cta": "What could your kid explain for an hour? Waitlist link in bio.", "src": "why-build-scripts.md #6 (reused as is)", "kind": "reused", "notes": "Gabriel's script, already filmed or filming on Sunday studio day.", "fillins": "", "format": ""}, "inspiration": []}, "personal": []}, {"date": "2026-10-23", "dow": "Fri", "kubot": {"format": "Denis Builds", "title": "Kubot: Denis Builds", "sub": "The empty room", "hook": "This empty room becomes something kids beg for", "badge": "Hero shoot 3:30 to 5 PM, Bal Harbour", "needs": false, "film": [{"what": "Kubot class, 3:30 to 5 PM, Bal Harbour", "note": "Hero shoot. Film testimonials and b-roll. Gabriel teaches, Denis films.", "sections": [["Capture list", "list", ["Door: signed parent photo and video release before any face is used", "Wide of the room before kids arrive", "Hands on CyberBricks and 3D printed parts (vertical and horizontal)", "Gabriel teaching: hands, face, parts, kids reacting", "A build failing, then a kid fixing it", "The first time a robot moves, plus the kid's face", "Wide room shots once it's full", "Pickup: a kid showing the build to a parent", "Parent answer at pickup (release-cleared only): \"What did you notice in your kid today?\" Get 2 to 3 clean answers for Saturday"]], ["Rules", "text", "No scripted kid interviews. No prices, no pitch. First names only, no school names. After class, confirm which faces are release-cleared before the edit."]], "short": "Class 3:30 to 5 PM, Bal Harbour"}], "sections": [["Plan", "rows", [["Series", "Denis Builds: Denis on camera, building in public."], ["Episode", "Store countdown walkthrough. Hook and shot only."], ["When to film", "Any time before it posts."]]], ["Inspo", "rows", [["Hook", "This empty room becomes something kids beg for"]]], ["Shots", "list", ["The empty room, wide", "Walkthrough, one take, Denis talking", "Details: [what's already in]"]], ["Where", "text", "[the space you're filming]"], ["Checklist", "check", ["Film the walkthrough", "Cut to 30 to 45 seconds", "No prices, no pitch", "Post on Kubot"]]], "s": {"hooks": ["This empty room becomes something kids beg for", "Right now it's an empty room.", "Nobody claps for the empty room.", "Here's what goes where.", "Give it a few weeks. Watch this room."], "body": "This empty room becomes something kids beg for.\n[B-ROLL: the empty room, wide]\nRight now it's [what the room looks like today, one honest line].\nOver here: [what goes here, in your own words].\nOver here: [what goes here].\n[B-ROLL: walkthrough, one take]\nWhat's left before December 1st: [what's left to do].\nAnd in a few weeks, this is where a kid builds their first robot.", "cta": "What would you put in here? Comment it. Waitlist link in bio.", "src": "kubot-builds-scripts.md banked idea + hub posts.json Oct 23 (hook reused, body adapted)", "kind": "adapted", "notes": "", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "Expose", "desc": "Deadpan talking head, about 60s", "has": true, "title": "Exposing random robotics company for 1 minute", "s": {"hooks": ["Exposing random robotics company for 1 minute", "Exposing humanoid robots for 1 minute"], "body": "[Shake the jar of paper slips. Pull one out and read it. Deadpan.]\n\nHumanoid robots.\n\nI don't know a single humanoid robot controversy.\n\n[Music hits. Cut in tighter.]\n\nTesla's robots spent a whole launch night pouring drinks and chatting with guests. Bloomberg reported employees stationed somewhere else were remote controlling a lot of those conversations. One of the bartender robots literally admitted it was being assisted by a human.\n\nThere's a home robot you can preorder right now, and when it can't figure out a chore, a company employee puts on a VR headset, takes over, and sees inside your house through its cameras. When the Wall Street Journal tested it, they didn't see it do a single thing on its own.\n\nRemember the viral video of a robot folding a shirt? People spotted the operator's hand slipping into the frame.\n\nThen they posted a video of the robots working on their own. Look at the tiny text in the corner. Two to ten times speed.\n\nAnd the robot going viral for flirting with girls on the street? Reporters found a guy nearby controlling its moves and what it says.", "cta": "Caption: The VR headset thing is crazy to me", "src": "Rewritten Oct 23 from the inspo transcripts", "kind": "new", "notes": "Copies leo.taps \"Exposing random Tech company for 1 minute\" (423K likes). His exact shape: say the subject, the fake-innocent line (\"I don't know a single Tesla controversy\"), then stack the facts fast, heaviest first, each with a source, and stop on the last fact with no wrap-up. Deadpan, no music until the first fact. Check every claim before filming.", "fillins": "", "format": "Exposing (talking head)", "fmt": "Exposing (talking head)"}, "inspiration": ["https://www.instagram.com/reel/DeyI4DxRiSC/", "https://www.instagram.com/reel/DYBaGViA4as/", "https://www.instagram.com/reel/DYr-bd5zAMW/"], "th": "Exposing random robotics company for 1 minute", "ith": "Exposing random Tech company for 1 minute"}]}, {"date": "2026-10-24", "dow": "Sat", "kubot": {"format": "Testimonial", "title": "Kubot: Testimonial", "sub": "From Fri Oct 23 class", "hook": "Watch [his or her] face when [he or she] shows [mom or dad]", "badge": "", "needs": false, "film": [], "sections": [["Plan", "rows", [["Series", "Testimonial: a kid at pickup showing their parent what they built, then one honest sentence from the parent. Unscripted, never staged."], ["Source", "Footage from the Fri Oct 23 class (Bal Harbour)."], ["Hook options", "\"Watch [his or her] face when [he or she] shows [mom or dad]\" or \"I asked a [mom or dad] what changed in [her or his] [son or daughter]\". Use the real kid and parent."], ["Who", "[parent first name] and [kid first name]. First names only."], ["Goal", "One honest answer a parent watching can relate to. 25 to 35 seconds."]]], ["Questions", "list", ["What did you notice in your kid today?", "What did [kid] tell you about the build on the way out?", "What is something [kid] built that surprised you?", "How does [kid] talk about building now?", "In one sentence, what did building give [kid]?"]], ["Shots", "list", ["Kid running up with the build", "Kid explaining it to the parent", "Parent's face as the robot moves", "The parent's one sentence", "Close-up of the build in the kid's hands"]], ["Where", "text", "Bal Harbour class footage from Friday."], ["Checklist", "check", ["Pick the pickup moment from Friday's footage", "Confirm the signed release for kid and parent", "First names only, no school names", "Cut to 25 to 35 seconds with subtitles", "No prices, no pitch", "Post on Kubot"]]], "s": {"hooks": ["Watch [his or her] face when [he or she] shows [mom or dad]", "This is what a Friday class looks like.", "Pieces in. Robot out.", "What did you notice in your kid today?", "One parent. One answer at pickup."], "body": "[B-ROLL: kid running up to the parent with the build]\nKID: [what the kid says about the build, word for word]\n[B-ROLL: the robot moving, the parent's face]\nPARENT (answering \"What did you notice in your kid today?\"): [the parent's answer, word for word]\n[B-ROLL: close up of the build in the kid's hands]\nON-SCREEN: [parent's first name] and [kid's first name], after the Fri Oct 23 class.", "cta": "What did your kid build first? Comment it. Or send us their drawing.", "src": "Plan v2 Real Families + kubot-details.json hook options + hub posts.json pickup posts (structure reused; words are real only)", "kind": "adapted", "notes": "Never staged or scripted. Signed release for kid and parent, first names only, no schools.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "POV", "desc": "Mostly visual, 20 to 35s", "has": true, "title": "POV: 12 3D printers are working while I sleep", "s": {"hooks": ["POV: 12 3D printers are working while I sleep", "I leave at 8. They don't."], "body": "So I just found out what happens when you leave 3D printers running overnight, and I've become an absolute maniac with it. I have a night shift now. There's 12 of them.\n\nIt's currently [time], I'm about to head home.\n\n[Point at the first row] These four are printing [what] right now. [Point] These are on [what]. I should wake up with [number] finished [parts].\n\nThis is insane. Last night they printed [what came off the beds this morning].\n\n[Overnight timelapse]\n\n[Morning: walk in, pull parts off the beds, one honest reaction line]", "cta": "Comment PRINT and the most liked comment gets printed tonight", "src": "Rewritten Oct 23 from the inspo transcripts", "kind": "new", "notes": "Copies Mino Lee's \"POV: Claude is editing 7 reels while I sleep\" (293K). His exact shape: \"So I just discovered X and I've become an absolute maniac with it\", how many of them there are, the time on the clock, what each one is doing right now, what you'll wake up to, what happened last night, then the comment CTA. Filmed handheld at night, talking fast.", "fillins": "", "format": "POV, mostly visual", "fmt": "POV, mostly visual"}, "inspiration": ["https://www.instagram.com/reel/DegXneUNOip/", "https://www.instagram.com/reel/DejCX63y2LM/"], "th": "POV: 12 3D printers are working while I sleep", "ith": "POV: Claude is editing 7 REELS while i sleep (idek how to code)"}, {"time": "", "label": "Hook test", "desc": "On-screen text over B-roll, 6 to 10s", "has": true, "title": "I am 21 and I'm not ashamed to admit that my most viral videos were about male rules, and I'm scared nobody will care about the thing I actually care about.", "th": "I am 21 and I'm not ashamed to admit that my most viral videos were about male rules, and I'm scared nobody will care about the thing I actually care about.", "ith": "I am 29 and I am not ashamed to admit that: (carousel, one honest admission per slide)", "inspiration": ["https://www.instagram.com/reel/DRKG_F5jHmG/"], "s": {"hooks": ["I am 21 and I'm not ashamed to admit that my most viral videos were about male rules, and I'm scared nobody will care about the thing I actually care about."], "body": "[On screen, first line] I am 21 and I'm not ashamed to admit\n\n[Second line] that my most viral videos were about male rules,\n\n[Third line] and I'm scared nobody will care about the thing I actually care about.", "cta": "Caption: Four million views on a list of rules for guys. Then I started posting about robots and 3D printers, and the views dropped. Some days I wonder if anyone wanted me, or just the format. But I'd rather build an audience around something I love than keep posting something I've outgrown. If you're changing what you post right now, I see you.\n\nIf you feel the same, you're not alone.\n\nfollow @denisaverbuk for more real talk", "src": "Hook formats Denis found, written Oct 23", "kind": "new", "notes": "Copies @laurastravl's \"I am 29 and I am not ashamed to admit that:\" post. Hook on screen over a casual shot of you, then the honest admission. The caption tells the full story and what you learned. Don't try to sound perfect; the goal is people thinking \"I feel exactly the same.\" Only post the lines that are true for you. Her setup: one slow, pretty B-roll clip (you looking out, walking, at the desk, the print farm at night), white text centered on screen, an emotional trending song (hers use songs like \"To Build A Home\"). No talking. Pull the clip from the B-roll library.", "fillins": "", "format": "I'm 21 and not ashamed", "fmt": "I'm 21 and not ashamed"}}]}, {"date": "2026-10-25", "dow": "Sun", "kubot": {"format": "Podcast", "title": "Kubot: Podcast", "sub": "Ep. 2: Street answers", "hook": "We asked Miami if they'd let a robot teach their kid", "badge": "Studio day", "needs": false, "film": [{"what": "Why Build #12 Ready for an AI future", "short": "Why Build #12", "note": "Posts Mon Oct 26.", "ref": "2026-10-26"}, {"what": "Why Build #18 How to praise a build", "short": "Why Build #18", "note": "Posts Thu Oct 29.", "ref": "2026-10-29"}, {"what": "Podcast ep. 3", "short": "Podcast ep. 3", "note": "Posts Sun Nov 1.", "ref": "2026-11-01"}], "sections": [["Plan", "rows", [["Episode", "Podcast ep. 2. Full episode on YouTube and Spotify, plus one clip on Kubot."], ["Filmed", "Last Sunday's studio day."]]], ["Inspo", "rows", [["Show", "Founders podcast: weekly build in public episode, 30 to 45 minutes, Denis and Gabriel hosting. Cut into 5 to 8 short clips."], ["This episode", "We asked Miami if they'd let a robot teach their kid. React to the best Robot on the Street answers."]]], ["Shape", "text", "1. Cold open (1 to 2 min): Denis sets up the street question.\n2. Street answers (15 to 20 min): play the best clips, Gabriel reacts to each.\n3. Week in the build (3 to 5 min): what got done at the store, what broke, what's next.\n4. Kid of the week (optional): a Friday kid explains their robot, with a parent on mic. Only if release-cleared.\n5. What to try tonight (5 min): one tip for parents.\n6. Close (2 min): tease next week."], ["Questions", "list", ["Which street answer surprised you most? [play the clip]", "Would you let a robot teach your kid? Why or why not?", "What's the difference between a kid using a robot and building one?", "What are parents scared of with AI, and what do you tell them?", "What happens in a kid's head the first time their robot moves?", "If a parent is worried about screens, what can they try tonight?", "What broke this week, and what's next before the store opens?"]], ["Shots", "list", ["Wide two-shot, plus a single on each host", "Print farm and robots visible behind", "Clip targets: one Gabriel line that stands alone, one parent tip for tonight"]], ["Where", "text", "Studio. Audio: the podcast mics, test recording first."], ["Checklist", "check", ["Upload the full episode to YouTube and Spotify", "Cut one clip for Kubot", "Mark 5 to 8 clips for later", "No prices, no pitch", "Reply to comments in the first hour"]]], "s": {"hooks": ["We asked Miami if they'd let a robot teach their kid", "Gabriel reacts to the best street answers", "The answer that got Gabriel", "Robots don't teach here. Kids build them.", "Would you let a robot teach your kid?"], "body": "DENIS (cold open): We put a robot on the street and asked Miami one question. Would you let a robot teach your kid?\nDENIS: Gabriel has taught kids robotics for over 10 years. So I made him watch every answer.\n[CLIP: the best street answer]\nGABRIEL: [his reaction]\nDENIS: Most people said [the most common answer]. Gabriel, what do you tell those parents?\nGABRIEL: [his answer]\nCLIP FOR KUBOT: [the one Gabriel line that stands alone]", "cta": "Full episode on YouTube and Spotify. What should we ask Gabriel next? Waitlist link in bio.", "src": "content.py podcast ep. 2 (reused)", "kind": "reused", "notes": "Gabriel's answers are his, unscripted. Only the cold open and questions are written.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "List", "desc": "Collage list, 30 to 45s", "has": true, "title": "5 YouTube Videos That Make You A Disgustingly Good Founder", "s": {"hooks": ["5 YouTube Videos That Make You A Disgustingly Good Founder", "Watch these 5 before you start anything"], "body": "5 YouTube videos that make you a disgustingly good founder.\n\nNumber 1, Steve Jobs on life, from 1994. Ninety seconds on how everything around you was made by people no smarter than you. Every founder who's ever felt not ready needs this one.\n\nNumber 2, Jeff Bezos on the regret minimization framework. How he decided to quit a great job. You'll make every big decision differently after this.\n\nNumber 3, Y Combinator, How to Start a Startup, lecture one with Sam Altman. The whole course is free. Start here.\n\nNumber 4, Y Combinator, How to Get Your First Customers. Spoiler: you go get them by hand.\n\nNumber 5, Steve Jobs' Stanford commencement speech. The connecting the dots part. Best fifteen minutes for when you feel behind.\n\nYour feed can scroll you into nothing, or it can teach you more than a semester of business school. But none of them build it for you. [Your real closing line: which one you rewatch most.]", "cta": "Comment FOUNDER and I'll send you all 5 links", "src": "Rewritten Oct 23 from the inspo transcripts", "kind": "new", "notes": "Copies \"5 YouTube videos that make you a disgustingly good musician\" (137K on @dennyondabeat): exact video titles, who each one is for, then \"your feed can scroll you into nothing\" before the CTA. Put each video's thumbnail on screen as you say it. Set up the auto-DM for FOUNDER.", "fillins": "", "format": "Collage list", "fmt": "Collage list"}, "inspiration": ["https://www.instagram.com/reel/DeN7BrIRzTb/", "https://www.instagram.com/reel/DdmJNQJp81s/"], "th": "5 YouTube Videos That Make You A Disgustingly Good Founder", "ith": "5 Youtube Videos That Make You Disgustingly Good Musician"}, {"time": "", "label": "Hook test", "desc": "On-screen text over B-roll, 6 to 10s", "has": true, "title": "My coach told me about the \"curiosity gap\" and it completely changed the way I write hooks", "th": "My coach told me about the \"curiosity gap\" and it completely changed the way I write hooks", "ith": "I recently discovered \"The Empty Boat Theory\"... and it completely changed the way I see people.", "inspiration": ["https://www.instagram.com/reel/DbicgB4sRT4/"], "s": {"hooks": ["My coach told me about the \"curiosity gap\" and it completely changed the way I write hooks"], "body": "[On screen, line 1] My coach told me about the \"curiosity gap\"...\n\n[Line 2] and it completely changed the way I write hooks.", "cta": "Caption: My coach told me about something called the curiosity gap.\n\nImagine someone tells you \"I almost lost everything last week\" and then walks away. You'd chase them down the hall to hear the rest.\n\nNow imagine they told you the whole story up front. You'd nod and move on.\n\nHooks are often like that. We explain everything in the first second and wonder why nobody stays. His benchmark was \"no one my age does this anymore.\" Short, open, and you need the rest.\n\nNow every hook I write leaves one question unanswered. My videos changed the week I started.\n\nfollow @denisaverbuk for more", "src": "Hook formats Denis found, written Oct 23", "kind": "new", "notes": "Copies @laurastravl's \"I recently discovered 'The Empty Boat Theory'... and it completely changed the way I see people\" (81.4K). On screen: just the hook, split in two lines. Caption shape: name the idea, \"Imagine...\" a concrete scene, what most people would do, \"now imagine\" the flip, \"life is often like that\", then what changed for you. Her setup: one slow, pretty B-roll clip (you looking out, walking, at the desk, the print farm at night), white text centered on screen, an emotional trending song (hers use songs like \"To Build A Home\"). No talking. Pull the clip from the B-roll library.", "fillins": "", "format": "The ___ theory", "fmt": "The ___ theory"}}]}, {"date": "2026-10-26", "dow": "Mon", "kubot": {"format": "Why Build", "title": "Kubot: Why Build", "sub": "#12 Ready for an AI future", "hook": "AI can't do this", "badge": "", "needs": false, "film": [], "sections": [["Plan", "rows", [["Show", "Why Build? with Gabriel. Gabriel to camera, 45 to 75 seconds."], ["Episode", "#12 Ready for an AI future"], ["Status", "Script ready."]]], ["Inspo", "rows", [["Text hook", "AI can't do this"], ["On screen", "\"guess, test, try again\" / \"tonight: how does that work?\""], ["Optional real moment", "Only if it's true, in Gabriel's own words, after \"Every build runs on that loop.\" Never required."]]], ["Caption", "rows", [["Caption", "AI can write the answer. It can't care enough to try the next wire. Guess, test, try again. That's the skill. Dads, this is the stuff we wished we had as kids. What does your kid always want to take apart? 👇"], ["Spanish line", "La habilidad que la IA no puede reemplazar: descubrir por qué algo no funciona."]]], ["Shots", "list", ["Gabriel to camera, clean audio", "B-roll: A kid checking wires and testing again (Friday class footage)", "On-screen text: \"guess, test, try again\" / \"tonight: how does that work?\""]], ["Where", "text", "Studio. Filmed on Sunday studio day."], ["Checklist", "check", ["Film on Sunday studio day", "Cut to 45 to 75 seconds", "Add on-screen text and subtitles", "English caption, Spanish line", "No prices, no pitch", "Post on Kubot", "Reply to comments in the first hour"]]], "s": {"hooks": ["AI can't do this", "There's one skill AI can't replace in your kid.", "Guess. Test. Wrong. Try again.", "It's not being good with screens.", "What does your kid always want to take apart?"], "body": "There's one skill AI can't replace in your kid.\nAnd it's not being good with screens.\nIt's figuring out why something doesn't work.\nAI can write the answer.\nIt can't stand at the table with a wire in the wrong spot, and care enough to try again.\nThe kid who wants to see inside.\nThe kid who opens it up instead of asking for a new one.\nHonestly, it's the stuff a lot of us wished we had as kids.\nHere's the skill.\nGuess. Test. Wrong. Try again.\nEvery build runs on that loop.\nThe motor doesn't spin, so they check the wire.\nStill nothing, so they check the battery.\nThat loop is how builders think, and kids can start it young.\nTonight, point at one thing in your house.\nThe toaster. The car window.\nAsk, \"how do you think that works?\"\nLet them be wrong.\nWhat does your kid always want to take apart?", "cta": "What does your kid always want to take apart? Waitlist link in bio.", "src": "why-build-scripts.md #12 (reused as is)", "kind": "reused", "notes": "Gabriel's script, already filmed or filming on Sunday studio day.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "How-to", "desc": "How-to list, 40 to 60s", "has": true, "title": "How To Become Incredibly Good At 3D Printing", "s": {"hooks": ["How To Become Incredibly Good At 3D Printing", "How to get incredibly good at 3D printing (and I mean actually good)"], "body": "How to become incredibly good at 3D printing, and I mean actually good. The kind of maker that prints a part that fits on the first try.\n\nNumber one, print other people's files first. Beginners learn faster from finished examples than from a blank page. Psychologists call it the worked example effect. Twenty prints will teach you more than twenty tutorials. You're not bad at design, you just haven't seen enough good prints yet.\n\nNumber two, dry your filament. Plastic soaks up water from the air. Engineers call it hygroscopic. Half of \"my printer is broken\" is just wet plastic. Same file, wet versus dry, looks like two different printers.\n\nNumber three, calibrate before you blame the file. Run a temperature test once on every new spool. You're not unlucky, your printer just doesn't know your plastic yet.\n\nEvery great maker does those three, and every one of them had a machine they could run every single day, which is the part most people never get to. That's why I run 12 of them.", "cta": "Comment PRINT and I'll send you the first file I'd start with", "src": "Rewritten Oct 23 from the inspo transcripts", "kind": "new", "notes": "Copies \"How To Become Incredibly Good At Singing\" (195K on @dennyondabeat) line for line: identity line, exactly three tips, each with a real term and a \"you're not bad, you're just...\" reframe, then \"Every great X does those three\" into your CTA.", "fillins": "", "format": "How to become incredibly good", "fmt": "How to become incredibly good"}, "inspiration": ["https://www.instagram.com/reel/Dd78f_Ixoc4/", "https://www.instagram.com/reel/Dewq11ux5RI/", "https://www.instagram.com/reel/DeIuDFPR_db/"], "th": "How To Become Incredibly Good At 3D Printing", "ith": "How To Become Incredibly Good At Singing"}, {"time": "", "label": "Hook test", "desc": "On-screen text over B-roll, 6 to 10s", "has": true, "title": "The biggest lesson I've learnt about going viral is that it's NOT the goal", "th": "The biggest lesson I've learnt about going viral is that it's NOT the goal", "ith": "The older I get, the more I realize that the real luxuries in life aren't things. They're time, health, peace of mind...", "inspiration": ["https://www.instagram.com/reel/DdGe93jsQFv/"], "s": {"hooks": ["The biggest lesson I've learnt about going viral is that it's NOT the goal"], "body": "[On screen, all of it]\nThe biggest lesson I've learnt about going viral is that it's NOT the goal.\nIt's the people who stay after the video, the DMs that say \"me too\", showing up when nobody's watching, and the one comment that tells you it mattered.", "cta": "Caption: What would you add? Send this to someone who needs to hear it.\n\nfollow @denisaverbuk for more", "src": "Hook formats Denis found, written Oct 23", "kind": "new", "notes": "Copies @laurastravl's \"The older I get, the more I realize that the real luxuries in life aren't things. They're time, health, peace of mind...\" (35.3K). The whole message is on screen: the hook, then \"It's ...\" followed by a list. The caption stays short and asks people to add to the list and share it. Her setup: one slow, pretty B-roll clip (you looking out, walking, at the desk, the print farm at night), white text centered on screen, an emotional trending song (hers use songs like \"To Build A Home\"). No talking. Pull the clip from the B-roll library.", "fillins": "", "format": "Biggest lesson is NOT", "fmt": "Biggest lesson is NOT"}}]}, {"date": "2026-10-27", "dow": "Tue", "kubot": {"format": "Denis Builds", "title": "Kubot: Denis Builds", "sub": "Twelve printers, one night", "hook": "Twelve printers, one night", "badge": "", "needs": false, "film": [], "sections": [["Plan", "rows", [["Series", "Denis Builds: Denis on camera, building in public."], ["Episode", "Overnight print farm timelapse. Hook and shot only."], ["When to film", "Set up the timelapse the night before it posts."]]], ["Inspo", "rows", [["Hook", "Twelve printers, one night"]]], ["Shots", "list", ["Locked-off timelapse of the print farm overnight", "Morning: parts coming off the beds", "Close-up of [the best print]"]], ["Where", "text", "[where the print farm is set up]"], ["Checklist", "check", ["Set up the timelapse", "Cut to 15 to 30 seconds", "No prices, no pitch", "Post on Kubot"]]], "s": {"hooks": ["Twelve printers, one night", "We left 12 printers running overnight. Here's what came out.", "This is what a night at our print farm looks like.", "Hundreds of parts, one night.", "Our printers worked the night shift."], "body": "Twelve printers.\nOne night.\n[B-ROLL: locked off timelapse, lights going down]\nHere's what we're printing: [what you're printing].\nEvery one of these parts goes into a robot a kid will build.\n[B-ROLL: the printers running]\nThe morning.\n[what came out, one honest line, including any failed prints]\nTwelve printers did that while we slept.\nAnd every part is one more kid's robot.", "cta": "What should we print next? Comment it. Waitlist link in bio.", "src": "kubot-builds-scripts.md banked idea 'Twelve printers, one night' (hook reused, new body)", "kind": "adapted", "notes": "", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "Expose", "desc": "Deadpan talking head, about 60s", "has": true, "title": "Exposing random 3D printing company for 1 minute", "s": {"hooks": ["Exposing random 3D printing company for 1 minute", "Exposing 3D printing for 1 minute"], "body": "[Shake the jar. Pull a slip. Read it.]\n\n3D printing.\n\nI don't know a single 3D printing controversy.\n\n[Music hits.]\n\nThose satisfying multicolor prints everyone posts? A figure that weighs a few grams can throw out way more plastic than the figure itself, just switching colors. The community calls that pile poop. Literally.\n\nMost 3D prints are mostly air inside. The default infill on a lot of printers is around 15 percent.\n\nThat 3D printed cup? Layer lines trap bacteria, and most filament isn't certified food safe.\n\nAnd the printer in your bedroom? Studies have found desktop printers release ultrafine particles and chemicals while they print. That's why people put them in enclosures with filters.\n\nI run 12 of these. The poop pile is real.", "cta": "Caption: The bedroom one is crazy to me", "src": "Rewritten Oct 23 from the inspo transcripts", "kind": "new", "notes": "Copies leo.taps \"Exposing random Tech company for 1 minute\" (423K likes). His exact shape: say the subject, the fake-innocent line (\"I don't know a single Tesla controversy\"), then stack the facts fast, heaviest first, each with a source, and stop on the last fact with no wrap-up. Deadpan, no music until the first fact. Check every claim before filming. Film the real purge pile from the print farm as B-roll.", "fillins": "", "format": "Exposing (talking head)", "fmt": "Exposing (talking head)"}, "inspiration": ["https://www.instagram.com/reel/DeyI4DxRiSC/", "https://www.instagram.com/reel/DYBaGViA4as/", "https://www.instagram.com/reel/DYr-bd5zAMW/"], "th": "Exposing random 3D printing company for 1 minute", "ith": "Exposing random Tech company for 1 minute"}, {"time": "", "label": "Hook test", "desc": "On-screen text over B-roll, 6 to 10s", "has": true, "title": "I am 21 and I'm not ashamed to admit that I skipped my third year of college, and some nights I still wonder if I made a mistake.", "th": "I am 21 and I'm not ashamed to admit that I skipped my third year of college, and some nights I still wonder if I made a mistake.", "ith": "I am 29 and I am not ashamed to admit that: (carousel, one honest admission per slide)", "inspiration": ["https://www.instagram.com/reel/DRKG_F5jHmG/"], "s": {"hooks": ["I am 21 and I'm not ashamed to admit that I skipped my third year of college, and some nights I still wonder if I made a mistake."], "body": "[On screen, first line] I am 21 and I'm not ashamed to admit\n\n[Second line] that I skipped my third year of college,\n\n[Third line] and some nights I still wonder if I made a mistake.", "cta": "Caption: Everyone around me finished. I left to open a store. Most days I know it was right. But at 1am, when something breaks, there's a voice asking what I'd be doing if I'd stayed. What I've learned is that the doubt doesn't mean you chose wrong. It just means you chose something that matters.\n\nIf you feel the same, you're not alone.\n\nfollow @denisaverbuk for more real talk", "src": "Hook formats Denis found, written Oct 23", "kind": "new", "notes": "Copies @laurastravl's \"I am 29 and I am not ashamed to admit that:\" post. Hook on screen over a casual shot of you, then the honest admission. The caption tells the full story and what you learned. Don't try to sound perfect; the goal is people thinking \"I feel exactly the same.\" Only post the lines that are true for you. Her setup: one slow, pretty B-roll clip (you looking out, walking, at the desk, the print farm at night), white text centered on screen, an emotional trending song (hers use songs like \"To Build A Home\"). No talking. Pull the clip from the B-roll library.", "fillins": "", "format": "I'm 21 and not ashamed", "fmt": "I'm 21 and not ashamed"}}]}, {"date": "2026-10-28", "dow": "Wed", "kubot": {"format": "Robot on the Street", "title": "Kubot: Robot on the Street", "sub": "Would you rather your kid use robots or build them?", "hook": "Would you rather your kid use robots or build them?", "badge": "", "needs": false, "film": [{"what": "Robot on the Street", "short": "Robot on the Street", "note": "Film today or earlier. Main question: Would you rather your kid use robots or build them?"}], "sections": [["Plan", "rows", [["Series", "Robot on the Street: the robot holds the mic and asks people one short question each."], ["Main question", "Would you rather your kid use robots or build them?"], ["Twist ending", "Gabriel steps in at the end: \"Robots don't teach here. Kids build them.\""], ["Goal", "5 to 6 good answers, a split reaction, then the twist. 30 to 45 seconds."], ["When to film", "Today or earlier."]]], ["Questions", "list", ["Would you let a robot teach your kid?", "Would you rather your kid use robots or build them?", "What should kids learn that school doesn't teach?", "Would your kid rather have an iPad or build a robot?", "Are you scared of AI for your kids?", "What did you build as a kid?", "If a robot could help with one thing at home, what would it be?", "Should kids learn to code or learn to build first?"]], ["Shots", "list", ["Opener: the robot turns to someone, mic up", "Opener line: \"Quick question from a robot. Got 5 seconds?\"", "Each answer: tight on the person, robot mic in frame", "Reactions: people laughing, pointing, filming the robot", "Wide establishing shot of the spot", "Gabriel walking in for the twist, then the line to camera"]], ["Where", "text", "[pick the spot]. Public sidewalks or a park. Ask before filming on private property. Robot at the edge of the walkway, not blocking it."], ["Checklist", "check", ["Pick the spot and time", "Charge the robot and the mic", "Print releases and bring pens", "Quick release from every face used, a parent's for kids", "Never mock anyone's answer", "Get 5 to 6 usable answers", "Film Gabriel's twist line", "Cut to 30 to 45 seconds with subtitles", "No prices, no pitch"]]], "s": {"hooks": ["Would you rather your kid use robots or build them?", "We asked Miami: would you rather your kid use robots or build them?", "A robot asked strangers one question, and the answers get more honest", "People had opinions. Fast.", "Quick question from a robot. Got 5 seconds?"], "body": "ROBOT: Quick question from a robot. Got 5 seconds?\nROBOT: Would you rather your kid use robots or build them?\n[answer 1, word for word]\n[answer 2]\n[answer 3, the one that surprised you]\n[answer 4]\n[answer 5, a kid if there's a signed parent release]\n[B-ROLL: reactions, people filming the robot]\n[the split: who said yes, who said no, in one line]\nGABRIEL (to camera): Robots don't teach here. Kids build them.", "cta": "What would you answer? Comment it. Waitlist link in bio.", "src": "Plan v2 Robot on the Street format + content.py question list (structure reused; answers are real only)", "kind": "adapted", "notes": "Unscripted. Quick release from every face, a parent's for kids. Never mock an answer.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "List", "desc": "Collage list, 30 to 45s", "has": true, "title": "4 Disgustingly Effective Ways To Find Your First Customers", "s": {"hooks": ["4 Disgustingly Effective Ways To Find Your First Customers", "How to find your first customers before you have a product"], "body": "4 disgustingly easy ways to find your first customers.\n\nNumber one, sell it before it exists. Founders call it a smoke test. Start a waitlist before you have walls. If nobody signs up, you just saved yourself a year.\n\nNumber two, do things that don't scale. Paul Graham wrote a whole essay with that title. Your first customers come one at a time. Text people. Show up in person. It's supposed to feel slow.\n\nNumber three, charge from day one. Free users tell you almost nothing. People who pay tell you the truth.\n\nNumber four, let people watch you build. People trust what they've seen being made. Every video I post is the first ad for a store that isn't open yet.\n\nWe ran test classes before the store even existed. That's where the first believers came from.", "cta": "Caption: Which one are you skipping?", "src": "Rewritten Oct 23 from the inspo transcripts", "kind": "new", "notes": "Copies \"4 disgustingly easy ways to find your sound\" (@dennyondabeat, 21.4K and 34.9K): each way is a command, a named psychology term, what to do and a punchline. Also pulls from Caleb Ralston's \"content that gets you customers\" (191K).", "fillins": "", "format": "Collage list", "fmt": "Collage list"}, "inspiration": ["https://www.instagram.com/reel/DZ5KH4_xEaZ/", "https://www.instagram.com/reel/DeNyQlKsF_j/"], "th": "4 Disgustingly Effective Ways To Find Your First Customers", "ith": "4 Disgustingly Effective Ways To Find Your Own Sound As An Artist"}, {"time": "", "label": "Hook test", "desc": "On-screen text over B-roll, 6 to 10s", "has": true, "title": "My co-founder told me about \"kids remember what they make\" and it completely changed the way I think about learning", "th": "My co-founder told me about \"kids remember what they make\" and it completely changed the way I think about learning", "ith": "I recently discovered \"The Empty Boat Theory\"... and it completely changed the way I see people.", "inspiration": ["https://www.instagram.com/reel/DbicgB4sRT4/"], "s": {"hooks": ["My co-founder told me about \"kids remember what they make\" and it completely changed the way I think about learning"], "body": "[On screen, line 1] My co-founder told me about \"kids remember what they make\"...\n\n[Line 2] and it completely changed the way I think about learning.", "cta": "Caption: My co-founder told me something he's seen after teaching kids robotics for over ten years: kids remember what they make, and forget what they watch.\n\nImagine two kids learning how a motor works. One watches a video. One builds a robot that won't move until he figures it out.\n\nA week later, only one of them still knows.\n\nI realized I'm the same. I learned more building one thing than from a semester of lectures. So now if I want to learn something, I stop watching and start building.\n\nfollow @denisaverbuk for more", "src": "Hook formats Denis found, written Oct 23", "kind": "new", "notes": "Copies @laurastravl's \"I recently discovered 'The Empty Boat Theory'... and it completely changed the way I see people\" (81.4K). On screen: just the hook, split in two lines. Caption shape: name the idea, \"Imagine...\" a concrete scene, what most people would do, \"now imagine\" the flip, \"life is often like that\", then what changed for you. Her setup: one slow, pretty B-roll clip (you looking out, walking, at the desk, the print farm at night), white text centered on screen, an emotional trending song (hers use songs like \"To Build A Home\"). No talking. Pull the clip from the B-roll library.", "fillins": "", "format": "The ___ theory", "fmt": "The ___ theory"}}]}, {"date": "2026-10-29", "dow": "Thu", "kubot": {"format": "Why Build", "title": "Kubot: Why Build", "sub": "#18 How to praise a build", "hook": "stop saying good job", "badge": "", "needs": false, "film": [], "sections": [["Plan", "rows", [["Show", "Why Build? with Gabriel. Gabriel to camera, 45 to 75 seconds."], ["Episode", "#18 How to praise a build"], ["Status", "Script ready."]]], ["Inspo", "rows", [["Text hook", "stop saying good job"], ["On screen", "\"praise how they think\" / \"tonight: how did you figure that out?\""], ["Optional real moment", "Only if it's true, in Gabriel's own words, after \"Now watch them.\" Never required."]]], ["Caption", "rows", [["Caption", "\"Good job\" ends the conversation. \"How did you figure that out?\" starts one. Try it tonight and tell me what they said 👇"], ["Spanish line", "No digas \"muy bien.\" Pregunta cómo lo resolvió."]]], ["Shots", "list", ["Gabriel to camera, clean audio", "B-roll: A kid walking a parent through their build (Friday class footage)", "On-screen text: \"praise how they think\" / \"tonight: how did you figure that out?\""]], ["Where", "text", "Studio. Filmed on Sunday studio day."], ["Checklist", "check", ["Film on Sunday studio day", "Cut to 45 to 75 seconds", "Add on-screen text and subtitles", "English caption, Spanish line", "No prices, no pitch", "Post on Kubot", "Reply to comments in the first hour"]]], "s": {"hooks": ["stop saying good job", "Never say \"good job\" to a kid who built something.", "\"Good job\" is where the conversation ends.", "Praise how they think, not what they made.", "Try this instead of \"good job\" tonight."], "body": "Never say \"good job\" to a kid who built something.\nI know.\nIt sounds harsh.\n\"Good job\" is nice.\nIt's also where the conversation ends.\nThey smile.\nYou move on.\nAnd the thinking they just did disappears.\nTry this instead.\n\"How did you figure that out?\"\nNow watch them.\nThe kid who points at every piece.\nThe kid who walks you through the part that broke.\nHere's why it works.\n\"Good job\" praises the robot.\n\"How did you figure that out?\" praises how they think.\nAnd how they think is the part they keep for the next build.\nTonight, skip \"good job.\"\nAsk how they figured it out.\nThen wait.\nWhat does your kid say when you ask?", "cta": "What does your kid say when you ask? Waitlist link in bio.", "src": "why-build-scripts.md #18 (reused as is)", "kind": "reused", "notes": "Gabriel's script, already filmed or filming on Sunday studio day.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "How-to", "desc": "How-to list, 40 to 60s", "has": true, "title": "How To Become Incredibly Good At Building Robots", "s": {"hooks": ["How To Become Incredibly Good At Building Robots", "How to get incredibly good at building robots (and I mean actually good)"], "body": "How to become incredibly good at building robots, and I mean actually good. The kind of builder that can make a pile of parts actually move.\n\nNumber one, start with a kit. When the kit works, every problem after that is one you caused, so you can find it. You're not bad at electronics, you're debugging ten things at once.\n\nNumber two, make one motor spin, then make it react. Sense, think, act. Engineers call it the control loop. A motor plus a sensor is already a robot, from a toy to a humanoid. You're not behind, you're trying to build the humanoid before the motor.\n\nNumber three, print your own parts. Once you can 3D print, you're not stuck with whatever came in the box. Same robot, printed parts, and now it's yours.\n\nEvery great builder does those three, and every one of them had real machines to learn on, which is the part most people my age never get to. That's exactly why I'm opening a store full of them.", "cta": "Comment BUILD and I'll send you the kit I'd start with", "src": "Rewritten Oct 23 from the inspo transcripts", "kind": "new", "notes": "Copies \"How To Become Incredibly Good At Singing\" (195K on @dennyondabeat) line for line: identity line, exactly three tips, each with a real term and a \"you're not bad, you're just...\" reframe, then \"Every great X does those three\" into your CTA.", "fillins": "", "format": "How to become incredibly good", "fmt": "How to become incredibly good"}, "inspiration": ["https://www.instagram.com/reel/Dd78f_Ixoc4/", "https://www.instagram.com/reel/Dewq11ux5RI/", "https://www.instagram.com/reel/DeIuDFPR_db/"], "th": "How To Become Incredibly Good At Building Robots", "ith": "How To Become Incredibly Good At Singing"}, {"time": "", "label": "Hook test", "desc": "On-screen text over B-roll, 6 to 10s", "has": true, "title": "The biggest lesson I've learnt about starting a business is that it's NOT about the idea", "th": "The biggest lesson I've learnt about starting a business is that it's NOT about the idea", "ith": "The older I get, the more I realize that the real luxuries in life aren't things. They're time, health, peace of mind...", "inspiration": ["https://www.instagram.com/reel/DdGe93jsQFv/"], "s": {"hooks": ["The biggest lesson I've learnt about starting a business is that it's NOT about the idea"], "body": "[On screen, all of it]\nThe biggest lesson I've learnt about starting a business is that it's NOT about the idea.\nIt's signing the lease, doing the boring parts every day, fixing what breaks, and showing up after the excitement wears off.", "cta": "Caption: What would you add? Send this to someone who needs to hear it.\n\nfollow @denisaverbuk for more", "src": "Hook formats Denis found, written Oct 23", "kind": "new", "notes": "Copies @laurastravl's \"The older I get, the more I realize that the real luxuries in life aren't things. They're time, health, peace of mind...\" (35.3K). The whole message is on screen: the hook, then \"It's ...\" followed by a list. The caption stays short and asks people to add to the list and share it. Her setup: one slow, pretty B-roll clip (you looking out, walking, at the desk, the print farm at night), white text centered on screen, an emotional trending song (hers use songs like \"To Build A Home\"). No talking. Pull the clip from the B-roll library.", "fillins": "", "format": "Biggest lesson is NOT", "fmt": "Biggest lesson is NOT"}}]}, {"date": "2026-10-30", "dow": "Fri", "kubot": {"format": "Denis Builds", "title": "Kubot: Denis Builds", "sub": "One month until the doors open", "hook": "One month until the doors open", "badge": "Hero shoot 3:30 to 5 PM, Bal Harbour", "needs": false, "film": [{"what": "Kubot class, 3:30 to 5 PM, Bal Harbour", "note": "Hero shoot. Film testimonials and b-roll. Gabriel teaches, Denis films.", "sections": [["Capture list", "list", ["Door: signed parent photo and video release before any face is used", "Wide of the room before kids arrive", "Hands on CyberBricks and 3D printed parts (vertical and horizontal)", "Gabriel teaching: hands, face, parts, kids reacting", "A build failing, then a kid fixing it", "The first time a robot moves, plus the kid's face", "Wide room shots once it's full", "Pickup: a kid showing the build to a parent", "Parent answer at pickup (release-cleared only): \"What did you notice in your kid today?\" Get 2 to 3 clean answers for Saturday"]], ["Rules", "text", "No scripted kid interviews. No prices, no pitch. First names only, no school names. After class, confirm which faces are release-cleared before the edit."]], "short": "Class 3:30 to 5 PM, Bal Harbour"}], "sections": [["Plan", "rows", [["Series", "Denis Builds: Denis on camera, building in public."], ["Episode", "What got done at the store this week, what broke, what's next."], ["When to film", "Any time this week."]]], ["Shots", "list", ["Denis to camera at the store", "B-roll: [what got done]", "Close-up: [one detail]"]], ["Where", "text", "[where you're filming]"], ["Checklist", "check", ["Film during the week", "Cut to 30 to 45 seconds", "No prices, no pitch", "Post on Kubot"]]], "s": {"hooks": ["One month until the doors open", "one month out", "30 days to open a robot store. Here's where we are.", "One month left. Here's what's done.", "The store opens in a month."], "body": "One month until the doors open.\n[B-ROLL: the store today]\nWhat got done: [what got done this week].\nWhat broke: [what broke, one honest line].\nWhat's next: [what's next before December 1st].\n[B-ROLL: one detail close up]\nMost founders only post the wins.\nAnd I think the broken part is the part worth watching.", "cta": "Follow along to see if we get the doors open. Waitlist link in bio.", "src": "Store build update format (content.py, hub posts.json Oct 30) with a new weekly angle", "kind": "adapted", "notes": "Real progress only. No prices, no lease or money details.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "List", "desc": "Collage list, 30 to 45s", "has": true, "title": "5 YouTube Videos That Make You A Disgustingly Good Builder", "s": {"hooks": ["5 YouTube Videos That Make You A Disgustingly Good Builder", "5 videos that make you disgustingly good with your hands"], "body": "5 YouTube videos that make you a disgustingly good builder.\n\nNumber 1, Mark Rober's TED talk, The Super Mario Effect. Why people who treat failure like a game learn way faster. Start here.\n\nNumber 2, Simone Giertz, Why you should make useless things. Her robots fail on purpose, and that's the point. For anyone scared their first build will be bad.\n\nNumber 3, Adam Savage's One Day Builds. Watch a pro think out loud with his hands. You'll start seeing every object as something you could make.\n\nNumber 4, Any Stuff Made Here video. He picks a ridiculous problem and engineers his way out of it, failures included. Pick the one that sounds the most impossible.\n\nNumber 5, Richard Feynman, The Pleasure of Finding Things Out. It's not about physics, it's about why curiosity is the whole job.\n\nYour feed can scroll you into nothing, or it can teach you more than a semester of engineering school. But none of them build it for you.", "cta": "Comment BUILD and I'll send you all 5 links", "src": "Rewritten Oct 23 from the inspo transcripts", "kind": "new", "notes": "Copies \"5 YouTube videos that make you a disgustingly good musician\" (137K on @dennyondabeat): exact video titles, who each one is for, then \"your feed can scroll you into nothing\" before the CTA. Put each video's thumbnail on screen as you say it. Check every title before filming.", "fillins": "", "format": "Collage list", "fmt": "Collage list"}, "inspiration": ["https://www.instagram.com/reel/DeN7BrIRzTb/", "https://www.instagram.com/reel/DeNyQlKsF_j/", "https://www.instagram.com/reel/DdmJNQJp81s/"], "th": "5 YouTube Videos That Make You A Disgustingly Good Builder", "ith": "5 Youtube Videos That Make You Disgustingly Good Musician"}, {"time": "", "label": "Hook test", "desc": "On-screen text over B-roll, 6 to 10s", "has": true, "title": "I am 21 and I'm not ashamed to admit that we were supposed to open on Halloween. We're not even close.", "th": "I am 21 and I'm not ashamed to admit that we were supposed to open on Halloween. We're not even close.", "ith": "I am 29 and I am not ashamed to admit that: (carousel, one honest admission per slide)", "inspiration": ["https://www.instagram.com/reel/DRKG_F5jHmG/"], "s": {"hooks": ["I am 21 and I'm not ashamed to admit that we were supposed to open on Halloween. We're not even close."], "body": "[On screen, first line] I am 21 and I'm not ashamed to admit\n\n[Second line] that we were supposed to open on Halloween.\n\n[Third line] We're not even close.", "cta": "Caption: The plan was Halloween. Tomorrow. Instead we moved it to December 1. I hated saying that out loud, because I'd already told everyone. But opening a store that isn't ready would've been worse than opening late. Missing a date isn't failing. Pretending you didn't is.\n\nIf you feel the same, you're not alone.\n\nfollow @denisaverbuk for more real talk", "src": "Hook formats Denis found, written Oct 23", "kind": "new", "notes": "Copies @laurastravl's \"I am 29 and I am not ashamed to admit that:\" post. Hook on screen over a casual shot of you, then the honest admission. The caption tells the full story and what you learned. Don't try to sound perfect; the goal is people thinking \"I feel exactly the same.\" Only post the lines that are true for you. Her setup: one slow, pretty B-roll clip (you looking out, walking, at the desk, the print farm at night), white text centered on screen, an emotional trending song (hers use songs like \"To Build A Home\"). No talking. Pull the clip from the B-roll library.", "fillins": "", "format": "I'm 21 and not ashamed", "fmt": "I'm 21 and not ashamed"}}]}, {"date": "2026-10-31", "dow": "Sat", "kubot": {"format": "Testimonial", "title": "Kubot: Testimonial", "sub": "From Fri Oct 30 class", "hook": "I asked a [mom or dad] what changed in [her or his] [son or daughter]", "badge": "", "needs": false, "film": [], "sections": [["Plan", "rows", [["Series", "Testimonial: a kid at pickup showing their parent what they built, then one honest sentence from the parent. Unscripted, never staged."], ["Source", "Footage from the Fri Oct 30 class (Bal Harbour)."], ["Hook options", "\"Watch [his or her] face when [he or she] shows [mom or dad]\" or \"I asked a [mom or dad] what changed in [her or his] [son or daughter]\". Use the real kid and parent."], ["Who", "[parent first name] and [kid first name]. First names only."], ["Goal", "One honest answer a parent watching can relate to. 25 to 35 seconds."]]], ["Questions", "list", ["What did you notice in your kid today?", "What did [kid] tell you about the build on the way out?", "What is something [kid] built that surprised you?", "How does [kid] talk about building now?", "In one sentence, what did building give [kid]?"]], ["Shots", "list", ["Kid running up with the build", "Kid explaining it to the parent", "Parent's face as the robot moves", "The parent's one sentence", "Close-up of the build in the kid's hands"]], ["Where", "text", "Bal Harbour class footage from Friday."], ["Checklist", "check", ["Pick the pickup moment from Friday's footage", "Confirm the signed release for kid and parent", "First names only, no school names", "Cut to 25 to 35 seconds with subtitles", "No prices, no pitch", "Post on Kubot"]]], "s": {"hooks": ["I asked a [mom or dad] what changed in [her or his] [son or daughter]", "One question at pickup.", "They walked in with a pile of parts.", "No script. Just pickup.", "Watch [his or her] face when the robot moves."], "body": "[B-ROLL: kid running up to the parent with the build]\nKID: [what the kid says about the build, word for word]\n[B-ROLL: the robot moving, the parent's face]\nPARENT (answering \"What did you notice in your kid today?\"): [the parent's answer, word for word]\n[B-ROLL: close up of the build in the kid's hands]\nON-SCREEN: [parent's first name] and [kid's first name], after the Fri Oct 30 class.", "cta": "What did your kid build first? Comment it. Or send us their drawing.", "src": "Plan v2 Real Families + kubot-details.json hook options + hub posts.json pickup posts (structure reused; words are real only)", "kind": "adapted", "notes": "Never staged or scripted. Signed release for kid and parent, first names only, no schools.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "Robot", "desc": "Robot plus people reacting, 30 to 60s", "has": true, "title": "I took a humanoid robot trick or treating", "s": {"hooks": ["I took a humanoid robot trick or treating", "The best Halloween costume in Miami wasn't a costume"], "body": "[Robot walks up to a door or a group in costume.]\n\nROBOT: Trick or treat. I would like your best candy.\n\n[Their reaction, word for word]\n\nROBOT: I'm not wearing a costume. Do you want to have a duel? Whoever gets more candy on this street wins.\n\n[They accept or don't]\n\n[Robot vs them, house by house. Keep a candy count on screen.]\n\nROBOT: [the final count]. Proof that robots handle Halloween as easily as humans.", "cta": "Caption: Who's winning next year?", "src": "Rewritten Oct 23 from the inspo transcripts", "kind": "new", "notes": "Copies Robert the Robot's \"robot vs dog trainer\" duel: the robot challenges someone, they accept, the robot attempts it with a running commentary, then a one-line verdict. Needs a robot on camera. Ask before filming anyone, and a parent's OK for any kid.", "fillins": "", "format": "Robot reaction", "fmt": "Robot reaction"}, "inspiration": ["https://www.instagram.com/reel/DbqupC5OwYb/", "https://www.instagram.com/reel/DbWSEgch-Ge/", "https://www.instagram.com/reel/DeDFS9BSzgE/"], "th": "I took a humanoid robot trick or treating", "ith": "The smartest student at Stanford"}, {"time": "", "label": "Hook test", "desc": "On-screen text over B-roll, 6 to 10s", "has": true, "title": "My favorite creator told me about the \"Eye of Sauron\" and it completely changed the way I post online", "th": "My favorite creator told me about the \"Eye of Sauron\" and it completely changed the way I post online", "ith": "I recently discovered \"The Empty Boat Theory\"... and it completely changed the way I see people.", "inspiration": ["https://www.instagram.com/reel/DbicgB4sRT4/"], "s": {"hooks": ["My favorite creator told me about the \"Eye of Sauron\" and it completely changed the way I post online"], "body": "[On screen, line 1] My favorite creator told me about the \"Eye of Sauron\"...\n\n[Line 2] and it completely changed the way I post online.", "cta": "Caption: My favorite creator, Caleb Ralston, talks about something he calls the Eye of Sauron.\n\nImagine trying to light a fire with a flashlight. Now imagine the same light through a magnifying glass.\n\nSame energy. Totally different result.\n\nPosting is often like that. I used to post the same thing everywhere and hope something hit. Now all my energy goes to one platform at a time, and everything else waits. My best months came from focus, not from being everywhere.\n\nfollow @denisaverbuk for more", "src": "Hook formats Denis found, written Oct 23", "kind": "new", "notes": "Copies @laurastravl's \"I recently discovered 'The Empty Boat Theory'... and it completely changed the way I see people\" (81.4K). On screen: just the hook, split in two lines. Caption shape: name the idea, \"Imagine...\" a concrete scene, what most people would do, \"now imagine\" the flip, \"life is often like that\", then what changed for you. Her setup: one slow, pretty B-roll clip (you looking out, walking, at the desk, the print farm at night), white text centered on screen, an emotional trending song (hers use songs like \"To Build A Home\"). No talking. Pull the clip from the B-roll library.", "fillins": "", "format": "The ___ theory", "fmt": "The ___ theory"}}]}, {"date": "2026-11-01", "dow": "Sun", "kubot": {"format": "Podcast", "title": "Kubot: Podcast", "sub": "Ep. 3: The best parent questions from the comments", "hook": "Parents asked. Gabriel answered.", "badge": "Studio day", "needs": false, "film": [{"what": "Why Build #1 Problem solving", "short": "Why Build #1", "note": "Posts Mon Nov 2.", "ref": "2026-11-02"}, {"what": "Why Build #4 Fine motor skills", "short": "Why Build #4", "note": "Posts Thu Nov 5.", "ref": "2026-11-05"}, {"what": "Podcast ep. 4", "short": "Podcast ep. 4", "note": "Posts Sun Nov 8.", "ref": "2026-11-08"}], "sections": [["Plan", "rows", [["Episode", "Podcast ep. 3. Full episode on YouTube and Spotify, plus one clip on Kubot."], ["Filmed", "Last Sunday's studio day."]]], ["Inspo", "rows", [["Show", "Founders podcast: weekly build in public episode, 30 to 45 minutes, Denis and Gabriel hosting. Cut into 5 to 8 short clips."], ["This episode", "[topic to pick]. Idea: the best comments and parent questions from the week."]]], ["Shape", "text", "1. Cold open (1 to 2 min): Denis sets up [topic].\n2. Main conversation (15 to 20 min): [topic], with real classroom moments, not slogans.\n3. Week in the build (3 to 5 min): what got done at the store, what broke, what's next.\n4. Kid of the week (optional): a Friday kid explains their robot, with a parent on mic. Only if release-cleared.\n5. What to try tonight (5 min): one tip for parents.\n6. Close (2 min): tease next week."], ["Questions", "list", ["[the best parent question from this week's comments]", "[the second best parent question]", "What broke this week, and what's next before the store opens?", "If a parent has 20 minutes tonight, what should they try?"]], ["Shots", "list", ["Wide two-shot, plus a single on each host", "Print farm and robots visible behind", "Clip targets: one Gabriel line that stands alone, one parent tip for tonight"]], ["Where", "text", "Studio. Audio: the podcast mics, test recording first."], ["Checklist", "check", ["Upload the full episode to YouTube and Spotify", "Cut one clip for Kubot", "Mark 5 to 8 clips for later", "No prices, no pitch", "Reply to comments in the first hour"]]], "s": {"hooks": ["Parents asked. Gabriel answered.", "Your questions, answered by someone who's taught kids for 10 years", "The question parents ask the most", "We read every comment. Here are the best questions.", "Gabriel answers the comments"], "body": "DENIS (cold open): Every week parents leave questions under our videos. So this week, Gabriel answers them.\nDENIS: First one. [the best parent question from the comments]\nGABRIEL: [his answer]\nDENIS: [the second best question]\nGABRIEL: [his answer]\nDENIS: Store update. [what got done, what broke, what's next]\nCLIP FOR KUBOT: [the best answer, under 45 seconds]", "cta": "Full episode on YouTube and Spotify. What should we ask Gabriel next? Waitlist link in bio.", "src": "Plan v2 podcast segments + parent questions (new episode plan)", "kind": "new", "notes": "Gabriel's answers are his, unscripted. Only the cold open and questions are written.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "Story", "desc": "Talking to camera in the car, 45 to 60s", "has": true, "title": "Let me reintroduce myself", "s": {"hooks": ["Let me reintroduce myself", "Hi, I'm Denis. You probably know me from the wrong videos."], "body": "Hi, I'm Denis, and you may know me as the guy who made the 10/10 male rules videos. Well, allow me to reintroduce myself.\n\n[When you started posting], I started making videos, and I promised myself [the real promise].\n\nFast forward to now, after 20 million views, a CNBC feature, and a lot of videos that flopped, I've realized this journey has only just begun.\n\nOne thing about me is I'm delusionally ambitious. I'm 21, I skipped my third year of college, and I'm opening the world's first humanoid robot store in Miami on December 1.\n\nAnd I'm filming every single day of it. So if you want to watch a 21 year old try to pull this off, follow me.\n\nAlso, if this is your first video on this page, welcome.", "cta": "Caption: Follow to see if we open on time", "src": "Rewritten Oct 23 from the inspo transcripts", "kind": "new", "notes": "Copies Robert McKeaveney's \"Let me reintroduce myself\" (844K): \"you may know me as the guy who...\", \"allow me to reintroduce myself\", what you promised yourself, \"fast forward to now\", \"one thing about me is I'm delusionally ambitious\", follow. One take in the car.", "fillins": "", "format": "Reintroduce myself (car)", "fmt": "Reintroduce myself (car)"}, "inspiration": ["https://www.instagram.com/reel/DcRyvjiz8au/"], "th": "Let me reintroduce myself", "ith": "None on screen. He opens talking in the car (\"hi I'm Robert\") with subtitles only."}, {"time": "", "label": "Hook test", "desc": "On-screen text over B-roll, 6 to 10s", "has": true, "title": "The biggest lesson I've learnt about being 21 is that it's NOT about having it figured out", "th": "The biggest lesson I've learnt about being 21 is that it's NOT about having it figured out", "ith": "The older I get, the more I realize that the real luxuries in life aren't things. They're time, health, peace of mind...", "inspiration": ["https://www.instagram.com/reel/DdGe93jsQFv/"], "s": {"hooks": ["The biggest lesson I've learnt about being 21 is that it's NOT about having it figured out"], "body": "[On screen, all of it]\nThe biggest lesson I've learnt about being 21 is that it's NOT about having it figured out.\nIt's starting before you feel ready, learning in public, asking for help, and being okay with not knowing yet.", "cta": "Caption: What would you add? Send this to someone who needs to hear it.\n\nfollow @denisaverbuk for more", "src": "Hook formats Denis found, written Oct 23", "kind": "new", "notes": "Copies @laurastravl's \"The older I get, the more I realize that the real luxuries in life aren't things. They're time, health, peace of mind...\" (35.3K). The whole message is on screen: the hook, then \"It's ...\" followed by a list. The caption stays short and asks people to add to the list and share it. Her setup: one slow, pretty B-roll clip (you looking out, walking, at the desk, the print farm at night), white text centered on screen, an emotional trending song (hers use songs like \"To Build A Home\"). No talking. Pull the clip from the B-roll library.", "fillins": "", "format": "Biggest lesson is NOT", "fmt": "Biggest lesson is NOT"}}]}, {"date": "2026-11-02", "dow": "Mon", "kubot": {"format": "Why Build", "title": "Kubot: Why Build", "sub": "#1 Problem solving", "hook": "Kids who build think differently. Here's how", "badge": "", "needs": false, "film": [], "sections": [["Plan", "rows", [["Show", "Why Build? with Gabriel. Gabriel to camera, 45 to 75 seconds."], ["Episode", "#1 Problem solving"], ["Status", "Script drafted below. Gabriel to review before filming."]]], ["Inspo", "rows", [["Development point", "Problem solving"], ["Hook", "Kids who build think differently. Here's how"], ["Do this tonight", "When they ask for help, ask \"what have you tried?\" first"]]], ["Shots", "list", ["Gabriel to camera, clean audi
