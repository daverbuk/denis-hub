*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:17px;line-height:1.35;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left}

.note{color:var(--sub);font-size:15px;padding:12px 4px 0}

.day{min-width:0;scroll-margin-top:140px}

.card{position:relative;background:var(--card);border-radius:12px;min-height:118px;display:flex;border:1px solid transparent;box-shadow:0 .5px 0 rgba(0,0,0,.04)}

.copen{flex:1;min-width:0;display:flex;flex-direction:column;align-items:stretch;padding:10px 12px 10px;border-radius:12px}
.copen:active{background:var(--fill)}
.lab{font-size:11px;color:var(--sub);display:flex;align-items:center;gap:5px;padding-right:30px;min-height:22px;text-transform:uppercase;letter-spacing:.2px;font-weight:600}
.lab span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;background:var(--dot-p)}
.dot.k{background:var(--accent)}
.lab.k{color:var(--accent)}
.ttl{font-size:15px;line-height:1.3;font-weight:500;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.card.needs .ttl{color:var(--sub);font-weight:400}
.foot{margin-top:auto;padding-top:6px;font-size:13px;color:var(--sub);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.foot .fm{min-width:0;overflow-wrap:anywhere}
.foot .tm::after{content:" \00b7"}
.pill{font-size:11px;border:1px solid var(--sep);border-radius:6px;padding:1px 6px;color:var(--sub)}
.card.done .ttl{color:var(--sub);text-decoration:line-through;text-decoration-color:var(--sub)}
.check{position:absolute;top:0;right:0;width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:12px}
.check i{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--sub);display:block;position:relative;transition:background .15s}
.check[aria-checked="true"] i{background:var(--accent);border-color:var(--accent)}
.check[aria-checked="true"] i::after{content:"";position:absolute;left:7px;top:3.5px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.plan{margin-top:20px;background:var(--card);border-radius:12px;padding:14px 16px;color:var(--sub);font-size:14px}
.plan b{color:var(--text);font-weight:600}
@media (min-width:640px) and (max-width:979px){ .cards{grid-template-columns:repeat(4,minmax(0,1fr))} }
@media (min-width:980px){
  .week{grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}

  .card{min-height:112px}
}
/* month */
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--sep);border-radius:12px;overflow:hidden;margin-top:12px;border:.5px solid var(--sep)}
.mh{background:var(--card);font-size:12px;color:var(--sub);text-align:center;padding:8px 0;text-transform:uppercase;letter-spacing:.3px}
.mc{background:var(--card);min-height:64px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.mc.out{background:var(--bg)}
.mc .n{font-size:15px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.mc.off .n{color:var(--sub);opacity:.5}
.mc.today .n{background:var(--accent);color:#fff;font-weight:600}
.mc .ds{display:flex;gap:3px}
.mc .ds i{width:6px;height:6px;border-radius:50%;border:1.2px solid var(--dot-p);display:block}
.mc .ds i.k{border-color:var(--accent)}
.mc .ds i.on{background:var(--accent);border-color:var(--accent)}
.mc .fr{font-size:10px;color:var(--sub);line-height:1}
button.mc:active{background:var(--fill)}
@media (min-width:980px){ .mc{min-height:96px} .mc .ds i{width:8px;height:8px} .mc .fr{font-size:12px} }
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--sub);font-size:13px;padding:10px 4px}

.section-h{color:var(--sub);font-size:13px;text-transform:uppercase;letter-spacing:.3px;padding:18px 16px 6px}
.group{background:var(--card);border-radius:10px;overflow:hidden}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s;z-index:10}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:680px;max-height:92vh;max-height:92dvh;background:var(--bg);border-radius:12px 12px 0 0;transform:translateY(105%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s linear .3s;z-index:11;display:flex;flex-direction:column;box-shadow:0 -2px 20px rgba(0,0,0,.15)}
.sheet.on{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--sep);margin:6px auto 0}

.kv{padding:10px 16px;position:relative}

udio day."], ["Checklist", "check", ["Film on Sunday studio day", "Cut to 45 to 75 seconds", "Add on-screen text and subtitles", "English caption, Spanish line", "No prices, no pitch", "Post on Kubot", "Reply to comments in the first hour"]]], "s": {"hooks": ["5 years teaching kids, and the best learners do one weird thing.", "After 5 years teaching kids, this is what actually works.", "Your kid isn't bad at learning. They're just watching instead of making", "The kid who takes your remote apart is going to be fine", "After 5 years teaching kids, I'd take hands-on over screens every time"], "body": "It's not the smartest kid in the room.\nIt's not the best app.\nHonestly, it's not the educational videos either.\nIt's the kid with the parts in their hands.\nThe kid who takes things apart to see what's inside.\nThe kid who wants to try before you finish explaining.\nHere's why.\nWhen a kid watches something, someone else did the thinking.\nWhen a kid makes something, they did every step themselves.\nThey picked the piece.\nThey got it wrong.\nThey fixed it.\nSo it sticks.\nKids remember what they make.\nThey forget what they watch.", "cta": "So tonight, swap one video for one thing they make.\nCardboard. Blocks. A broken toy.\nWhat's the first thing your kid ever built?", "src": "Denis's script, Oct 22", "kind": "new", "notes": "", "fillins": "", "format": ""}, "inspiration": ["https://youtube.com/shorts/HGbSB4LI9Ww?si=wxm-Xjf9xAqfJFXi"]}, "personal": []}, {"date": "2026-10-20", "dow": "Tue", "kubot": {"format": "Denis Builds", "title": "Kubot: Denis Builds", "sub": "Tank, part 2", "hook": "I let a kid review my tank", "badge": "", "needs": false, "film": [], "sections": [["Plan", "rows", [["Series", "Denis Builds: Denis on camera, building in public."], ["Episode", "More of the CyberBricks 3D printed tank. Hook and shot only. Pick an option after part 1 is filmed."], ["When to film", "Any time before it posts."]]], ["Inspo", "rows", [["Option A (lead)", "\"I let a kid review my tank\""], ["Option B", "\"Upgrading the tank\""]]], ["Shots", "list", ["Option A: the kid's first drive, one take", "Option A: the kid's score to camera, parent nearby", "Option B: printing and fitting [UPGRADE], then the rematch test", "Denis reaction"]], ["Where", "text", "[where you build]"], ["Checklist", "check", ["Pick option A or B", "Signed parent release if a kid is on camera, first name only", "Cut the Short", "No prices, no pitch", "Post on Kubot"]]], "s": {"hooks": ["I let a kid review my tank", "I let a kid review my tank, and the questions get increasingly more honest", "A kid drove my tank for the first time. Here's the score.", "Kids are the harshest reviewers.", "I built it. A kid judged it."], "body": "I let a kid review my 3D printed tank, and the questions get increasingly more honest.\n[kid's first name] has never driven it.\n[B-ROLL: the tank on the table, the kid walking up]\nQuestion one.\n\"Does it look cool?\"\n[the kid's answer, word for word]\nQuestion two.\n\"Drive it.\"\n[what happened on the first drive, one honest line]\nQuestion three.\n\"What would you change?\"\n[the kid's answer]\nQuestion four.\n\"Score out of 10?\"\n[the score]\nAnd honestly, that's a better review than I gave it.\nWhat should I print next?", "cta": "What should I print next? Let your kid answer. Waitlist link in bio.", "src": "kubot-builds-scripts.md Ep. 2 option A + the Ep. 1 escalating test format (adapted)", "kind": "adapted", "notes": "Signed parent release, first name only, no schools. If you go with option B (upgrade), use the Nov 10 script instead.", "fillins": "", "format": ""}, "inspiration": []}, "personal": []}, {"date": "2026-10-21", "dow": "Wed", "kubot": {"format": "Robot on the Street", "title": "Kubot: Robot on the Street", "sub": "Are you scared of AI for your kids?", "hook": "Are you scared of AI for your kids?", "badge": "", "needs": false, "film": [{"what": "Robot on the Street", "short": "Robot on the Street", "note": "Film today or earlier. Main question: Are you scared of AI for your kids?"}], "sections": [["Plan", "rows", [["Series", "Robot on the Street: the robot holds the mic and asks people one short question each."], ["Main question", "Are you scared of AI for your kids?"], ["Twist ending", "Gabriel steps in at the end: \"Robots don't teach here. Kids build them.\""], ["Goal", "5 to 6 good answers, a split reaction, then the twist. 30 to 45 seconds."], ["When to film", "Today or earlier."]]], ["Questions", "list", ["Would you let a robot teach your kid?", "Would you rather your kid use robots or build them?", "What should kids learn that school doesn't teach?", "Would your kid rather have an iPad or build a robot?", "Are you scared of AI for your kids?", "What did you build as a kid?", "If a robot could help with one thing at home, what would it be?", "Should kids learn to code or learn to build first?"]], ["Shots", "list", ["Opener: the robot turns to someone, mic up", "Opener line: \"Quick question from a robot. Got 5 seconds?\"", "Each answer: tight on the person, robot mic in frame", "Reactions: people laughing, pointing, filming the robot", "Wide establishing shot of the spot", "Gabriel walking in for the twist, then the line to camera"]], ["Where", "text", "[pick the spot]. Public sidewalks or a park. Ask before filming on private property. Robot at the edge of the walkway, not blocking it."], ["Checklist", "check", ["Pick the spot and time", "Charge the robot and the mic", "Print releases and bring pens", "Quick release from every face used, a parent's for kids", "Never mock anyone's answer", "Get 5 to 6 usable answers", "Film Gabriel's twist line", "Cut to 30 to 45 seconds with subtitles", "No prices, no pitch"]]], "s": {"hooks": ["Are you scared of AI for your kids?", "We asked Miami: are you scared of ai for your kids?", "A robot asked strangers one question, and the answers get more honest", "People had opinions. Fast.", "Quick question from a robot. Got 5 seconds?"], "body": "ROBOT: Quick question from a robot. Got 5 seconds?\nROBOT: Are you scared of AI for your kids?\n[answer 1, word for word]\n[answer 2]\n[answer 3, the one that surprised you]\n[answer 4]\n[answer 5, a kid if there's a signed parent release]\n[B-ROLL: reactions, people filming the robot]\n[the split: who said yes, who said no, in one line]\nGABRIEL (to camera): Robots don't teach here. Kids build them.", "cta": "What would you answer? Comment it. Waitlist link in bio.", "src": "Plan v2 Robot on the Street format + content.py question list (structure reused; answers are real only)", "kind": "adapted", "notes": "Unscripted. Quick release from every face, a parent's for kids. Never mock an answer.", "fillins": "", "format": ""}, "inspiration": []}, "personal": []}, {"date": "2026-10-22", "dow": "Thu", "kubot": {"format": "Why Build", "title": "Kubot: Why Build", "sub": "#6 Confidence", "hook": "the shy kid changes", "badge": "", "needs": false, "film": [], "sections": [["Plan", "rows", [["Show", "Why Build? with Gabriel. Gabriel to camera, 45 to 75 seconds."], ["Episode", "#6 Confidence"], ["Status", "Script ready."]]], ["Inspo", "rows", [["Text hook", "the shy kid changes"], ["On screen", "\"the robot takes the spotlight\" / \"tonight: let them teach you\""], ["Optional real moment", "Only if it's true, in Gabriel's own words, after \"And someone asks how it works.\" Never required."]]], ["Caption", "rows", [["Caption", "Telling a shy kid to speak up almost never works. Asking how their robot works does. When they explain what they made, the spotlight is on the robot, not on them. What could your kid explain for an hour? 👇"], ["Spanish line", "He visto a niños tímidos cambiar en una hora."]]], ["Shots", "list", ["Gabriel to camera, clean audio", "B-roll: A kid explaining their robot to camera (Friday class footage)", "On-screen text: \"the robot takes the spotlight\" / \"tonight: let them teach you\""]], ["Where", "text", "Studio. Filmed on Sunday studio day."], ["Checklist", "check", ["Film on Sunday studio day", "Cut to 45 to 75 seconds", "Add on-screen text and subtitles", "English caption, Spanish line", "No prices, no pitch", "Post on Kubot", "Reply to comments in the first hour"]]], "s": {"hooks": ["the shy kid changes", "I've watched shy kids change in one hour.", "Telling a shy kid to speak up almost never works.", "The robot takes the spotlight off them.", "What could your kid explain for an hour?"], "body": "I've watched shy kids change in one hour.\nNot because someone told them to speak up.\nHonestly, telling a shy kid to speak up almost never works.\nThe kid who hides behind mom at drop off.\nThe kid who won't say their name in the circle.\nThen they finish a robot.\nAnd someone asks how it works.\nHere's the thing.\nThey're not talking about themselves anymore.\nThey're talking about the thing they made.\nThat's easier.\nThe robot takes the spotlight off them.\nAnd nobody in the room knows that robot better than they do.\nEvery time they explain it, it gets a little easier.\nThat's confidence.\nIt comes from knowing something, not from being told to be brave.\nTonight, ask your kid to teach you how they made something.\nAnything.\nThen follow their steps exactly.\nWhat could your kid explain for an hour?", "cta": "What could your kid explain for an hour? Waitlist link in bio.", "src": "why-build-scripts.md #6 (reused as is)", "kind": "reused", "notes": "Gabriel's script, already filmed or filming on Sunday studio day.", "fillins": "", "format": ""}, "inspiration": []}, "personal": []}, {"date": "2026-10-23", "dow": "Fri", "kubot": {"format": "Denis Builds", "title": "Kubot: Denis Builds", "sub": "The empty room", "hook": "This empty room becomes something kids beg for", "badge": "Hero shoot 3:30 to 5 PM, Bal Harbour", "needs": false, "film": [{"what": "Kubot class, 3:30 to 5 PM, Bal Harbour", "note": "Hero shoot. Film testimonials and b-roll. Gabriel teaches, Denis films.", "sections": [["Capture list", "list", ["Door: signed parent photo and video release before any face is used", "Wide of the room before kids arrive", "Hands on CyberBricks and 3D printed parts (vertical and horizontal)", "Gabriel teaching: hands, face, parts, kids reacting", "A build failing, then a kid fixing it", "The first time a robot moves, plus the kid's face", "Wide room shots once it's full", "Pickup: a kid showing the build to a parent", "Parent answer at pickup (release-cleared only): \"What did you notice in your kid today?\" Get 2 to 3 clean answers for Saturday"]], ["Rules", "text", "No scripted kid interviews. No prices, no pitch. First names only, no school names. After class, confirm which faces are release-cleared before the edit."]], "short": "Class 3:30 to 5 PM, Bal Harbour"}], "sections": [["Plan", "rows", [["Series", "Denis Builds: Denis on camera, building in public."], ["Episode", "Store countdown walkthrough. Hook and shot only."], ["When to film", "Any time before it posts."]]], ["Inspo", "rows", [["Hook", "This empty room becomes something kids beg for"]]], ["Shots", "list", ["The empty room, wide", "Walkthrough, one take, Denis talking", "Details: [what's already in]"]], ["Where", "text", "[the space you're filming]"], ["Checklist", "check", ["Film the walkthrough", "Cut to 30 to 45 seconds", "No prices, no pitch", "Post on Kubot"]]], "s": {"hooks": ["This empty room becomes something kids beg for", "Right now it's an empty room.", "Nobody claps for the empty room.", "Here's what goes where.", "Give it a few weeks. Watch this room."], "body": "This empty room becomes something kids beg for.\n[B-ROLL: the empty room, wide]\nRight now it's [what the room looks like today, one honest line].\nOver here: [what goes here, in your own words].\nOver here: [what goes here].\n[B-ROLL: walkthrough, one take]\nWhat's left before December 1st: [what's left to do].\nAnd in a few weeks, this is where a kid builds their first robot.", "cta": "What would you put in here? Comment it. Waitlist link in bio.", "src": "kubot-builds-scripts.md banked idea + hub posts.json Oct 23 (hook reused, body adapted)", "kind": "adapted", "notes": "", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "Expose", "desc": "Deadpan talking head, about 60s", "has": true, "title": "Exposing random robotics company for 1 minute", "s": {"hooks": ["Exposing random robot companies for 1 minute", "Exposing random robot company for 1 minute", "Exposing humanoid robots for 1 minute", "Nobody tells you who's really controlling the robot"], "body": "[Shake a clear jar of folded paper slips. Pull one out and read it. Deadpan.]\n\nHumanoid robots.\n\nI don't know a single thing wrong with them.\n\n[Music hits. Cut in tighter.]\n\nTesla's robots spent a whole launch night pouring drinks and chatting with guests. Bloomberg reported employees stationed somewhere else were remote controlling a lot of those conversations. One of the bartender robots literally admitted it was being assisted by a human.\n\nThere's a home robot you can preorder right now, and when it can't figure out a chore, a company employee puts on a VR headset, takes over during a time you schedule, and sees inside your house through its cameras. When the Wall Street Journal tested it, they didn't see it do a single thing on its own.\n\nRemember the viral video of a robot folding a shirt? People spotted the operator's hand slipping into the frame.\n\nThen they posted a video of the robots working on their own. Look at the tiny text in the corner. Two to ten times speed.\n\nAnd the robot going viral for flirting with girls on the street? Reporters found a guy nearby controlling its moves and what it says.", "cta": "Caption: The VR headset thing is crazy to me", "src": "Scripts written Oct 22 from the creator research", "kind": "new", "notes": "Your version of @leo.taps' \"Exposing random Tech company for 1 minute\" (160K likes), beat for beat: shake the jar of slips, pull one and read the name (that is what makes \"random\" believable and sets up a series), the fake-innocent line, the heaviest fact first with a named source, the most shocking beat in the middle (the caption teases it, like his group chat line), then a rapid stack that ends with no wrap-up. Talk fast and keep a straight face the whole time. Every claim was checked against Bloomberg, WSJ, Gizmodo and Austin reporting. Don't name the robot or printer brands you buy from. Be ready for \"what about your robot?\" comments if your robot is remote controlled.", "fillins": "", "format": "Exposing (talking head)", "fmt": "Exposing (talking head)"}, "inspiration": ["https://www.instagram.com/reel/DeyI4DxRiSC/", "https://www.instagram.com/reel/DYBaGViA4as/", "https://www.instagram.com/reel/DYr-bd5zAMW/"], "th": "Exposing random robotics company for 1 minute", "ith": "Exposing random Tech company for 1 minute"}]}, {"date": "2026-10-24", "dow": "Sat", "kubot": {"format": "Testimonial", "title": "Kubot: Testimonial", "sub": "From Fri Oct 23 class", "hook": "Watch [his or her] face when [he or she] shows [mom or dad]", "badge": "", "needs": false, "film": [], "sections": [["Plan", "rows", [["Series", "Testimonial: a kid at pickup showing their parent what they built, then one honest sentence from the parent. Unscripted, never staged."], ["Source", "Footage from the Fri Oct 23 class (Bal Harbour)."], ["Hook options", "\"Watch [his or her] face when [he or she] shows [mom or dad]\" or \"I asked a [mom or dad] what changed in [her or his] [son or daughter]\". Use the real kid and parent."], ["Who", "[parent first name] and [kid first name]. First names only."], ["Goal", "One honest answer a parent watching can relate to. 25 to 35 seconds."]]], ["Questions", "list", ["What did you notice in your kid today?", "What did [kid] tell you about the build on the way out?", "What is something [kid] built that surprised you?", "How does [kid] talk about building now?", "In one sentence, what did building give [kid]?"]], ["Shots", "list", ["Kid running up with the build", "Kid explaining it to the parent", "Parent's face as the robot moves", "The parent's one sentence", "Close-up of the build in the kid's hands"]], ["Where", "text", "Bal Harbour class footage from Friday."], ["Checklist", "check", ["Pick the pickup moment from Friday's footage", "Confirm the signed release for kid and parent", "First names only, no school names", "Cut to 25 to 35 seconds with subtitles", "No prices, no pitch", "Post on Kubot"]]], "s": {"hooks": ["Watch [his or her] face when [he or she] shows [mom or dad]", "This is what a Friday class looks like.", "Pieces in. Robot out.", "What did you notice in your kid today?", "One parent. One answer at pickup."], "body": "[B-ROLL: kid running up to the parent with the build]\nKID: [what the kid says about the build, word for word]\n[B-ROLL: the robot moving, the parent's face]\nPARENT (answering \"What did you notice in your kid today?\"): [the parent's answer, word for word]\n[B-ROLL: close up of the build in the kid's hands]\nON-SCREEN: [parent's first name] and [kid's first name], after the Fri Oct 23 class.", "cta": "What did your kid build first? Comment it. Or send us their drawing.", "src": "Plan v2 Real Families + kubot-details.json hook options + hub posts.json pickup posts (structure reused; words are real only)", "kind": "adapted", "notes": "Never staged or scripted. Signed release for kid and parent, first names only, no schools.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "POV", "desc": "Mostly visual, 20 to 35s", "has": true, "title": "POV: 12 3D printers are working while I sleep", "s": {"hooks": ["POV: 12 3D printers are working while I sleep", "POV: 12 printers work the night shift", "I leave at 8. They don't."], "body": "I leave the warehouse at 8. They don't.\n\n[Overnight timelapse]\n\nBy the morning, every plate is full.\n\n[Morning reveal: walking in, pulling parts off the beds]\n\nAll of this is going on the shelves of a store that doesn't exist yet.", "cta": "Caption: Comment what I should print tonight", "src": "Scripts written Oct 22 from the creator research", "kind": "new", "notes": "Same structure as Mino Lee's \"POV: Claude is editing 7 reels while I sleep\" (293K). Start the timelapse when you leave tonight. The comments become next Wednesday's print.", "fillins": "", "format": "POV, mostly visual", "fmt": "POV, mostly visual"}, "inspiration": ["https://www.instagram.com/reel/DegXneUNOip/", "https://www.instagram.com/reel/DejCX63y2LM/"], "th": "POV: 12 3D printers are working while I sleep", "ith": "POV: Claude is editing 7 REELS while i sleep (idek how to code)"}]}, {"date": "2026-10-25", "dow": "Sun", "kubot": {"format": "Podcast", "title": "Kubot: Podcast", "sub": "Ep. 2: Street answers", "hook": "We asked Miami if they'd let a robot teach their kid", "badge": "Studio day", "needs": false, "film": [{"what": "Why Build #12 Ready for an AI future", "short": "Why Build #12", "note": "Posts Mon Oct 26.", "ref": "2026-10-26"}, {"what": "Why Build #18 How to praise a build", "short": "Why Build #18", "note": "Posts Thu Oct 29.", "ref": "2026-10-29"}, {"what": "Podcast ep. 3", "short": "Podcast ep. 3", "note": "Posts Sun Nov 1.", "ref": "2026-11-01"}], "sections": [["Plan", "rows", [["Episode", "Podcast ep. 2. Full episode on YouTube and Spotify, plus one clip on Kubot."], ["Filmed", "Last Sunday's studio day."]]], ["Inspo", "rows", [["Show", "Founders podcast: weekly build in public episode, 30 to 45 minutes, Denis and Gabriel hosting. Cut into 5 to 8 short clips."], ["This episode", "We asked Miami if they'd let a robot teach their kid. React to the best Robot on the Street answers."]]], ["Shape", "text", "1. Cold open (1 to 2 min): Denis sets up the street question.\n2. Street answers (15 to 20 min): play the best clips, Gabriel reacts to each.\n3. Week in the build (3 to 5 min): what got done at the store, what broke, what's next.\n4. Kid of the week (optional): a Friday kid explains their robot, with a parent on mic. Only if release-cleared.\n5. What to try tonight (5 min): one tip for parents.\n6. Close (2 min): tease next week."], ["Questions", "list", ["Which street answer surprised you most? [play the clip]", "Would you let a robot teach your kid? Why or why not?", "What's the difference between a kid using a robot and building one?", "What are parents scared of with AI, and what do you tell them?", "What happens in a kid's head the first time their robot moves?", "If a parent is worried about screens, what can they try tonight?", "What broke this week, and what's next before the store opens?"]], ["Shots", "list", ["Wide two-shot, plus a single on each host", "Print farm and robots visible behind", "Clip targets: one Gabriel line that stands alone, one parent tip for tonight"]], ["Where", "text", "Studio. Audio: the podcast mics, test recording first."], ["Checklist", "check", ["Upload the full episode to YouTube and Spotify", "Cut one clip for Kubot", "Mark 5 to 8 clips for later", "No prices, no pitch", "Reply to comments in the first hour"]]], "s": {"hooks": ["We asked Miami if they'd let a robot teach their kid", "Gabriel reacts to the best street answers", "The answer that got Gabriel", "Robots don't teach here. Kids build them.", "Would you let a robot teach your kid?"], "body": "DENIS (cold open): We put a robot on the street and asked Miami one question. Would you let a robot teach your kid?\nDENIS: Gabriel has taught kids robotics for over 10 years. So I made him watch every answer.\n[CLIP: the best street answer]\nGABRIEL: [his reaction]\nDENIS: Most people said [the most common answer]. Gabriel, what do you tell those parents?\nGABRIEL: [his answer]\nCLIP FOR KUBOT: [the one Gabriel line that stands alone]", "cta": "Full episode on YouTube and Spotify. What should we ask Gabriel next? Waitlist link in bio.", "src": "content.py podcast ep. 2 (reused)", "kind": "reused", "notes": "Gabriel's answers are his, unscripted. Only the cold open and questions are written.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "List", "desc": "Collage list, 30 to 45s", "has": true, "title": "5 YouTube Videos That Make You A Disgustingly Good Founder", "s": {"hooks": ["5 YouTube Videos That Make You A Disgustingly Good Founder", "5 videos that make you a disgustingly good founder", "Watch these 5 before you start anything"], "body": "One. Steve Jobs, 1994. The clip where he says everything around you was made by people no smarter than you. Ninety seconds. Watch it before you start anything.\n\nTwo. Jeff Bezos explaining the regret minimization framework. How he decided to quit a great job. Picture yourself at 80.\n\nThree. Y Combinator's How to Start a Startup, lecture one, with Sam Altman. The whole course is free.\n\nFour. Y Combinator's How to Get Your First Customers. Spoiler: you go get them by hand.\n\nFive. Steve Jobs at Stanford. The connecting the dots part. Watch it when you feel behind.\n\n[Your real closing line, e.g. which one you rewatch most]", "cta": "Caption: Comment FOUNDER and I'll send you all 5 links", "src": "Scripts written Oct 22 from the creator research", "kind": "new", "notes": "Collage style like \"5 YouTube Videos That Make You Disgustingly Good Musician\" (137K): a thumbnail of each video around you. Set up an auto-DM for the FOUNDER keyword. The closing line is a fill-in; only say you watched them all before signing the lease if that's true.", "fillins": "", "format": "Collage list", "fmt": "Collage list"}, "inspiration": ["https://www.instagram.com/reel/DeN7BrIRzTb/", "https://www.instagram.com/reel/DdmJNQJp81s/"], "th": "5 YouTube Videos That Make You A Disgustingly Good Founder", "ith": "5 Youtube Videos That Make You Disgustingly Good Musician"}]}, {"date": "2026-10-26", "dow": "Mon", "kubot": {"format": "Why Build", "title": "Kubot: Why Build", "sub": "#12 Ready for an AI future", "hook": "AI can't do this", "badge": "", "needs": false, "film": [], "sections": [["Plan", "rows", [["Show", "Why Build? with Gabriel. Gabriel to camera, 45 to 75 seconds."], ["Episode", "#12 Ready for an AI future"], ["Status", "Script ready."]]], ["Inspo", "rows", [["Text hook", "AI can't do this"], ["On screen", "\"guess, test, try again\" / \"tonight: how does that work?\""], ["Optional real moment", "Only if it's true, in Gabriel's own words, after \"Every build runs on that loop.\" Never required."]]], ["Caption", "rows", [["Caption", "AI can write the answer. It can't care enough to try the next wire. Guess, test, try again. That's the skill. Dads, this is the stuff we wished we had as kids. What does your kid always want to take apart? 👇"], ["Spanish line", "La habilidad que la IA no puede reemplazar: descubrir por qué algo no funciona."]]], ["Shots", "list", ["Gabriel to camera, clean audio", "B-roll: A kid checking wires and testing again (Friday class footage)", "On-screen text: \"guess, test, try again\" / \"tonight: how does that work?\""]], ["Where", "text", "Studio. Filmed on Sunday studio day."], ["Checklist", "check", ["Film on Sunday studio day", "Cut to 45 to 75 seconds", "Add on-screen text and subtitles", "English caption, Spanish line", "No prices, no pitch", "Post on Kubot", "Reply to comments in the first hour"]]], "s": {"hooks": ["AI can't do this", "There's one skill AI can't replace in your kid.", "Guess. Test. Wrong. Try again.", "It's not being good with screens.", "What does your kid always want to take apart?"], "body": "There's one skill AI can't replace in your kid.\nAnd it's not being good with screens.\nIt's figuring out why something doesn't work.\nAI can write the answer.\nIt can't stand at the table with a wire in the wrong spot, and care enough to try again.\nThe kid who wants to see inside.\nThe kid who opens it up instead of asking for a new one.\nHonestly, it's the stuff a lot of us wished we had as kids.\nHere's the skill.\nGuess. Test. Wrong. Try again.\nEvery build runs on that loop.\nThe motor doesn't spin, so they check the wire.\nStill nothing, so they check the battery.\nThat loop is how builders think, and kids can start it young.\nTonight, point at one thing in your house.\nThe toaster. The car window.\nAsk, \"how do you think that works?\"\nLet them be wrong.\nWhat does your kid always want to take apart?", "cta": "What does your kid always want to take apart? Waitlist link in bio.", "src": "why-build-scripts.md #12 (reused as is)", "kind": "reused", "notes": "Gabriel's script, already filmed or filming on Sunday studio day.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "How-to", "desc": "How-to list, 40 to 60s", "has": true, "title": "How To Become Incredibly Good At 3D Printing", "s": {"hooks": ["How To Become Incredibly Good At 3D Printing", "How to get incredibly good at 3D printing (and I mean actually good)", "How to get disgustingly good at 3D printing"], "body": "Step one. Don't design anything yet. Print other people's models. MakerWorld and Printables have thousands of free files. Twenty prints will teach you more than twenty tutorials.\n\nStep two. Learn three settings: layer height, infill and supports. That's most of what decides if a print works.\n\nStep three. Dry your filament. Half of \"my printer is broken\" is just wet plastic.\n\nStep four. Fail on purpose. Print something that breaks, then figure out why.\n\nStep five. Start designing. Tinkercad first. Move to Fusion when it starts feeling easy.\n\nStep six. Print something you actually use. A phone stand. A hook. A part that fixes something in your room. That's when it clicks.\n\nI run 12 of these now. It gets disgustingly addictive.", "cta": "Caption: Comment PRINT and I'll send you the first file I'd start with", "src": "Scripts written Oct 22 from the creator research", "kind": "new", "notes": "Same format as \"How To Become Incredibly Good At Singing\" (193K on @dennyondabeat). B-roll: print farm, close-ups of layers, a failed print, a finished useful part.", "fillins": "", "format": "How to become incredibly good", "fmt": "How to become incredibly good"}, "inspiration": ["https://www.instagram.com/reel/Dd78f_Ixoc4/", "https://www.instagram.com/reel/Dewq11ux5RI/", "https://www.instagram.com/reel/DeIuDFPR_db/"], "th": "How To Become Incredibly Good At 3D Printing", "ith": "How To Become Incredibly Good At Singing"}]}, {"date": "2026-10-27", "dow": "Tue", "kubot": {"format": "Denis Builds", "title": "Kubot: Denis Builds", "sub": "Twelve printers, one night", "hook": "Twelve printers, one night", "badge": "", "needs": false, "film": [], "sections": [["Plan", "rows", [["Series", "Denis Builds: Denis on camera, building in public."], ["Episode", "Overnight print farm timelapse. Hook and shot only."], ["When to film", "Set up the timelapse the night before it posts."]]], ["Inspo", "rows", [["Hook", "Twelve printers, one night"]]], ["Shots", "list", ["Locked-off timelapse of the print farm overnight", "Morning: parts coming off the beds", "Close-up of [the best print]"]], ["Where", "text", "[where the print farm is set up]"], ["Checklist", "check", ["Set up the timelapse", "Cut to 15 to 30 seconds", "No prices, no pitch", "Post on Kubot"]]], "s": {"hooks": ["Twelve printers, one night", "We left 12 printers running overnight. Here's what came out.", "This is what a night at our print farm looks like.", "Hundreds of parts, one night.", "Our printers worked the night shift."], "body": "Twelve printers.\nOne night.\n[B-ROLL: locked off timelapse, lights going down]\nHere's what we're printing: [what you're printing].\nEvery one of these parts goes into a robot a kid will build.\n[B-ROLL: the printers running]\nThe morning.\n[what came out, one honest line, including any failed prints]\nTwelve printers did that while we slept.\nAnd every part is one more kid's robot.", "cta": "What should we print next? Comment it. Waitlist link in bio.", "src": "kubot-builds-scripts.md banked idea 'Twelve printers, one night' (hook reused, new body)", "kind": "adapted", "notes": "", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "Expose", "desc": "Deadpan talking head, about 60s", "has": true, "title": "Exposing random 3D printing company for 1 minute", "s": {"hooks": ["Exposing the 3D printing world for 1 minute", "Exposing 3D printing for 1 minute (part 2)", "The pile of plastic nobody shows you"], "body": "Those satisfying multicolor prints everyone posts? A figure that weighs a few grams can throw out tens of grams of plastic just switching colors.\n\nThat pile next to the printer has an official name. The community calls it poop.\n\nMost 3D prints are mostly air inside. The default fill is usually around 15 to 20 percent.\n\nAnd that 3D printed cup? Layer lines trap bacteria. Most prints aren't food safe.\n\nI run 12 of these printers. The poop pile is real.", "cta": "Caption: Which one surprised you?", "src": "Scripts written Oct 22 from the creator research", "kind": "new", "notes": "Post after the robot one gets comments asking for part 2. Film the real purge pile from the print farm as B-roll.", "fillins": "", "format": "Exposing (talking head)", "fmt": "Exposing (talking head)"}, "inspiration": ["https://www.instagram.com/reel/DeyI4DxRiSC/", "https://www.instagram.com/reel/DYBaGViA4as/", "https://www.instagram.com/reel/DYr-bd5zAMW/"], "th": "Exposing random 3D printing company for 1 minute", "ith": "Exposing random Tech company for 1 minute"}]}, {"date": "2026-10-28", "dow": "Wed", "kubot": {"format": "Robot on the Street", "title": "Kubot: Robot on the Street", "sub": "Would you rather your kid use robots or build them?", "hook": "Would you rather your kid use robots or build them?", "badge": "", "needs": false, "film": [{"what": "Robot on the Street", "short": "Robot on the Street", "note": "Film today or earlier. Main question: Would you rather your kid use robots or build them?"}], "sections": [["Plan", "rows", [["Series", "Robot on the Street: the robot holds the mic and asks people one short question each."], ["Main question", "Would you rather your kid use robots or build them?"], ["Twist ending", "Gabriel steps in at the end: \"Robots don't teach here. Kids build them.\""], ["Goal", "5 to 6 good answers, a split reaction, then the twist. 30 to 45 seconds."], ["When to film", "Today or earlier."]]], ["Questions", "list", ["Would you let a robot teach your kid?", "Would you rather your kid use robots or build them?", "What should kids learn that school doesn't teach?", "Would your kid rather have an iPad or build a robot?", "Are you scared of AI for your kids?", "What did you build as a kid?", "If a robot could help with one thing at home, what would it be?", "Should kids learn to code or learn to build first?"]], ["Shots", "list", ["Opener: the robot turns to someone, mic up", "Opener line: \"Quick question from a robot. Got 5 seconds?\"", "Each answer: tight on the person, robot mic in frame", "Reactions: people laughing, pointing, filming the robot", "Wide establishing shot of the spot", "Gabriel walking in for the twist, then the line to camera"]], ["Where", "text", "[pick the spot]. Public sidewalks or a park. Ask before filming on private property. Robot at the edge of the walkway, not blocking it."], ["Checklist", "check", ["Pick the spot and time", "Charge the robot and the mic", "Print releases and bring pens", "Quick release from every face used, a parent's for kids", "Never mock anyone's answer", "Get 5 to 6 usable answers", "Film Gabriel's twist line", "Cut to 30 to 45 seconds with subtitles", "No prices, no pitch"]]], "s": {"hooks": ["Would you rather your kid use robots or build them?", "We asked Miami: would you rather your kid use robots or build them?", "A robot asked strangers one question, and the answers get more honest", "People had opinions. Fast.", "Quick question from a robot. Got 5 seconds?"], "body": "ROBOT: Quick question from a robot. Got 5 seconds?\nROBOT: Would you rather your kid use robots or build them?\n[answer 1, word for word]\n[answer 2]\n[answer 3, the one that surprised you]\n[answer 4]\n[answer 5, a kid if there's a signed parent release]\n[B-ROLL: reactions, people filming the robot]\n[the split: who said yes, who said no, in one line]\nGABRIEL (to camera): Robots don't teach here. Kids build them.", "cta": "What would you answer? Comment it. Waitlist link in bio.", "src": "Plan v2 Robot on the Street format + content.py question list (structure reused; answers are real only)", "kind": "adapted", "notes": "Unscripted. Quick release from every face, a parent's for kids. Never mock an answer.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "List", "desc": "Collage list, 30 to 45s", "has": true, "title": "4 Disgustingly Effective Ways To Find Your First Customers", "s": {"hooks": ["4 Disgustingly Effective Ways To Find Your First Customers", "How to find your first customers before you have a product", "Nobody tells you where first customers actually come from"], "body": "One. Sell it before it exists. Start a waitlist before you have walls. If nobody signs up, you just saved yourself a year.\n\nTwo. Do things that don't scale. Your first customers come one at a time. Text people you know. Show up in person. It's supposed to feel slow.\n\nThree. Charge from day one. Free users tell you almost nothing. People who pay tell you the truth.\n\nFour. Let people watch you build. Every video I post is the first ad for a store that isn't open yet.\n\nWe ran test classes before the store even existed. That's where the first believers came from.", "cta": "Caption: Which one are you skipping?", "src": "Scripts written Oct 22 from the creator research", "kind": "new", "notes": "Points two and three come from YC's \"How to Get Your First Customers\" talk (Gustaf Alstromer). B-roll: empty store, warehouse, you on the phone, the waitlist sign-up screen.", "fillins": "", "format": "Collage list", "fmt": "Collage list"}, "inspiration": ["https://www.instagram.com/reel/DZ5KH4_xEaZ/", "https://www.instagram.com/reel/DeNyQlKsF_j/"], "th": "4 Disgustingly Effective Ways To Find Your First Customers", "ith": "4 Disgustingly Effective Ways To Find Your Own Sound As An Artist"}]}, {"date": "2026-10-29", "dow": "Thu", "kubot": {"format": "Why Build", "title": "Kubot: Why Build", "sub": "#18 How to praise a build", "hook": "stop saying good job", "badge": "", "needs": false, "film": [], "sections": [["Plan", "rows", [["Show", "Why Build? with Gabriel. Gabriel to camera, 45 to 75 seconds."], ["Episode", "#18 How to praise a build"], ["Status", "Script ready."]]], ["Inspo", "rows", [["Text hook", "stop saying good job"], ["On screen", "\"praise how they think\" / \"tonight: how did you figure that out?\""], ["Optional real moment", "Only if it's true, in Gabriel's own words, after \"Now watch them.\" Never required."]]], ["Caption", "rows", [["Caption", "\"Good job\" ends the conversation. \"How did you figure that out?\" starts one. Try it tonight and tell me what they said 👇"], ["Spanish line", "No digas \"muy bien.\" Pregunta cómo lo resolvió."]]], ["Shots", "list", ["Gabriel to camera, clean audio", "B-roll: A kid walking a parent through their build (Friday class footage)", "On-screen text: \"praise how they think\" / \"tonight: how did you figure that out?\""]], ["Where", "text", "Studio. Filmed on Sunday studio day."], ["Checklist", "check", ["Film on Sunday studio day", "Cut to 45 to 75 seconds", "Add on-screen text and subtitles", "English caption, Spanish line", "No prices, no pitch", "Post on Kubot", "Reply to comments in the first hour"]]], "s": {"hooks": ["stop saying good job", "Never say \"good job\" to a kid who built something.", "\"Good job\" is where the conversation ends.", "Praise how they think, not what they made.", "Try this instead of \"good job\" tonight."], "body": "Never say \"good job\" to a kid who built something.\nI know.\nIt sounds harsh.\n\"Good job\" is nice.\nIt's also where the conversation ends.\nThey smile.\nYou move on.\nAnd the thinking they just did disappears.\nTry this instead.\n\"How did you figure that out?\"\nNow watch them.\nThe kid who points at every piece.\nThe kid who walks you through the part that broke.\nHere's why it works.\n\"Good job\" praises the robot.\n\"How did you figure that out?\" praises how they think.\nAnd how they think is the part they keep for the next build.\nTonight, skip \"good job.\"\nAsk how they figured it out.\nThen wait.\nWhat does your kid say when you ask?", "cta": "What does your kid say when you ask? Waitlist link in bio.", "src": "why-build-scripts.md #18 (reused as is)", "kind": "reused", "notes": "Gabriel's script, already filmed or filming on Sunday studio day.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "How-to", "desc": "How-to list, 40 to 60s", "has": true, "title": "How To Become Incredibly Good At Building Robots", "s": {"hooks": ["How To Become Incredibly Good At Building Robots", "How to get incredibly good at building robots (and I mean actually good)", "You don't need an engineering degree to build robots"], "body": "You don't need an engineering degree. You need to build in the right order.\n\nOne. Start with a kit. Something that tells you exactly where every part goes. You're learning how the pieces talk to each other.\n\nTwo. Get an Arduino. Make one motor spin. Then make it spin when a sensor sees something. Congrats, that's a robot.\n\nThree. Learn to 3D print your own parts. Now you're not stuck with whatever came in the box.\n\nFour. Learn basic Python. A lot of robotics code is written in it.\n\nFive. Copy a build you saw online, piece by piece. Then change one thing.\n\nSix. Find people who build. A club, a competition, a Discord. You'll learn faster in a week than alone in a month.\n\nI'm opening a store full of humanoid robots, and I'm still learning every one of these.", "cta": "Caption: Which step are you on?", "src": "Scripts written Oct 22 from the creator research", "kind": "new", "notes": "B-roll: hands assembling parts, a motor spinning, printed parts coming off the bed, the robots.", "fillins": "", "format": "How to become incredibly good", "fmt": "How to become incredibly good"}, "inspiration": ["https://www.instagram.com/reel/Dd78f_Ixoc4/", "https://www.instagram.com/reel/Dewq11ux5RI/", "https://www.instagram.com/reel/DeIuDFPR_db/"], "th": "How To Become Incredibly Good At Building Robots", "ith": "How To Become Incredibly Good At Singing"}]}, {"date": "2026-10-30", "dow": "Fri", "kubot": {"format": "Denis Builds", "title": "Kubot: Denis Builds", "sub": "One month until the doors open", "hook": "One month until the doors open", "badge": "Hero shoot 3:30 to 5 PM, Bal Harbour", "needs": false, "film": [{"what": "Kubot class, 3:30 to 5 PM, Bal Harbour", "note": "Hero shoot. Film testimonials and b-roll. Gabriel teaches, Denis films.", "sections": [["Capture list", "list", ["Door: signed parent photo and video release before any face is used", "Wide of the room before kids arrive", "Hands on CyberBricks and 3D printed parts (vertical and horizontal)", "Gabriel teaching: hands, face, parts, kids reacting", "A build failing, then a kid fixing it", "The first time a robot moves, plus the kid's face", "Wide room shots once it's full", "Pickup: a kid showing the build to a parent", "Parent answer at pickup (release-cleared only): \"What did you notice in your kid today?\" Get 2 to 3 clean answers for Saturday"]], ["Rules", "text", "No scripted kid interviews. No prices, no pitch. First names only, no school names. After class, confirm which faces are release-cleared before the edit."]], "short": "Class 3:30 to 5 PM, Bal Harbour"}], "sections": [["Plan", "rows", [["Series", "Denis Builds: Denis on camera, building in public."], ["Episode", "What got done at the store this week, what broke, what's next."], ["When to film", "Any time this week."]]], ["Shots", "list", ["Denis to camera at the store", "B-roll: [what got done]", "Close-up: [one detail]"]], ["Where", "text", "[where you're filming]"], ["Checklist", "check", ["Film during the week", "Cut to 30 to 45 seconds", "No prices, no pitch", "Post on Kubot"]]], "s": {"hooks": ["One month until the doors open", "one month out", "30 days to open a robot store. Here's where we are.", "One month left. Here's what's done.", "The store opens in a month."], "body": "One month until the doors open.\n[B-ROLL: the store today]\nWhat got done: [what got done this week].\nWhat broke: [what broke, one honest line].\nWhat's next: [what's next before December 1st].\n[B-ROLL: one detail close up]\nMost founders only post the wins.\nAnd I think the broken part is the part worth watching.", "cta": "Follow along to see if we get the doors open. Waitlist link in bio.", "src": "Store build update format (content.py, hub posts.json Oct 30) with a new weekly angle", "kind": "adapted", "notes": "Real progress only. No prices, no lease or money details.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "List", "desc": "Collage list, 30 to 45s", "has": false, "title": "5 YouTube Videos That Make You A Disgustingly Good Builder", "s": {"fmt": "Collage list"}, "sections": [["Idea", "rows", [["On-screen hook", "5 YouTube Videos That Make You A Disgustingly Good Builder"], ["Other hooks to test", "5 videos that make you disgustingly good with your hands"], ["Why it works", "Promise plus a number. Lists built the account, and the \"disgustingly good\" framing did 137K on @dennyondabeat."], ["Notes", "Pick real, findable videos and check every title before filming."]]]], "inspiration": ["https://www.instagram.com/reel/DeN7BrIRzTb/", "https://www.instagram.com/reel/DeNyQlKsF_j/", "https://www.instagram.com/reel/DdmJNQJp81s/"], "th": "5 YouTube Videos That Make You A Disgustingly Good Builder", "ith": "5 Youtube Videos That Make You Disgustingly Good Musician"}]}, {"date": "2026-10-31", "dow": "Sat", "kubot": {"format": "Testimonial", "title": "Kubot: Testimonial", "sub": "From Fri Oct 30 class", "hook": "I asked a [mom or dad] what changed in [her or his] [son or daughter]", "badge": "", "needs": false, "film": [], "sections": [["Plan", "rows", [["Series", "Testimonial: a kid at pickup showing their parent what they built, then one honest sentence from the parent. Unscripted, never staged."], ["Source", "Footage from the Fri Oct 30 class (Bal Harbour)."], ["Hook options", "\"Watch [his or her] face when [he or she] shows [mom or dad]\" or \"I asked a [mom or dad] what changed in [her or his] [son or daughter]\". Use the real kid and parent."], ["Who", "[parent first name] and [kid first name]. First names only."], ["Goal", "One honest answer a parent watching can relate to. 25 to 35 seconds."]]], ["Questions", "list", ["What did you notice in your kid today?", "What did [kid] tell you about the build on the way out?", "What is something [kid] built that surprised you?", "How does [kid] talk about building now?", "In one sentence, what did building give [kid]?"]], ["Shots", "list", ["Kid running up with the build", "Kid explaining it to the parent", "Parent's face as the robot moves", "The parent's one sentence", "Close-up of the build in the kid's hands"]], ["Where", "text", "Bal Harbour class footage from Friday."], ["Checklist", "check", ["Pick the pickup moment from Friday's footage", "Confirm the signed release for kid and parent", "First names only, no school names", "Cut to 25 to 35 seconds with subtitles", "No prices, no pitch", "Post on Kubot"]]], "s": {"hooks": ["I asked a [mom or dad] what changed in [her or his] [son or daughter]", "One question at pickup.", "They walked in with a pile of parts.", "No script. Just pickup.", "Watch [his or her] face when the robot moves."], "body": "[B-ROLL: kid running up to the parent with the build]\nKID: [what the kid says about the build, word for word]\n[B-ROLL: the robot moving, the parent's face]\nPARENT (answering \"What did you notice in your kid today?\"): [the parent's answer, word for word]\n[B-ROLL: close up of the build in the kid's hands]\nON-SCREEN: [parent's first name] and [kid's first name], after the Fri Oct 30 class.", "cta": "What did your kid build first? Comment it. Or send us their drawing.", "src": "Plan v2 Real Families + kubot-details.json hook options + hub posts.json pickup posts (structure reused; words are real only)", "kind": "adapted", "notes": "Never staged or scripted. Signed release for kid and parent, first names only, no schools.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "Robot", "desc": "Robot plus people reacting, 30 to 60s", "has": false, "title": "I took a humanoid robot trick or treating", "s": {"fmt": "Robot reaction"}, "sections": [["Idea", "rows", [["On-screen hook", "I took a humanoid robot trick or treating"], ["Other hooks to test", "The best Halloween costume in Miami wasn't a costume"], ["Why it works", "Robert the Robot's biggest reels (3.2M to 9.2M) put the person's reaction in the hook, not the robot."], ["Notes", "Needs a robot on camera. Use the borrowed robot (ask first) or your own units once they land. Swap in another idea if neither is available. Can share a shoot with the Kubot street video, but this one talks to people your age."]]]], "inspiration": ["https://www.instagram.com/reel/DbqupC5OwYb/", "https://www.instagram.com/reel/DbWSEgch-Ge/", "https://www.instagram.com/reel/DeDFS9BSzgE/"], "th": "I took a humanoid robot trick or treating", "ith": "The smartest student at Stanford"}]}, {"date": "2026-11-01", "dow": "Sun", "kubot": {"format": "Podcast", "title": "Kubot: Podcast", "sub": "Ep. 3: The best parent questions from the comments", "hook": "Parents asked. Gabriel answered.", "badge": "Studio day", "needs": false, "film": [{"what": "Why Build #1 Problem solving", "short": "Why Build #1", "note": "Posts Mon Nov 2.", "ref": "2026-11-02"}, {"what": "Why Build #4 Fine motor skills", "short": "Why Build #4", "note": "Posts Thu Nov 5.", "ref": "2026-11-05"}, {"what": "Podcast ep. 4", "short": "Podcast ep. 4", "note": "Posts Sun Nov 8.", "ref": "2026-11-08"}], "sections": [["Plan", "rows", [["Episode", "Podcast ep. 3. Full episode on YouTube and Spotify, plus one clip on Kubot."], ["Filmed", "Last Sunday's studio day."]]], ["Inspo", "rows", [["Show", "Founders podcast: weekly build in public episode, 30 to 45 minutes, Denis and Gabriel hosting. Cut into 5 to 8 short clips."], ["This episode", "[topic to pick]. Idea: the best comments and parent questions from the week."]]], ["Shape", "text", "1. Cold open (1 to 2 min): Denis sets up [topic].\n2. Main conversation (15 to 20 min): [topic], with real classroom moments, not slogans.\n3. Week in the build (3 to 5 min): what got done at the store, what broke, what's next.\n4. Kid of the week (optional): a Friday kid explains their robot, with a parent on mic. Only if release-cleared.\n5. What to try tonight (5 min): one tip for parents.\n6. Close (2 min): tease next week."], ["Questions", "list", ["[the best parent question from this week's comments]", "[the second best parent question]", "What broke this week, and what's next before the store opens?", "If a parent has 20 minutes tonight, what should they try?"]], ["Shots", "list", ["Wide two-shot, plus a single on each host", "Print farm and robots visible behind", "Clip targets: one Gabriel line that stands alone, one parent tip for tonight"]], ["Where", "text", "Studio. Audio: the podcast mics, test recording first."], ["Checklist", "check", ["Upload the full episode to YouTube and Spotify", "Cut one clip for Kubot", "Mark 5 to 8 clips for later", "No prices, no pitch", "Reply to comments in the first hour"]]], "s": {"hooks": ["Parents asked. Gabriel answered.", "Your questions, answered by someone who's taught kids for 10 years", "The question parents ask the most", "We read every comment. Here are the best questions.", "Gabriel answers the comments"], "body": "DENIS (cold open): Every week parents leave questions under our videos. So this week, Gabriel answers them.\nDENIS: First one. [the best parent question from the comments]\nGABRIEL: [his answer]\nDENIS: [the second best question]\nGABRIEL: [his answer]\nDENIS: Store update. [what got done, what broke, what's next]\nCLIP FOR KUBOT: [the best answer, under 45 seconds]", "cta": "Full episode on YouTube and Spotify. What should we ask Gabriel next? Waitlist link in bio.", "src": "Plan v2 podcast segments + parent questions (new episode plan)", "kind": "new", "notes": "Gabriel's answers are his, unscripted. Only the cold open and questions are written.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "Story", "desc": "Talking to camera in the car, 45 to 60s", "has": true, "title": "Let me reintroduce myself", "s": {"hooks": ["Let me reintroduce myself", "Hi, I'm Denis. You probably know me from the wrong videos.", "Nobody my age does what I'm about to do"], "body": "Hi, I'm Denis. Let me reintroduce myself.\n\nI'm 21. I grew up in Vaughan, Ontario.\n\nAt 19, I was CSO of a startup that raised money and got written up in Yahoo Finance.\n\nThen I started making videos. 20 million views later, CNBC tagged me in one.\n\nTwo years into college, I left.\n\nNot to build an app. To build a store.\n\nIn a mall in Miami, we're building the world's first humanoid robot store. Robots, 3D printers, all of it.\n\nWe open December 1.\n\nAnd I'm filming every single day of it.\n\nSo if you want to watch a 21 year old try to pull this off, now you know who I am.", "cta": "Caption: Follow to see if we open on time", "src": "Scripts written Oct 22 from the creator research", "kind": "new", "notes": "Robert McKeaveney's \"Let me reintroduce myself\" (844K) format: one take in the car, no B-roll needed. Perfect for this account right now, because most followers came for the old list videos. Double-check the CSO line matches how you describe that role.", "fillins": "", "format": "Reintroduce myself (car)", "fmt": "Reintroduce myself (car)"}, "inspiration": ["https://www.instagram.com/reel/DcRyvjiz8au/"], "th": "Let me reintroduce myself", "ith": "None on screen. He opens talking in the car (\"hi I'm Robert\") with subtitles only."}]}, {"date": "2026-11-02", "dow": "Mon", "kubot": {"format": "Why Build", "title": "Kubot: Why Build", "sub": "#1 Problem solving", "hook": "Kids who build think differently. Here's how", "badge": "", "needs": false, "film": [], "sections": [["Plan", "rows", [["Show", "Why Build? with Gabriel. Gabriel to camera, 45 to 75 seconds."], ["Episode", "#1 Problem solving"], ["Status", "Script drafted below. Gabriel to review before filming."]]], ["Inspo", "rows", [["Development point", "Problem solving"], ["Hook", "Kids who build think differently. Here's how"], ["Do this tonight", "When they ask for help, ask \"what have you tried?\" first"]]], ["Shots", "list", ["Gabriel to camera, clean audio", "B-roll: [Friday class moment that shows the point]", "On-screen text: [hook] / [tonight tip]"]], ["Where", "text", "Studio. Filmed on Sunday studio day."], ["Checklist", "check", ["Review the script with Gabriel", "Film on Sunday studio day", "Cut to 45 to 75 seconds", "Add on-screen text and subtitles", "No prices, no pitch", "Post on Kubot"]]], "s": {"hooks": ["Kids who build think differently. Here's how", "kids who build think differently", "The question I ask before I help any kid", "\"What have you tried?\" changes everything.", "Your kid doesn't need the answer. They need this question."], "body": "Kids who build think differently.\nHere's how.\nMost kids, when something goes wrong, look for an adult.\nThat's normal.\nHonestly, it's also the moment we usually take away the best part.\nThe kid who stares at the robot.\nThe kid who flips it over.\nThe kid who checks one wire, then the next.\nThat's problem solving.\nNot a worksheet.\nA loop.\nWhat's wrong? What could it be? Let me check.\nEvery build makes them run that loop again.\nAnd the more they run it, the faster they get.\nSo tonight, when they ask for help, ask one question first.\n\"What have you tried?\"\nThen listen.\nWhat did your kid say?", "cta": "Tonight: when they ask for help, ask \"what have you tried?\" first. Tell me what they said in the comments. Waitlist link in bio.", "src": "Plan v2 Why Build bank #1 (Problem solving): hook and tonight tip reused, new body", "kind": "new", "notes": "New body written from the plan v2 episode bank hook and 'do this tonight'. Concept-led, so no story from Gabriel is needed. Gabriel should adjust any line that isn't how he'd say it.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "Countdown", "desc": "Stakes update with a deadline, 30 to 45s", "has": false, "title": "29 days to open the world's first humanoid robot store", "s": {"fmt": "Stakes update"}, "sections": [["Idea", "rows", [["On-screen hook", "29 days to open the world's first humanoid robot store"], ["Other hooks to test", "DAY 1 of 29: the robots still aren't here"], ["Why it works", "Day counts only work with a stake on screen. Mino's DAY 1 and DAY 32 (600K+) had a goal next to the number; plain DAY 4 and DAY 5 fell to 28K to 45K."], ["Notes", "Show what's not done yet and the one thing that has to happen this week."]]]], "inspiration": ["https://www.instagram.com/reel/C1kzUmsRcEl/", "https://www.instagram.com/reel/C23BpgAvnSH/", "https://www.instagram.com/reel/Ddw9G7eyvfP/"], "th": "29 days to open the world's first humanoid robot store", "ith": "DAY 32 / Building a business in ONE DAY"}]}, {"date": "2026-11-03", "dow": "Tue", "kubot": {"format": "Denis Builds", "title": "Kubot: Denis Builds", "sub": "Your kid draws it, we print it", "hook": "Your kid draws it, we print it", "badge": "", "needs": false, "film": [], "sections": [["Plan", "rows", [["Series", "Denis Builds: Denis on camera, building in public."], ["Episode", "Your kid draws it, we print it"], ["When to film", "Any time this week."]]], ["Shots", "list", ["Parts laid out on the table, one slow pan", "Build timelapse from a fixed angle", "The first time it works, one take", "Close-up of [the best detail]"]], ["Where", "text", "[where you build]"], ["Checklist", "check", ["Film while you build", "Cut to 30 to 45 seconds", "No prices, no pitch", "Post on Kubot"]]], "s": {"hooks": ["Your kid draws it, we print it", "A kid drew a robot. We printed it.", "Send us your kid's drawing.", "From a crayon drawing to a real part", "We turned a kid's drawing into a real robot part."], "body": "A kid drew this.\n[B-ROLL: the drawing, held up to camera]\nWe're going to try to print it.\nStep one. Turn the drawing into a 3D model.\n[how you modeled it, one honest line]\nStep two. Print it.\n[print time, real]\nStep three. Does it look like the drawing?\n[B-ROLL: drawing next to the print]\n[your honest reaction]\nAnd the best part is showing it to the kid who drew it.", "cta": "Send us your kid's drawing. We might print it next. Waitlist link in bio.", "src": "Plan v2 support content 'your kid draws it, we print it' + approved soft CTA (new script)", "kind": "new", "notes": "Only use a drawing from a family who said yes. First name only, signed release if the kid is on camera.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "How-to", "desc": "How-to list, 40 to 60s", "has": false, "title": "How To Become Incredibly Good At Designing In CAD", "s": {"fmt": "How to become incredibly good"}, "sections": [["Idea", "rows", [["On-screen hook", "How To Become Incredibly Good At Designing In CAD"], ["Other hooks to test", "How to get incredibly good at 3D design (and I mean actually good)"], ["Why it works", "Your strongest format on @dennyondabeat: four of the top eight reels, 49K to 193K."]]]], "inspiration": ["https://www.instagram.com/reel/Dd78f_Ixoc4/", "https://www.instagram.com/reel/Dewq11ux5RI/", "https://www.instagram.com/reel/DeIuDFPR_db/"], "th": "How To Become Incredibly Good At Designing In CAD", "ith": "How To Become Incredibly Good At Singing"}]}, {"date": "2026-11-04", "dow": "Wed", "kubot": {"format": "Robot on the Street", "title": "Kubot: Robot on the Street", "sub": "What should kids learn that school doesn't teach?", "hook": "What should kids learn that school doesn't teach?", "badge": "", "needs": false, "film": [{"what": "Robot on the Street", "short": "Robot on the Street", "note": "Film today or earlier. Main question: What should kids learn that school doesn't teach?"}], "sections": [["Plan", "rows", [["Series", "Robot on the Street: the robot holds the mic and asks people one short question each."], ["Main question", "What should kids learn that school doesn't teach?"], ["Twist ending", "Gabriel steps in at the end: \"Robots don't teach here. Kids build them.\""], ["Goal", "5 to 6 good answers, a split reaction, then the twist. 30 to 45 seconds."], ["When to film", "Today or earlier."]]], ["Questions", "list", ["Would you let a robot teach your kid?", "Would you rather your kid use robots or build them?", "What should kids learn that school doesn't teach?", "Would your kid rather have an iPad or build a robot?", "Are you scared of AI for your kids?", "What did you build as a kid?", "If a robot could help with one thing at home, what would it be?", "Should kids learn to code or learn to build first?"]], ["Shots", "list", ["Opener: the robot turns to someone, mic up", "Opener line: \"Quick question from a robot. Got 5 seconds?\"", "Each answer: tight on the person, robot mic in frame", "Reactions: people laughing, pointing, filming the robot", "Wide establishing shot of the spot", "Gabriel walking in for the twist, then the line to camera"]], ["Where", "text", "[pick the spot]. Public sidewalks or a park. Ask before filming on private property. Robot at the edge of the walkway, not blocking it."], ["Checklist", "check", ["Pick the spot and time", "Charge the robot and the mic", "Print releases and bring pens", "Quick release from every face used, a parent's for kids", "Never mock anyone's answer", "Get 5 to 6 usable answers", "Film Gabriel's twist line", "Cut to 30 to 45 seconds with subtitles", "No prices, no pitch"]]], "s": {"hooks": ["What should kids learn that school doesn't teach?", "We asked Miami: what should kids learn that school doesn't teach?", "A robot asked strangers one question, and the answers get more honest", "People had opinions. Fast.", "Quick question from a robot. Got 5 seconds?"], "body": "ROBOT: Quick question from a robot. Got 5 seconds?\nROBOT: What should kids learn that school doesn't teach?\n[answer 1, word for word]\n[answer 2]\n[answer 3, the one that surprised you]\n[answer 4]\n[answer 5, a kid if there's a signed parent release]\n[B-ROLL: reactions, people filming the robot]\n[the split: who said yes, who said no, in one line]\nGABRIEL (to camera): Robots don't teach here. Kids build them.", "cta": "What would you answer? Comment it. Waitlist link in bio.", "src": "Plan v2 Robot on the Street format + content.py question list (structure reused; answers are real only)", "kind": "adapted", "notes": "Unscripted. Quick release from every face, a parent's for kids. Never mock an answer.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "POV", "desc": "Mostly visual, 20 to 35s", "has": false, "title": "My comments control 12 3D printers (part 2)", "s": {"fmt": "Comments control the farm"}, "sections": [["Idea", "rows", [["On-screen hook", "My comments control 12 3D printers (part 2)"], ["Other hooks to test", "You voted. 12 printers made it."], ["Why it works", "Comments choose the print, so every episode sets up the next one. POV hooks drove Mino's 187K to 416K reels."], ["Notes", "Print the most liked comment from last week's POV video."]]]], "inspiration": ["https://www.instagram.com/reel/DegXneUNOip/", "https://www.instagram.com/reel/DejCX63y2LM/"], "th": "My comments control 12 3D printers (part 2)", "ith": "POV: Claude is editing 7 REELS while i sleep (idek how to code)"}]}, {"date": "2026-11-05", "dow": "Thu", "kubot": {"format": "Why Build", "title": "Kubot: Why Build", "sub": "#4 Fine motor skills", "hook": "Small parts, big brain", "badge": "", "needs": false, "film": [], "sections": [["Plan", "rows", [["Show", "Why Build? with Gabriel. Gabriel to camera, 45 to 75 seconds."], ["Episode", "#4 Fine motor skills"], ["Status", "Script drafted below. Gabriel to review before filming."]]], ["Inspo", "rows", [["Development point", "Fine motor skills"], ["Hook", "Small parts, big brain"], ["Do this tonight", "Lego, beads or a screwdriver set; anything with tiny pieces"]]], ["Shots", "list", ["Gabriel to camera, clean audio", "B-roll: [Friday class moment that shows the point]", "On-screen text: [hook] / [tonight tip]"]], ["Where", "text", "Studio. Filmed on Sunday studio day."], ["Checklist", "check", ["Review the script with Gabriel", "Film on Sunday studio day", "Cut to 45 to 75 seconds", "Add on-screen text and subtitles", "No prices, no pitch", "Post on Kubot"]]], "s": {"hooks": ["Small parts, big brain", "Those tiny pieces are doing more than you think.", "Why little hands need little parts", "The most underrated toy is a screwdriver.", "Every tiny screw is a brain workout."], "body": "Small parts, big brain.\nA lot of parents see tiny pieces and think, choking hazard, mess, lost under the couch.\nFair.\nBut those tiny pieces are doing something.\nThe kid who lines up a screw with a hole.\nThe kid who threads a wire through a gap smaller than their finger.\nThe kid who tries it five times and gets it on the sixth.\nThat's fine motor skill.\nThe same control they use to write, to tie shoes, to draw.\nA screen asks for a tap.\nA build asks for precision.\nTonight, give them something with tiny pieces.\nLego, beads, a screwdriver set.\nAnything they have to line up with their fingers.\nThen watch how focused they get.\nWhat's the smallest thing your kid can build with?", "cta": "Tonight: Lego, beads or a screwdriver set, anything with tiny pieces. What did they make? Comment it. Waitlist link in bio.", "src": "Plan v2 Why Build bank #4 (Fine motor skills): hook and tonight tip reused, new body", "kind": "new", "notes": "New body written from the plan v2 episode bank hook and 'do this tonight'. Concept-led, so no story from Gabriel is needed. Gabriel should adjust any line that isn't how he'd say it.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "Expose", "desc": "Deadpan talking head, about 60s", "has": false, "title": "Exposing random robot importer for 1 minute", "s": {"fmt": "Uncovering (talking head)"}, "sections": [["Idea", "rows", [["On-screen hook", "What it actually takes to get a humanoid robot out of China"], ["Other hooks to test", "Exposing the robot import process for 1 minute"], ["Why it works", "Insider facts get saved and shared. Verify every claim before filming."], ["Notes", "Keep supplier names and terms vague. No figures."]]]], "inspiration": ["https://www.instagram.com/reel/DeyI4DxRiSC/", "https://www.instagram.com/reel/DYBaGViA4as/", "https://www.instagram.com/reel/DYr-bd5zAMW/"], "th": "Exposing random robot importer for 1 minute", "ith": "Exposing random Tech company for 1 minute"}]}, {"date": "2026-11-06", "dow": "Fri", "kubot": {"format": "Denis Builds", "title": "Kubot: Denis Builds", "sub": "The first thing we built inside the store", "hook": "The first thing we built inside the store", "badge": "Hero shoot 3:30 to 5 PM, Bal Harbour", "needs": false, "film": [{"what": "Kubot class, 3:30 to 5 PM, Bal Harbour", "note": "Hero shoot. Film testimonials and b-roll. Gabriel teaches, Denis \nGABRIEL: [his answer]\nDENIS: What should a kid actually learn about AI, and when?\nGABRIEL: [his answer]\nDENIS: What can a parent try tonight?\nGABRIEL: [his tip, no purchase needed]\nCLIP FOR KUBOT: [Gabriel's clearest line on AI and kids]", "cta": "Full episode on YouTube and Spotify. What should we ask Gabriel next? Waitlist link in bio.", "src": "Plan v2 podcast segments + parent questions (new episode plan)", "kind": "new", "notes": "Gabriel's answers are his, unscripted. Only the cold open and questions are written.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "Take", "desc": "Founder take or personality read, 30 to 60s", "has": false, "title": "No one my age opens a store anymore", "s": {"fmt": "Founder take"}, "sections": [["Idea", "rows", [["On-screen hook", "No one my age opens a store anymore"], ["Other hooks to test", "Everyone my age is building an app. I chose concrete."], ["Why it works", "Tells new viewers who you are, which turns a one-time viewer into a follower."], ["Notes", "Pull the best 45 seconds from that day's podcast."]]]], "inspiration": ["https://www.instagram.com/reel/Dcy05J2Bypm/", "https://www.instagram.com/reel/Ddk9AwnsSBK/", "https://www.instagram.com/reel/DdmJNQJp81s/"], "th": "No one my age opens a store anymore", "ith": "POV: you chased money for 13 months straight"}]}, {"date": "2026-11-09", "dow": "Mon", "kubot": {"format": "Why Build", "title": "Kubot: Why Build", "sub": "#5 Spatial thinking", "hook": "Designing in 3D rewires how kids see things", "badge": "", "needs": false, "film": [], "sections": [["Plan", "rows", [["Show", "Why Build? with Gabriel. Gabriel to camera, 45 to 75 seconds."], ["Episode", "#5 Spatial thinking"], ["Status", "Script drafted below. Gabriel to review before filming."]]], ["Inspo", "rows", [["Development point", "Spatial thinking"], ["Hook", "Designing in 3D rewires how kids see things"], ["Do this tonight", "Ask them to draw an object from three sides"]]], ["Shots", "list", ["Gabriel to camera, clean audio", "B-roll: [Friday class moment that shows the point]", "On-screen text: [hook] / [tonight tip]"]], ["Where", "text", "Studio. Filmed on Sunday studio day."], ["Checklist", "check", ["Review the script with Gabriel", "Film on Sunday studio day", "Cut to 45 to 75 seconds", "Add on-screen text and subtitles", "No prices, no pitch", "Post on Kubot"]]], "s": {"hooks": ["Designing in 3D rewires how kids see things", "designing in 3D rewires your kid", "Your kid sees the world in 2D. Building changes that.", "Draw it from three sides.", "The skill architects and engineers have in common"], "body": "Designing in 3D changes how kids see things.\nMost of what kids look at all day is flat.\nScreens. Pages. Pictures.\nThen they design something they have to print.\nSuddenly it has a top.\nA side.\nA bottom it has to stand on.\nThe kid who turns the model around and around.\nThe kid who realizes the wheel won't fit until they move it.\nThat's spatial thinking.\nSeeing something from every side in your head.\nIt's what builders, architects and engineers use every day.\nHere's a simple way to start it tonight.\nPick any object on the table.\nAsk them to draw it from the front, the side and the top.\nThree drawings.\nWhat did your kid pick to draw?", "cta": "Tonight: ask them to draw one object from three sides. Send us the drawing, we might print it. Waitlist link in bio.", "src": "Plan v2 Why Build bank #5 (Spatial thinking): hook and tonight tip reused, new body", "kind": "new", "notes": "New body written from the plan v2 episode bank hook and 'do this tonight'. Concept-led, so no story from Gabriel is needed. Gabriel should adjust any line that isn't how he'd say it.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "Countdown", "desc": "Stakes update with a deadline, 30 to 45s", "has": false, "title": "22 days to open the world's first humanoid robot store", "s": {"fmt": "Stakes update"}, "sections": [["Idea", "rows", [["On-screen hook", "22 days to open the world's first humanoid robot store"], ["Other hooks to test", "3 weeks left and this is what's not done"], ["Why it works", "Day counts only work with a stake on screen. Mino's DAY 1 and DAY 32 (600K+) had a goal next to the number; plain DAY 4 and DAY 5 fell to 28K to 45K."], ["Notes", "Lead with tension: delays, inspections, things going wrong."]]]], "inspiration": ["https://www.instagram.com/reel/C1kzUmsRcEl/", "https://www.instagram.com/reel/C23BpgAvnSH/", "https://www.instagram.com/reel/Ddw9G7eyvfP/"], "th": "22 days to open the world's first humanoid robot store", "ith": "DAY 32 / Building a business in ONE DAY"}]}, {"date": "2026-11-10", "dow": "Tue", "kubot": {"format": "Denis Builds", "title": "Kubot: Denis Builds", "sub": "Upgrading the tank", "hook": "Upgrading the tank", "badge": "", "needs": false, "film": [], "sections": [["Plan", "rows", [["Series", "Denis Builds: Denis on camera, building in public."], ["Episode", "Upgrading the tank"], ["When to film", "Any time this week."]]], ["Shots", "list", ["Parts laid out on the table, one slow pan", "Build timelapse from a fixed angle", "The first time it works, one take", "Close-up of [the best detail]"]], ["Where", "text", "[where you build]"], ["Checklist", "check", ["Film while you build", "Cut to 30 to 45 seconds", "No prices, no pitch", "Post on Kubot"]]], "s": {"hooks": ["Upgrading the tank", "I printed an upgrade for my tank. Then I reran the ridiculous test.", "Tank 2.0", "Round two: the rematch", "My tank lost round one. I fixed it."], "body": "I upgraded my 3D printed tank.\nThen I reran the most ridiculous test.\n[B-ROLL: the old tank, then the new part printing]\nThe upgrade: [UPGRADE: what you actually changed].\nWhy: [what didn't work last time].\n[B-ROLL: fitting the new part]\nThe rematch.\n[RIDICULOUS TEST: same test as last time]\n[what happened, one line]\nBuild: [score] out of 10.\nAnd honestly, building it again was more fun than the first time.", "cta": "What should I upgrade next? Waitlist link in bio.", "src": "kubot-builds-scripts.md Ep. 2 option B 'Upgrading the tank' (adapted)", "kind": "adapted", "notes": "", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "How-to", "desc": "How-to list, 40 to 60s", "has": false, "title": "How To Become Incredibly Good At Cold Emailing", "s": {"fmt": "How to become incredibly good"}, "sections": [["Idea", "rows", [["On-screen hook", "How To Become Incredibly Good At Cold Emailing"], ["Other hooks to test", "How I get replies from companies that ignore everyone"], ["Why it works", "Your strongest format on @dennyondabeat: four of the top eight reels, 49K to 193K."]]]], "inspiration": ["https://www.instagram.com/reel/Dd78f_Ixoc4/", "https://www.instagram.com/reel/Dewq11ux5RI/", "https://www.instagram.com/reel/DeIuDFPR_db/"], "th": "How To Become Incredibly Good At Cold Emailing", "ith": "How To Become Incredibly Good At Singing"}]}, {"date": "2026-11-11", "dow": "Wed", "kubot": {"format": "Robot on the Street", "title": "Kubot: Robot on the Street", "sub": "What did you build as a kid?", "hook": "What did you build as a kid?", "badge": "", "needs": false, "film": [{"what": "Robot on the Street", "short": "Robot on the Street", "note": "Film today or earlier. Main question: What did you build as a kid?"}], "sections": [["Plan", "rows", [["Series", "Robot on the Street: the robot holds the mic and asks people one short question each."], ["Main question", "What did you build as a kid?"], ["Twist ending", "Gabriel steps in at the end: \"Robots don't teach here. Kids build them.\""], ["Goal", "5 to 6 good answers, a split reaction, then the twist. 30 to 45 seconds."], ["When to film", "Today or earlier."]]], ["Questions", "list", ["Would you let a robot teach your kid?", "Would you rather your kid use robots or build them?", "What should kids learn that school doesn't teach?", "Would y
