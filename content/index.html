"Today or earlier."]]], ["Questions", "list", ["Would you let a robot teach your kid?", "Would you rather your kid use robots or build them?", "What should kids learn that school doesn't teach?", "Would your kid rather have an iPad or build a robot?", "Are you scared of AI for your kids?", "What did you build as a kid?", "If a robot could help with one thing at home, what would it be?", "Should kids learn to code or learn to build first?"]], ["Shots", "list", ["Opener: the robot turns to someone, mic up", "Opener line: \"Quick question from a robot. Got 5 seconds?\"", "Each answer: tight on the person, robot mic in frame", "Reactions: people laughing, pointing, filming the robot", "Wide establishing shot of the spot", "Gabriel walking in for the twist, then the line to camera"]], ["Where", "text", "[pick the spot]. Public sidewalks or a park. Ask before filming on private property. Robot at the edge of the walkway, not blocking it."], ["Checklist", "check", ["Pick the spot and time", "Charge the robot and the mic", "Print releases and bring pens", "Quick release from every face used, a parent's for kids", "Never mock anyone's answer", "Get 5 to 6 usable answers", "Film Gabriel's twist line", "Cut to 30 to 45 seconds with subtitles", "No prices, no pitch"]]], "s": {"hooks": ["What would your kid build first?", "We asked Miami: what would your kid build first?", "A robot asked strangers one question, and the answers get more honest", "People had opinions. Fast.", "Quick question from a robot. Got 5 seconds?"], "body": "ROBOT: Quick question from a robot. Got 5 seconds?\nROBOT: What would your kid build first?\n[answer 1, word for word]\n[answer 2]\n[answer 3, the one that surprised you]\n[answer 4]\n[answer 5, a kid if there's a signed parent release]\n[B-ROLL: reactions, people filming the robot]\n[the split: who said yes, who said no, in one line]\nGABRIEL (to camera): Robots don't teach here. Kids build them.", "cta": "What would you answer? Comment it. Waitlist link in bio.", "src": "Plan v2 Robot on the Street format + content.py question list (structure reused; answers are real only)", "kind": "adapted", "notes": "Unscripted. Quick release from every face, a parent's for kids. Never mock an answer.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "POV", "desc": "Mostly visual, 20 to 35s", "has": true, "title": "POV: day two of owning a store at 21", "s": {"hooks": ["POV: day two of owning a store at 21", "Day two of owning a store at 21"], "body": "So I own a store now, and I've become an absolute maniac with it.\n\nIt's currently [time], it's day two, and I'm [where you are and what you're doing].\n\n[Point around] [What's happening right now on the floor, two quick lines.]\n\nI should wake up tomorrow with [what you're hoping for].\n\nThis is insane. Yesterday [the moment from opening day you can't stop thinking about].", "cta": "Comment what you want to see in the store", "src": "Rewritten Oct 23 from the inspo transcripts", "kind": "new", "notes": "Copies Mino Lee's \"POV: Claude is editing 7 reels while I sleep\" (293K). His exact shape: \"So I just discovered X and I've become an absolute maniac with it\", how many of them there are, the time on the clock, what each one is doing right now, what you'll wake up to, what happened last night, then the comment CTA. Filmed handheld at night, talking fast.", "fillins": "", "format": "POV, mostly visual", "fmt": "POV, mostly visual"}, "inspiration": ["https://www.instagram.com/reel/DegXneUNOip/", "https://www.instagram.com/reel/DejCX63y2LM/"], "th": "POV: day two of owning a store at 21", "ith": "POV: Claude is editing 7 REELS while i sleep (idek how to code)"}, {"time": "", "label": "Hook test", "desc": "On-screen text over B-roll, 6 to 10s", "has": true, "title": "I am 21 and I'm not ashamed to admit that I stop working at 8pm and I still feel guilty about it.", "th": "I am 21 and I'm not ashamed to admit that I stop working at 8pm and I still feel guilty about it.", "ith": "I am 29 and I am not ashamed to admit that: (carousel, one honest admission per slide)", "inspiration": ["https://www.instagram.com/reel/DRKG_F5jHmG/"], "s": {"hooks": ["I am 21 and I'm not ashamed to admit that I stop working at 8pm and I still feel guilty about it."], "body": "[On screen, first line] I am 21 and I'm not ashamed to admit\n\n[Second line] that I stop working at 8pm\n\n[Third line] and I still feel guilty about it.", "cta": "Caption: Everyone online says founders work until 2am. I stop around 8. I've learned I'm better the next day when I do. But there's still guilt every night, like I'm not doing enough. Rest isn't the opposite of work. It's part of it. I'm still convincing myself of that.\n\nIf you feel the same, you're not alone.\n\nfollow @denisaverbuk for more real talk", "src": "Hook formats Denis found, written Oct 23", "kind": "new", "notes": "Copies @laurastravl's \"I am 29 and I am not ashamed to admit that:\" post. Hook on screen over a casual shot of you, then the honest admission. The caption tells the full story and what you learned. Don't try to sound perfect; the goal is people thinking \"I feel exactly the same.\" Only post the lines that are true for you. Her setup: one slow, pretty B-roll clip (you looking out, walking, at the desk, the print farm at night), white text centered on screen, an emotional trending song (hers use songs like \"To Build A Home\"). No talking. Pull the clip from the B-roll library.", "fillins": "", "format": "I'm 21 and not ashamed", "fmt": "I'm 21 and not ashamed"}}]}, {"date": "2026-12-03", "dow": "Thu", "kubot": {"format": "Why Build", "title": "Kubot: Why Build", "sub": "#17 Starting age", "hook": "Is your kid old enough for robotics?", "badge": "", "needs": false, "film": [], "sections": [["Plan", "rows", [["Show", "Why Build? with Gabriel. Gabriel to camera, 45 to 75 seconds."], ["Episode", "#17 Starting age"], ["Status", "Script drafted below. Gabriel to review before filming."]]], ["Inspo", "rows", [["Development point", "Starting age"], ["Hook", "Is your kid old enough for robotics?"], ["Do this tonight", "What a 6, 9 and 12 year old can each build"]]], ["Shots", "list", ["Gabriel to camera, clean audio", "B-roll: [Friday class moment that shows the point]", "On-screen text: [hook] / [tonight tip]"]], ["Where", "text", "Studio. Filmed on Sunday studio day."], ["Checklist", "check", ["Review the script with Gabriel", "Film on Sunday studio day", "Cut to 45 to 75 seconds", "Add on-screen text and subtitles", "No prices, no pitch", "Post on Kubot"]]], "s": {"hooks": ["Is your kid old enough for robotics?", "is your kid old enough?", "The right age to start building is younger than you think.", "What a 6, 9 and 12 year old can each build", "Parents ask me this every week."], "body": "Is your kid old enough for robotics?\nParents ask that all the time.\nThe honest answer is, it depends on what you mean by robotics.\nAt six, it's putting parts together and seeing something move.\nAt nine, it's [what Gabriel says a 9 year old can build].\nAt twelve, it's [what Gabriel says a 12 year old can build].\nSame idea.\nDifferent level.\nThe kid who just wants to see it go.\nThe kid who wants to make it go faster.\nThe kid who wants to make it go by itself.\nThat's the progression.\nAnd it doesn't start with being \"ready\".\nIt starts with being curious.\nTonight, ask your kid what they'd build if they could build anything.\nWrite it down.\nWhat did your kid say?", "cta": "Ask your kid what they'd build. Send us the drawing, we might print it. Waitlist link in bio.", "src": "Plan v2 Why Build bank #17 (Starting age): hook and tonight tip reused, new body", "kind": "new", "notes": "New body written from the plan v2 episode bank hook and 'do this tonight'. Concept-led, so no story from Gabriel is needed. Gabriel should adjust any line that isn't how he'd say it. Fill the age brackets with Gabriel's real answer.", "fillins": "", const SHORT = {"Robot on the Street":"Street","Follower Farming":"Followers"};
function openSheet(id){
  const ds = id.split(":")[0], d = BY[ds]; if (!d) return;
  const it = items(d).find(x => x.id === id); if (!it) return;
  sheetId = id; lastFocus = document.activeElement;
  $("s-meta").innerHTML = '<span class="dot'+(it.kind==="k"?" k":"")+'"></span>' + esc(nice(ds) + " \u00b7 " + it.meta);
  let h = '<h3 id="s-title">'+esc(it.title)+'</h3>' + (it.sub ? '<div class="ssub">'+esc(it.sub)+'</div>' : '');
  h += '<div class="group">' + checkBtn(id, it.title, "drow check") + '</div>';
  if (it.kind === "k"){
    const k = it.src;
    if (k.film && k.film.length){
      h += '<div class="section-h">Film today</div><div class="group filmbox">';
      k.film.forEach(f => {
        h += '<div class="ft">'+esc(f.what)+'</div>' + (f.note ? '<div class="fn">'+esc(f.note)+'</div>' : '');
        if (f.ref && BY[f.ref]) h += '<button class="drow link" data-open="'+esc(f.ref+":k")+'">Open the '+esc(MON[parse(f.ref).getMonth()]+" "+parse(f.ref).getDate())+' plan</button>';
      });
      h += '</div>';
    }
    h += scriptHTML(k.s);
    h += inspHTML(id, k.inspiration);
    if (k.film && k.film.length) k.film.forEach(f => (f.sections || []).forEach(s => h += secHTML(s)));
    k.sections.forEach(s => h += secHTML(s));
  } else if (it.kind === "m") {
    const m = it.src;
    h += secHTML(["Text hook", "rows", [["Your text hook (on screen)", m.th], ["Inspo video's text hook", m.ith]]]);
    h += '<div class="section-h">Script</div><div class="group"><div class="pre">'+esc(m.body)+'</div></div>';
    h += secHTML(["Caption", "text", m.caption]);
    if (m.notes) h += secHTML(["Notes", "text", m.notes]);
    h += inspHTML(id, m.insp);
  } else if (it.kind === "h") {
    const s = it.src;
    h += secHTML(["Text hook", "rows", [["Your text hook (on screen)", s.textHook || ""], ["Inspo video's text hook", "DAY 32 / Building a business in ONE DAY"]]]);
    h += '<div class="section-h">Spoken hooks</div><div class="group">' + (s.hooks||[]).map((x,i) => '<div class="hk"><b>'+(i+1)+'</b><span>'+esc(x)+'</span></div>').join("") + '</div>';
    h += '<div class="section-h">Body</div><div class="group"><div class="pre">'+esc(s.body)+'</div></div>';
    h += '<div class="section-h">CTA</div><div class="group"><div class="cta">'+esc(s.cta)+'</div></div>';
    if (s.caption) h += secHTML(["Caption", "text", s.caption]);
    if (s.shots && s.shots.length) h += secHTML(["Shots", "list", s.shots]);
    if (s.fillins) h += secHTML(["Fill-ins", "text", s.fillins]);
    h += inspHTML(id, ["https://www.instagram.com/reel/C1kzUmsRcEl/", "https://www.instagram.com/reel/C23BpgAvnSH/", "https://www.instagram.com/reel/Ddw9G7eyvfP/"]);
  } else {
    const p = it.src;
    h += secHTML(["What this post is", "rows", [["Series", p.label + ": " + p.desc], ["Format", (p.s && p.s.fmt) || ""]].concat(p.s && p.s.format && p.s.format !== p.s.fmt ? [["Script format", p.s.format]] : [])]);
    if (p.th) h += secHTML(["Text hook", "rows", [["Your text hook (on screen)", p.th]].concat(p.ith ? [["Inspo video's text hook", p.ith]] : [])]);
    h += scriptHTML(p.s);
    if (p.sections) p.sections.forEach(s => h += secHTML(s));
    h += inspHTML(id, p.inspiration);
  }
  $("s-body").innerHTML = h; $("s-body").scrollTop = 0;
  $("scrim").classList.add("on"); $("sheet").classList.add("on");
  setTimeout(() => $("sheet").focus({preventScroll:true}), 50);
}
function closeSheet(){ sheetId = null; $("scrim").classList.remove("on"); $("sheet").classList.remove("on"); if (lastFocus && lastFocus.focus) lastFocus.focus({preventScroll:true}); }
document.addEventListener("click", e => {
  const c = e.target.closest("[role=checkbox][data-id]");
  if (c){ const id = c.dataset.id; done[id] = !done[id]; if (!done[id]) delete done[id]; save();
    document.querySelectorAll('[data-id="'+id+'"]').forEach(b => b.setAttribute("aria-checked", !!done[id]));
    const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  const o = e.target.closest("[data-open]"); if (o){ openSheet(o.dataset.open); return; }
  const w = e.target.closest("[data-day]"); if (w){ const ds = w.dataset.day; weekStart = mondayOf(ds); view = "week"; render(); scrollToDay(ds); return; }
});
$("v-w").onclick = () => { if (view !== "week"){ view = "week"; weekStart = mondayOf(clamp(month === clamp(TODAY).slice(0,7) ? clamp(TODAY) : (month + "-01" < FIRST ? FIRST : month + "-01"))); render(); window.scrollTo(0,0); } };
$("v-m").onclick = () => { if (view !== "month"){ view = "month"; month = clamp(weekStart).slice(0,7); render(); window.scrollTo(0,0); } };
$("prev").onclick = () => { if (view === "week"){ if (weekStart > FIRST){ weekStart = add(weekStart,-7); render(); window.scrollTo(0,0);} } else { const [y,m] = month.split("-").map(Number); const d = new Date(y, m-2, 1, 12); const k = iso(d).slice(0,7); if (k >= FIRST.slice(0,7)){ month = k; render(); } } };
$("next").onclick = () => { if (view === "week"){ if (add(weekStart,6) < LAST){ weekStart = add(weekStart,7); render(); window.scrollTo(0,0);} } else { const [y,m] = month.split("-").map(Number); const d = new Date(y, m, 1, 12); const k = iso(d).slice(0,7); if (k <= LAST.slice(0,7)){ month = k; render(); } } };
$("today").onclick = () => { if (view === "week"){ weekStart = mondayOf(clamp(TODAY)); render(); scrollToDay(clamp(TODAY)); } else { month = clamp(TODAY).slice(0,7); render(); } };
$("scrim").onclick = closeSheet; $("s-close").onclick = closeSheet;
document.addEventListener("keydown", e => { if (e.key === "Escape" && sheetId) closeSheet(); });
window.__app = { openSheet, closeSheet, setView: v => { view = v; render(); }, setWeek: d => { weekStart = mondayOf(d); render(); }, setMonth: m => { month = m; view = "month"; render(); } };
renderPlan(); if (location.hash === "#month") view = "month"; render();
if (view === "week" && TODAY >= FIRST && TODAY <= LAST) requestAnimationFrame(() => scrollToDay(TODAY));
})();
</script>
</body>
</html>
