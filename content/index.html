one slow, pretty B-roll clip (you looking out, walking, at the desk, the print farm at night), white text centered on screen, an emotional trending song (hers use songs like \"To Build A Home\"). No talking. Pull the clip from the B-roll library.", "fillins": "", "format": "I'm 21 and not ashamed", "fmt": "I'm 21 and not ashamed"}}]}, {"date": "2026-11-18", "dow": "Wed", "kubot": {"format": "Robot on the Street", "title": "Kubot: Robot on the Street", "sub": "If a robot could help with one thing at home, what would it be?", "hook": "If a robot could help with one thing at home, what would it be?", "badge": "", "needs": false, "film": [{"what": "Robot on the Street", "short": "Robot on the Street", "note": "Film today or earlier. Main question: If a robot could help with one thing at home, what would it be?"}], "sections": [["Plan", "rows", [["Series", "Robot on the Street: the robot holds the mic and asks people one short question each."], ["Main question", "If a robot could help with one thing at home, what would it be?"], ["Twist ending", "Gabriel steps in at the end: \"Robots don't teach here. Kids build them.\""], ["Goal", "5 to 6 good answers, a split reaction, then the twist. 30 to 45 seconds."], ["When to film", "Today or earlier."]]], ["Questions", "list", ["Would you let a robot teach your kid?", "Would you rather your kid use robots or build them?", "What should kids learn that school doesn't teach?", "Would your kid rather have an iPad or build a robot?", "Are you scared of AI for your kids?", "What did you build as a kid?", "If a robot could help with one thing at home, what would it be?", "Should kids learn to code or learn to build first?"]], ["Shots", "list", ["Opener: the robot turns to someone, mic up", "Opener line: \"Quick question from a robot. Got 5 seconds?\"", "Each answer: tight on the person, robot mic in frame", "Reactions: people laughing, pointing, filming the robot", "Wide establishing shot of the spot", "Gabriel walking in for the twist, then the line to camera"]], ["Where", "text", "[pick the spot]. Public sidewalks or a park. Ask before filming on private property. Robot at the edge of the walkway, not blocking it."], ["Checklist", "check", ["Pick the spot and time", "Charge the robot and the mic", "Print releases and bring pens", "Quick release from every face used, a parent's for kids", "Never mock anyone's answer", "Get 5 to 6 usable answers", "Film Gabriel's twist line", "Cut to 30 to 45 seconds with subtitles", "No prices, no pitch"]]], "s": {"hooks": ["If a robot could help with one thing at home, what would it be?", "We asked Miami: if a robot could help with one thing at home, what would it be?", "A robot asked strangers one question, and the answers get more honest", "People had opinions. Fast.", "Quick question from a robot. Got 5 seconds?"], "body": "ROBOT: Quick question from a robot. Got 5 seconds?\nROBOT: If a robot could help with one thing at home, what would it be?\n[answer 1, word for word]\n[answer 2]\n[answer 3, the one that surprised you]\n[answer 4]\n[answer 5, a kid if there's a signed parent release]\n[B-ROLL: reactions, people filming the robot]\n[the split: who said yes, who said no, in one line]\nGABRIEL (to camera): Robots don't teach here. Kids build them.", "cta": "What would you answer? Comment it. Waitlist link in bio.", "src": "Plan v2 Robot on the Street format + content.py question list (structure reused; answers are real only)", "kind": "adapted", "notes": "Unscripted. Quick release from every face, a parent's for kids. Never mock an answer.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "Breakdown", "desc": "Lav mic to camera with the clip playing in the corner, 45 to 60s", "has": true, "title": "This one video got 4 million views", "s": {"hooks": ["This one video got 4 million views", "This 22 second reel got me 4 million views. Here's why."], "body": "This 22 second reel got me 4 million views. Let's break it down.\n\n[The clip plays in the corner.]\n\nIt says \"10/10 male rules, but it gets increasingly more niche\", and in the first second it calls out a group. If you're a guy, you either feel called out or you want to check if you pass.\n\nThen every rule is one line, so you stay to see the next one. That pushed the watch time way past what a 22 second video should get, which made Instagram push it out like crazy.\n\nBut how did it get over 500 comments? The caption asked \"did I miss anything?\" Hundreds of guys answered, and every comment pushed it further.\n\nThis video is an example of taking a format that already works and pointing it at one group. If this helped you at all, follow me.", "cta": "Caption: Comment FORMAT and I'll send you the template", "src": "Rewritten Oct 23 from the inspo transcripts", "kind": "new", "notes": "Copies Robert McKeaveney's breakdown (\"This 2 second reel got me 30,000 followers... let's break it down\", 2.3M): the result, \"let's break it down\", what's on screen and why, what it did to watch time, the extra layer, follow. The clip plays in the corner the whole time. Every number comes from your own account.", "fillins": "", "format": "Viral breakdown (clip in corner)", "fmt": "Viral breakdown (clip in corner)"}, "inspiration": ["https://www.instagram.com/reel/DeYZ_aVz-h4/", "https://www.instagram.com/reel/Den3cb_szfi/", "https://www.instagram.com/reel/DXkuJ78EVwv/"], "th": "This one video got 4 million views", "ith": "Follower counter on screen: 30,000 (Robert McKeaveney breakdown)"}, {"time": "", "label": "Hook test", "desc": "On-screen text over B-roll, 6 to 10s", "has": true, "title": "A creator I look up to told me about the \"ranking up\" theory and it completely changed the way I think about goals", "th": "A creator I look up to told me about the \"ranking up\" theory and it completely changed the way I think about goals", "ith": "I recently discovered \"The Empty Boat Theory\"... and it completely changed the way I see people.", "inspiration": ["https://www.instagram.com/reel/DbicgB4sRT4/"], "s": {"hooks": ["A creator I look up to told me about the \"ranking up\" theory and it completely changed the way I think about goals"], "body": "[On screen, line 1] A creator I look up to told me about the \"ranking up\" theory...\n\n[Line 2] and it completely changed the way I think about goals.", "cta": "Caption: A creator I look up to, Mino Lee, hit a goal he'd chased for 13 months and felt underwhelmed.\n\nImagine grinding a game for months to rank up. You finally do it, and the screen just says \"rank up.\" That's it.\n\nHis lesson: the point of ranking up isn't to celebrate ranking up. It's that the game gets more fun.\n\nOpening day won't fix everything. The fun is the building. So I'm trying to actually enjoy this part.\n\nfollow @denisaverbuk for more", "src": "Hook formats Denis found, written Oct 23", "kind": "new", "notes": "Copies @laurastravl's \"I recently discovered 'The Empty Boat Theory'... and it completely changed the way I see people\" (81.4K). On screen: just the hook, split in two lines. Caption shape: name the idea, \"Imagine...\" a concrete scene, what most people would do, \"now imagine\" the flip, \"life is often like that\", then what changed for you. Her setup: one slow, pretty B-roll clip (you looking out, walking, at the desk, the print farm at night), white text centered on screen, an emotional trending song (hers use songs like \"To Build A Home\"). No talking. Pull the clip from the B-roll library.", "fillins": "", "format": "The ___ theory", "fmt": "The ___ theory"}}]}, {"date": "2026-11-19", "dow": "Thu", "kubot": {"format": "Why Build", "title": "Kubot: Why Build", "sub": "#9 Math and science made real", "hook": "Your kid learned gear ratios today and didn't notice", "badge": "", "needs": false, "film": [], "sections": [["Plan", "rows", [["Show", "Why Build? with Gabriel. Gabriel to camera, 45 to 75 seconds."], ["Episode", "#9 Math and science made real"], ["Status", "Script drafted below. Gabriel to review before filming."]]], ["Inspo", "rows", [["Development point", "Math and science made real"], ["Hook", "Your kid learned gear ratios today and didn't notice"], ["Do this tonight", "Point out gears and motors in things around the house"]]], ["Shots", "list", ["Gabriel to camera, clean audio", "B-roll: [Friday class moment that shows the point]", "On-screen text: [hook] / [tonight tip]"]], ["Where", "text", "Studio. Filmed on Sunday studio day."], ["Checklist", "check", ["Review the script with Gabriel", "Film on Sunday studio day", "Cut to 45 to 75 seconds", "Add on-screen text and subtitles", "No prices, no pitch", "Post on Kubot"]]], "s": {"hooks": ["Your kid learned gear ratios today and didn't notice", "your kid learned gear ratios and didn't notice", "Math is a lot more fun when it makes something move.", "Kids don't hate math. They hate math that does nothing.", "Point at a gear tonight."], "body": "Your kid learned gear ratios today and didn't even notice.\nHere's how.\nThey built a car.\nIt was too slow.\nSo they swapped a small gear for a big one.\nNow it's fast, but it can't climb.\nSwap it back.\nThat's a gear ratio.\nThat's force and speed.\nOn a worksheet, it's boring.\nOn a robot they built, it's the best problem in the world.\nSame math.\nDifferent reason to care.\nTonight, point out gears and motors around the house.\nThe blender. A bike. A clock.\nAsk what would happen if the gear was bigger.\nWhere did your kid find a gear?", "cta": "Tonight: point out gears and motors around the house. Comment where your kid found one. Waitlist link in bio.", "src": "Plan v2 Why Build bank #9 (Math and science made real): hook and tonight tip reused, new body", "kind": "new", "notes": "New body written from the plan v2 episode bank hook and 'do this tonight'. Concept-led, so no story from Gabriel is needed. Gabriel should adjust any line that isn't how he'd say it.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "Expose", "desc": "Deadpan talking head, about 60s", "has": true, "title": "Exposing my own robot for 1 minute", "s": {"hooks": ["Exposing my own robot for 1 minute", "Yes, I'm controlling my robot. Here's how it works."], "body": "[Shake the jar. Pull a slip. It has your robot's name on it. Look at camera.]\n\nMy robot.\n\nI don't know a single thing wrong with it.\n\n[Music hits.]\n\n[How it's actually controlled when you film: remote, app, or autonomous. Say it plainly.]\n\n[How long the battery really lasts.]\n\n[The thing it can't do that people assume it can.]\n\n[The time it fell, froze or embarrassed you on camera.]\n\n[The one thing it does that still amazes you. End on it.]", "cta": "Caption: After all those expose videos, it's only fair", "src": "Rewritten Oct 23 from the inspo transcripts", "kind": "new", "notes": "Copies leo.taps \"Exposing random Tech company for 1 minute\" (423K likes). His exact shape: say the subject, the fake-innocent line (\"I don't know a single Tesla controversy\"), then stack the facts fast, heaviest first, each with a source, and stop on the last fact with no wrap-up. Deadpan, no music until the first fact. Check every claim before filming. Gets ahead of the \"what about your robot?\" comments. Only true details.", "fillins": "", "format": "Behind the robot", "fmt": "Behind the robot"}, "inspiration": ["https://www.instagram.com/reel/DYBaGViA4as/", "https://www.instagram.com/reel/DeyI4DxRiSC/"], "th": "Exposing my own robot for 1 minute", "ith": "Exposing random Tech company for 1 minute"}, {"time": "", "label": "Hook test", "desc": "On-screen text over B-roll, 6 to 10s", "has": true, "title": "The biggest lesson I've learnt about missing a deadline is that it's NOT the end", "th": "The biggest lesson I've learnt about missing a deadline is that it's NOT the end", "ith": "The older I get, the more I realize that the real luxuries in life aren't things. They're time, health, peace of mind...", "inspiration": ["https://www.instagram.com/reel/DdGe93jsQFv/"], "s": {"hooks": ["The biggest lesson I've learnt about missing a deadline is that it's NOT the end"], "body": "[On screen, all of it]\nThe biggest lesson I've learnt about missing a deadline is that it's NOT the end.\nIt's being honest about it, picking a new date, and hitting the next one.", "cta": "Caption: What would you add? Send this to someone who needs to hear it.\n\nfollow @denisaverbuk for more", "src": "Hook formats Denis found, written Oct 23", "kind": "new", "notes": "Copies @laurastravl's \"The older I get, the more I realize that the real luxuries in life aren't things. They're time, health, peace of mind...\" (35.3K). The whole message is on screen: the hook, then \"It's ...\" followed by a list. The caption stays short and asks people to add to the list and share it. Her setup: one slow, pretty B-roll clip (you looking out, walking, at the desk, the print farm at night), white text centered on screen, an emotional trending song (hers use songs like \"To Build A Home\"). No talking. Pull the clip from the B-roll library.", "fillins": "", "format": "Biggest lesson is NOT", "fmt": "Biggest lesson is NOT"}}]}, {"date": "2026-11-20", "dow": "Fri", "kubot": {"format": "Denis Builds", "title": "Kubot: Denis Builds", "sub": "Two weeks out", "hook": "Two weeks until we open", "badge": "Hero shoot 3:30 to 5 PM, Bal Harbour", "needs": false, "film": [{"what": "Kubot class, 3:30 to 5 PM, Bal Harbour", "note": "Hero shoot. Film testimonials and b-roll. Gabriel teaches, Denis films.", "sections": [["Capture list", "list", ["Door: signed parent photo and video release before any face is used", "Wide of the room before kids arrive", "Hands on CyberBricks and 3D printed parts (vertical and horizontal)", "Gabriel teaching: hands, face, parts, kids reacting", "A build failing, then a kid fixing it", "The first time a robot moves, plus the kid's face", "Wide room shots once it's full", "Pickup: a kid showing the build to a parent", "Parent answer at pickup (release-cleared only): \"What did you notice in your kid today?\" Get 2 to 3 clean answers for Saturday"]], ["Rules", "text", "No scripted kid interviews. No prices, no pitch. First names only, no school names. After class, confirm which faces are release-cleared before the edit."]], "short": "Class 3:30 to 5 PM, Bal Harbour"}], "sections": [["Plan", "rows", [["Series", "Denis Builds: Denis on camera, building in public."], ["Episode", "What got done at the store this week, what broke, what's next."], ["When to film", "Any time this week."]]], ["Shots", "list", ["Denis to camera at the store", "B-roll: [what got done]", "Close-up: [one detail]"]], ["Where", "text", "[where you're filming]"], ["Checklist", "check", ["Film during the week", "Cut to 30 to 45 seconds", "No prices, no pitch", "Post on Kubot"]]], "s": {"hooks": ["Two weeks until we open", "two weeks out", "Two weeks to go. Here's what's left.", "The countdown just got real.", "14 days."], "body": "Two weeks until we open.\n[B-ROLL: the store today]\nWhat got done: [what got done this week].\nWhat broke: [what broke, one honest line].\nWhat's next: [what's next before December 1st].\n[B-ROLL: one detail close up]\nMost founders only post the wins.\nAnd I think the broken part is the part worth watching.", "cta": "Follow along to see if we get the doors open. Waitlist link in bio.", "src": "Store build update format (content.py, hub posts.json Oct 30) with a new weekly angle", "kind": "adapted", "notes": "Real progress only. No prices, no lease or money details.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "News", "desc": "Split screen robot news, 40 to 60s", "has": true, "title": "This 3D printer just changed what you can make at home", "s": {"hooks": ["This 3D printer just changed what you can make at home", "Would you put this printer in your room?"], "body": "This 3D printer just changed what you can make at home.\n\nSo this 3D printer that [what it does] just [launched / opened preorders]. It's called [name], built by a [city] startup called [company].\n\nIt's an interesting one because [what makes it different from every other printer you've seen].\n\nThe feature that I think a lot of people, including me, will be excited about is [the feature].\n\nNow it's worth noting that [the catch: remote operators, cameras in your home, what it can't do yet].\n\nIt costs [comparison, e.g. less than half of its biggest rival]. And if you're seriously considering it, [when and where it ships].\n\nI run 12 printers, so here's my take: [would you add it to the farm, one line].\n\nI think the main takeaway, regardless of if you actually want one or not, is that [the big picture in one line]. If you want to stay in the loop on robots and 3D printing, follow for more.", "cta": "Follow for more", "src": "Rewritten Oct 23 from the inspo transcripts", "kind": "new", "notes": "Copies Rowan Cheung's robot launch breakdowns (64K and 28K likes): what it does, who built it and where, what makes it different, the feature people will want, \"now it's worth noting\" the catch, when it ships, the big takeaway, follow for more. Split screen: launch footage on top, you at the mic below. No exact prices, use comparisons. Pick the biggest 3D printing launch of the week.", "fillins": "", "format": "Robot news breakdown", "fmt": "Robot news breakdown"}, "inspiration": ["https://www.instagram.com/reel/Da3U7H-O-UZ/", "https://www.instagram.com/reel/DYfQ9rdui0n/"], "th": "This 3D printer just changed what you can make at home", "ith": "None on screen. Rowan uses subtitles over split screen launch footage."}, {"time": "", "label": "Hook test", "desc": "On-screen text over B-roll, 6 to 10s", "has": true, "title": "I am 21 and I'm not ashamed to admit that a company told me no because I was too small.", "th": "I am 21 and I'm not ashamed to admit that a company told me no because I was too small.", "ith": "I am 29 and I am not ashamed to admit that: (carousel, one honest admission per slide)", "inspiration": ["https://www.instagram.com/reel/DRKG_F5jHmG/"], "s": {"hooks": ["I am 21 and I'm not ashamed to admit that a company told me no because I was too small."], "body": "[On screen, first line] I am 21 and I'm not ashamed to admit\n\n[Second line] that a company told me no\n\n[Third line] because I was too small.", "cta": "Caption: I wanted to work directly with one of the biggest robot companies in the world. They said no. Not because the idea was bad, because I was a 21 year old with one store that isn't open yet. It stung. It also told me exactly what to do next: get bigger. Watch me.\n\nIf you feel the same, you're not alone.\n\nfollow @denisaverbuk for more real talk", "src": "Hook formats Denis found, written Oct 23", "kind": "new", "notes": "Copies @laurastravl's \"I am 29 and I am not ashamed to admit that:\" post. Hook on screen over a casual shot of you, then the honest admission. The caption tells the full story and what you learned. Don't try to sound perfect; the goal is people thinking \"I feel exactly the same.\" Only post the lines that are true for you. Her setup: one slow, pretty B-roll clip (you looking out, walking, at the desk, the print farm at night), white text centered on screen, an emotional trending song (hers use songs like \"To Build A Home\"). No talking. Pull the clip from the B-roll library.", "fillins": "", "format": "I'm 21 and not ashamed", "fmt": "I'm 21 and not ashamed"}}]}, {"date": "2026-11-21", "dow": "Sat", "kubot": {"format": "Testimonial", "title": "Kubot: Testimonial", "sub": "From Fri Nov 20 class", "hook": "I asked a [mom or dad] what changed in [her or his] [son or daughter]", "badge": "", "needs": false, "film": [], "sections": [["Plan", "rows", [["Series", "Testimonial: a kid at pickup showing their parent what they built, then one honest sentence from the parent. Unscripted, never staged."], ["Source", "Footage from the Fri Nov 20 class (Bal Harbour)."], ["Hook options", "\"Watch [his or her] face when [he or she] shows [mom or dad]\" or \"I asked a [mom or dad] what changed in [her or his] [son or daughter]\". Use the real kid and parent."], ["Who", "[parent first name] and [kid first name]. First names only."], ["Goal", "One honest answer a parent watching can relate to. 25 to 35 seconds."]]], ["Questions", "list", ["What did you notice in your kid today?", "What did [kid] tell you about the build on the way out?", "What is something [kid] built that surprised you?", "How does [kid] talk about building now?", "In one sentence, what did building give [kid]?"]], ["Shots", "list", ["Kid running up with the build", "Kid explaining it to the parent", "Parent's face as the robot moves", "The parent's one sentence", "Close-up of the build in the kid's hands"]], ["Where", "text", "Bal Harbour class footage from Friday."], ["Checklist", "check", ["Pick the pickup moment from Friday's footage", "Confirm the signed release for kid and parent", "First names only, no school names", "Cut to 25 to 35 seconds with subtitles", "No prices, no pitch", "Post on Kubot"]]], "s": {"hooks": ["I asked a [mom or dad] what changed in [her or his] [son or daughter]", "One question at pickup.", "They walked in with a pile of parts.", "No script. Just pickup.", "Watch [his or her] face when the robot moves."], "body": "[B-ROLL: kid running up to the parent with the build]\nKID: [what the kid says about the build, word for word]\n[B-ROLL: the robot moving, the parent's face]\nPARENT (answering \"What did you notice in your kid today?\"): [the parent's answer, word for word]\n[B-ROLL: close up of the build in the kid's hands]\nON-SCREEN: [parent's first name] and [kid's first name], after the Fri Nov 20 class.", "cta": "What did your kid build first? Comment it. Or send us their drawing.", "src": "Plan v2 Real Families + kubot-details.json hook options + hub posts.json pickup posts (structure reused; dence", "ith": "I recently discovered \"The Empty Boat Theory\"... and it completely changed the way I see people.", "inspiration": ["https://www.instagram.com/reel/DbicgB4sRT4/"], "s": {"hooks": ["My co-founder told me about the \"shy kid\" theory and it completely changed the way I think about confidence"], "body": "[On screen, line 1] My co-founder told me about the \"shy kid\" theory...\n\n[Line 2] and it completely changed the way I think about confidence.", "cta": "Caption: My co-founder told me why telling a shy kid to speak up almost never works.\n\nImagine a kid hiding behind their mom at drop off. Now imagine someone asks that same kid how the robot they just built works.\n\nThey won't stop talking.\n\nConfidence comes from knowing something, not from being told to be brave. That's exactly how it worked for me on camera. I got confident once I had something real to show.\n\nfollow @denisaverbuk for more", "src": "Hook formats Denis found, written Oct 23", "kind": "new", "notes": "Copies @laurastravl's \"I recently discovered 'The Empty Boat Theory'... and it completely changed the way I see people\" (81.4K). On screen: just the hook, split in two lines. Caption shape: name the idea, \"Imagine...\" a concrete scene, what most people would do, \"now imagine\" the flip, \"life is often like that\", then what changed for you. Her setup: one slow, pretty B-roll clip (you looking out, walking, at the desk, the print farm at night), white text centered on screen, an emotional trending song (hers use songs like \"To Build A Home\"). No talking. Pull the clip from the B-roll library.", "fillins": "", "format": "The ___ theory", "fmt": "The ___ theory"}}]}, {"date": "2026-11-22", "dow": "Sun", "kubot": {"format": "Podcast", "title": "Kubot: Podcast", "sub": "Ep. 6: Screens vs building", "hook": "Screens vs building: a teacher's honest take", "badge": "Studio day", "needs": false, "film": [{"what": "Why Build #11 Creator, not just a user", "short": "Why Build #11", "note": "Posts Mon Nov 23.", "ref": "2026-11-23"}, {"what": "Why Build #13 Teamwork", "short": "Why Build #13", "note": "Posts Thu Nov 26.", "ref": "2026-11-26"}, {"what": "Podcast ep. 7", "short": "Podcast ep. 7", "note": "Posts Sun Nov 29.", "ref": "2026-11-29"}], "sections": [["Plan", "rows", [["Episode", "Podcast ep. 6. Full episode on YouTube and Spotify, plus one clip on Kubot."], ["Filmed", "Last Sunday's studio day."]]], ["Inspo", "rows", [["Show", "Founders podcast: weekly build in public episode, 30 to 45 minutes, Denis and Gabriel hosting. Cut into 5 to 8 short clips."], ["This episode", "[topic to pick]. Idea: the best comments and parent questions from the week."]]], ["Shape", "text", "1. Cold open (1 to 2 min): Denis sets up [topic].\n2. Main conversation (15 to 20 min): [topic], with real classroom moments, not slogans.\n3. Week in the build (3 to 5 min): what got done at the store, what broke, what's next.\n4. Kid of the week (optional): a Friday kid explains their robot, with a parent on mic. Only if release-cleared.\n5. What to try tonight (5 min): one tip for parents.\n6. Close (2 min): tease next week."], ["Questions", "list", ["[the best parent question from this week's comments]", "[the second best parent question]", "What broke this week, and what's next before the store opens?", "If a parent has 20 minutes tonight, what should they try?"]], ["Shots", "list", ["Wide two-shot, plus a single on each host", "Print farm and robots visible behind", "Clip targets: one Gabriel line that stands alone, one parent tip for tonight"]], ["Where", "text", "Studio. Audio: the podcast mics, test recording first."], ["Checklist", "check", ["Upload the full episode to YouTube and Spotify", "Cut one clip for Kubot", "Mark 5 to 8 clips for later", "No prices, no pitch", "Reply to comments in the first hour"]]], "s": {"hooks": ["Screens vs building: a teacher's honest take", "Should you take away the iPad?", "Not all screen time is the same.", "What to swap one hour of screen time for", "The screen time question every parent asks"], "body": "DENIS (cold open): Every parent we talk to worries about screens. So we asked Gabriel what he actually thinks.\nDENIS: Is all screen time bad?\nGABRIEL: [his answer]\nDENIS: If a parent wants to swap one hour, what should it be?\nGABRIEL: [his tip]\nDENIS: Store update. [what got done, what's left before December 1st]\nCLIP FOR KUBOT: [Gabriel's best line on screens vs building]", "cta": "Full episode on YouTube and Spotify. What should we ask Gabriel next? Waitlist link in bio.", "src": "Plan v2 podcast segments + parent questions (new episode plan)", "kind": "new", "notes": "Gabriel's answers are his, unscripted. Only the cold open and questions are written.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "Take", "desc": "Founder take or personality read, 30 to 60s", "has": true, "title": "Everyone my age is building an app. I chose concrete.", "s": {"hooks": ["Everyone my age is building an app. I chose concrete.", "I chose concrete."], "body": "I'm 21, and I chose concrete.\n\nFor the last [months] months, I've woken up every day chasing one date on a calendar. December 1.\n\nI thought the hard part would be [what you expected to be hard].\n\nIt wasn't. The hard part was [what was actually hard].\n\n[The moment that almost made you quit, one line.]\n\nWhat I've learned is that the point isn't the opening. It's who you have to become to get the doors open. [Your own version of that line.]", "cta": "Caption: Nine days left", "src": "Rewritten Oct 23 from the inspo transcripts", "kind": "new", "notes": "Copies Mino Lee's \"POV: you chased one number for 13 months\" (416K): one honest monologue, the moment you thought would feel huge, how it actually felt, and the lesson. Every bracket has to be your real feeling, or the video doesn't work. Or pull it from the podcast.", "fillins": "", "format": "Founder take", "fmt": "Founder take"}, "inspiration": ["https://www.instagram.com/reel/Dcy05J2Bypm/", "https://www.instagram.com/reel/Ddk9AwnsSBK/", "https://www.instagram.com/reel/DdmJNQJp81s/"], "th": "Everyone my age is building an app. I chose concrete.", "ith": "POV: you chased money for 13 months straight"}, {"time": "", "label": "Hook test", "desc": "On-screen text over B-roll, 6 to 10s", "has": true, "title": "The biggest lesson I've learnt about getting a yes is that it's NOT one email", "th": "The biggest lesson I've learnt about getting a yes is that it's NOT one email", "ith": "The older I get, the more I realize that the real luxuries in life aren't things. They're time, health, peace of mind...", "inspiration": ["https://www.instagram.com/reel/DdGe93jsQFv/"], "s": {"hooks": ["The biggest lesson I've learnt about getting a yes is that it's NOT one email"], "body": "[On screen, all of it]\nThe biggest lesson I've learnt about getting a yes is that it's NOT one email.\nIt's the follow up, then another one, and still showing up when nobody answers.", "cta": "Caption: What would you add? Send this to someone who needs to hear it.\n\nfollow @denisaverbuk for more", "src": "Hook formats Denis found, written Oct 23", "kind": "new", "notes": "Copies @laurastravl's \"The older I get, the more I realize that the real luxuries in life aren't things. They're time, health, peace of mind...\" (35.3K). The whole message is on screen: the hook, then \"It's ...\" followed by a list. The caption stays short and asks people to add to the list and share it. Her setup: one slow, pretty B-roll clip (you looking out, walking, at the desk, the print farm at night), white text centered on screen, an emotional trending song (hers use songs like \"To Build A Home\"). No talking. Pull the clip from the B-roll library.", "fillins": "", "format": "Biggest lesson is NOT", "fmt": "Biggest lesson is NOT"}}]}, {"date": "2026-11-23", "dow": "Mon", "kubot": {"format": "Why Build", "title": "Kubot: Why Build", "sub": "#11 Creator, not just a user", "hook": "Your kid uses tech every day. Can they build it?", "badge": "", "needs": false, "film": [], "sections": [["Plan", "rows", [["Show", "Why Build? with Gabriel. Gabriel to camera, 45 to 75 seconds."], ["Episode", "#11 Creator, not just a user"], ["Status", "Script drafted below. Gabriel to review before filming."]]], ["Inspo", "rows", [["Development point", "Creator, not just a user"], ["Hook", "Your kid uses tech every day. Can they build it?"], ["Do this tonight", "Open up a broken toy together and see what's inside"]]], ["Shots", "list", ["Gabriel to camera, clean audio", "B-roll: [Friday class moment that shows the point]", "On-screen text: [hook] / [tonight tip]"]], ["Where", "text", "Studio. Filmed on Sunday studio day."], ["Checklist", "check", ["Review the script with Gabriel", "Film on Sunday studio day", "Cut to 45 to 75 seconds", "Add on-screen text and subtitles", "No prices, no pitch", "Post on Kubot"]]], "s": {"hooks": ["Your kid uses tech every day. Can they build it?", "user or creator?", "Your kid can use an iPad. Can they open one up?", "Open a broken toy together tonight.", "Users press buttons. Creators know what's behind them."], "body": "Your kid uses tech every single day.\nCan they build any of it?\nMost kids today are amazing users.\nThey can find anything.\nFix the Wi-Fi faster than us.\nBut using something and understanding it are different.\nThe kid who asks what's inside the remote.\nThe kid who wants to know how the car knows to stop.\nThat's a creator.\nAnd every creator started by opening something up.\nTonight, find a broken toy.\nOr an old remote.\nOpen it together.\nLook at the board, the wires, the motor.\nYou don't need to know what any of it is.\nJust ask, \"what do you think this part does?\"\nWhat did you find inside?", "cta": "Tonight: open a broken toy together and see what's inside. Comment what you found. Waitlist link in bio.", "src": "Plan v2 Why Build bank #11 (Creator, not just a user): hook and tonight tip reused, new body", "kind": "new", "notes": "New body written from the plan v2 episode bank hook and 'do this tonight'. Concept-led, so no story from Gabriel is needed. Gabriel should adjust any line that isn't how he'd say it.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "Countdown", "desc": "Stakes update with a deadline, 30 to 45s", "has": true, "title": "8 days to open the world's first humanoid robot store", "s": {"hooks": ["8 days to open the world's first humanoid robot store", "One week left"], "body": "If this store isn't open in 8 days, [the real consequence, no money figures].\n\nThe problem is, look around. Right now, this room is [mid-build, say what's still missing].\n\nSo here's the plan. By December 1, [what goes where, in your own words].\n\nAnd honestly, that's why everybody my age wants to build software. If your app fails, you just delete the code off your laptop. In physical retail, the rent is due whether your shipment came in or not.\n\n[The one thing that has to happen this week.]\n\nThis is day 60 of 100 in 100. Follow along to see if we actually get the doors open in time. See you tomorrow for day 61.", "cta": "Follow to see if we open December 1", "src": "Rewritten Oct 23 from the inspo transcripts", "kind": "new", "notes": "Copies your own Dec 1 deadline reel (best share rate on the account) and Mino Lee's DAY 1 / DAY 32 vlogs (627K to 651K): the stake first, \"look around\", what this room has to become, the software vs retail line, the day count and \"see you tomorrow\". Save this footage for the opening day before and after.", "fillins": "", "format": "Stakes update", "fmt": "Stakes update"}, "inspiration": ["https://www.instagram.com/reel/C1kzUmsRcEl/", "https://www.instagram.com/reel/C23BpgAvnSH/", "https://www.instagram.com/reel/Ddw9G7eyvfP/"], "th": "8 days to open the world's first humanoid robot store", "ith": "DAY 32 / Building a business in ONE DAY"}, {"time": "", "label": "Hook test", "desc": "On-screen text over B-roll, 6 to 10s", "has": true, "title": "I am 21 and I'm not ashamed to admit that some days I don't know how to fix the robots in my own store.", "th": "I am 21 and I'm not ashamed to admit that some days I don't know how to fix the robots in my own store.", "ith": "I am 29 and I am not ashamed to admit that: (carousel, one honest admission per slide)", "inspiration": ["https://www.instagram.com/reel/DRKG_F5jHmG/"], "s": {"hooks": ["I am 21 and I'm not ashamed to admit that some days I don't know how to fix the robots in my own store."], "body": "[On screen, first line] I am 21 and I'm not ashamed to admit\n\n[Second line] that some days I don't know how\n\n[Third line] to fix the robots in my own store.", "cta": "Caption: People assume because I'm opening a robot store, I know how every robot works. I don't. Half the time I'm on the floor with a manual and my co-founder on the phone. That's the part I want you to see. You don't have to be an expert to start. You become one by starting.\n\nIf you feel the same, you're not alone.\n\nfollow @denisaverbuk for more real talk", "src": "Hook formats Denis found, written Oct 23", "kind": "new", "notes": "Copies @laurastravl's \"I am 29 and I am not ashamed to admit that:\" post. Hook on screen over a casual shot of you, then the honest admission. The caption tells the full story and what you learned. Don't try to sound perfect; the goal is people thinking \"I feel exactly the same.\" Only post the lines that are true for you. Her setup: one slow, pretty B-roll clip (you looking out, walking, at the desk, the print farm at night), white text centered on screen, an emotional trending song (hers use songs like \"To Build A Home\"). No talking. Pull the clip from the B-roll library.", "fillins": "", "format": "I'm 21 and not ashamed", "fmt": "I'm 21 and not ashamed"}}]}, {"date": "2026-11-24", "dow": "Tue", "kubot": {"format": "Denis Builds", "title": "Kubot: Denis Builds", "sub": "Building the first robot for opening day", "hook": "Building the first robot for opening day", "badge": "", "needs": false, "film": [], "sections": [["Plan", "rows", [["Series", "Denis Builds: Denis on camera, building in public."], ["Episode", "Building the first robot for opening day"], ["When to film", "Any time this week."]]], ["Shots", "list", ["Parts laid out on the table, one slow pan", "Build timelapse from a fixed angle", "The first time it works, one take", "Close-up of [the best detail]"]], ["Where", "text", "[where you build]"], ["Checklist", "check", ["Film while you build", "Cut to 30 to 45 seconds", "No prices, no pitch", "Post on Kubot"]]], "s": {"hooks": ["Building the first robot for opening day", "the first robot in the store", "This robot will be the first thing kids see when they walk in.", "Every store needs a first robot.", "One week before opening, I'm building this."], "body": "This is the first robot kids will see when they walk into the store.\nAnd I'm building it this week.\n[B-ROLL: parts laid out]\nWhat it is: [the demo build for opening day].\nWhat it does: [what it does].\n[B-ROLL: build timelapse]\nWhat went wrong: [one honest line].\n[B-ROLL: the first time it works]\nAnd in one week, a kid gets to see it move for the first time.", "cta": "What should the first robot be? Comment it. Waitlist link in bio.", "src": "Denis Builds format (kubot-builds-scripts.md) + store countdown (new script)", "kind": "new", "notes": "", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "How-to", "desc": "How-to list, 40 to 60s", "has": true, "title": "How To Become Incredibly Good At Building In Public", "s": {"hooks": ["How To Become Incredibly Good At Building In Public", "How to get incredibly good at building in public (and I mean actually good)"], "body": "How to become incredibly good at building in public, and I mean actually good. The kind of builder that people can't stop checking on.\n\nNumber one, post the boring days. Researchers call it the labor illusion. People value things more when they can see the work behind them. You're not boring, you're skipping the part they care about.\n\nNumber two, put a deadline on screen. Unfinished things stay open in people's heads. Psychologists call it the Zeigarnik effect. A countdown turns a video into a series.\n\nNumber three, show the losses. Psychologists call it the pratfall effect. Capable people become more likable when they show a mistake. Same update, with and without the thing that went wrong, feels like two different people.\n\nEvery great builder in public does those three, and every one of them kept posting when nobody was watching yet. I'm seven days from opening a store, and I've filmed every day of it.", "cta": "Follow to see if we open December 1", "src": "Rewritten Oct 23 from the inspo transcripts", "kind": "new", "notes": "Copies \"How To Become Incredibly Good At Singing\" (195K on @dennyondabeat) line for line: identity line, exactly three tips, each with a real term and a \"you're not bad, you're just...\" reframe, then \"Every great X does those three\" into your CTA.", "fillins": "", "format": "How to become incredibly good", "fmt": "How to become incredibly good"}, "inspiration": ["https://www.instagram.com/reel/Dd78f_Ixoc4/", "https://www.instagram.com/reel/Dewq11ux5RI/", "https://www.instagram.com/reel/DeIuDFPR_db/"], "th": "How To Become Incredibly Good At Building In Public", "ith": "How To Become Incredibly Good At Singing"}, {"time": "", "label": "Hook test", "desc": "On-screen text over B-roll, 6 to 10s", "has": true, "title": "My co-founder told me about the \"guess, test, try again\" loop and it completely changed the way I fix problems", "th": "My co-founder told me about the \"guess, test, try again\" loop and it completely changed the way I fix problems", "ith": "I recently discovered \"The Empty Boat Theory\"... and it completely changed the way I see people.", "inspiration": ["https://www.instagram.com/reel/DbicgB4sRT4/"], "s": {"hooks": ["My co-founder told me about the \"guess, test, try again\" loop and it completely changed the way I fix problems"], "body": "[On screen, line 1] My co-founder told me about the \"guess, test, try again\" loop...\n\n[Line 2] and it completely changed the way I fix problems.", "cta": "Caption: My co-founder told me about the loop every kid in his classes learns: guess, test, try again.\n\nImagine a robot that won't move. Most people panic. A kid checks the wire. Still nothing, checks the battery. Still nothing, checks the code.\n\nNo drama. Just the loop.\n\nI used to spiral when something broke. Now I just run the loop. It works on robots, and it works on opening a store.\n\nfollow @denisaverbuk for more", "src": "Hook formats Denis found, written Oct 23", "kind": "new", "notes": "Copies @laurastravl's \"I recently discovered 'The Empty Boat Theory'... and it completely changed the way I see people\" (81.4K). On screen: just the hook, split in two lines. Caption shape: name the idea, \"Imagine...\" a concrete scene, what most people would do, \"now imagine\" the flip, \"life is often like that\", then what changed for you. Her setup: one slow, pretty B-roll clip (you looking out, walking, at the desk, the print farm at night), white text centered on screen, an emotional trending song (hers use songs like \"To Build A Home\"). No talking. Pull the clip from the B-roll library.", "fillins": "", "format": "The ___ theory", "fmt": "The ___ theory"}}]}, {"date": "2026-11-25", "dow": "Wed", "kubot": {"format": "Robot on the Street", "title": "Kubot: Robot on the Street", "sub": "Should kids learn to code or learn to build first?", "hook": "Should kids learn to code or learn to build first?", "badge": "", "needs": false, "film": [{"what": "Robot on the Street", "short": "Robot on the Street", "note": "Film today or earlier. Main question: Should kids learn to code or learn to build first?"}], "sections": [["Plan", "rows", [["Series", "Robot on the Street: the robot holds the mic and asks people one short question each."], ["Main question", "Should kids learn to code or learn to build first?"], ["Twist ending", "Gabriel steps in at the end: \"Robots don't teach here. Kids build them.\""], ["Goal", "5 to 6 good answers, a split reaction, then the twist. 30 to 45 seconds."], ["When to film", "Today or earlier."]]], ["Questions", "list", ["Would you let a robot teach your kid?", "Would you rather your kid use robots or build them?", "What should kids learn that school doesn't teach?", "Would your kid rather have an iPad or build a robot?", "Are you scared of AI for your kids?", "What did you build as a kid?", "If a robot could help with one thing at home, what would it be?", "Should kids learn to code or learn to build first?"]], ["Shots", "list", ["Opener: the robot turns to someone, mic up", "Opener line: \"Quick question from a robot. Got 5 seconds?\"", "Each answer: tight on the person, robot mic in frame", "Reactions: people laughing, pointing, filming the robot", "Wide establishing shot of the spot", "Gabriel walking in for the twist, then the line to camera"]], ["Where", "text", "[pick the spot]. Public sidewalks or a park. Ask before filming on private property. Robot at the edge of the walkway, not blocking it."], ["Checklist", "check", ["Pick the spot and time", "Charge the robot and the mic", "Print releases and bring pens", "Quick release from every face used, a parent's for kids", "Never mock anyone's answer", "Get 5 to 6 usable answers", "Film Gabriel's twist line", "Cut to 30 to 45 seconds with subtitles", "No prices, no pitch"]]], "s": {"hooks": ["Should kids learn to code or learn to build first?", "We asked Miami: should kids learn to code or learn to build first?", "A robot asked strangers one question, and the answers get more honest", "People had opinions. Fast.", "Quick question from a robot. Got 5 seconds?"], "body": "ROBOT: Quick question from a robot. Got 5 seconds?\nROBOT: Should kids learn to code or learn to build first?\n[answer 1, word for word]\n[answer 2]\n[answer 3, the one that surprised you]\n[answer 4]\n[answer 5, a kid if there's a signed parent release]\n[B-ROLL: reactions, people filming the robot]\n[the split: who said yes, who said no, in one line]\nGABRIEL (to camera): Robots don't teach here. Kids build them.", "cta": "What would you answer? Comment it. Waitlist link in bio.", "src": "Plan v2 Robot on the Street format + content.py question list (structure reused; answers are real only)", "kind": "adapted", "notes": "Unscripted. Quick release from every face, a parent's for kids. Never mock an answer.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "POV", "desc": "Mostly visual, 20 to 35s", "has": true, "title": "POV: the printers are stocking a store that opens in 6 days", "s": {"hooks": ["POV: the printers are stocking a store that opens in 6 days", "6 days. 12 printers. One night."], "body": "So in 6 days I open a store, and I've become an absolute maniac with these printers. There's 12 of them.\n\nIt's currently [time], I'm about to head home.\n\n[Point] These are printing [what] for the shelves. [Point] These are on [what]. I should wake up with [number] of them.\n\nThis is insane. Last night they printed [what], and it's already on the wall.\n\n[Timelapse]\n\n[Morning: carry the parts to the shelves]", "cta": "Follow to see if we open December 1", "src": "Rewritten Oct 23 from the inspo transcripts", "kind": "new", "notes": "Copies Mino Lee's \"POV: Claude is editing 7 reels while I sleep\" (293K). His exact shape: \"So I just discovered X and I've become an absolute maniac with it\", how many of them there are, the time on the clock, what each one is doing right now, what you'll wake up to, what happened last night, then the comment CTA. Filmed handheld at night, talking fast.", "fillins": "", "format": "POV, mostly visual", "fmt": "POV, mostly visual"}, "inspiration": ["https://www.instagram.com/reel/DegXneUNOip/", "https://www.instagram.com/reel/DejCX63y2LM/"], "th": "POV: the printers are stocking a store that opens in 6 days", "ith": "POV: Claude is editing 7 REELS while i sleep (idek how to code)"}, {"time": "", "label": "Hook test", "desc": "On-screen text over B-roll, 6 to 10s", "has": true, "title": "The biggest lesson I've learnt about building in public is that it's NOT showing your wins", "th": "The biggest lesson I've learnt about building in public is that it's NOT showing your wins", "ith": "The older I get, the more I realize that the real luxuries in life aren't things. They're time, health, peace of mind...", "inspiration": ["https://www.instagram.com/reel/DdGe93jsQFv/"], "s": {"hooks": ["The biggest lesson I've learnt about building in public is that it's NOT showing your wins"], "body": "[On screen, all of it]\nThe biggest lesson I've learnt about building in public is that it's NOT showing your wins.\nIt's the days something breaks, the plans that changed, and the stuff you'd normally hide.", "cta": "Caption: What would you add? Send this to someone who needs to hear it.\n\nfollow @denisaverbuk for more", "src": "Hook formats Denis found, written Oct 23", "kind": "new", "notes": "Copies @laurastravl's \"The older I get, the more I realize that the real luxuries in life aren't things. They're time, health, peace of mind...\" (35.3K). The whole message is on screen: the hook, then \"It's ...\" followed by a list. The caption stays short and asks people to add to the list and share it. Her setup: one slow, pretty B-roll clip (you looking out, walking, at the desk, the print farm at night), white text centered on screen, an emotional trending song (hers use songs like \"To Build A Home\"). No talking. Pull the clip from the B-roll library.", "fillins": "", "format": "Biggest lesson is NOT", "fmt": "Biggest lesson is NOT"}}]}, {"date": "2026-11-26", "dow": "Thu", "kubot": {"format": "Why Build", "title": "Kubot: Why Build", "sub": "#13 Teamwork", "hook": "Two kids, one robot. Watch what happens", "badge": "", "needs": false, "film": [], "sections": [["Plan", "rows", [["Show", "Why Build? with Gabriel. Gabriel to camera, 45 to 75 seconds."], ["Episode", "#13 Teamwork"], ["Status", "Script drafted below. Gabriel to review before filming."]]], ["Inspo", "rows", [["Development point", "Teamwork"], ["Hook", "Two kids, one robot. Watch what happens"], ["Do this tonight", "Give siblings or friends one shared build"]]], ["Shots", "list", ["Gabriel to camera, clean audio", "B-roll: [Friday class moment that shows the point]", "On-screen text: [hook] / [tonight tip]"]], ["Where", "text", "Studio. Filmed on Sunday studio day."], ["Checklist", "check", ["Review the script with Gabriel", "Film on Sunday studio day", "Cut to 45 to 75 seconds", "Add on-screen text and subtitles", "No prices, no pitch", "Post on Kubot"]]], "s": {"hooks": ["Two kids, one robot. Watch what happens", "two kids, one robot", "Give two kids one build and watch.", "Teamwork isn't taught in a lecture.", "The fastest way to teach sharing"], "body": "Two kids.\nOne robot.\nWatch what happens.\nAt first, they both want the controller.\nThen someone has to hold the wheel while the other one screws it in.\nThen one is better at wiring and one is better at the design.\nNobody told them to split it up.\nThe build did.\nHonestly, that's how teamwork actually gets learned.\nNot by being told to share.\nBy needing someone else to finish the thing you care about.\nThe kid who says \"hold this\".\nThe kid who says \"let me try\".\nTonight, give siblings or friends one shared build.\nOne kit. One goal.\nThen stay out of it.\nWho took charge?", "cta": "Tonight: give siblings or friends one shared build. Comment who took charge. Waitlist link in bio.", "src": "Plan v2 Why Build bank #13 (Teamwork): hook and tonight tip reused, new body", "kind": "new", "notes": "New body written from the plan v2 episode bank hook and 'do this tonight'. Concept-led, so no story from Gabriel is needed. Gabriel should adjust any line that isn't how he'd say it.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "Breakdown", "desc": "Lav mic to camera with the clip playing in the corner, 40 to 55s", "has": true, "title": "This robot video got 9 million views (the hook never mentions the robot)", "s": {"hooks": ["This robot video got 9 million views (the hook never mentions the robot)", "Why this robot video got 9 million views"], "body": "[Clip 1 plays in the corner: the Stanford robot video.]\n\nYou watch that and you go, is he actually that smart? How badly is the robot gonna humble him?\n\n[Clip 2: a robot backflip video.]\n\nYou watch that and you go... nothing. You scroll.\n\nThis one literally puts the question in the hook. \"The smartest student at Stanford.\" 9 million views.\n\nEvery great robot video creates a question. If viewers aren't asking a question, they won't watch to get the answer. The person is the question. The robot is the answer.\n\nSo when I make robot videos, that's the rule. And if you want to see mine, follow me.", "cta": "Caption: Credit @roberttherobot", "src": "Rewritten Oct 23 from the inspo transcripts", "kind": "new", "notes": "Copies Robert McKeaveney's \"Every great hook creates a question\" (347K): \"you watch that and you go...\" over each clip, then the rule, then follow. Credit the original account on screen and in the caption.", "fillins": "", "format": "Viral breakdown (clip in corner)", "fmt": "Viral breakdown (clip in corner)"}, "inspiration": ["https://www.instagram.com/reel/DbqupC5OwYb/", "https://www.instagram.com/reel/DexwuW4uC_O/", "https://www.instagram.com/reel/DeYZ_aVz-h4/", "https://www.instagram.com/reel/Den3cb_szfi/"], "th": "This robot video got 9 million views (the hook never mentions the robot)", "ith": "Great hook = question"}, {"time": "", "label": "Hook test", "desc": "On-screen text over B-roll, 6 to 10s", "has": true, "title": "I am 21 and I'm not ashamed to admit that I get jealous when people my age go viral with less effort.", "th": "I am 21 and I'm not ashamed to admit that I get jealous when people my age go viral with less effort.", "ith": "I am 29 and I am not ashamed to admit that: (carousel, one honest admission per slide)", "inspiration": ["https://www.instagram.com/reel/DRKG_F5jHmG/"], "s": {"hooks": ["I am 21 and I'm not ashamed to admit that I get jealous when people my age go viral with less effort."], "body": "[On screen, first line] I am 21 and I'm not ashamed to admit\n\n[Second line] that I get jealous\n\n[Third line] when people my age go viral with less effort.", "cta": "Caption: I've spent days on a video that did nothing, then watched someone my age blow up from a ten second clip. It makes me jealous. I'm not proud of it. But jealousy is just information. It shows you what you want. Then you go build it.\n\nIf you feel the same, you're not alone.\n\nfollow @denisaverbuk for more real talk", "src": "Hook formats Denis found, written Oct 23", "kind": "new", "notes": "Copies @laurastravl's \"I am 29 and I am not ashamed to admit that:\" post. Hook on screen over a casual shot of you, then the honest admission. The caption tells the full story and what you learned. Don't try to sound perfect; the goal is people thinking \"I feel exactly the same.\" Only post the lines that are true for you. Her setup: one slow, pretty B-roll clip (you looking out, walking, at the desk, the print farm at night), white text centered on screen, an emotional trending song (hers use songs like \"To Build A Home\"). No talking. Pull the clip from the B-roll library.", "fillins": "", "format": "I'm 21 and not ashamed", "fmt": "I'm 21 and not ashamed"}}]}, {"date": "2026-11-27", "dow": "Fri", "kubot": {"format": "Denis Builds", "title": "Kubot: Denis Builds", "sub": "Thanksgiving week: four days out", "hook": "Four days until the doors open", "badge": "Hero shoot 3:30 to 5 PM, Bal Harbour", "needs": false, "film": [{"what": "Kubot class, 3:30 to 5 PM, Bal Harbour", "note": "Hero shoot. Film testimonials and b-roll. Gabriel teaches, Denis films.", "sections": [["Capture list", "list", ["Door: signed parent photo and video release before any face is used", "Wide of the room before kids arrive", "Hands on CyberBricks and 3D printed parts (vertical and horizontal)", "Gabriel teaching: hands, face, parts, kids reacting", "A build failing, then a kid fixing it", "The first time a robot moves, plus the kid's face", "Wide room shots once it's full", "Pickup: a kid showing the build to a parent", "Parent answer at pickup (release-cleared only): \"What did you notice in your kid today?\" Get 2 to 3 clean answers for Saturday"]], ["Rules", "text", "No scripted kid interviews. No prices, no pitch. First names only, no school names. After class, confirm which faces are release-cleared before the edit."]], "short": "Class 3:30 to 5 PM, Bal Harbour"}], "sections": [["Plan", "rows", [["Series", "Denis Builds: Denis on camera, building in public."], ["Episode", "What got done at the store this week, what broke, what's next."], ["When to film", "Any time this week."]]], ["Shots", "list", ["Denis to camera at the store", "B-roll: [what got done]", "Close-up: [one detail]"]], ["Where", "text", "[where you're filming]"], ["Checklist", "check", ["Film during the week", "Cut to 30 to 45 seconds", "No prices, no pitch", "Post on Kubot"]]], "s": {"hooks": ["Four days until the doors open", "four days out", "Thanksgiving week, four days to go.", "Here's what four days before opening looks like.", "Almost."], "body": "Four days until the doors open.\n[B-ROLL: the store today]\nWhat got done: [what got done this week].\nWhat broke: [what broke, one honest line].\nWhat's next: [what's next before December 1st].\n[B-ROLL: one detail close up]\nMost founders only post the wins.\nAnd I think the broken part is the part worth watching.", "cta": "Follow along to see if we get the doors open. Waitlist link in bio.", "src": "Store build update format (content.py, hub posts.json Oct 30) with a new weekly angle", "kind": "adapted", "notes": "Real progress only. No prices, no lease or money details.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "List", "desc": "Collage list, 30 to 45s", "has": true, "title": "4 Disgustingly Effective Ways To Stay Locked In When Nothing Is Working", "s": {"hooks": ["4 Disgustingly Effective Ways To Stay Locked In When Nothing Is Working", "How I stay locked in when nothing is working"], "body": "4 disgustingly easy ways to stay locked in when nothing is working.\n\nNumber one, shrink the goal to today. Psychologists call it the goal gradient effect. You push harder the closer the finish line feels. So make the finish line tonight.\n\nNumber two, write down what you did, not what you didn't. Harvard researchers call it the progress principle. Small wins are the biggest driver of motivation.\n\nNumber three, get out of the room. A Stanford study found people came up with way more creative ideas while walking than sitting. The answer is rarely at the same desk.\n\nNumber four, tell someone the deadline. You'll let yourself down. You won't let them down.\n\nI open a store in four days. [What's not working right now, one honest line.] This is what I'm doing.", "cta": "Caption: Save this for the week nothing works", "src": "Rewritten Oct 23 from the inspo transcripts", "kind": "new", "notes": "Copies \"4 disgustingly easy ways to find your sound\" (@dennyondabeat, 21.4K and 34.9K): each way is a command, a named psychology term, what to do and a punchline.", "fillins": "", "format": "Collage list", "fmt": "Collage list"}, "inspiration": ["https://www.instagram.com/reel/DeN7BrIRzTb/", "https://www.instagram.com/reel/DeNyQlKsF_j/", "https://www.instagram.com/reel/DdmJNQJp81s/"], "th": "4 Disgustingly Effective Ways To Stay Locked In When Nothing Is Working", "ith": "4 Disgustingly Effective Ways To Find Your Own Sound As An Artist"}, {"time": "", "label": "Hook test", "desc": "On-screen text over B-roll, 6 to 10s", "has": true, "title": "My favorite creator told me about \"the audience decides quality\" and it completely changed the way I edit my videos", "th": "My favorite creator told me about \"the audience decides quality\" and it completely changed the way I edit my videos", "ith": "I recently discovered \"The Empty Boat Theory\"... and it completely changed the way I see people.", "inspiration": ["https://www.instagram.com/reel/DbicgB4sRT4/"], "s": {"hooks": ["My favorite creator told me about \"the audience decides quality\" and it completely changed the way I edit my videos"], "body": "[On screen, line 1] My favorite creator told me about \"the audience decides quality\"...\n\n[Line 2] and it completely changed the way I edit my videos.", "cta": "Caption: My favorite creator, Caleb Ralston, says you don't decide what quality is. Your audience does.\n\nImagine spending six hours perfecting a video, and a rough one you filmed in five minutes does ten times better.\n\nThat happened to me more than once.\n\nNow I post, watch what works, and put my effort there instead of polishing things nobody asked for.\n\nfollow @denisaverbuk for more", "src": "Hook formats Denis found, written Oct 23", "kind": "new", "notes": "Copies @laurastravl's \"I recently discovered 'The Empty Boat Theory'... and it completely changed the way I see people\" (81.4K). On screen: just the hook, split in two lines. Caption shape: name the idea, \"Imagine...\" a concrete scene, what most people would do, \"now imagine\" the flip, \"life is often like that\", then what changed for you. Her setup: one slow, pretty B-roll clip (you looking out, walking, at the desk, the print farm at night), white text centered on screen, an emotional trending song (hers use songs like \"To Build A Home\"). No talking. Pull the clip from the B-roll library.", "fillins": "", "format": "The ___ theory", "fmt": "The ___ theory"}}]}, {"date": "2026-11-28", "dow": "Sat", "kubot": {"format": "Testimonial", "title": "Kubot: Testimonial", "sub": "From Fri Nov 27 class", "hook": "They walked in with a pile of parts.", "badge": "", "needs": false, "film": [], "sections": [["Plan", "rows", [["Series", "Testimonial: a kid at pickup showing their parent what they built, then one honest sentence from the parent. Unscripted, never staged."], ["Source", "Footage from the Fri Nov 27 class (Bal Harbour)."], ["Hook options", "\"Watch [his or her] face when [he or she] shows [mom or dad]\" or \"I asked a [mom or dad] what changed in [her or his] [son or daughter]\". Use the real kid and parent."], ["Who", "[parent first name] and [kid first name]. First names only."], ["Goal", "One honest answer a parent watching can relate to. 25 to 35 seconds."]]], ["Questions", "list", ["What did you notice in your kid today?", "What did [kid] tell you about the build on the way out?", "What is something [kid] built that surprised you?", "How does [kid] talk about building now?", "In one sentence, what did building give [kid]?"]], ["Shots", "list", ["Kid running up with the build", "Kid explaining it to the parent", "Parent's face as the robot moves", "The parent's one sentence", "Close-up of the build in the kid's hands"]], ["Where", "text", "Bal Harbour class footage from Friday."], ["Checklist", "check", ["Pick the pickup moment from Friday's footage", "Confirm the signed release for kid and parent", "First names only, no school names", "Cut to 25 to 35 seconds with subtitles", "No prices, no pitch", "Post on Kubot"]]], "s": {"hooks": ["They walked in with a pile of parts.", "Pieces in. Robot out.", "Watch [his or her] face when [he or she] shows [mom or dad]", "We asked a kid how their robot works.", "This is what a Friday class looks like."], "body": "[B-ROLL: kid running up to the parent with the build]\nKID: [what the kid says about the build, word for word]\n[B-ROLL: the robot moving, the parent's face]\nPARENT (answering \"What did you notice in your kid today?\"): [the parent's answer, word for word]\n[B-ROLL: close up of the build in the kid's hands]\nON-SCREEN: [parent's first name] and [kid's first name], after the Fri Nov 27 class.", "cta": "What did your kid build first? Comment it. Or send us their drawing.", "src": "Plan v2 Real Families + kubot-details.json hook options + hub posts.json pickup posts (structure reused; words are real only)", "kind": "adapted", "notes": "Never staged or scripted. Signed release for kid and parent, first names only, no schools.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "Robot", "desc": "Robot plus people reacting, 30 to 60s", "has": true, "title": "Can you beat a humanoid robot at [challenge]?", "s": {"hooks": ["Can you beat a humanoid robot at [challenge]?", "Nobody in Wynwood could beat this robot"], "body": "[No voiceover. Trending audio.]\n\nON SCREEN: Can you beat a humanoid robot at [challenge]?\n\n[Robot sets the score first. Scoreboard on screen: ROBOT [score].]\n\n[Stranger 1 tries. Scoreboard updates.]\n\n[Stranger 2 tries.]\n\n[Stranger 3, the one who almost wins.]\n\nON SCREEN: Final: ROBOT [score], MIAMI [best score]. Think you could beat it?", "cta": "Caption: Think you could beat it? Comment your score.", "src": "Rewritten Oct 23 from the inspo transcripts", "kind": "new", "notes": "Copies Robert McKeaveney's pull-up challenge (6.2M, 9.8K comments) and muscle-up challenge: no voiceover, a trending audio, the challenge on screen and a running scoreboard. Everyone thinks they could do better, which is what drives the comments. Pick something your robot can genuinely do on camera and test it first.", "fillins": "", "format": "Robot challenge", "fmt": "Robot challenge"}, "inspiration": ["https://www.instagram.com/reel/DeQeTsUzzc4/", "https://www.instagram.com/reel/Deviwtgzxzi/", "https://www.instagram.com/reel/DbqupC5OwYb/"], "th": "Can you beat a humanoid robot at [challenge]?", "ith": "None on screen. Robert McKeaveney's pull-up challenge runs on subtitles and the attempt itself."}, {"time": "", "label": "Hook test", "desc": "On-screen text over B-roll, 6 to 10s", "has": true, "title": "The biggest lesson I've learnt about hiring is that it's NOT about skills", "th": "The biggest lesson I've learnt about hiring is that it's NOT about skills", "ith": "The older I get, the more I realize that the real luxuries in life aren't things. They're time, health, peace of mind...", "inspiration": ["https://www.instagram.com/reel/DdGe93jsQFv/"], "s": {"hooks": ["The biggest lesson I've learnt about hiring is that it's NOT about skills"], "body": "[On screen, all of it]\nThe biggest lesson I've learnt about hiring is that it's NOT about skills.\nIt's people who take feedback, show up, want to learn, and make the room better.", "cta": "Caption: What would you add? Send this to someone who needs to hear it.\n\nfollow @denisaverbuk for more", "src": "Hook formats Denis found, written Oct 23", "kind": "new", "notes": "Copies @laurastravl's \"The older I get, the more I realize that the real luxuries in life aren't things. They're time, health, peace of mind...\" (35.3K). The whole message is on screen: the hook, then \"It's ...\" followed by a list. The caption stays short and asks people to add to the list and share it. Her setup: one slow, pretty B-roll clip (you looking out, walking, at the desk, the print farm at night), white text centered on screen, an emotional trending song (hers use songs like \"To Build A Home\"). No talking. Pull the clip from the B-roll library.", "fillins": "", "format": "Biggest lesson is NOT", "fmt": "Biggest lesson is NOT"}}]}, {"date": "2026-11-29", "dow": "Sun", "kubot": {"format": "Podcast", "title": "Kubot: Podcast", "sub": "Ep. 7: One week out: building a store in public", "hook": "Two days until we open", "badge": "Studio day", "needs": false, "film": [{"what": "Why Build #15 Pride in their work", "short": "Why Build #15", "note": "Posts Mon Nov 30.", "ref": "2026-11-30"}, {"what": "Why Build #17 Starting age", "short": "Why Build #17", "note": "Posts Thu Dec 3.", "ref": "2026-12-03"}, {"what": "Podcast ep. 8", "short": "Podcast ep. 8", "note": "Posts Sun Dec 6.", "ref": "2026-12-06"}], "sections": [["Plan", "rows", [["Episode", "Podcast ep. 7. Full episode on YouTube and Spotify, plus one clip on Kubot."], ["Filmed", "Last Sunday's studio day."]]], ["Inspo", "rows", [["Show", "Founders podcast: weekly build in public episode, 30 to 45 minutes, Denis and Gabriel hosting. Cut into 5 to 8 short clips."], ["This episode", "[topic to pick]. Idea: the best comments and parent questions from the week."]]], ["Shape", "text", "1. Cold open (1 to 2 min): Denis sets up [topic].\n2. Main conversation (15 to 20 min): [topic], with real classroom moments, not slogans.\n3. Week in the build (3 to 5 min): what got done at the store, what broke, what's next.\n4. Kid of the week (optional): a Friday kid explains their robot, with a parent on mic. Only if release-cleared.\n5. What to try tonight (5 min): one tip for parents.\n6. Close (2 min): tease next week."], ["Questions", "list", ["[the best parent question from this week's comments]", "[the second best parent question]", "What broke this week, and what's next before the store opens?", "If a parent has 20 minutes tonight, what should they try?"]], ["Shots", "list", ["Wide two-shot, plus a single on each host", "Print farm and robots visible behind", "Clip targets: one Gabriel line that stands alone, one parent tip for tonight"]], ["Where", "text", "Studio. Audio: the podcast mics, test recording first."], ["Checklist", "check", ["Upload the full episode to YouTube and Spotify", "Cut one clip for Kubot", "Mark 5 to 8 clips for later", "No prices, no pitch", "Reply to comments in the first hour"]]], "s": {"hooks": ["Two days until we open", "We open in two days. Here's everything we got wrong.", "Building a store in public, the honest version", "What we'd do differently", "Almost open"], "body": "DENIS (cold open): We open the doors in two days. This is the last episode before that.\nDENIS: Gabriel, what are you most nervous about?\nGABRIEL: [his answer]\nDENIS: What's the thing that went wrong that nobody saw?\n[both answer, real only]\nDENIS: What do you want a kid to feel the first time they walk in?\nGABRIEL: [his answer]\nCLIP FOR KUBOT: [the best line about the first kid walking in]", "cta": "Full episode on YouTube and Spotify. What should we ask Gabriel next? Waitlist link in bio.", "src": "Plan v2 podcast segments + parent questions (new episode plan)", "kind": "new", "notes": "Gabriel's answers are his, unscripted. Only the cold open and questions are written.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "Take", "desc": "Founder take or personality read, 30 to 60s", "has": true, "title": "Your first robot toy says something disturbingly specific about you", "s": {"hooks": ["Your first robot toy says something disturbingly specific about you", "Your first robot toy tells me something about your personality (2000s kid edition)"], "body": "Your first robot toy says a lot more about how you work today than you think.\n\nIf you had Lego, you probably like following the instructions once, then throwing them away. Studies link building toys as a kid to stronger spatial skills. That can show up in engineering, design, architecture, or anything you build from scratch.\n\nIf you had a Furby, you probably cared more about the personality than the parts. That can show up in marketing, content, sales, anything where people are the point.\n\nIf you had Transformers, you liked things that turn into something else. That can show up in founders, product people, anyone who can't leave something the way it is.\n\nThe toys you played with as a kid were an early sign of how you were wired to build. But as grades, money and fitting in got involved, how you build may have slowly changed without you noticing.\n\nSo I'm not saying you gotta go buy Lego again, but maybe you should question what you're building now.", "cta": "Caption: Which one were you?", "src": "Rewritten Oct 23 from the inspo transcripts", "kind": "new", "notes": "Copies your own \"your childhood sport says a lot about you\" (529K): three groups, what each says about how you're wired, the job it shows up in, then \"I'm not saying you gotta go back, but maybe you should question...\"", "fillins": "", "format": "Personality read", "fmt": "Personality read"}, "inspiration": ["https://www.instagram.com/reel/DZRSDmKO_-o/", "https://www.instagram.com/reel/DeTLLuYxMo9/", "https://www.instagram.com/reel/DeBE-NzRUXf/"], "th": "Your first robot toy says something disturbingly specific about you", "ith": "What Your Favorite Artist Says About You (Oasis Edition)"}, {"time": "", "label": "Hook test", "desc": "On-screen text over B-roll, 6 to 10s", "has": true, "title": "I am 21 and I'm not ashamed to admit that in two days I open a store, and I'm terrified.", "th": "I am 21 and I'm not ashamed to admit that in two days I open a store, and I'm terrified.", "ith": "I am 29 and I am not ashamed to admit that: (carousel, one honest admission per slide)", "inspiration": ["https://www.instagram.com/reel/DRKG_F5jHmG/"], "s": {"hooks": ["I am 21 and I'm not ashamed to admit that in two days I open a store, and I'm terrified."], "body": "[On screen, first line] I am 21 and I'm not ashamed to admit\n\n[Second line] that in two days I open a store,\n\n[Third line] and I'm terrified.", "cta": "Caption: For two months I've filmed every step of this. In two days the doors open. I keep thinking about everything that could go wrong. But I've also learned that the fear is loudest right before you do the thing. So I'm going to do the thing. See you December 1.\n\nIf you feel the same, you're not alone.\n\nfollow @denisaverbuk for more real talk", "src": "Hook formats Denis found, written Oct 23", "kind": "new", "notes": "Copies @laurastravl's \"I am 29 and I am not ashamed to admit that:\" post. Hook on screen over a casual shot of you, then the honest admission. The caption tells the full story and what you learned. Don't try to sound perfect; the goal is people thinking \"I feel exactly the same.\" Only post the lines that are true for you. Her setup: one slow, pretty B-roll clip (you looking out, walking, at the desk, the print farm at night), white text centered on screen, an emotional trending song (hers use songs like \"To Build A Home\"). No talking. Pull the clip from the B-roll library.", "fillins": "", "format": "I'm 21 and not ashamed", "fmt": "I'm 21 and not ashamed"}}]}, {"date": "2026-11-30", "dow": "Mon", "kubot": {"format": "Why Build", "title": "Kubot: Why Build", "sub": "#15 Pride in their work", "hook": "Kids keep what they make. They forget what they're given", "badge": "", "needs": false, "film": [], "sections": [["Plan", "rows", [["Show", "Why Build? with Gabriel. Gabriel to camera, 45 to 75 seconds."], ["Episode", "#15 Pride in their work"], ["Status", "Script drafted below. Gabriel to review before filming."]]], ["Inspo", "rows", [["Development point", "Pride in their work"], ["Hook", "Kids keep what they make. They forget what they're given"], ["Do this tonight", "Display one thing they made where guests can see it"]]], ["Shots", "list", ["Gabriel to camera, clean audio", "B-roll: [Friday class moment that shows the point]", "On-screen text: [hook] / [tonight tip]"]], ["Where", "text", "Studio. Filmed on Sunday studio day."], ["Checklist", "check", ["Review the script with Gabriel", "Film on Sunday studio day", "Cut to 45 to 75 seconds", "Add on-screen text and subtitles", "No prices, no pitch", "Post on Kubot"]]], "s": {"hooks": ["Kids keep what they make. They forget what they're given", "kids keep what they make", "Your kid will forget the toy you bought. They won't forget this.", "Put it where guests can see it.", "The proudest kid in the room built something."], "body": "Kids keep what they make.\nThey forget what they're given.\nThink about it.\nHow many toys from last year can your kid even name?\nNow ask them about something they built.\nThey'll tell you every part.\nWhat broke.\nHow they fixed it.\nThe kid who carries the robot to the car.\nThe kid who shows it to everyone at dinner.\nThat's pride.\nThe good kind.\nPride in something they did, not something they got.\nTonight, take one thing your kid made.\nA drawing. A build. Anything.\nPut it somewhere guests will see it.\nWatch what happens when someone asks about it.\nWhat's the thing your kid is proudest of?", "cta": "Tonight: display one thing they made where guests can see it. Send us a photo or drawing of it. Waitlist link in bio.", "src": "Plan v2 Why Build bank #15 (Pride in their work): hook and tonight tip reused, new body", "kind": "new", "notes": "New body written from the plan v2 episode bank hook and 'do this tonight'. Concept-led, so no story from Gabriel is needed. Gabriel should adjust any line that isn't how he'd say it.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "Countdown", "desc": "Stakes update with a deadline, 30 to 45s", "has": true, "title": "Tomorrow I open the world's first humanoid robot store", "s": {"hooks": ["Tomorrow I open the world's first humanoid robot store", "1 day left"], "body": "Okay, it's day 67 of 100 in 100, and tomorrow I open a store. It's [time] the night before.\n\n[The before footage you saved from October: the empty room.] This is what it looked like 66 days ago.\n\n[Turn the camera around.] This is what it looks like right now.\n\nWe still have to [what's left tonight]. I'm [how you honestly feel].\n\nNo matter what happens tomorrow, [what you're proud of].\n\nI'll see you tomorrow for day 68. Opening day.", "cta": "Follow to see opening d The Empty Boat Theory'... and it completely changed the way I see people\" (81.4K). On screen: just the hook, split in two lines. Caption shape: name the idea, \"Imagine...\" a concrete scene, what most people would do, \"now imagine\" the flip, \"life is often like that\", then what changed for you. Her setup: one slow, pretty B-roll clip (you looking out, walking, at the desk, the print farm at night), white text centered on screen, an emotional trending song (hers use songs like \"To Build A Home\"). No talking. Pull the clip from the B-roll library.", "fillins": "", "format": "The ___ theory", "fmt": "The ___ theory"}}]}, {"date": "2026-12-01", "dow": "Tue", "kubot": {"format": "Denis Builds", "title": "Kubot: Denis Builds", "sub": "The doors open today", "hook": "The doors open today", "badge": "", "needs": false, "film": [], "sections": [["Today", "text", "The Kubot store opens today."], ["Plan", "rows", [["Series", "Denis Builds: Denis on camera, building in public."], ["Episode", "The doors open today"], ["When to film", "Any time this week."]]], ["Shots", "list", ["Parts laid out on the table, one slow pan", "Build timelapse from a fixed angle", "The first time it works, one take", "Close-up of [the best detail]"]], ["Where", "text", "[where you build]"], ["Checklist", "check", ["Film while you build", "Cut to 30 to 45 seconds", "No prices, no pitch", "Post on Kubot"]]], "s": {"hooks": ["The doors open today", "doors open today", "Today, the empty room gets its first kid.", "We open today.", "Opening day."], "body": "Today the doors open.\n[B-ROLL: the store, morning, before anyone arrives]\nA few months ago, this was an empty room.\n[B-ROLL: the empty room footage from October]\nNow it's [what it looks like today].\n[B-ROLL: printers, robots, the build tables]\nThe first kid walks in at [time].\nAnd this is what we built it for.", "cta": "Link in bio. Thank you for following the empty room.", "src": "Store countdown series, final episode (new script)", "ki
