ds. Never mock an answer.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "POV", "desc": "Mostly visual, 20 to 35s", "has": false, "title": "My comments control 12 3D printers (part 3)", "s": {"fmt": "Comments control the farm"}, "sections": [["Idea", "rows", [["On-screen hook", "My comments control 12 3D printers (part 3)"], ["Why it works", "Comments choose the print, so every episode sets up the next one. POV hooks drove Mino's 187K to 416K reels."], ["Notes", "Print the most liked comment from last week."]]]], "inspiration": ["https://www.instagram.com/reel/DegXneUNOip/", "https://www.instagram.com/reel/DejCX63y2LM/"], "th": "My comments control 12 3D printers (part 3)", "ith": "POV: Claude is editing 7 REELS while i sleep (idek how to code)"}]}, {"date": "2026-11-12", "dow": "Thu", "kubot": {"format": "Why Build", "title": "Kubot: Why Build", "sub": "#7 Creativity", "hook": "Your kid doesn't need more toys. They need this", "badge": "", "needs": false, "film": [], "sections": [["Plan", "rows", [["Show", "Why Build? with Gabriel. Gabriel to camera, 45 to 75 seconds."], ["Episode", "#7 Creativity"], ["Status", "Script drafted below. Gabriel to review before filming."]]], ["Inspo", "rows", [["Development point", "Creativity"], ["Hook", "Your kid doesn't need more toys. They need this"], ["Do this tonight", "Give them cardboard and tape and no instructions"]]], ["Shots", "list", ["Gabriel to camera, clean audio", "B-roll: [Friday class moment that shows the point]", "On-screen text: [hook] / [tonight tip]"]], ["Where", "text", "Studio. Filmed on Sunday studio day."], ["Checklist", "check", ["Review the script with Gabriel", "Film on Sunday studio day", "Cut to 45 to 75 seconds", "Add on-screen text and subtitles", "No prices, no pitch", "Post on Kubot"]]], "s": {"hooks": ["Your kid doesn't need more toys. They need this", "your kid doesn't need more toys", "Cardboard, tape, no instructions.", "The best toy has no instructions.", "Creativity isn't taught. It's allowed."], "body": "Your kid doesn't need more toys.\nThey need this.\nA box.\nSome tape.\nAnd no instructions.\nHonestly, most toys come with the idea already inside.\nHere's the car. Here's how it goes.\nThe kid just follows along.\nBut hand a kid a pile of parts with no picture on the box.\nThe kid who builds a car.\nThe kid who builds a car with wings.\nThe kid who builds something nobody has a name for.\nThat's creativity.\nIt isn't something you teach.\nIt's something you stop getting in the way of.\nTonight, give them cardboard and tape.\nNo instructions.\nWalk away for twenty minutes.\nWhat did your kid make?", "cta": "Tonight: cardboard, tape, no instructions. Send us a photo or a drawing of what they made. Waitlist link in bio.", "src": "Plan v2 Why Build bank #7 (Creativity): hook and tonight tip reused, new body", "kind": "new", "notes": "New body written from the plan v2 episode bank hook and 'do this tonight'. Concept-led, so no story from Gabriel is needed. Gabriel should adjust any line that isn't how he'd say it.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "News", "desc": "Split screen robot news, 40 to 60s", "has": false, "title": "This robot is disturbingly good at [X]", "s": {"fmt": "Robot news breakdown"}, "sections": [["Idea", "rows", [["On-screen hook", "This robot is disturbingly good at [X]"], ["Other hooks to test", "Would you let this fold your laundry?\nNobody is talking about this robot launch"], ["Story to cover", "A new humanoid or robot arm demo from that week. Check the corner for \"autonomous\" and \"1x\"."], ["Script template", "[Question hook that puts the product in their life]\n[Company], a [city or backer] startup, just launched [product].\nIt [what it does, in one line].\nHere's the part nobody's talking about: [the catch].\n[One detail that makes it real: how it works or when it ships]\nIt costs [comparison, e.g. less than half of its biggest rival]. No exact prices.\nI'm opening a humanoid robot store, so here's my take: [would you stock it, one line].\nWould you let this in your house?"], ["How to film", "Top half: the company's official launch footage, credited in the caption. Bottom half: you at the podcast mic, eye level, plain background. Pick the biggest robotics or 3D printing launch of that week and read the company's own announcement before filming. Verify every fact. Film the same week the news drops, or swap in a newer story."], ["Why it works", "Rowan Cheung's split screen breakdowns pull 28K to 64K likes and 1K+ reposts. You add what he can't: the take of someone who actually sells robots."]]]], "inspiration": ["https://www.instagram.com/reel/Da3U7H-O-UZ/", "https://www.instagram.com/reel/DYfQ9rdui0n/"], "th": "This robot is disturbingly good at [X]", "ith": "None on screen. Rowan uses subtitles over split screen launch footage."}]}, {"date": "2026-11-13", "dow": "Fri", "kubot": {"format": "Denis Builds", "title": "Kubot: Denis Builds", "sub": "What broke this week", "hook": "What broke this week", "badge": "Hero shoot 3:30 to 5 PM, Bal Harbour", "needs": false, "film": [{"what": "Kubot class, 3:30 to 5 PM, Bal Harbour", "note": "Hero shoot. Film testimonials and b-roll. Gabriel teaches, Denis films.", "sections": [["Capture list", "list", ["Door: signed parent photo and video release before any face is used", "Wide of the room before kids arrive", "Hands on CyberBricks and 3D printed parts (vertical and horizontal)", "Gabriel teaching: hands, face, parts, kids reacting", "A build failing, then a kid fixing it", "The first time a robot moves, plus the kid's face", "Wide room shots once it's full", "Pickup: a kid showing the build to a parent", "Parent answer at pickup (release-cleared only): \"What did you notice in your kid today?\" Get 2 to 3 clean answers for Saturday"]], ["Rules", "text", "No scripted kid interviews. No prices, no pitch. First names only, no school names. After g to make something real with your hands. [picture: 3D printer mid-print]\n\nGetting good enough at AI that it works for you, not the other way around. [picture: AI app icons]\n\nBeing around people who build, not people who watch. [picture: a workshop or garage]\n\nFinding the thing you'd still do if nobody paid you. [picture: print farm at night]\n\nTaking one real risk before you have a reason not to. [picture: an empty storefront]\n\nNot the hustle videos. Not grind culture. [picture: someone asleep at a desk]\n\nJust showing up for the thing you actually care about.\n\nI'm 21, and I bet everything on a store full of robots. So yeah. This found you.", "cta": "Caption: found you. (Spoken CTA optional: send this to the friend who needs it.)", "src": "Scripts written Oct 22 from the creator research", "kind": "new", "notes": "Nick Tarmo's format (43.7K likes, 1.4K reposts). The picture over your head changes on every line, so give your editor one image per bracket. Keep it under 45 seconds and talk fast.", "fillins": "", "format": "Found you (rapid list)", "fmt": "Found you (rapid list)"}, "inspiration": ["https://www.instagram.com/reel/DabPB1wMun3/"], "th": "this found you for a reason", "ith": "None on screen. Nick uses subtitles only, caption: found you."}]}, {"date": "2026-11-14", "dow": "Sat", "kubot": {"format": "Testimonial", "title": "Kubot: Testimonial", "sub": "From Fri Nov 13 class", "hook": "Watch [his or her] face when [he or she] shows [mom or dad]", "badge": "", "needs": false, "film": [], "sections": [["Plan", "rows", [["Series", "Testimonial: a kid at pickup showing their parent what they built, then one honest sentence from the parent. Unscripted, never staged."], ["Source", "Footage from the Fri Nov 13 class (Bal Harbour)."], ["Hook options", "\"Watch [his or her] face when [he or she] shows [mom or dad]\" or \"I asked a [mom or dad] what changed in [her or his] [son or daughter]\". Use the real kid and parent."], ["Who", "[parent first name] and acting, 30 to 60s", "has": false, "title": "You can't unhear this robot talking about Messi", "s": {"fmt": "Robot reaction"}, "sections": [["Idea", "rows", [["On-screen hook", "You can't unhear this robot talking about Messi"], ["Other hooks to test", "Messi vs Ronaldo, but a robot decides"], ["Why it works", "Robert the Robot's biggest reels (3.2M to 9.2M) put the person's reaction in the hook, not the robot. Miami version of Robert's 6.1M Ronaldo reel."], ["Notes", "Needs a robot on camera. Use the borrowed robot (ask first) or your own units once they land. Swap in another idea if neither is available. Can share a shoot with the Kubot street video, but this one talks to people your age."]]]], "inspiration": ["https://www.instagram.com/reel/DZlYBP2vMEo/", "https://www.instagram.com/reel/DbqupC5OwYb/"], "th": "You can't unhear this robot talking about Messi", "ith": "The smartest student at Stanford"}]}, {"date": "2026-11-15", "dow": "Sun", "kubot": {"format": "Podcast", "title": "Kubot: Podcast", "sub": "Ep. 5: 10 years of watching kids fail and fix things", "hook": "What 10 years of teaching kids taught Gabriel about failure", "badge": "Studio day", "needs": false, "film": [{"what": "Why Build #8 Patience", "short": "Why Build #8", "note": "Posts Mon Nov 16.", "ref": "2026-11-16"}, {"what": "Why Build #9 Math and science made real", "short": "Why Build #9", "note": "Posts Thu Nov 19.", "ref": "2026-11-19"}, {"what": "Podcast ep. 6", "short": "Podcast ep. 6", "note": "Posts Sun Nov 22.", "ref": "2026-11-22"}], "sections": [["Plan", "rows", [["Episode", "Podcast ep. 5. Full episode on YouTube and Spotify, plus one clip on Kubot."], ["Filmed", "Last Sunday's studio day."]]], ["Inspo", "rows", [["Show", "Founders podcast: weekly build in public episode, 30 to 45 minutes, Denis and Gabriel hosting. Cut into 5 to 8 short clips."], ["This episode", "[topic to pick]. Idea: the best comments and parent questions from the week."]]], ["Shape", "text", "1. Cold open (1 to 2 min): Denis sets up [topic].\n2. Main conversation (15 to 20 min): [topic], with real classroom moments, not slogans.\n3. Week in the build (3 to 5 min): what got done at the store, what broke, what's next.\n4. Kid of the week (optional): a Friday kid explains their robot, with a parent on mic. Only if release-cleared.\n5. What to try tonight (5 min): one tip for parents.\n6. Close (2 min): tease next week."], ["Questions", "list", ["[the best parent question from this week's comments]", "[the second best parent question]", "What broke this week, and what's next before the store opens?", "If a parent has 20 minutes tonight, what should they try?"]], ["Shots", "list", ["Wide two-shot, plus a single on each host", "Print farm and robots visible behind", "Clip targets: one Gabriel line that stands alone, one parent tip for tonight"]], ["Where", "text", "Studio. Audio: the podcast mics, test recording first."], ["Checklist", "check", ["Upload the full episode to YouTube and Spotify", "Cut one clip for Kubot", "Mark 5 to 8 clips for later", "No prices, no pitch", "Reply to comments in the first hour"]]], "s": {"hooks": ["What 10 years of teaching kids taught Gabriel about failure", "Gabriel has watched kids fail for 10 years. Here's what he learned.", "Why the best builders fail the most", "Let them get stuck.", "The moment a kid stops asking for help"], "body": "DENIS (cold open): Gabriel has watched kids get stuck for over 10 years. I wanted to know what he's learned.\nDENIS: What's the first thing a kid does when a build fails?\nGABRIEL: [his answer, in his words]\nDENIS: When should a parent step in?\nGABRIEL: [his answer]\nDENIS: Store update. [what got done, what broke, what's next]\nCLIP FOR KUBOT: [the line about letting kids get stuck]", "cta": "Full episode on YouTube and Spotify. What should we ask Gabriel next? Waitlist link in bio.", "src": "Plan v2 podcast segments + parent questions (new episode plan)", "kind": "new", "notes": "Gabriel's answers are his, unscripted. Only the cold open and questions are written.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "Take", "desc": "Founder take or personality read, 30 to 60s", "has": false, "title": "Your favourite tech founder tells me something about your personality (Elon edition)", "s": {"fmt": "Personality read"}, "sections": [["Idea", "rows", [["On-screen hook", "Your favourite tech founder tells me something about your personality (Elon edition)"], ["Other hooks to test", "What your favourite founder says about you (Steve Jobs edition)"], ["Why it works", "Mass-recognizable names only. Run it as a series if it lands."]]]], "inspiration": ["https://www.instagram.com/reel/DeTLLuYxMo9/", "https://www.instagram.com/reel/DeBE-NzRUXf/", "https://www.instagram.com/reel/DZRSDmKO_-o/"], "th": "Your favourite tech founder tells me something about your personality (Elon edition)", "ith": "What Your Favorite Artist Says About You (Oasis Edition)"}]}, {"date": "2026-11-16", "dow": "Mon", "kubot": {"format": "Why Build", "title": "Kubot: Why Build", "sub": "#8 Patience", "hook": "A 3D print takes hours. That's the lesson", "badge": "", "needs": false, "film": [], "sections": [["Plan", "rows", [["Show", "Why Build? with Gabriel. Gabriel to camera, 45 to 75 seconds."], ["Episode", "#8 Patience"], ["Status", "Script drafted below. Gabriel to review before filming."]]], ["Inspo", "rows", [["Development point", "Patience"], ["Hook", "A 3D print takes hours. That's the lesson"], ["Do this tonight", "Start something that finishes tomorrow, like seeds or a slow build"]]], ["Shots", "list", ["Gabriel to camera, clean audio", "B-roll: [Friday class moment that shows the point]", "On-screen text: [hook] / [tonight tip]"]], ["Where", "text", "Studio. Filmed on Sunday studio day."], ["Checklist", "check", ["Review the script with Gabriel", "Film on Sunday studio day", "Cut to 45 to 75 seconds", "Add on-screen text and subtitles", "No prices, no pitch", "Post on Kubot"]]], "s": {"hooks": ["A 3D print takes hours. That's the lesson", "a 3D print takes hours", "The best thing about a 3D printer is how slow it is.", "Kids can wait. We just stopped asking them to.", "Patience is a skill. Here's how kids practice it."], "body": "A 3D print takes hours.\nThat's the lesson.\nEverything else in a kid's day is instant.\nTap, and the video plays.\nSwipe, and there's a new one.\nThen they design a part and hit print.\nAnd it's slow.\nLayer by layer.\nThe kid who checks on it every five minutes.\nThe kid who learns to start it before dinner and see it after.\nThat waiting is a skill.\nKids are good at it when it's for something they made.\nHonestly, I think we just stopped asking them to wait.\nTonight, start something that finishes tomorrow.\nPlant a seed.\nStart a slow build.\nThen check on it together in the morning.\nWhat's something your kid can't wait for?", "cta": "Tonight: start something that finishes tomorrow, like seeds or a slow build. Tell me what you picked. Waitlist link in bio.", "src": "Plan v2 Why Build bank #8 (Patience): hook and tonight tip reused, new body", "kind": "new", "notes": "New body written from the plan v2 episode bank hook and 'do this tonight'. Concept-led, so no story from Gabriel is needed. Gabriel should adjust any line that isn't how he'd say it.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "Countdown", "desc": "Stakes update with a deadline, 30 to 45s", "has": false, "title": "15 days to open the world's first humanoid robot store", "s": {"fmt": "Stakes update"}, "sections": [["Idea", "rows", [["On-screen hook", "15 days to open the world's first humanoid robot store"], ["Other hooks to test", "2 weeks left. Here's what broke."], ["Why it works", "Day counts only work with a stake on screen. Mino's DAY 1 and DAY 32 (600K+) had a goal next to the number; plain DAY 4 and DAY 5 fell to 28K to 45K."]]]], "inspiration": ["https://www.instagram.com/reel/C1kzUmsRcEl/", "https://www.instagram.com/reel/C23BpgAvnSH/", "https://www.instagram.com/reel/Ddw9G7eyvfP/"], "th": "15 days to open the world's first humanoid robot store", "ith": "DAY 32 / Building a business in ONE DAY"}]}, {"date": "2026-11-17", "dow": "Tue", "kubot": {"format": "Denis Builds", "title": "Kubot: Denis Builds", "sub": "We printed a kid's drawing. Does it move?", "hook": "We printed a kid's drawing. Does it move?", "badge": "", "needs": false, "film": [], "sections": [["Plan", "rows", [["Series", "Denis Builds: Denis on camera, building in public."], ["Episode", "We printed a kid's drawing. Does it move?"], ["When to film", "Any time this week."]]], ["Shots", "list", ["Parts laid out on the table, one slow pan", "Build timelapse from a fixed angle", "The first time it works, one take", "Close-up of [the best detail]"]], ["Where", "text", "[where you build]"], ["Checklist", "check", ["Film while you build", "Cut to 30 to 45 seconds", "No prices, no pitch", "Post on Kubot"]]], "s": {"hooks": ["We printed a kid's drawing. Does it move?", "part 2: does it move?", "Last time we printed a kid's drawing. Now we're making it move.", "A drawing that drives", "From drawing to robot, part 2"], "body": "Last time, we printed a kid's drawing.\nToday we try to make it move.\n[B-ROLL: the print from last time]\nStep one. Add the CyberBricks parts: [what you added].\nStep two. Wire it.\n[what went wrong, one honest line]\nStep three. The first drive.\n[B-ROLL: first drive, one take]\n[what happened]\nAnd now the kid who drew it has a robot that started on paper.", "cta": "Send us your kid's drawing. Waitlist link in bio.", "src": "Follow up to the 'your kid draws it' idea from plan v2 (new script)", "kind": "new", "notes": "", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "How-to", "desc": "How-to list, 40 to 60s", "has": false, "title": "How To Become Incredibly Good At Talking To Strangers", "s": {"fmt": "How to become incredibly good"}, "sections": [["Idea", "rows", [["On-screen hook", "How To Become Incredibly Good At Talking To Strangers"], ["Other hooks to test", "How I got disgustingly good at talking to anyone"], ["Why it works", "Your strongest format on @dennyondabeat: four of the top eight reels, 49K to 193K."], ["Notes", "Use street robot footage as B-roll."]]]], "inspiration": ["https://www.instagram.com/reel/Dd78f_Ixoc4/", "https://www.instagram.com/reel/Dewq11ux5RI/", "https://www.instagram.com/reel/DeIuDFPR_db/"], "th": "How To Become Incredibly Good At Talking To Strangers", "ith": "How To Become Incredibly Good At Singing"}]}, {"date": "2026-11-18", "dow": "Wed", "kubot": {"format": "Robot on the Street", "title": "Kubot: Robot on the Street", "sub": "If a robot could help with one thing at home, what would it be?", "hook": "If a robot could help with one thing at home, what would it be?", "badge": "", "needs": false, "film": [{"what": "Robot on the Street", "short": "Robot on the Street", "note": "Film today or earlier. Main question: If a robot could help with one thing at home, what would it be?"}], "sections": [["Plan", "rows", [["Series", "Robot on the Street: the robot holds the mic and asks people one short question each."], ["Main question", "If a robot could help with one thing at home, what would it be?"], ["Twist ending", "Gabriel steps in at the end: \"Robots don't teach here. Kids build them.\""], ["Goal", "5 to 6 good answers, a split reaction, then the twist. 30 to 45 seconds."], ["When to film", "Today or earlier."]]], ["Questions", "list", ["Would you let a robot teach your kid?", "Would you rather your kid use robots or build them?", "What should kids learn that school doesn't teach?", "Would your kid rather have an iPad or build a robot?", "Are you scared of AI for your kids?", "What did you build as a kid?", "If a robot could help with one thing at home, what would it be?", "Should kids learn to code or learn to build first?"]], ["Shots", "list", ["Opener: the robot turns to someone, mic up", "Opener line: \"Quick question from a robot. Got 5 seconds?\"", "Each answer: tight on the person, robot mic in frame", "Reactions: people laughing, pointing, filming the robot", "Wide establishing shot of the spot", "Gabriel walking in for the twist, then the line to camera"]], ["Where", "text", "[pick the spot]. Public sidewalks or a park. Ask before filming on private property. Robot at the edge of the walkway, not blocking it."], ["Checklist", "check", ["Pick the spot and time", "Charge the robot and the mic", "Print releases and bring pens", "Quick release from every face used, a parent's for kids", "Never mock anyone's answer", "Get 5 to 6 usable answers", "Film Gabriel's twist line", "Cut to 30 to 45 seconds with subtitles", "No prices, no pitch"]]], "s": {"hooks": ["If a robot could help with one thing at home, what would it be?", "We asked Miami: if a robot could help with one thing at home, what would it be?", "A robot asked strangers one question, and the answers get more honest", "People had opinions. Fast.", "Quick question from a robot. Got 5 seconds?"], "body": "ROBOT: Quick question from a robot. Got 5 seconds?\nROBOT: If a robot could help with one thing at home, what would it be?\n[answer 1, word for word]\n[answer 2]\n[answer 3, the one that surprised you]\n[answer 4]\n[answer 5, a kid if there's a signed parent release]\n[B-ROLL: reactions, people filming the robot]\n[the split: who said yes, who said no, in one line]\nGABRIEL (to camera): Robots don't teach here. Kids build them.", "cta": "What would you answer? Comment it. Waitlist link in bio.", "src": "Plan v2 Robot on the Street format + content.py question list (structure reused; answers are real only)", "kind": "adapted", "notes": "Unscripted. Quick release from every face, a parent's for kids. Never mock an answer.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "Breakdown", "desc": "Lav mic to camera with the clip playing in the corner, 45 to 60s", "has": true, "title": "This one video got 4 million views", "s": {"hooks": ["This one video got 4 million views. Here's why.", "I got 4 million views from a list. Here's the formula.", "Why my most viral video disgustingly outperformed everything else"], "body": "In April I posted a list of rules every guy needs to know. It did 4 million views and over 500 comments.\n\n[Clip plays in the corner]\n\nHere's what actually did it.\n\nOne. The hook calls out a group. If you're a guy, it's talking to you. You either feel called out or you want to check if you pass.\n\nTwo. It's a list. People stay to see the next number.\n\nThree. The caption asked \"did I miss anything?\" Hundreds of people answered, and every comment pushed it further.\n\nFour. I kept posting the same format. Three others went past a million.\n\nThen it died. Same format, same topics, and the views dropped every week. That's the part nobody tells you. Every format has a shelf life.\n\nSo now I'm starting over. With robots.", "cta": "Caption: Comment FORMAT and I'll send you the template", "src": "Scripts written Oct 22 from the creator research", "kind": "new", "notes": "Robert McKeaveney's breakdown format (2.3M and 1.5M): you at a lav mic, the viral clip playing small in the corner. Every number in this script comes from your own account.", "fillins": "", "format": "Viral breakdown (clip in corner)", "fmt": "Viral breakdown (clip in corner)"}, "inspiration": ["https://www.instagram.com/reel/DeYZ_aVz-h4/", "https://www.instagram.com/reel/Den3cb_szfi/", "https://www.instagram.com/reel/DXkuJ78EVwv/"], "th": "This one video got 4 million views", "ith": "Follower counter on screen: 30,000 (Robert McKeaveney breakdown)"}]}, {"date": "2026-11-19", "dow": "Thu", "kubot": {"format": "Why Build", "title": "Kubot: Why Build", "sub": "#9 Math and science made real", "hook": "Your kid learned gear ratios today and didn't notice", "badge": "", "needs": false, "film": [], "sections": [["Plan", "rows", [["Show", "Why Build? with Gabriel. Gabriel to camera, 45 to 75 seconds."], ["Episode", "#9 Math and science made real"], ["Status", "Script drafted below. Gabriel to review before filming."]]], ["Inspo", "rows", [["Development point", "Math and science made real"], ["Hook", "Your kid learned gear ratios today and didn't notice"], ["Do this tonight", "Point out gears and motors in things around the house"]]], ["Shots", "list", ["Gabriel to camera, clean audio", "B-roll: [Friday class moment that shows the point]", "On-screen text: [hook] / [tonight tip]"]], ["Where", "text", "Studio. Filmed on Sunday studio day."], ["Checklist", "check", ["Review the script with Gabriel", "Film on Sunday studio day", "Cut to 45 to 75 seconds", "Add on-screen text and subtitles", "No prices, no pitch", "Post on Kubot"]]], "s": {"hooks": ["Your kid learned gear ratios today and didn't notice", "your kid learned gear ratios and didn't notice", "Math is a lot more fun when it makes something move.", "Kids don't hate math. They hate math that does nothing.", "Point at a gear tonight."], "body": "Your kid learned gear ratios today and didn't even notice.\nHere's how.\nThey built a car.\nIt was too slow.\nSo they swapped a small gear for a big one.\nNow it's fast, but it can't climb.\nSwap it back.\nThat's a gear ratio.\nThat's force and speed.\nOn a worksheet, it's boring.\nOn a robot they built, it's the best problem in the world.\nSame math.\nDifferent reason to care.\nTonight, point out gears and motors around the house.\nThe blender. A bike. A clock.\nAsk what would happen if the gear was bigger.\nWhere did your kid find a gear?", "cta": "Tonight: point out gears and motors around the house. Comment where your kid found one. Waitlist link in bio.", "src": "Plan v2 Why Build bank #9 (Math and science made real): hook and tonight tip reused, new body", "kind": "new", "notes": "New body written from the plan v2 episode bank hook and 'do this tonight'. Concept-led, so no story from Gabriel is needed. Gabriel should adjust any line that isn't how he'd say it.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "Expose", "desc": "Deadpan talking head, about 60s", "has": false, "title": "Exposing my own robot for 1 minute", "s": {"fmt": "Behind the robot"}, "sections": [["Idea", "rows", [["On-screen hook", "Yes, I'm controlling my robot. Here's how it works."], ["Other hooks to test", "Exposing my own robot for 1 minute"], ["Why it works", "Gets ahead of the \"what about your robot?\" comments from the expose videos."], ["Notes", "Only true details about how your robot is operated."]]]], "inspiration": ["https://www.instagram.com/reel/DYBaGViA4as/", "https://www.instagram.com/reel/DeyI4DxRiSC/"], "th": "Exposing my own robot for 1 minute", "ith": "Exposing random Tech company for 1 minute"}]}, {"date": "2026-11-20", "dow": "Fri", "kubot": {"format": "Denis Builds", "title": "Kubot: Denis Builds", "sub": "Two weeks out", "hook": "Two weeks until we open", "badge": "Hero shoot 3:30 to 5 PM, Bal Harbour", "needs": false, "film": [{"what": "Kubot class, 3:30 to 5 PM, Bal Harbour", "note": "Hero shoot. Film testimonials and b-roll. Gabriel teaches, Denis films.", "sections": [["Capture list", "list", ["Door: signed parent photo and video release before any face is used", "Wide of the room before kids arrive", "Hands on CyberBricks and 3D printed parts (vertical and horizontal)", "Gabriel teaching: hands, face, parts, kids reacting", "A build failing, then a kid fixing it", "The first time a robot moves, plus the kid's face", "Wide room shots once it's full", "Pickup: a kid showing the build to a parent", "Parent answer at pickup (release-cleared only): \"What did you notice in your kid today?\" Get 2 to 3 clean answers for Saturday"]], ["Rules", "text", "No scripted kid interviews. No prices, no pitch. First names only, no school names. After class, confirm which faces are release-cleared before the edit."]], "short": "Class 3:30 to 5 PM, Bal Harbour"}], "sections": [["Plan", "rows", [["Series", "Denis Builds: Denis on camera, building in public."], ["Episode", "What got done at the store this week, what broke, what's next."], ["When to film", "Any time this week."]]], ["Shots", "list", ["Denis to camera at the store", "B-roll: [what got done]", "Close-up: [one detail]"]], ["Where", "text", "[where you're filming]"], ["Checklist", "check", ["Film during the week", "Cut to 30 to 45 seconds", "No prices, no pitch", "Post on Kubot"]]], "s": {"hooks": ["Two weeks until we open", "two weeks out", "Two weeks to go. Here's what's left.", "The countdown just got real.", "14 days."], "body": "Two weeks until we open.\n[B-ROLL: the store today]\nWhat got done: [what got done this week].\nWhat broke: [what broke, one honest line].\nWhat's next: [what's next before December 1st].\n[B-ROLL: one detail close up]\nMost founders only post the wins.\nAnd I think the broken part is the part worth watching.", "cta": "Follow along to see if we get the doors open. Waitlist link in bio.", "src": "Store build update format (content.py, hub posts.json Oct 30) with a new weekly angle", "kind": "adapted", "notes": "Real progress only. No prices, no lease or money details.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "News", "desc": "Split screen robot news, 40 to 60s", "has": false, "title": "This 3D printer just changed what you can make at home", "s": {"fmt": "Robot news breakdown"}, "sections": [["Idea", "rows", [["On-screen hook", "This 3D printer just changed what you can make at home"], ["Other hooks to test", "Would you put this printer in your room?\nA 3D printer that does [X] just launched"], ["Story to cover", "The biggest 3D printing launch or announcement of the week."], ["Script template", "[Question hook that puts the product in their life]\n[Company], a [city or backer] startup, just launched [product].\nIt [what it does, in one line].\nHere's the part nobody's talking about: [the catch].\n[One detail that makes it real: how it works or when it ships]\nIt costs [comparison, e.g. less than half of its biggest rival]. No exact prices.\nI'm opening a humanoid robot store, so here's my take: [would you stock it, one line].\nWould you let this in your house?"], ["How to film", "Top half: the company's official launch footage, credited in the caption. Bottom half: you at the podcast mic, eye level, plain background. Pick the biggest robotics or 3D printing launch of that week and read the company's own announcement before filming. Verify every fact. Film the same week the news drops, or swap in a newer story."], ["Why it works", "Rowan Cheung's split screen breakdowns pull 28K to 64K likes and 1K+ reposts. You add what he can't: the take of someone who actually sells robots."]]]], "inspiration": ["https://www.instagram.com/reel/Da3U7H-O-UZ/", "https://www.instagram.com/reel/DYfQ9rdui0n/"], "th": "This 3D printer just changed what you can make at home", "ith": "None on screen. Rowan uses subtitles over split screen launch footage."}]}, {"date": "2026-11-21", "dow": "Sat", "kubot": {"format": "Testimonial", "title": "Kubot: Testimonial", "sub": "From Fri Nov 20 class", "hook": "I asked a [mom or dad] what changed in [her or his] [son or daughter]", "badge": "", "needs": false, "film": [], "sections": [["Plan", "rows", [["Series", "Testimonial: a kid at pickup showing their parent what they built, then one honest sentence from the parent. Unscripted, never staged."], ["Source", "Footage from the Fri Nov 20 class (Bal Harbour)."], ["Hook options", "\"Watch [his or her] face when [he or she] shows [mom or dad]\" or \"I asked a [mom or dad] what changed in [her or his] [son or daughter]\". Use the real kid and parent."], ["Who", "[parent first name] and [kid first name]. First names only."], ["Goal", "One honest answer a parent watching can relate to. 25 users.\nThey can find anything.\nFix the Wi-Fi faster than us.\nBut using something and understanding it are different.\nThe kid who asks what's inside the remote.\nThe kid who wants to know how the car knows to stop.\nThat's a creator.\nAnd every creator started by opening something up.\nTonight, find a broken toy.\nOr an old remote.\nOpen it together.\nLook at the board, the wires, the motor.\nYou don't need to know what any of it is.\nJust ask, \"what do you think this part does?\"\nWhat did you find inside?", "cta": "Tonight: open a broken toy together and see what's inside. Comment what you found. Waitlist link in bio.", "src": "Plan v2 Why Build bank #11 (Creator, not just a user): hook and tonight tip reused, new body", "kind": "new", "notes": "New body written from the plan v2 episode bank hook and 'do this tonight'. Concept-led, so no story from Gabriel is needed. Gabriel should adjust any line that isn't how he'd say it.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "Countdown", "desc": "Stakes update with a deadline, 30 to 45s", "has": false, "title": "8 days to open the world's first humanoid robot store", "s": {"fmt": "Stakes update"}, "sections": [["Idea", "rows", [["On-screen hook", "8 days to open the world's first humanoid robot store"], ["Other hooks to test", "One week left"], ["Why it works", "Day counts only work with a stake on screen. Mino's DAY 1 and DAY 32 (600K+) had a goal next to the number; plain DAY 4 and DAY 5 fell to 28K to 45K."], ["Notes", "Film the space mid-build. Save it for the reveal."]]]], "inspiration": ["https://www.instagram.com/reel/C1kzUmsRcEl/", "https://www.instagram.com/reel/C23BpgAvnSH/", "https://www.instagram.com/reel/Ddw9G7eyvfP/"], "th": "8 days to open the world's first humanoid robot store", "ith": "DAY 32 / Building a business in ONE DAY"}]}, {"date": "2026-11-24", "dow": "Tue", "kubot": {"format": "Denis Builds", "title": "Kubot: Denis Builds", "sub": "Building t cking it."], ["Checklist", "check", ["Pick the spot and time", "Charge the robot and the mic", "Print releases and bring pens", "Quick release from every face used, a parent's for kids", "Never mock anyone's answer", "Get 5 to 6 usable answers", "Film Gabriel's twist line", "Cut to 30 to 45 seconds with subtitles", "No prices, no pitch"]]], "s": {"hooks": ["Should kids learn to code or learn to build first?", "We asked Miami: should kids learn to code or learn to build first?", "A robot asked strangers one question, and the answers get more honest", "People had opinions. Fast.", "Quick question from a robot. Got 5 seconds?"], "body": "ROBOT: Quick question from a robot. Got 5 seconds?\nROBOT: Should kids learn to code or learn to build first?\n[answer 1, word for word]\n[answer 2]\n[answer 3, the one that surprised you]\n[answer 4]\n[answer 5, a kid if there's a signed parent release]\n[B-ROLL: reactions, people filming the robot]\n[the split: who said yes, who said no, in one line]\nGABRIEL (to camera): Robots don't teach here. Kids build them.", "cta": "What would you answer? Comment it. Waitlist link in bio.", "src": "Plan v2 Robot on the Street format + content.py question list (structure reused; answers are real only)", "kind": "adapted", "notes": "Unscripted. Quick release from every face, a parent's for kids. Never mock an answer.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "POV", "desc": "Mostly visual, 20 to 35s", "has": false, "title": "POV: the printers are stocking a store that opens in 6 days", "s": {"fmt": "POV, mostly visual"}, "sections": [["Idea", "rows", [["On-screen hook", "POV: the printers are stocking a store that opens in 6 days"], ["Why it works", "Comments choose the print, so every episode sets up the next one. POV hooks drove Mino's 187K to 416K reels."]]]], "inspiration": ["https://www.instagram.com/reel/DegXneUNOip/", "https://www.instagram.com/reel/DejCX63y2LM/"], "th": "POV: the printers are stocking a store that opens in 6 days", "ith": "POV: Claude is editing 7 REELS while i sleep (idek how to code)"}]}, {"date": "2026-11-26", "dow": "Thu", "kubot": {"format": "Why Build", "title": "Kubot: Why Build", "sub": "#13 Teamwork", "hook": "Two kids, one robot. Watch what happens", "badge": "", "needs": false, "film": [], "sections": [["Plan", "rows", [["Show", "Why Build? with Gabriel. Gabriel to camera, 45 to 75 seconds."], ["Episode", "#13 Teamwork"], ["Status", "Script drafted below. Gabriel to review before filming."]]], ["Inspo", "rows", [["Development point", "Teamwork"], ["Hook", "Two kids, one robot. Watch what happens"], ["Do this tonight", "Give siblings or friends one shared build"]]], ["Shots", "list", ["Gabriel to camera, clean audio", "B-roll: [Friday class moment that shows the point]", "On-screen text: [hook] / [tonight tip]"]], ["Where", "text", "Studio. Filmed on Sunday studio day."], ["Checklist", "check", ["Review the script with Gabriel", "Film on Sunday studio day", "Cut to 45 to 75 seconds", "Add on-screen text and subtitles", "No prices, no pitch", "Post on Kubot"]]], "s": {"hooks": ["Two kids, one robot. Watch what happens", "two kids, one robot", "Give two kids one build and watch.", "Teamwork isn't taught in a lecture.", "The fastest way to teach sharing"], "body": "Two kids.\nOne robot.\nWatch what happens.\nAt first, they both want the controller.\nThen someone has to hold the wheel while the other one screws it in.\nThen one is better at wiring and one is better at the design.\nNobody told them to split it up.\nThe build did.\nHonestly, that's how teamwork actually gets learned.\nNot by being told to share.\nBy needing someone else to finish the thing you care about.\nThe kid who says \"hold this\".\nThe kid who says \"let me try\".\nTonight, give siblings or friends one shared build.\nOne kit. One goal.\nThen stay out of it.\nWho took charge?", "cta": "Tonight: give siblings or friends one shared build. Comment who took charge. Waitlist link in bio.", "src": "Plan v2 Why Build bank #13 (Teamwork): hook and tonight tip reused, new body", "kind": "new", "notes": "New body written from the plan v2 episode bank hook and 'do this tonight'. Concept-led, so no story from Gabriel is needed. Gabriel should adjust any line that isn't how he'd say it.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "Breakdown", "desc": "Lav mic to camera with the clip playing in the corner, 40 to 55s", "has": true, "title": "This robot video got 9 million views (the hook never mentions the robot)", "s": {"hooks": ["This robot video got 9 million views, and the hook doesn't mention the robot", "Why this robot video got 9 million views", "Every viral robot video does this one thing"], "body": "This robot video got 9 million views, and the hook doesn't even mention the robot.\n\n[Clip plays in the corner]\n\nLook at it. \"The smartest student at Stanford.\" You click to see who that is.\n\nThen he says he has a 180 IQ, and now you have to watch him get humbled.\n\nThe robot is just the twist.\n\nEvery big robot video works like this. The person is the story. The robot is the surprise.\n\nRobot doing a backflip? You scroll. Robot debating a guy with a 180 IQ? You stay.\n\nI'm about to have a store full of these. Guess which kind of video I'm making.", "cta": "Caption: Credit @roberttherobot. Ask: what should my robot debate someone about?", "src": "Scripts written Oct 22 from the creator research", "kind": "new", "notes": "Breakdown format from Robert McKeaveney, applied to @roberttherobot's 9.2M reel. Credit the original account on screen and in the caption.", "fillins": "", "format": "Viral breakdown (clip in corner)", "fmt": "Viral breakdown (clip in corner)"}, "inspiration": ["https://www.instagram.com/reel/DbqupC5OwYb/", "https://www.instagram.com/reel/DexwuW4uC_O/", "https://www.instagram.com/reel/DeYZ_aVz-h4/", "https://www.instagram.com/reel/Den3cb_szfi/"], "th anged in [her or his] [son or daughter]\". Use the real kid and parent."], ["Who", "[parent first name] and [kid first name]. First names only."], ["Goal", "One honest answer a parent watching can relate to. 25 to 35 seconds."]]], ["Questions", "list", ["What did you notice in your kid today?", "What did [kid] tell you about the build on the way out?", "What is something [kid] built that surprised you?", "How does [kid] talk about building now?", "In one sentence, what did building give [kid]?"]], ["Shots", "list", ["Kid running up with the build", "Kid explaining it to the parent", "Parent's face as the robot moves", "The parent's one sentence", "Close-up of the build in the kid's hands"]], ["Where", "text", "Bal Harbour class footage from Friday."], ["Checklist", "check", ["Pick the pickup moment from Friday's footage", "Confirm the signed release for kid and parent", "First names only, no school names", "Cut to 25 to 35 seconds with subtitles", "No prices, no pitch", "Post on Kubot"]]], "s": {"hooks": ["They walked in with a pile of parts.", "Pieces in. Robot out.", "Watch [his or her] face when [he or she] shows [mom or dad]", "We asked a kid how their robot works.", "This is what a Friday class looks like."], "body": "[B-ROLL: kid running up to the parent with the build]\nKID: [what the kid says about the build, word for word]\n[B-ROLL: the robot moving, the parent's face]\nPARENT (answering \"What did you notice in your kid today?\"): [the parent's answer, word for word]\n[B-ROLL: close up of the build in the kid's hands]\nON-SCREEN: [parent's first name] and [kid's first name], after the Fri Nov 27 class.", "cta": "What did your kid build first? Comment it. Or send us their drawing.", "src": "Plan v2 Real Families + kubot-details.json hook options + hub posts.json pickup posts (structure reused; words are real only)", "kind": "adapted", "notes": "Never staged or scripted. Signed release for kid and parent, first names only, no schools.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "Robot", "desc": "Robot plus people reacting, 30 to 60s", "has": false, "title": "Can you beat a humanoid robot at [challenge]?", "s": {"fmt": "Robot challenge"}, "sections": [["Idea", "rows", [["On-screen hook", "Can you beat a humanoid robot at [challenge]?"], ["Other hooks to test", "I challenged strangers in Miami to beat my robot\nNobody in Wynwood could beat this robot"], ["Why it works", "Robert McKeaveney's pull-up challenge did 6.2M views and 9.6K comments because everyone thinks they could do better. Challenges invite stitches and replies."], ["Notes", "Pick something your robot can genuinely do on camera (test it first). Film strangers trying to beat it and keep a running scoreboard on screen. Needs a robot on camera. Use the borrowed robot (ask first) or your own units once they land. Swap in another idea if neither is available. Can share a shoot with the Kubot street video, but this one talks to people your age."]]]], "inspiration": ["https://www.instagram.com/reel/DeQeTsUzzc4/", "https://www.instagram.com/reel/Deviwtgzxzi/", "https://www.instagram.com/reel/DbqupC5OwYb/"], "th": "Can you beat a humanoid robot at [challenge]?", "ith": "None on screen. Robert McKeaveney's pull-up challenge runs on subtitles and the attempt itself."}]}, {"date": "2026-11-29", "dow": "Sun", "kubot": {"format": "Podcast", "title": "Kubot: Podcast", "sub": "Ep. 7: One week out: building a store in public", "hook": "Two days until we open", "badge": "Studio day", "needs": false, "film": [{"what": "Why Build #15 Pride in their work", "short": "Why Build #15", "note": "Posts Mon Nov 30.", "ref": "2026-11-30"}, {"what": "Why Build #17 Starting age", "short": "Why Build #17", "note": "Posts Thu Dec 3.", "ref": "2026-12-03"}, {"what": "Podcast ep. 8", "short": "Podcast ep. 8", "note": "Posts Sun Dec 6.", "ref": "2026-12-06"}], "sections": [["Plan", "rows", [["Episode", "Podcast ep. 7. Full episode on YouTube and Spotify, plus one clip on Kubot."], ["Filmed", "Last Sunday's studio day."]]], ["Inspo", "rows", [["Show", "Founders podcast: weekly build in public episode, 30 to 45 minutes, Denis and Gabriel hosting. Cut into 5 to 8 short clips."], ["This episode", "[topic to pick]. Idea: the best comments and parent questions from the week."]]], ["Shape", "text", "1. Cold open (1 to 2 min): Denis sets up [topic].\n2. Main conversation (15 to 20 min): [topic], with real classroom moments, not slogans.\n3. Week in the build (3 to 5 min): what got done at the store, what broke, what's next.\n4. Kid of the week (optional): a Friday kid explains their robot, with a parent on mic. Only if release-cleared.\n5. What to try tonight (5 min): one tip for parents.\n6. Close (2 min): tease next week."], ["Questions", "list", ["[the best parent question from this week's comments]", "[the second best parent question]", "What broke this week, and what's next before the store opens?", "If a parent has 20 minutes tonight, what should they try?"]], ["Shots", "list", ["Wide two-shot, plus a single on each host", "Print farm and robots visible behind", "Clip targets: one Gabriel line that stands alone, one parent tip for tonight"]], ["Where", "text", "Studio. Audio: the podcast mics, test recording first."], ["Checklist", "check", ["Upload the full episode to YouTube and Spotify", "Cut one clip for Kubot", "Mark 5 to 8 clips for later", "No prices, no pitch", "Reply to comments in the first hour"]]], "s": {"hooks": ["Two days until we open", "We open in two days. Here's everything we got wrong.", "Building a store in public, the honest version", "What we'd do differently", "Almost open"], "body": "DENIS (cold open): We open the doors in two days. This is the last episode before that.\nDENIS: Gabriel, what are you most nervous about?\nGABRIEL: [his answer]\nDENIS: What's the thing that went wrong that nobody saw?\n[both answer, real only]\nDENIS: What do you want a kid to feel the first time they walk in?\nGABRIEL: [his answer]\nCLIP FOR KUBOT: [the best line about the first kid walking in]", "cta": "Full episode on YouTube and Spotify. What should we ask Gabriel next? Waitlist link in bio.", "src": "Plan v2 podcast segments + parent questions (new episode plan)", "kind": "new", "notes": "Gabriel's answers are his, unscripted. Only the cold open and questions are written.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "Take", "desc": "Founder take or personality read, 30 to 60s", "has": false, "title": "Your first robot toy says something disturbingly specific about you", "s": {"fmt": "Personality read"}, "sections": [["Idea", "rows", [["On-screen hook", "Your first robot toy says something disturbingly specific about you"], ["Other hooks to test", "Your first robot toy tells me something about your personality (2000s kid edition)"], ["Why it works", "Your proven personality format. Use only the most recognizable toys (Furby, Lego, Transformers): niche references died on @dennyondabeat."]]]], "inspiration": ["https://www.instagram.com/reel/DZRSDmKO_-o/", "https://www.instagram.com/reel/DeTLLuYxMo9/", "https://www.instagram.com/reel/DeBE-NzRUXf/"], "th": "Your first robot toy says something disturbingly specific about you", "ith": "What Your Favorite Artist Says About You (Oasis Edition)"}]}, {"date": "2026-11-30", "dow": "Mon", "kubot": {"format": "Why Build", "title": "Kubot: Why Build", "sub": "#15 Pride in their work", "hook": "Kids keep what they make. They forget what they're given", "badge": "", "needs": false, "film": [], "sections": [["Plan", "rows", [["Show", "Why Build? with Gabriel. Gabriel to camera, 45 to 75 seconds."], ["Episode", "#15 Pride in their work"], ["Status", "Script drafted below. Gabriel to review before filming."]]], ["Inspo", "rows", [["Development point", "Pride in their work"], ["Hook", "Kids keep what they make. They forget what they're given"], ["Do this tonight", "Display one thing they made where guests can see it"]]], ["Shots", "list", ["Gabriel to camera, clean audio", "B-roll: [Friday class moment that shows the point]", "On-screen text: [hook] / [tonight tip]"]], ["Where", "text", "Studio. Filmed on Sunday studio day."], ["Checklist", "check", ["Review the script with Gabriel", "Film on Sunday studio day", "Cut to 45 to 75 seconds", "Add on-screen text and subtitles", "No prices, no pitch", "Post on Kubot"]]], "s": {"hooks": ["Kids keep what they make. They forget what they're given", "kids keep what they make", "Your kid will forget the toy you bought. They won't forget this.", "Put it where guests can see it.", "The proudest kid in the room built something."], "body": "Kids keep what they make.\nThey forget what they're given.\nThink about it.\nHow many toys from last year can your kid even name?\nNow ask them about something they built.\nThey'll tell you every part.\nWhat broke.\nHow they fixed it.\nThe kid who carries the robot to the car.\nThe kid who shows it to everyone at dinner.\nThat's pride.\nThe good kind.\nPride in something they did, not something they got.\nTonight, take one thing your kid made.\nA drawing. A build. Anything.\nPut it somewhere guests will see it.\nWatch what happens when someone asks about it.\nWhat's the thing your kid is proudest of?", "cta": "Tonight: display one thing they made where guests can see it. Send us a photo or drawing of it. Waitlist link in bio.", "src": "Plan v2 Why Build bank #15 (Pride in their work): hook and tonight tip reused, new body", "kind": "new", "notes": "New body written from the plan v2 episode bank hook and 'do this tonight'. Concept-led, so no story from Gabriel is needed. Gabriel should adjust any line that isn't how he'd say it.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "Countdown", "desc": "Stakes update with a deadline, 30 to 45s", "has": false, "title": "Tomorrow I open the world's first humanoid robot store", "s": {"fmt": "Stakes update"}, "sections": [["Idea", "rows", [["On-screen hook", "Tomorrow I open the world's first humanoid robot store"], ["Other hooks to test", "1 day left"], ["Why it works", "Day counts only work with a stake on screen. Mino's DAY 1 and DAY 32 (600K+) had a goal next to the number; plain DAY 4 and DAY 5 fell to 28K to 45K."], ["Notes", "Last countdown. Show the before footage you've been saving."]]]], "inspiration": ["https://www.instagram.com/reel/C1kzUmsRcEl/", "https://www.instagram.com/reel/C23BpgAvnSH/", "https://www.instagram.com/reel/Ddw9G7eyvfP/"], "th": "Tomorrow I open the world's first humanoid robot store", "ith": "DAY 32 / Building a business in ONE DAY"}]}, {"date": "2026-12-01", "dow": "Tue", "kubot": {"format": "Denis Builds", "title": "Kubot: Denis Builds", "sub": "The doors open today", "hook": "The doors open today", "badge": "", "needs": false, "film": [], "sections": [["Today", "text", "The Kubot store opens today."], ["Plan", "rows", [["Series", "Denis Builds: Denis on camera, building in public."], ["Episode", "The doors open today"], ["When to film", "Any time this week."]]], ["Shots", "list", ["Parts laid out on the table, one slow pan", "Build timelapse from a fixed angle", "The first time it works, one take", "Close-up of [the best detail]"]], ["Where", "text", "[where you build]"], ["Checklist", "check", ["Film while you build", "Cut to 30 to 45 seconds", "No prices, no pitch", "Post on Kubot"]]], "s": {"hooks": ["The doors open today", "doors open today", "Today, the empty room gets its first kid.", "We open today.", "Opening day."], "body": "Today the doors open.\n[B-ROLL: the store, morning, before anyone arrives]\nA few months ago, this was an empty room.\n[B-ROLL: the empty room footage from October]\nNow it's [what it looks like today].\n[B-ROLL: printers, robots, the build tables]\nThe first kid walks in at [time].\nAnd this is what we built it for.", "cta": "Link in bio. Thank you for following the empty room.", "src": "Store countdown series, final episode (new script)", "kind": "new", "notes": "Dec 1. No prices, no pitch. Release-cleared faces only.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "Countdown", "desc": "Stakes update with a deadline, 30 to 45s", "has": false, "title": "DAY 1: the world's first humanoid robot store is open", "s": {"fmt": "Opening day"}, "sections": [["Idea", "rows", [["On-screen hook", "DAY 1: the world's first humanoid robot store is open"], ["Other hooks to test", "We made it"], ["Why it works", "The payoff for every countdown video. Before and after reveal."], ["Notes", "Opening day. Use the empty-store footage from October for the before."]]]], "inspiration": ["https://www.instagram.com/reel/C1kzUmsRcEl/", "https://www.instagram.com/reel/C23BpgAvnSH/", "https://www.instagram.com/reel/Ddw9G7eyvfP/"], "th": "DAY 1: the world's first humanoid robot store is open", "ith": "DAY 32 / Building a business in ONE DAY"}]}, {"date": "2026-12-02", "dow": "Wed", "kubot": {"format": "Robot on the Street", "title": "Kubot: Robot on the Street", "sub": "What would your kid build first?", "hook": "What would your kid build first?", "badge": "", "needs": false, "film": [{"what": "Robot on the Street", "short": "Robot on the Street", "note": "Film today or earlier. Main question: What would your kid build first?"}], "sections": [["Plan", "rows", [["Series", "Robot on the Street: the robot holds the mic and asks people one short question each."], ["Main question", "What would your kid build first?"], ["Twist ending", "Gabriel steps in at the end: \"Robots don't teach here. Kids build them.\""], ["Goal", "5 to 6 good answers, a split reaction, then the twist. 30 to 45 seconds."], ["When to film", "Today or earlier."]]], ["Questions", "list", ["Would you let a robot teach your kid?", "Would you rather your kid use robots or build them?", "What should kids learn that school doesn't teach?", "Would your kid rather have an iPad or build a robot?", "Are you scared of AI for your kids?", "What did you build as a kid?", "If a robot could help with one thing at home, what would it be?", "Should kids learn to code or learn to build first?"]], ["Shots", "list", ["Opener: the robot turns to someone, mic up", "Opener line: \"Quick question from a robot. Got 5 seconds?\"", "Each answer: tight on the person, robot mic in frame", "Reactions: people laughing, pointing, filming the robot", "Wide establishing shot of the spot", "Gabriel walking in for the twist, then the line to camera"]], ["Where", "text", "[pick the spot]. Public sidewalks or a park. Ask before filming on private property. Robot at the edge of the walkway, not blocking it."], ["Checklist", "check", ["Pick the spot and time", "Charge the robot and the mic", "Print releases and bring pens", "Quick release from every face used, a parent's for kids", "Never mock anyone's answer", "Get 5 to 6 usable answers", "Film Gabriel's twist line", "Cut to 30 to 45 seconds with subtitles", "No prices, no pitch"]]], "s": {"hooks": ["What would your kid build first?", "We asked Miami: what would your kid build first?", "A robot asked strangers one question, and the answers get more honest", "People had opinions. Fast.", "Quick question from a robot. Got 5 seconds?"], "body": "ROBOT: Quick question from a robot. Got 5 seconds?\nROBOT: What would your kid build first?\n[answer 1, word for word]\n[answer 2]\n[answer 3, the one that surprised you]\n[answer 4]\n[answer 5, a kid if there's a signed parent release]\n[B-ROLL: reactions, people filming the robot]\n[the split: who said yes, who said no, in one line]\nGABRIEL (to camera): Robots don't teach here. Kids build them.", "cta": "What would you answer? Comment it. Waitlist link in bio.", "src": "Plan v2 Robot on the Street format + content.py question list (structure reused; answers are real only)", "kind": "adapted", "notes": "Unscripted. Quick release from every face, a parent's for kids. Never mock an answer.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "POV", "desc": "Mostly visual, 20 to 35s", "has": false, "title": "POV: day two of owning a store at 21", "s": {"fmt": "POV, mostly visual"}, "sections": [["Idea", "rows", [["On-screen hook", "POV: day two of owning a store at 21"], ["Why it works", "Comments choose the print, so every episode sets up the next one. POV hooks drove Mino's 187K to 416K reels."]]]], "inspiration": ["https://www.instagram.com/reel/DegXneUNOip/", "https://www.instagram.com/reel/DejCX63y2LM/"], "th": "POV: day two of owning a store at 21", "ith": "POV: Claude is editing 7 REELS while i sleep (idek how to code)"}]}, {"date": "2026-12-03", "dow": "Thu", "kubot": {"format": "Why Build", "title": "Kubot: Why Build", "sub": "#17 Starting age", "hook": "Is your kid old enough for robotics?", "badge": "", "needs": false, "film": [], "sections": [["Plan", "rows", [["Show", "Why Build? with Gabriel. Gabriel to camera, 45 to 75 seconds."], ["Episode", "#17 Starting age"], ["Status", "Script drafted below. Gabriel to review before filming."]]], ["Inspo", "rows", [["Development point", "Starting age"], ["Hook", "Is your kid old enough for robotics?"], ["Do this tonight", "What a 6, 9 and 12 year old can each build"]]], ["Shots", "list", ["Gabriel to camera, clean audio", "B-roll: [Friday class moment that shows the point]", "On-screen text: [hook] / [tonight tip]"]], ["Where", "text", "Studio. Filmed on Sunday studio day."], ["Checklist", "check", ["Review the script with Gabriel", "Film on Sunday studio day", "Cut to 45 to 75 seconds", "Add on-screen text and subtitles", "No prices, no pitch", "Post on Kubot"]]], "s": {"hooks": ["Is your kid old enough for robotics?", "is your kid old enough?", "The right age to start building is younger than you think.", "What a 6, 9 and 12 year old can each build", "Parents ask me this every week."], "body": "Is your kid old enough for robotics?\nParents ask that all the time.\nThe honest answer is, it depends on what you mean by robotics.\nAt six, it's putting parts together and seeing something move.\nAt nine, it's [what Gabriel says a 9 year old can build].\nAt twelve, it's [what Gabriel says a 12 year old can build].\nSame idea.\nDifferent level.\nThe kid who just wants to see it go.\nThe kid who wants to make it go faster.\nThe kid who wants to make it go by itself.\nThat's the progression.\nAnd it doesn't start with being \"ready\".\nIt starts with being curious.\nTonight, ask your kid what they'd build if they could build anything.\nWrite it down.\nWhat did your kid say?", "cta": "Ask your kid what they'd build. Send us the drawing, we might print it. Waitlist link in bio.", "src": "Plan v2 Why Build bank #17 (Starting age): hook and tonight tip reused, new body", "kind": "new", "notes": "New body written from the plan v2 episode bank hook and 'do this tonight'. Concept-led, so no story from Gabriel is needed. Gabriel should adjust any line that isn't how he'd say it. Fill the age brackets with Gabriel's real answer.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "News", "desc": "Split screen robot news, 40 to 60s", "has": false, "title": "Would you buy this robot for your apartment?", "s": {"fmt": "Robot news breakdown"}, "sections": [["Idea", "rows", [["On-screen hook", "Would you buy this robot for your apartment?"], ["Other hooks to test", "A startup just built a robot that [does X]. There's a catch."], ["Story to cover", "Any robot launch that week. Now you can say whether you'd stock it in your store."], ["Script template", "[Question hook that puts the product in their life]\n[Company], a [city or backer] startup, just launched [product].\nIt [what it does, in one line].\nHere's the part nobody's talking about: [the catch].\n[One detail that makes it real: how it works or when it ships]\nIt costs [comparison, e.g. less than half of its biggest rival]. N     const dt = parse(ds), inM = dt.getMonth() === m-1, d = BY[ds];
    if (i >= 35 && !inM && dt.getDay() === 1) break;
    if (d){
      const dots = items(d).map(it => '<i class="'+(it.kind==="k"?"k":(it.kind==="h"?"h":(it.kind==="m"?"m":"")))+(done[it.id]?" on":"")+'"></i>').join("");
      h += '<button class="mc'+(inM?"":" out")+(ds===TODAY?" today":"")+'" data-day="'+ds+'" aria-label="'+esc(nice(ds))+'"><span class="n">'+dt.getDate()+'</span><span class="ds">'+dots+'</span>'+(dt.getDay()===5?'<span class="fr">Class</span>':'')+'</button>';
    } else h += '<div class="mc off'+(inM?"":" out")+(ds===TODAY?" today":"")+'"><span class="n">'+dt.getDate()+'</span></div>';
    ds = add(ds, 1);
  }
  h += '</div><div class="legend"><span><i class="k"></i>Kubot</span><span><i></i>Personal</span><span><i class="h"></i>100 in 100</span><span><i class="m"></i>@dennyondabeat</span><span><i class="on"></i>Done</span></div>';
  $("month").innerHTML = h;
}
function renderPlan(){
  const m = DATA.mix;
  $("plan").innerHTML = '<b>This week\'s plan.</b> One Kubot post and one personal post a day. ' + m.days.map(x => esc(x[0]+" "+x[1])).join(" \u00b7 ") + '. ' + esc(m.personal) + ' ' + esc(m.line) + ' <a href="https://claude.ai/artifact/V7b51Q19aUA2mAYyKc3HCn" target="_blank" rel="noopener">Open the 100 in 100 Log</a>. Each night your entry becomes a script on the calendar.';
}
function render(){
  $("week").hidden = view !== "week"; $("month").hidden = view !== "month";
  $("v-w").setAttribute("aria-selected", view === "week"); $("v-m").setAttribute("aria-selected", view === "month");
  const n = $("note");
  if (TODAY < FIRST) { n.hidden = false; n.textContent = "The plan starts " + nice(FIRST) + "."; }
  else if (TODAY > LAST) { n.hidden = false; n.textContent = "The plan ended " + nice(LAST) + "."; }
  else n.hidden = true;
  view === "week" ? renderWeek() : renderMonth();
}
function scrollToDay(ds){
  const el = document.getElementById("d-"+ds);
  if (el && window.innerWidth < 980) el.scrollIntoView({block:"start"}); else window.scrollTo(0,0);
}
function secHTML(s){
  const [h, t, v] = s; let body = "";
  if (t === "text") body = '<div class="pre">'+esc(v)+'</div>';
  else if (t === "rows") body = v.map(r => '<div class="kv"><div class="k">'+esc(r[0])+'</div><div class="v">'+esc(r[1])+'</div></div>').join("");
  else body = v.map(x => '<div class="li'+(t==="check"?" ck":"")+'">'+esc(x)+'</div>').join("");
  return '<div class="section-h">'+esc(h)+'</div><div class="group">'+body+'</div>';
}
function scriptHTML(sc){
  if (!sc || !sc.body) return "";
  const tag = sc.kind === "new" ? '<span class="tag new">New script</span>' : (sc.kind === "adapted" ? '<span class="tag">Adapted old script</span>' : '<span class="tag">Old script</span>');
  let h = '<div class="section-h">Source</div><div class="group"><div class="src">'+tag+'<span>'+esc(sc.src)+'</span></div></div>';
  h += '<div class="section-h">Hooks</div><div class="group">' + (sc.hooks||[]).map((x,i) => '<div class="hk"><b>'+(i+1)+'</b><span>'+esc(x)+'</span></div>').join("") + '</div>';
  h += '<div class="section-h">Body</div><div class="group"><div class="pre">'+esc(sc.body)+'</div></div>';
  h += '<div class="section-h">CTA</div><div class="group"><div class="cta">'+esc(sc.cta)+'</div></div>';
  if (sc.fillins) h += secHTML(["Fill-ins", "text", sc.fillins]);
  if (sc.notes) h += secHTML(["Notes", "text", sc.notes]);
  return h;
}
const ISYNC = "https://script.google.com/macros/s/AKfycbym4tx8tggGq-IxcCi_iqP6QwEOntDsUjQwK3OlSPSD35lAyaf80t_UjXNYY3F9ehSJQQ/exec";
const lsj = (k, d) => { try { return JSON.parse(localStorage.getItem(k) || "null") || d; } catch (e) { return d; } };
const lss = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
let IR = lsj("insp:cache", {}), IQ = lsj("insp:q", []), isynced = false, iflushing = false;
function iapply(m, op){ const v = (m[op.id] || []).slice(); if (op.op === "add" && !v.includes(op.url)) v.push(op.url); if (op.op === "remove") v.splice(v.indexOf(op.url) >>> 0, v.includes(op.url) ? 1 : 0); if (v.length) m[op.id] = v; else delete m[op.id]; }
function iview(){ const m = JSON.parse(JSON.stringify(IR)); IQ.forEach(o => iapply(m, o)); return m; }
const iget = id => iview()[id] || [];
function istatus(){ document.querySelectorAll(".insp .is").forEach(e => e.textContent = IQ.length ? "Saved on this device, will sync when online." : (isynced ? "Synced for everyone with the link." : "Syncing...")); }
function irerender(){ const f = document.activeElement; if (f && f.closest && f.closest(".insp .ia") && f.value) return istatus(); if (sheetId) inspRefresh(sheetId); }
async function iflush(){
  if (iflushing) return; iflushing = true;
  try { while (IQ.length) { const op = IQ[0];
      const r = await fetch(ISYNC, {method: "POST", headers: {"Content-Type": "text/plain;charset=utf-8"}, body: JSON.stringify(op)}).then(x => x.json());
      if (r && r.links) { IR = r.links; isynced = true; }
      IQ.shift(); lss("insp:q", IQ); lss("insp:cache", IR); }
  } catch (e) {} iflushing = false; istatus(); irerender(); }
async function isync(){
  try { Object.keys(localStorage).filter(k => /^insp:\d{4}-\d{2}-\d{2}:(k|p[0-2])$/.test(k)).forEach(k => {   // migrate old device-only links
      lsj(k, []).forEach(u => IQ.push({op: "add", id: k.slice(5), url: u})); localStorage.removeItem(k); }); lss("insp:q", IQ); } catch (e) {}
  try { const r = await fetch(ISYNC, {cache: "no-store"}).then(x => x.json()); if (r && r.ok) { IR = r.links || {}; isynced = true; lss("insp:cache", IR); } } catch (e) {}
  await iflush(); istatus(); irerender(); }
function iop(op){ IQ.push(op); lss("insp:q", IQ); irerender(); iflush(); }
window.addEventListener("online", iflush);
document.addEventListener("visibilitychange", () => { if (!document.hidden) isync(); });
setTimeout(isync, 0);
function inspHTML(id, pre){
  pre = pre || []; const mine = iget(id);
  let h = '<div class="section-h">Inspiration</div><div class="group insp" data-insp="'+esc(id)+'">';
  pre.forEach(u => h += '<div class="il"><a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(u)+'</a><span class="ip">in plan</span></div>');
  mine.forEach((u, i) => h += '<div class="il"><a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(u)+'</a><button class="ix" data-irm="'+i+'" aria-label="Remove link">\u00d7</button></div>');
  if (!pre.length && !mine.length) h += '<div class="ie">No links yet. Paste an IG reel or video link for the editor.</div>';
  h += '<form class="ia"><input type="url" inputmode="url" placeholder="Paste reel or video link" aria-label="Inspiration link"><button type="submit">Add</button></form>';
  return h + '<div class="ie is">' + (IQ.length ? "Saved on this device, will sync when online." : (isynced ? "Synced for everyone with the link." : "Syncing...")) + '</div></div>';
}
function inspRefresh(id){ const g = document.querySelector('[data-insp="'+CSS.escape(id)+'"]'); if (!g) return; const it = items(BY[id.split(":")[0]]).find(x => x.id === id); const t = document.createElement("div"); t.innerHTML = inspHTML(id, it && it.src.inspiration); g.previousElementSibling.remove(); g.replaceWith(...t.childNodes); }
document.addEventListener("submit", e => { const f = e.target.closest(".ia"); if (!f) return; e.preventDefault();
  const id = f.parentElement.dataset.insp, inp = f.querySelector("input"), u = inp.value.trim();
  if (!/^https?:\/\/\S+$/i.test(u)) { inp.setCustomValidity("Paste a full link starting with https://"); inp.reportValidity(); inp.setCustomValidity(""); return; }
  if (u.length > 500) return; if (!iget(id).includes(u)) iop({op: "add", id, url: u}); else inspRefresh(id); });
document.addEventListener("click", e => { const b = e.target.closest("[data-irm]"); if (!b) return;
  const id = b.closest("[data-insp]").dataset.insp, u = iget(id)[+b.dataset.irm]; if (u) iop({op: "remove", id, url: u}); });
let sheetId = null, lastFocus = null;
const SHORT = {"Robot on the Street":"Street","Follower Farming":"Followers"};
function openSheet(id){
  const ds = id.split(":")[0], d = BY[ds]; if (!d) return;
  const it = items(d).find(x => x.id === id); if (!it) return;
  sheetId = id; lastFocus = document.activeElement;
  $("s-meta").innerHTML = '<span class="dot'+(it.kind==="k"?" k":"")+'"></span>' + esc(nice(ds) + " \u00b7 " + it.meta);
  let h = '<h3 id="s-title">'+esc(it.title)+'</h3>' + (it.sub ? '<div class="ssub">'+esc(it.sub)+'</div>' : '');
  h += '<div class="group">' + checkBtn(id, it.title, "drow check") + '</div>';
  if (it.kind === "k"){
    const k = it.src;
    if (k.film && k.film.length){
      h += '<div class="section-h">Film today</div><div class="group filmbox">';
      k.film.forEach(f => {
        h += '<div class="ft">'+esc(f.what)+'</div>' + (f.note ? '<div class="fn">'+esc(f.note)+'</div>' : '');
        if (f.ref && BY[f.ref]) h += '<button class="drow link" data-open="'+esc(f.ref+":k")+'">Open the '+esc(MON[parse(f.ref).getMonth()]+" "+parse(f.ref).getDate())+' plan</button>';
      });
      h += '</div>';
    }
    h += scriptHTML(k.s);
    h += inspHTML(id, k.inspiration);
    if (k.film && k.film.length) k.film.forEach(f => (f.sections || []).forEach(s => h += secHTML(s)));
    k.sections.forEach(s => h += secHTML(s));
  } else if (it.kind === "m") {
    const m = it.src;
    h += secHTML(["Text hook", "rows", [["Your text hook (on screen)", m.th], ["Inspo video's text hook", m.ith]]]);
    h += '<div class="section-h">Script</div><div class="group"><div class="pre">'+esc(m.body)+'</div></div>';
    h += secHTML(["Caption", "text", m.caption]);
    if (m.notes) h += secHTML(["Notes", "text", m.notes]);
    h += inspHTML(id, m.insp);
  } else if (it.kind === "h") {
    const s = it.src;
    h += secHTML(["Text hook", "rows", [["Your text hook (on screen)", s.textHook || ""], ["Inspo video's text hook", "DAY 32 / Building a business in ONE DAY"]]]);
    h += '<div class="section-h">Spoken hooks</div><div class="group">' + (s.hooks||[]).map((x,i) => '<div class="hk"><b>'+(i+1)+'</b><span>'+esc(x)+'</span></div>').join("") + '</div>';
    h += '<div class="section-h">Body</div><div class="group"><div class="pre">'+esc(s.body)+'</div></div>';
    h += '<div class="section-h">CTA</div><div class="group"><div class="cta">'+esc(s.cta)+'</div></div>';
    if (s.caption) h += secHTML(["Caption", "text", s.caption]);
    if (s.shots && s.shots.length) h += secHTML(["Shots", "list", s.shots]);
    if (s.fillins) h += secHTML(["Fill-ins", "text", s.fillins]);
    h += inspHTML(id, ["https://www.instagram.com/reel/C1kzUmsRcEl/", "https://www.instagram.com/reel/C23BpgAvnSH/", "https://www.instagram.com/reel/Ddw9G7eyvfP/"]);
  } else {
    const p = it.src;
    h += secHTML(["What this post is", "rows", [["Series", p.label + ": " + p.desc], ["Format", (p.s && p.s.fmt) || ""]].concat(p.s && p.s.format && p.s.format !== p.s.fmt ? [["Script format", p.s.format]] : [])]);
    if (p.th) h += secHTML(["Text hook", "rows", [["Your text hook (on screen)", p.th]].concat(p.ith ? [["Inspo video's text hook", p.ith]] : [])]);
    h += scriptHTML(p.s);
    if (p.sections) p.sections.forEach(s => h += secHTML(s));
    h += inspHTML(id, p.inspiration);
  }
  $("s-body").innerHTML = h; $("s-body").scrollTop = 0;
  $("scrim").classList.add("on"); $("sheet").classList.add("on");
  setTimeout(() => $("sheet").focus({preventScroll:true}), 50);
}
function closeSheet(){ sheetId = null; $("scrim").classList.remove("on"); $("sheet").classList.remove("on"); if (lastFocus && lastFocus.focus) lastFocus.focus({preventScroll:true}); }
document.addEventListener("click", e => {
  const c = e.target.closest("[role=checkbox][data-id]");
  if (c){ const id = c.dataset.id; done[id] = !done[id]; if (!done[id]) delete done[id]; save();
    document.querySelectorAll('[data-id="'+id+'"]').forEach(b => b.setAttribute("aria-checked", !!done[id]));
    const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  const o = e.target.closest("[data-open]"); if (o){ openSheet(o.dataset.open); return; }
  const w = e.target.closest("[data-day]"); if (w){ const ds = w.dataset.day; weekStart = mondayOf(ds); view = "week"; render(); scrollToDay(ds); return; }
});
$("v-w").onclick = () => { if (view !== "week"){ view = "week"; weekStart = mondayOf(clamp(month === clamp(TODAY).slice(0,7) ? clamp(TODAY) : (month + "-01" < FIRST ? FIRST : month + "-01"))); render(); window.scrollTo(0,0); } };
$("v-m").onclick = () => { if (view !== "month"){ view = "month"; month = clamp(weekStart).slice(0,7); render(); window.scrollTo(0,0); } };
$("prev").onclick = () => { if (view === "week"){ if (weekStart > FIRST){ weekStart = add(weekStart,-7); render(); window.scrollTo(0,0);} } else { const [y,m] = month.split("-").map(Number); const d = new Date(y, m-2, 1, 12); const k = iso(d).slice(0,7); if (k >= FIRST.slice(0,7)){ month = k; render(); } } };
$("next").onclick = () => { if (view === "week"){ if (add(weekStart,6) < LAST){ weekStart = add(weekStart,7); render(); window.scrollTo(0,0);} } else { const [y,m] = month.split("-").map(Number); const d = new Date(y, m, 1, 12); const k = iso(d).slice(0,7); if (k <= LAST.slice(0,7)){ month = k; render(); } } };
$("today").onclick = () => { if (view === "week"){ weekStart = mondayOf(clamp(TODAY)); render(); scrollToDay(clamp(TODAY)); } else { month = clamp(TODAY).slice(0,7); render(); } };
$("scrim").onclick = closeSheet; $("s-close").onclick = closeSheet;
document.addEventListener("keydown", e => { if (e.key === "Escape" && sheetId) closeSheet(); });
window.__app = { openSheet, closeSheet, setView: v => { view = v; render(); }, setWeek: d => { weekStart = mondayOf(d); render(); }, setMonth: m => { month = m; view = "month"; render(); } };
renderPlan(); if (location.hash === "#month") view = "month"; render();
if (view === "week" && TODAY >= FIRST && TODAY <= LAST) requestAnimationFrame(() => scrollToDay(TODAY));
})();
