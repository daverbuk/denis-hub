o", "B-roll: [Friday class moment that shows the point]", "On-screen text: [hook] / [tonight tip]"]], ["Where", "text", "Studio. Filmed on Sunday studio day."], ["Checklist", "check", ["Review the script with Gabriel", "Film on Sunday studio day", "Cut to 45 to 75 seconds", "Add on-screen text and subtitles", "No prices, no pitch", "Post on Kubot"]]], "s": {"hooks": ["Kids who build think differently. Here's how", "kids who build think differently", "The question I ask before I help any kid", "\"What have you tried?\" changes everything.", "Your kid doesn't need the answer. They need this question."], "body": "Kids who build think differently.\nHere's how.\nMost kids, when something goes wrong, look for an adult.\nThat's normal.\nHonestly, it's also the moment we usually take away the best part.\nThe kid who stares at the robot.\nThe kid who flips it over.\nThe kid who checks one wire, then the next.\nThat's problem solving.\nNot a worksheet.\nA loop.\nWhat's wrong? What could it be? Let me check.\nEvery build makes them run that loop again.\nAnd the more they run it, the faster they get.\nSo tonight, when they ask for help, ask one question first.\n\"What have you tried?\"\nThen listen.\nWhat did your kid say?", "cta": "Tonight: when they ask for help, ask \"what have you tried?\" first. Tell me what they said in the comments. Waitlist link in bio.", "src": "Plan v2 Why Build bank #1 (Problem solving): hook and tonight tip reused, new body", "kind": "new", "notes": "New body written from the plan v2 episode bank hook and 'do this tonight'. Concept-led, so no story from Gabriel is needed. Gabriel should adjust any line that isn't how he'd say it.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "Countdown", "desc": "Stakes update with a deadline, 30 to 45s", "has": true, "title": "29 days to open the world's first humanoid robot store", "s": {"hooks": ["29 days to open the world's first humanoid robot store", "29 days left and the robots still aren't here"], "body": "If this store isn't open in 29 days, [the real consequence, no money figures].\n\nThe problem is, look around. Right now, this room is [what it looks like today, one honest line].\n\nSo here's the plan. By December 1, [what goes where, in your own words].\n\nAnd honestly, that's why everybody my age wants to build software. If your app fails, you just delete the code off your laptop. In physical retail, the rent is due whether your shipment came in or not.\n\n[The one thing that has to happen this week.]\n\nThis is day 39 of 100 in 100. Follow along to see if we actually get the doors open in time. See you tomorrow for day 40.", "cta": "Follow to see if we open December 1", "src": "Rewritten Oct 23 from the inspo transcripts", "kind": "new", "notes": "Copies your own Dec 1 deadline reel (best share rate on the account) and Mino Lee's DAY 1 / DAY 32 vlogs (627K to 651K): the stake first, \"look around\", what this room has to become, the software vs retail line, the day count and \"see you tomorrow\".", "fillins": "", "format": "Stakes update", "fmt": "Stakes update"}, "inspiration": ["https://www.instagram.com/reel/C1kzUmsRcEl/", "https://www.instagram.com/reel/C23BpgAvnSH/", "https://www.instagram.com/reel/Ddw9G7eyvfP/"], "th": "29 days to open the world's first humanoid robot store", "ith": "DAY 32 / Building a business in ONE DAY"}, {"time": "", "label": "Hook test", "desc": "On-screen text over B-roll, 6 to 10s", "has": true, "title": "I am 21 and I'm not ashamed to admit that I thought I'd have a million followers by now. I have 14K.", "th": "I am 21 and I'm not ashamed to admit that I thought I'd have a million followers by now. I have 14K.", "ith": "I am 29 and I am not ashamed to admit that: (carousel, one honest admission per slide)", "inspiration": ["https://www.instagram.com/reel/DRKG_F5jHmG/"], "s": {"hooks": ["I am 21 and I'm not ashamed to admit that I thought I'd have a million followers by now. I have 14K."], "body": "[On screen, first line] I am 21 and I'm not ashamed to admit\n\n[Second line] that I thought I'd have a million followers by now.\n\n[Third line] I have 14K.", "cta": "Caption: I've had videos hit millions of views, and I still have 14K followers on this page. That used to eat at me. Then I realized the people who stayed are here for me, not for one video. I'd rather have 14K people watching me build something real than a million who forgot me the next day.\n\nIf you feel the same, you're not alone.\n\nfollow @denisaverbuk for more real talk", "src": "Hook formats Denis found, written Oct 23", "kind": "new", "notes": "Copies @laurastravl's \"I am 29 and I am not ashamed to admit that:\" post. Hook on screen over a casual shot of you, then the honest admission. The caption tells the full story and what you learned. Don't try to sound perfect; the goal is people thinking \"I feel exactly the same.\" Only post the lines that are true for you. Her setup: one slow, pretty B-roll clip (you looking out, walking, at the desk, the print farm at night), white text centered on screen, an emotional trending song (hers use songs like \"To Build A Home\"). No talking. Pull the clip from the B-roll library.", "fillins": "", "format": "I'm 21 and not ashamed", "fmt": "I'm 21 and not ashamed"}}]}, {"date": "2026-11-03", "dow": "Tue", "kubot": {"format": "Denis Builds", "title": "Kubot: Denis Builds", "sub": "Your kid draws it, we print it", "hook": "Your kid draws it, we print it", "badge": "", "needs": false, "film": [], "sections": [["Plan", "rows", [["Series", "Denis Builds: Denis on camera, building in public."], ["Episode", "Your kid draws it, we print it"], ["When to film", "Any time this week."]]], ["Shots", "list", ["Parts laid out on the table, one slow pan", "Build timelapse from a fixed angle", "The first time it works, one take", "Close-up of [the best detail]"]], ["Where", "text", "[where you build]"], ["Checklist", "check", ["Film while you build", "Cut to 30 to 45 seconds", "No prices, no pitch", "Post on Kubot"]]], "s": {"hooks": ["Your kid draws it, we print it", "A kid drew a robot. We printed it.", "Send us your kid's drawing.", "From a crayon drawing to a real part", "We turned a kid's drawing into a real robot part."], "body": "A kid drew this.\n[B-ROLL: the drawing, held up to camera]\nWe're going to try to print it.\nStep one. Turn the drawing into a 3D model.\n[how you modeled it, one honest line]\nStep two. Print it.\n[print time, real]\nStep three. Does it look like the drawing?\n[B-ROLL: drawing next to the print]\n[your honest reaction]\nAnd the best part is showing it to the kid who drew it.", "cta": "Send us your kid's drawing. We might print it next. Waitlist link in bio.", "src": "Plan v2 support content 'your kid draws it, we print it' + approved soft CTA (new script)", "kind": "new", "notes": "Only use a drawing from a family who said yes. First name only, signed release if the kid is on camera.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "How-to", "desc": "How-to list, 40 to 60s", "has": true, "title": "How To Become Incredibly Good At Designing In CAD", "s": {"hooks": ["How To Become Incredibly Good At Designing In CAD", "How to get incredibly good at 3D design (and I mean actually good)"], "body": "How to become incredibly good at designing in CAD, and I mean actually good. The kind of designer that can model anything they see.\n\nNumber one, copy real objects. Grab something on your desk, measure it, and model it exactly. Engineers call it reverse engineering. You're not uncreative, you just haven't trained your eye yet.\n\nNumber two, sketch before you extrude. Every good part starts as a fully constrained 2D sketch. When the sketch is right, the 3D part is easy.\n\nNumber three, design for the printer. Parts that fit together need a little gap, usually around two tenths of a millimeter. Same design with and without that gap is a part that snaps together versus one that never fits.\n\nEvery great designer does those three, and every one of them got to hold what they designed the same day, which is the part most people never get to. I print mine on 12 printers.", "cta": "Comment CAD and I'll send you the first part I'd model", "src": "Rewritten Oct 23 from the inspo transcripts", "kind": "new", "notes": "Copies \"How To Become Incredibly Good At Singing\" (195K on @dennyondabeat) line for line: identity line, exactly three tips, each with a real term and a \"you're not bad, you're just...\" reframe, then \"Every great X does those three\" into your CTA.", "fillins": "", "format": "How to become incredibly good", "fmt": "How to become incredibly good"}, "inspiration": ["https://www.instagram.com/reel/Dd78f_Ixoc4/", "https://www.instagram.com/reel/Dewq11ux5RI/", "https://www.instagram.com/reel/DeIuDFPR_db/"], "th": "How To Become Incredibly Good At Designing In CAD", "ith": "How To Become Incredibly Good At Singing"}, {"time": "", "label": "Hook test", "desc": "On-screen text over B-roll, 6 to 10s", "has": true, "title": "My favorite creator told me about the \"accordion method\" and it completely changed the way I make content", "th": "My favorite creator told me about the \"accordion method\" and it completely changed the way I make content", "ith": "I recently discovered \"The Empty Boat Theory\"... and it completely changed the way I see people.", "inspiration": ["https://www.instagram.com/reel/DbicgB4sRT4/"], "s": {"hooks": ["My favorite creator told me about the \"accordion method\" and it completely changed the way I make content"], "body": "[On screen, line 1] My favorite creator told me about the \"accordion method\"...\n\n[Line 2] and it completely changed the way I make content.", "cta": "Caption: My favorite creator, Caleb Ralston, calls it the accordion method.\n\nImagine an accordion. It opens wide, then closes tight, then opens again. That's what makes the music.\n\nI used to post nonstop, burn out, and disappear for weeks. Now I open up: post a lot to learn what you like. Then I close in: post less and put more into each one. Then open again.\n\nPosting stopped feeling like a grind and started feeling like a plan.\n\nfollow @denisaverbuk for more", "src": "Hook formats Denis found, written Oct 23", "kind": "new", "notes": "Copies @laurastravl's \"I recently discovered 'The Empty Boat Theory'... and it completely changed the way I see people\" (81.4K). On screen: just the hook, split in two lines. Caption shape: name the idea, \"Imagine...\" a concrete scene, what most people would do, \"now imagine\" the flip, \"life is often like that\", then what changed for you. Her setup: one slow, pretty B-roll clip (you looking out, walking, at the desk, the print farm at night), white text centered on screen, an emotional trending song (hers use songs like \"To Build A Home\"). No talking. Pull the clip from the B-roll library.", "fillins": "", "format": "The ___ theory", "fmt": "The ___ theory"}}]}, {"date": "2026-11-04", "dow": "Wed", "kubot": {"format": "Robot on the Street", "title": "Kubot: Robot on the Street", "sub": "What should kids learn that school doesn't teach?", "hook": "What should kids learn that school doesn't teach?", "badge": "", "needs": false, "film": [{"what": "Robot on the Street", "short": "Robot on the Street", "note": "Film today or earlier. Main question: What should kids learn that school doesn't teach?"}], "sections": [["Plan", "rows", [["Series", "Robot on the Street: the robot holds the mic and asks people one short question each."], ["Main question", "What should kids learn that school doesn't teach?"], ["Twist ending", "Gabriel steps in at the end: \"Robots don't teach here. Kids build them.\""], ["Goal", "5 to 6 good answers, a split reaction, then the twist. 30 to 45 seconds."], ["When to film", "Today or earlier."]]], ["Questions", "list", ["Would you let a robot teach your kid?", "Would you rather your kid use robots or build them?", "What should kids learn that school doesn't teach?", "Would your kid rather have an iPad or build a robot?", "Are you scared of AI for your kids?", "What did you build as a kid?", "If a robot could help with one thing at home, what would it be?", "Should kids learn to code or learn to build first?"]], ["Shots", "list", ["Opener: the robot turns to someone, mic up", "Opener line: \"Quick question from a robot. Got 5 seconds?\"", "Each answer: tight on the person, robot mic in frame", "Reactions: people laughing, pointing, filming the robot", "Wide establishing shot of the spot", "Gabriel walking in for the twist, then the line to camera"]], ["Where", "text", "[pick the spot]. Public sidewalks or a park. Ask before filming on private property. Robot at the edge of the walkway, not blocking it."], ["Checklist", "check", ["Pick the spot and time", "Charge the robot and the mic", "Print releases and bring pens", "Quick release from every face used, a parent's for kids", "Never mock anyone's answer", "Get 5 to 6 usable answers", "Film Gabriel's twist line", "Cut to 30 to 45 seconds with subtitles", "No prices, no pitch"]]], "s": {"hooks": ["What should kids learn that school doesn't teach?", "We asked Miami: what should kids learn that school doesn't teach?", "A robot asked strangers one question, and the answers get more honest", "People had opinions. Fast.", "Quick question from a robot. Got 5 seconds?"], "body": "ROBOT: Quick question from a robot. Got 5 seconds?\nROBOT: What should kids learn that school doesn't teach?\n[answer 1, word for word]\n[answer 2]\n[answer 3, the one that surprised you]\n[answer 4]\n[answer 5, a kid if there's a signed parent release]\n[B-ROLL: reactions, people filming the robot]\n[the split: who said yes, who said no, in one line]\nGABRIEL (to camera): Robots don't teach here. Kids build them.", "cta": "What would you answer? Comment it. Waitlist link in bio.", "src": "Plan v2 Robot on the Street format + content.py question list (structure reused; answers are real only)", "kind": "adapted", "notes": "Unscripted. Quick release from every face, a parent's for kids. Never mock an answer.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "POV", "desc": "Mostly visual, 20 to 35s", "has": true, "title": "My comments control 12 3D printers (part 2)", "s": {"hooks": ["My comments control 12 3D printers (part 2)", "You voted. 12 printers made it."], "body": "Update on my print farm. It's now [time], and you guys took over.\n\nThe most liked comment last week was [the comment]. So all 12 printers are on it right now.\n\n[Show the first part coming off a bed] It's already printed [how many] in the last [hours].\n\nComment what I should print next, and the top one goes on the farm next week.\n\nI'm gonna head home. My 12 printers will keep grinding away for me. We'll see how it turns out tomorrow morning.\n\n[Morning reveal]", "cta": "Comment what I should print next", "src": "Rewritten Oct 23 from the inspo transcripts", "kind": "new", "notes": "Copies Mino Lee's follow-up \"Update on my Claude editing team\" (187K). His exact shape: \"Update on my...\", the time, what changed since last time, the result so far, the comment CTA, then \"I'm gonna head to bed, they'll keep grinding, we'll see how it turns out tomorrow morning.\"", "fillins": "", "format": "Comments control the farm", "fmt": "Comments control the farm"}, "inspiration": ["https://www.instagram.com/reel/DegXneUNOip/", "https://www.instagram.com/reel/DejCX63y2LM/"], "th": "My comments control 12 3D printers (part 2)", "ith": "POV: Claude is editing 7 REELS while i sleep (idek how to code)"}, {"time": "", "label": "Hook test", "desc": "On-screen text over B-roll, 6 to 10s", "has": true, "title": "The biggest lesson I've learnt about robots is that it's NOT what the viral videos show", "th": "The biggest lesson I've learnt about robots is that it's NOT what the viral videos show", "ith": "The older I get, the more I realize that the real luxuries in life aren't things. They're time, health, peace of mind...", "inspiration": ["https://www.instagram.com/reel/DdGe93jsQFv/"], "s": {"hooks": ["The biggest lesson I've learnt about robots is that it's NOT what the viral videos show"], "body": "[On screen, all of it]\nThe biggest lesson I've learnt about robots is that it's NOT what the viral videos show.\nIt's slower, messier, still learning, and honestly more impressive once you see what's really happening.", "cta": "Caption: What would you add? Send this to someone who needs to hear it.\n\nfollow @denisaverbuk for more", "src": "Hook formats Denis found, written Oct 23", "kind": "new", "notes": "Copies @laurastravl's \"The older I get, the more I realize that the real luxuries in life aren't things. They're time, health, peace of mind...\" (35.3K). The whole message is on screen: the hook, then \"It's ...\" followed by a list. The caption stays short and asks people to add to the list and share it. Her setup: one slow, pretty B-roll clip (you looking out, walking, at the desk, the print farm at night), white text centered on screen, an emotional trending song (hers use songs like \"To Build A Home\"). No talking. Pull the clip from the B-roll library.", "fillins": "", "format": "Biggest lesson is NOT", "fmt": "Biggest lesson is NOT"}}]}, {"date": "2026-11-05", "dow": "Thu", "kubot": {"format": "Why Build", "title": "Kubot: Why Build", "sub": "#4 Fine motor skills", "hook": "Small parts, big brain", "badge": "", "needs": false, "film": [], "sections": [["Plan", "rows", [["Show", "Why Build? with Gabriel. Gabriel to camera, 45 to 75 seconds."], ["Episode", "#4 Fine motor skills"], ["Status", "Script drafted below. Gabriel to review before filming."]]], ["Inspo", "rows", [["Development point", "Fine motor skills"], ["Hook", "Small parts, big brain"], ["Do this tonight", "Lego, beads or a screwdriver set; anything with tiny pieces"]]], ["Shots", "list", ["Gabriel to camera, clean audio", "B-roll: [Friday class moment that shows the point]", "On-screen text: [hook] / [tonight tip]"]], ["Where", "text", "Studio. Filmed on Sunday studio day."], ["Checklist", "check", ["Review the script with Gabriel", "Film on Sunday studio day", "Cut to 45 to 75 seconds", "Add on-screen text and subtitles", "No prices, no pitch", "Post on Kubot"]]], "s": {"hooks": ["Small parts, big brain", "Those tiny pieces are doing more than you think.", "Why little hands need little parts", "The most underrated toy is a screwdriver.", "Every tiny screw is a brain workout."], "body": "Small parts, big brain.\nA lot of parents see tiny pieces and think, choking hazard, mess, lost under the couch.\nFair.\nBut those tiny pieces are doing something.\nThe kid who lines up a screw with a hole.\nThe kid who threads a wire through a gap smaller than their finger.\nThe kid who tries it five times and gets it on the sixth.\nThat's fine motor skill.\nThe same control they use to write, to tie shoes, to draw.\nA screen asks for a tap.\nA build asks for precision.\nTonight, give them something with tiny pieces.\nLego, beads, a screwdriver set.\nAnything they have to line up with their fingers.\nThen watch how focused they get.\nWhat's the smallest thing your kid can build with?", "cta": "Tonight: Lego, beads or a screwdriver set, anything with tiny pieces. What did they make? Comment it. Waitlist link in bio.", "src": "Plan v2 Why Build bank #4 (Fine motor skills): hook and tonight tip reused, new body", "kind": "new", "notes": "New body written from the plan v2 episode bank hook and 'do this tonight'. Concept-led, so no story from Gabriel is needed. Gabriel should adjust any line that isn't how he'd say it.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "Expose", "desc": "Deadpan talking head, about 60s", "has": true, "title": "Exposing random robot importer for 1 minute", "s": {"hooks": ["Exposing random robot importer for 1 minute", "What it actually takes to get a humanoid robot out of China"], "body": "[Shake the jar. Pull a slip. Read it.]\n\nImporting humanoid robots.\n\nI don't know a single thing that can go wrong.\n\n[Music hits.]\n\nMost humanoid robots being sold right now are made in China. So before one ever reaches a store in Miami, it has to cross an ocean and clear US customs.\n\n[The first real thing that went wrong with our shipment, one line.]\n\n[The paperwork nobody warned you about, one line.]\n\n[How long the robot actually sat somewhere before it moved.]\n\n[The thing that showed up that you didn't expect: the manual, the plug, the battery rules.]\n\n[The last, most surprising fact. End on it.]", "cta": "Caption: [the most surprising line] is crazy to me", "src": "Rewritten Oct 23 from the inspo transcripts", "kind": "new", "notes": "Copies leo.taps \"Exposing random Tech company for 1 minute\" (423K likes). His exact shape: say the subject, the fake-innocent line (\"I don't know a single Tesla controversy\"), then stack the facts fast, heaviest first, each with a source, and stop on the last fact with no wrap-up. Deadpan, no music until the first fact. Check every claim before filming. Every bracket must be something that really happened. Keep supplier names and terms vague, no figures.", "fillins": "", "format": "Uncovering (talking head)", "fmt": "Uncovering (talking head)"}, "inspiration": ["https://www.instagram.com/reel/DeyI4DxRiSC/", "https://www.instagram.com/reel/DYBaGViA4as/", "https://www.instagram.com/reel/DYr-bd5zAMW/"], "th": "Exposing random robot importer for 1 minute", "ith": "Exposing random Tech company for 1 minute"}, {"time": "", "label": "Hook test", "desc": "On-screen text over B-roll, 6 to 10s", "has": true, "title": "I am 21 and I'm not ashamed to admit that I'm opening a store with people way older than me, and I'm scared they'll realize I'm still figuring it out.", "th": "I am 21 and I'm not ashamed to admit that I'm opening a store with people way older than me, and I'm scared they'll realize I'm still figuring it out.", "ith": "I am 29 and I am not ashamed to admit that: (carousel, one honest admission per slide)", "inspiration": ["https://www.instagram.com/reel/DRKG_F5jHmG/"], "s": {"hooks": ["I am 21 and I'm not ashamed to admit that I'm opening a store with people way older than me, and I'm scared they'll realize I'm still figuring it out."], "body": "[On screen, first line] I am 21 and I'm not ashamed to admit\n\n[Second line] that I'm opening a store with people way older than me,\n\n[Third line] and I'm scared they'll realize I'm still figuring it out.", "cta": "Caption: My co-founder has taught kids robotics for over ten years. I'm 21. In meetings I sometimes nod at things I'll Google later. What I've learned is that nobody expected me to know everything. They expected me to show up and learn fast. That part I can do.\n\nIf you feel the same, you're not alone.\n\nfollow @denisaverbuk for more real talk", "src": "Hook formats Denis found, written Oct 23", "kind": "new", "notes": "Copies @laurastravl's \"I am 29 and I am not ashamed to admit that:\" post. Hook on screen over a casual shot of you, then the honest admission. The caption tells the full story and what you learned. Don't try to sound perfect; the goal is people thinking \"I feel exactly the same.\" Only post the lines that are true for you. Her setup: one slow, pretty B-roll clip (you looking out, walking, at the desk, the print farm at night), white text centered on screen, an emotional trending song (hers use songs like \"To Build A Home\"). No talking. Pull the clip from the B-roll library.", "fillins": "", "format": "I'm 21 and not ashamed", "fmt": "I'm 21 and not ashamed"}}]}, {"date": "2026-11-06", "dow": "Fri", "kubot": {"format": "Denis Builds", "title": "Kubot: Denis Builds", "sub": "The first thing we built inside the store", "hook": "The first thing we built inside the store", "badge": "Hero shoot 3:30 to 5 PM, Bal Harbour", "needs": false, "film": [{"what": "Kubot class, 3:30 to 5 PM, Bal Harbour", "note": "Hero shoot. Film testimonials and b-roll. Gabriel teaches, Denis films.", "sections": [["Capture list", "list", ["Door: signed parent photo and video release before any face is used", "Wide of the room before kids arrive", "Hands on CyberBricks and 3D printed parts (vertical and horizontal)", "Gabriel teaching: hands, face, parts, kids reacting", "A build failing, then a kid fixing it", "The first time a robot moves, plus the kid's face", "Wide room shots once it's full", "Pickup: a kid showing the build to a parent", "Parent answer at pickup (release-cleared only): \"What did you notice in your kid today?\" Get 2 to 3 clean answers for Saturday"]], ["Rules", "text", "No scripted kid interviews. No prices, no pitch. First names only, no school names. After class, confirm which faces are release-cleared before the edit."]], "short": "Class 3:30 to 5 PM, Bal Harbour"}], "sections": [["Plan", "rows", [["Series", "Denis Builds: Denis on camera, building in public."], ["Episode", "What got done at the store this week, what broke, what's next."], ["When to film", "Any time this week."]]], ["Shots", "list", ["Denis to camera at the store", "B-roll: [what got done]", "Close-up: [one detail]"]], ["Where", "text", "[where you're filming]"], ["Checklist", "check", ["Film during the week", "Cut to 30 to 45 seconds", "No prices, no pitch", "Post on Kubot"]]], "s": {"hooks": ["The first thing we built inside the store", "the first thing inside", "Here's the first thing that went into the store.", "It finally doesn't look empty.", "Week [X]: the first build inside"], "body": "The first thing we built inside the store.\n[B-ROLL: the store today]\nWhat got done: [what got done this week].\nWhat broke: [what broke, one honest line].\nWhat's next: [what's next before December 1st].\n[B-ROLL: one detail close up]\nMost founders only post the wins.\nAnd I think the broken part is the part worth ot launch of the week.", "fillins": "", "format": "Robot news breakdown", "fmt": "Robot news breakdown"}, "inspiration": ["https://www.instagram.com/reel/Da3U7H-O-UZ/", "https://www.instagram.com/reel/DYfQ9rdui0n/"], "th": "Would you let this robot into your house?", "ith": "None on screen. Rowan uses subtitles over split screen launch footage."}, {"time": "", "label": "Hook test", "desc": "On-screen text over B-roll, 6 to 10s", "has": true, "title": "My favorite creator told me about the \"top 10% rule\" and it completely changed the way I judge my own videos", "th": "My favorite creator told me about the \"top 10% rule\" and it completely changed the way I judge my own videos", "ith": "I recently discovered \"The Empty Boat Theory\"... and it completely changed the way I see people.", "inspiration": ["https://www.instagram.com/reel/DbicgB4sRT4/"], "s": {"hooks": ["My favorite creator told me about the \"top 10% rule\" and it completely changed the way I judge my own videos"], "body": "[On screen, line 1] My favorite creator told me about the \"top 10% rule\"...\n\n[Line 2] and it completely changed the way I judge my own videos.", "cta": "Caption: My favorite creator, Caleb Ralston, has a rule for this: study your top 10%.\n\nImagine a coach who only watches the games his team lost. He'd know every mistake and nothing about how they win.\n\nI was doing exactly that with my videos. Picking apart the average ones.\n\nNow every month I take my best 10%, find the one or two things they all share, and put those in everything. You learn more from your best work than your average.\n\nfollow @denisaverbuk for more", "src": "Hook formats Denis found, written Oct 23", "kind": "new", "notes": "Copies @laurastravl's \"I recently discovered 'The Empty Boat Theory'... and it completely changed the way I see people\" (81.4K). On screen: just the hook, split in two lines. Caption shape: name the idea, \"Imagine...\" a concrete scene, what most people would do, \"now imagine\" the feeling of [the honest feeling, even if it's not the one you expected].\n\nWhat I've learned is [the lesson, in your words].\n\n[One last line about why you'd still do it.]", "cta": "Caption: Would you have done it?", "src": "Rewritten Oct 23 from the inspo transcripts", "kind": "new", "notes": "Copies Mino Lee's \"POV: you chased one number for 13 months\" (416K): one honest monologue, the moment you thought would feel huge, how it actually felt, and the lesson. Every bracket has to be your real feeling, or the video doesn't work. Or pull the best 45 seconds from that week's podcast.", "fillins": "", "format": "Founder take", "fmt": "Founder take"}, "inspiration": ["https://www.instagram.com/reel/Dcy05J2Bypm/", "https://www.instagram.com/reel/Ddk9AwnsSBK/", "https://www.instagram.com/reel/DdmJNQJp81s/"], "th": "No one my age opens a store anymore", "ith": "POV: you chased money for 13 months straight"}, {"time": "", "label": "Hook test", "desc": "On-screen text over B-roll, 6 to 10s", "has": true, "title": "I am 21 and I'm not ashamed to admit that I put my own agency on hold because I couldn't do everything at once.", "th": "I am 21 and I'm not ashamed to admit that I put my own agency on hold because I couldn't do everything at once.", "ith": "I am 29 and I am not ashamed to admit that: (carousel, one honest admission per slide)", "inspiration": ["https://www.instagram.com/reel/DRKG_F5jHmG/"], "s": {"hooks": ["I am 21 and I'm not ashamed to admit that I put my own agency on hold because I couldn't do everything at once."], "body": "[On screen, first line] I am 21 and I'm not ashamed to admit\n\n[Second line] that I put my own agency on hold\n\n[Third line] because I couldn't do everything at once.", "cta": "Caption: I was running an AI automation agency, making content, and building a store. Something had to go. Pausing something you started feels like quitting. It's not. It's choosing. The store got all of me, and that's the only reason it has a chance.\n\nIf you feel the same, you're not alone.\n\nfollow @denisaverbuk for more real talk", "src": "Hook formats Denis found, written Oct 23", "kind": "new", "notes": "Copies @laurastravl's \"I am 29 and I am not ashamed to admit that:\" post. Hook on screen over a casual shot of you, then the honest admission. The caption tells the full story and what you learned. Don't try to sound perfect; the goal is people thinking \"I feel exactly the same.\" Only post the lines that are true for you. Her setup: one slow, pretty B-roll clip (you looking out, walking, at the desk, the print farm at night), white text centered on screen, an emotional trending song (hers use songs like \"To Build A Home\"). No talking. Pull the clip from the B-roll library.", "fillins": "", "format": "I'm 21 and not ashamed", "fmt": "I'm 21 and not ashamed"}}]}, {"date": "2026-11-09", "dow": "Mon", "kubot": {"format": "Why Build", "title": "Kubot: Why Build", "sub": "#5 Spatial thinking", "hook": "Designing in 3D rewires how kids see things", "badge": "", "needs": false, "film": [], "sections": [["Plan", "rows", [["Show", "Why Build? with Gabriel. Gabriel to camera, 45 to 75 seconds."], ["Episode", "#5 Spatial thinking"], ["Status", "Script drafted below. Gabriel to review before filming."]]], ["Inspo", "rows", [["Development point", "Spatial thinking"], ["Hook", "Designing in 3D rewires how kids see things"], ["Do this tonight", "Ask them to draw an object from three sides"]]], ["Shots", "list", ["Gabriel to camera, clean audio", "B-roll: [Friday class moment that shows the point]", "On-screen text: [hook] / [tonight tip]"]], ["Where", "text", "Studio. Filmed on Sunday studio day."], ["Checklist", "check", ["Review the script with Gabriel", "Film on Sunday studio day", "Cut to 45 to 75 seconds", "Add on-screen text and subtitles", "No prices, no pitch", "Post on Kubot"]]], "s": {"hooks": ["Designing in 3D rewires how kids see things", "designing in 3D rewires your kid", "Your kid sees the world in 2D. Building changes that.", "Draw it from three sides.", "The skill architects and engineers have in common"], "body": "Designing in 3D changes how kids see things.\nMost of what kids look at all day is flat.\nScreens. Pages. Pictures.\nThen they design something they have to print.\nSuddenly it has a top.\nA side.\nA bottom it has to stand on.\nThe kid who turns the model around and around.\nThe kid who realizes the wheel won't fit until they move it.\nThat's spatial thinking.\nSeeing something from every side in your head.\nIt's what builders, architects and engineers use every day.\nHere's a simple way to start it tonight.\nPick any object on the table.\nAsk them to draw it from the front, the side and the top.\nThree drawings.\nWhat did your kid pick to draw?", "cta": "Tonight: ask them to draw one object from three sides. Send us the drawing, we might print it. Waitlist link in bio.", "src": "Plan v2 Why Build bank #5 (Spatial thinking): hook and tonight tip reused, new body", "kind": "new", "notes": "New body written from the plan v2 episode bank hook and 'do this tonight'. Concept-led, so no story from Gabriel is needed. Gabriel should adjust any line that isn't how he'd say it.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "Countdown", "desc": "Stakes update with a deadline, 30 to 45s", "has": true, "title": "22 days to open the world's first humanoid robot store", "s": {"hooks": ["22 days to open the world's first humanoid robot store", "3 weeks left and this is what's not done"], "body": "Okay, today is day 46 of 100 in 100. We open a store in 22 days. Currently we are [where things really stand].\n\nIt's [time], [where you are].\n\nToday we're [what you're doing today]. We're not opening anything yet, and the next few weeks are gonna be kind of boring. It's not gonna be \"we opened a store\" every day.\n\n[Show the thing that went wrong this week, one line.]\n\nBut that's what a realistic founder day actually looks like. You just build it, one ugly day at a time.\n\nI'll see you tomorrow on day 47.", "cta": "Follow to see if we open December 1", "src": "Rewritten Oct 23 from the inspo transcripts", "kind": "new", "notes": "Copies Mino Lee's \"DAY 1 of road to 100K a month\" (651K): the day number and the goal, where you're at, the time, what today is, \"this is gonna be kind of boring\", the realistic day line, see you tomorrow.", "fillins": "", "format": "Stakes update", "fmt": "Stakes update"}, "inspiration": ["https://www.instagram.com/reel/C1kzUmsRcEl/", "https://www.instagram.com/reel/C23BpgAvnSH/", "https://www.instagram.com/reel/Ddw9G7eyvfP/"], "th": "22 days to open the world's first humanoid robot store", "ith": "DAY 32 / Building a business in ONE DAY"}, {"time": "", "label": "Hook test", "desc": "On-screen text over B-roll, 6 to 10s", "has": true, "title": "My favorite creator told me about \"intentional pairing\" and it completely changed the way I think about my personal brand", "th": "My favorite creator told me about \"intentional pairing\" and it completely changed the way I think about my personal brand", "ith": "I recently discovered \"The Empty Boat Theory\"... and it completely changed the way I see people.", "inspiration": ["https://www.instagram.com/reel/DbicgB4sRT4/"], "s": {"hooks": ["My favorite creator told me about \"intentional pairing\" and it completely changed the way I think about my personal brand"], "body": "[On screen, line 1] My favorite creator told me about \"intentional pairing\"...\n\n[Line 2] and it completely changed the way I think about my personal brand.", "cta": "Caption: My favorite creator, Caleb Ralston, says branding is just an intentional pairing of relevant things, done consistently.\n\nImagine hearing the name Michael Jordan. You don't think of a logo. You think of Nike, because they showed up together for decades.\n\nI was known for lists about guys. Now I pair myself with robots, 3D printing and building, every single day.\n\nThat's the brand. Not a logo. Repetition.\n\nfollow @denisaverbuk for more", "src": "Hook formats Denis found, written Oct 23", "kind": "new", "notes": "Copies @laurastravl's \"I recently discovered 'The Empty Boat Theory'... and it completely changed the way I see people\" (81.4K). On screen: just the hook, split in two lines. Caption shape: name the idea, \"Imagine...\" a concrete scene, what most people would do, \"now imagine\" the flip, \"life is often like that\", then what changed for you. Her setup: one slow, pretty B-roll clip (you looking out, walking, at the desk, the print farm at night), white text centered on screen, an emotional trending song (hers use songs like \"To Build A Home\"). No talking. Pull the clip from the B-roll library.", "fillins": "", "format": "The ___ theory", "fmt": "The ___ theory"}}]}, {"date": "2026-11-10", "dow": "Tue", "kubot": {"format": "Denis Builds", "title": "Kubot: Denis Builds", "sub": "Upgrading the tank", "hook": "Upgrading the tank", "badge": "", "needs": false, "film": [], "sections": [["Plan", "rows", [["Series", "Denis Builds: Denis on camera, building in public."], ["Episode", "Upgrading the tank"], ["When to film", "Any time this week."]]], ["Shots", "list", ["Parts laid out on the table, one slow pan", "Build timelapse from a fixed angle", "The first time it works, one take", "Close-up of [the best detail]"]], ["Where", "text", "[where you build]"], ["Checklist", "check", ["Film while you build", "Cut to 30 to 45 seconds", "No prices, no pitch", "Post on Kubot"]]], "s": {"hooks": ["Upgrading the tank", "I printed an upgrade for my tank. Then I reran the ridiculous test.", "Tank 2.0", "Round two: the rematch", "My tank lost round one. I fixed it."], "body": "I upgraded my 3D printed tank.\nThen I reran the most ridiculous test.\n[B-ROLL: the old tank, then the new part printing]\nThe upgrade: [UPGRADE: what you actually changed].\nWhy: [what didn't work last time].\n[B-ROLL: fitting the new part]\nThe rematch.\n[RIDICULOUS TEST: same test as last time]\n[what happened, one line]\nBuild: [score] out of 10.\nAnd honestly, building it again was more fun than the first time.", "cta": "What should I upgrade next? Waitlist link in bio.", "src": "kubot-builds-scripts.md Ep. 2 option B 'Upgrading the tank' (adapted)", "kind": "adapted", "notes": "", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "How-to", "desc": "How-to list, 40 to 60s", "has": true, "title": "How To Become Incredibly Good At Cold Emailing", "s": {"hooks": ["How To Become Incredibly Good At Cold Emailing", "How I get replies from companies that ignore everyone"], "body": "How to become incredibly good at cold emailing, and I mean actually good. The kind of person that gets replies from people who ignore everyone.\n\nNumber one, keep it short. A study of millions of emails found the ones between 50 and 125 words got the most replies. You're not getting ignored, you're getting skimmed.\n\nNumber two, ask for something small. Psychologists call it the foot in the door effect. Ask for a ten minute call, not a partnership. Small yes first, big yes later.\n\nNumber three, follow up. A lot of replies come on the second or third email, and most people stop at one. You're not annoying them, you're reminding them.\n\nEvery great dealmaker does those three, and every one of them sent a lot of emails before the one that mattered. It's how robot companies in China started answering a 21 year old.", "cta": "Comment EMAIL and I'll send you the exact template", "src": "Rewritten Oct 23 from the inspo transcripts", "kind": "new", "notes": "Copies \"How To Become Incredibly Good At Singing\" (195K on @dennyondabeat) line for line: identity line, exactly three tips, each with a real term and a \"you're not bad, you're just...\" reframe, then \"Every great X does those three\" into your CTA.", "fillins": "", "format": "How to become incredibly good", "fmt": "How to become incredibly good"}, "inspiration": ["https://www.instagram.com/reel/Dd78f_Ixoc4/", "https://www.instagram.com/reel/Dewq11ux5RI/", "https://www.instagram.com/reel/DeIuDFPR_db/"], "th": "How To Become Incredibly Good At Cold Emailing", "ith": "How To Become Incredibly Good At Singing"}, {"time": "", "label": "Hook test", "desc": "On-screen text over B-roll, 6 to 10s", "has": true, "title": "The biggest lesson I've learnt about content is that it's NOT about views", "th": "The biggest lesson I've learnt about content is that it's NOT about views", "ith": "The older I get, the more I realize that the real luxuries in life aren't things. They're time, health, peace of mind...", "inspiration": ["https://www.instagram.com/reel/DdGe93jsQFv/"], "s": {"hooks": ["The biggest lesson I've learnt about content is that it's NOT about views"], "body": "[On screen, all of it]\nThe biggest lesson I've learnt about content is that it's NOT about views.\nIt's who's watching, who stays, who messages you, and what they do after.", "cta": "Caption: What would you add? Send this to someone who needs to hear it.\n\nfollow @denisaverbuk for more", "src": "Hook formats Denis found, written Oct 23", "kind": "new", "notes": "Copies @laurastravl's \"The older I get, the more I realize that the real luxuries in life aren't things. They're time, health, peace of mind...\" (35.3K). The whole message is on screen: the hook, then \"It's ...\" followed by a list. The caption stays short and asks people to add to the list and share it. Her setup: one slow, pretty B-roll clip (you looking out, walking, at the desk, the print farm at night), white text centered on screen, an emotional trending song (hers use songs like \"To Build A Home\"). No talking. Pull the clip from the B-roll library.", "fillins": "", "format": "Biggest lesson is NOT", "fmt": "Biggest lesson is NOT"}}]}, {"date": "2026-11-11", "dow": "Wed", "kubot": {"format": "Robot on the Street", "title": "Kubot: Robot on the Street", "sub": "What did you build as a kid?", "hook": "What did you build as a kid?", "badge": "", "needs": false, "film": [{"what": "Robot on the Street", "short": "Robot on the Street", "note": "Film today or earlier. Main question: What did you build as a kid?"}], "sections": [["Plan", "rows", [["Series", "Robot on the Street: the robot holds the mic and asks people one short question each."], ["Main question", "What did you build as a kid?"], ["Twist ending", "Gabriel steps in at the end: \"Robots don't teach here. Kids build them.\""], ["Goal", "5 to 6 good answers, a split reaction, then the twist. 30 to 45 seconds."], ["When to film", "Today or earlier."]]], ["Questions", "list", ["Would you let a robot teach your kid?", "Would you rather your kid use robots or build them?", "What should kids learn that school doesn't teach?", "Would your kid rather have an iPad or build a robot?", "Are you scared of AI for your kids?", "What did you build as a kid?", "If a robot could help with one thing at home, what would it be?", "Should kids learn to code or learn to build first?"]], ["Shots", "list", ["Opener: the robot turns to someone, mic up", "Opener line: \"Quick question from a robot. Got 5 seconds?\"", "Each answer: tight on the person, robot mic in frame", "Reactions: people laughing, pointing, filming the robot", "Wide establishing shot of the spot", "Gabriel walking in for the twist, then the line to camera"]], ["Where", "text", "[pick the spot]. Public sidewalks or a park. Ask before filming on private property. Robot at the edge of the walkway, not blocking it."], ["Checklist", "check", ["Pick the spot and time", "Charge the robot and the mic", "Print releases and bring pens", "Quick release from every face used, a parent's for kids", "Never mock anyone's answer", "Get 5 to 6 usable answers", "Film Gabriel's twist line", "Cut to 30 to 45 seconds with subtitles", "No prices, no pitch"]]], "s": {"hooks": ["What did you build as a kid?", "We asked Miami: what did you build as a kid?", "A ro keep grinding, we'll see how it turns out tomorrow morning.\"", "fillins": "", "format": "Comments control the farm", "fmt": "Comments control the farm"}, "inspiration": ["https://www.instagram.com/reel/DegXneUNOip/", "https://www.instagram.com/reel/DejCX63y2LM/"], "th": "My comments control 12 3D printers (part 3)", "ith": "POV: Claude is editing 7 REELS while i sleep (idek how to code)"}, {"time": "", "label": "Hook test", "desc": "On-screen text over B-roll, 6 to 10s", "has": true, "title": "I am 21 and I'm not ashamed to admit that I film six videos a day for other brands just to keep building mine.", "th": "I am 21 and I'm not ashamed to admit that I film six videos a day for other brands just to keep building mine.", "ith": "I am 29 and I am not ashamed to admit that: (carousel, one honest admission per slide)", "inspiration": ["https://www.instagram.com/reel/DRKG_F5jHmG/"], "s": {"hooks": ["I am 21 and I'm not ashamed to admit that I film six videos a day for other brands just to keep building mine."], "body": "[On screen, first line] I am 21 and I'm not ashamed to admit\n\n[Second line] that I film six videos a day for other brands\n\n[Third line] just to keep building mine.", "cta": "Caption: Before I post anything here, I've usually filmed six videos for brands I work with. Some days I'm tired of my own voice before noon. Nobody sees that part. But that work is what lets me build this. If you're doing the boring thing to fund the real thing, you're not behind.\n\nIf you feel the same, you're not alone.\n\nfollow @denisaverbuk for more real talk", "src": "Hook formats Denis found, written Oct 23", "kind": "new", "notes": "Copies @laurastravl's \"I am 29 and I am not ashamed to admit that:\" post. Hook on screen over a casual shot of you, then the honest admission. The caption tells the full story and what you learned. Don't try to sound perfect; the goal is people thinking \"I feel exactly the same.\" Only post the lines that are true for you. Her setup: one slow, pretty B-roll clip (you looking out, walking, at the desk, the print farm at night), white text centered on screen, an emotional trending song (hers use songs like \"To Build A Home\"). No talking. Pull the clip from the B-roll library.", "fillins": "", "format": "I'm 21 and not ashamed", "fmt": "I'm 21 and not ashamed"}}]}, {"date": "2026-11-12", "dow": "Thu", "kubot": {"format": "Why Build", "title": "Kubot: Why Build", "sub": "#7 Creativity", "hook": "Your kid doesn't need more toys. They need this", "badge": "", "needs": false, "film": [], "sections": [["Plan", "rows", [["Show", "Why Build? with Gabriel. Gabriel to camera, 45 to 75 seconds."], ["Episode", "#7 Creativity"], ["Status", "Script drafted below. Gabriel to review before filming."]]], ["Inspo", "rows", [["Development point", "Creativity"], ["Hook", "Your kid doesn't need more toys. They need this"], ["Do this tonight", "Give them cardboard and tape and no instructions"]]], ["Shots", "list", ["Gabriel to camera, clean audio", "B-roll: [Friday class moment that shows the point]", "On-screen text: [hook] / [tonight tip]"]], ["Where", "text", "Studio. Filmed on Sunday studio day."], ["Checklist", "check", ["Review the script with Gabriel", "Film on Sunday studio day", "Cut to 45 to 75 seconds", "Add on-screen text and subtitles", "No prices, no pitch", "Post on Kubot"]]], "s": {"hooks": ["Your kid doesn't need more toys. They need this", "your kid doesn't need more toys", "Cardboard, tape, no instructions.", "The best toy has no instructions.", "Creativity isn't taught. It's allowed."], "body": "Your kid doesn't need more toys.\nThey need this.\nA box.\nSome tape.\nAnd no instructions.\nHonestly, most toys come with the idea already inside.\nHere's the car. Here's how it goes.\nThe kid just follows along.\nBut hand a kid a pile of parts with no picture on the box.\nThe kid who builds a car.\nThe kid who builds a car with wings.\nThe kid who builds something nobody has a name for.\nThat's creativity.\nIt isn't something you teach.\nIt's something you stop getting in the way of.\nTonight, give them cardboard and tape.\nNo instructions.\nWalk away for twenty minutes.\nWhat did your kid make?", "cta": "Tonight: cardboard, tape, no instructions. Send us a photo or a drawing of what they made. Waitlist link in bio.", "src": "Plan v2 Why Build bank #7 (Creativity): hook and tonight tip reused, new body", "kind": "new", "notes": "New body written from the plan v2 episode bank hook and 'do this tonight'. Concept-led, so no story from Gabriel is needed. Gabriel should adjust any line that isn't how he'd say it.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "News", "desc": "Split screen robot news, 40 to 60s", "has": true, "title": "This robot is disturbingly good at [X]", "s": {"hooks": ["This robot is disturbingly good at [X]", "Nobody is talking about this robot launch"], "body": "This robot is disturbingly good at [X].\n\nSo this robot that [what it does] just [launched / opened preorders]. It's called [name], built by a [city] startup called [company].\n\nIt's an interesting one because [what makes it different from every other robot you've seen].\n\nThe feature that I think a lot of people, including me, will be excited about is [the feature].\n\nNow it's worth noting that [the catch: remote operators, cameras in your home, what it can't do yet].\n\nIt costs [comparison, e.g. less than half of its biggest rival]. And if you're seriously considering it, [when and where it ships].\n\nI'm opening a humanoid robot store, so here's my take: [would you put it on the shelf, one line].\n\nI think the main takeaway, regardless of if you actually want one or not, is that [the big picture in one line]. If you want to stay in the loop on robots, follow for more.", "cta": "Follow for more", "src": "Rewritten Oct 23 from the inspo transcripts", "kind": "new", "notes": "Copies Rowan Cheung's robot launch breakdowns (64K and 28K likes): what it does, who built it and where, what makes it different, the feature people will want, \"now it's worth noting\" the catch, when it ships, the big takeaway, follow for more. Split screen: launch footage on top, you at the mic below. No exact prices, use comparisons. Check the corner of their demo for \"autonomous\" or a speed label.", "fillins": "", "format": "Robot news breakdown", "fmt": "Robot news breakdown"}, "inspiration": ["https://www.instagram.com/reel/Da3U7H-O-UZ/", "https://www.instagram.com/reel/DYfQ9rdui0n/"], "th": "This robot is disturbingly good at [X]", "ith": "None on screen. Rowan uses subtitles over split screen launch footage."}, {"time": "", "label": "Hook test", "desc": "On-screen text over B-roll, 6 to 10s", "has": true, "title": "My favorite creator told me about \"share the knowledge, sell the execution\" and it completely changed the way I think about giving things away for free", "th": "My favorite creator told me about \"share the knowledge, sell the execution\" and it completely changed the way I think about giving things away for free", "ith": "I recently discovered \"The Empty Boat Theory\"... and it completely changed the way I see people.", "inspiration": ["https://www.instagram.com/reel/DbicgB4sRT4/"], "s": {"hooks": ["My favorite creator told me about \"share the knowledge, sell the execution\" and it completely changed the way I think about giving things away for free"], "body": "[On screen, line 1] My favorite creator told me about \"share the knowledge, sell the execution\"...\n\n[Line 2] and it completely changed the way I think about giving things away for free.", "cta": "Caption: My favorite creator, Caleb Ralston, says: share the knowledge, sell the execution.\n\nImagine watching a hundred videos on fixing your motorcycle. You know exactly what to do. Then you look at the bike and pay the dealership that made the videos to do it.\n\nThat's literally what happened to him.\n\nI used to worry that if I taught everything for free, nobody would need me. Now I give everything away. Most people still want help doing it.\n\nfollow @denisaverbuk for more", "src": "Hook formats Denis found, written Oct 23", "kind": "new", "notes": "Copies @laurastravl's \"I recently discovered 'The Empty Boat Theory'... and it completely changed the way I see people\" (81.4K). On screen: just the hook, split in two lines. Caption shape: name the idea, \"Imagine...\" a concrete scene, what most people would do, \"now imagine\" the flip, \"life is often like that\", then what changed for you. Her setup: one slow, pretty B-roll clip (you looking out, walking, at the desk, the print farm at night), white text centered on screen, an emotional trending song (hers use songs like \"To Build A Home\"). No talking. Pull the clip from the B-roll library.", "fillins": "", "format": "The ___ theory", "fmt": "The ___ theory"}}]}, {"date": "2026-11-13", "dow": "Fri", "kubot": {"format": "Denis Builds", "title": "Kubot: Denis Builds", "sub": "What broke this week", "hook": "What broke this week", "badge": "Hero shoot 3:30 to 5 PM, Bal Harbour", "needs": false, "film": [{"what": "Kubot class, 3:30 to 5 PM, Bal Harbour", "note": "Hero shoot. Film testimonials and b-roll. Gabriel teaches, Denis films.", "sections": [["Capture list", "list", ["Door: signed parent photo and video release before any face is used", "Wide of the room before kids arrive", "Hands on CyberBricks and 3D printed parts (vertical and horizontal)", "Gabriel teaching: hands, face, parts, kids reacting", "A build failing, then a kid fixing it", "The first time a robot moves, plus the kid's face", "Wide room shots once it's full", "Pickup: a kid showing the build to a parent", "Parent answer at pickup (release-cleared only): \"What did you notice in your kid today?\" Get 2 to 3 clean answers for Saturday"]], ["Rules", "text", "No scripted kid interviews. No prices, no pitch. First names only, no school names. After class, confirm which faces are relea out, walking, at the desk, the print farm at night), white text centered on screen, an emotional trending song (hers use songs like \"To Build A Home\"). No talking. Pull the clip from the B-roll library.", "fillins": "", "format": "I'm 21 and not ashamed", "fmt": "I'm 21 and not ashamed"}}]}, {"date": "2026-11-15", "dow": "Sun", "kubot": {"format": "Podcast", "title": "Kubot: Podcast", "sub": "Ep. 5: 10 years of watching kids fail and fix things", "hook": "What 10 years of teaching kids taught Gabriel about failure", "badge": "Studio day", "needs": false, "film": [{"what": "Why Build #8 Patience", "short": "Why Build #8", "note": "Posts Mon Nov 16.", "ref": "2026-11-16"}, {"what": "Why Build #9 Math and science made real", "short": "Why Build #9", "note": "Posts Thu Nov 19.", "ref": "2026-11-19"}, {"what": "Podcast ep. 6", "short": "Podcast ep. 6", "note": "Posts Sun Nov 22.", "ref": "2026-11-22"}], "sections": [["Plan", "rows", [["Episode", "Podcast ep. 5. Full episode on YouTube and Spotify, plus one clip on Kubot."], ["Filmed", "Last Sunday's studio day."]]], ["Inspo", "rows", [["Show", "Founders podcast: weekly build in public episode, 30 to 45 minutes, Denis and Gabriel hosting. Cut into 5 to 8 short clips."], ["This episode", "[topic to pick]. Idea: the best comments and parent questions from the week."]]], ["Shape", "text", "1. Cold open (1 to 2 min): Denis sets up [topic].\n2. Main conversation (15 to 20 min): [topic], with real classroom moments, not slogans.\n3. Week in the build (3 to 5 min): what got done at the store, what broke, what's next.\n4. Kid of the week (optional): a Friday kid explains their robot, with a parent on mic. Only if release-cleared.\n5. What to try tonight (5 min): one tip for parents.\n6. Close (2 min): tease next week."], ["Questions", "list", ["[the best parent question from this week's comments]", "[the second best parent question]", "What broke this week, and what's next before the store opens?", "If a parent has 20 minutes tonight, what should they try?"]], ["Shots", "list", ["Wide two-shot, plus a single on each host", "Print farm and robots visible behind", "Clip targets: one Gabriel line that stands alone, one parent tip for tonight"]], ["Where", "text", "Studio. Audio: the podcast mics, test recording first."], ["Checklist", "check", ["Upload the full episode to YouTube and Spotify", "Cut one clip for Kubot", "Mark 5 to 8 clips for later", "No prices, no pitch", "Reply to comments in the first hour"]]], "s": {"hooks": ["What 10 years of teaching kids taught Gabriel about failure", "Gabriel has watched kids fail for 10 years. Here's what he learned.", "Why the best builders fail the most", "Let them get stuck.", "The moment a kid stops asking for help"], "body": "DENIS (cold open): Gabriel has watched kids get stuck for over 10 years. I wanted to know what he's learned.\nDENIS: What's the first thing a kid does when a build fails?\nGABRIEL: [his answer, in his words]\nDENIS: When should a parent step in?\nGABRIEL: [his answer]\nDENIS: Store update. [what got done, what broke, what's next]\nCLIP FOR KUBOT: [the line about letting kids get stuck]", "cta": "Full episode on YouTube and Spotify. What should we ask Gabriel next? Waitlist link in bio.", "src": "Plan v2 podcast segments + parent questions (new episode plan)", "kind": "new", "notes": "Gabriel's answers are his, unscripted. Only the cold open and questions are written.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "Take", "desc": "Founder take or personality read, 30 to 60s", "has": true, "title": "Your favourite tech founder tells me something about your personality (Elon edition)", "s": {"hooks": ["Your favourite tech founder tells me something about your personality (Elon edition)", "What your favourite founder says about you (Steve Jobs edition)"], "body": "Your favorite founder tells me something about your personality. If it's Elon Musk, you've got something psychologists call risk tolerance. It's a real trait. It's how much uncertainty you can stomach for a shot at something huge.\n\nThat's his whole story. After PayPal, he put almost everything he had into rockets and electric cars, when people called both a joke. In 2008 both companies nearly went under.\n\nSo if he's your favorite, you'd rather bet big and be wrong than play it safe and be forgettable.\n\nAnd researchers say people who start companies tend to score higher on risk tolerance, mainly because they can act before everything is certain.\n\nCatch is, risk tolerance without a plan is just gambling.", "cta": "Comment your favorite founder and I'll do them next", "src": "Rewritten Oct 23 from the inspo transcripts", "kind": "new", "notes": "Copies \"What Your Favorite Artist Says About You (Oasis Edition)\" (75K on @dennyondabeat): trait, one-line definition, the story, \"so if they're your favorite\", the research line, the catch.", "fillins": "", "format": "Personality read", "fmt": "Personality read"}, "inspiration": ["https://www.instagram.com/reel/DeTLLuYxMo9/", "https://www.instagram.com/reel/DeBE-NzRUXf/", "https://www.instagram.com/reel/DZRSDmKO_-o/"], "th": "Your favourite tech founder tells me something about your personality (Elon edition)", "ith": "What Your Favorite Artist Says About You (Oasis Edition)"}, {"time": "", "label": "Hook test", "desc": "On-screen text over B-roll, 6 to 10s", "has": true, "title": "My favorite creator told me about \"trust before transactions\" and it completely changed the way I think about selling", "th": "My favorite creator told me about \"trust before transactions\" and it completely changed the way I think about selling", "ith": "I recently discovered \"The Empty Boat Theory\"... and it completely changed the way I see people.", "inspiration": ["https://www.instagram.com/reel/DbicgB4sRT4/"], "s": {"hooks": ["My favorite creator told me about \"trust before transactions\" and it completely changed the way I think about selling"], "body": "[On screen, line 1] My favorite creator told me about \"trust before transactions\"...\n\n[Line 2] and it completely changed the way I think about selling.", "cta": "Caption: My favorite creator, Caleb Ralston, says trust comes before transactions.\n\nImagine a stranger stops you on the street and tries to sell you something. Now imagine a friend you've watched build something for months tells you it's ready.\n\nSame product. Completely different answer.\n\nSo for now I just show you the build. No pitch. When the doors open, you'll already know what's inside.\n\nfollow @denisaverbuk for more", "src": "Hook formats Denis found, written Oct 23", "kind": "new", "notes": "Copies @laurastravl's \"I recently discovered 'The Empty Boat Theory'... and it completely changed the way I see people\" (81.4K). On screen: just the hook, split in two lines. Caption shape: name the idea, \"Imagine...\" a concrete scene, what most people would do, \"now imagine\" the flip, \"life is often like that\", then what changed for you. Her setup: one slow, pretty B-roll clip (you looking out, walking, at the desk, the print farm at night), white text centered on screen, an emotional trending song (hers use songs like \"To Build A Home\"). No talking. Pull the clip from the B-roll library.", "fillins": "", "format": "The ___ theory", "fmt": "The ___ theory"}}]}, {"date": "2026-11-16", "dow": "Mon", "kubot": {"format": "Why Build", "title": "Kubot: Why Build", "sub": "#8 Patience", "hook": "A 3D print takes hours. That's the lesson", "badge": "", "needs": false, "film": [], "sections": [["Plan", "rows", [["Show", "Why Build? with Gabriel. Gabriel to camera, 45 to 75 seconds."], ["Episode", "#8 Patience"], ["Status", "Script drafted below. Gabriel to review before filming."]]], ["Inspo", "rows", [["Development point", "Patience"], ["Hook", "A 3D print takes hours. That's the lesson"], ["Do this tonight", "Start something that finishes tomorrow, like seeds or a slow build"]]], ["Shots", "list", ["Gabriel to camera, clean audio", "B-roll: [Friday class moment that shows the point]", "On-screen text: [hook] / [tonight tip]"]], ["Where", "text", "Studio. Filmed on Sunday studio day."], ["Checklist", "check", ["Review the script with Gabriel", "Film on Sunday studio day", "Cut to 45 to 75 seconds", "Add on-screen text and subtitles", "No prices, no pitch", "Post on Kubot"]]], "s": {"hooks": ["A 3D print takes hours. That's the lesson", "a 3D print takes hours", "The best thing about a 3D printer is how slow it is.", "Kids can wait. We just stopped asking them to.", "Patience is a skill. Here's how kids practice it."], "body": "A 3D print takes hours.\nThat's the lesson.\nEverything else in a kid's day is instant.\nTap, and the video plays.\nSwipe, and there's a new one.\nThen they design a part and hit print.\nAnd it's slow.\nLayer by layer.\nThe kid who checks on it every five minutes.\nThe kid who learns to start it before dinner and see it after.\nThat waiting is a skill.\nKids are good at it when it's for something they made.\nHonestly, I think we just stopped asking them to wait.\nTonight, start something that finishes tomorrow.\nPlant a seed.\nStart a slow build.\nThen check on it together in the morning.\nWhat's something your kid can't wait for?", "cta": "Tonight: start something that finishes tomorrow, like seeds or a slow build. Tell me what you picked. Waitlist link in bio.", "src": "Plan v2 Why Build bank #8 (Patience): hook and tonight tip reused, new body", "kind": "new", "notes": "New body written from the plan v2 episode bank hook and 'do this tonight'. Concept-led, so no story from Gabriel is needed. Gabriel should adjust any line that isn't how he'd say it.", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "Countdown", "desc": "Stakes update with a deadline, 30 to 45s", "has": true, "title": "15 days to open the world's first humanoid robot store", "s": {"hooks": ["15 days to open the world's first humanoid robot store", "Can we finish [the hardest part] in one day?"], "body": "Is it possible to finish [the hardest part of the store] in one day? We open in 15 days.\n\nMy plan today is to lock myself in the store for the next [hours] hours and not leave until it's done.\n\n[Time stamp] Okay, it's been [hours] hours. [What's done, what's not.] Still feeling [honest].\n\n[Time stamp] It's [time]. We still have to [what's left]. A little behind schedule. A little stressed.\n\n[Time stamp] It is now [late time]. [The result, honestly.]\n\nNo matter what happens, I'm proud of what we built today. I'll see you tomorrow for day 54.", "cta": "Follow to see if we open December 1", "src": "Rewritten Oct 23 from the inspo transcripts", "kind": "new", "notes": "Copies Mino Lee's \"DAY 32: building a business in ONE DAY\" (627K): the challenge question, the plan, time stamps through the day with honest stress, the result at the end of the night, \"I'll see you guys tomorrow.\"", "fillins": "", "format": "Stakes update", "fmt": "Stakes update"}, "inspiration": ["https://www.instagram.com/reel/C1kzUmsRcEl/", "https://www.instagram.com/reel/C23BpgAvnSH/", "https://www.instagram.com/reel/Ddw9G7eyvfP/"], "th": "15 days to open the world's first humanoid robot store", "ith": "DAY 32 / Building a business in ONE DAY"}, {"time": "", "label": "Hook test", "desc": "On-screen text over B-roll, 6 to 10s", "has": true, "title": "The biggest lesson I've learnt about learning is that it's NOT watching tutorials", "th": "The biggest lesson I've learnt about learning is that it's NOT watching tutorials", "ith": "The older I get, the more I realize that the real luxuries in life aren't things. They're time, health, peace of mind...", "inspiration": ["https://www.instagram.com/reel/DdGe93jsQFv/"], "s": {"hooks": ["The biggest lesson I've learnt about learning is that it's NOT watching tutorials"], "body": "[On screen, all of it]\nThe biggest lesson I've learnt about learning is that it's NOT watching tutorials.\nIt's printing other people's files, failing a lot, asking dumb questions, and doing it badly first.", "cta": "Caption: What would you add? Send this to someone who needs to hear it.\n\nfollow @denisaverbuk for more", "src": "Hook formats Denis found, written Oct 23", "kind": "new", "notes": "Copies @laurastravl's \"The older I get, the more I realize that the real luxuries in life aren't things. They're time, health, peace of mind...\" (35.3K). The whole message is on screen: the hook, then \"It's ...\" followed by a list. The caption stays short and asks people to add to the list and share it. Her setup: one slow, pretty B-roll clip (you looking out, walking, at the desk, the print farm at night), white text centered on screen, an emotional trending song (hers use songs like \"To Build A Home\"). No talking. Pull the clip from the B-roll library.", "fillins": "", "format": "Biggest lesson is NOT", "fmt": "Biggest lesson is NOT"}}]}, {"date": "2026-11-17", "dow": "Tue", "kubot": {"format": "Denis Builds", "title": "Kubot: Denis Builds", "sub": "We printed a kid's drawing. Does it move?", "hook": "We printed a kid's drawing. Does it move?", "badge": "", "needs": false, "film": [], "sections": [["Plan", "rows", [["Series", "Denis Builds: Denis on camera, building in public."], ["Episode", "We printed a kid's drawing. Does it move?"], ["When to film", "Any time this week."]]], ["Shots", "list", ["Parts laid out on the table, one slow pan", "Build timelapse from a fixed angle", "The first time it works, one take", "Close-up of [the best detail]"]], ["Where", "text", "[where you build]"], ["Checklist", "check", ["Film while you build", "Cut to 30 to 45 seconds", "No prices, no pitch", "Post on Kubot"]]], "s": {"hooks": ["We printed a kid's drawing. Does it move?", "part 2: does it move?", "Last time we printed a kid's drawing. Now we're making it move.", "A drawing that drives", "From drawing to robot, part 2"], "body": "Last time, we printed a kid's drawing.\nToday we try to make it move.\n[B-ROLL: the print from last time]\nStep one. Add the CyberBricks parts: [what you added].\nStep two. Wire it.\n[what went wrong, one honest line]\nStep three. The first drive.\n[B-ROLL: first drive, one take]\n[what happened]\nAnd now the kid who drew it has a robot that started on paper.", "cta": "Send us your kid's drawing. Waitlist link in bio.", "src": "Follow up to the 'your kid draws it' idea from plan v2 (new script)", "kind": "new", "notes": "", "fillins": "", "format": ""}, "inspiration": []}, "personal": [{"time": "6:00 PM", "label": "How-to", "desc": "How-to list, 40 to 60s", "has": true, "title": "How To Become Incredibly Good At Talking To Strangers", "s": {"hooks": ["How To Become Incredibly Good At Talking To Strangers", "How I got disgustingly good at talking to anyone"], "body": "How to become incredibly good at talking to strangers, and I mean actually good. The kind of person that can walk up to anyone and leave with a friend.\n\nNumber one, ask a question in the first five seconds. Harvard researchers found people like you more when you ask more questions. You're not boring, you're talking about yourself.\n\nNumber two, know that you're liked more than you think. Psychologists call it the liking gap. After a conversation, people consistently underestimate how much the other person liked them.\n\nNumber three, do it every day. The fear drops every time you do it. Psychologists call it exposure. Day one feels impossible, day thirty feels normal.\n\nEvery great talker does those three, and every one of them did it way more times than felt comfortable. I've done it with a humanoid robot holding the mic.", "cta": "Comment TALK and I'll send you the openers I use", "src": "Rewritten Oct 23 from the inspo transcripts", "kind": "new", "notes": "Copies \"How To Become Incredibly Good At Singing\" (195K on @dennyondabeat) line for line: identity line, exactly three tips, each with a real term and a \"
