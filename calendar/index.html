":"2026-12-01","dow":"Tue","kubot":{"format":"Denis Builds","title":"Kubot: Denis Builds","sub":"The doors open today","hook":"The doors open today","badge":"","needs":false,"film":[],"sections":[["Today","text","The Kubot store opens today."],["Plan","rows",[["Series","Denis Builds: Denis on camera, building in public."],["Episode","The doors open today"],["When to film","Any time this week."]]],["Shots","list",["Parts laid out on the table, one slow pan","Build timelapse from a fixed angle","The first time it works, one take","Close-up of [the best detail]"]],["Where","text","[where you build]"],["Checklist","check",["Film while you build","Cut to 30 to 45 seconds","No prices, no pitch","Post on Kubot"]]],"s":{"hooks":["The doors open today","doors open today","Today, the empty room gets its first kid.","We open today.","Opening day."],"body":"Today the doors open.\n[B-ROLL: the store, morning, before anyone arrives]\nA few months ago, this was an empty room.\n[B-ROLL: the empty room footage from October]\nNow it's [what it looks like today].\n[B-ROLL: printers, robots, the build tables]\nThe first kid walks in at [time].\nAnd this is what we built it for.","cta":"Link in bio. Thank you for following the empty room.","src":"Store countdown series, final episode (new script)","kind":"new","notes":"Dec 1. No prices, no pitch. Release-cleared faces only.","fillins":"","format":""}},"personal":[{"time":"9:30 AM","label":"Trial Reel","desc":"Quote reel shown to non-followers","has":true,"title":"Learning maxxing 101, but each step gets more uncomfortable","s":{"hooks":["I had to [learning goal]. And [how much you knew before].","learning maxxing 101 (story edition)","Learning in private is the slowest way to learn.","Waiting until you're good to post? Wrong order.","The fastest way to learn something is to post about it."],"body":"(1 HOOK)\nI had to [the learning goal, e.g. learn robots and 3D printing well enough to explain them on camera for Kubot].\nAnd [how much you knew about it before, in one honest line].\n\n(2 RISING ACTION)\nLearning in private is the slowest way to learn.\nWaiting until you're good to post? Wrong order.\n[B-ROLL: you with a printer, a robot kit, notes, the first thing you tried]\nSo I [first thing you did to learn it].\nThen I posted it before I was ready. [what the first post or video was].\nUGC taught me that. [one thing UGC taught you about posting before you're ready].\n\n(3 SECOND CONFLICT)\nThen [the midpoint setback, e.g. a post that flopped, a comment that called you out, a print or build that failed on camera].\n[how it felt, one line].\n\n(4 CLIMAX) [MUSIC: beat drop. Tip: use a song from one of your favorite movies]\nI kept posting. [what you did next].\n[the moment learning in public paid off, e.g. a comment, a question you could finally answer, someone who reached out].\nON-SCREEN: post what you're learning\n\n(5 RESOLUTION)\n[the learning goal achieved, said plainly].\nAnd the version of you that's scared to post the bad first video is the only thing between you and the good tenth one.","cta":"Comment what you're learning in public right now.","src":"Denis Content Scripts sheet #7 (reused)","kind":"reused","notes":"Story format v2 (5-step). Source: Steph Smith taught herself to code, documented it, and each project made the next easier.\nDebatable lines: \"Learning in private is the slowest way to learn\" and \"Waiting until you're good to post? Wrong order.\"\nKeeps the maxxing flavor in the text hook and the fragments, now as a story.\nKubot mention is short and soft. No pitch, no date. Use real footage (a print, the Friday class), no staged late-night shots.\n~45-55s.","fillins":"- [the learning goal]: one you actually reached, e.g. explaining robots and 3D printing on camera\n- [how much you knew about it before, in one honest line]\n- [first thing you did to learn it]\n- [what the first post or video was]\n- [one thing UGC taught you about posting before you're ready]\n- [the midpoint setback]: real, e.g. a flop, a call-out comment, a failed build on camera + [how it felt]\n- [what you did next] + [the moment learning in public paid off]\n- [the learning goal achieved]","format":"Maxxing 101, 5-step story (v2)"}},{"time":"1:30 PM","label":"Follower Farming","desc":"Identity list, 25 to 35s","has":true,"title":"How you react to a failed plan tells me how far you'll go","s":{"hooks":["your plan B exposes you","How you react when a plan fails tells me how far you'll go.","The plan failed. What do you do?","Where do you land on the resilience meter?","Failure tells me everything about you."],"body":"ON-SCREEN: a \"resilience meter\" fills with each point (on screen, not spoken).\n\nHow you react when a plan fails tells me how far you'll go.\n1. Blaming the timing. We've all been there. [METER 10%]\n2. Telling everyone it was never that serious. [METER 20%]\n3. Writing down what went wrong, to make sure you only pay for that lesson once. [METER 35%]\n4. Taking a day off. [METER 50%]\n5. Calling the one person who's been through it. [METER 60%]\n6. Starting plan B the same week, to keep the momentum from dying with plan A. [METER 75%]\n7. Being grateful it failed early. [METER 90%]\n8. And laughing about it a year later, because the failure was the part of the story that made the ending good. [METER 100%]","cta":"Tag the friend who's stuck at 10%.","src":"New (no old script fit): identity list with a meter","kind":"new","notes":"","fillins":"","format":"Follower farm list"}},{"time":"6:00 PM","label":"My Take","desc":"Personal bet take, 55 to 65s","has":true,"title":"Don't follow the trend. Follow the question.","s":{"hooks":["stop chasing trends","Every trend is over by the time you join it.","Don't follow trends. Follow questions.","The creators who last don't chase trends.","My take on trends."],"body":"Every trend is half over by the time you see it.\nHear me out.\nChasing trends feels smart.\nIt's actually always late.\nQuestions last longer.\nWhat are people confused about?\nWhat do they keep asking?\nWhat would they pay to understand?\nHonestly? My best videos never came from a trend.\nThey came from a question I actually wanted answered.\nAnd if you answer real questions, you never run out of things to say.","cta":"So tell me. What question should I answer next? Comment it.","src":"New (no old script fit): opinion / bet take","kind":"new","notes":"","fillins":"","format":"Personal take"}}]},{"date":"2026-12-02","dow":"Wed","kubot":{"format":"Robot on the Street","title":"Kubot: Robot on the Street","sub":"What would your kid build first?","hook":"What would your kid build first?","badge":"","needs":false,"film":[{"what":"Robot on the Street","short":"Robot on the Street","note":"Film today or earlier. Main question: What would your kid build first?"}],"sections":[["Plan","rows",[["Series","Robot on the Street: the robot holds the mic and asks people one short question each."],["Main question","What would your kid build first?"],["Twist ending","Gabriel steps in at the end: \"Robots don't teach here. Kids build them.\""],["Goal","5 to 6 good answers, a split reaction, then the twist. 30 to 45 seconds."],["When to film","Today or earlier."]]],["Questions","list",["Would you let a robot teach your kid?","Would you rather your kid use robots or build them?","What should kids learn that school doesn't teach?","Would your kid rather have an iPad or build a robot?","Are you scared of AI for your kids?","What did you build as a kid?","If a robot could help with one thing at home, what would it be?","Should kids learn to code or learn to build first?"]],["Shots","list",["Opener: the robot turns to someone, mic up","Opener line: \"Quick question from a robot. Got 5 seconds?\"","Each answer: tight on the person, robot mic in frame","Reactions: people laughing, pointing, filming the robot","Wide establishing shot of the spot","Gabriel walking in for the twist, then the line to camera"]],["Where","text","[pick the spot]. Public sidewalks or a park. Ask before filming on private property. Robot at the edge of the walkway, not blocking it."],["Checklist","check",["Pick the spot and time","Charge the robot and the mic","Print releases and bring pens","Quick release from every face used, a parent's for kids","Never mock anyone's answer","Get 5 to 6 usable answers","Film Gabriel's twist line","Cut to 30 to 45 seconds with subtitles","No prices, no pitch"]]],"s":{"hooks":["What would your kid build first?","We asked Miami: what would your kid build first?","A robot asked strangers one question, and the answers get more honest","People had opinions. Fast.","Quick question from a robot. Got 5 seconds?"],"body":"ROBOT: Quick question from a robot. Got 5 seconds?\nROBOT: What would your kid build first?\n[answer 1, word for word]\n[answer 2]\n[answer 3, the one that surprised you]\n[answer 4]\n[answer 5, a kid if there's a signed parent release]\n[B-ROLL: reactions, people filming the robot]\n[the split: who said yes, who said no, in one line]\nGABRIEL (to camera): Robots don't teach here. Kids build them.","cta":"What would you answer? Comment it. Waitlist link in bio.","src":"Plan v2 Robot on the Street format + content.py question list (structure reused; answers are real only)","kind":"adapted","notes":"Unscripted. Quick release from every face, a parent's for kids. Never mock an answer.","fillins":"","format":""}},"personal":[{"time":"9:30 AM","label":"Trial Reel","desc":"Quote reel shown to non-followers","has":true,"title":"We opened the doors","s":{"hooks":["we opened","We opened the doors.","Opening day at 21. Here's what happened.","The empty room finally got its first kid.","Day one. Doors open."],"body":"(1 HOOK)\nI wanted Open the doors December 1st..\nAnd [what almost stopped it, honestly].\n\n(2 RISING ACTION)\nEveryone imagines opening day going perfectly.\nHonestly? Opening day is the start, not the finish line.\n[B-ROLL: opening day, release-cleared faces only]\nSo I [first real action].\nThen [second real action].\n[one honest line on how unprepared you were].\n\n(3 SECOND CONFLICT)\n[what went wrong on the day]\n[how it felt, one line].\n\n(4 CLIMAX) [MUSIC: beat drop]\n[the first kid's robot moving, or the moment that hit you].\n[B-ROLL: that exact moment, slowed down]\n\n(5 RESOLUTION)\n[how it felt].\nAnd now the real work starts.","cta":"Thank you to everyone who followed the empty room.","src":"New (no old script fit): his 5-step story format","kind":"new","notes":"Post after Dec 1. Real moments only, first names, releases signed. No prices, no pitch. Every [bracket] is yours to fill with something that really happened. If there's no real version, skip this one.","fillins":"","format":"5-step story (v2)"}},{"time":"1:30 PM","label":"Follower Farming","desc":"Identity list, 25 to 35s","has":true,"title":"10/10 young founder truths but it gets increasingly more niche","s":{"hooks":["Nobody takes you seriously at 21. That's fair.","nobody takes you seriously at 21","10/10 young founder truths but it gets increasingly more niche","Nobody owes you a shot.","Young founder truths (niche edition)"],"body":"Nobody takes you seriously at 21. That's fair.\n10/10 young founder truths, but it gets increasingly more niche.\n1. Nobody owes you a shot\n2. Being talented doesn't earn you anything either\n3. Showing up more prepared than everyone in the room, to make them forget how old you are\n4. Your first yes comes from proof, not a pitch\n5. Respect gets earned in the follow-ups\n6. Finding a partner with the experience you don't have yet, to borrow trust until you've earned your own\n(That's Gabriel for me. [what Gabriel brings that you couldn't bring at 21].)\n7. Entitlement kills respect faster than failure ever will\n8. And walking into [the room you had to earn your way into for Kubot] at 21, knowing nobody handed you that spot, because you went and earned it","cta":"No spoken CTA. Optional soft line in the caption only, approved wording: Kubot is a hands-on robotics and AI education company where kids design, 3D print and program their own robots.","src":"Denis Content Scripts sheet #9 (reused)","kind":"reused","notes":"Source: Sahil Bloom, \"nobody owes you anything\", entitlement kills respect faster than failure.\nDebatable lines at 2 (\"talent doesn't earn you anything\") and 7 (entitlement vs failure).\nLines 3 and 6 carry the \"to [outcome]\". 8 starts with And.\nKeep the Gabriel aside under 3 seconds or cut it. Get Gabriel's OK before you describe what he brings.\nNo lease terms, no money, no open date.\nOptional soft plug in the caption only, approved wording: \"Kubot is a hands-on robotics and AI education company where kids design, 3D print and program their own robots.\"\n~30-40s.","fillins":"- [what Gabriel brings that you couldn't bring at 21]\n- [the room you had to earn your way into for Kubot, e.g. a first meeting about a Miami mall]","format":"10/10 progressively niche"}},{"time":"6:00 PM","label":"My Take","desc":"Personal bet take, 55 to 65s","has":true,"title":"What opening day taught me","s":{"hooks":["what opening day taught me","We opened yesterday. Here's what I learned.","Opening day at 21, one lesson.","Everything I thought about opening day was wrong.","One day open. One big lesson."],"body":"We opened the doors yesterday.\nHere's the one thing it taught me.\n[the lesson, in one line].\nEveryone imagines opening day as the finish line.\nIt's the first day of the real thing.\n[one real moment from opening day].\nHonestly? I thought I'd feel relief.\nI felt [what you actually felt].\nAnd now the empty room is just a room, full of kids building things.","cta":"Comment what you'd want to see from inside the store.","src":"New (no old script fit): opinion / bet take","kind":"new","notes":"Post after Dec 1. Real moments only, release-cleared faces, first names.","fillins":"","format":"Personal take"}}]},{"date":"2026-12-03","dow":"Thu","kubot":{"format":"Why Build","title":"Kubot: Why Build","sub":"#17 Starting age","hook":"Is your kid old enough for robotics?","badge":"","needs":false,"film":[],"sections":[["Plan","rows",[["Show","Why Build? with Gabriel. Gabriel to camera, 45 to 75 seconds."],["Episode","#17 Starting age"],["Status","Script drafted below. Gabriel to review before filming."]]],["Inspo","rows",[["Development point","Starting age"],["Hook","Is your kid old enough for robotics?"],["Do this tonight","What a 6, 9 and 12 year old can each build"]]],["Shots","list",["Gabriel to camera, clean audio","B-roll: [Friday class moment that shows the point]","On-screen text: [hook] / [tonight tip]"]],["Where","text","Studio. Filmed on Sunday studio day."],["Checklist","check",["Review the script with Gabriel","Film on Sunday studio day","Cut to 45 to 75 seconds","Add on-screen text and subtitles","No prices, no pitch","Post on Kubot"]]],"s":{"hooks":["Is your kid old enough for robotics?","is your kid old enough?","The right age to start building is younger than you think.","What a 6, 9 and 12 year old can each build","Parents ask me this every week."],"body":"Is your kid old enough for robotics?\nParents ask that all the time.\nThe honest answer is, it depends on what you mean by robotics.\nAt six, it's putting parts together and seeing something move.\nAt nine, it's [what Gabriel says a 9 year old can build].\nAt twelve, it's [what Gabriel says a 12 year old can build].\nSame idea.\nDifferent level.\nThe kid who just wants to see it go.\nThe kid who wants to make it go faster.\nThe kid who wants to make it go by itself.\nThat's the progression.\nAnd it doesn't start with being \"ready\".\nIt starts with being curious.\nTonight, ask your kid what they'd build if they could build anything.\nWrite it down.\nWhat did your kid say?","cta":"Ask your kid what they'd build. Send us the drawing, we might print it. Waitlist link in bio.","src":"Plan v2 Why Build bank #17 (Starting age): hook and tonight tip reused, new body","kind":"new","notes":"New body written from the plan v2 episode bank hook and 'do this tonight'. Concept-led, so no story from Gabriel is needed. Gabriel should adjust any line that isn't how he'd say it. Fill the age brackets with Gabriel's real answer.","fillins":"","format":""}},"personal":[{"time":"9:30 AM","label":"Trial Reel","desc":"Quote reel shown to non-followers","has":true,"title":"The message that changed everything","s":{"hooks":["one message changed everything","One message I almost didn't send changed my year.","I almost didn't hit send.","The DM that started all of this.","Send the message."],"body":"(1 HOOK)\nI wanted [what you wanted when you sent it].\nAnd [why you almost didn't send it].\n\n(2 RISING ACTION)\nEveryone has a message they never sent.\nHonestly? The cold message is the most underrated skill there is.\n[B-ROLL: the screen, blurred where needed]\nSo I [first real action].\nThen [second real action].\n[one honest line on how unprepared you were].\n\n(3 SECOND CONFLICT)\n[the silence, or the first reply]\n[how it felt, one line].\n\n(4 CLIMAX) [MUSIC: beat drop]\n[the reply that changed it].\n[B-ROLL: that exact moment, slowed down]\n\n(5 RESOLUTION)\n[what came from that one message].\nAnd the message you're too nervous to send might be the whole story.","cta":"Comment 'sent' after you send yours.","src":"New (no old script fit): his 5-step story format","kind":"new","notes":"Every [bracket] is yours to fill with something that really happened. If there's no real version, skip this one.","fillins":"","format":"5-step story (v2)"}},{"time":"1:30 PM","label":"Follower Farming","desc":"Identity list, 25 to 35s","has":true,"title":"10/10 side quests but they get progressively more niche","s":{"hooks":["10/10 side quests but they get progressively more niche","side quests (niche edition)","If you already do three of these side quests, you're ahead of most people your age","8 side quests that quietly change everything, and the last one is the hardest","Most people stop at number 3. Number 8 is the one that matters."],"body":"1. Build a bonfire on a beach you've never been to\n2. Drive an hour in any direction with no destination\n3. Cook an epic barbecue and invite everyone you know\n4. Camp somewhere with no service for 48 hours\n5. Take a spontaneous trip to a place you never been\n6. Enter a local competition you have no business entering\n7. Spend the whole summer building one thing together, because you never know what opportunities might come out of it","cta":"No spoken CTA. The And line is the ending. Caption: which number are you? Comment it.","src":"Style library (Claude export): 10/10 summer side quests","kind":"adapted","notes":"His summer list; swap 'summer' for 'winter break' in line 7 if you post it in the fall. Not fully closed at 8. Posted before, so treat it as a v2 repost: refresh 1 or 2 points. For wider reach you can drop 'male' from the title (he noticed a 6.5M list that never said it). Each point gets a 1 to 4 word on-screen label.","fillins":"","format":""}},{"time":"6:00 PM","label":"My Take","desc":"Personal bet take, 55 to 65s","has":true,"title":"Starting over isn't starting from zero","s":{"hooks":["you're not at zero","Starting over isn't starting from zero.","Every time I started over, I had more than I thought.","You don't lose the skills when you quit.","Restarting is underrated."],"body":"Starting over isn't starting from zero.\nHear me out.\nEvery time I walked away from something, I took something with me.\n[the skill from your first venture].\n[the skill from the next one].\nSame person.\nMore pieces.\nHonestly? I think starting over is underrated.\nYou start with everything you learned last time.\nAnd the people who are scared to restart forget they're not the same person who started the first time.","cta":"So tell me. What did your last restart teach you? Comment it.","src":"New (no old script fit): opinion / bet take","kind":"new","notes":"","fillins":"","format":"Personal take"}}]},{"date":"2026-12-04","dow":"Fri","kubot":{"format":"Denis Builds","title":"Kubot: Denis Builds","sub":"Week one open: what we got wrong","hook":"Week one open: what we got wrong","badge":"Hero shoot 3:30 to 5 PM, Bal Harbour","needs":false,"film":[{"what":"Kubot class, 3:30 to 5 PM, Bal Harbour","note":"Hero shoot. Film testimonials and b-roll. Gabriel teaches, Denis films.","sections":[["Capture list","list",["Door: signed parent photo and video release before any face is used","Wide of the room before kids arrive","Hands on CyberBricks and 3D printed parts (vertical and horizontal)","Gabriel teaching: hands, face, parts, kids reacting","A build failing, then a kid fixing it","The first time a robot moves, plus the kid's face","Wide room shots once it's full","Pickup: a kid showing the build to a parent","Parent answer at pickup (release-cleared only): \"What did you notice in your kid today?\" Get 2 to 3 clean answers for Saturday"]],["Rules","text","No scripted kid interviews. No prices, no pitch. First names only, no school names. After class, confirm which faces are release-cleared before the edit."]],"short":"Class 3:30 to 5 PM, Bal Harbour"}],"sections":[["Plan","rows",[["Series","Denis Builds: Denis on camera, building in public."],["Episode","What got done at the store this week, what broke, what's next."],["When to film","Any time this week."]]],["Shots","list",["Denis to camera at the store","B-roll: [what got done]","Close-up: [one detail]"]],["Where","text","[where you're filming]"],["Checklist","check",["Film during the week","Cut to 30 to 45 seconds","No prices, no pitch","Post on Kubot"]]],"s":{"hooks":["Week one open: what we got wrong","week one, honestly","We opened Tuesday. Here's what we'd do differently.","Running a store is harder than building one.","Four days open."],"body":"Week one open: what we got wrong.\n[B-ROLL: the store today]\nWhat got done: [what got done this week].\nWhat broke: [what broke, one honest line].\nWhat's next: [what's next].\n[B-ROLL: one detail close up]\nMost founders only post the wins.\nAnd I think the broken part is the part worth watching.","cta":"Link in bio.","src":"Store build update format (content.py, hub posts.json Oct 30) with a new weekly angle","kind":"adapted","notes":"Real progress only. No prices, no lease or money details.","fillins":"","format":""}},"personal":[{"time":"9:30 AM","label":"Trial Reel","desc":"Quote reel shown to non-followers","has":true,"title":"The law of rerouted luck, but it gets more personal","s":{"hooks":["I was all in on [the venture that ended] to [the goal]. Then [the conflict].","it had to end","The law of rerouted luck","Some setbacks aren't lessons. They're redirects.","You never know what worse luck your bad luck saved you from."],"body":"(1 HOOK)\nI was all in on [the venture that ended] to [the goal you had for it].\nAnd [the conflict, e.g. it wasn't working the way it needed to].\n\n(2 RISING ACTION)\nSome setbacks aren't lessons. They're redirects.\nAnd most people fight them way too long.\n[B-ROLL: real footage or screenshots from that venture]\nI [first action you took to save it].\nThen [second action].\n[one honest line on how in over your head you were].\n\n(3 SECOND CONFLICT)\nThen [the ending, e.g. the day it shut down or the moment you walked away].\n[how it felt at the time, one line].\n\n(4 CLIMAX) [MUSIC: beat drop. Tip: use a song from one of your favorite movies]\nBut that ending is exactly what led to [the next venture it led to].\n[the moment you realized the ending had opened the next door].\nThat's the law of rerouted luck.\n\n(5 RESOLUTION)\n[what you have now that you wouldn't have had otherwise].\nCormac McCarthy said it best.\n\"You never know what worse luck your bad luck has saved you from.\"\nAnd the door that just closed on you might be the only reason you'll ever notice the one next to it.","cta":"Tag someone whose door just closed.","src":"Denis Content Scripts sheet #8 (reused)","kind":"reused","notes":"Story format v2 (5-step). Quote reel: the quote is read word for word in the resolution: \"You never know what worse luck your bad luck has saved you from.\" It's Cormac McCarthy, via Sahil Bloom's Oct 10 post (source link). \"Law of rerouted luck\" (kept to match the title) is a name made up for this video.\nDebatable line: \"Some setbacks aren't lessons. They're redirects.\"\nPick an ending you're fine talking about (no investor or private details, no money figures). Don't use the same venture as #6.\nMusic tip: McCarthy wrote No Country for Old Men, but that film has almost no score, so pick a song from a movie you love instead.\n~50-60s.","fillins":"- [the venture that ended] + [the goal you had for it]\n- [the conflict], e.g. it wasn't working the way it needed to\n- [first action] and [second action] you took to save it\n- [one honest line on how in over your head you were]\n- [the ending]: the real moment it ended + [how it felt at the time]\n- [the next venture it led to] + [the moment you realized it]\n- [what you have now that you wouldn't have had otherwise]","format":"Name-the-law essay, 5-step story (v2), quote reel"}},{"time":"1:30 PM","label":"Follower Farming","desc":"Identity list, 25 to 35s","has":true,"title":"10/10 male books but its gets progressively more niche.","s":{"hooks":["10/10 male books but its gets progressively more niche.","books (niche edition)","If you already do three of these books, you're ahead of most people your age","8 books that quietly change everything, and the last one is the hardest","Most people stop at number 3. Number 8 is the one that matters."],"body":"1. The 48 laws of power to know when someone’s trying to manipulate you\n2. Never split the difference to learn how to negotiate\n3. Beyond Order to learn the 12 universal rules of life\n4. The 21 Irrefutable Laws of leadership for personal growth in being a leader\n5. Thinking Fast and Slow to understand how people think\n6. The Power of Habits to learn why we do what we do in life and business\n7. Liars Poker to understand the life path of 99% of men in America\n8. And No Idea Is final, A book full of quotes from the best creative voices of our time.","cta":"No spoken CTA. The And line ends it. Caption: send this to the friend who needs number 8.","src":"Style library (Claude export): 10/10 male books","kind":"adapted","notes":"His descriptions were never fact checked. Check each one-liner before filming. Posted before, so treat it as a v2 repost: refresh 1 or 2 points. For wider reach you can drop 'male' from the title (he noticed a 6.5M list that never said it). Each point gets a 1 to 4 word on-screen label.","fillins":"","format":""}},{"time":"6:00 PM","label":"My Take","desc":"Personal bet take, 55 to 65s","has":true,"title":"Why I'd rather be early than right","s":{"hooks":["early beats right","I'd rather be early than right.","Being early looks crazy. Being right looks obvious.","By the time it's obvious, it's too late.","My rule for big bets."],"body":"I'd rather be early than right.\nHear me out.\nWhen you're early, everyone thinks you're crazy.\nWhen you're right, everyone says it was obvious.\nBut by the time it's obvious, the chance is gone.\nSo yeah, I know how it looks. I'm 21, [your line], betting on robots and kids.\nMaybe I'm early.\nMaybe I'm wrong.\nHonestly? I'd rather find out by doing it.\nAnd if I'm wrong at 21, that's the cheapest time to be wrong.","cta":"So tell me. Early, or right? Comment it.","src":"New (no old script fit): opinion / bet take","kind":"new","notes":"","fillins":"","format":"Personal take"}}]},{"date":"2026-12-05","dow":"Sat","kubot":{"format":"Testimonial","title":"Kubot: Testimonial","sub":"From Fri Dec 4 class","hook":"Watch [his or her] face when [he or she] shows [mom or dad]","badge":"","needs":false,"film":[],"sections":[["Plan","rows",[["Series","Testimonial: a kid at pickup showing their parent what they built, then one honest sentence from the parent. Unscripted, never staged."],["Source","Footage from the Fri Dec 4 class (Bal Harbour)."],["Hook options","\"Watch [his or her] face when [he or she] shows [mom or dad]\" or \"I asked a [mom or dad] what changed in [her or his] [son or daughter]\". Use the real kid and parent."],["Who","[parent first name] and [kid first name]. First names only."],["Goal","One honest answer a parent watching can relate to. 25 to 35 seconds."]]],["Questions","list",["What did you notice in your kid today?","What did [kid] tell you about the build on the way out?","What is something [kid] built that surprised you?","How does [kid] talk about building now?","In one sentence, what did building give [kid]?"]],["Shots","list",["Kid running up with the build","Kid explaining it to the parent","Parent's face as the robot moves","The parent's one sentence","Close-up of the build in the kid's hands"]],["Where","text","Bal Harbour class footage from Friday."],["Checklist","check",["Pick the pickup moment from Friday's footage","Confirm the signed release for kid and parent","First names only, no school names","Cut to 25 to 35 seconds with subtitles","No prices, no pitch","Post on Kubot"]]],"s":{"hooks":["Watch [his or her] face when [he or she] shows [mom or dad]","This is what a Friday class looks like.","Pieces in. Robot out.","What did you notice in your kid today?","One parent. One answer at pickup."],"body":"[B-ROLL: kid running up to the parent with the build]\nKID: [what the kid says about the build, word for word]\n[B-ROLL: the robot moving, the parent's face]\nPARENT (answering \"What did you notice in your kid today?\"): [the parent's answer, word for word]\n[B-ROLL: close up of the build in the kid's hands]\nON-SCREEN: [parent's first name] and [kid's first name], after the Fri Dec 4 class.","cta":"What did your kid build first? Comment it. Or send us their drawing.","src":"Plan v2 Real Families + kubot-details.json hook options + hub posts.json pickup posts (structure reused; words are real only)","kind":"adapted","notes":"Never staged or scripted. Signed release for kid and parent, first names only, no schools.","fillins":"","format":""}},"personal":[{"time":"9:30 AM","label":"Trial Reel","desc":"Quote reel shown to non-followers","has":true,"title":"The goal I set at the start of this year","s":{"hooks":["my goal for this year","At the start of this year I wrote down one goal.","January me would not believe December me.","I set one goal this year. Here's what happened.","The goal I was embarrassed to say out loud."],"body":"(1 HOOK)\nI wanted [the goal you set in January].\nAnd [where you were in January, no money figures].\n\n(2 RISING ACTION)\nEveryone sets goals in January.\nHonestly? Most goals are too small.\n[B-ROLL: photos from January vs now]\nSo I [first real action].\nThen [second real action].\n[one honest line on how unprepared you were].\n\n(3 SECOND CONFLICT)\n[the month it looked impossible]\n[how it felt, one line].\n\n(4 CLIMAX) [MUSIC: beat drop]\n[the turn].\n[B-ROLL: that exact moment, slowed down]\n\n(5 RESOLUTION)\n[where you are now].\nAnd there's still time left in the year to surprise yourself.","cta":"Comment the goal you set this year.","src":"New (no old script fit): his 5-step story format","kind":"new","notes":"Every [bracket] is yours to fill with something that really happened. If there's no real version, skip this one.","fillins":"","format":"5-step story (v2)"}},{"time":"1:30 PM","label":"Follower Farming","desc":"Identity list, 25 to 35s","has":true,"title":"10/10 green flags in a business partner, but it gets increasingly more niche","s":{"hooks":["green flags in a business partner","10/10 green flags in a business partner, but it gets increasingly more niche.","If your partner does number 6, never let them go.","How to know you picked the right partner.","Business partner green flags nobody talks about."],"body":"10/10 green flags in a business partner, but it gets increasingly more niche.\n1. They answer the phone\n2. They tell you when your idea is bad\n3. They're good at what you're bad at, to make the team stronger than either of you alone\n4. They don't need credit\n5. They show up early\n6. They admit their mistakes first, to make honesty the normal thing on your team\n7. They argue in private, never in public\n8. And they'd still be your friend if the business failed, because that's the only kind of partner worth building with","cta":"Tag your business partner.","src":"New (no old script fit): identity list","kind":"new","notes":"","fillins":"","format":"Follower farm list"}},{"time":"6:00 PM","label":"My Take","desc":"Personal bet take, 55 to 65s","has":true,"title":"The skill school should teach and doesn't","s":{"hooks":["school skipped this","There's one skill school should teach every kid.","School teaches answers. It should teach this.","The most important skill nobody grades.","My take on what's missing in school."],"body":"There's one skill I wish every school taught.\nFiguring out why something doesn't work.\nHear me out.\nSchool mostly rewards getting the answer right the first time.\nReal life is the opposite.\nThings break.\nPlans fail.\nCode doesn't run.\nThe person who wins is the one who can stay calm and find out why.\nHonestly? That's what building teaches.\nAnd I think it's the most important skill nobody grades.","cta":"So tell me. What should school teach that it doesn't? Comment it.","src":"New (no old script fit): opinion / bet take","kind":"new","notes":"","fillins":"","format":"Personal take"}}]},{"date":"2026-12-06","dow":"Sun","kubot":{"format":"Podcast","title":"Kubot: Podcast","sub":"Ep. 8: We opened the doors","hook":"We opened the doors. Here's week one.","badge":"Studio day","needs":false,"film":[{"what":"Why Build (episode to pick)","short":"Why Build (to pick)","note":"Posts Mon Dec 7.","ref":null},{"what":"Why Build (episode to pick)","short":"Why Build (to pick)","note":"Posts Thu Dec 10.","ref":null},{"what":"Podcast ep. 9","short":"Podcast ep. 9","note":"Posts Sun Dec 13.","ref":null}],"sections":[["Plan","rows",[["Episode","Podcast ep. 8. Full episode on YouTube and Spotify, plus one clip on Kubot."],["Filmed","Last Sunday's studio day."]]],["Inspo","rows",[["Show","Founders podcast: weekly build in public episode, 30 to 45 minutes, Denis and Gabriel hosting. Cut into 5 to 8 short clips."],["This episode","[topic to pick]. Idea: the best comments and parent questions from the week."]]],["Shape","text","1. Cold open (1 to 2 min): Denis sets up [topic].\n2. Main conversation (15 to 20 min): [topic], with real classroom moments, not slogans.\n3. Week in the build (3 to 5 min): what got done at the store, what broke, what's next.\n4. Kid of the week (optional): a Friday kid explains their robot, with a parent on mic. Only if release-cleared.\n5. What to try tonight (5 min): one tip for parents.\n6. Close (2 min): tease next week."],["Questions","list",["[the best parent question from this week's comments]","[the second best parent question]","What broke this week, and what's next before the store opens?","If a parent has 20 minutes tonight, what should they try?"]],["Shots","list",["Wide two-shot, plus a single on each host","Print farm and robots visible behind","Clip targets: one Gabriel line that stands alone, one parent tip for tonight"]],["Where","text","Studio. Audio: the podcast mics, test recording first."],["Checklist","check",["Upload the full episode to YouTube and Spotify","Cut one clip for Kubot","Mark 5 to 8 clips for later","No prices, no pitch","Reply to comments in the first hour"]]],"s":{"hooks":["We opened the doors. Here's week one.","Week one of running a robot store","What we learned in five days open","The first kid who walked in","Open."],"body":"DENIS (cold open): Five days ago we opened the doors. Here's what happened.\nDENIS: Gabriel, what was the first moment that got you?\nGABRIEL: [his answer, real only]\nDENIS: What did we get wrong?\n[both answer]\nDENIS: What's next?\nCLIP FOR KUBOT: [the best first week moment, release-cleared]","cta":"Full episode on YouTube and Spotify. What should we ask Gabriel next? Link in bio.","src":"Plan v2 podcast segments + parent questions (new episode plan)","kind":"new","notes":"Gabriel's answers are his, unscripted. Only the cold open and questions are written.","fillins":"","format":""}},"personal":[{"time":"9:30 AM","label":"Trial Reel","desc":"Quote reel shown to non-followers","has":true,"title":"Week one with the doors open","s":{"hooks":["week one","One week with the doors open. Here's what I got wrong.","What I learned in the first week of running a store at 21.","Week one was not what I expected.","A week ago this was an empty room."],"body":"(1 HOOK)\nI wanted [the goal for week one].\nAnd [the first real problem].\n\n(2 RISING ACTION)\nEveryone thinks the hard part is opening.\nHonestly? Running it is harder than building it.\n[B-ROLL: the first week, release-cleared]\nSo I [first real action].\nThen [second real action].\n[one honest line on how unprepared you were].\n\n(3 SECOND CONFLICT)\n[the second problem]\n[how it felt, one line].\n\n(4 CLIMAX) [MUSIC: beat drop]\n[the best moment of the week].\n[B-ROLL: that exact moment, slowed down]\n\n(5 RESOLUTION)\n[the lesson].\nAnd a week ago this was an empty room.","cta":"Comment what you'd want to see from inside the store.","src":"New (no old script fit): his 5-step story format","kind":"new","notes":"Post after Dec 1. No prices, no pitch. Every [bracket] is yours to fill with something that really happened. If there's no real version, skip this one.","fillins":"","format":"5-step story (v2)"}},{"time":"1:30 PM","label":"Follower Farming","desc":"Identity list, 25 to 35s","has":true,"title":"Signs you're going to be dangerously successful, but it gets increasingly more niche","s":{"hooks":["Signs you're going to be dangerously successful, but it gets increasingly more niche","signs (niche edition)","If you already do three of these signs, you're ahead of most people your age","8 signs that quietly change everything, and the last one is the hardest","Most people stop at number 3. Number 8 is the one that matters."],"body":"If you have at least three of these, you're going to be dangerously successful.\n1. You get bored easily. Normal routines feel like a waste. Your brain wants a challenge.\n2. You're on a different timeline than your friends. They plan the weekend. You're planning the next five years.\n3. You train even when nobody's watching. You learned early that results come from the work no one sees.\n4. People call you intense. You're not intense. You just take your own word seriously.\n5. You'd rather be broke building than comfortable stuck. Security was never the goal. Freedom is.\n6. You skipped your third year of college to open a robot store. ...okay that one's just me.","cta":"No spoken CTA. Let the And line land. Caption: comment the one you already do.","src":"Style library (Claude export): Follower-farm listicle","kind":"adapted","notes":"Claude draft he asked for, Oct 7. Line 6 is the only personal line. Posted before, so treat it as a v2 repost: refresh 1 or 2 points. For wider reach you can drop 'male' from the title (he noticed a 6.5M list that never said it). Each point gets a 1 to 4 word on-screen label.","fillins":"","format":""}},{"time":"6:00 PM","label":"My Take","desc":"Personal bet take, 55 to 65s","has":true,"title":"Let your kids watch you fail","s":{"hooks":["let them see you fail","The best thing you can do for your kid is fail in front of them.","Kids learn more from watching you fail than from watching you win.","Stop hiding your mistakes from your kids.","My take for parents."],"body":"Here's a take for parents.\nLet your kids watch you fail.\nHear me out.\nKids copy what they see.\nIf they only ever see you get it right, they think getting it wrong means something is wrong with them.\nSo let them see you burn the pancakes.\nLose the game.\nBuild the shelf (function(){
"use strict";
const $ = id => document.getElementById(id);
const DAYS = DATA.days, BY = {}; DAYS.forEach(d => BY[d.date] = d);
const KEY = "denis-calendar-done-v1";
let done = {}; try { done = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { done = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (e) {} };
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DOW = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d, 12); };

const add = (s, n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const nice = s => { const d = parse(s); return DOW[d.getDay()] + ", " + MON[d.getMonth()] + " " + d.getDate(); };
function realToday(){
  const p = new Intl.DateTimeFormat("en-CA",{timeZone:"America/New_York",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
  const g = t => p.find(x => x.type === t).value; return g("year")+"-"+g("month")+"-"+g("day");
}
const FIRST = DAYS[0].date, LAST = DAYS[DAYS.length-1].date, TODAY = realToday();
const clamp = s => s < FIRST ? FIRST : (s > LAST ? LAST : s);
function mondayOf(s){ const d = parse(s); const k = (d.getDay()+6)%7; d.setDate(d.getDate()-k); return iso(d); }
let view = "week", weekStart = mondayOf(clamp(TODAY)), month = clamp(TODAY).slice(0,7);

  const out = [{id: day.date+":k", kind:"k", meta:"Kubot", label:k.format, title:k.title, sub:k.sub, needs:!!k.needs, src:k}];

  return out;
}
function checkBtn(id, label, cls){
  return '<button class="'+(cls||"check")+'" role="checkbox" aria-checked="'+(!!done[id])+'" aria-label="Done: '+esc(label)+'" data-id="'+esc(id)+'"><i></i>'+(cls?'<span>Mark as done</span>':'')+'</button>';
}
function card(it){
  const ttl = it.kind === "k" ? it.sub : (it.needs ? "Script coming" : it.sub);

  if (it.kind === "p") foot += '<span>'+esc(it.time)+'</span>';
  if (it.kind === "k" && it.src.film && it.src.film.length) foot += '<span>Film today</span>';
  if (it.needs) foot += '<span class="pill">Needs script</span>';
  return '<div class="card'+(it.needs?" needs":"")+(done[it.id]?" done":"")+'">' +
    '<button class="copen" data-open="'+esc(it.id)+'" aria-label="'+esc((it.kind==="k"?"Kubot ":"")+it.label+": "+ttl)+'">' +
    '<div class="lab'+(it.kind==="k"?" k":"")+'"><span class="dot'+(it.kind==="k"?" k":"")+'"></span><span class="t">'+esc(SHORT[it.label]||it.label)+'</span></div>' +
    '<div class="ttl">'+esc(ttl)+'</div>' + (foot ? '<div class="foot">'+foot+'</div>' : '') + '</button>' +
    checkBtn(it.id, it.label) + '</div>';
}
function renderWeek(){
  const end = add(weekStart, 6), a = parse(weekStart), b = parse(end);
  $("h-title").textContent = MON[a.getMonth()] + " " + a.getDate() + " to " + (a.getMonth()===b.getMonth() ? "" : MON[b.getMonth()] + " ") + b.getDate();
  const wk = Math.floor((parse(weekStart) - parse(mondayOf(FIRST))) / 864e5 / 7) + 1;
  $("h-sub").textContent = "Week " + wk + " of " + (Math.floor((parse(mondayOf(LAST)) - parse(mondayOf(FIRST))) / 864e5 / 7) + 1);
  $("prev").disabled = weekStart <= FIRST; $("next").disabled = end >= LAST;
  let h = "";
  for (let i = 0; i < 7; i++){
    const ds = add(weekStart, i), d = BY[ds], dt = parse(ds); if (!d) continue;
    const badge = d.kubot.badge ? '<span class="badge">'+esc(d.kubot.badge)+'</span>' : "";
    h += '<div class="day'+(ds===TODAY?" today":"")+'" id="d-'+ds+'"><div class="dh"><span class="dn">'+dt.getDate()+'</span><span><div class="dw">'+(ds===TODAY?"Today":DOW[dt.getDay()])+'</div><div class="dm">'+DOW[dt.getDay()].slice(0,3)+", "+MON[dt.getMonth()]+" "+dt.getDate()+'</div></span>'+badge+'</div>' +
      '<div class="cards">' + items(d).map(card).join("") + '</div></div>';
  }
  $("week").innerHTML = h;
}
function renderMonth(){
  const [y, m] = month.split("-").map(Number);
  $("h-title").textContent = MONTHS[m-1] + " " + y;
  $("h-sub").textContent = "Tap a day to open its week";
  $("prev").disabled = month <= FIRST.slice(0,7); $("next").disabled = month >= LAST.slice(0,7);
  const first = iso(new Date(y, m-1, 1, 12)), start = mondayOf(first);
  let h = '<div class="mgrid">' + ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(x => '<div class="mh">'+x+'</div>').join("");
  let ds = start;
  for (let i = 0; i < 42; i++){
    const dt = parse(ds), inM = dt.getMonth() === m-1, d = BY[ds];
    if (i >= 35 && !inM && dt.getDay() === 1) break;
    if (d){
      const dots = items(d).map(it => '<i class="'+(it.kind==="k"?"k":"")+(done[it.id]?" on":"")+'"></i>').join("");
      h += '<button class="mc'+(inM?"":" out")+(ds===TODAY?" today":"")+'" data-day="'+ds+'" aria-label="'+esc(nice(ds))+'"><span class="n">'+dt.getDate()+'</span><span class="ds">'+dots+'</span>'+(dt.getDay()===5?'<span class="fr">Class</span>':'')+'</button>';
    } else h += '<div class="mc off'+(inM?"":" out")+(ds===TODAY?" today":"")+'"><span class="n">'+dt.getDate()+'</span></div>';
    ds = add(ds, 1);
  }
  h += '</div><div class="legend"><span><i class="k"></i>Kubot</span><span><i></i>Personal (9:30, 1:30, 6:00)</span><span><i class="on"></i>Done</span></div>';
  $("month").innerHTML = h;
}
function renderPlan(){
  const m = DATA.mix;
  $("plan").innerHTML = '<b>This week\'s plan.</b> One Kubot post a day, then your three posts. ' + m.days.map(x => esc(x[0]+" "+x[1])).join(" \u00b7 ") + '. ' + esc(m.personal) + ' ' + esc(m.line);
}
function render(){
  $("week").hidden = view !== "week"; $("month").hidden = view !== "month";
  $("v-w").setAttribute("aria-selected", view === "week"); $("v-m").setAttribute("aria-selected", view === "month");
  const n = $("note");
  if (TODAY < FIRST) { n.hidden = false; n.textContent = "The plan starts " + nice(FIRST) + "."; }
  else if (TODAY > LAST) { n.hidden = false; n.textContent = "The plan ended " + nice(LAST) + "."; }
  else n.hidden = true;
  view === "week" ? renderWeek() : renderMonth();
}
function scrollToDay(ds){
  const el = document.getElementById("d-"+ds);
  if (el && window.innerWidth < 980) el.scrollIntoView({block:"start"}); else window.scrollTo(0,0);
}
function secHTML(s){
  const [h, t, v] = s; let body = "";
  if (t === "text") body = '<div class="pre">'+esc(v)+'</div>';
  else if (t === "rows") body = v.map(r => '<div class="kv"><div class="k">'+esc(r[0])+'</div><div class="v">'+esc(r[1])+'</div></div>').join("");
  else body = v.map(x => '<div class="li'+(t==="check"?" ck":"")+'">'+esc(x)+'</div>').join("");
  return '<div class="section-h">'+esc(h)+'</div><div class="group">'+body+'</div>';
}
function scriptHTML(sc){
  if (!sc || !sc.body) return "";
  const tag = sc.kind === "new" ? '<span class="tag new">New script</span>' : (sc.kind === "adapted" ? '<span class="tag">Adapted old script</span>' : '<span class="tag">Old script</span>');
  let h = '<div class="section-h">Source</div><div class="group"><div class="src">'+tag+'<span>'+esc(sc.src)+'</span></div></div>';
  h += '<div class="section-h">Hooks</div><div class="group">' + (sc.hooks||[]).map((x,i) => '<div class="hk"><b>'+(i+1)+'</b><span>'+esc(x)+'</span></div>').join("") + '</div>';
  h += '<div class="section-h">Body</div><div class="group"><div class="pre">'+esc(sc.body)+'</div></div>';
  h += '<div class="section-h">CTA</div><div class="group"><div class="cta">'+esc(sc.cta)+'</div></div>';
  if (sc.fillins) h += secHTML(["Fill-ins", "text", sc.fillins]);
  if (sc.notes) h += secHTML(["Notes", "text", sc.notes]);
  return h;
}
let sheetId = null, lastFocus = null;
const SHORT = {"Robot on the Street":"Street","Follower Farming":"Followers"};
function openSheet(id){
  const ds = id.split(":")[0], d = BY[ds]; if (!d) return;
  const it = items(d).find(x => x.id === id); if (!it) return;
  sheetId = id; lastFocus = document.activeElement;
  $("s-meta").innerHTML = '<span class="dot'+(it.kind==="k"?" k":"")+'"></span>' + esc(nice(ds) + " \u00b7 " + it.meta);
  let h = '<h3 id="s-title">'+esc(it.title)+'</h3>' + (it.sub ? '<div class="ssub">'+esc(it.sub)+'</div>' : '');
  h += '<div class="group">' + checkBtn(id, it.title, "drow check") + '</div>';
  if (it.kind === "k"){
    const k = it.src;
    if (k.film && k.film.length){
      h += '<div class="section-h">Film today</div><div class="group filmbox">';
      k.film.forEach(f => {
        h += '<div class="ft">'+esc(f.what)+'</div>' + (f.note ? '<div class="fn">'+esc(f.note)+'</div>' : '');
        if (f.ref && BY[f.ref]) h += '<button class="drow link" data-open="'+esc(f.ref+":k")+'">Open the '+esc(MON[parse(f.ref).getMonth()]+" "+parse(f.ref).getDate())+' plan</button>';
      });
      h += '</div>';
    }
    h += scriptHTML(k.s);
    if (k.film && k.film.length) k.film.forEach(f => (f.sections || []).forEach(s => h += secHTML(s)));
    k.sections.forEach(s => h += secHTML(s));
  } else {
    const p = it.src;
    h += secHTML(["What this post is", "rows", [["Time", p.time], ["Slot", p.desc]].concat(p.s && p.s.format ? [["Format", p.s.format]] : [])]);
    h += scriptHTML(p.s);
  }
  $("s-body").innerHTML = h; $("s-body").scrollTop = 0;
  $("scrim").classList.add("on"); $("sheet").classList.add("on");
  setTimeout(() => $("sheet").focus({preventScroll:true}), 50);
}
function closeSheet(){ sheetId = null; $("scrim").classList.remove("on"); $("sheet").classList.remove("on"); if (lastFocus && lastFocus.focus) lastFocus.focus({preventScroll:true}); }
document.addEventListener("click", e => {
  const c = e.target.closest("[role=checkbox][data-id]");
  if (c){ const id = c.dataset.id; done[id] = !done[id]; if (!done[id]) delete done[id]; save();
    document.querySelectorAll('[data-id="'+id+'"]').forEach(b => b.setAttribute("aria-checked", !!done[id]));
    const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  const o = e.target.closest("[data-open]"); if (o){ openSheet(o.dataset.open); return; }
  const w = e.target.closest("[data-day]"); if (w){ const ds = w.dataset.day; weekStart = mondayOf(ds); view = "week"; render(); scrollToDay(ds); return; }
});
$("v-w").onclick = () => { if (view !== "week"){ view = "week"; weekStart = mondayOf(clamp(month === clamp(TODAY).slice(0,7) ? clamp(TODAY) : (month + "-01" < FIRST ? FIRST : month + "-01"))); render(); window.scrollTo(0,0); } };
$("v-m").onclick = () => { if (view !== "month"){ view = "month"; month = clamp(weekStart).slice(0,7); render(); window.scrollTo(0,0); } };
$("prev").onclick = () => { if (view === "week"){ if (weekStart > FIRST){ weekStart = add(weekStart,-7); render(); window.scrollTo(0,0);} } else { const [y,m] = month.split("-").map(Number); const d = new Date(y, m-2, 1, 12); const k = iso(d).slice(0,7); if (k >= FIRST.slice(0,7)){ month = k; render(); } } };
$("next").onclick = () => { if (view === "week"){ if (add(weekStart,6) < LAST){ weekStart = add(weekStart,7); render(); window.scrollTo(0,0);} } else { const [y,m] = month.split("-").map(Number); const d = new Date(y, m, 1, 12); const k = iso(d).slice(0,7); if (k <= LAST.slice(0,7)){ month = k; render(); } } };
$("today").onclick = () => { if (view === "week"){ weekStart = mondayOf(clamp(TODAY)); render(); scrollToDay(clamp(TODAY)); } else { month = clamp(TODAY).slice(0,7); render(); } };
$("scrim").onclick = closeSheet; $("s-close").onclick = closeSheet;
document.addEventListener("keydown", e => { if (e.key === "Escape" && sheetId) closeSheet(); });
window.__app = { openSheet, closeSheet, setView: v => { view = v; render(); }, setWeek: d => { weekStart = mondayOf(d); render(); }, setMonth: m => { month = m; view = "month"; render(); } };
renderPlan(); if (location.hash === "#month") view = "month"; render();
if (view === "week" && TODAY >= FIRST && TODAY <= LAST) requestAnimationFrame(() => scrollToDay(TODAY));
})();
