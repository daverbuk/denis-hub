AM","label":"Trial Reel","desc":"Quote reel shown to non-followers","has":true,"title":"Who am I, a modern polymath","s":{"hooks":["At 21, I'm the CMO of a robotics company. Eight months ago, [where you really were].","Everyone told me to pick a lane.","For years my resume was a joke.","I knew nothing about robots. Every random skill was suddenly exactly what this needed.","I think the real move is learning how to become anything."],"body":"At 21, I'm the CMO of a robotics company opening this December.\nBut at the start of this year, [where you really were, no exact money figure].\nFor years my resume was a joke.\nWorking the seafood counter at a grocery store at 17.\nDetailing cars out of my trunk.\nDoing an unpaid marketing internship.\nThen CSO at a startup called MyBite at 18.\nEveryone told me to pick a lane and stay in it.\nInstead, MyBite got us into an accelerator, which led me to launch an AI automation agency.\nRight when things were coming together, [the setback, in your words, no figures].\n[B-ROLL: real photos from each stop]\nNearly broke, I went back to the skills I spent years collecting.\n[the moment the agency started working, no exact figure].\nThen I started making content, and studied it like crazy.\n[what happened with content, only numbers you can stand behind].\n[MUSIC: beat drop]\nThen I met Gabriel. He'd taught kids robotics for over 10 years and was building a robotics, AI and 3D printing school.\nI knew nothing about robots.\nBut I knew websites, SEO, content and press.\nEvery random skill was suddenly exactly what this needed.\nThe world tells you to pick one thing early.\nI think the real move is learning how to become anything.\nAnd if that sounds like you, you just found your people.","cta":"I'm Denis. Follow if you're collecting skills too.","src":"Style library: Who am I storytime (Sep 24), adapted","kind":"adapted","notes":"Adapted: no investor on camera (his Sep 28 call), no exact money figures, setbacks and results in [brackets]. The 'Then I met Gabriel' line replaces the investor line; get Gabriel's OK on how he's described.","fillins":"","format":""}},{"time":"1:30 PM","label":"Follower Farming","desc":"Identity list, 25 to 35s","has":true,"title":"10/10 male etiquette but it gets increasingly more niche","s":{"hooks":["10/10 male etiquette but it gets increasingly more niche","etiquette (niche edition)","If you already do three of these etiquette, you're ahead of most people your age","8 etiquette that quietly change everything, and the last one is the hardest","Most people stop at number 3. Number 8 is the one that matters."],"body":"1. Standing up to greet someone when they walk in\n2. Always offering to drive, pay, or carry the heaviest bag\n3. Never being on your phone in front of someone who took the time to be there\n4. Knowing the place well enough to order for the both of you with confidence\n5. Walking her to her car or door at the end of the night, no matter how short the walk is\n6. Tipping well, even when the service was just okay\n7. Pulling out her chair, and standing until she's seated\n8. And being the guest who helps clean up without being asked, because the way you leave a place is the impression that actually lasts","cta":"No spoken CTA. The And line ends it. Caption: send this to the friend who needs number 8.","src":"Style library (Claude export): 10/10 male etiquette v2","kind":"adapted","notes":"He said etiquette v2 did 600k. Posted before, so treat it as a v2 repost: refresh 1 or 2 points. For wider reach you can drop 'male' from the title (he noticed a 6.5M list that never said it). Each point gets a 1 to 4 word on-screen label.","fillins":"","format":""}},{"time":"6:00 PM","label":"My Take","desc":"Personal bet take, 55 to 65s","has":true,"title":"Miami is becoming a builder city","s":{"hooks":["Miami builds now","Miami isn't just a party city anymore.","Everyone thinks Miami is beaches and clubs.","Why I'm building in Miami","Miami is becoming a builder city."],"body":"Everyone thinks Miami is beaches and nightlife.\nI think it's quietly becoming a builder city.\nHear me out.\n[one real thing you've seen in Miami's builder scene].\nMore founders.\nMore people making things.\nFamilies who want their kids to build, not just consume.\nHonestly? That's why we're building here.\nAnd I think in a few years people will say Miami the way they say other tech cities.","cta":"So tell me. Is Miami a builder city? Comment it.","src":"New (no old script fit): opinion / bet take","kind":"new","notes":"No stats. One real example in the bracket.","fillins":"","format":"Personal take"}}]},{"date":"2026-11-20","dow":"Fri","kubot":{"format":"Denis Builds","title":"Kubot: Denis Builds","sub":"Two weeks out","hook":"Two weeks until we open","badge":"Hero shoot 3:30 to 5 PM, Bal Harbour","needs":false,"film":[{"what":"Kubot class, 3:30 to 5 PM, Bal Harbour","note":"Hero shoot. Film testimonials and b-roll. Gabriel teaches, Denis films.","sections":[["Capture list","list",["Door: signed parent photo and video release before any face is used","Wide of the room before kids arrive","Hands on CyberBricks and 3D printed parts (vertical and horizontal)","Gabriel teaching: hands, face, parts, kids reacting","A build failing, then a kid fixing it","The first time a robot moves, plus the kid's face","Wide room shots once it's full","Pickup: a kid showing the build to a parent","Parent answer at pickup (release-cleared only): \"What did you notice in your kid today?\" Get 2 to 3 clean answers for Saturday"]],["Rules","text","No scripted kid interviews. No prices, no pitch. First names only, no school names. After class, confirm which faces are release-cleared before the edit."]],"short":"Class 3:30 to 5 PM, Bal Harbour"}],"sections":[["Plan","rows",[["Series","Denis Builds: Denis on camera, building in public."],["Episode","What got done at the store this week, what broke, what's next."],["When to film","Any time this week."]]],["Shots","list",["Denis to camera at the store","B-roll: [what got done]","Close-up: [one detail]"]],["Where","text","[where you're filming]"],["Checklist","check",["Film during the week","Cut to 30 to 45 seconds","No prices, no pitch","Post on Kubot"]]],"s":{"hooks":["Two weeks until we open","two weeks out","Two weeks to go. Here's what's left.","The countdown just got real.","14 days."],"body":"Two weeks until we open.\n[B-ROLL: the store today]\nWhat got done: [what got done this week].\nWhat broke: [what broke, one honest line].\nWhat's next: [what's next before December 1st].\n[B-ROLL: one detail close up]\nMost founders only post the wins.\nAnd I think the broken part is the part worth watching.","cta":"Follow along to see if we get the doors open. Waitlist link in bio.","src":"Store build update format (content.py, hub posts.json Oct 30) with a new weekly angle","kind":"adapted","notes":"Real progress only. No prices, no lease or money details.","fillins":"","format":""}},"personal":[{"time":"9:30 AM","label":"Trial Reel","desc":"Quote reel shown to non-followers","has":true,"title":"How I ended up building a store with Gabriel","s":{"hooks":["how I met my business partner","I'm 21. My business partner has taught kids robotics for over 10 years.","Nobody takes a 21 year old seriously. So I found someone with the experience I don't have.","The best decision I made this year was a partner.","Borrow trust until you've earned your own."],"body":"(1 HOOK)\nI wanted [how you and Gabriel met, in one line].\nAnd [what you didn't have yet that he did].\n\n(2 RISING ACTION)\nEveryone says pick your partner carefully.\nHonestly? At 21, the right partner matters more than the idea.\n[B-ROLL: you and Gabriel at the Friday class or the studio]\nSo I [first real action].\nThen [second real action].\n[one honest line on how unprepared you were].\n\n(3 SECOND CONFLICT)\n[a real moment that tested the partnership, only if you're both okay sharing it]\n[how it felt, one line].\n\n(4 CLIMAX) [MUSIC: beat drop]\n[the moment you knew it was the right call].\n[B-ROLL: that exact moment, slowed down]\n\n(5 RESOLUTION)\nHe brings 10 years with kids. I bring [what you bring].\nAnd if you're young and building, find the person who has what you don't, and earn your way into their trust.","cta":"Comment what you'd want in a business partner.","src":"New (no old script fit): his 5-step story format","kind":"new","notes":"Get Gabriel's OK on anything you say about him. Every [bracket] is yours to fill with something that really happened. If there's no real version, skip this one.","fillins":"","format":"5-step story (v2)"}},{"time":"1:30 PM","label":"Follower Farming","desc":"Identity list, 25 to 35s","has":true,"title":"10/10 male lessons but it gets increasingly more niche","s":{"hooks":["10/10 male lessons but it gets increasingly more niche","lessons (niche edition)","If you already do three of these lessons, you're ahead of most people your age","8 lessons that quietly change everything, and the last one is the hardest","Most people stop at number 3. Number 8 is the one that matters."],"body":"1. Just start, even if you don't know how\n2. Don't take advice from someone you wouldn't trade lives with\n3. Master the basics before anything else\n4. Your friend group is either pulling you up or quietly pulling you down\n5. Confidence is the quietest man in the room, arrogance is the loudest\n6. Learning to say no without explaining yourself is one of the highest forms of self-respect\n7. You'll talk yourself out of more opportunities than anyone else ever will\n8. And no one's coming to save you, you're the hero, so start acting like it.","cta":"No spoken CTA. Let the And line land. Caption: comment the one you already do.","src":"Style library (Claude export): 10/10 male lessons","kind":"adapted","notes":"His locked lines. Posted before, so treat it as a v2 repost: refresh 1 or 2 points. For wider reach you can drop 'male' from the title (he noticed a 6.5M list that never said it). Each point gets a 1 to 4 word on-screen label.","fillins":"","format":""}},{"time":"6:00 PM","label":"My Take","desc":"Personal bet take, 55 to 65s","has":true,"title":"AI art vs making something with your hands","s":{"hooks":["AI art vs real art","AI can make a picture in seconds. Here's why I still think making matters.","Is AI art art?","The thing AI art can't give you","Making beats generating."],"body":"AI can make a beautiful picture in seconds.\nSo why would anyone draw anymore?\nHear me out.\nThe picture was never the point.\nThe point was what happened to you while you made it.\nYou got better.\nYou got patient.\nYou figured something out.\nHonestly? I use AI every day.\nBut a kid who draws a robot and then builds it learned something a prompt can't teach.\nAnd I think making is going to matter more, not less, because now it's a choice.","cta":"So tell me. Is AI art art? Comment it.","src":"New (no old script fit): opinion / bet take","kind":"new","notes":"","fillins":"","format":"Personal take"}}]},{"date":"2026-11-21","dow":"Sat","kubot":{"format":"Testimonial","title":"Kubot: Testimonial","sub":"From Fri Nov 20 class","hook":"I asked a [mom or dad] what changed in [her or his] [son or daughter]","badge":"","needs":false,"film":[],"sections":[["Plan","rows",[["Series","Testimonial: a kid at pickup showing their parent what they built, then one honest sentence from the parent. Unscripted, never staged."],["Source","Footage from the Fri Nov 20 class (Bal Harbour)."],["Hook options","\"Watch [his or her] face when [he or she] shows [mom or dad]\" or \"I asked a [mom or dad] what changed in [her or his] [son or daughter]\". Use the real kid and parent."],["Who","[parent first name] and [kid first name]. First names only."],["Goal","One honest answer a parent watching can relate to. 25 to 35 seconds."]]],["Questions","list",["What did you notice in your kid today?","What did [kid] tell you about the build on the way out?","What is something [kid] built that surprised you?","How does [kid] talk about building now?","In one sentence, what did building give [kid]?"]],["Shots","list",["Kid running up with the build","Kid explaining it to the parent","Parent's face as the robot moves","The parent's one sentence","Close-up of the build in the kid's hands"]],["Where","text","Bal Harbour class footage from Friday."],["Checklist","check",["Pick the pickup moment from Friday's footage","Confirm the signed release for kid and parent","First names only, no school names","Cut to 25 to 35 seconds with subtitles","No prices, no pitch","Post on Kubot"]]],"s":{"hooks":["I asked a [mom or dad] what changed in [her or his] [son or daughter]","One question at pickup.","They walked in with a pile of parts.","No script. Just pickup.","Watch [his or her] face when the robot moves."],"body":"[B-ROLL: kid running up to the parent with the build]\nKID: [what the kid says about the build, word for word]\n[B-ROLL: the robot moving, the parent's face]\nPARENT (answering \"What did you notice in your kid today?\"): [the parent's answer, word for word]\n[B-ROLL: close up of the build in the kid's hands]\nON-SCREEN: [parent's first name] and [kid's first name], after the Fri Nov 20 class.","cta":"What did your kid build first? Comment it. Or send us their drawing.","src":"Plan v2 Real Families + kubot-details.json hook options + hub posts.json pickup posts (structure reused; words are real only)","kind":"adapted","notes":"Never staged or scripted. Signed release for kid and parent, first names only, no schools.","fillins":"","format":""}},"personal":[{"time":"9:30 AM","label":"Trial Reel","desc":"Quote reel shown to non-followers","has":true,"title":"Curiosity beats passion","s":{"hooks":["don't follow your passion","Follow your curiosity, not your passion.","Nobody knows their passion at 21. That's fine.","Passion is a result, not a starting point.","I've never had a passion. I've had questions."],"body":"Everyone tells you to follow your passion.\nBut most people don't have one yet.\nAnd that's fine.\nHonestly? I think passion is overrated as a starting point.\nCuriosity is easier.\nYou don't need to love it.\nYou just need to want to know how it works.\nSo you look it up.\nYou try it.\nYou get a little better.\nAnd somewhere around there, it starts to feel like passion.\nPassion isn't where you start.\nAnd if you wait to feel it first, you'll never start anything.","cta":"Comment the thing you're curious about right now.","src":"New (no old script fit): name-the-law / insight reel","kind":"new","notes":"Evergreen. No stats.","fillins":"","format":"Insight reel"}},{"time":"1:30 PM","label":"Follower Farming","desc":"Identity list, 25 to 35s","has":true,"title":"Your screen time report tells me how focused you are","s":{"hooks":["your screen time exposes you","Your screen time report tells me how focused you are.","Sunday screen time notification. We need to talk.","Read your screen time out loud. I'll wait.","Where does your screen time land on the focus meter?"],"body":"ON-SCREEN: a \"focus meter\" fills with each point (on screen, not spoken).\n\nYour screen time report tells me how focused you are.\n1. Nine hours. You don't open the report anymore. [METER 10%]\n2. Five hours, but you call it 'research'. [METER 20%]\n3. App limits that you set, to protect your focus before the algorithm takes it. [METER 35%]\n4. Grayscale mode. Serious. [METER 50%]\n5. Your top app is Notes. [METER 60%]\n6. Under two hours, to give your attention to things that actually give back. [METER 75%]\n7. A flip phone on weekends. [METER 90%]\n8. And you stopped checking the report, because you already know your time is going where you want it to. [METER 100%]","cta":"Comment your screen time. Be honest.","src":"New (no old script fit): identity list with a meter","kind":"new","notes":"","fillins":"","format":"Follower farm list"}},{"time":"6:00 PM","label":"My Take","desc":"Personal bet take, 55 to 65s","has":true,"title":"The real reason kids lose interest in STEM","s":{"hooks":["why kids quit science","I think I know why kids lose interest in science.","Kids don't hate math. They hate math that doesn't do anything.","STEM isn't boring. The way we teach it is.","My take on kids and science."],"body":"I think I know why kids lose interest in science and math.\nThey never get to build anything with it.\nHear me out.\nA gear ratio on a worksheet is boring.\nA gear ratio that makes your robot faster is the best thing ever.\nSame math.\nDifferent reason.\nHonestly? Kids don't hate math.\nThey hate math that doesn't do anything.\n[Gabriel's line on this, only if he agrees].\nAnd when the math moves something they built, they don't call it math anymore.","cta":"So tell me. What made you like or hate math? Comment it.","src":"New (no old script fit): opinion / bet take","kind":"new","notes":"Opinion, no stats. Gabriel line only if he agrees with it.","fillins":"","format":"Personal take"}}]},{"date":"2026-11-22","dow":"Sun","kubot":{"format":"Podcast","title":"Kubot: Podcast","sub":"Ep. 6: Screens vs building","hook":"Screens vs building: a teacher's honest take","badge":"Studio day","needs":false,"film":[{"what":"Why Build #11 Creator, not just a user","short":"Why Build #11","note":"Posts Mon Nov 23.","ref":"2026-11-23"},{"what":"Why Build #13 Teamwork","short":"Why Build #13","note":"Posts Thu Nov 26.","ref":"2026-11-26"},{"what":"Podcast ep. 7","short":"Podcast ep. 7","note":"Posts Sun Nov 29.","ref":"2026-11-29"}],"sections":[["Plan","rows",[["Episode","Podcast ep. 6. Full episode on YouTube and Spotify, plus one clip on Kubot."],["Filmed","Last Sunday's studio day."]]],["Inspo","rows",[["Show","Founders podcast: weekly build in public episode, 30 to 45 minutes, Denis and Gabriel hosting. Cut into 5 to 8 short clips."],["This episode","[topic to pick]. Idea: the best comments and parent questions from the week."]]],["Shape","text","1. Cold open (1 to 2 min): Denis sets up [topic].\n2. Main conversation (15 to 20 min): [topic], with real classroom moments, not slogans.\n3. Week in the build (3 to 5 min): what got done at the store, what broke, what's next.\n4. Kid of the week (optional): a Friday kid explains their robot, with a parent on mic. Only if release-cleared.\n5. What to try tonight (5 min): one tip for parents.\n6. Close (2 min): tease next week."],["Questions","list",["[the best parent question from this week's comments]","[the second best parent question]","What broke this week, and what's next before the store opens?","If a parent has 20 minutes tonight, what should they try?"]],["Shots","list",["Wide two-shot, plus a single on each host","Print farm and robots visible behind","Clip targets: one Gabriel line that stands alone, one parent tip for tonight"]],["Where","text","Studio. Audio: the podcast mics, test recording first."],["Checklist","check",["Upload the full episode to YouTube and Spotify","Cut one clip for Kubot","Mark 5 to 8 clips for later","No prices, no pitch","Reply to comments in the first hour"]]],"s":{"hooks":["Screens vs building: a teacher's honest take","Should you take away the iPad?","Not all screen time is the same.","What to swap one hour of screen time for","The screen time question every parent asks"],"body":"DENIS (cold open): Every parent we talk to worries about screens. So we asked Gabriel what he actually thinks.\nDENIS: Is all screen time bad?\nGABRIEL: [his answer]\nDENIS: If a parent wants to swap one hour, what should it be?\nGABRIEL: [his tip]\nDENIS: Store update. [what got done, what's left before December 1st]\nCLIP FOR KUBOT: [Gabriel's best line on screens vs building]","cta":"Full episode on YouTube and Spotify. What should we ask Gabriel next? Waitlist link in bio.","src":"Plan v2 podcast segments + parent questions (new episode plan)","kind":"new","notes":"Gabriel's answers are his, unscripted. Only the cold open and questions are written.","fillins":"","format":""}},"personal":[{"time":"9:30 AM","label":"Trial Reel","desc":"Quote reel shown to non-followers","has":true,"title":"My life by age, but every stop gets more honest","s":{"hooks":["At [age] I wanted [the goal you set young]. Most of what I tried didn't work.","my life by age (most of it didn't work)","My life by age, but every stop gets more honest","A messy timeline at 19 is a flex.","Most of what I tried didn't work. Here's every stop."],"body":"(1 HOOK)\nAt [age] I wanted [the goal you set young, e.g. to build something of my own].\nMost of what I tried didn't work.\n\n(2 RISING ACTION)\nAnd honestly? A messy timeline at 19 is a flex.\n[B-ROLL: the age on screen, big, over a photo from each stop]\n[Age]. Washing cars. [one line on what you were trying to do].\n[Age]. Marketing agency. [one line on what you were trying to do].\nI had no idea what I was doing. [one honest line on how unprepared you were].\n[Age]. Food delivery startup. [one line on what you were trying to do].\n\n(3 SECOND CONFLICT)\nThen [the lowest point on the timeline, e.g. the moment a venture ended or a bet that went wrong].\n[how it felt, one line].\n\n(4 CLIMAX) [MUSIC: beat drop. Tip: use a song from one of your favorite movies]\n[Age]. AI automation agency. [the moment it started working, or the lesson that clicked].\n[Age]. UGC. [the moment people started watching, or the lesson that clicked].\nEvery stop that didn't work handed something to the next one.\n\n(5 RESOLUTION)\n21. Building Kubot with Gabriel in a Miami mall.\n[how this is the goal from the hook, in your words].\nAnd the only timeline that fails is the one where you stop adding ages to it.","cta":"Drop your age and what you're building in the comments.","src":"Denis Content Scripts sheet #2 (reused)","kind":"reused","notes":"Story format v2 (5-step). Source: Cem's age-by-age list of tries and failures that added up.\nThe resolution is Kubot, so the goal in the hook has to be something building Kubot honestly fulfils (e.g. building something of your own, something real you can hold). Don't say it's open or give a date.\nDebatable line: \"a messy timeline at 19 is a flex.\"\nIf the lowest point is the same venture you use in #6 or #8, don't post them close together.\n~50-60s.","fillins":"- [age] + [the goal you set young], e.g. to build something of your own\n- [Age] at each stop: car washing, marketing agency, food delivery startup, AI agency, UGC\n- [one line on what you were trying to do] at car washing, the marketing agency and food delivery\n- [one honest line on how unprepared you were]\n- [the lowest point on the timeline]: a real one, e.g. a venture ending or a bet that went wrong + [how it felt]\n- [the moment it started working] for the AI agency and UGC\n- [how this is the goal from the hook, in your words]","format":"Listicle, 5-step story (v2)"}},{"time":"1:30 PM","label":"Follower Farming","desc":"Identity list, 25 to 35s","has":true,"title":"10/10 male rules but it gets increasingly more niche","s":{"hooks":["10/10 male rules but it gets increasingly more niche","rules (niche edition)","If you already do three of these rules, you're ahead of most people your age","8 rules that quietly change everything, and the last one is the hardest","Most people stop at number 3. Number 8 is the one that matters."],"body":"1. Never date your friend's ex\n2. Always have your boy's back in public, even when he's wrong\n3. Never repeat something another man told you in confidence\n4. Always let the boys know before you peace out for the night\n5. Never let a friend go home with someone sketchy\n6. Always tell your boy the truth before someone else does\n7. Never go for a girl your friend had feelings for, even if nothing happened\n8. And being the kind of man your boy would trust with their girl, their kids, and their life.","cta":"No spoken CTA. The And line is the ending. Caption: which number are you? Comment it.","src":"Style library (Claude export): 10/10 male rules","kind":"adapted","notes":"The 2.2M then 3.5M video. Comments argued over 2 and 7. Posted before, so treat it as a v2 repost: refresh 1 or 2 points. For wider reach you can drop 'male' from the title (he noticed a 6.5M list that never said it). Each point gets a 1 to 4 word on-screen label.","fillins":"","format":""}},{"time":"6:00 PM","label":"My Take","desc":"Personal bet take, 55 to 65s","has":true,"title":"Starting a company with a partner older than you","s":{"hooks":["my partner is way older than me","My business partner has taught kids for over 10 years. I'm 21.","Why every young founder needs an older partner","Age gap partnerships are underrated.","What I bring and what he brings"],"body":"My business partner has been teaching kids robotics for over 10 years.\nI'm 21.\nPeople ask how that works.\nHear me out.\nHe has the experience.\nI have [what you bring, in one line].\nHe knows what kids need.\nI know how to get people to see it.\nHonestly? I think every young founder should find someone who's already been where they're going.\nYou borrow their trust until you've earned your own.\nAnd they borrow your energy until they remember how fun it was to start.","cta":"So tell me. Would you start a company with someone way older? Comment it.","src":"New (no old script fit): opinion / bet take","kind":"new","notes":"Get Gabriel's OK.","fillins":"","format":"Personal take"}}]},{"date":"2026-11-23","dow":"Mon","kubot":{"format":"Why Build","title":"Kubot: Why Build","sub":"#11 Creator, not just a user","hook":"Your kid uses tech every day. Can they build it?","badge":"","needs":false,"film":[],"sections":[["Plan","rows",[["Show","Why Build? with Gabriel. Gabriel to camera, 45 to 75 seconds."],["Episode","#11 Creator, not just a user"],["Status","Script drafted below. Gabriel to review before filming."]]],["Inspo","rows",[["Development point","Creator, not just a user"],["Hook","Your kid uses tech every day. Can they build it?"],["Do this tonight","Open up a broken toy together and see what's inside"]]],["Shots","list",["Gabriel to camera, clean audio","B-roll: [Friday class moment that shows the point]","On-screen text: [hook] / [tonight tip]"]],["Where","text","Studio. Filmed on Sunday studio day."],["Checklist","check",["Review the script with Gabriel","Film on Sunday studio day","Cut to 45 to 75 seconds","Add on-screen text and subtitles","No prices, no pitch","Post on Kubot"]]],"s":{"hooks":["Your kid uses tech every day. Can they build it?","user or creator?","Your kid can use an iPad. Can they open one up?","Open a broken toy together tonight.","Users press buttons. Creators know what's behind them."],"body":"Your kid uses tech every single day.\nCan they build any of it?\nMost kids today are amazing users.\nThey can find anything.\nFix the Wi-Fi faster than us.\nBut using something and understanding it are different.\nThe kid who asks what's inside the remote.\nThe kid who wants to know how the car knows to stop.\nThat's a creator.\nAnd every creator started by opening something up.\nTonight, find a broken toy.\nOr an old remote.\nOpen it together.\nLook at the board, the wires, the motor.\nYou don't need to know what any of it is.\nJust ask, \"what do you think this part does?\"\nWhat did you find inside?","cta":"Tonight: open a broken toy together and see what's inside. Comment what you found. Waitlist link in bio.","src":"Plan v2 Why Build bank #11 (Creator, not just a user): hook and tonight tip reused, new body","kind":"new","notes":"New body written from the plan v2 episode bank hook and 'do this tonight'. Concept-led, so no story from Gabriel is needed. Gabriel should adjust any line that isn't how he'd say it.","fillins":"","format":""}},"personal":[{"time":"9:30 AM","label":"Trial Reel","desc":"Quote reel shown to non-followers","has":true,"title":"What a kid taught me at the Friday class","s":{"hooks":["a kid taught me this","A kid at our Friday class taught me something I didn't expect.","I went to help a kid build a robot. He ended up teaching me.","Kids figure things out faster than adults. Here's proof.","I learned more from one kid than from a month of YouTube."],"body":"(1 HOOK)\nI wanted [what the kid was building].\nAnd [what was hard for them].\n\n(2 RISING ACTION)\nEveryone thinks they're there to teach the kids.\nHonestly? Kids are better at failing than adults.\n[B-ROLL: Friday class, hands only unless the release is signed]\nSo I [first real action].\nThen [second real action].\n[one honest line on how unprepared you were].\n\n(3 SECOND CONFLICT)\n[the moment they got stuck]\n[how it felt, one line].\n\n(4 CLIMAX) [MUSIC: beat drop]\nThen [what they did that surprised you].\n[B-ROLL: that exact moment, slowed down]\n\n(5 RESOLUTION)\n[what it taught you].\nAnd I think most adults forgot how to be that kind of stuck.","cta":"Comment the last thing a kid taught you.","src":"New (no old script fit): his 5-step story format","kind":"new","notes":"Only a real moment. No kid's name, or first name only with a signed parent release. Every [bracket] is yours to fill with something that really happened. If there's no real version, skip this one.","fillins":"","format":"5-step story (v2)"}},{"time":"1:30 PM","label":"Follower Farming","desc":"Identity list, 25 to 35s","has":true,"title":"10/10 signs you were never meant for a 9 to 5, but it gets increasingly more niche","s":{"hooks":["If you relate to at least three of these, you were never meant for a 9 to 5.","signs you were never meant for a 9 to 5 (niche edition)","10/10 signs you were never meant for a 9 to 5, but it gets increasingly more niche","Job security sounds more like a cage to you, doesn't it?","You were never meant for a 9 to 5 if number 6 is you"],"body":"If you relate to at least three of these, you were never meant for a 9 to 5.\n1. You do your best work when nobody's telling you how\n2. You'd rather make less doing your own thing than more doing someone else's\n3. Your notes app is full of business ideas, to remind yourself the job was never the plan\n4. A meeting that could've been a text physically hurts you\n5. You learn more from one YouTube video than a whole week of training\n6. You turn every annoying problem into \"someone should build this,\" because your brain sees businesses where everyone else sees complaints\n7. \"Job security\" sounds more like a cage than a comfort\n8. And you've stopped asking if you're ready, and started asking how long you're willing to be bad at it\nComment how many you got.","cta":"Comment how many you got.","src":"Denis Content Scripts sheet #12 (reused)","kind":"reused","notes":"Follower farm. Broad 10/10 with the escalation title; describes the viewer instead of telling them what to do. Uses one of the alternate hooks already in your library (\"signs you were never meant for a 9 to 5\").\nDebatable lines at 2 (less money, your own thing) and 7 (job security is a cage). Expect the 9-to-5 defenders in the comments, which is the point. Keep it positive, nobody's the villain.\nLines 3 and 6 carry the outcome. 8 starts with And.\nOn-screen labels: Self-directed / Own thing / Idea notes / Meeting allergy / Self-taught / Problem spotter / Security cage / Ready vs willing.\n\"Comment how many you got\" is optional; on 10/10s you usually let the And line end it. Cut it if you want a clean ending.\nNo Kubot mention. Pure growth.\n~35-45s.","fillins":"None (no personal details).","format":"10/10 progressively niche (follower farm)"}},{"time":"6:00 PM","label":"My Take","desc":"Personal bet take, 55 to 65s","has":true,"title":"Kids who break things are learning","s":{"hooks":["let them break it","The kid who breaks everything might be your engineer.","Breaking things is how kids learn how they work.","Stop getting mad when they take it apart.","My take for parents of kids who break stuff."],"body":"The kid who breaks everything might be your future engineer.\nHear me out.\nThey're not trying to ruin it.\nThey want to know what's inside.\nHonestly? That's the most important question a kid can ask.\nHow does this work?\nSo give them something they're allowed to break.\nAn old remote.\nA broken toy.\nA screwdriver.\nAnd watch how fast \"breaking\" turns into \"fixing\".","cta":"So tell me. Was your kid the one who takes things apart? Comment it.","src":"New (no old script fit): opinion / bet take","kind":"new","notes":"","fillins":"","format":"Personal take"}}]},{"date":"2026-11-24","dow":"Tue","kubot":{"format":"Denis Builds","title":"Kubot: Denis Builds","sub":"Building the first robot for opening day","hook":"Building the first robot for opening day","badge":"","needs":false,"film":[],"sections":[["Plan","rows",[["Series","Denis Builds: Denis on camera, building in public."],["Episode","Building the first robot for opening day"],["When to film","Any time this week."]]],["Shots","list",["Parts laid out on the table, one slow pan","Build timelapse from a fixed angle","The first time it works, one take","Close-up of [the best detail]"]],["Where","text","[where you build]"],["Checklist","check",["Film while you build","Cut to 30 to 45 seconds","No prices, no pitch","Post on Kubot"]]],"s":{"hooks":["Building the first robot for opening day","the first robot in the store","This robot will be the first thing kids see when they walk in.","Every store needs a first robot.","One week before opening, I'm building this."],"body":"This is the first robot kids will see when they walk into the store.\nAnd I'm building it this week.\n[B-ROLL: parts laid out]\nWhat it is: [the demo build for opening day].\nWhat it does: [what it does].\n[B-ROLL: build timelapse]\nWhat went wrong: [one honest line].\n[B-ROLL: the first time it works]\nAnd in one week, a kid gets to see it move for the first time.","cta":"What should the first robot be? Comment it. Waitlist link in bio.","src":"Denis Builds format (kubot-builds-scripts.md) + store countdown (new script)","kind":"new","notes":"","fillins":"","format":""}},"personal":[{"time":"9:30 AM","label":"Trial Reel","desc":"Quote reel shown to non-followers","has":true,"title":"The law of the first customer, but the last step is the one everyone skips","s":{"hooks":["At [age] I needed [my first paying car wash customer]. I had [the conflict].","stop building, go ask","The law of the first customer","Your first idea doesn't matter. Your first customer does.","If money is your only reason, you'll quit in 3 weeks."],"body":"(1 HOOK)\nAt [age] I needed [the goal, e.g. my first paying car wash customer].\nI had [the conflict, e.g. no customers, no website, no idea where to start].\n\n(2 RISING ACTION)\nIf money is your only reason, you'll quit in 3 weeks.\nAnd your first idea doesn't matter. Your first customer does.\n[B-ROLL: car washing footage or photos, buckets, the car you started with]\nSo I [first action you took to find a customer].\nThen [second action].\nI had no clue how to sell. [one honest line on how unprepared you were].\n\n(3 SECOND CONFLICT)\nThen [the moment you almost quit car washing, e.g. the first no, a job that went badly, a week with no one].\nThere's a 16-year-old who built a whole app for barbers before talking to a single barber.\nFive shops said they were interested. He never followed up.\nThree weeks later, he quit.\nI was about one week from being him.\n\n(4 CLIMAX) [MUSIC: beat drop. Tip: use a song from one of your favorite movies]\nSo [the follow-up or ask that changed it].\n[the first yes, and how it happened].\n\n(5 RESOLUTION)\n[the goal achieved, e.g. first car washed, first money in hand].\nThat's the law of the first customer. Find them, build it, follow up.\nAnd the follow-up text you're too nervous to send might be the whole business.","cta":"Send the follow-up text today, then comment 'sent'.","src":"Denis Content Scripts sheet #4 (reused)","kind":"reused","notes":"Story format v2 (5-step). Source: AR4X blog. The 16-year-old, 5 shops and 3 weeks come from that article, not from you. Credit it in the caption.\n\"Law of the first customer\" is a name made up for this video.\nDebatable lines: \"you'll quit in 3 weeks\" and \"your first idea doesn't matter, your first customer does.\"\nThe second conflict uses the article to raise the stakes, but it still needs your own real down moment first.\n~50-60s.","fillins":"- [age] + [the goal], e.g. your first paying car wash customer\n- [the conflict], e.g. no customers, no website\n- [first action] and [second action] you took to find a customer\n- [one honest line on how unprepared you were]\n- [the moment you almost quit car washing]: real, e.g. the first no or a week with nobody\n- \"I was about one week from being him\": keep only if that's true, otherwise cut it\n- [the follow-up or ask that changed it] + [the first yes, and how it happened]\n- [the goal achieved]","format":"Name-the-law essay, 5-step story (v2)"}},{"time":"1:30 PM","label":"Follower Farming","desc":"Identity list, 25 to 35s","has":true,"title":"Your gym bag tells me how serious you are","s":{"hooks":["your gym bag exposes you","Your gym bag tells me how serious you are.","Show me your gym bag.","What's in your gym bag says everything.","Where does your gym bag land?"],"body":"ON-SCREEN: a \"serious meter\" fills with each point (on screen, not spoken).\n\nYour gym bag tells me how serious you are.\n1. Just keys and AirPods. Freestyle. [METER 10%]\n2. A pre workout you don't need. [METER 20%]\n3. A notebook with every lift, to beat last week instead of guessing. [METER 35%]\n4. Lifting straps. [METER 50%]\n5. Spare socks. A planner. [METER 60%]\n6. Pre packed meals, to never let your nutrition depend on what's open. [METER 75%]\n7. Chalk. A belt. Knee sleeves. You compete. [METER 90%]\n8. And the same beat up bag you've carried for years, because the bag never mattered, showing up did. [METER 100%]","cta":"Tag the friend who's stuck at 10%.","src":"New (no old script fit): identity list with a meter","kind":"new","notes":"","fillins":"","format":"Follower farm list"}},{"time":"6:00 PM","label":"My Take","desc":"Personal bet take, 55 to 65s","has":true,"title":"Word of mouth still beats any ad","s":{"hooks":["word of mouth wins","The best marketing still isn't an ad.","I run marketing, and I still think this beats every ad.","Nobody trusts ads. Everyone trusts their friend.","The oldest marketing trick still works best."],"body":"I run marketing for a robotics company.\nAnd I still think the best marketing isn't an ad.\nIt's someone telling their friend.\nHear me out.\nNobody trusts an ad.\nEverybody trusts the parent at pickup who says \"you have to see this\".\nHonestly? Ads get attention.\nStories get trust.\nSo the real job is making something people can't stop talking about.\nAnd then getting out of the way.","cta":"So tell me. Last thing you bought because a friend told you? Comment it.","src":"New (no old script fit): opinion / bet take","kind":"new","notes":"No prices, no pitch. General marketing take.","fillins":"","format":"Personal take"}}]},{"date":"2026-11-25","dow":"Wed","kubot":{"format":"Robot on the Street","title":"Kubot: Robot on the Street","sub":"Should kids learn to code or learn to build first?","hook":"Should kids learn to code or learn to build first?","badge":"","needs":false,"film":[{"what":"Robot on the Street","short":"Robot on the Street","note":"Film today or earlier. Main question: Should kids learn to code or learn to build first?"}],"sections":[["Plan","rows",[["Series","Robot on the Street: the robot holds the mic and asks people one short question each."],["Main question","Should kids learn to code or learn to build first?"],["Twist ending","Gabriel steps in at the end: \"Robots don't teach here. Kids build them.\""],["Goal","5 to 6 good answers, a split reaction, then the twist. 30 to 45 seconds."],["When to film","Today or earlier."]]],["Questions","list",["Would you let a robot teach your kid?","Would you rather your kid use robots or build them?","What should kids learn that school doesn't teach?","Would your kid rather have an iPad or build a robot?","Are you scared of AI for your kids?","What did you build as a kid?","If a robot could help with one thing at home, what would it be?","Should kids learn to code or learn to build first?"]],["Shots","list",["Opener: the robot turns to someone, mic up","Opener line: \"Quick question from a robot. Got 5 seconds?\"","Each answer: tight on the person, robot mic in frame","Reactions: people laughing, pointing, filming the robot","Wide establishing shot of the spot","Gabriel walking in for the twist, then the line to camera"]],["Where","text","[pick the spot]. Public sidewalks or a park. Ask before filming on private property. Robot at the edge of the walkway, not blocking it."],["Checklist","check",["Pick the spot and time","Charge the robot and the mic","Print releases and bring pens","Quick release from every face used, a parent's for kids","Never mock anyone's answer","Get 5 to 6 usable answers","Film Gabriel's twist line","Cut to 30 to 45 seconds with subtitles","No prices, no pitch"]]],"s":{"hooks":["Should kids learn to code or learn to build first?","We asked Miami: should kids learn to code or learn to build first?","A robot asked strangers one question, and the answers get more honest","People had opinions. Fast.","Quick question from a robot. Got 5 seconds?"],"body":"ROBOT: Quick question from a robot. Got 5 seconds?\nROBOT: Should kids learn to code or learn to build first?\n[answer 1, word for word]\n[answer 2]\n[answer 3, the one that surprised you]\n[answer 4]\n[answer 5, a kid if there's a signed parent release]\n[B-ROLL: reactions, people filming the robot]\n[the split: who said yes, who said no, in one line]\nGABRIEL (to camera): Robots don't teach here. Kids build them.","cta":"What would you answer? Comment it. Waitlist link in bio.","src":"Plan v2 Robot on the Street format + content.py question list (structure reused; answers are real only)","kind":"adapted","notes":"Unscripted. Quick release from every face, a parent's for kids. Never mock an answer.","fillins":"","format":""}},"personal":[{"time":"9:30 AM","label":"Trial Reel","desc":"Quote reel shown to non-followers","has":true,"title":"Nobody is coming to make you ready","s":{"hooks":["you'll never feel ready","Nobody is coming to tell you you're ready.","Ready is a feeling you get after, not before.","Everyone who started anything felt unqualified.","Stop asking if you're ready."],"body":"Nobody is coming to tell you you're ready.\nNo email.\nNo permission slip.\nNo moment where it suddenly feels right.\nHonestly? Everyone who started something real felt unqualified.\nThey just started anyway.\nReady isn't a feeling you get before.\nIt's something you notice after.\nUsually around the time you realize you've been doing it for a while.\nAnd if you're waiting to feel ready, you're waiting for something that only shows up once you've begun.","cta":"Comment what you're starting before you feel ready.","src":"New (no old script fit): name-the-law / insight reel","kind":"new","notes":"Pairs with his 'stopped asking if you're ready' line from #12.","fillins":"","format":"Insight reel"}},{"time":"1:30 PM","label":"Follower Farming","desc":"Identity list, 25 to 35s","has":true,"title":"10/10 peak male experiences but it gets increasingly more niche","s":{"hooks":["10/10 peak male experiences but it gets increasingly more niche","peak experiences (niche edition)","If you already do three of these peak experiences, you're ahead of most people your age","8 peak experiences that quietly change everything, and the last one is the hardest","Most people stop at number 3. Number 8 is the one that matters."],"body":"1. Going on your first drive with your license\n2. Making your first bit of internet money\n3. Hitting a PR you didn't think you could\n4. Walking into a room and feeling like you actually belong there\n5. Stepping off the plane in a country where no one knows your name\n6. Beating your dad at something he taught you as a kid\n7. The first time someone younger asks you for advice\n8. And the moment you realize the kid you used to be would be in awe of the man you are today","cta":"No spoken CTA. The And line ends it. Caption: send this to the friend who needs number 8.","src":"Style library (Claude export): 10/10 peak male experiences","kind":"adapted","notes":"He said it did 135k. Posted before, so treat it as a v2 repost: refresh 1 or 2 points. For wider reach you can drop 'male' from the title (he noticed a 6.5M list that never said it). Each point gets a 1 to 4 word on-screen label.","fillins":"","format":""}},{"time":"6:00 PM","label":"My Take","desc":"Personal bet take, 55 to 65s","has":true,"title":"Robots will be in homes before people are ready","s":{"hooks":["robots are coming home","I think robots will be in homes way sooner than people expect.","Most people aren't ready for a robot at home.","My bet on home robots","The robot in your kitchen is closer than you think."],"body":"Most people think home robots are far away.\nI think they're closer than anyone's ready for.\nHear me out.\nPhones went from rare to everywhere in a few years.\nRobots are starting the same curve.\nMost people see that and think, creepy.\nI see something else.\nA kid who grows up building robots won't be scared of one in the kitchen.\nThey'll know how it works.\nAnd honestly, I'd rather my generation's kids build them than be confused by them.","cta":"So tell me. Would you want a robot at home? Comment it.","src":"New (no old script fit): opinion / bet take","kind":"new","notes":"Opinion only. Add a real news peg in brackets with a source if you have one.","fillins":"","format":"Personal take"}}]},{"date":"2026-11-26","dow":"Thu","kubot":{"format":"Why Build","title":"Kubot: Why Build","sub":"#13 Teamwork","hook":"Two kids, one robot. Watch what happens","badge":"","needs":false,"film":[],"sections":[["Plan","rows",[["Show","Why Build? with Gabriel. Gabriel to camera, 45 to 75 seconds."],["Episode","#13 Teamwork"],["Status","Script drafted below. Gabriel to review before filming."]]],["Inspo","rows",[["Development point","Teamwork"],["Hook","Two kids, one robot. Watch what happens"],["Do this tonight","Give siblings or friends one shared build"]]],["Shots","list",["Gabriel to camera, clean audio","B-roll: [Friday class moment that shows the point]","On-screen text: [hook] / [tonight tip]"]],["Where","text","Studio. Filmed on Sunday studio day."],["Checklist","check",["Review the script with Gabriel","Film on Sunday studio day","Cut to 45 to 75 seconds","Add on-screen text and subtitles","No prices, no pitch","Post on Kubot"]]],"s":{"hooks":["Two kids, one robot. Watch what happens","two kids, one robot","Give two kids one build and watch.","Teamwork isn't taught in a lecture.","The fastest way to teach sharing"],"body":"Two kids.\nOne robot.\nWatch what happens.\nAt first, they both want the controller.\nThen someone has to hold the wheel while the other one screws it in.\nThen one is better at wiring and one is better at the design.\nNobody told them to split it up.\nThe build did.\nHonestly, that's how teamwork actually gets learned.\nNot by being told to share.\nBy needing someone else to finish the thing you care about.\nThe kid who says \"hold this\".\nThe kid who says \"let me try\".\nTonight, give siblings or friends one shared build.\nOne kit. One goal.\nThen stay out of it.\nWho took charge?","cta":"Tonight: give siblings or friends one shared build. Comment who took charge. Waitlist link in bio.","src":"Plan v2 Why Build bank #13 (Teamwork): hook and tonight tip reused, new body","kind":"new","notes":"New body written from the plan v2 episode bank hook and 'do this tonight'. Concept-led, so no story from Gabriel is needed. Gabriel should adjust any line that isn't how he'd say it.","fillins":"","format":""}},"personal":[{"time":"9:30 AM","label":"Trial Reel","desc":"Quote reel shown to non-followers","has":true,"title":"The video that flopped","s":{"hooks":["this video flopped","I spent [time] on this video. It flopped.","My worst video taught me more than my best one.","The flop nobody saw.","Here's what a flop actually teaches you."],"body":"(1 HOOK)\nI wanted [the video you worked hardest on].\nAnd [why you thought it would work].\n\n(2 RISING ACTION)\nEveryone's had a post flop.\nHonestly? A flop is the most honest feedback you'll ever get.\n[B-ROLL: the flopped video, your analytics, if you want to show it]\nSo I [first real action].\nThen [second real action].\n[one honest line on how unprepared you were].\n\n(3 SECOND CONFLICT)\n[how it actually performed, only real numbers]\n[how it felt, one line].\n\n(4 CLIMAX) [MUSIC: beat drop]\n[what you changed after].\n[B-ROLL: that exact moment, slowed down]\n\n(5 RESOLUTION)\n[what that change did].\nAnd the flop wasn't the end of the idea. It was the first draft.","cta":"Comment your biggest flop.","src":"New (no old script fit): his 5-step story format","kind":"new","notes":"Every [bracket] is yours to fill with something that really happened. If there's no real version, skip this one.","fillins":"","format":"5-step story (v2)"}},{"time":"1:30 PM","label":"Follower Farming","desc":"Identity list, 25 to 35s","has":true,"title":"10/10 male friendships but it gets increasingly more niche","s":{"hooks":["10/10 male friendships but it gets increasingly more niche","friendships (niche edition)","If you already do three of these friendships, you're ahead of most people your age","8 friendships that quietly change everything, and the last one is the hardest","Most people stop at number 3. Number 8 is the one that matters."],"body":"1. The friend who drags you to the gym, even when you really don't want to go\n2. The friend who would never go for a girl you had feeling for even if nothing happened\n3. The friend who's seen every version of you and has stuck around for all of them\n4. The friend whose family treats you like you've always been one of theirs\n5. The friend that literally feels like a brother to you\n6. The friend whos still genuinly happy for you even if you achieved something before him\n7. The friend whose lifestyle quietly raised the bar for what you thought you could have\n8. And being the kind of friend other men point to when someone asks how they got here","cta":"No spoken CTA. Let the And line land. Caption: comment the one you already do.","src":"Style library (Claude export): 10/10 male friendships","kind":"adapted","notes":"His final pass. Posted before, so treat it as a v2 repost: refresh 1 or 2 points. For wider reach you can drop 'male' from the title (he noticed a 6.5M list that never said it). Each point gets a 1 to 4 word on-screen label.","fillins":"","format":""}},{"time":"6:00 PM","label":"My Take","desc":"Personal bet take, 55 to 65s","has":true,"title":"Grateful for the empty room","s":{"hooks":["grateful","This Thanksgiving, I'm grateful for the empty room.","What I'm grateful for at 21.","Most people are grateful for the wins. I'm grateful for this.","Thanksgiving at 21, building a store."],"body":"This Thanksgiving, I'm grateful for the empty room.\nFor [what you're grateful for, in your words].\nFor Gabriel, who [one real line about Gabriel].\nFor everyone who watched us build something nobody could see yet.\nHonestly? A year ago, [where you were a year ago].\nNow we're days from opening.\nI'm not grateful because it's done.\nI'm grateful because I get to keep building.\nAnd if you're in your own empty room right now, I hope you're grateful for it too.","cta":"Comment what you're grateful for this year.","src":"New (no old script fit): opinion / bet take","kind":"new","notes":"Thanksgiving. Only real lines. Get Gabriel's OK on the line about him.","fillins":"","format":"Personal take"}}]},{"date":"2026-11-27","dow":"Fri","kubot":{"format":"Denis Builds","title":"Kubot: Denis Builds","sub":"Thanksgiving week: four days out","hook":"Four days until the doors open","badge":"Hero shoot 3:30 to 5 PM, Bal Harbour","needs":false,"film":[{"what":"Kubot class, 3:30 to 5 PM, Bal Harbour","note":"Hero shoot. Film testimonials and b-roll. Gabriel teaches, Denis films.","sections":[["Capture list","list",["Door: signed parent photo and video release before any face is used","Wide of the room before kids arrive","Hands on CyberBricks and 3D printed parts (vertical and horizontal)","Gabriel teaching: hands, face, parts, kids reacting","A build failing, then a kid fixing it","The first time a robot moves, plus the kid's face","Wide room shots once it's full","Pickup: a kid showing the build to a parent","Parent answer at pickup (release-cleared only): \"What did you notice in your kid today?\" Get 2 to 3 clean answers for Saturday"]],["Rules","text","No scripted kid interviews. No prices, no pitch. First names only, no school names. After class, confirm which faces are release-cleared before the edit."]],"short":"Class 3:30 to 5 PM, Bal Harbour"}],"sections":[["Plan","rows",[["Series","Denis Builds: Denis on camera, building in public."],["Episode","What got done at the store this week, what broke, what's next."],["When to film","Any time this week."]]],["Shots","list",["Denis to camera at the store","B-roll: [what got done]","Close-up: [one detail]"]],["Where","text","[where you're filming]"],["Checklist","check",["Film during the week","Cut to 30 to 45 seconds","No prices, no pitch","Post on Kubot"]]],"s":{"hooks":["Four days until the doors open","four days out","Thanksgiving week, four days to go.","Here's what four days before opening looks like.","Almost."],"body":"Four days until the doors open.\n[B-ROLL: the store today]\nWhat got done: [what got done this week].\nWhat broke: [what broke, one honest line].\nWhat's next: [what's next before December 1st].\n[B-ROLL: one detail close up]\nMost founders only post the wins.\nAnd I think the broken part is the part worth watching.","cta":"Follow along to see if we get the doors open. Waitlist link in bio.","src":"Store build update format (content.py, hub posts.json Oct 30) with a new weekly angle","kind":"adapted","notes":"Real progress only. No prices, no lease or money details.","fillins":"","format":""}},"personal":[{"time":"9:30 AM","label":"Trial Reel","desc":"Quote reel shown to non-followers","has":true,"title":"Four days out","s":{"hooks":["four days left","The store opens in four days.","Four days until the doors open. Here's where we are.","Four days out and [the real status].","This is what four days before opening actually looks like."],"body":"(1 HOOK)\nI wanted Get the doors open December 1st..\nAnd [what's still not done].\n\n(2 RISING ACTION)\nEveryone thinks the last week is the easy part.\nHonestly? The last 10% takes as long as the first 90.\n[B-ROLL: the store right now]\nSo I [first real action].\nThen [second real action].\n[one honest line on how unprepared you were].\n\n(3 SECOND CONFLICT)\n[the thing that went wrong this week]\n[how it felt, one line].\n\n(4 CLIMAX) [MUSIC: beat drop]\n[the moment it started to look like a store].\n[B-ROLL: that exact moment, slowed down]\n\n(5 RESOLUTION)\n[what's left].\nAnd in four days, the empty room gets its first kid.","cta":"Follow along. Doors open December 1st.","src":"New (no old script fit): his 5-step story format","kind":"new","notes":"Thanksgiving week. Real status only. Every [bracket] is yours to fill with something that really happened. If there's no real version, skip this one.","fillins":"","format":"5-step story (v2)"}},{"time":"1:30 PM","label":"Follower Farming","desc":"Identity list, 25 to 35s","has":true,"title":"10/10 male laws but it gets increasingly more niche","s":{"hooks":["10/10 male laws but it gets increasingly more niche","laws (niche edition)","If you already do three of these laws, you're ahead of most people your age","8 laws that quietly change everything, and the last one is the hardest","Most people stop at number 3. Number 8 is the one that matters."],"body":"1. Never let someone's opinion of you outweigh your opinion of yourself\n2. Always trust a man who came out of hardship smiling, not angry\n3. Never explain yourself to people who were never going to understand\n4. Always assume the silence in a room is louder than the noise in it\n5. Never confuse motion with progress, or being busy with being effective\n6. Always remember that how you treat others always comes back\n7. Never let any woman come between you and your boys bond\n8. And understanding that the man you become in private is the man the world eventually meets","cta":"No spoken CTA. The And line is the ending. Caption: which number are you? Comment it.","src":"Style library (Claude export): 10/10 male laws","kind":"adapted","notes":"His last paste; he still wanted point 6 closer to 'what goes around comes around' and point 4 clearer. Fix those before filming. Posted before, so treat it as a v2 repost: refresh 1 or 2 points. For wider reach you can drop 'male' from the title (he noticed a 6.5M list that never said it). Each point gets a 1 to 4 word on-screen label.","fillins":"","format":""}},{"time":"6:00 PM","label":"My Take","desc":"Personal bet take, 55 to 65s","has":true,"title":"Give them something to build, not something to scroll","s":{"hooks":["the best gift this year","The best gift for a kid this year isn't a screen.","Holiday gift take: give them something to build.","Gifts they'll remember vs gifts they'll forget","What kids actually remember getting"],"body":"Holiday gift take.\nThe best thing you can give a kid isn't another screen.\nIt's something they have to build.\nHear me out.\nA tablet is fun for a week.\nA kit they build with their own hands, they remember.\nBecause they made it.\nIt doesn't have to be expensive.\nCardboard.\nLego.\nA screwdriver set.\nHonestly? The gift is the building, not the thing.\nAnd the kid who builds something this holiday is going to show it to everyone who walks in.","cta":"So tell me. What's the best thing you ever built as a kid? Comment it.","src":"New (no old script fit): opinion / bet take","kind":"new","notes":"Black Friday post. No product pitch, no Kubot plug, no prices.","fillins":"","format":"Personal take"}}]},{"date":"2026-11-28","dow":"Sat","kubot":{"format":"Testimonial","title":"Kubot: Testimonial","sub":"From Fri Nov 27 class","hook":"They walked in with a pile of parts.","badge":"","needs":false,"film":[],"sections":[["Plan","rows",[["Series","Testimonial: a kid at pickup showing their parent what they built, then one honest sentence from the parent. Unscripted, never staged."],["Source","Footage from the Fri Nov 27 class (Bal Harbour)."],["Hook options","\"Watch [his or her] face when [he or she] shows [mom or dad]\" or \"I asked a [mom or dad] what changed in [her or his] [son or daughter]\". Use the real kid and parent."],["Who","[parent first name] and [kid first name]. First names only."],["Goal","One honest answer a parent watching can relate to. 25 to 35 seconds."]]],["Questions","list",["What did you notice in your kid today?","What did [kid] tell you about the build on the way out?","What is something [kid] built that surprised you?","How does [kid] talk about building now?","In one sentence, what did building give [kid]?"]],["Shots","list",["Kid running up with the build","Kid explaining it to the parent","Parent's face as the robot moves","The parent's one sentence","Close-up of the build in the kid's hands"]],["Where","text","Bal Harbour class footage from Friday."],["Checklist","check",["Pick the pickup moment from Friday's footage","Confirm the signed release for kid and parent","First names only, no school names","Cut to 25 to 35 seconds with subtitles","No prices, no pitch","Post on Kubot"]]],"s":{"hooks":["They walked in with a pile of parts.","Pieces in. Robot out.","Watch [his or her] face when [he or she] shows [mom or dad]","We asked a kid how their robot works.","This is what a Friday class looks like."],"body":"[B-ROLL: kid running up to the parent with the build]\nKID: [what the kid says about the build, word for word]\n[B-ROLL: the robot moving, the parent's face]\nPARENT (answering \"What did you notice in your kid today?\"): [the parent's answer, word for word]\n[B-ROLL: close up of the build in the kid's hands]\nON-SCREEN: [parent's first name] and [kid's first name], after the Fri Nov 27 class.","cta":"What did your kid build first? Comment it. Or send us their drawing.","src":"Plan v2 Real Families + kubot-details.json hook options + hub posts.json pickup posts (structure reused; words are real only)","kind":"adapted","notes":"Never staged or scripted. Signed release for kid and parent, first names only, no schools.","fillins":"","format":""}},"personal":[{"time":"9:30 AM","label":"Trial Reel","desc":"Quote reel shown to non-followers","has":true,"title":"Guess which of my businesses failed, but each one gets harder to call","s":{"hooks":["Not everything I built worked. Guess which one. I wanted [goal]. And [conflict].","guess which one failed","Guess which of my businesses failed","Failing at 19 is the cheapest tuition you'll ever pay.","Answer honestly in your head: which one didn't work?"],"body":"(1 HOOK)\nNot everything I built worked. Guess which one.\nI wanted [the goal for that venture, said without naming it].\nAnd [the conflict, e.g. I had no experience in that industry].\n\n(2 RISING ACTION)\nAnswer honestly in your head while I tell it.\nAnd honestly? Failing at 19 is the cheapest tuition you'll ever pay.\n[B-ROLL: quick cuts of every venture, car washing, agency, delivery, AI, UGC, so the viewer can't tell yet]\nSo I [first action you took, said vaguely enough not to give it away].\nThen [second action].\nI was not ready. [one honest line on how unprepared you were].\n\n(3 SECOND CONFLICT)\nThen [the setback that ended it, e.g. the money ran out, a partner left, the market said no].\n[how it felt, one line].\n\n(4 CLIMAX) [MUSIC: beat drop. Tip: use a song from one of your favorite movies]\nIt was [WHICH VENTURE: your choice, only the one that's true].\nON-SCREEN: [the venture name]\nBut what I took from it was [the one thing you took from it that you still use].\nAnd that's exactly what I used in [the venture that came next].\n\n(5 RESOLUTION)\n[the goal from the hook, reached later through the next venture].\nComment which one you guessed.\nAnd if you're in the middle of yours right now, it's not the end. It's the part you'll tell later.","cta":"Comment which one you guessed.","src":"Denis Content Scripts sheet #6 (reused)","kind":"reused","notes":"Story format v2 (5-step). The guess stays in the hook: \"Guess which one.\" The climax is the reveal.\nSource: Bertrand left Google in 2011, hit six figure months, then lost it all and is rebuilding. Inspiration only; none of his story or numbers go on camera.\nDebatable line: \"Failing at 19 is the cheapest tuition you'll ever pay.\"\nThe rising-action b-roll has to cover every venture so the answer stays hidden until the climax.\nThe resolution only works if the goal really was reached later. If it wasn't, change the goal in the hook to something you did reach.\nDon't use the same venture as #8.\n~50-60s.","fillins":"- [WHICH VENTURE] didn't go how you wanted: your choice. The digest guessed food delivery, but don't assume it\n- [the goal for that venture, said without naming it]\n- [the conflict], e.g. no experience in that industry\n- [first action] and [second action], vague enough not to give away the answer\n- [one honest line on how unprepared you were]\n- [the setback that ended it]: real, e.g. money ran out, a partner left, the market said no + [how it felt]\n- [the one thing you took from it that you still use]\n- [the venture that came next] + [the goal from the hook, reached later through it]: only if that's actually true","format":"Perception quiz, 5-step story (v2)"}},{"time":"1:30 PM","label":"Follower Farming","desc":"Identity list, 25 to 35s","has":true,"title":"10/10 things you only understand if you started young","s":{"hooks":["you only get this if you started young","10/10 things you only understand if you started a business young, but it gets increasingly more niche.","Young founders, how many of these are you?","If you started before 22, this is you.","Nobody your age gets these."],"body":"10/10 things you only understand if you started a business young, but it gets increasingly more niche.\n1. Being the youngest person in every meeting\n2. Your friends asking when you'll get a real job\n3. Wearing a blazer to look older, to make people stop asking how old you are\n4. Explaining what you do to your grandma, again\n5. Learning taxes from YouTube\n6. Turning down a safe offer, to keep building the thing that might not work\n7. Celebrating your first sale more than your birthday\n8. And realizing everyone who doubted you was just scared for you, because they never got to try","cta":"Comment how old you were when you started.","src":"New (no old script fit): identity list","kind":"new","notes":"","fillins":"","format":"Follower farm list"}},{"time":"6:00 PM","label":"My Take","desc":"Personal bet take, 55 to 65s","has":true,"title":"Your comments are the best focus group you'll ever get","s":{"hooks":["read your comments","Your comment section is a free focus group.","Half our ideas come from comments.","Stop ignoring your comments.","The best feedback I get is free."],"body":"Your comment section is the best focus group you'll ever get.\nAnd it's free.\nHear me out.\nCompanies pay a lot to ask strangers what they think.\nYou get it under every post.\nUnder our Robot on the Street videos, [what people keep asking about].\nHonestly? [only if true: a video idea that came straight from the comments].\nSo read them.\nReply to them.\nAnd when someone asks a question twice, that's your next video.","cta":"So tell me what you want to see next. I'll read every comment.","src":"New (no old script fit): opinion / bet take","kind":"new","notes":"Keep the 'next week comes from the comments' line only if true.","fillins":"","format":"Personal take"}}]},{"date":"2026-11-29","dow":"Sun","kubot":{"format":"Podcast","title":"Kubot: Podcast","sub":"Ep. 7: One week out: building a store in public","hook":"Two days until we open","badge":"Studio day","needs":false,"film":[{"what":"Why Build #15 Pride in their work","short":"Why Build #15","note":"Posts Mon Nov 30.","ref":"2026-11-30"},{"what":"Why Build #17 Starting age","short":"Why Build #17","note":"Posts Thu Dec 3.","ref":"2026-12-03"},{"what":"Podcast ep. 8","short":"Podcast ep. 8","note":"Posts Sun Dec 6.","ref":"2026-12-06"}],"sections":[["Plan","rows",[["Episode","Podcast ep. 7. Full episode on YouTube and Spotify, plus one clip on Kubot."],["Filmed","Last Sunday's studio day."]]],["Inspo","rows",[["Show","Founders podcast: weekly build in public episode, 30 to 45 minutes, Denis and Gabriel hosting. Cut into 5 to 8 short clips."],["This episode","[topic to pick]. Idea: the best comments and parent questions from the week."]]],["Shape","text","1. Cold open (1 to 2 min): Denis sets up [topic].\n2. Main conversation (15 to 20 min): [topic], with real classroom moments, not slogans.\n3. Week in the build (3 to 5 min): what got done at the store, what broke, what's next.\n4. Kid of the week (optional): a Friday kid explains their robot, with a parent on mic. Only if release-cleared.\n5. What to try tonight (5 min): one tip for parents.\n6. Close (2 min): tease next week."],["Questions","list",["[the best parent question from this week's comments]","[the second best parent question]","What broke this week, and what's next before the store opens?","If a parent has 20 minutes tonight, what should they try?"]],["Shots","list",["Wide two-shot, plus a single on each host","Print farm and robots visible behind","Clip targets: one Gabriel line that stands alone, one parent tip for tonight"]],["Where","text","Studio. Audio: the podcast mics, test recording first."],["Checklist","check",["Upload the full episode to YouTube and Spotify","Cut one clip for Kubot","Mark 5 to 8 clips for later","No prices, no pitch","Reply to comments in the first hour"]]],"s":{"hooks":["Two days until we open","We open in two days. Here's everything we got wrong.","Building a store in public, the honest version","What we'd do differently","Almost open"],"body":"DENIS (cold open): We open the doors in two days. This is the last episode before that.\nDENIS: Gabriel, what are you most nervous about?\nGABRIEL: [his answer]\nDENIS: What's the thing that went wrong that nobody saw?\n[both answer, real only]\nDENIS: What do you want a kid to feel the first time they walk in?\nGABRIEL: [his answer]\nCLIP FOR KUBOT: [the best line about the first kid walking in]","cta":"Full episode on YouTube and Spotify. What should we ask Gabriel next? Waitlist link in bio.","src":"Plan v2 podcast segments + parent questions (new episode plan)","kind":"new","notes":"Gabriel's answers are his, unscripted. Only the cold open and questions are written.","fillins":"","format":""}},"personal":[{"time":"9:30 AM","label":"Trial Reel","desc":"Quote reel shown to non-followers","has":true,"title":"The person you'll be in 5 years is watching","s":{"hooks":["your future self is watching","The person you'll be in 5 years is watching you right now.","Would future you be proud of today?","You're writing someone else's past right now.","Every day you're choosing what future you gets to say."],"body":"The person you'll be in five years is watching you right now.\nThey're going to look back at today.\nAt what you did with this exact afternoon.\nHonestly? That thought scares me a little.\nIn a good way.\nBecause they're either going to say \"thank you\".\nOr \"why did you wait\".\nYou're writing their past right now.\nSo write something they'll want to tell people about.\nAnd remember, they can't change a single thing you do today.","cta":"Comment one thing future you will thank you for.","src":"New (no old script fit): name-the-law / insight reel","kind":"new","notes":"Hopecore style, 25 to 30s. Over b-roll of your normal day.","fillins":"","format":"Insight reel"}},{"time":"1:30 PM","label":"Follower Farming","desc":"Identity list, 25 to 35s","has":true,"title":"10/10 male moments but it gets increasingly more niche","s":{"hooks":["10/10 male moments but it gets increasingly more niche","moments (niche edition)","If you already do three of these moments, you're ahead of most people your age","8 moments that quietly change everything, and the last one is the hardest","Most people stop at number 3. Number 8 is the one that matters."],"body":"1. The moment you open the Acceptance email\n2. The moment the weight finally goes up after weeks of training\n3. The moment you hear her tell her friends about you while you're pretending not to listen\n4. The moment your mom sees the first big gift you bought her\n5. The moment your dad starts talking to you like an equal instead of a kid\n6. The moment you look around the group chat and realize every man in it is someone you genuinely respect\n7. And the quiet moment you realize the life you used to pray for is the one you're already living","cta":"No spoken CTA. The And line ends it. Caption: send this to the friend who needs number 8.","src":"Style library (Claude export): 10/10 male moments and","kind":"adapted","notes":"Seven of his points, no 8th. Add an 8th or keep it at 7. Posted before, so treat it as a v2 repost: refresh 1 or 2 points. For wider reach you can drop 'male' from the title (he noticed a 6.5M list that never said it). Each point gets a 1 to 4 word on-screen label.","fillins":"","format":""}},{"time":"6:00 PM","label":"My Take","desc":"Personal bet take, 55 to 65s","has":true,"title":"China figured out how to raise tech kids","s":{"hooks":["China figured out the secret to raising tech-genius kids, and the West is ignoring it.","Uncovering lost knowledge: how China teaches kids AI","There are three keys in China's tech education the West is missing.","In China, AI class starts at six.","To fix our education, we have to learn from whoever's doing it best."],"body":"China figured out the secret to raising tech-genius kids, and the West is ignoring it.\nThere are three keys in China's tech education that are almost missing from the modern Western system.\nFirst, there's a major focus on building instead of just memorizing. In primary school, kids use visual programming tools to learn how machine learning and data actually work, by experimenting with it themselves, not reading about it. This means kids are learning how AI thinks before most adults even understand what it is.\nSecond, they don't doubt their youth and teach hard concepts early. Since September 2025, AI class is mandatory in every primary and secondary school in China, starting at age six. By middle school, they're learning how data, algorithms and computing power work together. By high school, they're learning the limits of deep learning and generative AI. This is stuff I deal with every day working with Chinese robotics and 3D printing companies for the store I'm opening at 21. And schools partner with universities and tech companies to teach kids robotics and drones hands-on.\nThird and finally, it's built around real projects, not just tests. Beijing is building AI labs and experience centers for students. Kids are graded on project presentations, work exhibitions and debates, and their progress is tracked over time, almost like a portfolio.\nTo better our education, we have to learn from whoever's doing it best.","cta":"Should AI class start at six here too? Comment it.","src":"Style library: China's AI education (latest draft, Oct 7)","kind":"reused","notes":"Verify every fact again before filming (Claude could not confirm one point). Cite sources in the caption.","fillins":"","format":""}}]},{"date":"2026-11-30","dow":"Mon","kubot":{"format":"Why Build","title":"Kubot: Why Build","sub":"#15 Pride in their work","hook":"Kids keep what they make. They forget what they're given","badge":"","needs":false,"film":[],"sections":[["Plan","rows",[["Show","Why Build? with Gabriel. Gabriel to camera, 45 to 75 seconds."],["Episode","#15 Pride in their work"],["Status","Script drafted below. Gabriel to review before filming."]]],["Inspo","rows",[["Development point","Pride in their work"],["Hook","Kids keep what they make. They forget what they're given"],["Do this tonight","Display one thing they made where guests can see it"]]],["Shots","list",["Gabriel to camera, clean audio","B-roll: [Friday class moment that shows the point]","On-screen text: [hook] / [tonight tip]"]],["Where","text","Studio. Filmed on Sunday studio day."],["Checklist","check",["Review the script with Gabriel","Film on Sunday studio day","Cut to 45 to 75 seconds","Add on-screen text and subtitles","No prices, no pitch","Post on Kubot"]]],"s":{"hooks":["Kids keep what they make. They forget what they're given","kids keep what they make","Your kid will forget the toy you bought. They won't forget this.","Put it where guests can see it.","The proudest kid in the room built something."],"body":"Kids keep what they make.\nThey forget what they're given.\nThink about it.\nHow many toys from last year can your kid even name?\nNow ask them about something they built.\nThey'll tell you every part.\nWhat broke.\nHow they fixed it.\nThe kid who carries the robot to the car.\nThe kid who shows it to everyone at dinner.\nThat's pride.\nThe good kind.\nPride in something they did, not something they got.\nTonight, take one thing your kid made.\nA drawing. A build. Anything.\nPut it somewhere guests will see it.\nWatch what happens when someone asks about it.\nWhat's the thing your kid is proudest of?","cta":"Tonight: display one thing they made where guests can see it. Send us a photo or drawing of it. Waitlist link in bio.","src":"Plan v2 Why Build bank #15 (Pride in their work): hook and tonight tip reused, new body","kind":"new","notes":"New body written from the plan v2 episode bank hook and 'do this tonight'. Concept-led, so no story from Gabriel is needed. Gabriel should adjust any line that isn't how he'd say it.","fillins":"","format":""}},"personal":[{"time":"9:30 AM","label":"Trial Reel","desc":"Quote reel shown to non-followers","has":true,"title":"What I gave up to do this","s":{"hooks":["what this cost me","Here's what I gave up to open a robot store at 21.","Nobody asks what it costs.","Everything has a price. Here's mine.","I traded [what you gave up] for this."],"body":"(1 HOOK)\nI wanted [what you're building].\nAnd [what you gave up, honestly, no dollar figures].\n\n(2 RISING ACTION)\nEveryone wants the result.\nHonestly? If it didn't cost you anything, it probably isn't worth much.\n[B-ROLL: what your days look like now]\nSo I [first real action].\nThen [second real action].\n[one honest line on how unprepared you were].\n\n(3 SECOND CONFLICT)\n[the moment you missed what you gave up]\n[how it felt, one line].\n\n(4 CLIMAX) [MUSIC: beat drop]\n[why it was worth it].\n[B-ROLL: that exact moment, slowed down]\n\n(5 RESOLUTION)\nI'd make the trade again.\nAnd the cost is how you know it's real.","cta":"Comment what you gave up for your goal.","src":"New (no old script fit): his 5-step story format","kind":"new","notes":"Every [bracket] is yours to fill with something that really happened. If there's no real version, skip this one.","fillins":"","format":"5-step story (v2)"}},{"time":"1:30 PM","label":"Follower Farming","desc":"Identity list, 25 to 35s","has":true,"title":"10/10 male feelings but it gets increasingly more niche","s":{"hooks":["10/10 male feelings but it gets increasingly more niche","feelings (niche edition)","If you already do three of these feelings, you're ahead of most people your age","8 feelings that quietly change everything, and the last one is the hardest","Most people stop at number 3. Number 8 is the one that matters."],"body":"1. Driving at night with the windows down and your favorite song on\n2. Paying fully for your families dinner out\n3. Coming home from a long trip and hugging your family\n4. A Sunday afternoon where you have nothing to do and nowhere to be\n5. Sitting across from someone who genuinely gets you\n6. Knowing you got through a brutal week even though your physically and mentally exhausted\n7. Being trusted with something your parents always said you where to young for.\n8. And sitting around a fire with the boys reminiscing about the good old days, not realizing you're still in them","cta":"No spoken CTA. Let the And line land. Caption: comment the one you already do.","src":"Style library (Claude export): 10/10 male moments and (alt cut)","kind":"adapted","notes":"His points; keep the fire line as the And closer. Posted before, so treat it as a v2 repost: refresh 1 or 2 points. For wider reach you can drop 'male' from the title (he noticed a 6.5M list that never said it). Each point gets a 1 to 4 word on-screen label.","fillins":"","format":""}},{"time":"6:00 PM","label":"My Take","desc":"Personal bet take, 55 to 65s","has":true,"title":"Stop waiting for the perfect launch","s":{"hooks":["there's no perfect launch","There's no perfect launch. We open tomorrow anyway.","Tomorrow we open, and it's not perfect.","If you wait for perfect, you never open.","The night before opening day"],"body":"Tomorrow we open the doors.\nAnd it's not perfect.\nHear me out.\nThere's always one more thing.\nOne more fix.\nOne more week.\nIf we waited for perfect, we'd never open.\nHonestly? Perfect is just a fancy word for scared.\nSo we open tomorrow.\nWith [what's still not done, honestly].\nAnd we'll fix it with real kids in the room, which is the only way it was ever going to get good.","cta":"Doors open tomorrow. Follow along.","src":"New (no old script fit): opinion / bet take","kind":"new","notes":"Post Nov 30 only. No prices, no pitch.","fillins":"","format":"Personal take"}}]},{"date
