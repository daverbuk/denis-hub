doors open, the waitlist is in my bio.","src":"Denis Content Scripts sheet #10 (reused)","kind":"reused","notes":"Day X. Story format v2 (5-step). Now a past-tense RECAP: record it after Sunday Oct 18 so the setback, climax and result are real.\nReal events from the calendar: Wed Oct 14, 2-5 PM ET, Robot on the Street shoot (two episodes). Fri Oct 16, 3:30-5 PM ET, Bal Harbour class (90-min Cyberbricks, Gabriel teaches, Denis assists; releases at the door, first names only, no school names). Sun Oct 18, warehouse studio day (Why Build #2 and #6, podcast episode 2; episode 1 posts that day).\nDebatable line: \"show people the thing before it's finished.\"\nNo \"Day X\" as the text hook (your rule). The only plug is the waitlist line. No prices, no open date.\n~50-60s.","fillins":"- [X]: day number\n- [the goal for the week]\n- [the question you actually asked] on the street (calendar options: \"Would you let a robot teach your kid?\" Miami, or \"Would your kid rather have an iPad or build a robot?\" park)\n- [one honest line on how unprepared you were]\n- [a real setback from this week], e.g. a failed print or a run of no's + [how it felt]\n- [the peak moment of the week], e.g. a kid's car moving for the first time\n- [what you filmed] on Sunday\n- [the goal achieved, in a real result you saw this week]: no invented numbers","format":"Build-in-public diary (100 in 100 storytime), 5-step story (v2)"}},{"time":"1:30 PM","label":"Follower Farming","desc":"Identity list, 25 to 35s","has":true,"title":"10/10 male flexes but it gets increasingly more niche","s":{"hooks":["10/10 male flexes but it gets increasingly more niche","flexes (niche edition)","If you already do three of these flexes, you're ahead of most people your age","8 flexes that quietly change everything, and the last one is the hardest","Most people stop at number 3. Number 8 is the one that matters."],"body":"1. Having a great physic\n2. Being able to pay fully for a dinner of two\n3. Waking up before your alarm feeling fully rested\n4. Buying your mom something nice just because you can\n5. Being the guy younger family or friends look up to.\n6. Having a girl who brags about you to her friends when you're not there\n7. Having at least one ride or die successful friend\n8. And looking in the mirror at the end of the day and genuinely liking the man staring back","cta":"No spoken CTA. The And line is the ending. Caption: which number are you? Comment it.","src":"Style library (Claude export): 10/10 male flexes","kind":"adapted","notes":"He said v1 plateaued around 1.1M. Time for a v2. Posted before, so treat it as a v2 repost: refresh 1 or 2 points. For wider reach you can drop 'male' from the title (he noticed a 6.5M list that never said it). Each point gets a 1 to 4 word on-screen label.","fillins":"","format":""}},{"time":"6:00 PM","label":"My Take","desc":"Personal bet take, 55 to 65s","has":true,"title":"Kids should learn to build before they learn to code","s":{"hooks":["build first, code second","Kids shouldn't learn to code first.","Coding is great. It's just not step one.","Everyone says teach kids to code. I think they skipped a step.","What kids should learn before code"],"body":"Everyone says teach your kid to code.\nI think we skipped a step.\nHear me out.\nCode makes sense once you've built something you want to control.\nA kid who builds a car first, then codes it to move, gets why code matters.\nA kid who starts with code on a screen just sees homework.\nHonestly? Building gives code a reason.\nHands first.\nThen the screen.\nThat's how we think about it at Kubot.\nAnd I'd bet the best engineers of the next decade started by taking something apart.","cta":"So tell me. Code first, or build first? Comment it.","src":"New (no old script fit): opinion / bet take","kind":"new","notes":"","fillins":"","format":"Personal take"}}]},{"date":"2026-10-27","dow":"Tue","kubot":{"format":"Denis Builds","title":"Kubot: Denis Builds","sub":"Twelve printers, one night","hook":"Twelve printers, one night","badge":"","needs":false,"film":[],"sections":[["Plan","rows",[["Series","Denis Builds: Denis on camera, building in public."],["Episode","Overnight print farm timelapse. Hook and shot only."],["When to film","Set up the timelapse the night before it posts."]]],["Inspo","rows",[["Hook","Twelve printers, one night"]]],["Shots","list",["Locked-off timelapse of the print farm overnight","Morning: parts coming off the beds","Close-up of [the best print]"]],["Where","text","[where the print farm is set up]"],["Checklist","check",["Set up the timelapse","Cut to 15 to 30 seconds","No prices, no pitch","Post on Kubot"]]],"s":{"hooks":["Twelve printers, one night","We left 12 printers running overnight. Here's what came out.","This is what a night at our print farm looks like.","Hundreds of parts, one night.","Our printers worked the night shift."],"body":"Twelve printers.\nOne night.\n[B-ROLL: locked off timelapse, lights going down]\nHere's what we're printing: [what you're printing].\nEvery one of these parts goes into a robot a kid will build.\n[B-ROLL: the printers running]\nThe morning.\n[what came out, one honest line, including any failed prints]\nTwelve printers did that while we slept.\nAnd every part is one more kid's robot.","cta":"What should we print next? Comment it. Waitlist link in bio.","src":"kubot-builds-scripts.md banked idea 'Twelve printers, one night' (hook reused, new body)","kind":"adapted","notes":"","fillins":"","format":""}},"personal":[{"time":"9:30 AM","label":"Trial Reel","desc":"Quote reel shown to non-followers","has":true,"title":"Pick a challenge too big for you, but it gets harder before it gets better","s":{"hooks":["\"Pick a challenge too big for who you are now.\" At [age] I tried to [the too-big challenge]. And [why it was too big for you].","pick something too big for you","Pick a challenge too big for you, but it gets harder before it gets better","If your goal doesn't scare you a little, it's too small.","A challenge above your level drags the new version of you out."],"body":"(1 HOOK)\n\"Pick a challenge too big for who you are now.\"\nDan Koe posted that, and [one line on why it hit you].\nAt [age], I tried to [a too-big challenge you actually pulled off, e.g. land the first client for the AI agency].\nAnd [why it was too big for who you were then, e.g. I'd never built an automation for anyone].\n\n(2 RISING ACTION)\n\"That's how people change. A challenge above your level drags the new version of you out.\"\nHonestly? If your goal doesn't scare you a little, it's too small.\n[B-ROLL: real footage or screenshots from that time]\nSo I [first real action toward it].\nThen [second real action].\n\"It will suck. You'll fail constantly.\"\n[one honest line on how out of your depth you were].\n\n(3 SECOND CONFLICT)\n\"You'll feel like a fraud for months.\"\nFor me that was [the real moment you felt like a fraud].\n\"Your old self will beg you to stay the same.\"\nMine kept saying [what your old self was telling you, e.g. go back to what you already know].\n\n(4 CLIMAX) [MUSIC: beat drop. Tip: use a song from one of your favorite movies]\nI didn't go back. [what you did instead].\n[the moment the new version of you showed up].\n[B-ROLL: that exact moment, slowed down]\n\n(5 RESOLUTION)\n[the challenge achieved, said plainly].\n\"But if you can pull this off, 10-20 times throughout your life, you will blow past everyone else.\"\nI'm 21. That was one.\nAnd the version of me who pulled it off didn't exist until I picked something too big for the old one.","cta":"Comment the too big thing you're picking this year.","src":"Denis Content Scripts sheet #16 (reused; it was planned for an earlier date)","kind":"reused","notes":"Originally planned for 9:30 AM Trial Reel, quote reel (IG #22)\nDan Koe, @thedankoe on X, Oct 4, 2026 (his newest unused post; his only newer ones are already in #11 and #13). Quote reel: his whole post is read word for word, split across all five beats in order. Credit him in the caption.\nStory format v2 (5-step). The story is ONE real challenge that was above your level at the time and that you actually pulled off. The AI agency's first client is only a suggestion.\nDebatable line: \"If your goal doesn't scare you a little, it's too small.\"\nDifferent from #11 (sticking with it for 6 months) and #13 (aiming an obsession): this one is about choosing something bigger than you. Don't use the same story or footage as #1, which also suggests the AI agency's first client.\nNo fake hardship: no late-night or \"fraud at 2am\" lines.\n~50-60s.","fillins":"- [one line on why the quote hit you]\n- [age] + [a too-big challenge you actually pulled off]: must already be achieved (not Kubot's opening, which hasn't happened)\n- [why it was too big for who you were then]\n- [first real action] and [second real action]\n- [one honest line on how out of your depth you were]\n- [the real moment you felt like a fraud]\n- [what your old self was telling you]: only if true for you\n- [what you did instead] + [the moment the new version of you showed up]\n- [the challenge achieved]\n- \"That was one\": keep only if you'd honestly count it as one of your big ones","format":"Quote reel (Trial Reel), 5-step story (v2)"}},{"time":"1:30 PM","label":"Follower Farming","desc":"Identity list, 25 to 35s","has":true,"title":"10/10 male mindsets but it gets increasingly more niche","s":{"hooks":["10/10 male mindsets but it gets increasingly more niche","mindsets (niche edition)","If you already do three of these mindsets, you're ahead of most people your age","8 mindsets that quietly change everything, and the last one is the hardest","Most people stop at number 3. Number 8 is the one that matters."],"body":"1. Taking full responsibility for your life\n2. Choosing action over analysis\n3. Going with pride over happiness\n4. Refusing to settle for normal when you know you were built for more\n5. Investing in yourself first always pays off\n6. Using your hardest moments as fuel, not as the reason you stopped\n7. Walking into rooms where you're the least successful person, on purpose\n8. And accepting that the game was always rigged, and those who win it stopped waiting for it to be fair","cta":"No spoken CTA. The And line ends it. Caption: send this to the friend who needs number 8.","src":"Style library (Claude export): 10/10 male mindsets v2","kind":"adapted","notes":"His Apr 30 rewrite. Posted before, so treat it as a v2 repost: refresh 1 or 2 points. For wider reach you can drop 'male' from the title (he noticed a 6.5M list that never said it). Each point gets a 1 to 4 word on-screen label.","fillins":"","format":""}},{"time":"6:00 PM","label":"My Take","desc":"Personal bet take, 55 to 65s","has":true,"title":"Screen time isn't the problem. Passive screen time is.","s":{"hooks":["screen time isn't the problem","Not all screen time is the same, and parents know it.","The difference between scrolling and making","Stop counting hours. Start counting this.","The screen isn't the enemy. Doing nothing on it is."],"body":"Screen time isn't the problem.\nPassive screen time is.\nHear me out.\nA kid scrolling for an hour and a kid designing something for an hour both show up as one hour.\nThey are not the same hour.\nOne is being fed.\nOne is making.\nHonestly? I think parents already feel the difference.\nThey just don't have a word for it.\nSo don't just count the hours.\nAsk what they made.\nAnd if the answer is nothing, that's the hour to swap.","cta":"So tell me. Do you count screen time, or what they do with it? Comment it.","src":"New (no old script fit): opinion / bet take","kind":"new","notes":"","fillins":"","format":"Personal take"}}]},{"date":"2026-10-28","dow":"Wed","kubot":{"format":"Robot on the Street","title":"Kubot: Robot on the Street","sub":"Would you rather your kid use robots or build them?","hook":"Would you rather your kid use robots or build them?","badge":"","needs":false,"film":[{"what":"Robot on the Street","short":"Robot on the Street","note":"Film today or earlier. Main question: Would you rather your kid use robots or build them?"}],"sections":[["Plan","rows",[["Series","Robot on the Street: the robot holds the mic and asks people one short question each."],["Main question","Would you rather your kid use robots or build them?"],["Twist ending","Gabriel steps in at the end: \"Robots don't teach here. Kids build them.\""],["Goal","5 to 6 good answers, a split reaction, then the twist. 30 to 45 seconds."],["When to film","Today or earlier."]]],["Questions","list",["Would you let a robot teach your kid?","Would you rather your kid use robots or build them?","What should kids learn that school doesn't teach?","Would your kid rather have an iPad or build a robot?","Are you scared of AI for your kids?","What did you build as a kid?","If a robot could help with one thing at home, what would it be?","Should kids learn to code or learn to build first?"]],["Shots","list",["Opener: the robot turns to someone, mic up","Opener line: \"Quick question from a robot. Got 5 seconds?\"","Each answer: tight on the person, robot mic in frame","Reactions: people laughing, pointing, filming the robot","Wide establishing shot of the spot","Gabriel walking in for the twist, then the line to camera"]],["Where","text","[pick the spot]. Public sidewalks or a park. Ask before filming on private property. Robot at the edge of the walkway, not blocking it."],["Checklist","check",["Pick the spot and time","Charge the robot and the mic","Print releases and bring pens","Quick release from every face used, a parent's for kids","Never mock anyone's answer","Get 5 to 6 usable answers","Film Gabriel's twist line","Cut to 30 to 45 seconds with subtitles","No prices, no pitch"]]],"s":{"hooks":["Would you rather your kid use robots or build them?","We asked Miami: would you rather your kid use robots or build them?","A robot asked strangers one question, and the answers get more honest","People had opinions. Fast.","Quick question from a robot. Got 5 seconds?"],"body":"ROBOT: Quick question from a robot. Got 5 seconds?\nROBOT: Would you rather your kid use robots or build them?\n[answer 1, word for word]\n[answer 2]\n[answer 3, the one that surprised you]\n[answer 4]\n[answer 5, a kid if there's a signed parent release]\n[B-ROLL: reactions, people filming the robot]\n[the split: who said yes, who said no, in one line]\nGABRIEL (to camera): Robots don't teach here. Kids build them.","cta":"What would you answer? Comment it. Waitlist link in bio.","src":"Plan v2 Robot on the Street format + content.py question list (structure reused; answers are real only)","kind":"adapted","notes":"Unscripted. Quick release from every face, a parent's for kids. Never mock an answer.","fillins":"","format":""}},"personal":[{"time":"9:30 AM","label":"Trial Reel","desc":"Quote reel shown to non-followers","has":true,"title":"The first time I got paid for something I made","s":{"hooks":["the first dollar hits different","I still remember the first time someone paid me for something I made.","[age]. My first real customer. And I almost didn't ask.","The first payment is never about the money.","Nobody tells you the first sale feels like this."],"body":"(1 HOOK)\nI wanted [the first thing you sold or got paid for, e.g. a car detail, a first client].\nAnd [why it felt impossible, e.g. no one knew you].\n\n(2 RISING ACTION)\nEveryone remembers their first paycheck.\nI think your first sale matters more than your first million.\n[B-ROLL: photos from that time, the tools you used]\nSo I [first real action].\nThen [second real action].\n[one honest line on how unprepared you were].\n\n(3 SECOND CONFLICT)\n[the moment it almost fell through]\n[how it felt, one line].\n\n(4 CLIMAX) [MUSIC: beat drop]\nThen [the moment they said yes].\n[B-ROLL: that exact moment, slowed down]\n\n(5 RESOLUTION)\nIt was never about the money. It was proof.\nAnd once you know someone will pay for what you make, you never look at your skills the same way again.","cta":"Comment the first thing you ever got paid for.","src":"New (no old script fit): his 5-step story format","kind":"new","notes":"Every [bracket] is yours to fill with something that really happened. If there's no real version, skip this one.","fillins":"","format":"5-step story (v2)"}},{"time":"1:30 PM","label":"Follower Farming","desc":"Identity list, 25 to 35s","has":true,"title":"How you spend a layover tells me how ambitious you are","s":{"hooks":["your layover exposes you","How you spend a layover tells me how ambitious you are.","Four hours in an airport. What are you doing?","Layover people are a different breed.","Airport behavior tells me everything."],"body":"ON-SCREEN: a \"ambition meter\" fills with each point (on screen, not spoken).\n\nHow you spend a layover tells me how ambitious you are.\n1. Sleeping across three chairs. Honestly valid. [METER 10%]\n2. Airport bar at 9 AM. On vacation since security. [METER 20%]\n3. Laptop out at the gate, to turn dead time into the most productive four hours of your week. [METER 35%]\n4. Walking every terminal for steps. [METER 50%]\n5. Reading an actual book. [METER 60%]\n6. Calling the people you never have time for, to use the wait for the stuff that matters. [METER 75%]\n7. Upgrading to the lounge with points you planned a year ago. [METER 90%]\n8. And talking to the stranger next to you, because half the best opportunities start with a random conversation. [METER 100%]","cta":"Tag the friend who's stuck at 10%.","src":"New (no old script fit): identity list with a meter","kind":"new","notes":"","fillins":"","format":"Follower farm list"}},{"time":"6:00 PM","label":"My Take","desc":"Personal bet take, 55 to 65s","has":true,"title":"Would you rather quit your job or build on the side? The answer gets less obvious","s":{"hooks":["Would you rather quit your job or keep it and build at night?","quit or keep the job?","Quitting isn't the flex. Staying alive long enough to win is.","Burn the boats or build on the side? Hear me out.","Most people pick option one. I think they're wrong."],"body":"Would you rather quit your job or keep it and build at night?\nHear me out.\nOption one. The\nburn-the-boats,\ntwo-weeks-notice,\nall-in-on-day-one\nfounder,\nwho has to win before rent is due.\nOR the\nboring-paycheck,\nbuild-after-work,\nstill-standing-next-year\nfounder,\nwho nobody claps for yet.\nMost people pick option one.\nI think for most people, that's the wrong answer.\nQuitting isn't the flex.\nStaying alive long enough to win is.\nEvery time I switched ventures, it came down to [how you decided when to end one venture and start the next].\nLike when [the moment you knew it was time to move on from one venture to the next].\nI didn't jump until [what had to be true before you jumped].\nSo be honest. Type one or type two?\nAnd whichever you pick, pick the one that keeps you in the game long enough to find out you were right.","cta":"Type one or type two? Comment it.","src":"Denis Content Scripts sheet #3 (reused)","kind":"reused","notes":"Source idea: built to six figure months, still wishes he hadn't quit; now keeping a salary AND building. Do not mention his numbers on camera, they aren't yours.\nDebatable line: \"for most people, that's the wrong answer\" (option one).\nUses the BASED would-you-rather stacked-hyphen rhythm. Pause on \"OR\".\nThe hook says \"build at night\" (from the digest). That's the viewer's situation, not yours. You said late-night framing isn't true for you, so don't add any \"I built at 2am\" lines.\nIf your own answer was actually option one, flip the debatable line to match. Keep it honest.\n~40-50s.","fillins":"- [how you decided when to end one venture and start the next]\n- [the moment you knew it was time to move on: which venture, what happened]\n- [what had to be true before you jumped]","format":"Would-you-rather"}}]},{"date":"2026-10-29","dow":"Thu","kubot":{"format":"Why Build","title":"Kubot: Why Build","sub":"#18 How to praise a build","hook":"stop saying good job","badge":"","needs":false,"film":[],"sections":[["Plan","rows",[["Show","Why Build? with Gabriel. Gabriel to camera, 45 to 75 seconds."],["Episode","#18 How to praise a build"],["Status","Script ready."]]],["Inspo","rows",[["Text hook","stop saying good job"],["On screen","\"praise how they think\" / \"tonight: how did you figure that out?\""],["Optional real moment","Only if it's true, in Gabriel's own words, after \"Now watch them.\" Never required."]]],["Caption","rows",[["Caption","\"Good job\" ends the conversation. \"How did you figure that out?\" starts one. Try it tonight and tell me what they said 👇"],["Spanish line","No digas \"muy bien.\" Pregunta cómo lo resolvió."]]],["Shots","list",["Gabriel to camera, clean audio","B-roll: A kid walking a parent through their build (Friday class footage)","On-screen text: \"praise how they think\" / \"tonight: how did you figure that out?\""]],["Where","text","Studio. Filmed on Sunday studio day."],["Checklist","check",["Film on Sunday studio day","Cut to 45 to 75 seconds","Add on-screen text and subtitles","English caption, Spanish line","No prices, no pitch","Post on Kubot","Reply to comments in the first hour"]]],"s":{"hooks":["stop saying good job","Never say \"good job\" to a kid who built something.","\"Good job\" is where the conversation ends.","Praise how they think, not what they made.","Try this instead of \"good job\" tonight."],"body":"Never say \"good job\" to a kid who built something.\nI know.\nIt sounds harsh.\n\"Good job\" is nice.\nIt's also where the conversation ends.\nThey smile.\nYou move on.\nAnd the thinking they just did disappears.\nTry this instead.\n\"How did you figure that out?\"\nNow watch them.\nThe kid who points at every piece.\nThe kid who walks you through the part that broke.\nHere's why it works.\n\"Good job\" praises the robot.\n\"How did you figure that out?\" praises how they think.\nAnd how they think is the part they keep for the next build.\nTonight, skip \"good job.\"\nAsk how they figured it out.\nThen wait.\nWhat does your kid say when you ask?","cta":"What does your kid say when you ask? Waitlist link in bio.","src":"why-build-scripts.md #18 (reused as is)","kind":"reused","notes":"Gabriel's script, already filmed or filming on Sunday studio day.","fillins":"","format":""}},"personal":[{"time":"9:30 AM","label":"Trial Reel","desc":"Quote reel shown to non-followers","has":true,"title":"Scrolling is not a group activity","s":{"hooks":["you're not talking to a crowd","Scrolling is not a group activity.","The best content talks to one person.","Stop saying 'hey guys'.","Nobody watches a reel with their friends."],"body":"Scrolling is not a group activity.\nThink about it.\nNobody watches a reel with ten friends.\nIt's you, alone, on your phone.\nSo why do most people talk to the camera like it's a stadium?\nHonestly? \"Hey guys\" is the fastest way to lose me.\nTalk to one person.\nUse \"you\", not \"everyone\".\nSay it like you'd say it to your boy across the table.\nThat's the whole trick.\nAnd the moment you stop performing for a crowd is the moment one person actually listens.","cta":"Send this to the friend who still says 'hey guys'.","src":"New (no old script fit): name-the-law / insight reel","kind":"new","notes":"Straight from his tone rule: 'Scrolling reels is not a group activity.' Talking head, one take.","fillins":"","format":"Insight reel"}},{"time":"1:30 PM","label":"Follower Farming","desc":"Identity list, 25 to 35s","has":true,"title":"10/10 male mindsets but it gets increasingly more niche","s":{"hooks":["10/10 male mindsets but it gets increasingly more niche","mindsets (niche edition)","If you already do three of these mindsets, you're ahead of most people your age","8 mindsets that quietly change everything, and the last one is the hardest","Most people stop at number 3. Number 8 is the one that matters."],"body":"1. Realizing nobody is coming to save you\n2. Cutting people off without guilt\n3. Understanding that being busy and being productive to most people look the same but couldn't be more different\n4. Treating your body like it's irreplaceable\n5. Accepting that real growth happens in silence\n6. Choosing boredom over doom scrolling to protect the one asset nobody talks about which is your attention span\n7. Letting go of who people expect you to be\n8. And getting honest with yourself about the things you keep avoiding, and treating them as the clearest sign of where your life needs to change","cta":"No spoken CTA. Let the And line land. Caption: comment the one you already do.","src":"Style library (Claude export): 10/10 male mindsets","kind":"adapted","notes":"One of his three early outperformers. Posted before, so treat it as a v2 repost: refresh 1 or 2 points. For wider reach you can drop 'male' from the title (he noticed a 6.5M list that never said it). Each point gets a 1 to 4 word on-screen label.","fillins":"","format":""}},{"time":"6:00 PM","label":"My Take","desc":"Personal bet take, 55 to 65s","has":true,"title":"AI won't replace you. Someone who builds with it might.","s":{"hooks":["AI won't take your job","AI won't take your job. Someone using it might.","The people who should worry about AI aren't who you think.","Everyone's scared of AI. Here's who should actually be.","Stop asking if AI will replace you."],"body":"Everyone keeps asking if AI is going to take their job.\nWrong question.\nHear me out.\nAI isn't walking into your office.\nSomeone who knows how to build with it is.\nThe same person, same job, but they do in one hour what takes you a day.\nHonestly? That's not scary. That's an invitation.\nI ran an AI automation agency. [one real line on what you saw].\nThe people who leaned in got faster.\nThe people who waited got nervous.\nAnd the gap between those two groups is getting bigger every month.","cta":"So tell me. Are you learning it, or waiting? Comment it.","src":"New (no old script fit): opinion / bet take","kind":"new","notes":"","fillins":"","format":"Personal take"}}]},{"date":"2026-10-30","dow":"Fri","kubot":{"format":"Denis Builds","title":"Kubot: Denis Builds","sub":"One month until the doors open","hook":"One month until the doors open","badge":"Hero shoot 3:30 to 5 PM, Bal Harbour","needs":false,"film":[{"what":"Kubot class, 3:30 to 5 PM, Bal Harbour","note":"Hero shoot. Film testimonials and b-roll. Gabriel teaches, Denis films.","sections":[["Capture list","list",["Door: signed parent photo and video release before any face is used","Wide of the room before kids arrive","Hands on CyberBricks and 3D printed parts (vertical and horizontal)","Gabriel teaching: hands, face, parts, kids reacting","A build failing, then a kid fixing it","The first time a robot moves, plus the kid's face","Wide room shots once it's full","Pickup: a kid showing the build to a parent","Parent answer at pickup (release-cleared only): \"What did you notice in your kid today?\" Get 2 to 3 clean answers for Saturday"]],["Rules","text","No scripted kid interviews. No prices, no pitch. First names only, no school names. After class, confirm which faces are release-cleared before the edit."]],"short":"Class 3:30 to 5 PM, Bal Harbour"}],"sections":[["Plan","rows",[["Series","Denis Builds: Denis on camera, building in public."],["Episode","What got done at the store this week, what broke, what's next."],["When to film","Any time this week."]]],["Shots","list",["Denis to camera at the store","B-roll: [what got done]","Close-up: [one detail]"]],["Where","text","[where you're filming]"],["Checklist","check",["Film during the week","Cut to 30 to 45 seconds","No prices, no pitch","Post on Kubot"]]],"s":{"hooks":["One month until the doors open","one month out","30 days to open a robot store. Here's where we are.","One month left. Here's what's done.","The store opens in a month."],"body":"One month until the doors open.\n[B-ROLL: the store today]\nWhat got done: [what got done this week].\nWhat broke: [what broke, one honest line].\nWhat's next: [what's next before December 1st].\n[B-ROLL: one detail close up]\nMost founders only post the wins.\nAnd I think the broken part is the part worth watching.","cta":"Follow along to see if we get the doors open. Waitlist link in bio.","src":"Store build update format (content.py, hub posts.json Oct 30) with a new weekly angle","kind":"adapted","notes":"Real progress only. No prices, no lease or money details.","fillins":"","format":""}},"personal":[{"time":"9:30 AM","label":"Trial Reel","desc":"Quote reel shown to non-followers","has":true,"title":"Trees look like brains","s":{"hooks":["nobody notices this about trees","Have you ever noticed a tree looks like a brain?","A tree can only grow as high as its roots go deep.","Nobody sees the roots. Everybody sees the branches.","Grow the roots first."],"body":"Have you ever noticed a tree looks like a brain?\nThe branches look like neurons. The roots look like the branches, just flipped underground. Then you see the same shape in your lungs, your veins, and rivers from above.\nScience says it's because branching is the most efficient way to move things around: water, air, blood, signals. I think it goes deeper. Something that perfect, repeated everywhere, feels designed.\nBut here's what got me. A tree can only grow as high as its roots go deep. Nobody sees the roots. Everybody sees the branches.\nSame with people. The gym at 6 AM, the work nobody claps for, the stuff you build before anyone's watching. That's the roots. Everything people see later is just the branches.\nGrow the roots first.","cta":"No spoken CTA. Caption: what are your roots right now? Comment it.","src":"Style library: Trees look like brains (approved Oct 5)","kind":"reused","notes":"He replied 'I love this script.' Text hook he picked: nobody notices this about trees.","fillins":"","format":""}},{"time":"1:30 PM","label":"Follower Farming","desc":"Identity list, 25 to 35s","has":true,"title":"Your Friday night tells me how serious you are (builder edition)","s":{"hooks":["Your Friday night tells me exactly how serious you are. Builder edition.","your Friday night exposes you","Where does your Friday night land on the serious meter?","Leaving the party early because you've got something to build","Your Friday night tells me how serious you are (builder edition)"],"body":"ON-SCREEN: a \"serious meter\" that fills with each point (shown on screen, not spoken).\n\nYour Friday night tells me exactly how serious you are. Builder edition.\n1. Couch, takeout, and a show you've already seen twice. You earned it. [METER 10%]\n2. Out every single Friday, no matter what. Fun, but your goals are on read. [METER 20%]\n3. Gym on Friday night, to have the whole place to yourself while everyone else is out. [METER 35%]\n4. Dinner with the friends who actually push you. [METER 50%]\n5. Watching business YouTube \"for research.\" [METER 60%]\n6. Planning next week on Friday, to walk into Monday already knowing what a win looks like. [METER 75%]\n7. Leaving the party early because you've got something to build in the morning. [METER 90%]\n8. And enjoying your Friday night without a drop of guilt, because you already did the work all week. [METER 100%]\nTag the friend who's stuck at 10%.","cta":"Tag the friend who's stuck at 10%.","src":"Denis Content Scripts sheet #17 (reused; it was planned for an earlier date)","kind":"reused","notes":"Originally planned for 1:30 PM Follower farm list (IG #22)\nPosts on a Friday, so the topic is the day itself: viewers check where their own night lands. Same meter mechanic as #14 (gym split) but a different identity, so space it from #14 visually (different meter color or label).\nDescribe the viewer, don't prescribe. Point 1 is the agreeable \"you earned it.\" Debatable lines at 2 (goals on read) and 7 (leaving the party early). Keep it positive; going out isn't the villain, and 8 makes that the payoff.\nLines 3 and 6 carry the outcome. 8 starts with And.\nOn-screen labels: Couch / Out every week / Empty gym / Right friends / \"Research\" / Monday plan / Leaves early / No guilt.\nNo Kubot mention. Pure growth.\n~25-30s.","fillins":"None (no personal details).","format":"Follower farm list (identity, progressive meter)"}},{"time":"6:00 PM","label":"My Take","desc":"Personal bet take, 55 to 65s","has":true,"title":"3D printers are the new home computer","s":{"hooks":["3D printers are the new PC","In 10 years, 3D printers will be as normal as laptops.","I think every home will have one of these.","People laughed at home computers too.","My bet on 3D printing"],"body":"I think 3D printers are going to be the new home computer.\nPeople laughed at home computers too.\nToo expensive.\nToo complicated.\nWho even needs one?\nNow there's one in every pocket.\nMost people see a 3D printer and think, cool toy.\nI see something else.\nA kid who can print a part they designed doesn't wait for someone to sell it to them.\nSo yeah, I know how it looks. I'm 21, and I'm surrounded by printers every week.\nMy bet is the kids who learn to print now will think about objects the way we think about apps.\nAnd I'd rather they learn it early than catch up later.","cta":"So tell me. Toy, or the next home computer? Comment it.","src":"New (no old script fit): opinion / bet take","kind":"new","notes":"","fillins":"","format":"Personal take"}}]},{"date":"2026-10-31","dow":"Sat","kubot":{"format":"Testimonial","title":"Kubot: Testimonial","sub":"From Fri Oct 30 class","hook":"I asked a [mom or dad] what changed in [her or his] [son or daughter]","badge":"","needs":false,"film":[],"sections":[["Plan","rows",[["Series","Testimonial: a kid at pickup showing their parent what they built, then one honest sentence from the parent. Unscripted, never staged."],["Source","Footage from the Fri Oct 30 class (Bal Harbour)."],["Hook options","\"Watch [his or her] face when [he or she] shows [mom or dad]\" or \"I asked a [mom or dad] what changed in [her or his] [son or daughter]\". Use the real kid and parent."],["Who","[parent first name] and [kid first name]. First names only."],["Goal","One honest answer a parent watching can relate to. 25 to 35 seconds."]]],["Questions","list",["What did you notice in your kid today?","What did [kid] tell you about the build on the way out?","What is something [kid] built that surprised you?","How does [kid] talk about building now?","In one sentence, what did building give [kid]?"]],["Shots","list",["Kid running up with the build","Kid explaining it to the parent","Parent's face as the robot moves","The parent's one sentence","Close-up of the build in the kid's hands"]],["Where","text","Bal Harbour class footage from Friday."],["Checklist","check",["Pick the pickup moment from Friday's footage","Confirm the signed release for kid and parent","First names only, no school names","Cut to 25 to 35 seconds with subtitles","No prices, no pitch","Post on Kubot"]]],"s":{"hooks":["I asked a [mom or dad] what changed in [her or his] [son or daughter]","One question at pickup.","They walked in with a pile of parts.","No script. Just pickup.","Watch [his or her] face when the robot moves."],"body":"[B-ROLL: kid running up to the parent with the build]\nKID: [what the kid says about the build, word for word]\n[B-ROLL: the robot moving, the parent's face]\nPARENT (answering \"What did you notice in your kid today?\"): [the parent's answer, word for word]\n[B-ROLL: close up of the build in the kid's hands]\nON-SCREEN: [parent's first name] and [kid's first name], after the Fri Oct 30 class.","cta":"What did your kid build first? Comment it. Or send us their drawing.","src":"Plan v2 Real Families + kubot-details.json hook options + hub posts.json pickup posts (structure reused; words are real only)","kind":"adapted","notes":"Never staged or scripted. Signed release for kid and parent, first names only, no schools.","fillins":"","format":""}},"personal":[{"time":"9:30 AM","label":"Trial Reel","desc":"Quote reel shown to non-followers","has":true,"title":"The hardest no I ever heard","s":{"hooks":["the no that changed everything","[age]. I asked for [what you asked for]. They said no.","The hardest no I ever heard ended up being the best thing that happened.","Nobody talks about the no's.","One no almost made me quit."],"body":"(1 HOOK)\nI wanted [what you were trying to get, e.g. a deal, a partner, a client].\nAnd [why it mattered so much].\n\n(2 RISING ACTION)\nNobody likes hearing no.\nHonestly? A no is just information with bad manners.\n[B-ROLL: the place, the messages, the work you put in]\nSo I [first real action].\nThen [second real action].\n[one honest line on how unprepared you were].\n\n(3 SECOND CONFLICT)\nThen [the no, word for word if you can].\n[how it felt, one line].\n\n(4 CLIMAX) [MUSIC: beat drop]\n[what you did after the no].\n[B-ROLL: that exact moment, slowed down]\n\n(5 RESOLUTION)\nThat no pointed me somewhere better.\nAnd the next no you hear might be the one that sends you to the right door.","cta":"Comment the no that ended up helping you.","src":"New (no old script fit): his 5-step story format","kind":"new","notes":"Every [bracket] is yours to fill with something that really happened. If there's no real version, skip this one.","fillins":"","format":"5-step story (v2)"}},{"time":"1:30 PM","label":"Follower Farming","desc":"Identity list, 25 to 35s","has":true,"title":"10/10 male skills but it gets increasingly more niche","s":{"hooks":["10/10 male skills but it gets increasingly more niche","skills (niche edition)","If you already do three of these skills, you're ahead of most people your age","8 skills that quietly change everything, and the last one is the hardest","Most people stop at number 3. Number 8 is the one that matters."],"body":"1. Cooking without a recipe\n2. Holding a conversation with anyone\n3. Basic car maintenance to never be stranded and helpless when something simple goes wrong\n4. Dressing well without overdoing it\n5. Public speaking without freezing\n6. Negotiating your salary to stop leaving money on the table out of politeness\n7. Basic first aid\n8. And knowing basic home repairs, like tightening doorknobs or hanging décor, to become fully self-sufficient in the small tasks most people ignore","cta":"No spoken CTA. The And line is the ending. Caption: which number are you? Comment it.","src":"Style library (Claude export): 10/10 male skills","kind":"adapted","notes":"One of his three early outperformers. Posted before, so treat it as a v2 repost: refresh 1 or 2 points. For wider reach you can drop 'male' from the title (he noticed a 6.5M list that never said it). Each point gets a 1 to 4 word on-screen label.","fillins":"","format":""}},{"time":"6:00 PM","label":"My Take","desc":"Personal bet take, 55 to 65s","has":true,"title":"The world needs more builders than influencers","s":{"hooks":["we need more builders","I'm a creator, and I think the world needs more builders than creators.","Unpopular opinion from someone who posts every day.","Everyone wants to be an influencer. Nobody wants to build.","The flex in 10 years won't be followers."],"body":"I post every day.\nAnd I think the world needs more builders than creators.\nHear me out.\nEveryone my age wants to be an influencer.\nAlmost nobody wants to build the thing you'd influence people about.\nContent is a megaphone.\nBut you still need something worth saying.\nHonestly? The best content I've ever made was about something I was actually building.\nFollowers come and go.\nThings you built stay.\nAnd in 10 years, I think the flex won't be how many people watch you.\nIt'll be what you made.","cta":"So tell me. Builder, or creator? Comment it.","src":"New (no old script fit): opinion / bet take","kind":"new","notes":"","fillins":"","format":"Personal take"}}]},{"date":"2026-11-01","dow":"Sun","kubot":{"format":"Podcast","title":"Kubot: Podcast","sub":"Ep. 3: The best parent questions from the comments","hook":"Parents asked. Gabriel answered.","badge":"Studio day","needs":false,"film":[{"what":"Why Build #1 Problem solving","short":"Why Build #1","note":"Posts Mon Nov 2.","ref":"2026-11-02"},{"what":"Why Build #4 Fine motor skills","short":"Why Build #4","note":"Posts Thu Nov 5.","ref":"2026-11-05"},{"what":"Podcast ep. 4","short":"Podcast ep. 4","note":"Posts Sun Nov 8.","ref":"2026-11-08"}],"sections":[["Plan","rows",[["Episode","Podcast ep. 3. Full episode on YouTube and Spotify, plus one clip on Kubot."],["Filmed","Last Sunday's studio day."]]],["Inspo","rows",[["Show","Founders podcast: weekly build in public episode, 30 to 45 minutes, Denis and Gabriel hosting. Cut into 5 to 8 short clips."],["This episode","[topic to pick]. Idea: the best comments and parent questions from the week."]]],["Shape","text","1. Cold open (1 to 2 min): Denis sets up [topic].\n2. Main conversation (15 to 20 min): [topic], with real classroom moments, not slogans.\n3. Week in the build (3 to 5 min): what got done at the store, what broke, what's next.\n4. Kid of the week (optional): a Friday kid explains their robot, with a parent on mic. Only if release-cleared.\n5. What to try tonight (5 min): one tip for parents.\n6. Close (2 min): tease next week."],["Questions","list",["[the best parent question from this week's comments]","[the second best parent question]","What broke this week, and what's next before the store opens?","If a parent has 20 minutes tonight, what should they try?"]],["Shots","list",["Wide two-shot, plus a single on each host","Print farm and robots visible behind","Clip targets: one Gabriel line that stands alone, one parent tip for tonight"]],["Where","text","Studio. Audio: the podcast mics, test recording first."],["Checklist","check",["Upload the full episode to YouTube and Spotify","Cut one clip for Kubot","Mark 5 to 8 clips for later","No prices, no pitch","Reply to comments in the first hour"]]],"s":{"hooks":["Parents asked. Gabriel answered.","Your questions, answered by someone who's taught kids for 10 years","The question parents ask the most","We read every comment. Here are the best questions.","Gabriel answers the comments"],"body":"DENIS (cold open): Every week parents leave questions under our videos. So this week, Gabriel answers them.\nDENIS: First one. [the best parent question from the comments]\nGABRIEL: [his answer]\nDENIS: [the second best question]\nGABRIEL: [his answer]\nDENIS: Store update. [what got done, what broke, what's next]\nCLIP FOR KUBOT: [the best answer, under 45 seconds]","cta":"Full episode on YouTube and Spotify. What should we ask Gabriel next? Waitlist link in bio.","src":"Plan v2 podcast segments + parent questions (new episode plan)","kind":"new","notes":"Gabriel's answers are his, unscripted. Only the cold open and questions are written.","fillins":"","format":""}},"personal":[{"time":"9:30 AM","label":"Trial Reel","desc":"Quote reel shown to non-followers","has":true,"title":"You need to be lore-maxxing, but it gets more personal than it sounds","s":{"hooks":["\"You need to be lore-maxxing.\" At [age] I [the risk that started a chapter]. And [why it felt like a risk].","lore-maxxing","You need to be lore-maxxing, but it gets more personal than it sounds","Most people I know are collecting a resume, not a story.","Nobody wants to die with a story that isn't worth telling."],"body":"(1 HOOK)\n\"You need to be lore-maxxing.\"\nDan Koe posted that, and [one line on why it hit you].\nAt [age], I [the risk that started a chapter you actually lived, e.g. quit the safe path / started the agency / said yes to Kubot].\nAnd [why it felt like a risk at the time].\n\n(2 RISING ACTION)\n\"Taking risks.\"\nHonestly? Most people I know are collecting a resume, not a story.\n[B-ROLL: real footage or screenshots from that chapter]\nSo I [first real action toward it].\nThen [second real action].\n\"Failing miserably.\"\n[one honest line on a real fail from that chapter].\n\n(3 SECOND CONFLICT)\n\"Relentlessly strategizing and experimenting.\"\nThen [the midpoint setback, e.g. something that almost made you walk it back].\n[one honest line on the safer version of you pulling you back].\n\n(4 CLIMAX) [MUSIC: beat drop. Tip: use a song from one of your favorite movies]\nI didn't walk it back. [what you did instead].\n[the moment that chapter became real].\n[B-ROLL: that exact moment, slowed down]\n\n(5 RESOLUTION)\n[where that chapter left you, said plainly].\n\"Nobody wants to die with a story that isn't worth telling.\"\nI'm 21. I'm still writing mine.\nAnd the only way to get a story worth telling is to live one.","cta":"Comment the risk you're taking this year.","src":"Denis Content Scripts sheet #19 (reused; it was planned for an earlier date)","kind":"reused","notes":"Originally planned for 9:30 AM Trial Reel, quote reel (IG #23)\nDan Koe, @thedankoe on X, Oct 8, 2026. Quote reel: his whole post is read word for word, split across all five beats in order. Credit him in the caption.\nFull quote: \"You need to be lore-maxxing. Taking risks. Failing miserably. Relentlessly strategizing and experimenting. Nobody wants to die with a story that isn't worth telling.\"\nStory format v2 (5-step). The story is ONE real risk/chapter you already lived. Different from #11 (6-month commit), #13 (aiming an addiction), and #16 (picking something too big).\nDebatable line: \"Most people I know are collecting a resume, not a story.\"\nNo fake hardship. No late-night warehouse lines.\n~50-60s.","fillins":"- [one line on why the quote hit you]\n- [age] + [the risk that started a chapter you actually lived]: must be real and already done (not Kubot's opening)\n- [why it felt like a risk at the time]\n- [first real action] and [second real action]\n- [one honest line on a real fail from that chapter]\n- [the midpoint setback] + [the safer version of you pulling you back]\n- [what you did instead] + [the moment that chapter became real]\n- [where that chapter left you]\n- B-roll: real footage or screenshots from that chapter","format":"Quote reel (Trial Reel), 5-step story (v2)"}},{"time":"1:30 PM","label":"Follower Farming","desc":"Identity list, 25 to 35s","has":true,"title":"How you spend Sunday morning tells me if you're actually building (weekend edition)","s":{"hooks":["How you spend Sunday morning tells me if you're actually building. Weekend edition.","your Sunday morning exposes you","Builder meter, weekend edition","Two deep hours before lunch changes everything","Sunday morning is where builders get ahead."],"body":"ON-SCREEN: a \"builder meter\" that fills with each point (shown on screen, not spoken).\n\nHow you spend Sunday morning tells me if you're actually building. Weekend edition.\n1. Sleeping in until noon. You needed it. [METER 10%]\n2. Brunch plans locked by Thursday. Fun, but the week already owns you. [METER 20%]\n3. Gym first, to knock out the one thing you control before the day gets loud. [METER 35%]\n4. Coffee and a walk with no podcast. Just thinking. [METER 50%]\n5. Cleaning your desk like that's productivity. [METER 60%]\n6. Two deep hours on the one project that matters, to walk into Monday already ahead. [METER 75%]\n7. Saying no to a hang so you can finish something that actually moves the needle. [METER 90%]\n8. And enjoying your Sunday without a drop of guilt, because you already built something before lunch. [METER 100%]\nTag the friend who's stuck at 10%.","cta":"Tag the friend who's stuck at 10%.","src":"Denis Content Scripts sheet #23 (reused; it was planned for an earlier date)","kind":"reused","notes":"Originally planned for 1:30 PM Follower farm list (IG #24)\nPosts on a Sunday, so the topic is the morning itself. Same meter mechanic as #14/#17/#20 but a new identity (builder meter). Different from Friday night (#17) and notes app (#20).\nDescribe, don't prescribe. Point 1 agreeable. Debatable at 2 (brunch locked by Thursday) and 7 (saying no to a hang). Lines 3 and 6 carry outcome. 8 starts with And.\nOn-screen labels: Sleep in / Brunch locked / Gym first / Quiet walk / Desk clean / Two hours / Says no / No guilt.\nNo Kubot. Pure growth. Tag friend CTA.\n~25-35s.","fillins":"None (no personal details).","format":"Follower farm list (identity, progressive meter)"}},{"time":"6:00 PM","label":"My Take","desc":"Personal bet take, 55 to 65s","has":true,"title":"Your 20s are for collecting skills, not titles","s":{"hooks":["skills over titles","Your 20s are for collecting skills, not titles.","Stop chasing the title. Chase the skill.","Nobody cares about your title at 21.","The best career advice for your 20s"],"body":"Your 20s are for collecting skills, not titles.\nHear me out.\nA title is someone else deciding what you're worth.\nA skill is yours forever.\nAt 17, I was [what you did at 17].\nAt 18, [what came next].\nNone of those had impressive titles.\nEvery one of them taught me something I use today.\nHonestly? I'd take five random skills over one fancy title.\nBecause skills stack.\nAnd titles don't follow you out the door.","cta":"So tell me. What skill are you collecting right now? Comment it.","src":"New (no old script fit): opinion / bet take","kind":"new","notes":"","fillins":"","format":"Personal take"}}]},{"date":"2026-11-02","dow":"Mon","kubot":{"format":"Why Build","title":"Kubot: Why Build","sub":"#1 Problem solving","hook":"Kids who build think differently. Here's how","badge":"","needs":false,"film":[],"sections":[["Plan","rows",[["Show","Why Build? with Gabriel. Gabriel to camera, 45 to 75 seconds."],["Episode","#1 Problem solving"],["Status","Script drafted below. Gabriel to review before filming."]]],["Inspo","rows",[["Development point","Problem solving"],["Hook","Kids who build think differently. Here's how"],["Do this tonight","When they ask for help, ask \"what have you tried?\" first"]]],["Shots","list",["Gabriel to camera, clean audio","B-roll: [Friday class moment that shows the point]","On-screen text: [hook] / [tonight tip]"]],["Where","text","Studio. Filmed on Sunday studio day."],["Checklist","check",["Review the script with Gabriel","Film on Sunday studio day","Cut to 45 to 75 seconds","Add on-screen text and subtitles","No prices, no pitch","Post on Kubot"]]],"s":{"hooks":["Kids who build think differently. Here's how","kids who build think differently","The question I ask before I help any kid","\"What have you tried?\" changes everything.","Your kid doesn't need the answer. They need this question."],"body":"Kids who build think differently.\nHere's how.\nMost kids, when something goes wrong, look for an adult.\nThat's normal.\nHonestly, it's also the moment we usually take away the best part.\nThe kid who stares at the robot.\nThe kid who flips it over.\nThe kid who checks one wire, then the next.\nThat's problem solving.\nNot a worksheet.\nA loop.\nWhat's wrong? What could it be? Let me check.\nEvery build makes them run that loop again.\nAnd the more they run it, the faster they get.\nSo tonight, when they ask for help, ask one question first.\n\"What have you tried?\"\nThen listen.\nWhat did your kid say?","cta":"Tonight: when they ask for help, ask \"what have you tried?\" first. Tell me what they said in the comments. Waitlist link in bio.","src":"Plan v2 Why Build bank #1 (Problem solving): hook and tonight tip reused, new body","kind":"new","notes":"New body written from the plan v2 episode bank hook and 'do this tonight'. Concept-led, so no story from Gabriel is needed. Gabriel should adjust any line that isn't how he'd say it.","fillins":"","format":""}},"personal":[{"time":"9:30 AM","label":"Trial Reel","desc":"Quote reel shown to non-followers","has":true,"title":"The law of boring consistency","s":{"hooks":["consistency is boring. that's the point.","The secret everyone is looking for is the most boring thing you can do.","Talent is common. Boring consistency is rare.","Nobody wants to hear this, but it's the same thing every day.","The most boring habit wins."],"body":"The secret everyone's looking for is boring.\nIt's not a hack.\nIt's not a new app.\nIt's doing the same unimpressive thing every single day.\nHonestly? Most people don't fail because they're lazy.\nThey fail because they get bored.\nDay one feels exciting.\nDay forty feels like nothing.\nSame work.\nNo applause.\nThat's exactly where it starts working.\nThat's the law of boring consistency.\nThe results come right after it stops being fun.\nAnd whoever can stay bored the longest usually wins.","cta":"Comment the boring thing you're on day [X] of.","src":"New (no old script fit): name-the-law / insight reel","kind":"new","notes":"No stats. If you want a number on screen, use your own real streak only.","fillins":"","format":"Insight reel"}},{"time":"1:30 PM","label":"Follower Farming","desc":"Identity list, 25 to 35s","has":true,"title":"10/10 skills for the AI era but it gets increasingly more niche","s":{"hooks":["10/10 skills for the AI era but it gets increasingly more niche","skills for the AI era (niche edition)","If you already do three of these skills for the AI era, you're ahead of most people your age","8 skills for the AI era that quietly change everything, and the last one is the hardest","Most people stop at number 3. Number 8 is the one that matters."],"body":"1. Building networks of people who challenge you\n2. Writing clearly and concisely\n3. Using AI tools to get more done in one hour than most people do in a day\n4. Thinking critically when everyones panicking\n5. Making good decisions under pressure\n6. Learning how money works to stop living check to check and build generational wealth\n7. Creating content that builds your reputation while you sleep\n8. And learning to build with code or no-code tools so your income, your ideas, and your future stay fully in your hands","cta":"No spoken CTA. The And line ends it. Caption: send this to the friend who needs number 8.","src":"Style library (Claude export): 10/10 male skills (alt cut)","kind":"adapted","notes":"His AI-leaning rewrite; he later pulled it back toward the hobbies rhythm, so tighten lines 1, 2, 4 before filming. Posted before, so treat it as a v2 repost: refresh 1 or 2 points. For wider reach you can drop 'male' from the title (he noticed a 6.5M list that never said it). Each point gets a 1 to 4 word on-screen label.","fillins":"","format":""}},{"time":"6:00 PM","label":"My Take","desc":"Personal bet take, 55 to 65s","has":true,"title":"Physical things are the new flex in an AI world","s":{"hooks":["the new flex is physical","In an AI world, the flex is something you can hold.","AI can make anything on a screen. It can't make this.","When everything is digital, physical becomes rare.","Making real things is about to be rare."],"body":"AI can now make almost anything on a screen.\nImages.\nMusic.\nVideos.\nSo what happens to the stuff it can't make?\nIt gets rare.\nAnd rare things get valuable.\nHonestly? I think the next flex isn't digital at all.\nIt's something you can hold, that you made.\nThat's part of why I'm building a place where kids make real things.\nAnd I think in a world full of generated stuff, made by hand is going to mean more, not less.","cta":"So tell me. Digital or physical, which one's worth more in 10 years? Comment it.","src":"New (no old script fit): opinion / bet take","kind":"new","notes":"","fillins":"","format":"Personal take"}}]},{"date":"2026-11-03","dow":"Tue","kubot":{"format":"Denis Builds","title":"Kubot: Denis Builds","sub":"Your kid draws it, we print it","hook":"Your kid draws it, we print it","badge":"","needs":false,"film":[],"sections":[["Plan","rows",[["Series","Denis Builds: Denis on camera, building in public."],["Episode","Your kid draws it, we print it"],["When to film","Any time this week."]]],["Shots","list",["Parts laid out on the table, one slow pan","Build timelapse from a fixed angle","The first time it works, one take","Close-up of [the best detail]"]],["Where","text","[where you build]"],["Checklist","check",["Film while you build","Cut to 30 to 45 seconds","No prices, no pitch","Post on Kubot"]]],"s":{"hooks":["Your kid draws it, we print it","A kid drew a robot. We printed it.","Send us your kid's drawing.","From a crayon drawing to a real part","We turned a kid's drawing into a real robot part."],"body":"A kid drew this.\n[B-ROLL: the drawing, held up to camera]\nWe're going to try to print it.\nStep one. Turn the drawing into a 3D model.\n[how you modeled it, one honest line]\nStep two. Print it.\n[print time, real]\nStep three. Does it look like the drawing?\n[B-ROLL: drawing next to the print]\n[your honest reaction]\nAnd the best part is showing it to the kid who drew it.","cta":"Send us your kid's drawing. We might print it next. Waitlist link in bio.","src":"Plan v2 support content 'your kid draws it, we print it' + approved soft CTA (new script)","kind":"new","notes":"Only use a drawing from a family who said yes. First name only, signed release if the kid is on camera.","fillins":"","format":""}},"personal":[{"time":"9:30 AM","label":"Trial Reel","desc":"Quote reel shown to non-followers","has":true,"title":"What I'd tell myself at 17","s":{"hooks":["what I'd tell 17 year old me","At 17, I was [what you were doing at 17]. Here's what I wish I knew.","17 year old me would not believe this.","If I could go back to 17, I'd say one thing.","I was 17 and I had no plan."],"body":"(1 HOOK)\nI wanted [what you wanted at 17].\nAnd [what was in the way].\n\n(2 RISING ACTION)\nEveryone has something they'd tell their younger self.\nHonestly? I wouldn't tell him to do anything differently.\n[B-ROLL: a real photo of you at 17, the job you had]\nSo I [first real action].\nThen [second real action].\n[one honest line on how unprepared you were].\n\n(3 SECOND CONFLICT)\n[the moment at 17 or 18 you felt most lost]\n[how it felt, one line].\n\n(4 CLIMAX) [MUSIC: beat drop]\n[the first thing that started to work, after 17].\n[B-ROLL: that exact moment, slowed down]\n\n(5 RESOLUTION)\nEvery random job was collecting something for later.\nAnd if you're 17 and lost right now, you're not behind. You're collecting.","cta":"Comment what you'd tell your 17 year old self.","src":"New (no old script fit): his 5-step story format","kind":"new","notes":"Every [bracket] is yours to fill with something that really happened. If there's no real version, skip this one.","fillins":"","format":"5-step story (v2)"}},{"time":"1:30 PM","label":"Follower Farming","desc":"Identity list, 25 to 35s","has":true,"title":"Your group chat tells me who you're becoming","s":{"hooks":["your group chat exposes you","Your group chat tells me who you're becoming.","Show me your group chat and I'll show you your future.","The group chat doesn't lie.","Where does your group chat land?"],"body":"ON-SCREEN: a \"growth meter\" fills with each point (on screen, not spoken).\n\nYour group chat tells me who you're becoming.\n1. Memes only. A safe space. [METER 10%]\n2. Planning a trip that has been 'happening' for three years. [METER 20%]\n3. Sending each other gym check ins, to make skipping more embarrassing than going. [METER 35%]\n4. Fantasy league trash talk. [METER 50%]\n5. Someone always sharing a business idea at 1 AM. [METER 60%]\n6. Celebrating each other's wins out loud, to make winning normal in your circle. [METER 75%]\n7. Splitting the chat into a 'serious' one. [METER 90%]\n8. And every guy in it is someone you'd call at 3 AM, because the people in your phone become your life. [METER 100%]","cta":"Send this to your group chat.","src":"New (no old script fit): identity list with a meter","kind":"new","notes":"","fillins":"","format":"Follower farm list"}},{"time":"6:00 PM","label":"My Take","desc":"Personal bet take, 55 to 65s","has":true,"title":"Portfolios are going to beat degrees","s":{"hooks":["show me what you made","Hiring is going to look at what you built, not where you studied.","Your portfolio is your new degree.","Nobody's going to ask where you went to school.","My bet on hiring in five years"],"body":"I think hiring is about to change.\nNot \"where did you go to school?\"\n\"Show me what you've built.\"\nHear me out.\nAI makes it easy to look qualified on paper.\nIt makes it really hard to fake a real project.\nA website you shipped.\nA video series you ran.\nA robot you built.\nHonestly? That's already how I'd hire.\nAnd I think the kids building things now are writing a resume nobody can fake.","cta":"So tell me. Degree, or portfolio? Comment it.","src":"New (no old script fit): opinion / bet take","kind":"new","notes":"","fillins":"","format":"Personal take"}}]},{"date":"2026-11-04","dow":"Wed","kubot":{"format":"Robot on the Street","title":"Kubot: Robot on the Street","sub":"What should kids learn that school doesn't teach?","hook":"What should kids learn that school doesn't teach?","badge":"","needs":false,"film":[{"what":"Robot on the Street","short":"Robot on the Street","note":"Film today or earlier. Main question: What should kids learn that school doesn't teach?"}],"sections":[["Plan","rows",[["Series","Robot on the Street: the robot holds the mic and asks people one short question each."],["Main question","What should kids learn that school doesn't teach?"],["Twist ending","Gabriel steps in at the end: \"Robots don't teach here. Kids build them.\""],["Goal","5 to 6 good answers, a split reaction, then the twist. 30 to 45 seconds."],["When to film","Today or earlier."]]],["Questions","list",["Would you let a robot teach your kid?","Would you rather your kid use robots or build them?","What should kids learn that school doesn't teach?","Would your kid rather have an iPad or build a robot?","Are you scared of AI for your kids?","What did you build as a kid?","If a robot could help with one thing at home, what would it be?","Should kids learn to code or learn to build first?"]],["Shots","list",["Opener: the robot turns to someone, mic up","Opener line: \"Quick question from a robot. Got 5 seconds?\"","Each answer: tight on the person, robot mic in frame","Reactions: people laughing, pointing, filming the robot","Wide establishing shot of the spot","Gabriel walking in for the twist, then the line to camera"]],["Where","text","[pick the spot]. Public sidewalks or a park. Ask before filming on private property. Robot at the edge of the walkway, not blocking it."],["Checklist","check",["Pick the spot and time","Charge the robot and the mic","Print releases and bring pens","Quick release from every face used, a parent's for kids","Never mock anyone's answer","Get 5 to 6 usable answers","Film Gabriel's twist line","Cut to 30 to 45 seconds with subtitles","No prices, no pitch"]]],"s":{"hooks":["What should kids learn that school doesn't teach?","We asked Miami: what should kids learn that school doesn't teach?","A robot asked strangers one question, and the answers get more honest","People had opinions. Fast.","Quick question from a robot. Got 5 seconds?"],"body":"ROBOT: Quick question from a robot. Got 5 seconds?\nROBOT: What should kids learn that school doesn't teach?\n[answer 1, word for word]\n[answer 2]\n[answer 3, the one that surprised you]\n[answer 4]\n[answer 5, a kid if there's a signed parent release]\n[B-ROLL: reactions, people filming the robot]\n[the split: who said yes, who said no, in one line]\nGABRIEL (to camera): Robots don't teach here. Kids build them.","cta":"What would you answer? Comment it. Waitlist link in bio.","src":"Plan v2 Robot on the Street format + content.py question list (structure reused; answers are real only)","kind":"adapted","notes":"Unscripted. Quick release from every face, a parent's for kids. Never mock an answer.","fillins":"","format":""}},"personal":[{"time":"9:30 AM","label":"Trial Reel","desc":"Quote reel shown to non-followers","has":true,"title":"I want to build something real","s":{"hooks":["I do not want more followers. I want to build something real.","Everything I've built so far lives on a screen.","What actually made me happy as a kid was never a screen.","A kid walks in with nothing and walks out holding a robot they built.","Our whole lives turned into a glass rectangle."],"body":"I do not want more followers.\nI want to build something real.\nBut to build something real, I need more followers.\nEverything I have built so far lives on a screen.\nNone of it is something I can hold in my hands.\nSomewhere along the way, our entire lives turned into this glass rectangle in your pocket.\nWhen I think about what actually made me happy as a kid, it was never a screen.\nIt was building Legos on my bedroom floor, racing toy cars, and biking outside until it got dark.\nPhysical stuff that felt real.\nSo I am building a physical place.\nA space where a kid walks in with nothing, and an hour later walks out holding a robot they built with their own hands.\nRight now it is [what the space looks like today].\nWe open December 1st.\nAnd I'm going to show you everything it takes to build a physical store when everyone my age is building online.","cta":"Follow along to see if we get the doors open.","src":"Style library: 100 in 100, Day 1 (Sep 25), adapted","kind":"adapted","notes":"Adapted: no 'Day X' hook (his rule), Halloween changed to December 1, follower number removed (his counts didn't match). Only post before Dec 1.","fillins":"","format":""}},{"time":"1:30 PM","label":"Follower Farming","desc":"Identity list, 25 to 35s","has":true,"title":"10/10 free skills but it gets increasingly more niche","s":{"hooks":["You can learn almost anything for free now. Most people just won't.","free skills (niche edition)","10/10 free skills but it gets increasingly more niche","Free skills nobody can gatekeep from you anymore","The best skills on this list cost nothing."],"body":"You can learn almost anything for free now. Most people just won't.\n10/10 free skills, but it gets increasingly more niche.\n1. Learning to cook from videos instead of ordering in\n2. Learning how to sell, because no school is ever going to teach you\n3. Basic video editing on your phone, to turn what you know into something people can actually see\n4. Talking to AI like it's your personal tutor\n5. Writing copy by studying the ads you already scroll past\n6. Building your first AI automation from free tutorials, to make one hour of work do the job of ten\n(That's how I got into it. [how you learned AI automation without a formal path, one line].)\n7. Cold messaging people way out of your league\n8. And learning how to learn, because once you can teach yourself one thing for free, nobody can ever gatekeep the next one from you","cta":"No spoken CTA, the And line ends it. Caption: save this for the next time you're bored.","src":"Denis Content Scripts sheet #5 (reused)","kind":"reused","notes":"Source idea: the greatest leverage window in history, learning is nearly free and your own mix of experiences is the edge.\nDebatable lines at 2 (\"no school is going to teach you\") and 7 (\"people way out of your league\").\nLines 3 and 6 carry the \"to [outcome]\". 8 starts with And.\nThe aside after 6 is optional, cut it if it breaks the rhythm. If you keep it, keep it under 3 seconds (like \"okay that one's just me\").\nOn-screen 1-4 word labels: Cooking / Selling / Editing / AI tutor / Copywriting / Automations / Cold DMs / Learning to learn.\n~30-40s.","fillins":"- [how you learned AI automation without a formal path, one line]","format":"10/10 progressively niche"}},{"time":"6:00 PM","label":"My Take","desc":"Personal bet take, 55 to 65s","has":true,"title":"Gen Z isn't lazy. We're bored.","s":{"hooks":["Gen Z isn't lazy","Everyone says my generation is lazy. I think we're bored.","Gen Z isn't lazy. Here's what's actually happening.","We're not lazy. Nobody gave us anything real to do.","The truth about Gen Z and work"],"body":"Everyone says my generation is lazy.\nI don't think we're lazy.\nI think we're bored.\nHear me out.\nGive someone my age a job that feels pointless, and they check out.\nGive them something real to build, and they'll lose sleep over it.\nI've seen it.\nSame people.\nDifferent problem.\nHonestly? I think boredom looks like laziness from the outside.\nAnd the fix isn't more pressure.\nIt's giving people something worth caring about.","cta":"So tell me. Lazy, or bored? Comment it.","src":"New (no old script fit): opinion / bet take","kind":"new","notes":"","fillins":"","format":"Personal take"}}]},{"date":"2026-11-05","dow":"Thu","kubot":{"format":"Why Build","title":"Kubot: Why Build","sub":"#4 Fine motor skills","hook":"Small parts, big brain","badge":"","needs":false,"film":[],"sections":[["Plan","rows",[["Show","Why Build? with Gabriel. Gabriel to camera, 45 to 75 seconds."],["Episode","#4 Fine motor skills"],["Status","Script drafted below. Gabriel to review before filming."]]],["Inspo","rows",[["Development point","Fine motor skills"],["Hook","Small parts, big brain"],["Do this tonight","Lego, beads or a screwdriver set; anything with tiny pieces"]]],["Shots","list",["Gabriel to camera, clean audio","B-roll: [Friday class moment that shows the point]","On-screen text: [hook] / [tonight tip]"]],["Where","text","Studio. Filmed on Sunday studio day."],["Checklist","check",["Review the script with Gabriel","Film on Sunday studio day","Cut to 45 to 75 seconds","Add on-screen text and subtitles","No prices, no pitch","Post on Kubot"]]],"s":{"hooks":["Small parts, big brain","Those tiny pieces are doing more than you think.","Why little hands need little parts","The most underrated toy is a screwdriver.","Every tiny screw is a brain workout."],"body":"Small parts, big brain.\nA lot of parents see tiny pieces and think, choking hazard, mess, lost under the couch.\nFair.\nBut those tiny pieces are doing something.\nThe kid who lines up a screw with a hole.\nThe kid who threads a wire through a gap smaller than their finger.\nThe kid who tries it five times and gets it on the sixth.\nThat's fine motor skill.\nThe same control they use to write, to tie shoes, to draw.\nA screen asks for a tap.\nA build asks for precision.\nTonight, give them something with tiny pieces.\nLego, beads, a screwdriver set.\nAnything they have to line up with their fingers.\nThen watch how focused they get.\nWhat's the smallest thing your kid can build with?","cta":"Tonight: Lego, beads or a screwdriver set, anything with tiny pieces. What did they make? Comment it. Waitlist link in bio.","src":"Plan v2 Why Build bank #4 (Fine motor skills): hook and tonight tip reused, new body","kind":"new","notes":"New body written from the plan v2 episode bank hook and 'do this tonight'. Concept-led, so no story from Gabriel is needed. Gabriel should adjust any line that isn't how he'd say it.","fillins":"","format":""}},"personal":[{"time":"9:30 AM","label":"Trial Reel","desc":"Quote reel shown to non-followers","has":true,"title":"Your environment is a script you didn't write","s":{"hooks":["your room is writing your habits","Your environment is a script you didn't write.","You don't have a discipline problem. You have a room problem.","Change the room before you change yourself.","Your phone on the nightstand is making decisions for you."],"body":"Your environment is a script you didn't write.\nThe phone on your nightstand.\nThe couch facing the TV.\nThe snacks at eye level.\nEvery one of those is a line in a script, and you're just reading it.\nHonestly? Most people don't have a discipline problem.\nThey have a room problem.\nSo rewrite it.\nPhone in another room.\nBook on the pillow.\nGym bag by the door.\nMake the good thing the easy thing.\nAnd watch how much \"discipline\" you suddenly have when the room is on your side.","cta":"Comment one thing you're moving tonight.","src":"New (no old script fit): name-the-law / insight reel","kind":"new","notes":"General idea, no study cited. Easy b-roll: your own desk and room.","fillins":"","format":"Insight reel"}},{"time":"1:30 PM","label":"Follower Farming","desc":"Identity list, 25 to 35s","has":true,"title":"10/10 male don’ts but it gets increasingly more niche","s":{"hooks":["10/10 male don’ts but it gets increasingly more niche","don'ts (niche edition)","If you already do three of these don'ts, you're ahead of most people your age","8 don'ts that quietly change everything, and the last one is the hardest","Most people stop at number 3. Number 8 is the one that matters."],"body":"1. Using your age as an excuse for not starting\n2. Blaming your parents for where you are\n3. Eating terribly like you’re metabolism is going to last forever to avoid waking up at 30 and overweight\n4. Getting really drunk and calling it a good time\n5. Spending money on wants before covering your needs\n6. Talking with filler words and cursing in every sentence to sound confident when it's actually doing the opposite\n7. Keeping your room, car, and clothes unorganized\n8. And waiting around for success to find you instead of finding it yourself because whatever you want someone else wants too","cta":"No spoken CTA. Let the And line land. Caption: comment the one you already do.","src":"Style library (Claude export): 10/10 male don'ts","kind":"adapted","notes":"Posted in the April batch. Posted before, so treat it as a v2 repost: refresh 1 or 2 points. For wider reach you can drop 'male' from the title (he noticed a 6.5M list that never said it). Each point gets a 1 to 4 word on-screen label.","fillins":"","format":""}},{"time":"6:00 PM","label":"My Take","desc":"Personal bet take, 55 to 65s","has":true,"title":"Build in public or build in silence?","s":{"hooks":["public or silent?","Should you build in public or in silence?","Everyone says move in silence. I post everything.","Moving in silence is overrated. Here's why.","I post my store build every week. Here's why."],"body":"Some people say move in silence.\nI post almost everything I'm building.\nHear me out.\nMoving in silence protects you from people judging you.\nIt also protects you from people helping you.\nEvery time I post what broke, someone in the comments knows how to fix it.\nHonestly? Silence is safer.\nPublic is faster.\nAnd I'd rather be judged and early than safe and alone.","cta":"So tell me. Public, or silent? Comment it.","src":"New (no old script fit): opinion / bet take","kind":"new","notes":"","fillins":"","format":"Personal take"}}]},{"date":"2026-11-06","dow":"Fri","kubot":{"format":"Denis Builds","title":"Kubot: Denis Builds","sub":"The first thing we built inside the store","hook":"The first thing we built inside the store","badge":"Hero shoot 3:30 to 5 PM, Bal Harbour","needs":false,"film":[{"what":"Kubot class, 3:30 to 5 PM, Bal Harbour","note":"Hero shoot. Film testimonials and b-roll. Gabriel teaches, Denis films.","sections":[["Capture list","list",["Door: signed parent photo and video release before any face is used","Wide of the room before kids arrive","Hands on CyberBricks and 3D printed parts (vertical and horizontal)","Gabriel teaching: hands, face, parts, kids reacting","A build failing, then a kid fixing it","The first time a robot moves, plus the kid's face","Wide room shots once it's full","Pickup: a kid showing the build to a parent","Parent answer at pickup (release-cleared only): \"What did you notice in your kid today?\" Get 2 to 3 clean answers for Saturday"]],["Rules","text","No scripted kid interviews. No prices, no pitch. First names only, no school names. After class, confirm which faces are release-cleared before the edit."]],"short":"Class 3:30 to 5 PM, Bal Harbour"}],"sections":[["Plan","rows",[["Series","Denis Builds: Denis on camera, building in public."],["Episode","What got done at the store this week, what broke, what's next."],["When to film","Any time this week."]]],["Shots","list",["Denis to camera at the store","B-roll: [what got done]","Close-up: [one detail]"]],["Where","text","[where you're filming]"],["Checklist","check",["Film during the week","Cut to 30 to 45 seconds","No prices, no pitch","Post on Kubot"]]],"s":{"hooks":["The first thing we built inside the store","the first thing inside","Here's the first thing that went into the store.","It finally doesn't look empty.","Week [X]: the first build inside"],"body":"The first thing we built inside the store.\n[B-ROLL: the store today]\nWhat got done: [what got done this week].\nWhat broke: [what broke, one honest line].\nWhat's next: [what's next before December 1st].\n[B-ROLL: one detail close up]\nMost founders only post the wins.\nAnd I think the broken part is the part worth watching.","cta":"Follow along to see if we get the doors open. Waitlist link in bio.","src":"Store build update format (content.py, hub posts.json Oct 30) with a new weekly angle","kind":"adapted","notes":"Real progress only. No prices, no lease or money details.","fillins":"","format":""}},"personal":[{"time":"9:30 AM","label":"Trial Reel","desc":"Quote reel shown to non-followers","has":true,"title":"Write more until you're not confused, but it gets more personal than a habit tip","s":{"hooks":["\"Write more. Write to think.\" I started writing when [the confused moment]. And [why you were stuck].","write until you're not confused","Write more until you're not confused, but it gets more personal than a habit tip","Most people think writing is for writers. It's not.","Write for the person you were 2 years ago."],"body":"(1 HOOK)\n\"Write more. Write to think.\"\nDan Koe posted that, and [one line on why it hit you].\nI started writing when [the confused moment you actually lived, e.g. you couldn't explain what you were building].\nAnd [why you were stuck].\n\n(2 RISING ACTION)\n\"Write until you're no longer confused.\"\nHonestly? Most people think writing is for writers. It's not. It's for people who are lost.\n[B-ROLL: real notes, drafts, Notion, voice-to-text from that time]\nSo I [first real writing habit you actually did].\nThen [second real action, e.g. posted one thing / wrote the offer / journaled the problem].\n\"Write about the problems you already solved.\"\n[one honest line on a problem you had already solved but never put into words].\n\n(3 SECOND CONFLICT)\n\"Write for the person you were 2 years ago.\"\nThen [the midpoint setback, e.g. you stopped, or nothing you wrote felt good enough].\n[one honest line on why you almost quit the habit].\n\n(4 CLIMAX) [MUSIC: beat drop. Tip: use a song from one of your favorite movies]\n\"Write so you never lose what took you years to figure out.\"\nI didn't quit. [what you did instead].\n[the moment writing actually clarified something for you].\n[B-ROLL: that exact moment, slowed down]\n\n(5 RESOLUTION)\n[what writing changed for you, said plainly].\n\"A simple writing habit can change absolutely everything.\"\nI'm 21. I still write so I don't lose what I just learned.\nAnd the clearest version of me only showed up after I put it on a page.","cta":"Comment one thing you'd write for yourself 2 years ago.","src":"Denis Content Scripts sheet #22 (reused; it was planned for an earlier date)","kind":"reused","notes":"Originally planned for 9:30 AM Trial Reel, quote reel (IG #24)\nDan Koe, @thedankoe on X, Oct 7, 2026. Quote reel: his whole post is read word for word, split across all five beats in order. Credit him in the caption.\nFull quote: \"Write more. Write to think. Write until you're no longer confused. Write about the problems you already solved. Write for the person you were 2 years ago. Write so you never lose what took you years to figure out. A simple writing habit can change absolutely everything.\"\nStory format v2 (5-step). The story is ONE real stretch where writing (notes, scripts, journals, offers) unstuck you. Different from lore-maxxing (#19), addiction (#13), and too-big challenge (#16).\nDebatable line: \"Most people think writing is for writers. It's not. It's for people who are lost.\"\nNo fake hardship. Keep personal details in bracke
