ts.\n~50-60s.","fillins":"- [one line on why the quote hit you]\n- [the confused moment you actually lived] + [why you were stuck]\n- [first real writing habit] and [second real action]: only what you actually did (notes, captions, journals, scripts, offers)\n- [a problem you had already solved but never put into words]\n- [the midpoint setback] + [why you almost quit the habit]\n- [what you did instead] + [the moment writing clarified something]\n- [what writing changed for you]\n- B-roll: real notes/drafts from that time","format":"Quote reel (Trial Reel), 5-step story (v2)"}},{"time":"1:30 PM","label":"Follower Farming","desc":"Identity list, 25 to 35s","has":true,"title":"Signs you're quietly becoming dangerous, but it gets increasingly more personal","s":{"hooks":["signs you're quietly becoming dangerous","Signs you're quietly becoming dangerous, but it gets increasingly more personal.","If three of these are you, people should be nervous.","You're quietly becoming dangerous if number 6 is you.","Nobody notices this happening until it's too late."],"body":"Signs you're quietly becoming dangerous, but it gets increasingly more personal.\n1. You stopped explaining your plans.\n2. You'd rather lose a friend than lose your focus.\n3. You enjoy your own company, to the point where being alone feels like a reset, not a punishment.\n4. You read more than you scroll.\n5. You can sit in silence.\n6. You track your progress in private, to compete with who you were, not who's watching.\n7. You don't celebrate every small win online.\n8. And you started keeping promises to yourself, because once you trust your own word, nothing can stop you.","cta":"Comment how many you got.","src":"New (no old script fit): identity list, hook from his library","kind":"new","notes":"Hook is one of his library alternates for the 'dangerously successful' list; the list itself is new.","fillins":"","format":"Follower farm list"}},{"time":"6:00 PM","label":"My Take","desc":"Personal bet take, 55 to 65s","has":true,"title":"Being young is the cheat code everyone ignores","s":{"hooks":["being young is a cheat code","Being young is the cheat code nobody uses.","Everyone says you're too young. That's the advantage.","21 isn't a weakness.","Why being young is the best time to take risks"],"body":"Everyone tells you you're too young.\nI think that's the cheat code.\nHear me out.\nWhen you're young, nobody expects anything.\nYou have time to fail.\nYou have energy most people would pay for.\nAnd when it works, people pay attention because of your age, not in spite of it.\nHonestly? The only real disadvantage is experience.\nSo borrow it.\nFind someone who has it.\nThat's what Gabriel is for me.\nAnd use the rest of the cheat code while you still have it.","cta":"So tell me. Too young, or exactly the right age? Comment it.","src":"New (no old script fit): opinion / bet take","kind":"new","notes":"","fillins":"","format":"Personal take"}}]},{"date":"2026-11-07","dow":"Sat","kubot":{"format":"Testimonial","title":"Kubot: Testimonial","sub":"From Fri Nov 6 class","hook":"They walked in with a pile of parts.","badge":"","needs":false,"film":[],"sections":[["Plan","rows",[["Series","Testimonial: a kid at pickup showing their parent what they built, then one honest sentence from the parent. Unscripted, never staged."],["Source","Footage from the Fri Nov 6 class (Bal Harbour)."],["Hook options","\"Watch [his or her] face when [he or she] shows [mom or dad]\" or \"I asked a [mom or dad] what changed in [her or his] [son or daughter]\". Use the real kid and parent."],["Who","[parent first name] and [kid first name]. First names only."],["Goal","One honest answer a parent watching can relate to. 25 to 35 seconds."]]],["Questions","list",["What did you notice in your kid today?","What did [kid] tell you about the build on the way out?","What is something [kid] built that surprised you?","How does [kid] talk about building now?","In one sentence, what did building give [kid]?"]],["Shots","list",["Kid running up with the build","Kid explaining it to the parent","Parent's face as the robot moves","The parent's one sentence","Close-up of the build in the kid's hands"]],["Where","text","Bal Harbour class footage from Friday."],["Checklist","check",["Pick the pickup moment from Friday's footage","Confirm the signed release for kid and parent","First names only, no school names","Cut to 25 to 35 seconds with subtitles","No prices, no pitch","Post on Kubot"]]],"s":{"hooks":["They walked in with a pile of parts.","Pieces in. Robot out.","Watch [his or her] face when [he or she] shows [mom or dad]","We asked a kid how their robot works.","This is what a Friday class looks like."],"body":"[B-ROLL: kid running up to the parent with the build]\nKID: [what the kid says about the build, word for word]\n[B-ROLL: the robot moving, the parent's face]\nPARENT (answering \"What did you notice in your kid today?\"): [the parent's answer, word for word]\n[B-ROLL: close up of the build in the kid's hands]\nON-SCREEN: [parent's first name] and [kid's first name], after the Fri Nov 6 class.","cta":"What did your kid build first? Comment it. Or send us their drawing.","src":"Plan v2 Real Families + kubot-details.json hook options + hub posts.json pickup posts (structure reused; words are real only)","kind":"adapted","notes":"Never staged or scripted. Signed release for kid and parent, first names only, no schools.","fillins":"","format":""}},"personal":[{"time":"9:30 AM","label":"Trial Reel","desc":"Quote reel shown to non-followers","has":true,"title":"The day I almost quit content","s":{"hooks":["I almost quit posting","There was a week I almost stopped posting for good.","[timeframe] into content, I wanted to quit.","Nobody sees the week you almost quit.","I almost deleted the app."],"body":"(1 HOOK)\nI wanted [what you wanted from content].\nAnd [what wasn't working].\n\n(2 RISING ACTION)\nEveryone thinks about quitting at some point.\nHonestly? Wanting to quit is a sign you care.\n[B-ROLL: real analytics screens, drafts, your setup]\nSo I [first real action].\nThen [second real action].\n[one honest line on how unprepared you were].\n\n(3 SECOND CONFLICT)\n[the low point, e.g. a flop after a win]\n[how it felt, one line].\n\n(4 CLIMAX) [MUSIC: beat drop]\nI didn't quit. [what you did instead].\n[B-ROLL: that exact moment, slowed down]\n\n(5 RESOLUTION)\n[what changed after that week].\nAnd the week you want to quit is usually the week right before it works.","cta":"Comment if you're in that week right now.","src":"New (no old script fit): his 5-step story format","kind":"new","notes":"Every [bracket] is yours to fill with something that really happened. If there's no real version, skip this one.","fillins":"","format":"5-step story (v2)"}},{"time":"1:30 PM","label":"Follower Farming","desc":"Identity list, 25 to 35s","has":true,"title":"10/10 male daily habits but it gets increasingly more niche","s":{"hooks":["10/10 male daily habits but it gets increasingly more niche","daily habits (niche edition)","If you already do three of these daily habits, you're ahead of most people your age","8 daily habits that quietly change everything, and the last one is the hardest","Most people stop at number 3. Number 8 is the one that matters."],"body":"1. Making your bed first thing\n2. Drinking water before touching your phone\n3. Getting 15 minutes of direct sunlight to reset your circadian rhythm and boost your mood naturally\n4. Cold showers after every workout\n5. Keeping a gratitude list you actually add to\n6. Time blocking your entire day to stop wondering where the hours went and start owning them\n7. Reviewing what you said yes and no to\n8. And putting your phone in a different room 30 minutes before bed because the version of you that scrolls until 1am is the same version that wonders why nothing's changing","cta":"No spoken CTA. The And line is the ending. Caption: which number are you? Comment it.","src":"Style library (Claude export): 10/10 male daily habits","kind":"adapted","notes":"He listed it as doing great. Posted before, so treat it as a v2 repost: refresh 1 or 2 points. For wider reach you can drop 'male' from the title (he noticed a 6.5M list that never said it). Each point gets a 1 to 4 word on-screen label.","fillins":"","format":""}},{"time":"6:00 PM","label":"My Take","desc":"Personal bet take, 55 to 65s","has":true,"title":"The next bubble is getting dangerously big","s":{"hooks":["the next bubble is getting dangerously big","Everyone's watching the AI bubble. Meanwhile, the next one is getting dangerously big.","Bubbles don't kill the technology. They kill the companies with no customers.","I'm opening a robot store right in the middle of a bubble.","Which bubble pops first, AI or robots?"],"body":"Everyone's watching the AI bubble. Meanwhile, the next one is getting dangerously big. And I'm betting on it anyway.\nAI was the hype of the last few years. Now the money is moving into what they call physical AI. Putting AI into a body. Humanoid robots, robot arms, machines that can see and move.\nAnd it's following the exact same pattern. A breakthrough. Crazy hype. Money flooding in. Companies valued like they've already won.\nSo yeah, I know how this looks. I skipped my third year of college, and I'm about to open a robot store in Miami, right in the middle of a bubble.\nSo why am I doing it? Because I've seen what history says. Bubbles don't kill the technology. They kill the companies with no real customers. The dot-com crash wiped out hundreds of companies. The internet didn't go anywhere. And the people who learned it early won.\nI'm not betting on one robot company surviving. I'm betting that the people who actually know how to build with this stuff will be the ones left standing when the dust settles. And I'd rather learn it now than watch from the sidelines.\nSo tell me. Which bubble pops first, AI or robots?","cta":"So tell me. Which bubble pops first, AI or robots?","src":"Style library: The next bubble is getting dangerously big (approved Oct 7)","kind":"reused","notes":"Approved for a trial reel. No dollar figures, blur robot logos. It follows his robotics bubble video (excellent retention), which he did not want repeated as is, so this is the 'dangerously' follow-up he asked for.","fillins":"","format":""}}]},{"date":"2026-11-08","dow":"Sun","kubot":{"format":"Podcast","title":"Kubot: Podcast","sub":"Ep. 4: Is AI good or bad for kids?","hook":"Is AI good or bad for kids?","badge":"Studio day","needs":false,"film":[{"what":"Why Build #5 Spatial thinking","short":"Why Build #5","note":"Posts Mon Nov 9.","ref":"2026-11-09"},{"what":"Why Build #7 Creativity","short":"Why Build #7","note":"Posts Thu Nov 12.","ref":"2026-11-12"},{"what":"Podcast ep. 5","short":"Podcast ep. 5","note":"Posts Sun Nov 15.","ref":"2026-11-15"}],"sections":[["Plan","rows",[["Episode","Podcast ep. 4. Full episode on YouTube and Spotify, plus one clip on Kubot."],["Filmed","Last Sunday's studio day."]]],["Inspo","rows",[["Show","Founders podcast: weekly build in public episode, 30 to 45 minutes, Denis and Gabriel hosting. Cut into 5 to 8 short clips."],["This episode","[topic to pick]. Idea: the best comments and parent questions from the week."]]],["Shape","text","1. Cold open (1 to 2 min): Denis sets up [topic].\n2. Main conversation (15 to 20 min): [topic], with real classroom moments, not slogans.\n3. Week in the build (3 to 5 min): what got done at the store, what broke, what's next.\n4. Kid of the week (optional): a Friday kid explains their robot, with a parent on mic. Only if release-cleared.\n5. What to try tonight (5 min): one tip for parents.\n6. Close (2 min): tease next week."],["Questions","list",["[the best parent question from this week's comments]","[the second best parent question]","What broke this week, and what's next before the store opens?","If a parent has 20 minutes tonight, what should they try?"]],["Shots","list",[  ever get.\nNo mortgage.\nNo reputation to protect.\nNobody expects anything from you.\nThat's not a disadvantage.\nThat's the window.\nAnd every year you wait for the right time, you're just moving your bad reps somewhere more expensive.","cta":"Comment your age and the thing you're starting.","src":"New (no old script fit): name-the-law / insight reel","kind":"new","notes":"Plays off his 'failing at 19 is the cheapest tuition' line. No personal claims needed.","fillins":"","format":"Insight reel"}},{"time":"1:30 PM","label":"Follower Farming","desc":"Identity list, 25 to 35s","has":true,"title":"10/10 simple habits but it gets increasingly more niche","s":{"hooks":["10/10 simple habits but it gets increasingly more niche","simple habits (niche edition)","If you already do three of these simple habits, you're ahead of most people your age","8 simple habits that quietly change everything, and the last one is the hardest","Most people stop at number 3. Number 8 is the one that matters."],"body":"1. Drinking water when you wake up\n2. Making your bed every morning\n3. Walking for 10 minutes after every meal, to prevent food comas.\n4. Going to bed at the same time every night\n5. Eating the same breakfast every single day\n6. Reading before bed instead of scrolling, to fall asleep faster and wake up less stressed\n7. Doing a 10-minute tidy every night before bed\n8. And staying consistent even when no one’s watching or nothing feels impressive","cta":"No spoken CTA. The And line ends it. Caption: send this to the friend who needs number 8.","src":"Style library (Claude export): 10/10 male daily habits (alt cut)","kind":"adapted","notes":"His earlier, simpler habits cut. Posted before, so treat it as a v2 repost: refresh 1 or 2 points. For wider reach you can drop 'male' from the title (he noticed a 6.5M list that never said it). Each point gets a 1 to 4 word on-screen label.","fillins":"","format":""}},{"time":"6:00 PM","label":"My Take","desc":"Personal bet take, 55 to 65s","has":true,"title":"YouTube is a real education","s":{"hooks":["YouTube is school","I learned more from YouTube than from two years of college.","YouTube is the best free university in history.","Nobody takes YouTube education seriously. They should.","Everything I know, I learned for free."],"body":"I think YouTube is the best free school that has ever existed.\nHear me out.\nEverything I use every day, I learned for free.\n[the skills you actually learned online, e.g. automation, editing, content].\nNo tuition.\nNo waitlist.\nJust someone who already figured it out, explaining it.\nHonestly? The information is free now.\nThe only thing you can't download is the discipline to finish the video and try it.\nAnd that's the real degree.","cta":"So tell me. What's the best thing you learned for free? Comment it.","src":"New (no old script fit): opinion / bet take","kind":"new","notes":"","fillins":"","format":"Personal take"}}]},{"date":"2026-11-09","dow":"Mon","kubot":{"format":"Why Build","title":"Kubot: Why Build","sub":"#5 Spatial thinking","hook":"Designing in 3D rewires how kids see things","badge":"","needs":false,"film":[],"sections":[["Plan","rows",[["Show","Why Build? with Gabriel. Gabriel to camera, 45 to 75 seconds."],["Episode","#5 Spatial thinking"],["Status","Script drafted below. Gabriel to review before filming."]]],["Inspo","rows",[["Development point","Spatial thinking"],["Hook","Designing in 3D rewires how kids see things"],["Do this tonight","Ask them to draw an object from three sides"]]],["Shots","list",["Gabriel to camera, clean audio","B-roll: [Friday class moment that shows the point]","On-screen text: [hook] / [tonight tip]"]],["Where","text","Studio. Filmed on Sunday studio day."],["Checklist","check",["Review the script with Gabriel","Film on Sunday studio day","Cut to 45 to 75 seconds","Add on-screen text and subtitles","No prices, no pitch","Post on Kubot"]]],"s":{"hooks":["Designing in 3D rewires how kids see things","designing in 3D rewires your kid","Your kid sees the world in 2D. Building changes that.","Draw it from three sides.","The skill architects and engineers have in common"],"body":"Designing in 3D changes how kids see things.\nMost of what kids look at all day is flat.\nScreens. Pages. Pictures.\nThen they design something they have to print.\nSuddenly it has a top.\nA side.\nA bottom it has to stand on.\nThe kid who turns the model around and around.\nThe kid who realizes the wheel won't fit until they move it.\nThat's spatial thinking.\nSeeing something from every side in your head.\nIt's what builders, architects and engineers use every day.\nHere's a simple way to start it tonight.\nPick any object on the table.\nAsk them to draw it from the front, the side and the top.\nThree drawings.\nWhat did your kid pick to draw?","cta":"Tonight: ask them to draw one object from three sides. Send us the drawing, we might print it. Waitlist link in bio.","src":"Plan v2 Why Build bank #5 (Spatial thinking): hook and tonight tip reused, new body","kind":"new","notes":"New body written from the plan v2 episode bank hook and 'do this tonight'. Concept-led, so no story from Gabriel is needed. Gabriel should adjust any line that isn't how he'd say it.","fillins":"","format":""}},"personal":[{"time":"9:30 AM","label":"Trial Reel","desc":"Quote reel shown to non-followers","has":true,"title":"The hedonic treadmill, but for creators","s":{"hooks":["[timeframe]. [a real milestone]. And something weird is happening.","Same effort. Bigger numbers. Smaller reaction.","As you get better, you outgrow your own dopamine.","This feeling has a name, and casinos use it on you.","I almost stopped posting right when it started working."],"body":"[timeframe].\n[a real milestone you hit, e.g. a view count or a first deal].\nAnd something weird is happening.\nHere's why.\nWhen I started, [a small number] views got me hyped.\nNow my average is [how much bigger, honestly] and my brain barely registers it.\nSame effort.\nBigger numbers.\nSmaller reaction.\nNow that's not a problem, I am very grateful, but it is weird.\nSo I looked into it.\nTurns out, this feeling is named the hedonic treadmill.\nAnd it's the exact same thing casinos and social apps use.\nEssentially, it's novelty plus unpredictable reward.\nOnce you start to know what'll perform, the dopamine shrinks.\nEven when the wins get bigger.\nThat's not burnout, that's your dopamine system adapting.\nSo here's how to beat it.\nStop chasing the old feeling, and engineer new uncertainty.\nTry new formats.\nTighter constraints.\nOr find a question you actually want to answer.\nBecause as you get better, you outgrow your own dopamine.\nAnd if you're not feeding your brain something new to chase, you'll stop right when it starts working.","cta":"Comment the last win that felt smaller than it should have.","src":"Style library: 10 or 10, the hedonic treadmill episode (his preferred cut), adapted","kind":"adapted","notes":"Adapted: the 10 or 10 series tag and every number are now [brackets], since he later ruled out exact money figures. Use only numbers that are true today.","fillins":"","format":""}},{"time":"1:30 PM","label":"Follower Farming","desc":"Identity list, 25 to 35s","has":true,"title":"10/10 male weekend routines but it gets increasingly more niche","s":{"hooks":["10/10 male weekend routines but it gets increasingly more niche","weekend routines (niche edition)","If you already do three of these weekend routines, you're ahead of most people your age","8 weekend routines that quietly change everything, and the last one is the hardest","Most people stop at number 3. Number 8 is the one that matters."],"body":"1. Waking up at the same time as weekdays\n2. Working out before noon\n3. Meal prepping for the week to stop making excuses by Wednesday\n4. Calling a family member just to check in\n5. Going to a coffee shop alone with a book\n6. Spending an hour learning something that has nothing to do with your job to keep your curiosity alive\n7. Cleaning and organizing your space\n8. And sitting down Sunday night to plan your week because the men who own their Mondays don't get owned by them","cta":"No spoken CTA. Let the And line land. Caption: comment the one you already do.","src":"Style library (Claude export): 10/10 male weekend routines","kind":"adapted","notes":"He listed it as doing great. Posted before, so treat it as a v2 repost: refresh 1 or 2 points. For wider reach you can drop 'male' from the title (he noticed a 6.5M list that never said it). Each point gets a 1 to 4 word on-screen label.","fillins":"","format":""}},{"time":"6:00 PM","label":"My Take","desc":"Personal bet take, 55 to 65s","has":true,"title":"AI tutors will make teachers more important","s":{"hooks":["AI won't replace teachers","AI tutors are coming. I think teachers matter more than ever.","Everyone thinks AI will replace teachers. I think it's the opposite.","What AI can't do in a classroom","The teacher's job is about to change."],"body":"Everyone thinks AI tutors are going to replace teachers.\nI think teachers are about to matter more.\nHear me out.\nAI can explain anything.\nIt can't make a kid care.\nIt can't notice the shy kid in the back.\nIt can't stand next to you when the robot doesn't move and say \"what have you tried?\"\nGabriel has taught kids for over 10 years.\nThat part of his job isn't going anywhere.\nHonestly? I think AI takes the explaining.\nAnd teachers get to do the part that actually changes kids.","cta":"So tell me. Will AI make teachers matter more, or less? Comment it.","src":"New (no old script fit): opinion / bet take","kind":"new","notes":"","fillins":"","format":"Personal take"}}]},{"date":"2026-11-10","dow":"Tue","kubot":{"format":"Denis Builds","title":"Kubot: Denis Builds","sub":"Upgrading the tank","hook":"Upgrading the tank","badge":"","needs":false,"film":[],"sections":[["Plan","rows",[["Series","Denis Builds: Denis on camera, building in public."],["Episode"," bet take, 55 to 65s","has":true,"title":"Robotics should be taught like a sport","s":{"hooks":["robotics is a sport","We should teach robotics like we teach sports.","Every kid plays a sport. Why doesn't every kid build?","Building is a team sport.","My take on how kids should learn robotics"],"body":"We put every kid in a sport.\nPractice.\nTeammates.\nGames on the weekend.\nWhy don't we do that with building?\nHear me out.\nRobotics has everything sports have.\nTeamwork.\nLosing.\nTrying again.\nThat feeling when it finally works.\nHonestly? I think a lot of kids who aren't sporty are builders nobody gave a team to.\nAnd I'd love to see building get the same Saturday morning energy as soccer.","cta":"So tell me. Should robotics be treated like a sport? Comment it.","src":"New (no old script fit): opinion / bet take","kind":"new","notes":"","fillins":"","format":"Personal take"}}]},{"date":"2026-11-11","dow":"Wed","kubot":{"format":"Robot on the Street","title":"Kubot: Robot on the Street","sub":"What did you build as a kid?","hook":"What did you build as a kid?","badge":"","needs":false,"film":[{"what":"Robot on the Street","short":"Robot on the Street","note":"Film today or earlier. Main question: What did you build as a kid?"}],"sections":[["Plan","rows",[["Series","Robot on the Street: the robot holds the mic and asks people one short question each."],["Main question","What did you build as a kid?"],["Twist ending","Gabriel steps in at the end: \"Robots don't teach here. Kids build them.\""],["Goal","5 to 6 good answers, a split reaction, then the twist. 30 to 45 seconds."],["When to film","Today or earlier."]]],["Questions","list",["Would you let a robot teach your kid?","Would you rather your kid use robots or build them?","What should kids learn that school doesn't teach?","Would your kid rather have an iPad or build a robot?","Are you scared of AI for your kids?","What did you build as a kid?","If a robot could help with one thing at home, what would it be?","Should kids learn to code or learn to build first?"]],["Shots","list",["Opener: the robot turns to someone, mic up","Opener line: \"Quick question from a robot. Got 5 seconds?\"","Each answer: tight on the person, robot mic in frame","Reactions: people laughing, pointing, filming the robot","Wide establishing shot of the spot","Gabriel walking in for the twist, then the line to camera"]],["Where","text","[pick the spot]. Public sidewalks or a park. Ask before filming on private property. Robot at the edge of the walkway, not blocking it."],["Checklist","check",["Pick the spot and time","Charge the robot and the mic","Print releases and bring pens","Quick release from every face used, a parent's for kids","Never mock anyone's answer","Get 5 to 6 usable answers","Film Gabriel's twist line","Cut to 30 to 45 seconds with subtitles","No prices, no pitch"]]],"s":{"hooks":["What did you build as a kid?","We asked Miami: what did you build as a kid?","A robot asked strangers one question, and the answers get more honest","People had opinions. Fast.","Quick question from a robot. Got 5 seconds?"],"body":"ROBOT: Quick question from a robot. Got 5 seconds?\nROBOT: What did you build as a kid?\n[answer 1, word for word]\n[answer 2]\n[answer 3, the one that surprised you]\n[answer 4]\n[answer 5, a kid if there's a signed parent release]\n[B-ROLL: reactions, people filming the robot]\n[the split: who said yes, who said no, in one line]\nGABRIEL (to camera): Robots don't teach here. Kids build them.","cta":"What would you answer? Comment it. Waitlist link in bio.","src":"Plan v2 Robot on the Street format + content.py question list (structure reused; answers are real only)","kind":"adapted","notes":"Unscripted. Quick release from every face, a parent's for kids. Never mock an answer.","fillins":"","format":""}},"personal":[{"time":"9:30 AM","label":"Trial Reel","desc":"Quote reel shown to non-followers","has":true,"title":"Commit for 6 months, but it gets harder than it sounds","s":{"hooks":["\"All you have to do is commit for 6 months. That's not a lot. It's actually very little.\" I gave [timeframe] to [goal]. [conflict].","6 months is nothing","Commit for 6 months, but it gets harder than it sounds","Two weeks isn't trying. It's sampling.","Give one thing 1% of your life before you call it."],"body":"(1 HOOK)\n\"All you have to do is commit for 6 months. That's not a lot. It's actually very little.\"\nI gave myself [timeframe] to [a goal you committed to and actually hit].\nAnd [the conflict, e.g. nothing about it was working yet].\n\n(2 RISING ACTION)\nTwo weeks isn't trying. It's sampling.\n[B-ROLL: you working on it, real footage or screenshots from that time]\nSo I [first action toward the goal].\nThen [second action].\n[one honest line on how unprepared you were].\nCar washing, the marketing agency, food delivery. [how long you gave each one before moving on].\n\n(3 SECOND CONFLICT)\nAround the halfway point, [the midpoint setback, e.g. a month with no results, a client loss, wanting to switch to something new].\n[the moment you almost quit].\n\n(4 CLIMAX) [MUSIC: beat drop. Tip: use a song from one of your favorite movies]\nI didn't switch. [what you did instead].\n[the moment it started working].\nThat's the 1% rule. Give one thing 1% of your life before you call it.\n\n(5 RESOLUTION)\n[the goal achieved].\nDan Koe put it perfectly. \"6 months is 1% of 50 years, and most people can't stick to something that will change the trajectory of their life for 2 weeks.\"\nAnd if 1% of your life feels like too much to give your dream, it might not be your dream yet.","cta":"Comment the one thing you're giving 6 months.","src":"Denis Content Scripts sheet #11 (reused)","kind":"reused","notes":"Dan Koe. Story format v2 (5-step). Quote reel: Dan Koe's post is read word for word, split across the hook (first three sentences) and the resolution (the last sentence). Source: @thedankoe on X, Oct 10, 2026.\n\"The 1% rule\" is a name made up for this video.\nDebatable line: \"Two weeks isn't trying. It's sampling.\"\nThe goal must be one you really stuck with and hit. If no single goal had a clean ~6-month run, use the real length and keep the quote as Dan's point.\nIf you post this near #2, use different footage, since both walk through the timeline.\n~50-60s.","fillins":"- [timeframe] + [a goal you committed to and actually hit]: ideally about 6 months; if it wasn't, say the real length\n- [the conflict], e.g. nothing was working yet\n- [first action] and [second action]\n- [one honest line on how unprepared you were]\n- [how long you gave each one before moving on]: car washing, marketing agency, food delivery\n- [the midpoint setback] + [the moment you almost quit]\n- [what you did instead] + [the moment it started working]\n- [the goal achieved]","format":"Name-the-law essay (Dan Koe-style), 5-step story (v2), quote reel"}},{"time":"1:30 PM","label":"Follower Farming","desc":"Identity list, 25 to 35s","has":true,"title":"10/10 male grooming habits but it gets increasingly more niche","s":{"hooks":["10/10 male grooming habits but it gets increasingly more niche","grooming habits (niche edition)","If you already do three of these grooming habits, you're ahead of most people your age","8 grooming habits that quietly change everything, and the last one is the hardest","Most people stop at number 3. Number 8 is the one that matters."],"body":"1. Having a real skincare routine\n2. Keeping your nails clean and trimmed\n3. Finding a signature scent to make people remember you before you even say a word\n4. Wearing SPF every single day\n5. Using actual hair product\n6. Investing in a quality razor to stop walking around with irritated skin like it's normal\n7. Moisturizing your hands\n8. And switching to a silk or satin pillowcase because the smallest upgrades nobody sees are the ones that compound the hardest over time","cta":"No spoken CTA. The And line is the ending. Caption: which number are you? Comment it.","src":"Style library (Claude export): 10/10 male grooming habits","kind":"adapted","notes":"He listed it as doing great. Posted before, so treat it as a v2 repost: refresh 1 or 2 points. For wider reach you can drop 'male' from the title (he noticed a 6.5M list that never said it). Each point gets a 1 to 4 word on-screen label.","fillins":"","format":""}},{"time":"6:00 PM","label":"My Take","desc":"Personal bet take, 55 to 65s","has":true,"title":"The internet made everyone a spectator","s":{"hooks":["we're all watching","The internet turned everyone into a spectator.","We watch people build things more than we build things.","When did we stop making stuff?","Stop watching. Start making."],"body":"The internet turned everyone into a spectator.\nWe watch people cook more than we cook.\nWe watch people build more than we build.\nWe watch people travel more than we go.\nHonestly? I'm part of the problem. I make the videos.\nBut I want you to do something with this one.\nClose the app after this.\nMake something.\nAnything.\nAnd come back and tell me what it was.","cta":"Comment what you made after watching this.","src":"New (no old script fit): opinion / bet take","kind":"new","notes":"","fillins":"","format":"Personal take"}}]},{"date":"2026-11-12","dow":"Thu","kubot":{"format":"Why Build","title":"Kubot: Why Build","sub":"#7 Creativity","hook":"Your kid doesn't need more toys. They need this","badge":"","needs":false,"film":[],"sections":[["Plan","rows",[["Show","Why Build? with Gabriel. Gabriel to camera, 45 to 75 seconds."],["Episode","#7 Creativity"],["Status","Script drafted below. Gabriel to review before filming."]]],["Inspo","rows",[["Development point","Creativity"],["Hook","Your kid doesn't need more toys. They need this"],["Do this tonight","Give them cardboard and tape and no instructions"]]],["Shots","list",["Gabriel to camera, clean audio","B-roll: [Friday class moment that shows the point]","On-screen text: [hook] / [tonight tip]"]],["Where","text","Studio. Filmed on Sunday studio day."],["Checklist","check",["Review the script with Gabriel","Film on Sunday studio day","Cut to 45 to 75 seconds","Add on-screen text and subtitles","No prices, no pitch","Post on Kubot"]]],"s":{"hooks":["Your kid doesn't need more toys. They need this","your kid doesn't need more toys","Cardboard, tape, no instructions.","The best toy has no instructions.","Creativity isn't taught. It's allowed."],"body":"Your kid doesn't need more toys.\nThey need this.\nA box.\nSome tape.\nAnd no instructions.\nHonestly, most toys come with the idea already inside.\nHere's the car. Here's how it goes.\nThe kid just follows along.\nBut hand a kid a pile of parts with no picture on the box.\nThe kid who builds a car.\nThe kid who builds a car with wings.\nThe kid who builds something nobody has a name for.\nThat's creativity.\nIt isn't something you teach.\nIt's something you stop getting in the way of.\nTonight, give them cardboard and tape.\nNo instructions.\nWalk away for twenty minutes.\nWhat did your kid make?","cta":"Tonight: cardboard, tape, no instructions. Send us a photo or a drawing of what they made. Waitlist link in bio.","src":"Plan v2 Why Build bank #7 (Creativity): hook and tonight tip reused, new body","kind":"new","notes":"New body written from the plan v2 episode bank hook and 'do this tonight'. Concept-led, so no story from Gabriel is needed. Gabriel should adjust any line that isn't how he'd say it.","fillins":"","format":""}},"personal":[{"time":"9:30 AM","label":"Trial Reel","desc":"Quote reel shown to non-followers","has":true,"title":"Hands remember what screens forget","s":{"hooks":["your hands remember","Hands remember what screens forget.","What do you actually remember making as a kid?","Nobody remembers their favorite app from age 8.","The things you built as a kid are still in your hands."],"body":"Think about what you remember from being a kid.\nNot the apps.\nNobody remembers their favorite app from when they were eight.\nYou remember the treehouse.\nThe Lego set that took all weekend.\nThe bike you fixed with your dad.\nHonestly? I think the screen gave us a lot and took one big thing.\nMaking stuff with our hands.\nHands remember what screens forget.\nThat's why I'm building a place where kids make real things.\nAnd I think the kids who build with their hands now will remember it the same way we do.","cta":"Comment the first thing you remember building.","src":"New (no old script fit): name-the-law / insight reel","kind":"new","notes":"Ties to his Day 1 script ('everything lived on a screen'). One soft Kubot line, no pitch, no date.","fillins":"","format":"Insight reel"}},{"time":"1:30 PM","label":"Follower Farming","desc":"Identity list, 25 to 35s","has":true,"title":"Your notes app tells me how ambitious you are (founder edition)","s":{"hooks":["Your notes app tells me exactly how ambitious you are. Founder edition.","your notes app exposes you","Show me your notes app and I'll tell you how ambitious you are","Ambition meter, founder edition","Your notes app tells me how ambitious you are (founder edition)"],"body":"ON-SCREEN: an \"ambition meter\" that fills with each point (shown on screen, not spoken).\n\nYour notes app tells me exactly how ambitious you are. Founder edition.\n1. Grocery lists and random passwords. You're just living. [METER 10%]\n2. A half-written business idea from 2023 you'll \"come back to.\" [METER 20%]\n3. Voice notes to yourself at 11 PM, to catch the idea before it disappears. [METER 35%]\n4. A folder named \"content\" with 40 half hooks. [METER 50%]\n5. Competitor screenshots you swear you're not copying. [METER 60%]\n6. A running list of people to DM this week, to actually move something instead of just thinking about it. [METER 75%]\n7. Your whole business plan living in one note nobody else has seen. [METER 90%]\n8. And opening Notes every morning before you open Instagram, because the plan comes before the scroll. [METER 100%]\nTag the friend who's stuck at 10%.","cta":"Tag the friend who's stuck at 10%.","src":"Denis Content Scripts sheet #20 (reused; it was planned for an earlier date)","kind":"reused","notes":"Originally planned for 1:30 PM Follower farm list (IG #23)\nIdentity meter list, same mechanic as #14 (gym split) and #17 (Friday night) but a new identity: the notes app. Space it visually (different meter color/label: ambition meter).\nDescribe the viewer, don't prescribe. Point 1 is agreeable. Debatable lines at 2 (half-written idea from 2023) and 7 (business plan in one note). Lines 3 and 6 carry the outcome. 8 starts with And.\nOn-screen labels: Groceries / Old idea / 11 PM voice / Content folder / Screenshots / DM list / Secret plan / Notes first.\nNo Kubot mention. Pure growth. Tag friend CTA.\n~25-35s.","fillins":"None (no personal details).","format":"Follower farm list (identity, progressive meter)"}},{"time":"6:00 PM","label":"My Take","desc":"Personal bet take, 55 to 65s","has":true,"title":"Most side hustles fail because nobody follows up","s":{"hooks":["you didn't follow up","Most side hustles don't fail. People just stop following up.","The skill that separates people who make money from people who don't.","Your business idea is fine. Your follow up isn't.","The follow up is the business."],"body":"Most side hustles don't fail.\nPeople just stop following up.\nHear me out.\nSomeone says \"maybe\".\nYou never message again.\nSomeone says \"send me info\".\nYou send it once and wait.\n[Only if it's true: most of what I've closed came from a second or third message.]\nThe idea gets you the conversation.\nThe follow up gets you the yes.\nAnd the text you're too embarrassed to send twice might be the whole business.","cta":"So tell me. Who do you owe a follow up today? Comment 'sent' when you send it.","src":"New (no old script fit): opinion / bet take","kind":"new","notes":"Only keep 'most of the money I've ever made came from a second or third message' if it's true for you.","fillins":"","format":"Personal take"}}]},{"date":"2026-11-13","dow":"Fri","kubot":{"format":"Denis Builds","title":"Kubot: Denis Builds","sub":"What broke this week","hook":"What broke this week","badge":"Hero shoot 3:30 to 5 PM, Bal Harbour","needs":false,"film":[{"what":"Kubot class, 3:30 to 5 PM, Bal Harbour","note":"Hero shoot. Film testimonials and b-roll. Gabriel teaches, Denis films.","sections":[["Capture list","list",["Door: signed parent photo and video release before any face is used","Wide of the room before kids arrive","Hands on CyberBricks and 3D printed parts (vertical and horizontal)","Gabriel teaching: hands, face, parts, kids reacting","A build failing, then a kid fixing it","The first time a robot moves, plus the kid's face","Wide room shots once it's full","Pickup: a kid showing the build to a parent","Parent answer at pickup (release-cleared only): \"What did you notice in your kid today?\" Get 2 to 3 clean answers for Saturday"]],["Rules","text","No scripted kid interviews. No prices, no pitch. First names only, no school names. After class, confirm which faces are release-cleared before the edit."]],"short":"Class 3:30 to 5 PM, Bal Harbour"}],"sections":[["Plan","rows",[["Series","Denis Builds: Denis on camera, building in public."],["Episode","What got done at the store this week, what broke, what's next."],["When to film","Any time this week."]]],["Shots","list",["Denis to camera at the store","B-roll: [what got done]","Close-up: [one detail]"]],["Where","text","[where you're filming]"],["Checklist","check",["Film during the week","Cut to 30 to 45 seconds","No prices, no pitch","Post on Kubot"]]],"s":{"hooks":["What broke this week","Most founders only post the wins. Here's what broke.","Building a store in public: the broken part","Something always breaks.","Not every week is a win. This one wasn't."],"body":"What broke this week.\n[B-ROLL: the store today]\nWhat got done: [what got done this week].\nWhat broke: [what broke, one honest line].\nWhat's next: [what's next before December 1st].\n[B-ROLL: one detail close up]\nMost founders only post the wins.\nAnd I think the broken part is the part worth watching.","cta":"Follow along to see if we get the doors open. Waitlist link in bio.","src":"Store build update format (content.py, hub posts.json Oct 30) with a new weekly angle","kind":"adapted","notes":"Real progress only. No prices, no lease or money details.","fillins":"","format":""}},"personal":[{"time":"9:30 AM","label":"Trial Reel","desc":"Quote reel shown to non-followers","has":true,"title":"The thing everyone told me not to do","s":{"hooks":["everyone said don't","Everyone told me not to do this.","[number] people told me this was a bad idea.","I did the one thing everyone told me not to do.","Pick a lane, they said."],"body":"(1 HOOK)\nI wanted [the thing everyone said not to do].\nAnd [who said it and why, no names].\n\n(2 RISING ACTION)\nEveryone means well when they warn you.\nHonestly? Most advice is just someone else's fear.\n[B-ROLL: the thing itself, real footage]\nSo I [first real action].\nThen [second real action].\n[one honest line on how unprepared you were].\n\n(3 SECOND CONFLICT)\n[the moment you wondered if they were right]\n[how it felt, one line].\n\n(4 CLIMAX) [MUSIC: beat drop]\n[the moment it worked anyway].\n[B-ROLL: that exact moment, slowed down]\n\n(5 RESOLUTION)\nThey weren't wrong to warn me. They were just warning me about their life.\nAnd sometimes the thing everyone tells you not to do is the only thing that's actually yours.","cta":"Comment the thing everyone told you not to do.","src":"New (no old script fit): his 5-step story format","kind":"new","notes":"Every [bracket] is yours to fill with something that really happened. If there's no real version, skip this one.","fillins":"","format":"5-step story (v2)"}},{"time":"1:30 PM","label":"Follower Farming","desc":"Identity list, 25 to 35s","has":true,"title":"Signs you're going to make it before 25","s":{"hooks":["signs you'll make it before 25","Signs you're going to make it before 25, but it gets increasingly more niche.","If you're under 25 and relate to these, you're early.","Number 8 is the real sign.","Most people won't relate to a single one of these."],"body":"Signs you're going to make it before 25, but it gets increasingly more niche.\n1. You're the friend who always has a new idea.\n2. Your parents don't fully get what you do, and that's okay.\n3. You learn from YouTube like it's school, to get a degree's worth of skills for free.\n4. You'd rather work on your thing than go out.\n5. You have one older friend who believes in you.\n6. You've already failed at something, to learn early what most people learn at 30.\n7. You're bored by normal conversations.\n8. And you're okay being misunderstood for a few years, because you can already see what everyone else will see later.","cta":"Comment your age and how many you got.","src":"New (no old script fit): identity list, hook from his library","kind":"new","notes":"Hook from his library alternates; list is new.","fillins":"","format":"Follower farm list"}},{"time":"6:00 PM","label":"My Take","desc":"Personal bet take, 55 to 65s","has":true,"title":"The safest career is one you can rebuild","s":{"hooks":["there's no safe career","There's no such thing as a safe job anymore.","The safest career is the one you could rebuild from zero.","Job security is a feeling, not a fact.","What actually makes you safe in your career"],"body":"There's no such thing as a safe career anymore.\nHear me out.\nSafe used to mean one company for 30 years.\nNow companies change faster than people do.\nSo what's actually safe?\nBeing able to rebuild.\nSkills you can take anywhere.\nPeople who'd hire you again.\nProof of what you've done.\nHonestly? I've had to start over more than once already.\nAnd every time, it was the skills that saved me, not the job title.","cta":"So tell me. Could you rebuild from zero? Comment it.","src":"New (no old script fit): opinion / bet take","kind":"new","notes":"","fillins":"","format":"Personal take"}}]},{"date":"2026-11-14","dow":"Sat","kubot":{"format":"Testimonial","title":"Kubot: Testimonial","sub":"From Fri Nov 13 class","hook":"Watch [his or her] face when [he or she] shows [mom or dad]","badge":"","needs":false,"film":[],"sections":[["Plan","rows",[["Series","Testimonial: a kid at pickup showing their parent what they built, then one honest sentence from the parent. Unscripted, never staged."],["Source","Footage from the Fri Nov 13 class (Bal Harbour)."],["Hook options","\"Watch [his or her] face when [he or she] shows [mom or dad]\" or \"I asked a [mom or dad] what changed in [her or his] [son or daughter]\". Use the real kid and parent."],["Who","[parent first name] and [kid first name]. First names only."],["Goal","One honest answer a parent watching can relate to. 25 to 35 seconds."]]],["Questions","list",["What did you notice in your kid today?","What did [kid] tell you about the build on the way out?","What is something [kid] built that surprised you?","How does [kid] talk about building now?","In one sentence, what did building give [kid]?"]],["Shots","list",["Kid running up with the build","Kid explaining it to the parent","Parent's face as the robot moves","The parent's one sentence","Close-up of the build in the kid's hands"]],["Where","text","Bal Harbour class footage from Friday."],["Checklist","check",["Pick the pickup moment from Friday's footage","Confirm the signed release for kid and parent","First names only, no school names","Cut to 25 to 35 seconds with subtitles","No prices, no pitch","Post on Kubot"]]],"s":{"hooks":["Watch [his or her] face when [he or she] shows [mom or dad]","This is what a Friday class looks like.","Pieces in. Robot out.","What did you notice in your kid today?","One parent. One answer at pickup."],"body":"[B-ROLL: kid running up to the parent with the build]\nKID: [what the kid says about the build, word for word]\n[B-ROLL: the robot moving, the parent's face]\nPARENT (answering \"What did you notice in your kid today?\"): [the parent's answer, word for word]\n[B-ROLL: close up of the build in the kid's hands]\nON-SCREEN: [parent's first name] and [kid's first name], after the Fri Nov 13 class.","cta":"What did your kid build first? Comment it. Or send us their drawing.","src":"Plan v2 Real Families + kubot-details.json hook options + hub posts.json pickup posts (structure reused; words are real only)","kind":"adapted","notes":"Never staged or scripted. Signed release for kid and parent, first names only, no schools.","fillins":"","format":""}},"personal":[{"time":"9:30 AM","label":"Trial Reel","desc":"Quote reel shown to non-followers","has":true,"title":"What if you skipped college to build robots?","s":{"hooks":["what if you skipped college to build robots?","What if instead of college, you bet everything on robots?","POV: you skipped your last year of college to open this.","While everyone is paying tuition to sit at a desk, we're betting on robots.","We flew a friend in from Argentina just to wire 12 printers."],"body":"What if instead of going to college for four years, you bet everything on robots taking over the world?\nI am 21 years old.\nAfter two years of college, I skipped my third year.\nWhile everyone my age was in lecture halls, I signed a commercial retail lease.\nAnd if our doors don't open on time, [the real stakes, no dollar figure].\nWe are building Kubot.\nA place where kids design and 3D print their own custom cars and trucks from scratch.\nThen they install real motors, microchips and electronics using the CyberBricks platform, so those vehicles turn into actual working robots.\n[B-ROLL: printers, parts, a kid's car moving]\nTo make that happen every day, we needed our own micro factory to print hundreds of parts.\nSo we took over space inside a friend's warehouse.\nWe made last minute runs to Home Depot for shelves for our print farm.\nAnd we flew Gabriel's friend from Argentina to Miami to help wire, assemble and calibrate all 12 printers by hand.\nWhile everyone else is paying tuition to sit at a desk, we are betting the world will want robots and 3D printing way earlier than anyone believes.","cta":"Follow me to see if we get the doors open.","src":"Style library: 100 in 100, the build-in-public cut he labeled day 5, adapted","kind":"adapted","notes":"Adapted: penalty figure removed (his Oct 4 rule), no 'day 5' tag, no midnight lines. He said this what-if hook reached a lot of non-followers.","fillins":"","format":""}},{"time":"1:30 PM","label":"Follower Farming","desc":"Identity list, 25 to 35s","has":true,"title":"10/10 male social habits but it gets increasingly more niche","s":{"hooks":["10/10 male social habits but it gets increasingly more niche","social habits (niche edition)","If you already do three of these social habits, you're ahead of most people your age","8 social habits that quietly change everything, and the last one is the hardest","Most people stop at number 3. Number 8 is the one that matters."],"body":"1. Showing up on time every time\n2. Phone face down when you're with people\n3. Remembering small details about people to bring them up later and make someone feel genuinely seen\n4. Actually following through on plans\n5. Sitting in silence without making it awkward\n6. Giving genuine compliments to other men to normalize something most of them almost never hear\n7. Asking better questions instead of waiting to talk\n8. And being the person who connects people in your circle to each other because building a community around you is the most underrated and quietly powerful thing you can do","cta":"No spoken CTA. The And line ends it. Caption: send this to the friend who needs number 8.","src":"Style library (Claude export): 10/10 male social habits","kind":"adapted","notes":"He listed it as doing great. Posted before, so treat it as a v2 repost: refresh 1 or 2 points. For wider reach you can drop 'male' from the title (he noticed a 6.5M list that never said it). Each point gets a 1 to 4 word on-screen label.","fillins":"","format":""}},{"time":"6:00 PM","label":"My Take","desc":"Personal bet take, 55 to 65s","has":true,"title":"Every company is becoming a robot company","s":{"hooks":["every company is a robot company","In 10 years, every company will be a robot company.","Robots aren't an industry. They're going to be in every industry.","My bet on where robots show up first","Most people think robots are a niche."],"body":"Most people think robotics is a niche.\nI think every company is slowly becoming a robot company.\nWarehouses.\nRestaurants.\nFarms.\nHospitals.\nIt's the same thing that happened with software.\nAt first it was an industry.\nThen it was every industry.\nSo yeah, I know how it looks. I'm 21, [your line], and I'm betting on kids learning robots now.\nMy bet is the kids who understand how robots work will have a job in every industry.\nAnd I'd rather they understand it than be scared of it.","cta":"So tell me. Where do you think robots show up first? Comment it.","src":"New (no old script fit): opinion / bet take","kind":"new","notes":"No stats. Add a real news example in [brackets] with a source only if you have one.","fillins":"","format":"Personal take"}}]},{"date":"2026-11-15","dow":"Sun","kubot":{"format":"Podcast","title":"Kubot: Podcast","sub":"Ep. 5: 10 years of watching kids fail and fix things","hook":"What 10 years of teaching kids taught Gabriel about failure","badge":"Studio day","needs":false,"film":[{"what":"Why Build #8 Patience","short":"Why Build #8","note":"Posts Mon Nov 16.","ref":"2026-11-16"},{"what":"Why Build #9 Math and science made real","short":"Why Build #9","note":"Posts Thu Nov 19.","ref":"2026-11-19"},{"what":"Podcast ep. 6","short":"Podcast ep. 6","note":"Posts Sun Nov 22.","ref":"2026-11-22"}],"sections":[["Plan","rows",[["Episode","Podcast ep. 5. Full episode on YouTube and Spotify, plus one clip on Kubot."],["Filmed","Last Sunday's studio day."]]],["Inspo","rows",[["Show","Founders podcast: weekly build in public episode, 30 to 45 minutes, Denis and Gabriel hosting. Cut into 5 to 8 short clips."],["This episode","[topic to pick]. Idea: the best comments and parent questions from the week."]]],["Shape","text","1. Cold open (1 to 2 min): Denis sets up [topic].\n2. Main conversation (15 to 20 min): [topic], with real classroom moments, not slogans.\n3. Week in the build (3 to 5 min): what got done at the store, what broke, what's next.\n4. Kid of the week (optional): a Friday kid explains their robot, with a parent on mic. Only if release-cleared.\n5. What to try tonight (5 min): one tip for parents.\n6. Close (2 min): tease next week."],["Questions","list",["[the best parent question from this week's comments]","[the second best parent question]","What broke this week, and what's next before the store opens?","If a parent has 20 minutes tonight, what should they try?"]],["Shots","list",["Wide two-shot, plus a single on each host","Print farm and robots visible behind","Clip targets: one Gabriel line that stands alone, one parent tip for tonight"]],["Where","text","Studio. Audio: the podcast mics, test recording first."],["Checklist","check",["Upload the full episode to YouTube and Spotify","Cut one clip for Kubot","Mark 5 to 8 clips for later","No prices, no pitch","Reply to comments in the first hour"]]],"s":{"hooks":["What 10 years of teaching kids taught Gabriel about failure","Gabriel has watched kids fail for 10 years. Here's what he learned.","Why the best builders fail the most","Let them get stuck.","The moment a kid stops asking for help"],"body":"DENIS (cold open): Gabriel has watched kids get stuck for over 10 years. I wanted to know what he's learned.\nDENIS: What's the first thing a kid does when a build fails?\nGABRIEL: [his answer, in his words]\nDENIS: When should a parent step in?\nGABRIEL: [his answer]\nDENIS: Store update. [what got done, what broke, what's next]\nCLIP FOR KUBOT: [the line about letting kids get stuck]","cta":"Full episode on YouTube and Spotify. What should we ask Gabriel next? Waitlist link in bio.","src":"Plan v2 podcast segments + parent questions (new episode plan)","kind":"new","notes":"Gabriel's answers are his, unscripted. Only the cold open and questions are written.","fillins":"","format":""}},"personal":[{"time":"9:30 AM","label":"Trial Reel","desc":"Quote reel shown to non-followers","has":true,"title":"You're comparing your chapter 3 to their chapter 20","s":{"hooks":["you're reading the wrong chapter","You're comparing your chapter 3 to their chapter 20.","Comparison isn't a talent problem. It's a timing problem.","Everyone you envy was where you are once.","Stop measuring your start against someone's middle."],"body":"You're comparing your chapter 3 to someone else's chapter 20.\nYou see the finished store.\nNot the empty room.\nYou see the million views.\nNot the hundred videos nobody watched.\nHonestly? Comparison isn't a talent problem.\nIt's a timing problem.\nYou're not behind.\nYou're just early in a different book.\nAnd if you keep reading theirs, you'll never finish writing yours.","cta":"Comment what chapter you're on.","src":"New (no old script fit): name-the-law / insight reel","kind":"new","notes":"Short, 25 to 30s. Good for a quote style on screen.","fillins":"","format":"Insight reel"}},{"time":"1:30 PM","label":"Follower Farming","desc":"Identity list, 25 to 35s","has":true,"title":"What you do on Sunday night tells me how your week goes","s":{"hooks":["your Sunday night exposes you","What you do on Sunday night tells me how your week will go.","Sunday scaries, or Sunday plan?","Sunday night decides Monday.","Where does your Sunday night land?"],"body":"ON-SCREEN: a \"week meter\" fills with each point (on screen, not spoken).\n\nWhat you do on Sunday night tells me how your week will go.\n1. Dreading Monday on the couch. Relatable. [METER 10%]\n2. Out until 2 AM on a Sunday. Brave. [METER 20%]\n3. Laying out your clothes for tomorrow, to make the first decision of Monday automatic. [METER 35%]\n4. Groceries done. [METER 50%]\n5. Laundry folded, actually folded. [METER 60%]\n6. Writing your three wins for the week, to know exactly what matters before the noise starts. [METER 75%]\n7. Phone off at 9. [METER 90%]\n8. And looking forward to Monday, because you built a week you actually want to live. [METER 100%]","cta":"Tag the friend who's stuck at 10%.","src":"New (no old script fit): identity list with a meter","kind":"new","notes":"","fillins":"","format":"Follower farm list"}},{"time":"6:00 PM","label":"My Take","desc":"Personal bet take, 55 to 65s","has":true,"title":"Humanoids are overhyped. Robot arms are underhyped.","s":{"hooks":["the boring robots win","Humanoid robots are overhyped. The boring ones aren't.","Everyone's watching robots do backflips. The real action is somewhere boring.","The robot that matters isn't the one going viral.","My spicy robot take"],"body":"Everyone's obsessed with humanoid robots doing backflips.\nI think the boring robots are the real story.\nHear me out.\nA robot arm doesn't go viral.\nIt doesn't dance.\nIt just does one job, all day, really well.\nAnd that's exactly why companies actually buy them.\nHonestly? I love the humanoid videos as much as anyone.\nBut the robots that change the world first will probably look boring.\nAnd the kids who understand the boring ones will be the ones building the cool ones later.","cta":"So tell me. Humanoids, hype or real? Comment it.","src":"New (no old script fit): opinion / bet take","kind":"new","notes":"Opinion only, no numbers.","fillins":"","format":"Personal take"}}]},{"date":"2026-11-16","dow":"Mon","kubot":{"format":"Why Build","title":"Kubot: Why Build","sub":"#8 Patience","hook":"A 3D print takes hours. That's the lesson","badge":"","needs":false,"film":[],"sections":[["Plan","rows",[["Show","Why Build? with Gabriel. Gabriel to camera, 45 to 75 seconds."],["Episode","#8 Patience"],["Status","Script drafted below. Gabriel to review before filming."]]],["Inspo","rows",[["Development point","Patience"],["Hook","A 3D print takes hours. That's the lesson"],["Do this tonight","Start something that finishes tomorrow, like seeds or a slow build"]]],["Shots","list",["Gabriel to camera, clean audio","B-roll: [Friday class moment that shows the point]","On-screen text: [hook] / [tonight tip]"]],["Where","text","Studio. Filmed on Sunday studio day."],["Checklist","check",["Review the script with Gabriel","Film on Sunday studio day","Cut to 45 to 75 seconds","Add on-screen text and subtitles","No prices, no pitch","Post on Kubot"]]],"s":{"hooks":["A 3D print takes hours. That's the lesson","a 3D print takes hours","The best thing about a 3D printer is how slow it is.","Kids can wait. We just stopped asking them to.","Patience is a skill. Here's how kids practice it."],"body":"A 3D print takes hours.\nThat's the lesson.\nEverything else in a kid's day is instant.\nTap, and the video plays.\nSwipe, and there's a new one.\nThen they design a part and hit print.\nAnd it's slow.\nLayer by layer.\nThe kid who checks on it every five minutes.\nThe kid who learns to start it before dinner and see it after.\nThat waiting is a skill.\nKids are good at it when it's for something they made.\nHonestly, I think we just stopped asking them to wait.\nTonight, start something that finishes tomorrow.\nPlant a seed.\nStart a slow build.\nThen check on it together in the morning.\nWhat's something your kid can't wait for?","cta":"Tonight: start something that finishes tomorrow, like seeds or a slow build. Tell me what you picked. Waitlist link in bio.","src":"Plan v2 Why Build bank #8 (Patience): hook and tonight tip reused, new body","kind":"new","notes":"New body written from the plan v2 episode bank hook and 'do this tonight'. Concept-led, so no story from Gabriel is needed. Gabriel should adjust any line that isn't how he'd say it.","fillins":"","format":""}},"personal":[{"time":"9:30 AM","label":"Trial Reel","desc":"Quote reel shown to non-followers","has":true,"title":"My first robot build went wrong","s":{"hooks":["my first robot didn't move","I tried to build my first robot and it did not go well.","I knew nothing about robots. Then I tried to build one.","The first robot I built for Kubot [what happened].","A robot that doesn't move teaches you everything."],"body":"(1 HOOK)\nI wanted [the first robot or print you built for Kubot].\nAnd [how much you knew about robots before, honestly].\n\n(2 RISING ACTION)\nEveryone thinks building a robot is hard.\nHonestly? A robot that doesn't work teaches you more than one that does.\n[B-ROLL: the parts, the printer, your hands]\nSo I [first real action].\nThen [second real action].\n[one honest line on how unprepared you were].\n\n(3 SECOND CONFLICT)\n[what went wrong, the real thing]\n[how it felt, one line].\n\n(4 CLIMAX) [MUSIC: beat drop]\nThen [the first time it moved].\n[B-ROLL: that exact moment, slowed down]\n\n(5 RESOLUTION)\nA failed build is information. That's Gabriel's line, and now I get it.\nAnd now I get why kids light up when theirs moves. I did too.","cta":"Comment what you'd build first.","src":"New (no old script fit): his 5-step story format","kind":"new","notes":"Every [bracket] is yours to fill with something that really happened. If there's no real version, skip this one.","fillins":"","format":"5-step story (v2)"}},{"time":"1:30 PM","label":"Follower Farming","desc":"Identity list, 25 to 35s","has":true,"title":"10/10 male purchases but it gets increasingly more niche","s":{"hooks":["10/10 male purchases but it gets increasingly more niche","purchases (niche edition)","If you already do three of these purchases, you're ahead of most people your age","8 purchases that quietly change everything, and the last one is the hardest","Most people stop at number 3. Number 8 is the one that matters."],"body":"1. A quality pair of running shoes\n2. A good everyday watch\n3. A cast iron skillet to start cooking real meals and stop relying on takeout\n4. Noise cancelling headphones\n5. A solid leather journal\n6. A home espresso setup to save money and actually enjoy your mornings more\n7. Blue light glasses and a second monitor\n8. And a high quality backpack that fits your laptop, gym clothes, and a book so you're always ready for whatever the day throws at you","cta":"No spoken CTA. Let the And line land. Caption: comment the one you already do.","src":"Style library (Claude export): 10/10 male purchases (early, non-sponsor)","kind":"adapted","notes":"The early, non-sponsor version only. Posted before, so treat it as a v2 repost: refresh 1 or 2 points. For wider reach you can drop 'male' from the title (he noticed a 6.5M list that never said it). Each point gets a 1 to 4 word on-screen label.","fillins":"","format":""}},{"time":"6:00 PM","label":"My Take","desc":"Personal bet take, 55 to 65s","has":true,"title":"Content is the new resume","s":{"hooks":["your content is your resume","Your content is your new resume.","Nobody reads resumes. They watch your videos.","The best job application I ever sent was a video.","Post what you know."],"body":"I think content is the new resume.\nHear me out.\nA resume tells people what you did.\nContent shows them how you think.\n[one real opportunity that came from something you posted, no names or numbers you can't back].\nHonestly? A resume gets skimmed in six seconds.\nA good video gets watched by the exact person who needs you.\nAnd you don't need to be an influencer.\nYou just need to post what you know.","cta":"So tell me. Would you hire someone from their content? Comment it.","src":"New (no old script fit): opinion / bet take","kind":"new","notes":"Keep 'every opportunity I've had this year' only if it's true.","fillins":"","format":"Personal take"}}]},{"date":"2026-11-17","dow":"Tue","kubot":{"format":"Denis Builds","title":"Kubot: Denis Builds","sub":"We printed a kid's drawing. Does it move?","hook":"We printed a kid's drawing. Does it move?","badge":"","needs":false,"film":[],"sections":[["Plan","rows",[["Series","Denis Builds: Denis on camera, building in public."],["Episode","We printed a kid's drawing. Does it move?"],["When to film","Any time this week."]]],["Shots","list",["Parts laid out on the table, one slow pan","Build timelapse from a fixed angle","The first time it works, one take","Close-up of [the best detail]"]],["Where","text","[where you build]"],["Checklist","check",["Film while you build","Cut to 30 to 45 seconds","No prices, no pitch","Post on Kubot"]]],"s":{"hooks":["We printed a kid's drawing. Does it move?","part 2: does it move?","Last time we printed a kid's drawing. Now we're making it move.","A drawing that drives","From drawing to robot, part 2"],"body":"Last time, we printed a kid's drawing.\nToday we try to make it move.\n[B-ROLL: the print from last time]\nStep one. Add the CyberBricks parts: [what you added].\nStep two. Wire it.\n[what went wrong, one honest line]\nStep three. The first drive.\n[B-ROLL: first drive, one take]\n[what happened]\nAnd now the kid who drew it has a robot that started on paper.","cta":"Send us your kid's drawing. Waitlist link in bio.","src":"Follow up to the 'your kid draws it' idea from plan v2 (new script)","kind":"new","notes":"","fillins":"","format":""}},"personal":[{"time":"9:30 AM","label":"Trial Reel","desc":"Quote reel shown to non-followers","has":true,"title":"Every business I quit gave me one skill, but each one gets more useful","s":{"hooks":["I had [timeframe] to [a goal you actually hit]. And [the conflict].","every business I quit left me something","Quitting is underrated. Here's what every exit handed me.","I didn't start from zero. I was collecting pieces.","Every business I quit gave me one skill, but each one gets more useful"],"body":"(1 HOOK)\nI had [timeframe] to [a goal you actually hit, e.g. land the first client for the AI agency].\nAnd [the conflict, e.g. I'd never built an automation for anyone].\n\n(2 RISING ACTION)\nEveryone says quitting means starting over.\nHonestly? I think quitting is underrated.\n[B-ROLL: old photos or clips from car washing and the marketing agency]\nI'd just walked away from [the venture you'd just left].\nSo I started with what I had.\n[first real action toward the goal, e.g. the first outreach you sent].\n[second action, e.g. teaching yourself the tool from scratch].\n[B-ROLL: laptop, notes, whatever you actually worked from]\nI was not ready. [one honest line on how unprepared you were].\n\n(3 SECOND CONFLICT)\nThen [the midpoint setback, e.g. a deal that fell through, a demo that broke, a big no].\n[how close you came to quitting this one too].\n\n(4 CLIMAX) [MUSIC: beat drop. Tip: use a song from one of your favorite movies]\nThat's when [the one skill from the marketing agency] kicked in.\n[the moment that old skill turned it around].\nSame kid. Different door. Same skill in my pocket.\n\n(5 RESOLUTION)\n[the goal achieved, e.g. the first client signed].\nI didn't start from zero. I was collecting pieces.\nAnd every door I walked out of was handing me the key to the next one.","cta":"Which skill did your last job hand you? Tell me in the comments.","src":"Denis Content Scripts sheet #1 (reused)","kind":"reused","notes":"Story format v2 (5-step). Source idea: \"remix beats reinvent\", carry one skill into the next door.\nThe whole story is ONE goal you actually hit, saved by one skill from an earlier venture. Pick the clearest real example; the AI agency's first client is only a suggestion.\nDebatable line: \"I think quitting is underrated.\"\nThe resolution has to feel earned, so the setback has to be real and specific. If there wasn't a real down moment, pick a different goal.\n~50-60s. On-screen text on the hook and on \"Same skill in my pocket.\"","fillins":"- [timeframe] + [a goal you actually hit]: must be a goal you really reached (not Kubot's opening, which hasn't happened)\n- [the conflict]: what made it hard, e.g. no experience, no clients\n- [the venture you'd just left]\n- [first real action] and [second action] toward the goal\n- [one honest line on how unprepared you were]\n- [the midpoint setback]: a real down moment, e.g. a deal that fell through or a big no\n- [how close you came to quitting]\n- [the one skill from the marketing agency] + [the moment it turned it around]\n- [the goal achieved]","format":"100 in 100 storytime, 5-step story (v2)"}},{"time":"1:30 PM","label":"Follower Farming","desc":"Identity list, 25 to 35s","has":true,"title":"10/10 builder habits but it gets increasingly more niche","s":{"hooks":["10/10 builder habits but it gets increasingly more niche","builder habits (niche edition)","If you build things, you'll relate to all eight.","The habits nobody tells you builders have.","Builders, how many do you have?"],"body":"builder habits (niche edition)\n1. Writing ideas down the second you have them\n2. Starting before you're ready\n3. Shipping something small every week, to get real feedback instead of guessing\n4. Asking 'how does that work?' about everything\n5. Fixing things instead of replacing them\n6. Showing your work before it's finished, to let people help you make it better\n7. Ignoring advice from people who've never built anything\n8. And finishing what you start, because the world is full of half built things and finished ones stand out","cta":"No spoken CTA. Caption: which one do you do? Comment it.","src":"New (no old script fit): identity list","kind":"new","notes":"","fillins":"","format":"Follower farm list"}},{"time":"6:00 PM","label":"My Take","desc":"Personal bet take, 55 to 65s","has":true,"title":"Lessons from starting a business at 21, part two","s":{"hooks":["starting a business at 21: lesson 2","nobody claps for the empty room","You're going to feel behind.","Everyone your age is graduating, getting the job, posting the trip.","Keep building the thing only you can see right now."],"body":"Lessons from starting a business at 21, part two.\nYou're going to feel behind.\nEveryone your age is graduating, getting the job, posting the trip.\nAnd you're [where you really are this week, e.g. at the warehouse with twelve 3D printers], building a robot store nobody's seen yet.\nThat's okay.\nNobody claps for the empty room.\nThey clap when the doors open.\nSo keep building the thing only you can see right now.\nOurs opens December 1st.","cta":"Comment 'part 3' and I'll keep going.","src":"Style library: Lessons from starting a business at 21, part two (Oct 3), adapted","kind":"adapted","notes":"Adapted: the 'warehouse at midnight' line is gone (he rejected fake late-night staging). On-screen: nobody claps for the empty room. Post before Dec 1.","fillins":"","format":""}}]},{"date":"2026-11-18","dow":"Wed","kubot":{"format":"Robot on the Street","title":"Kubot: Robot on the Street","sub":"If a robot could help with one thing at home, what would it be?","hook":"If a robot could help with one thing at home, what would it be?","badge":"","needs":false,"film":[{"what":"Robot on the Street","short":"Robot on the Street","note":"Film today or earlier. Main question: If a robot could help with one thing at home, what would it be?"}],"sections":[["Plan","rows",[["Series","Robot on the Street: the robot holds the mic and asks people one short question each."],["Main question","If a robot could help with one thing at home, what would it be?"],["Twist ending","Gabriel steps in at the end: \"Robots don't teach here. Kids build them.\""],["Goal","5 to 6 good answers, a split reaction, then the twist. 30 to 45 seconds."],["When to film","Today or earlier."]]],["Questions","list",["Would you let a robot teach your kid?","Would you rather your kid use robots or build them?","What should kids learn that school doesn't teach?","Would your kid rather have an iPad or build a robot?","Are you scared of AI for your kids?","What did you build as a kid?","If a robot could help with one thing at home, what would it be?","Should kids learn to code or learn to build first?"]],["Shots","list",["Opener: the robot turns to someone, mic up","Opener line: \"Quick question from a robot. Got 5 seconds?\"","Each answer: tight on the person, robot mic in frame","Reactions: people laughing, pointing, filming the robot","Wide establishing shot of the spot","Gabriel walking in for the twist, then the line to camera"]],["Where","text","[pick the spot]. Public sidewalks or a park. Ask before filming on private property. Robot at the edge of the walkway, not blocking it."],["Checklist","check",["Pick the spot and time","Charge the robot and the mic","Print releases and bring pens","Quick release from every face used, a parent's for kids","Never mock anyone's answer","Get 5 to 6 usable answers","Film Gabriel's twist line","Cut to 30 to 45 seconds with subtitles","No prices, no pitch"]]],"s":{"hooks":["If a robot could help with one thing at home, what would it be?","We asked Miami: if a robot could help with one thing at home, what would it be?","A robot asked strangers one question, and the answers get more honest","People had opinions. Fast.","Quick question from a robot. Got 5 seconds?"],"body":"ROBOT: Quick question from a robot. Got 5 seconds?\nROBOT: If a robot could help with one thing at home, what would it be?\n[answer 1, word for word]\n[answer 2]\n[answer 3, the one that surprised you]\n[answer 4]\n[answer 5, a kid if there's a signed parent release]\n[B-ROLL: reactions, people filming the robot]\n[the split: who said yes, who said no, in one line]\nGABRIEL (to camera): Robots don't teach here. Kids build them.","cta":"What would you answer? Comment it. Waitlist link in bio.","src":"Plan v2 Robot on the Street format + content.py question list (structure reused; answers are real only)","kind":"adapted","notes":"Unscripted. Quick release from every face, a parent's for kids. Never mock an answer.","fillins":"","format":""}},"personal":[{"time":"9:30 AM","label":"Trial Reel","desc":"Quote reel shown to non-followers","has":true,"title":"The law of the second attempt","s":{"hooks":["the second try is the real one","Nobody remembers your first attempt.","The first try is research. The second one counts.","Most people quit after the first try. That's the expensive part.","Your first attempt already paid for the second one."],"body":"The first attempt is research.\nYou find out what's hard.\nYou find out what you got wrong.\nYou find out what people actually want.\nAnd then most people quit.\nRight after they paid for all that information.\nHonestly? That's the most expensive mistake there is.\nThe second attempt starts with everything the first one taught you.\nThat's the law of the second attempt.\nAnd the only way to waste a failure is to not try again.","cta":"Comment what you're trying for the second time.","src":"New (no old script fit): name-the-law / insight reel","kind":"new","notes":"No personal claim. If you want, add one real second attempt of yours as a [bracket] line before the And.","fillins":"","format":"Insight reel"}},{"time":"1:30 PM","label":"Follower Farming","desc":"Identity list, 25 to 35s","has":true,"title":"10/10 male etiquette but it gets increasingly more niche","s":{"hooks":["10/10 male etiquette but it gets increasingly more niche","etiquette (niche edition)","If you already do three of these etiquette, you're ahead of most people your age","8 etiquette that quietly change everything, and the last one is the hardest","Most people stop at number 3. Number 8 is the one that matters."],"body":"1. Never being on your phone during a meal out\n2. Taking your hat off indoors\n3. Walking on the street side of the sidewalk when you're with her\n4. Pouring someone else's drink before your own\n5. Never being the loudest person in a room that isn't yours\n6. Sending the thank-you message after someone hosts you, even if it's just a text\n7. Never telling a story that makes someone else in the room look bad\n8. And knowing exactly when's the right time to leave, to never become the guest people stop inviting back","cta":"No spoken CTA. The And line is the ending. Caption: which number are you? Comment it.","src":"Style library (Claude export): 10/10 male etiquette v1","kind":"adapted","notes":"He said it did 158k. Posted before, so treat it as a v2 repost: refresh 1 or 2 points. For wider reach you can drop 'male' from the title (he noticed a 6.5M list that never said it). Each point gets a 1 to 4 word on-screen label.","fillins":"","format":""}},{"time":"6:00 PM","label":"My Take","desc":"Personal bet take, 55 to 65s","has":true,"title":"You don't need a big following. You need the right one.","s":{"hooks":["the right 1,000 people","You don't need a million followers.","A small following can change your life if it's the right one.","Stop chasing followers. Chase the right ones.","Why I care less about follower count now"],"body":"You don't need a million followers.\nYou need the right ones.\nHear me out.\nThere's an old idea called 1,000 true fans, from Kevin Kelly.\nIf 1,000 people really care about what you make, you can build a life on that.\nNot a million people scrolling past.\nA thousand people who show up.\nHonestly? I used to chase views.\nNow I care more about who's watching.\nAnd one right person in your comments can change more than ten thousand wrong ones.","cta":"So tell me. Views, or the right people? Comment it.","src":"New (no old script fit): opinion / bet take","kind":"new","notes":"Credit Kevin Kelly's '1,000 True Fans' in the caption.","fillins":"","format":"Personal take"}}]},{"date":"2026-11-19","dow":"Thu","kubot":{"format":"Why Build","title":"Kubot: Why Build","sub":"#9 Math and science made real","hook":"Your kid learned gear ratios today and didn't notice","badge":"","needs":false,"film":[],"sections":[["Plan","rows",[["Show","Why Build? with Gabriel. Gabriel to camera, 45 to 75 seconds."],["Episode","#9 Math and science made real"],["Status","Script drafted below. Gabriel to review before filming."]]],["Inspo","rows",[["Development point","Math and science made real"],["Hook","Your kid learned gear ratios today and didn't notice"],["Do this tonight","Point out gears and motors in things around the house"]]],["Shots","list",["Gabriel to camera, clean audio","B-roll: [Friday class moment that shows the point]","On-screen text: [hook] / [tonight tip]"]],["Where","text","Studio. Filmed on Sunday studio day."],["Checklist","check",["Review the script with Gabriel","Film on Sunday studio day","Cut to 45 to 75 seconds","Add on-screen text and subtitles","No prices, no pitch","Post on Kubot"]]],"s":{"hooks":["Your kid learned gear ratios today and didn't notice","your kid learned gear ratios and didn't notice","Math is a lot more fun when it makes something move.","Kids don't hate math. They hate math that does nothing.","Point at a gear tonight."],"body":"Your kid learned gear ratios today and didn't even notice.\nHere's how.\nThey built a car.\nIt was too slow.\nSo they swapped a small gear for a big one.\nNow it's fast, but it can't climb.\nSwap it back.\nThat's a gear ratio.\nThat's force and speed.\nOn a worksheet, it's boring.\nOn a robot they built, it's the best problem in the world.\nSame math.\nDifferent reason to care.\nTonight, point out gears and motors around the house.\nThe blender. A bike. A clock.\nAsk what would happen if the gear was bigger.\nWhere did your kid find a gear?","cta":"Tonight: point out gears and motors around the house. Comment where your kid found one. Waitlist link in bio.","src":"Plan v2 Why Build bank #9 (Math and science made real): hook and tonight tip reused, new body","kind":"new","notes":"New body written from the plan v2 episode bank hook and 'do this tonight'. Concept-led, so no story from Gabriel is needed. Gabriel should adjust any line that isn't how he'd say it.","fillins":"","format":""}},"personal":[{"time":"9:30
