<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<title>Denis Calendar</title>
<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --text:#000000; --sub:rgba(60,60,67,.6); --sep:rgba(60,60,67,.29);
  --accent:#007AFF; --fill:rgba(120,120,128,.12); --bar:rgba(249,249,249,.94); --dot-p:#8E8E93;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#000000; --card:#1C1C1E; --text:#FFFFFF; --sub:rgba(235,235,245,.6); --sep:rgba(84,84,88,.6);
    --accent:#0A84FF; --fill:rgba(120,120,128,.24); --bar:rgba(22,22,24,.94); --dot-p:#98989D; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:17px;line-height:1.35;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
.wrap{max-width:680px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
header.top{padding:calc(12px + env(safe-area-inset-top)) 4px 8px;display:flex;align-items:flex-end;justify-content:space-between;gap:8px;min-height:96px}
header.top h1{font-size:34px;line-height:1.15;font-weight:700;letter-spacing:.2px;margin:0}
header.top .date{color:var(--sub);font-size:15px;margin-top:2px}
.btn{min-height:48px;min-width:48px;display:inline-flex;align-items:center;justify-content:center;color:var(--accent);font-size:17px;border-radius:10px;padding:0 10px}
.btn:active{opacity:.4}
.btn svg{width:22px;height:22px}
.note{color:var(--sub);font-size:15px;padding:0 4px 8px}
.section-h{color:var(--sub);font-size:13px;text-transform:uppercase;letter-spacing:.3px;padding:18px 16px 6px}
.group{background:var(--card);border-radius:10px;overflow:hidden}
.row{display:flex;align-items:center;min-height:64px;position:relative;width:100%;text-align:left}
.row + .row::before{content:"";position:absolute;top:0;right:0;left:60px;border-top:.5px solid var(--sep)}
.check{flex:0 0 56px;height:64px;display:flex;align-items:center;justify-content:center;align-self:stretch}
.check i{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--sub);display:block;position:relative;transition:background .15s}
.check[aria-checked="true"] i{background:var(--accent);border-color:var(--accent)}
.check[aria-checked="true"] i::after{content:"";position:absolute;left:8.5px;top:4.5px;width:6px;height:11px;border:solid #fff;border-width:0 2.2px 2.2px 0;transform:rotate(45deg)}
.open{flex:1;min-width:0;display:flex;align-items:center;align-self:stretch;padding:10px 12px 10px 0;gap:8px;text-align:left}
.open:active{background:var(--fill)}
.txt{flex:1;min-width:0}
.meta{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:6px;margin-bottom:1px}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;background:var(--dot-p)}
.dot.k{background:var(--accent)}
.title{font-size:17px;font-weight:400;overflow-wrap:anywhere}
.done .title{color:var(--sub);text-decoration:line-through;text-decoration-color:var(--sub)}
.subt{font-size:15px;color:var(--sub);margin-top:1px;overflow-wrap:anywhere}
.film{font-size:15px;color:var(--text);margin-top:3px}
.film b{font-weight:600}
.chev{flex:0 0 10px;width:10px;height:16px;color:var(--sep)}
.card{background:var(--card);border-radius:10px;padding:14px 16px}
.card h2{font-size:17px;margin:0 0 4px;font-weight:600}
.card p{margin:0 0 10px;color:var(--sub);font-size:15px}
.mix{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 16px;font-size:15px}
.mix div{display:flex;gap:8px;min-width:0}
.mix span{color:var(--sub);flex:0 0 34px}
/* week */
.navrow{display:flex;align-items:center;justify-content:space-between;padding:0 0 4px}
.navrow .range{font-size:17px;font-weight:600}
.wrow{display:flex;align-items:center;min-height:64px;width:100%;position:relative;padding:8px 12px 8px 0;text-align:left}
.wrow + .wrow::before{content:"";position:absolute;top:0;right:0;left:64px;border-top:.5px solid var(--sep)}
.wrow:active{background:var(--fill)}
.wd{flex:0 0 64px;text-align:center}
.wd small{display:block;font-size:12px;color:var(--sub);text-transform:uppercase;letter-spacing:.3px}
.wd b{display:inline-flex;width:34px;height:34px;align-items:center;justify-content:center;border-radius:50%;font-size:19px;font-weight:500}
.wrow.today .wd b{background:var(--accent);color:#fff}
.wf{flex:1;min-width:0}
.wf .title{font-size:17px}
.badge{font-size:13px;color:var(--sub);margin-top:1px}
.pd{display:flex;gap:6px;flex:0 0 auto;padding-left:8px}
.pd i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--dot-p);display:block}
.pd i.on{background:var(--accent);border-color:var(--accent)}
.kd{color:var(--accent);font-size:15px;margin-left:4px}
/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs button{flex:0 1 200px;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--sub)}
nav.tabs button[aria-selected="true"]{color:var(--accent)}
nav.tabs svg{width:26px;height:26px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s;z-index:10}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:680px;max-height:92vh;max-height:92dvh;background:var(--bg);border-radius:12px 12px 0 0;transform:translateY(105%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s linear .3s;z-index:11;display:flex;flex-direction:column;box-shadow:0 -2px 20px rgba(0,0,0,.15)}
.sheet.on{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--sep);margin:6px auto 0}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 20px;gap:8px}
.sheet .sh .t{font-size:13px;color:var(--sub);display:flex;gap:6px;align-items:center;min-width:0}
.sheet .sbody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px calc(28px + env(safe-area-inset-bottom))}
.sheet h3{font-size:24px;line-height:1.2;font-weight:700;margin:2px 4px 2px;overflow-wrap:anywhere}
.sheet .ssub{color:var(--sub);font-size:15px;margin:0 4px 10px}
.drow{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 16px;width:100%;text-align:left;position:relative}
.drow + .drow::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.drow.check{flex:none;height:auto;width:100%;justify-content:flex-start;align-self:auto}
.sheet .sh .btn{min-height:52px}
.drow.link{color:var(--accent)}
.kv{padding:10px 16px;position:relative}
.kv + .kv::before,.li + .li::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.kv .k{font-size:13px;color:var(--sub)}
.kv .v{font-size:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.pre{padding:12px 16px;white-space:pre-wrap;font-size:16px;line-height:1.5;overflow-wrap:anywhere}
.li{padding:11px 16px 11px 40px;position:relative;font-size:16px;overflow-wrap:anywhere}
.li::after{content:"";position:absolute;left:18px;top:19px;width:6px;height:6px;border-radius:50%;background:var(--sub)}
.li.ck::after{width:13px;height:13px;top:15px;left:15px;background:none;border:1.5px solid var(--sub)}
.filmbox{margin-top:4px}
.filmbox .ft{padding:12px 16px 2px;font-weight:600;font-size:17px}
.filmbox .fn{padding:0 16px 10px;color:var(--sub);font-size:15px}
.empty{padding:14px 16px;color:var(--sub)}
@media (min-width:700px){
  .sheet{bottom:auto;top:50%;border-radius:14px;transform:translateY(-40%) scale(.98);opacity:0;pointer-events:none;transition:transform .25s,opacity .2s,visibility 0s linear .25s;max-height:86vh}
  .sheet.on{transform:translateY(-50%);opacity:1;pointer-events:auto;transition:transform .25s,opacity .2s}
  .sheet .grab{visibility:hidden}
}
[hidden]{display:none !important}
.sheet:focus{outline:none}
button:focus:not(:focus-visible){outline:none}
</style>
</head>

</div>

const DATA = {"generated":"2026-10-18 14:18","start":"2026-10-19","end":"2026-12-06","mix":{"line":"Sunday is studio day: film both Why Build episodes and the podcast. Film the street video on Wednesday or earlier. Film Denis Builds any time. Friday's class is the only timed block.","days":[["Mon","Why Build"],["Tue","Denis Builds"],["Wed","Robot on the Street"],["Thu","Why Build"],["Fri","Denis Builds + class 3:30 PM"],["Sat","Testimonial"],["Sun","Podcast"]],"personal":"You: 9:30 AM Trial Reel, 1:30 PM Follower Farming, 6:00 PM My Take."},"days":[{"date":"2026-10-19","dow":"Mon","kubot":{"format":"Why Build","title":"Kubot: Why Build","sub":"#2 Handling frustration","hook":"let the robot fail","badge":"","film":[],"sections":[["Plan","rows",[["Show","Why Build? with Gabriel. Gabriel to camera, 45 to 75 seconds."],["Episode","#2 Handling frustration"],["Status","Script ready."]]],["Inspo","rows",[["Text hook","let the robot fail"],["On screen","\"a failed build is information\" / \"tonight: wait two minutes\""],["Optional real moment","Only if it's true, in Gabriel's own words, after \"It tells them where to look next.\" Never required."]]],["Script","text","The best thing that can happen to your kid is a robot that doesn't work.\nEvery parent wants to fix it for them.\nThat's love.\nBut sometimes helping is the thing that slows them down.\nThe kid who stares at it, frowning.\nThe kid who tries the same wire again.\nThe kid who finally figures it out, and you can see it on their face.\nHere's why.\nA robot that doesn't move isn't a bad grade.\nIt's information.\nIt tells them where to look next.\nSame with a 3D print that fails.\nA perfect print teaches them to press a button.\nA failed one teaches them how it actually works.\nIf you grew up fixing your own bike, you already know this feeling.\nThat stuck feeling isn't failure.\nIt's the lesson.\nSo tonight, when they get stuck, give it two minutes before you step in.\nThen ask, \"what have you tried?\"\nBe honest.\nDo you jump in, or do you wait?"],["Caption","rows",[["Caption","The best thing that can happen to your kid is a robot that doesn't work. A failed build tells them exactly where to look next. Wait two minutes before you fix it. Be honest, do you jump in or wait? 👇"],["Spanish line","Lo mejor que le puede pasar es un robot que no funciona."]]],["Shots","list",["Gabriel to camera, clean audio","B-roll: A robot failing and a kid fixing it (Friday class footage)","On-screen text: \"a failed build is information\" / \"tonight: wait two minutes\""]],["Where","text","Studio. Filmed on Sunday studio day."],["Checklist","check",["Film on Sunday studio day","Cut to 45 to 75 seconds","Add on-screen text and subtitles","English caption, Spanish line","No prices, no pitch","Post on Kubot","Reply to comments in the first hour"]]]},"personal":[{"time":"9:30 AM","label":"Trial Reel","desc":"Quote reel shown to non-followers","has":true,"title":"There are 3 things you can sell, but the internet changed the last one forever","hook":"\"There are 3 things you can sell.\" I stopped selling [time or things] and started selling [mind/content]. And [why you had to].","script":"ON-SCREEN TEXT HOOK: 3 things you can sell\n\n(1 HOOK)\n\"There are 3 things you can sell:\"\nDan Koe posted that, and [one line on why it hit you].\n\"1) Your time, capped at 24 hours\"\nI used to sell [the time-based thing you actually did, e.g. hours in the agency / car washes / delivery runs].\nAnd [why that ceiling started to bother you].\n\n(2 RISING ACTION)\n\"2) Your things, capped by inventory\"\nHonestly? Trading hours for money feels safe until you do the math.\n[B-ROLL: real work from the old model, calendar, invoices, or content drafts]\nSo I [first real move toward selling your mind, e.g. posted daily / packaged what you knew / recorded a script].\nThen [second real action].\n\"3) Your mind, for all of history, capped by how many rooms you could be in\"\n[one honest line on how limited that used to feel before social].\n\n(3 SECOND CONFLICT)\nThen [the midpoint setback, e.g. posting into the void / clients drying up / nobody watching].\n[one honest line on wanting to go back to selling time because it felt clearer].\n\n(4 CLIMAX) [MUSIC: beat drop. Tip: use a song from one of your favorite movies]\n\"Social media changed that completely.\"\nI didn't go back. [what you did instead].\n[the moment one piece of your mind reached past one room].\n[B-ROLL: that exact moment, slowed down]\n\n(5 RESOLUTION)\n[where that shift left you, said plainly].\n\"A brain and an internet connection can change your life.\"\nI'm 21. I'm still selling what I figure out, not just my hours.\nAnd the room I'm in now is a lot bigger than the one I started in.","fillins":"- [one line on why the quote hit you]\n- [the time-based thing you actually did] + [why that ceiling bothered you]\n- [first real move toward selling your mind] and [second real action]\n- [how limited \"rooms\" felt before social]\n- [the midpoint setback] + [wanting to go back to selling time]\n- [what you did instead] + [the moment one piece of your mind reached past one room]\n- [where that shift left you]\n- Keep the 1/2/3 quote lines exact and in order. B-roll from the old model and the new one.","status":"To record"},{"time":"1:30 PM","label":"Follower Farming","desc":"Identity list, 25 to 35s","has":true,"title":"How you explain what you do at a party tells me how clear your vision is (identity edition)","hook":"How you explain what you do at a party tells me how clear your vision is. Identity edition.","script":"ON-SCREEN TEXT HOOK: your party intro exposes you\nON-SCREEN: a \"clarity meter\" that fills with each point (shown on screen, not spoken).\n\nHow you explain what you do at a party tells me how clear your vision is. Identity edition.\n1. \"Uh, it's complicated.\" You just lost them. [METER 10%]\n2. Your job title, and nothing else. Safe, but forgettable. [METER 20%]\n3. What you do in one plain sentence, to a stranger who has zero context. [METER 35%]\n4. The problem you solve before the company name. [METER 50%]\n5. A story about one customer, not a pitch deck. [METER 60%]\n6. What you're building toward in under 10 seconds, to make someone lean in instead of nod politely. [METER 75%]\n7. Asking them a question back before they can change the subject. [METER 90%]\n8. And explaining it so simply your grandma would get it, because if she doesn't, neither does the room. [METER 100%]\nTag the friend who's stuck at 10%.","fillins":"None (no personal details).","status":"To record"},{"time":"6:00 PM","label":"My Take","desc":"Personal bet take, 55 to 65s","has":true,"title":"AI agents just raised $12M to handle your billing, and I'm betting on the people who get this early","hook":"AI agents just raised 12 million dollars to handle billing and payments.","script":"ON-SCREEN TEXT HOOK: agents that do the books\n\nAI agents just raised 12 million dollars to handle billing and payments.\nFragment announced a Series A led by FirstMark on October 14.\nThe pitch is simple. Let AI agents safely run billing, payments, and accounting.\nNot just chat. Actual money movement, with controls so they don't break the books.\nMost people hear that and think, cool, less busywork.\nI think about who wins when agents run more of the business.\n\nSo yeah, I know how it looks. I'm 21, [your line, e.g. the real thing you gave up or risked to do this], and I'm betting on people who understand AI and robots early, not just chatbots.\nWhy am I doing it?\nBecause the companies that win the next decade won't only talk to AI.\nThey'll let it operate. Carefully. With systems built for it.\nMy bet is the people who learn how this stuff works now are the ones who won't get steamrolled by it later.\nAnd if I'm wrong, I'd rather be early than explaining why I waited.\n\nSo tell me. AI agents running billing and payments. Liberating, or terrifying?","fillins":"- [your line]: the real thing you gave up o :"Script coming"}]},{"date":"2026-10-22","dow":"Thu","kubot":{"format":"Why Build","title":"Kubot: Why Build","sub":"#6 Confidence","hook":"the shy kid changes","badge":"","film":[],"sections":[["Plan","rows",[["Show","Why Build? with Gabriel. Gabriel to camera, 45 to 75 seconds."],["Episode","#6 Confidence"],["Status","Script ready."]]],["Inspo","rows",[["Text hook","the shy kid changes"],["On screen","\"the robot takes the spotlight\" / \"tonight: let them teach you\""],["Optional real moment","Only if it's true, in Gabriel's own words, after \"And someone asks how it works.\" Never required."]]],["Script","text","I've watched shy kids change in one hour.\nNot because someone told them to speak up.\nHonestly, telling a shy kid to speak up almost never works.\nThe kid who hides behind mom at drop off.\nThe kid who won't say their name in the circle.\nThen they finish a robot.\nAnd someone asks how it works.\nHere's the thing.\nThey're not talking about themselves anymore.\nThey're talking about the thing they made.\nThat's easier.\nThe robot takes the spotlight off them.\nAnd nobody in the room knows that robot better than they do.\nEvery time they explain it, it gets a little easier.\nThat's confidence.\nIt comes from knowing something, not from being told to be brave.\nTonight, ask your kid to teach you how they made something.\nAnything.\nThen follow their steps exactly.\nWhat could your kid explain for an hour?"],["Caption","rows",[["Caption","Telling a shy kid to speak up almost never works. Asking how their robot works does. When they explain what they made, the spotlight is on the robot, not on them. What could your kid explain for an hour? 👇"],["Spanish line","He visto a niños tímidos cambiar en una hora."]]],["Shots","list",["Gabriel to camera, clean audio","B-roll: A kid explaining their robot to camera (Friday class footage)","On-screen text: \"the robot takes the spotlight\" / \"tonight: let them teach you\""]],["Where","text","Studio. Filmed on Sunday d explains their robot, with a parent on mic. Only if release-cleared.\n5. What to try tonight (5 min): one tip for parents.\n6. Close (2 min): tease next week."],["Questions","list",["Which street answer surprised you most? [play the clip]","Would you let a robot teach your kid? Why or why not?","What's the difference between a kid using a robot and building one?","What are parents scared of with AI, and what do you tell them?","What happens in a kid's head the first time their robot moves?","If a parent is worried about screens, what can they try tonight?","What broke this week, and what's next before the store opens?"]],["Shots","list",["Wide two-shot, plus a single on each host","Print farm and robots visible behind","Clip targets: one Gabriel line that stands alone, one parent tip for tonight"]],["Where","text","Studio. Audio: the podcast mics, test recording first."],["Checklist","check",["Upload the full episode to YouTube and Spotify","Cut one clip for Kubot","Mark 5 to 8 clips for later","No prices, no pitch","Reply to comments in the first hour"]]]},"personal":[{"time":"9:30 AM","label":"Trial Reel","desc":"Quote reel shown to non-followers","has":false,"title":"Script coming"},{"time":"1:30 PM","label":"Follower Farming","desc":"Identity list, 25 to 35s","has":false,"title":"Script coming"},{"time":"6:00 PM","label":"My Take","desc":"Personal bet take, 55 to 65s","has":false,"title":"Script coming"}]},{"date":"2026-10-26","dow":"Mon","kubot":{"format":"Why Build","title":"Kubot: Why Build","sub":"#12 Ready for an AI future","hook":"AI can't do this","badge":"","film":[],"sections":[["Plan","rows",[["Show","Why Build? with Gabriel. Gabriel to camera, 45 to 75 seconds."],["Episode","#12 Ready for an AI future"],["Status","Script ready."]]],["Inspo","rows",[["Text hook","AI can't do this"],["On screen","\"guess, test, try again\" / \"tonight: how does that work?\""],["Optional real moment","Only if it's true, in Gabriel's own words, after \"Every build runs on that loop.\" Never required."]]],["Script","text","There's one skill AI can't replace in your kid.\nAnd it's not being good with screens.\nIt's figuring out why something doesn't work.\nAI can write the answer.\nIt can't stand at the table with a wire in the wrong spot, and care enough to try again.\nThe kid who wants to see inside.\nThe kid who opens it up instead of asking for a new one.\nHonestly, it's the stuff a lot of us wished we had as kids.\nHere's the skill.\nGuess. Test. Wrong. Try again.\nEvery build runs on that loop.\nThe motor doesn't spin, so they check the wire.\nStill nothing, so they check the battery.\nThat loop is how builders think, and kids can start it young.\nTonight, point at one thing in your house.\nThe toaster. The car window.\nAsk, \"how do you think that works?\"\nLet them be wrong.\nWhat does your kid always want to take apart?"],["Caption","rows",[["Caption","AI can write the answer. It can't care enough to try the next wire. Guess, test, try again. That's the skill. Dads, this is the stuff we wished we had as kids. What does your kid always want to take apart? 👇"],["Spanish line","La habilidad que la IA no puede reemplazar: descubrir por qué algo no funciona."]]],["Shots","list",["Gabriel to camera, clean audio","B-roll: A kid checking wires and testing again (Friday class footage)","On-screen text: \"guess, test, try again\" / \"tonight: how does that work?\""]],["Where","text","Studio. Filmed on Sunday studio day."],["Checklist","check",["Film on Sunday studio day","Cut to 45 to 75 seconds","Add on-screen text and subtitles","English caption, Spanish line","No prices, no pitch","Post on Kubot","Reply to comments in the first hour"]]]},"personal":[{"time":"9:30 AM","label":"Trial Reel","desc":"Quote reel shown to non-followers","has":false,"title":"Script coming"},{"time":"1:30 PM","label":"Follower Farming","desc":"Identity list, 25 to 35s","has":false,"title":"Script coming"},{"time":"6:00 PM","label":"My Take","desc":"Persona teps in at the end: \"Robots don't teach here. Kids build them.\""],["Goal","5 to 6 good answers, a split reaction, then the twist. 30 to 45 seconds."],["When to film","Today or earlier."]]],["Questions","list",["Would you let a robot teach your kid?","Would you rather your kid use robots or build them?","What should kids learn that school doesn't teach?","Would your kid rather have an iPad or build a robot?","Are you scared of AI for your kids?","What did you build as a kid?","If a robot could help with one thing at home, what would it be?","Should kids learn to code or learn to build first?"]],["Shots","list",["Opener: the robot turns to someone, mic up","Opener line: \"Quick question from a robot. Got 5 seconds?\"","Each answer: tight on the person, robot mic in frame","Reactions: people laughing, pointing, filming the robot","Wide establishing shot of the spot","Gabriel walking in for the twist, then the line to camera"]],["Where","text","[pick the spot]. Public sidewalks or a park. Ask before filming on private property. Robot at the edge of the walkway, not blocking it."],["Checklist","check",["Pick the spot and time","Charge the robot and the mic","Print releases and bring pens","Quick release from every face used, a parent's for kids","Never mock anyone's answer","Get 5 to 6 usable answers","Film Gabriel's twist line","Cut to 30 to 45 seconds with subtitles","No prices, no pitch"]]]},"personal":[{"time":"9:30 AM","label":"Trial Reel","desc":"Quote reel shown to non-followers","has":false,"title":"Script coming"},{"time":"1:30 PM","label":"Follower Farming","desc":"Identity list, 25 to 35s","has":false,"title":"Script coming"},{"time":"6:00 PM","label":"My Take","desc":"Personal bet take, 55 to 65s","has":false,"title":"Script coming"}]},{"date":"2026-10-29","dow":"Thu","kubot":{"format":"Why Build","title":"Kubot: Why Build","sub":"#18 How to praise a build","hook":"stop saying good job","badge":"","film":[],"sections":[["Plan","rows",[["Show","Why Build? with Gabriel. Gabriel to camera, 45 to 75 seconds."],["Episode","#18 How to praise a build"],["Status","Script ready."]]],["Inspo","rows",[["Text hook","stop saying good job"],["On screen","\"praise how they think\" / \"tonight: how did you figure that out?\""],["Optional real moment","Only if it's true, in Gabriel's own words, after \"Now watch them.\" Never required."]]],["Script","text","Never say \"good job\" to a kid who built something.\nI know.\nIt sounds harsh.\n\"Good job\" is nice.\nIt's also where the conversation ends.\nThey smile.\nYou move on.\nAnd the thinking they just did disappears.\nTry this instead.\n\"How did you figure that out?\"\nNow watch them.\nThe kid who points at every piece.\nThe kid who walks you through the part that broke.\nHere's why it works.\n\"Good job\" praises the robot.\n\"How did you figure that out?\" praises how they think.\nAnd how they think is the part they keep for the next build.\nTonight, skip \"good job.\"\nAsk how they figured it out.\nThen wait.\nWhat does your kid say when you ask?"],["Caption","rows",[["Caption","\"Good job\" ends the conversation. \"How did you figure that out?\" starts one. Try it tonight and tell me what they said 👇"],["Spanish line","No digas \"muy bien.\" Pregunta cómo lo resolvió."]]],["Shots","list",["Gabriel to camera, clean audio","B-roll: A kid walking a parent through their build (Friday class footage)","On-screen text: \"praise how they think\" / \"tonight: how did you figure that out?\""]],["Where","text","Studio. Filmed on Sunday studio day."],["Checklist","check",["Film on Sunday studio day","Cut to 45 to 75 seconds","Add on-screen text and subtitles","English caption, Spanish line","No prices, no pitch","Post on Kubot","Reply to comments in the first hour"]]]},"personal":[{"time":"9:30 AM","label":"Trial Reel","desc":"Quote reel shown to non-followers","has":false,"title":"Script coming"},{"time":"1:30 PM","label":"Follower Farming","desc":"Identity list, 25 to 35s","has":false,"tit (function(){

const $ = id => document.getElementById(id);

let done = {}; try { done = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { done = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (e) {} };
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d, 12); };
const iso = dt => dt.getFullYear() + "-" + String(dt.getMonth()+1).padStart(2,"0") + "-" + String(dt.getDate()).padStart(2,"0");
const add = (s, n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const nice = s => { const d = parse(s); return DOW[d.getDay()] + ", " + MON[d.getMonth()] + " " + d.getDate(); };
function realToday(){
  const p = new Intl.DateTimeFormat("en-CA",{timeZone:"America/New_York",year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(new Date());
  const g = t => p.find(x => x.type === t).value; return g("year")+"-"+g("month")+"-"+g("day");
}
const FIRST = DAYS[0].date, LAST = DAYS[DAYS.length-1].date;
const clamp = s => s < FIRST ? FIRST : (s > LAST ? LAST : s);
const TODAY = realToday();
let dayShown = clamp(TODAY), weekStart = mondayOf(clamp(TODAY));
function mondayOf(s){ const d = parse(s); const k = (d.getDay()+6)%7; d.setDate(d.getDate()-k); return iso(d); }
const chev = '<svg class="chev" viewBox="0 0 10 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2l6 6-6 6"/></svg>';

  const k = day.kubot;

  day.personal.forEach((p,i) => out.push({id: day.date+":p"+i, kind:"p", meta:p.time + " \u00b7 Personal", title:p.label, sub:p.title, src:p}));
  return out;
}
function checkBtn(id, label){

  return '<button class="check" role="checkbox" aria-checked="'+on+'" aria-label="Done: '+esc(label)+'" data-id="'+esc(id)+'"><i></i></button>';
}
function renderToday(){
  const d = BY[dayShown], isToday = dayShown === TODAY;
  $("t-h").textContent = isToday ? "Today" : DOW[parse(dayShown).getDay()];
  $("t-date").textContent = isToday ? nice(dayShown) : MON[parse(dayShown).getMonth()] + " " + parse(dayShown).getDate();
  $("t-back").hidden = isToday || clamp(TODAY) === dayShown;
  const n = $("t-note");
  if (TODAY < FIRST && dayShown === FIRST) { n.hidden = false; n.textContent = "The plan starts " + nice(FIRST) + "."; }
  else if (TODAY > LAST && dayShown === LAST) { n.hidden = false; n.textContent = "The plan ended " + nice(LAST) + "."; }
  else n.hidden = true;
  $("t-list").innerHTML = items(d).map(it => {
    let film = "";
    if (it.film && it.film.length) film = '<div class="film"><b>Film today:</b> ' + it.film.map(f => esc(f.short || f.what)).join(", ") + '</div>';
    return '<div class="row'+(done[it.id]?' done':'')+'" role="listitem">' + checkBtn(it.id, it.title) +
      '<button class="open" data-open="'+esc(it.id)+'"><div class="txt"><div class="meta"><span class="dot'+(it.kind==="k"?" k":"")+'"></span>'+esc(it.meta)+'</div>' +
      '<div class="title">'+esc(it.title)+'</div>' + (it.sub ? '<div class="subt">'+esc(it.sub)+'</div>' : '') + film + '</div>' + chev + '</button></div>';
  }).join("");
}
function renderPlan(){

    m.days.map(x => '<div><span>'+esc(x[0])+'</span>'+esc(x[1])+'</div>').join("") + '</div><p style="margin:10px 0 0">' + esc(m.personal) + '</p>';

  $("w-range").textContent = MON[a.getMonth()] + " " + a.getDate() + " to " + (a.getMonth()===b.getMonth() ? "" : MON[b.getMonth()] + " ") + b.getDate();
  $("w-prev").disabled = weekStart <= FIRST; $("w-prev").style.opacity = weekStart <= FIRST ? .3 : 1;
  $("w-next").disabled = end >= LAST; $("w-next").style.opacity = end >= LAST ? .3 : 1;
  let h = "";
  for (let i = 0; i < 7; i++){
    const ds = add(weekStart, i), d = BY[ds], dt = parse(ds);
    if (!d) continue;
    const kd = done[ds+":k"] ? '<span class="kd" aria-label="done">\u2713</span>' : "";
    const dots = d.personal.map((p,j) => '<i class="'+(done[ds+":p"+j]?"on":"")+'" title="'+esc(p.time+" "+p.label)+'"></i>').join("");
    h += '<button class="wrow'+(ds===TODAY?" today":"")+'" data-day="'+ds+'"><div class="wd"><small>'+DOW[dt.getDay()].slice(0,3)+'</small><b>'+dt.getDate()+'</b></div>' +
      '<div class="wf"><div class="title">'+esc(d.kubot.format)+kd+'</div>' + (d.kubot.badge ? '<div class="badge">'+esc(d.kubot.badge)+'</div>' : '') + '</div>' +
      '<div class="pd" aria-label="Personal posts done: '+d.personal.filter((p,j)=>done[ds+":p"+j]).length+' of 3">'+dots+'</div></button>';
  }
  $("w-list").innerHTML = h;
}
function secHTML(s){
  const [h, t, v] = s; let body = "";
  if (t === "text") body = '<div class="pre">'+esc(v)+'</div>';
  else if (t === "rows") body = v.map(r => '<div class="kv"><div class="k">'+esc(r[0])+'</div><div class="v">'+esc(r[1])+'</div></div>').join("");
  else body = v.map(x => '<div class="li'+(t==="check"?" ck":"")+'">'+esc(x)+'</div>').join("");
  return '<div class="section-h">'+esc(h)+'</div><div class="group">'+body+'</div>';
}
let sheetId = null, lastFocus = null;
function openSheet(id){
  const [ds, part] = id.split(":"), d = BY[ds]; if (!d) return;
  const it = items(d).find(x => x.id === id); if (!it) return;
  sheetId = id; lastFocus = document.activeElement;
  $("s-meta").innerHTML = '<span class="dot'+(it.kind==="k"?" k":"")+'"></span>' + esc(nice(ds) + " \u00b7 " + it.meta);
  let h = '<h3 id="s-title">'+esc(it.title)+'</h3>' + (it.sub ? '<div class="ssub">'+esc(it.sub)+'</div>' : '');
  h += '<div class="group"><button class="drow check" role="checkbox" aria-checked="'+(!!done[id])+'" data-id="'+esc(id)+'"><i></i><span>Mark as done</span></button></div>';
  if (it.kind === "k"){
    const k = it.src;
    if (k.film && k.film.length){
      h += '<div class="section-h">Film today</div><div class="group filmbox">';
      k.film.forEach(f => {
        h += '<div class="ft">'+esc(f.what)+'</div>' + (f.note ? '<div class="fn">'+esc(f.note)+'</div>' : '');
        if (f.ref && BY[f.ref]) h += '<button class="drow link" data-open="'+esc(f.ref+":k")+'">Open the '+esc(MON[parse(f.ref).getMonth()]+" "+parse(f.ref).getDate())+' plan</button>';
      });
      h += '</div>';
      k.film.forEach(f => (f.sections || []).forEach(s => h += secHTML(s)));
    }
    k.sections.forEach(s => h += secHTML(s));
  } else {
    const p = it.src;
    h += secHTML(["What this post is", "rows", [["Time", p.time], ["Format", p.desc]]]);
    if (p.has){
      if (p.hook) h += secHTML(["Hook", "text", p.hook]);
      if (p.script) h += secHTML(["Script", "text", p.script]);
      if (p.fillins) h += secHTML(["Fill-ins", "text", p.fillins]);
    } else {
      h += '<div class="section-h">Script</div><div class="group"><div class="empty">Script coming. It will show here once it is in the scripts sheet.</div></div>';
    }
  }
  $("s-body").innerHTML = h; $("s-body").scrollTop = 0;
  $("scrim").classList.add("on"); $("sheet").classList.add("on");
  setTimeout(() => $("sheet").focus({preventScroll:true}), 50);
}
function closeSheet(){ sheetId = null; $("scrim").classList.remove("on"); $("sheet").classList.remove("on"); if (lastFocus && lastFocus.focus) lastFocus.focus(); }
function show(view){
  $("v-today").hidden = view !== "today"; $("v-week").hidden = view !== "week";
  $("tab-today").setAttribute("aria-selected", view === "today"); $("tab-week").setAttribute("aria-selected", view === "week");
  if (view === "week") renderWeek(); else renderToday();
  window.scrollTo(0,0);
}
document.addEventListener("click", e => {
  const c = e.target.closest(".check");
  if (c){ const id = c.dataset.id; done[id] = !done[id]; if (!done[id]) delete done[id]; save();
    document.querySelectorAll('.check[data-id="'+id+'"]').forEach(b => b.setAttribute("aria-checked", !!done[id]));
    renderToday(); if (!$("v-week").hidden) renderWeek(); return; }
  const o = e.target.closest("[data-open]"); if (o){ openSheet(o.dataset.open); return; }
  const w = e.target.closest("[data-day]"); if (w){ dayShown = w.dataset.day; show("today"); return; }
});
$("tab-today").onclick = () => { show("today"); };
$("tab-week").onclick = () => { weekStart = mondayOf(dayShown); show("week"); };
$("t-back").onclick = () => { dayShown = clamp(TODAY); renderToday(); };
$("w-prev").onclick = () => { if (weekStart > FIRST){ weekStart = add(weekStart,-7); renderWeek(); } };
$("w-next").onclick = () => { if (add(weekStart,6) < LAST){ weekStart = add(weekStart,7); renderWeek(); } };
$("w-today").onclick = () => { weekStart = mondayOf(clamp(TODAY)); renderWeek(); };
$("scrim").onclick = closeSheet; $("s-close").onclick = closeSheet;
document.addEventListener("keydown", e => { if (e.key === "Escape" && sheetId) closeSheet(); });
window.__app = { openSheet, show, setDay: d => { dayShown = d; renderToday(); } };
renderPlan(); show(location.hash === "#week" ? "week" : "today");
})();
</script>
