<style>
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --text:#000000; --sub:rgba(60,60,67,.6); --sep:rgba(60,60,67,.29);
  --accent:#007AFF; --tint:rgba(0,122,255,.08); --fill:rgba(120,120,128,.12); --bar:rgba(255,255,255,.88); --dot-p:#8E8E93;
  color-scheme:light only;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:17px;line-height:1.35;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:left}
.wrap{max-width:1440px;margin:0 auto;padding:0 16px calc(32px + env(safe-area-inset-bottom))}
/* top bar */
.top{position:sticky;top:0;z-index:5;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep);padding:calc(6px + env(safe-area-inset-top)) 0 6px}
.top .in{max-width:1440px;margin:0 auto;padding:0 16px}
.titlerow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:28px;line-height:1.2;font-weight:700;margin:4px 0 0;letter-spacing:.2px}
.subt{color:var(--sub);font-size:15px}
.ctrls{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.seg{display:inline-flex;background:var(--fill);border-radius:10px;padding:2px}
.seg button{min-height:44px;min-width:76px;padding:0 14px;border-radius:8px;font-size:15px;font-weight:500;text-align:center;color:var(--text)}
.seg button[aria-selected="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.nav{display:flex;align-items:center}
.btn{min-height:48px;min-width:48px;display:inline-flex;align-items:center;justify-content:center;color:var(--accent);font-size:17px;border-radius:10px;padding:0 10px;text-align:center}
.btn:active{opacity:.4}
.btn[disabled]{opacity:.3;cursor:default}
.btn svg{width:22px;height:22px}
@media (max-width:359px){ .mgrid{margin-left:-14px;margin-right:-14px;border-radius:8px} .top .in{padding:0 10px} .seg button{min-width:60px;padding:0 10px} .nav .btn{min-width:44px;padding:0 6px} .ctrls{gap:4px} }
.note{color:var(--sub);font-size:15px;padding:12px 4px 0}
/* week */
.week{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;padding-top:4px}
.day{min-width:0;scroll-margin-top:140px}
.dh{display:flex;align-items:center;gap:10px;padding:14px 4px 8px;min-height:56px}
.dh .dn{display:inline-flex;width:36px;height:36px;border-radius:50%;align-items:center;justify-content:center;font-size:19px;font-weight:600;flex:0 0 36px}
.dh .dw{font-size:15px;font-weight:600}
.dh .dm{font-size:13px;color:var(--sub)}
.dh .badge{margin-left:auto;font-size:13px;color:var(--sub);text-align:right}
.day.today .dn{background:var(--accent);color:#fff}
.day.today .dw{color:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.card{position:relative;background:var(--card);border-radius:12px;min-height:118px;display:flex;border:1px solid transparent;box-shadow:0 .5px 0 rgba(0,0,0,.04)}
.card.needs{background:transparent;border:1px dashed var(--sep);box-shadow:none}
.day.today .card:not(.needs){border-color:var(--tint);box-shadow:0 0 0 1px var(--tint)}
.copen{flex:1;min-width:0;display:flex;flex-direction:column;align-items:stretch;padding:10px 12px 10px;border-radius:12px}
.copen:active{background:var(--fill)}
.lab{font-size:11px;color:var(--sub);display:flex;align-items:center;gap:5px;padding-right:30px;min-height:22px;text-transform:uppercase;letter-spacing:.2px;font-weight:600}
.lab span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 7px;background:var(--dot-p)}
.dot.k{background:var(--accent)}
.lab.k{color:var(--accent)}
.ttl{font-size:15px;line-height:1.3;font-weight:500;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.card.needs .ttl{color:var(--sub);font-weight:400}
.foot{margin-top:auto;padding-top:6px;font-size:13px;color:var(--sub);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pill{font-size:11px;border:1px solid var(--sep);border-radius:6px;padding:1px 6px;color:var(--sub)}
.card.done .ttl{color:var(--sub);text-decoration:line-through;text-decoration-color:var(--sub)}
.check{position:absolute;top:0;right:0;width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:12px}
.check i{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--sub);display:block;position:relative;transition:background .15s}
.check[aria-checked="true"] i{background:var(--accent);border-color:var(--accent)}
.check[aria-checked="true"] i::after{content:"";position:absolute;left:7px;top:3.5px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.plan{margin-top:20px;background:var(--card);border-radius:12px;padding:14px 16px;color:var(--sub);font-size:14px}
.plan b{color:var(--text);font-weight:600}
@media (min-width:640px) and (max-width:979px){ .cards{grid-template-columns:repeat(4,minmax(0,1fr))} }
@media (min-width:980px){
  .week{grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
  .cards{grid-template-columns:minmax(0,1fr)}
  .dh{flex-wrap:wrap;gap:2px 8px;align-content:flex-start;min-height:100px;padding:12px 2px 8px}
  .dh .badge{margin-left:0;flex-basis:100%;text-align:left;font-size:12px}
  .card{min-height:112px}
}
/* month */
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--sep);border-radius:12px;overflow:hidden;margin-top:12px;border:.5px solid var(--sep)}
.mh{background:var(--card);font-size:12px;color:var(--sub);text-align:center;padding:8px 0;text-transform:uppercase;letter-spacing:.3px}
.mc{background:var(--card);min-height:64px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.mc.out{background:var(--bg)}
.mc .n{font-size:15px;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.mc.off .n{color:var(--sub);opacity:.5}
.mc.today .n{background:var(--accent);color:#fff;font-weight:600}
.mc .ds{display:flex;gap:3px}
.mc .ds i{width:6px;height:6px;border-radius:50%;border:1.2px solid var(--dot-p);display:block}
.mc .ds i.k{border-color:var(--accent)}
.mc .ds i.on{background:var(--accent);border-color:var(--accent)}
.mc .fr{font-size:10px;color:var(--sub);line-height:1}
button.mc:active{background:var(--fill)}
@media (min-width:980px){ .mc{min-height:96px} .mc .ds i{width:8px;height:8px} .mc .fr{font-size:12px} }
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--sub);font-size:13px;padding:10px 4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block;border:1.2px solid var(--dot-p)}
.legend i.k{border-color:var(--accent)} .legend i.on{background:var(--accent);border-color:var(--accent)}
.section-h{color:var(--sub);font-size:13px;text-transform:uppercase;letter-spacing:.3px;padding:18px 16px 6px}
.group{background:var(--card);border-radius:10px;overflow:hidden}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s;z-index:10}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:680px;max-height:92vh;max-height:92dvh;background:var(--bg);border-radius:12px 12px 0 0;transform:translateY(105%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),visibility 0s linear .3s;z-index:11;display:flex;flex-direction:column;box-shadow:0 -2px 20px rgba(0,0,0,.15)}
.sheet.on{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:36px;height:5px;border-radius:3px;background:var(--sep);margin:6px auto 0}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 20px;gap:8px}
.sheet .sh .t{font-size:13px;color:var(--sub);display:flex;gap:6px;align-items:center;min-width:0}
.sheet .sbody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px calc(28px + env(safe-area-inset-bottom))}
.sheet h3{font-size:24px;line-height:1.2;font-weight:700;margin:2px 4px 2px;overflow-wrap:anywhere}
.sheet .ssub{color:var(--sub);font-size:15px;margin:0 4px 10px}
.drow{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 16px;width:100%;text-align:left;position:relative}
.drow + .drow::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.drow.check{flex:none;height:auto;width:100%;justify-content:flex-start;align-self:auto}
.sheet .sh .btn{min-height:52px}
.drow.link{color:var(--accent)}
.kv{padding:10px 16px;position:relative}
.kv + .kv::before,.li + .li::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.kv .k{font-size:13px;color:var(--sub)}
.kv .v{font-size:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.pre{padding:12px 16px;white-space:pre-wrap;font-size:16px;line-height:1.5;overflow-wrap:anywhere}
.li{padding:11px 16px 11px 40px;position:relative;font-size:16px;overflow-wrap:anywhere}
.li::after{content:"";position:absolute;left:18px;top:19px;width:6px;height:6px;border-radius:50%;background:var(--sub)}
.li.ck::after{width:13px;height:13px;top:15px;left:15px;background:none;border:1.5px solid var(--sub)}
.filmbox{margin-top:4px}
.filmbox .ft{padding:12px 16px 2px;font-weight:600;font-size:17px}
.filmbox .fn{padding:0 16px 10px;color:var(--sub);font-size:15px}
.empty{padding:14px 16px;color:var(--sub)}
.hk{display:flex;gap:12px;padding:11px 16px;position:relative;font-size:16px;line-height:1.4;overflow-wrap:anywhere}
.hk + .hk::before{content:"";position:absolute;top:0;left:44px;right:0;border-top:.5px solid var(--sep)}
.hk b{flex:0 0 18px;color:var(--accent);font-weight:600;text-align:right}
.hk span{min-width:0}
.src{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px;font-size:14px;color:var(--sub);overflow-wrap:anywhere}
.tag{font-size:12px;font-weight:600;border-radius:6px;padding:2px 7px;background:var(--fill);color:var(--text);white-space:nowrap}
.tag.new{background:var(--tint);color:var(--accent)}
.cta{padding:12px 16px;font-size:16px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;font-weight:500}

.sheet .drow.check{position:static;width:100%;height:auto;min-height:52px;justify-content:flex-start;border-radius:0}
.sheet .drow.check i{width:26px;height:26px}
.sheet .drow.check[aria-checked="true"] i::after{left:8.5px;top:4.5px;width:6px;height:11px;border-width:0 2.2px 2.2px 0}
.sheet .sh .btn{min-height:52px}
@media (min-width:700px){
  .sheet{bottom:auto;top:50%;border-radius:14px;transform:translateY(-40%) scale(.98);opacity:0;pointer-events:none;transition:transform .25s,opacity .2s,visibility 0s linear .25s;max-height:86vh}
  .sheet.on{transform:translateY(-50%);opacity:1;pointer-events:auto;transition:transform .25s,opacity .2s}
  .sheet .grab{visibility:hidden}
}
[hidden]{display:none !important}
.sheet:focus{outline:none}
button:focus:not(:focus-visible){outline:none}
</style>
</head>

<script>
const DATA = {"generated":"2026-10-18 16:33","start":"2026-10-19","end":"2026-12-06","mix":{"line":"Sunday is studio day: film both Why Build episodes and the podcast. Film the street video on Wednesday or earlier. Film Denis Builds any time. Friday's class is the only timed block.","days":[["Mon","Why Build"],["Tue","Denis Builds"],["Wed","Robot on the Street"],["Thu","Why Build"],["Fri","Denis Builds + class 3:30 PM"],["Sat","Testimonial"],["Sun","Podcast"]],"personal":"You: 9:30 AM Trial Reel, 1:30 PM Follower Farming, 6:00 PM My Take."},"days":[{"date":"2026-10-19","dow":"Mon","kubot":{"format":"Why Build","title":"Kubot: Why Build","sub":"#2 Handling frustration","hook":"let the robot fail","badge":"","needs":false,"film":[],"sections":[["Plan","rows",[["Show","Why Build? with Gabriel. Gabriel to camera, 45 to 75 seconds."],["Episode","#2 Handling frustration"],["Status","Script ready."]]],["Inspo","rows",[["Text hook","let the robot fail"],["On screen","\"a failed build is information\" / \"tonight: wait two minutes\""],["Optional real moment","Only if it's true, in Gabriel's own words, after \"It tells them where to look next.\" Never required."]]],["Caption","rows",[["Caption","The best thing that can happen to your kid is a robot that doesn't work. A failed build tells them exactly where to look next. Wait two minutes before you fix it. Be honest, do you jump in or wait? 👇"],["Spanish line","Lo mejor que le puede pasar es un robot que no funciona."]]],["Shots","list",["Gabriel to camera, clean audio","B-roll: A robot failing and a kid fixing it (Friday class footage)","On-screen text: \"a failed build is information\" / \"tonight: wait two minutes\""]],["Where","text","Studio. Filmed on Sunday studio day."],["Checklist","check",["Film on Sunday studio day","Cut to 45 to 75 seconds","Add on-screen text and subtitles","English caption, Spanish line","No prices, no pitch","Post on Kubot","Reply to comments in the first hour"]]],"s":{"hooks":["let the robot fail","The best thing that can happen to your kid is a robot that doesn't work.","Stop fixing it for them. Give it two minutes.","A failed build is information.","Do you jump in, or do you wait?"],"body":"The best thing that can happen to your kid is a robot that doesn't work.\nEvery parent wants to fix it for them.\nThat's love.\nBut sometimes helping is the thing that slows them down.\nThe kid who stares at it, frowning.\nThe kid who tries the same wire again.\nThe kid who finally figures it out, and you can see it on their face.\nHere's why.\nA robot that doesn't move isn't a bad grade.\nIt's information.\nIt tells them where to look next.\nSame with a 3D print that fails.\nA perfect print teaches them to press a button.\nA failed one teaches them how it actually works.\nIf you grew up fixing your own bike, you already know this feeling.\nThat stuck feeling isn't failure.\nIt's the lesson.\nSo tonight, when they get stuck, give it two minutes before you step in.\nThen ask, \"what have you tried?\"\nBe honest.\nDo you jump in, or do you wait?","cta":"Do you jump in, or do you wait? Waitlist link in bio.","src":"why-build-scripts.md #2 (reused as is)","kind":"reused","notes":"Gabriel's script, already filmed or filming on Sunday studio day.","fillins":"","format":""}},"personal":[{"time":"9:30 AM","label":"Trial Reel","desc":"Quote reel shown to non-followers","has":true,"title":"There are 3 things you can sell, but the internet changed the last one forever","s":{"hooks":["\"There are 3 things you can sell.\" I stopped selling [time or things] and started selling [mind/content]. And [why you had to].","3 things you can sell","There are 3 things you can sell, but the internet changed the last one forever","Trading hours for money feels safe until you do the math.","A brain and an internet connection can change your life."],"body":"(1 HOOK)\n\"There are 3 things you can sell:\"\nDan Koe posted that, and [one line on why it hit you].\n\"1) Your time, capped at 24 hours\"\nI used to sell [the time-based thing you actually did, e.g. hours in the agency / car washes / delivery runs].\nAnd [why that ceiling started to bother you].\n\n(2 RISING ACTION)\n\"2) Your things, capped by inventory\"\nHonestly? Trading hours for money feels safe until you do the math.\n[B-ROLL: real work from the old model, calendar, invoices, or content drafts]\nSo I [first real move toward selling your mind, e.g. posted daily / packaged what you knew / recorded a script].\nThen [second real action].\n\"3) Your mind, for all of history, capped by how many rooms you could be in\"\n[one honest line on how limited that used to feel before social].\n\n(3 SECOND CONFLICT)\nThen [the midpoint setback, e.g. posting into the void / clients drying up / nobody watching].\n[one honest line on wanting to go back to selling time because it felt clearer].\n\n(4 CLIMAX) [MUSIC: beat drop. Tip: use a song from one of your favorite movies]\n\"Social media changed that completely.\"\nI didn't go back. [what you did instead].\n[the moment one piece of your mind reached past one room].\n[B-ROLL: that exact moment, slowed down]\n\n(5 RESOLUTION)\n[where that shift left you, said plainly].\n\"A brain and an internet connection can change your life.\"\nI'm 21. I'm still selling what I figure out, not just my hours.\nAnd the room I'm in now is a lot bigger than the one I started in.","cta":"Which one are you selling right now? Comment it.","src":"Denis Content Scripts sheet #25 (reused as is)","kind":"reused","notes":"Originally planned for 9:30 AM Trial Reel, quote reel (IG #25)\nDan Koe, @thedankoe on X, Sep 30, 2026. Quote reel: his whole post is read word for word, split across all five beats in order. Credit him in the caption.\nFull quote: \"There are 3 things you can sell: 1) Your time, capped at 24 hours 2) Your things, capped by inventory 3) Your mind, for all of history, capped by how many rooms you could be in Social media changed that completely. A brain and an internet connection can change your life.\"\nStory format v2 (5-step). The story is ONE real shift from selling time/things to putting your mind online (content, UGC, teaching what you know). Different from #19 lore, #22 writing habit, #13 addiction, #16 too-big.\nDebatable line: \"Trading hours for money feels safe until you do the math.\"\nNo invented revenue numbers. No Kubot prices.\n~50-60s.","fillins":"- [one line on why the quote hit you]\n- [the time-based thing you actually did] + [why that ceiling bothered you]\n- [first real move toward selling your mind] and [second real action]\n- [how limited \"rooms\" felt before social]\n- [the midpoint setback] + [wanting to go back to selling time]\n- [what you did instead] + [the moment one piece of your mind reached past one room]\n- [where that shift left you]\n- Keep the 1/2/3 quote lines exact and in order. B-roll from the old model and the new one.","format":"Quote reel (Trial Reel), 5-step story (v2)"}},{"time":"1:30 PM","label":"Follower Farming","desc":"Identity list, 25 to 35s","has":true,"title":"How you explain what you do at a party tells me how clear your vision is (identity edition)","s":{"hooks":["How you explain what you do at a party tells me how clear your vision is. Identity edition.","your party intro exposes you","Clarity meter, identity edition","If your grandma doesn't get it, neither does the room.","How you explain what you do at a party tells me how clear your vision is"],"body":"ON-SCREEN: a \"clarity meter\" that fills with each point (shown on screen, not spoken).\n\nHow you explain what you do at a party tells me how clear your vision is. Identity edition.\n1. \"Uh, it's complicated.\" You just lost them. [METER 10%]\n2. Your job title, and nothing else. Safe, but forgettable. [METER 20%]\n3. What you do in one plain sentence, to a stranger who has zero context. [METER 35%]\n4. The problem you solve before the company name. [METER 50%]\n5. A story about one customer, not a pitch deck. [METER 60%]\n6. What you're building toward in under 10 seconds, to make someone lean in instead of nod politely. [METER 75%]\n7. Asking them a question back before they can change the subject. [METER 90%]\n8. And explaining it so simply your grandma would get it, because if she doesn't, neither does the room. [METER 100%]\nTag the friend who's stuck at 10%.","cta":"Tag the friend who's stuck at 10%.","src":"Denis Content Scripts sheet #26 (reused as is)","kind":"reused","notes":"Originally planned for 1:30 PM Follower farm list (IG #25)\nIdentity meter list (clarity meter). Different from gym (#14), Friday night (#17), notes app (#20), Sunday morning (#23).\nDescribe, don't prescribe. Point 1 agreeable/relatable. Debatable at 2 (job title only) and 7 (question back). Lines 3 and 6 carry outcome. 8 starts with And.\nOn-screen labels: Complicated / Job title / One sentence / The problem / One story / 10 seconds / Asks back / Grandma clear.\nNo Kubot. Pure growth. Tag friend CTA.\n~25-35s.","fillins":"None (no personal details).","format":"Follower farm list (identity, progressive meter)"}},{"time":"6:00 PM","label":"My Take","desc":"Personal bet take, 55 to 65s","has":true,"title":"AI agents just raised $12M to handle your billing, and I'm betting on the people who get this early","s":{"hooks":["AI agents just raised 12 million dollars to handle billing and payments.","agents that do the books","AI agents running billing and payments. Liberating, or terrifying?","The companies that win the next decade won't only talk to AI.","AI agents just raised 12 million dollars to handle your billing, and I'm betting on the people who get this early"],"body":"AI agents just raised 12 million dollars to handle billing and payments.\nFragment announced a Series A led by FirstMark on October 14.\nThe pitch is simple. Let AI agents safely run billing, payments, and accounting.\nNot just chat. Actual money movement, with controls so they don't break the books.\nMost people hear that and think, cool, less busywork.\nI think about who wins when agents run more of the business.\n\nSo yeah, I know how it looks. I'm 21, [your line, e.g. the real thing you gave up or risked to do this], and I'm betting on people who understand AI and robots early, not just chatbots.\nWhy am I doing it?\nBecause the companies that win the next decade won't only talk to AI.\nThey'll let it operate. Carefully. With systems built for it.\nMy bet is the people who learn how this stuff works now are the ones who won't get steamrolled by it later.\nAnd if I'm wrong, I'd rather be early than explaining why I waited.\n\nSo tell me. AI agents running billing and payments. Liberating, or terrifying?","cta":"Liberating, or terrifying? Comment it. Pin the question as the first comment.","src":"Denis Content Scripts sheet #27 (reused as is)","kind":"reused","notes":"Originally planned for 6:00 PM Personal bet take (IG #25)\nNews: Fragment raised $12M Series A announced Oct 14, 2026, led by FirstMark (BoxGroup participating). Total funding to $23M. Lets vertical AI companies automate customers' billing, payments, and accounting with correctness controls. Sources: https://finance.yahoo.com/technology/ai/articles/fragment-raises-12-million-series-221500073.html and https://firstmark.com/story/finance-for-agents-our-investment-in-fragment/\nSay the raise and use case carefully. Soft personal bet: agents will run more business ops; he's betting on people who understand AI/robots early, not just chatbots. Soft Kubot/AI-robots line only if it fits in [your line] space; no prices, no pitch.\nDifferent from #15 (Meta vibe report), #18 (cage), #21 (browser data), #24 (Nasdaq humanoid): this one is agents in finance/ops.\nPin debate question; Story poll \"Liberating or terrifying?\" 20 min after.\n~55-65s.","fillins":"- [your line]: the real thing you gave up or risked to do this. Different from nearby bet takes if possible.","format":"Personal bet take"}}]},{"date":"2026-10-20","dow":"Tue","kubot":{"format":"Denis Builds","title":"Kubot: Denis Builds","sub":"Tank, part 2","hook":"I let a kid review my tank","badge":"","needs":false,"film":[],"sections":[["Plan","rows",[["Series","Denis Builds: Denis on camera, building in public."],["Episode","More of the CyberBricks 3D printed tank. Hook and shot only. Pick an option after part 1 is filmed."],["When to film","Any time before it posts."]]],["Inspo","rows",[["Option A (lead)","\"I let a kid review my tank\""],["Option B","\"Upgrading the tank\""]]],["Shots","list",["Option A: the kid's first drive, one take","Option A: the kid's score to camera, parent nearby","Option B: printing and fitting [UPGRADE], then the rematch test","Denis reaction"]],["Where","text","[where you build]"],["Checklist","check",["Pick option A or B","Signed parent release if a kid is on camera, first name only","Cut the Short","No prices, no pitch","Post on Kubot"]]],"s":{"hooks":["I let a kid review my tank","I let a kid review my tank, and the questions get increasingly more honest","A kid drove my tank for the first time. Here's the score.","Kids are the harshest reviewers.","I built it. A kid judged it."],"body":"I let a kid review my 3D printed tank, and the questions get increasingly more honest.\n[kid's first name] has never driven it.\n[B-ROLL: the tank on the table, the kid walking up]\nQuestion one.\n\"Does it look cool?\"\n[the kid's answer, word for word]\nQuestion two.\n\"Drive it.\"\n[what happened on the first drive, one honest line]\nQuestion three.\n\"What would you change?\"\n[the kid's answer]\nQuestion four.\n\"Score out of 10?\"\n[the score]\nAnd honestly, that's a better review than I gave it.\nWhat should I print next?","cta":"What should I print next? Let your kid answer. Waitlist link in bio.","src":"kubot-builds-scripts.md Ep. 2 option A + the Ep. 1 escalating test format (adapted)","kind":"adapted","notes":"Signed parent release, first name only, no schools. If you go with option B (upgrade), use the Nov 10 script instead.","fillins":"","format":""}},"personal":[{"time":"9:30 AM","label":"Trial Reel","desc":"Quote reel shown to non-followers","has":true,"title":"Building a store at 21: the part nobody films","s":{"hooks":["the part nobody films","Building a store at 21 is not what it looks like online.","Here's the part of opening a store nobody posts.","Everyone posts the opening. Nobody posts this.","Opening a store at 21, the unglamorous version."],"body":"(1 HOOK)\nI wanted [what you needed to get done for the store this month].\nAnd [the real obstacle, e.g. permits, deliveries, timing].\n\n(2 RISING ACTION)\nEveryone loves a grand opening.\nHonestly? The boring parts are where the store actually gets built.\n[B-ROLL: real paperwork, calls, deliveries, the space]\nSo I [first real action].\nThen [second real action].\n[one honest line on how unprepared you were].\n\n(3 SECOND CONFLICT)\n[the thing that went wrong this month]\n[how it felt, one line].\n\n(4 CLIMAX) [MUSIC: beat drop]\n[the moment it finally came together].\n[B-ROLL: that exact moment, slowed down]\n\n(5 RESOLUTION)\nNobody claps for the empty room.\nAnd every store you've ever walked into had a month like this that nobody filmed.","cta":"Follow along to see if we get the doors open.","src":"New (no old script fit): his 5-step story format","kind":"new","notes":"Every [bracket] is yours to fill with something that really happened. If there's no real version, skip this one.","fillins":"","format":"5-step story (v2)"}},{"time":"1:30 PM","label":"Follower Farming","desc":"Identity list, 25 to 35s","has":true,"title":"10/10 male hobbies but it gets increasingly more niche","s":{"hooks":["10/10 male hobbies but it gets increasingly more niche","hobbies (niche edition)","If you already do three of these hobbies, you're ahead of most people your age","8 hobbies that quietly change everything, and the last one is the hardest","Most people stop at number 3. Number 8 is the one that matters."],"body":"1. learning how to play an instrument\n2. Going on daily runs\n3. Taking a language class for fun, to meet new people and enhance long term cognitive function\n4. Playing team sports like basketball or soccer\n5. Reading a good books for pure enjoyment\n6. Learning a martial art to sharpen discipline and to be able to pose a physical threat\n7. Doing art like painting or sculpting\n8. And going on group hikes to get outside and to foster meaningful conversations","cta":"No spoken CTA. The And line is the ending. Caption: which number are you? Comment it.","src":"Style library (Claude export): 10/10 male hobbies (v1)","kind":"adapted","notes":"His most viral early script (he stated 175k+). Repost as v2. Posted before, so treat it as a v2 repost: refresh 1 or 2 points. For wider reach you can drop 'male' from the title (he noticed a 6.5M list that never said it). Each point gets a 1 to 4 word on-screen label.","fillins":"","format":""}},{"time":"6:00 PM","label":"My Take","desc":"Personal bet take, 55 to 65s","has":true,"title":"Meta bet $200 billion on a vibe report, and I'm making the same bet","s":{"hooks":["Meta just admitted they bet up to $200 billion on AI before they knew it would work.","they bet $200B on a vibe","Proof shows up after the bet, not before it.","If you wait for proof, you're already late.","Meta bet up to 200 billion dollars on a vibe report, and I'm making the same bet"],"body":"Meta just admitted they bet up to 200 billion dollars on AI before they knew it would work.\nOn a podcast this week, Zuckerberg said he asked his AI chief, \"Alex, are you sure this is going to work?\"\nAll Alex had was what he called a \"vibe report\" and some charts.\nTheir CFO kept warning him. If it's bad, it's \"really, really, really bad.\"\nThey did it anyway.\nBecause if you wait for proof, you're already late.\n\nSo yeah, I know how it looks. I'm 21, [your line, e.g. I skipped my third year of college], and I'm opening a robot store in a Miami mall.\nNo vibe report. No charts. Just [what you actually have to go on, e.g. a kids class every Friday].\nWhy am I doing it?\nBecause proof shows up after the bet, not before it.\nI'm betting that by the time robots are obvious, it's too late to start.\nThe people building with this stuff now, while it still looks crazy, are the ones who'll be ready.\nAnd if I'm wrong, I'm wrong at 21. That's the cheapest time to be wrong.\n\nSo tell me. Is betting before there's proof smart, or just expensive?","cta":"Smart bet, or just expensive? Comment it. Pin the question as the first comment.","src":"Denis Content Scripts sheet #15 (reused; it was planned for an earlier date)","kind":"reused","notes":"Originally planned for 6:00 PM Personal bet take, push day (IG #21)\nNews: Zuckerberg and Alexandr Wang on the Cheeky Pint podcast with John Collison (posted Mon Oct 12, 2026). Zuckerberg: \"We're going to write this check for like, I don't know, $100 billion, $200 billion... Alex, are you sure this is going to work?\" Wang: the best he had was a \"vibe report\" and some charts. CFO Susan Li pulled Wang aside more than once: \"If it's bad, it's really, really, really bad.\" Model planning runs a year ahead and data centers several years, so the money goes in before proof (PJFP summary: https://pjfp.com/muse-wonder-zuckerberg-alexandr-wang-meta-ai-bet/). Podcast: https://cheekypint.transistor.fm/\nSay \"up to 200 billion\", since he said \"100 billion, 200 billion\".\nDifferent angle from the robot bubble videos: this one is about betting before proof, not whether it's a bubble.\nKubot is one line, about 3 seconds. No prices, no pitch.\nPin the debate question as the first comment; Story poll \"Smart bet or bubble?\" 20 min after posting.\n~55-60s.","fillins":"- [your line]: the real thing you gave up or risked to do this (the college line is from your Oct 7 approved script; keep it only if you still want to say it)\n- [what you actually have to go on]: something real you've seen, e.g. the Friday class or parents' reactions on the street. No numbers you can't back up.","format":"Personal bet take"}}]},{"date":"2026-10-21","dow":"Wed","kubot":{"format":"Robot on the Street","title":"Kubot: Robot on the Street","sub":"Are you scared of AI for your kids?","hook":"Are you scared of AI for your kids?","badge":"","needs":false,"film":[{"what":"Robot on the Street","short":"Robot on the Street","note":"Film today or earlier. Main question: Are you scared of AI for your kids?"}],"sections":[["Plan","rows",[["Series","Robot on the Street: the robot holds the mic and asks people one short question each."],["Main question","Are you scared of AI for your kids?"],["Twist ending","Gabriel steps in at the end: \"Robots don't teach here. Kids build them.\""],["Goal","5 to 6 good answers, a split reaction, then the twist. 30 to 45 seconds."],["When to film","Today or earlier."]]],["Questions","list",["Would you let a robot teach your kid?","Would you rather your kid use robots or build them?","What should kids learn that school doesn't teach?","Would your kid rather have an iPad or build a robot?","Are you scared of AI for your kids?","What did you build as a kid?","If a robot could help with one thing at home, what would it be?","Should kids learn to code or learn to build first?"]],["Shots","list",["Opener: the robot turns to someone, mic up","Opener line: \"Quick question from a robot. Got 5 seconds?\"","Each answer: tight on the person, robot mic in frame","Reactions: people laughing, pointing, filming the robot","Wide establishing shot of the spot","Gabriel walking in for the twist, then the line to camera"]],["Where","text","[pick the spot]. Public sidewalks or a park. Ask before filming on private property. Robot at the edge of the walkway, not blocking it."],["Checklist","check",["Pick the spot and time","Charge the robot and the mic","Print releases and bring pens","Quick release from every face used, a parent's for kids","Never mock anyone's answer","Get 5 to 6 usable answers","Film Gabriel's twist line","Cut to 30 to 45 seconds with subtitles","No prices, no pitch"]]],"s":{"hooks":["Are you scared of AI for your kids?","We asked Miami: are you scared of ai for your kids?","A robot asked strangers one question, and the answers get more honest","People had opinions. Fast.","Quick question from a robot. Got 5 seconds?"],"body":"ROBOT: Quick question from a robot. Got 5 seconds?\nROBOT: Are you scared of AI for your kids?\n[answer 1, word for word]\n[answer 2]\n[answer 3, the one that surprised you]\n[answer 4]\n[answer 5, a kid if there's a signed parent release]\n[B-ROLL: reactions, people filming the robot]\n[the split: who said yes, who said no, in one line]\nGABRIEL (to camera): Robots don't teach here. Kids build them.","cta":"What would you answer? Comment it. Waitlist link in bio.","src":"Plan v2 Robot on the Street format + content.py question list (structure reused; answers are real only)","kind":"adapted","notes":"Unscripted. Quick release from every face, a parent's for kids. Never mock an answer.","fillins":"","format":""}},"personal":[{"time":"9:30 AM","label":"Trial Reel","desc":"Quote reel shown to non-followers","has":true,"title":"Getting addicted easily is a superpower, but only if you aim it","s":{"hooks":["\"If you get addicted to things easily, you have one of the rarest traits there is.\" I had [timeframe] to [the goal]. And [the conflict].","you get addicted easily? good.","Getting addicted easily is a superpower, but only if you aim it","Discipline was never my problem. Aim was.","The only thing I ever changed was what I was addicted to."],"body":"(1 HOOK)\n\"If you get addicted to things easily, you have one of the rarest traits there is.\"\nDan Koe posted that, and it got me.\nBecause I had [timeframe] to [a goal you got obsessed with and actually hit, e.g. get good at short-form video].\nAnd [the conflict, e.g. everyone I was up against had years on me].\n\n(2 RISING ACTION)\nI've always been the guy who could lose a whole day to [what you used to get hooked on, e.g. games, scrolling].\nHonestly? I don't think that's a flaw.\n\"Most people can't stay interested in anything for more than a week. You can lose 6 hours to something without noticing.\"\nSo I took those hours and pointed them at [the goal].\n[B-ROLL: you working on it, real screen recordings, notes, drafts from that time]\n[first real action toward the goal].\nThen [second real action].\n[one honest line on how bad you were at the start].\n\n(3 SECOND CONFLICT)\nThen [the midpoint setback, e.g. weeks of work with nothing to show for it].\n[one honest line on the old habit pulling you back].\n\n(4 CLIMAX) [MUSIC: beat drop. Tip: use a song from one of your favorite movies]\n\"Right now that goes to games, feeds, and whatever hooks you first. That's the only problem.\"\nDiscipline was never my problem. Aim was.\nSo I [what you did instead of quitting].\n[the moment it clicked].\n[B-ROLL: that exact moment, slowed down]\n\n(5 RESOLUTION)\n[the goal achieved].\n\"Pick one hard thing actually worth being addicted to. A skill, your body, your work. Give it the same obsession for 2 years and you'll pass people who've been at it for 10.\"\nAnd the only thing I ever changed was what I was addicted to.","cta":"Comment what you're going to aim it at.","src":"Denis Content Scripts sheet #13 (reused; it was planned for an earlier date)","kind":"reused","notes":"Originally planned for 9:30 AM Trial Reel, quote reel (IG #21)\nDan Koe, @thedankoe on X, Oct 11, 2026. Quote reel: his whole post is read word for word, split across the hook, rising action, climax and resolution (each quoted line is his, in order). Credit him in the caption.\nStory format v2 (5-step). The story is ONE real goal you got obsessed with and hit. Short-form video is only a suggestion.\nDebatable lines: \"Honestly? I don't think that's a flaw.\" and \"Discipline was never my problem. Aim was.\"\nDifferent from #11 (commit for 6 months): that one is about sticking with it, this one is about redirecting an obsession. Don't post them back to back.\n~50-60s.","fillins":"- [timeframe] + [a goal you got obsessed with and actually hit]: must be real and already achieved (not Kubot's opening)\n- [the conflict], e.g. people with a big head start\n- [what you used to get hooked on]: only if it's true for you; cut the line if not\n- [first real action] and [second real action] toward the goal\n- [one honest line on how bad you were at the start]\n- [the midpoint setback] + [the old habit pulling you back]\n- [what you did instead of quitting] + [the moment it clicked]\n- [the goal achieved]\n- B-roll: real footage or screenshots from that time","format":"Quote reel (Trial Reel), 5-step story (v2)"}},{"time":"1:30 PM","label":"Follower Farming","desc":"Identity list, 25 to 35s","has":true,"title":"Your morning alarm tells me how disciplined you are","s":{"hooks":["your alarm exposes you","Your morning alarm tells me exactly how disciplined you are.","Where does your alarm land on the discipline meter?","Snooze button people, this one's for you.","Tell me your alarm and I'll tell you your week."],"body":"ON-SCREEN: a \"discipline meter\" fills with each point (on screen, not spoken).\n\nYour morning alarm tells me exactly how disciplined you are.\n1. Five alarms, two minutes apart. You're negotiating, not waking up. [METER 10%]\n2. One alarm, but it's across the room. Respect, but you don't trust yourself yet. [METER 20%]\n3. Same time every day, weekends too, to stop giving your body jet lag every Monday. [METER 35%]\n4. Sunlight before your phone. [METER 50%]\n5. No alarm because you went to bed on time. Rare. [METER 60%]\n6. Waking up before the alarm, to start the day on your terms instead of a ringtone's. [METER 75%]\n7. 5 AM because a podcast told you to. [METER 90%]\n8. And waking up whenever you want, because you built a life where your mornings belong to you. [METER 100%]","cta":"Tag the friend who's stuck at 10%.","src":"New (no old script fit): identity list with a meter","kind":"new","notes":"","fillins":"","format":"Follower farm list"}},{"time":"6:00 PM","label":"My Take","desc":"Personal bet take, 55 to 65s","has":true,"title":"Robots just got let out of the cage, and I'm betting on the kids who build them","s":{"hooks":["Robots just got let out of the cage.","they took the fence down","Robots working right next to people. Exciting or terrifying?","Most people see this and think, there go the jobs. I see something else.","Robots just got let out of the cage, and I'm betting on the kids who build them"],"body":"Robots just got let out of the cage.\nThis week, South Korea gave 20 humanoid robots permission to work right next to people.\nNot behind a fence. Next to them.\nOn real job sites. Chips, cars, ships, and delivery.\nThe old rules were written for robots that stay behind a fence.\nNow they're testing what happens when they don't.\nMost people see that and think, there go the jobs.\nI see something else.\n\nSo yeah, I know how it looks. I'm 21, [your line, e.g. the real thing you gave up or risked to do this], and I'm opening a robot store in a Miami mall with a guy who's taught kids robotics for over 10 years.\nWhy am I doing it?\nBecause the robots are coming out from behind the fence either way.\nMy bet is the people who'll be fine are the ones who learned how robots work as kids.\nNot scared of them. Not replaced by them. Building them.\nEvery Friday I watch [one real thing you've seen at the Friday class, e.g. a kid's robot moving for the first time].\nThat kid won't be scared of a robot at work one day. They'll be the one who knows how it works.\nAnd honestly, I'd rather be early to this than scared of it.\n\nSo tell me. Robots working right next to people. Exciting or terrifying?","cta":"Exciting or terrifying? Comment it. Pin the question as the first comment.","src":"Denis Content Scripts sheet #18 (reused; it was planned for an earlier date)","kind":"reused","notes":"Originally planned for 6:00 PM Personal bet take (IG #22)\nNews: on Oct 13, 2026, South Korea's industry ministry, through its regulatory sandbox, approved an exemption to industrial robot safety rules so 20 bipedal humanoids from Robros can be tested in spaces shared with or next to human workers. Sites: Nepes (semiconductors), Sungwoo Hitech (automotive), HD Hyundai Samho (shipbuilding), Delivery Lab (logistics). Tasks (cut from the script for time, add back as on-screen text if you want): cleaning semiconductor packaging parts, positioning car body parts, stacking scaffolding brackets, moving refrigerated packaging. It runs under extra safety standards, and the data will be used to rewrite the robot safety rules more broadly. Also: Seoul Economic Daily, https://en.sedaily.com/finance/2026/10/14/korea-clears-safety-rules-to-put-20-humanoid-robots-on\nSay \"permission to work next to people\" and \"testing\", since it's a trial, not a full rollout. Don't say the fences are gone everywhere.\nDebatable angle: jobs fear vs. \"the kids who build them.\" Keep it positive, no villains.\nKubot is one line, about 3 seconds, plus the Friday class line. No prices, no pitch, no open date.\nDifferent from #15 (betting before proof): this one is about robots leaving the cage and who'll be ready.\nPin the debate question as the first comment; Story poll \"Exciting or terrifying?\" 20 min after posting.\n~55-65s.","fillins":"- [your line]: the real thing you gave up or risked to do this. Use a different one from #15 if both are posted close together.\n- [one real thing you've seen at the Friday class]: something that actually happened, first names only or none. No numbers you can't back up.","format":"Personal bet take"}}]},{"date":"2026-10-22","dow":"Thu","kubot":{"format":"Why Build","title":"Kubot: Why Build","sub":"#6 Confidence","hook":"the shy kid changes","badge":"","needs":false,"film":[],"sections":[["Plan","rows",[["Show","Why Build? with Gabriel. Gabriel to camera, 45 to 75 seconds."],["Episode","#6 Confidence"],["Status","Script ready."]]],["Inspo","rows",[["Text hook","the shy kid changes"],["On screen","\"the robot takes the spotlight\" / \"tonight: let them teach you\""],["Optional real moment","Only if it's true, in Gabriel's own words, after \"And someone asks how it works.\" Never required."]]],["Caption","rows",[["Caption","Telling a shy kid to speak up almost never works. Asking how their robot works does. When they explain what they made, the spotlight is on the robot, not on them. What could your kid explain for an hour? 👇"],["Spanish line","He visto a niños tímidos cambiar en una hora."]]],["Shots","list",["Gabriel to camera, clean audio","B-roll: A kid explaining their robot to camera (Friday class footage)","On-screen text: \"the robot takes the spotlight\" / \"tonight: let them teach you\""]],["Where","text","Studio. Filmed on Sunday studio day."],["Checklist","check",["Film on Sunday studio day","Cut to 45 to 75 seconds","Add on-screen text and subtitles","English caption, Spanish line","No prices, no pitch","Post on Kubot","Reply to comments in the first hour"]]],"s":{"hooks":["the shy kid changes","I've watched shy kids change in one hour.","Telling a shy kid to speak up almost never works.","The robot takes the spotlight off them.","What could your kid explain for an hour?"],"body":"I've watched shy kids change in one hour.\nNot because someone told them to speak up.\nHonestly, telling a shy kid to speak up almost never works.\nThe kid who hides behind mom at drop off.\nThe kid who won't say their name in the circle.\nThen they finish a robot.\nAnd someone asks how it works.\nHere's the thing.\nThey're not talking about themselves anymore.\nThey're talking about the thing they made.\nThat's easier.\nThe robot takes the spotlight off them.\nAnd nobody in the room knows that robot better than they do.\nEvery time they explain it, it gets a little easier.\nThat's confidence.\nIt comes from knowing something, not from being told to be brave.\nTonight, ask your kid to teach you how they made something.\nAnything.\nThen follow their steps exactly.\nWhat could your kid explain for an hour?","cta":"What could your kid explain for an hour? Waitlist link in bio.","src":"why-build-scripts.md #6 (reused as is)","kind":"reused","notes":"Gabriel's script, already filmed or filming on Sunday studio day.","fillins":"","format":""}},"personal":[{"time":"9:30 AM","label":"Trial Reel","desc":"Quote reel shown to non-followers","has":true,"title":"The law of the empty room, but it gets more personal","s":{"hooks":["nobody claps for the empty room","Nobody claps for the empty room. They clap when the doors open.","The part of building nobody films","Everyone wants the ribbon cutting. Nobody wants the empty room.","If nobody's watching yet, you're right on schedule."],"body":"Nobody claps for the empty room.\nEveryone wants the ribbon cutting.\nThe launch post.\nThe before and after.\nBut the before lasts way longer than anyone shows you.\nHonestly? I think the empty room is the best part.\nIt's the only time nobody has an opinion yet.\nNobody's comparing you.\nNobody's telling you how it should look.\nIt's just you and the thing only you can see.\nThat's the law of the empty room.\nThe work that matters most happens when nobody's clapping.\nAnd the people who quit there never find out what the room was going to become.","cta":"Comment what your empty room is right now.","src":"New (no old script fit): name-the-law / insight reel","kind":"new","notes":"His own line, 'nobody claps for the empty room', from the lessons at 21 reel. Film over real b-roll of the store space or the warehouse. Post before Dec 1.","fillins":"","format":"Insight reel"}},{"time":"1:30 PM","label":"Follower Farming","desc":"Identity list, 25 to 35s","has":true,"title":"8 more 10/10 male hobbies but it gets increasingly more niche","s":{"hooks":["8 more 10/10 male hobbies but it gets increasingly more niche","hobbies (niche edition)","If you already do three of these hobbies, you're ahead of most people your age","8 hobbies that quietly change everything, and the last one is the hardest","Most people stop at number 3. Number 8 is the one that matters."],"body":"1. Going to the gym\n2. Learning how to cook\n3. Journaling to process your thoughts and clear your head\n4. Learning photography\n5. Playing chess to sharpen the way you think\n6. Boxing, to build the confidence that comes with knowing you can defend yourself\n7. Doing a solo sport like tennis or cycling\n8. And volunteering once a month, to make sure you never lose the part of you that gives without expecting back","cta":"No spoken CTA. The And line ends it. Caption: send this to the friend who needs number 8.","src":"Style library (Claude export): 10/10 male hobbies v2","kind":"adapted","notes":"He said this version hit 1M. Repost once the last one plateaus. Posted before, so treat it as a v2 repost: refresh 1 or 2 points. For wider reach you can drop 'male' from the title (he noticed a 6.5M list that never said it). Each point gets a 1 to 4 word on-screen label.","fillins":"","format":""}},{"time":"6:00 PM","label":"My Take","desc":"Personal bet take, 55 to 65s","has":true,"title":"Anyone with a browser can train a robot now, and I'm betting on the kids who already build","s":{"hooks":["Anyone with a browser can help train a robot now.","train a robot from your browser","A robot doesn't learn to pick up a cup from a tweet.","Not just prompt engineers. Builders.","Anyone with a browser can train a robot now, and I'm betting on the kids who already build"],"body":"Anyone with a browser can help train a robot now.\nA platform called Axis Robotics let people teleoperate simulated robots from a laptop.\nAs of early October, over 229,000 people have contributed.\nMillions of trajectories. Millions of tiny lessons for physical AI.\nNo lab coat. No warehouse. Just a browser and a human teaching a machine how to move.\nMost people see that and think, cool science project.\nI see something else.\n\nSo yeah, I know how it looks. I'm 21, [your line, e.g. the real thing you gave up or risked to do this], and I'm opening a robot store in a Miami mall with a guy who's taught kids for over 10 years.\nWhy am I doing it?\nBecause physical AI still needs human skills and human data.\nA robot doesn't learn how to pick up a cup from a tweet. It learns from people who can do the thing.\nMy bet is the kids who build with their hands now are the ones this wave actually needs.\nNot just prompt engineers. Builders.\nAnd if I'm wrong, at least I spent my twenties around kids who make things.\n\nSo tell me. Crowdsourcing robot training from a browser. The future, or a gimmick?","cta":"Future, or a gimmick? Comment it. Pin the question as the first comment.","src":"Denis Content Scripts sheet #21 (reused; it was planned for an earlier date)","kind":"reused","notes":"Originally planned for 6:00 PM Personal bet take (IG #23)\nNews: Axis Robotics docs (as of Oct 10, 2026) report 229,000+ global contributors, 7.3M+ trajectories, browser-based simulation teleop plus mobile ego-centric capture. Covered in Up North AI Oct 11, 2026: https://www.upnorth.ai/en/news/2026-10-11\nSay \"help train\" / \"teleoperate simulated robots from a browser\" carefully. Do NOT pitch crypto, tokens, or $AXIS. Soft bet only: physical AI needs human skills and data; kids who build will matter.\nDebatable close: future vs gimmick.\nKubot is one soft line (~3s). No prices, no hard open-date pitch (Dec 1 soft ok if you add it; keep it light).\nDifferent from #18 (robots out of the cage / jobs) and #15 (betting before proof): this one is about human data powering physical AI.\nPin the debate question as the first comment; Story poll \"Future or gimmick?\" 20 min after.\n~55-65s.","fillins":"- [your line]: the real thing you gave up or risked to do this. Use a different one from #15 and #18 if those post close together.","format":"Personal bet take"}}]},{"date":"2026-10-23","dow":"Fri","kubot":{"format":"Denis Builds","title":"Kubot: Denis Builds","sub":"The empty room","hook":"This empty room becomes something kids beg for","badge":"Hero shoot 3:30 to 5 PM, Bal Harbour","needs":false,"film":[{"what":"Kubot class, 3:30 to 5 PM, Bal Harbour","note":"Hero shoot. Film testimonials and b-roll. Gabriel teaches, Denis films.","sections":[["Capture list","list",["Door: signed parent photo and video release before any face is used","Wide of the room before kids arrive","Hands on CyberBricks and 3D printed parts (vertical and horizontal)","Gabriel teaching: hands, face, parts, kids reacting","A build failing, then a kid fixing it","The first time a robot moves, plus the kid's face","Wide room shots once it's full","Pickup: a kid showing the build to a parent","Parent answer at pickup (release-cleared only): \"What did you notice in your kid today?\" Get 2 to 3 clean answers for Saturday"]],["Rules","text","No scripted kid interviews. No prices, no pitch. First names only, no school names. After class, confirm which faces are release-cleared before the edit."]],"short":"Class 3:30 to 5 PM, Bal Harbour"}],"sections":[["Plan","rows",[["Series","Denis Builds: Denis on camera, building in public."],["Episode","Store countdown walkthrough. Hook and shot only."],["When to film","Any time before it posts."]]],["Inspo","rows",[["Hook","This empty room becomes something kids beg for"]]],["Shots","list",["The empty room, wide","Walkthrough, one take, Denis talking","Details: [what's already in]"]],["Where","text","[the space you're filming]"],["Checklist","check",["Film the walkthrough","Cut to 30 to 45 seconds","No prices, no pitch","Post on Kubot"]]],"s":{"hooks":["This empty room becomes something kids beg for","Right now it's an empty room.","Nobody claps for the empty room.","Here's what goes where.","Give it a few weeks. Watch this room."],"body":"This empty room becomes something kids beg for.\n[B-ROLL: the empty room, wide]\nRight now it's [what the room looks like today, one honest line].\nOver here: [what goes here, in your own words].\nOver here: [what goes here].\n[B-ROLL: walkthrough, one take]\nWhat's left before December 1st: [what's left to do].\nAnd in a few weeks, this is where a kid builds their first robot.","cta":"What would you put in here? Comment it. Waitlist link in bio.","src":"kubot-builds-scripts.md banked idea + hub posts.json Oct 23 (hook reused, body adapted)","kind":"adapted","notes":"","fillins":"","format":""}},"personal":[{"time":"9:30 AM","label":"Trial Reel","desc":"Quote reel shown to non-followers","has":true,"title":"The law of compounding skills","s":{"hooks":["Stop trying to focus","What I'm about to say only a few people will understand.","Everyone tells me I'm spread too thin. They're wrong, and here's why.","Your edge is how many of your skills share roots.","The people who win across multiple lanes aren't built different."],"body":"What I'm about to say only a few people will understand.\nAnd honestly, even if you don't, I don't really care.\nThere are people who win across multiple lanes at once.\nNot because they have more time, not because they're built different, but because they figured out their skills compound.\nAnd when your skills compound, you build at a completely different speed.\nLook at my life.\nI run an AI agency.\nI front an indie rock band.\nI post content every day.\nAnd every week someone tells me I'm spread too thin.\nBut, actually they're wrong, and here's why.\nThe band gave me the on-camera presence that makes the content land.\nThe content brings inbound to the agency.\nThe agency funds the studio time.\nSame kid, same 24 hours. None of these are separate skills.\nThey share roots. And the roots quietly build the outcome.\nYou've felt this before. A skill from one job randomly saving you in another.\nSame person, suddenly an unfair advantage out of nowhere.\nThats called the law of compounding skills.\nYour edge is directly proportional to how many of your skills share roots.\nAnd I know what you're thinking.\nBut I only have one skill. So what does this even mean for me?\nIt means, the people you see \"focusing on one skill\" aren't ahead because they focused.\nThey're ahead because their one skill is actually three skills stacked underneath it.\nThe focus you're chasing is a side effect, not a strategy.\nThe roots come first. So you plant the skills, and the focus grows on top.","cta":"Comment the two skills of yours that secretly share roots.","src":"Style library: Law of compounding skills (his stitched draft, Apr 29)","kind":"reused","notes":"His mom didn't get an earlier cut, so read it out loud to one person first and swap any vague word. Update the 'look at my life' lines to what's true today.","fillins":"","format":""}},{"time":"1:30 PM","label":"Follower Farming","desc":"Identity list, 25 to 35s","has":true,"title":"10/10 male truths but it gets increasingly more niche","s":{"hooks":["10/10 male truths but it gets increasingly more niche","truths (niche edition)","If you already do three of these truths, you're ahead of most people your age","8 truths that quietly change everything, and the last one is the hardest","Most people stop at number 3. Number 8 is the one that matters."],"body":"1. Nobody is thinking about you as much as you think they are\n2. Motivation doesn't exist, only discipline\n3. You become the average of the five people you spend the most time with, whether you like it or not\n4. Your 20s are a compounding asset, not a rehearsal\n5. Your phone is training you more than you're training yourself\n6. Most people will quietly prefer the version of you that stays small\n7. Talent is common, consistency is rare, and consistent talent wins every time\n8. And every day you delay the hard conversation is another day you're letting someone else write your story for you","cta":"No spoken CTA. Let the And line land. Caption: comment the one you already do.","src":"Style library (Claude export): 10/10 male truths","kind":"adapted","notes":"He said it blew up on TikTok and Instagram. Posted before, so treat it as a v2 repost: refresh 1 or 2 points. For wider reach you can drop 'male' from the title (he noticed a 6.5M list that never said it). Each point gets a 1 to 4 word on-screen label.","fillins":"","format":""}},{"time":"6:00 PM","label":"My Take","desc":"Personal bet take, 55 to 65s","has":true,"title":"A humanoid just rang the Nasdaq bell, and I'm betting on the kids who'll work with them","s":{"hooks":["A humanoid robot just rang the Nasdaq closing bell.","a robot rang the Nasdaq bell","Most people saw a cool photo. I saw the timeline speeding up.","A robot on the Nasdaq stage. Hype, or the start of something real?","A humanoid just rang the Nasdaq bell, and I'm betting on the kids who'll work with them"],"body":"A humanoid robot just rang the Nasdaq closing bell.\nOn October 13, RoboStrategy brought Dyna Robotics' Taku to Times Square.\nA robot. On the public markets stage. Next to a fund built for robotics and physical AI.\nMost people saw a cool photo.\nI saw the timeline speeding up.\nRobots aren't just lab demos anymore. They're showing up where money already believes.\n\nSo yeah, I know how it looks. I'm 21, [your line, e.g. the real thing you gave up or risked to do this], and I'm building a store in a Miami mall so kids can learn to build robots while their parents shop.\nWhy am I doing it?\nBecause if humanoids are ringing bells on Wall Street, the kids who understand them early won't be scared when they show up at work.\nMy bet is robots go mainstream through public markets and malls at the same time.\nNot someday. Now.\nAnd I'd rather teach kids how they work than wait for everyone else to panic.\n\nSo tell me. A robot on the Nasdaq stage. Hype, or the start of something real?","cta":"Hype, or real? Comment it. Pin the question as the first comment.","src":"Denis Content Scripts sheet #24 (reused; it was planned for an earlier date)","kind":"reused","notes":"Originally planned for 6:00 PM Personal bet take (IG #24)\nNews: Oct 13, 2026, RoboStrategy (Nasdaq: BOT) rang the Nasdaq closing bell with Dyna Robotics' Taku humanoid at MarketSite, Times Square. Sources: https://www.nasdaq.com/events/robostrategy-rings-closing-bell and RoboStrategy/GlobeNewswire coverage naming Taku.\nSay \"rang the closing bell\" / \"brought Taku\" carefully (CEO Andrew Kang rang it alongside the robot). Soft Kubot line only: store for kids to learn robots. No prices, no hard pitch. Dec 1 open date only if soft.\nBet: robots going mainstream/public markets while he's building a place for kids to learn them.\nDifferent from #18 (cage/jobs) and #21 (browser training data): this one is mainstream/public markets signal.\nPin debate question; Story poll \"Hype or real?\" 20 min after.\n~55-65s.","fillins":"- [your line]: the real thing you gave up or risked to do this. Different from nearby bet takes if possible.","format":"Personal bet take"}}]},{"date":"2026-10-24","dow":"Sat","kubot":{"format":"Testimonial","title":"Kubot: Testimonial","sub":"From Fri Oct 23 class","hook":"Watch [his or her] face when [he or she] shows [mom or dad]","badge":"","needs":false,"film":[],"sections":[["Plan","rows",[["Series","Testimonial: a kid at pickup showing their parent what they built, then one honest sentence from the parent. Unscripted, never staged."],["Source","Footage from the Fri Oct 23 class (Bal Harbour)."],["Hook options","\"Watch [his or her] face when [he or she] shows [mom or dad]\" or \"I asked a [mom or dad] what changed in [her or his] [son or daughter]\". Use the real kid and parent."],["Who","[parent first name] and [kid first name]. First names only."],["Goal","One honest answer a parent watching can relate to. 25 to 35 seconds."]]],["Questions","list",["What did you notice in your kid today?","What did [kid] tell you about the build on the way out?","What is something [kid] built that surprised you?","How does [kid] talk about building now?","In one sentence, what did building give [kid]?"]],["Shots","list",["Kid running up with the build","Kid explaining it to the parent","Parent's face as the robot moves","The parent's one sentence","Close-up of the build in the kid's hands"]],["Where","text","Bal Harbour class footage from Friday."],["Checklist","check",["Pick the pickup moment from Friday's footage","Confirm the signed release for kid and parent","First names only, no school names","Cut to 25 to 35 seconds with subtitles","No prices, no pitch","Post on Kubot"]]],"s":{"hooks":["Watch [his or her] face when [he or she] shows [mom or dad]","This is what a Friday class looks like.","Pieces in. Robot out.","What did you notice in your kid today?","One parent. One answer at pickup."],"body":"[B-ROLL: kid running up to the parent with the build]\nKID: [what the kid says about the build, word for word]\n[B-ROLL: the robot moving, the parent's face]\nPARENT (answering \"What did you notice in your kid today?\"): [the parent's answer, word for word]\n[B-ROLL: close up of the build in the kid's hands]\nON-SCREEN: [parent's first name] and [kid's first name], after the Fri Oct 23 class.","cta":"What did your kid build first? Comment it. Or send us their drawing.","src":"Plan v2 Real Families + kubot-details.json hook options + hub posts.json pickup posts (structure reused; words are real only)","kind":"adapted","notes":"Never staged or scripted. Signed release for kid and parent, first names only, no schools.","fillins":"","format":""}},"personal":[{"time":"9:30 AM","label":"Trial Reel","desc":"Quote reel shown to non-followers","has":true,"title":"The worst week of building Kubot","s":{"hooks":["the worst week so far","This was the worst week of building Kubot.","Everything broke this week. Here's what happened.","I almost didn't post this week.","Nobody posts the bad weeks."],"body":"(1 HOOK)\nI wanted [this week's goal].\nAnd [what made it the worst week].\n\n(2 RISING ACTION)\nMost founders only post the wins.\nHonestly? The bad weeks are the only ones worth posting.\n[B-ROLL: what broke, real footage]\nSo I [first real action].\nThen [second real action].\n[one honest line on how unprepared you were].\n\n(3 SECOND CONFLICT)\n[the second thing that went wrong]\n[how it felt, one line].\n\n(4 CLIMAX) [MUSIC: beat drop]\n[the one thing that went right]\n[B-ROLL: that exact moment, slowed down]\n\n(5 RESOLUTION)\n[what you learned, in one line].\nAnd if you're having a week like this, it's not the end. It's the part you'll tell later.","cta":"Comment your worst week and I'll tell you mine was worse.","src":"New (no old script fit): his 5-step story format","kind":"new","notes":"Every [bracket] is yours to fill with something that really happened. If there's no real version, skip this one.","fillins":"","format":"5-step story (v2)"}},{"time":"1:30 PM","label":"Follower Farming","desc":"Identity list, 25 to 35s","has":true,"title":"Your gym split tells me how disciplined you are (gym rat edition)","s":{"hooks":["Your gym split tells me exactly how disciplined you are. Gym rat edition.","your gym split exposes you","Full body three days a week is the smartest split. Fight me.","Where does your split land on the discipline meter?","Your gym split tells me how disciplined you are (gym rat edition)"],"body":"ON-SCREEN: a \"discipline meter\" that fills with each point (shown on screen, not spoken).\n\nYour gym split tells me exactly how disciplined you are. Gym rat edition.\n1. Whatever the guy next to you is doing. You have a neighbor, not a split. [METER 10%]\n2. Full body, three days a week. Smartest split here, and nobody believes you train. [METER 25%]\n3. Bro split, to hit chest every Monday with the rest of the planet. [METER 40%]\n4. Push pull legs. [METER 55%]\n5. Upper lower. You read one study about it. [METER 65%]\n6. Push pull legs twice a week, to hit every muscle twice and still be on time for the rest of your life. [METER 80%]\n7. 5 AM, fasted, before anyone's awake. [METER 90%]\n8. And the same boring split you've run for a year without missing a week, because the best split is the one you never skip. [METER 100%]\nTag the friend who's stuck at 10%.","cta":"Tag the friend who's stuck at 10%.","src":"Denis Content Scripts sheet #14 (reused; it was planned for an earlier date)","kind":"reused","notes":"Originally planned for 1:30 PM Follower farm list (IG #21)\nIdentity list built for tags: the meter is the hook, everyone wants to see where they land. Bridges your old gym audience into the account without a Kubot mention.\nDescribe the viewer, don't prescribe. Debatable lines at 2 (full body is the smartest split) and 7 (5 AM fasted). Expect the PPL vs bro split fight in the comments.\nLines 3 and 6 carry the outcome. 8 starts with And.\nOn-screen labels: Copycat / Full body / Bro split / PPL / Upper lower / PPL x2 / 5 AM fasted / Never skips.\nStory prompt from the calendar: \"tag the friend who...\" slider 20 min after posting.\n~25-30s.","fillins":"None (no personal details).","format":"Follower farm list (identity, progressive meter)"}},{"time":"6:00 PM","label":"My Take","desc":"Personal bet take, 55 to 65s","has":true,"title":"Malls aren't dying. Boring stores are.","s":{"hooks":["malls aren't dying","Everyone says malls are dying. I'm opening a store in one.","Malls aren't dying. Boring stores are.","Why would a 21 year old bet on a mall?","The internet killed shopping. It didn't kill going places."],"body":"Everyone says malls are dying.\nI'm opening a store in one anyway.\nHear me out.\nMalls aren't dying.\nBoring stores are.\nIf all you sell is something I can order from my couch, why would I drive to you?\nBut you can't order an experience.\nYou can't ship a kid building their first robot.\nThe internet killed shopping as a chore.\nIt didn't kill wanting to go somewhere.\nSo yeah, I know how it looks. I'm 21, [your line], and I'm betting on a physical store.\nMy bet is the stores that win next are the ones you can't replicate online.\nAnd if I'm wrong, at least I'll know exactly why.","cta":"So tell me. Malls, dead or just boring? Comment it.","src":"New (no old script fit): opinion / bet take","kind":"new","notes":"","fillins":"","format":"Personal take"}}]},{"date":"2026-10-25","dow":"Sun","kubot":{"format":"Podcast","title":"Kubot: Podcast","sub":"Ep. 2: Street answers","hook":"We asked Miami if they'd let a robot teach their kid","badge":"Studio day","needs":false,"film":[{"what":"Why Build #12 Ready for an AI future","short":"Why Build #12","note":"Posts Mon Oct 26.","ref":"2026-10-26"},{"what":"Why Build #18 How to praise a build","short":"Why Build #18","note":"Posts Thu Oct 29.","ref":"2026-10-29"},{"what":"Podcast ep. 3","short":"Podcast ep. 3","note":"Posts Sun Nov 1.","ref":"2026-11-01"}],"sections":[["Plan","rows",[["Episode","Podcast ep. 2. Full episode on YouTube and Spotify, plus one clip on Kubot."],["Filmed","Last Sunday's studio day."]]],["Inspo","rows",[["Show","Founders podcast: weekly build in public episode, 30 to 45 minutes, Denis and Gabriel hosting. Cut into 5 to 8 short clips."],["This episode","We asked Miami if they'd let a robot teach their kid. React to the best Robot on the Street answers."]]],["Shape","text","1. Cold open (1 to 2 min): Denis sets up the street question.\n2. Street answers (15 to 20 min): play the best clips, Gabriel reacts to each.\n3. Week in the build (3 to 5 min): what got done at the store, what broke, what's next.\n4. Kid of the week (optional): a Friday kid explains their robot, with a parent on mic. Only if release-cleared.\n5. What to try tonight (5 min): one tip for parents.\n6. Close (2 min): tease next week."],["Questions","list",["Which street answer surprised you most? [play the clip]","Would you let a robot teach your kid? Why or why not?","What's the difference between a kid using a robot and building one?","What are parents scared of with AI, and what do you tell them?","What happens in a kid's head the first time their robot moves?","If a parent is worried about screens, what can they try tonight?","What broke this week, and what's next before the store opens?"]],["Shots","list",["Wide two-shot, plus a single on each host","Print farm and robots visible behind","Clip targets: one Gabriel line that stands alone, one parent tip for tonight"]],["Where","text","Studio. Audio: the podcast mics, test recording first."],["Checklist","check",["Upload the full episode to YouTube and Spotify","Cut one clip for Kubot","Mark 5 to 8 clips for later","No prices, no pitch","Reply to comments in the first hour"]]],"s":{"hooks":["We asked Miami if they'd let a robot teach their kid","Gabriel reacts to the best street answers","The answer that got Gabriel","Robots don't teach here. Kids build them.","Would you let a robot teach your kid?"],"body":"DENIS (cold open): We put a robot on the street and asked Miami one question. Would you let a robot teach your kid?\nDENIS: Gabriel has taught kids robotics for over 10 years. So I made him watch every answer.\n[CLIP: the best street answer]\nGABRIEL: [his reaction]\nDENIS: Most people said [the most common answer]. Gabriel, what do you tell those parents?\nGABRIEL: [his answer]\nCLIP FOR KUBOT: [the one Gabriel line that stands alone]","cta":"Full episode on YouTube and Spotify. What should we ask Gabriel next? Waitlist link in bio.","src":"content.py podcast ep. 2 (reused)","kind":"reused","notes":"Gabriel's answers are his, unscripted. Only the cold open and questions are written.","fillins":"","format":""}},"personal":[{"time":"9:30 AM","label":"Trial Reel","desc":"Quote reel shown to non-followers","has":true,"title":"Your first version should embarrass you","s":{"hooks":["your first version should embarrass you","If your first video doesn't make you cringe, you waited too long.","Everyone's first version is bad. Most people just never post it.","The cringe is the tuition.","Stop polishing. Post the ugly one."],"body":"Your first version should embarrass you.\nEveryone's first video is bad.\nEveryone's first product is bad.\nThe only difference is some people post it.\nHonestly? If your first version doesn't make you cringe a little, you waited too long.\nBecause the polish you're waiting for only comes from reps.\nAnd you can't get reps on something nobody sees.\nThe ugly first version isn't the failure.\nIt's the tuition.\nAnd the version of you that's scared to post it is the only thing standing between you and the good one.","cta":"Comment 'posted' when you put out the ugly one.","src":"New (no old script fit): name-the-law / insight reel","kind":"new","notes":"No personal claims. Pair with your own oldest clip on screen if you want (your call).","fillins":"","format":"Insight reel"}},{"time":"1:30 PM","label":"Follower Farming","desc":"Identity list, 25 to 35s","has":true,"title":"Your camera roll tells me what you actually care about","s":{"hooks":["your camera roll exposes you","Your camera roll tells me what you actually care about.","Show me your last 20 photos and I'll tell you your priorities.","Your camera roll doesn't lie.","Scroll your camera roll. Be honest."],"body":"ON-SCREEN: a \"priority meter\" fills with each point (on screen, not spoken).\n\nYour camera roll tells me what you actually care about.\n1. 4,000 screenshots you'll never look at again. [METER 10%]\n2. Gym mirror pics, every single day. Dedicated, or a little too dedicated. [METER 20%]\n3. Photos of whiteboards and notes, to remember the idea you had in the meeting. [METER 35%]\n4. Food. So much food. [METER 50%]\n5. Sunsets. You notice things. [METER 60%]\n6. Progress photos of something you're building, to prove to yourself it's actually moving. [METER 75%]\n7. Zero selfies. Suspicious. [METER 90%]\n8. And photos of the people you love, because at the end of the day that's the only folder that matters. [METER 100%]","cta":"Comment what your last photo was.","src":"New (no old script fit): identity list with a meter","kind":"new","notes":"","fillins":"","format":"Follower farm list"}},{"time":"6:00 PM","label":"My Take","desc":"Personal bet take, 55 to 65s","has":true,"title":"College isn't the scam. Waiting is.","s":{"hooks":["college isn't the problem","Everyone says college is a scam. I don't think so.","College isn't the scam. Waiting is.","I skipped my third year. Here's my honest take on college.","The real mistake isn't college. It's this."],"body":"Everyone online says college is a scam.\nI skipped my third year, and I still don't think so.\nCollege isn't the scam.\nWaiting is.\nWaiting four years to start building anything real.\nWaiting for a degree to give you permission.\nYou can go to college and build at the same time.\nHonestly? The people I know who did both are the most dangerous ones.\nThe degree isn't what makes you valuable.\nWhat you build while you have it is.\nAnd if you graduate with a degree and nothing you made, that's the part I'd worry about.","cta":"So tell me. Is college worth it right now? Comment it.","src":"New (no old script fit): opinion / bet take","kind":"new","notes":"Only say 'I skipped my third year' if you still want it on camera.","fillins":"","format":"Personal take"}}]},{"date":"2026-10-26","dow":"Mon","kubot":{"format":"Why Build","title":"Kubot: Why Build","sub":"#12 Ready for an AI future","hook":"AI can't do this","badge":"","needs":false,"film":[],"sections":[["Plan","rows",[["Show","Why Build? with Gabriel. Gabriel to camera, 45 to 75 seconds."],["Episode","#12 Ready for an AI future"],["Status","Script ready."]]],["Inspo","rows",[["Text hook","AI can't do this"],["On screen","\"guess, test, try again\" / \"tonight: how does that work?\""],["Optional real moment","Only if it's true, in Gabriel's own words, after \"Every build runs on that loop.\" Never required."]]],["Caption","rows",[["Caption","AI can write the answer. It can't care enough to try the next wire. Guess, test, try again. That's the skill. Dads, this is the stuff we wished we had as kids. What does your kid always want to take apart? 👇"],["Spanish line","La habilidad que la IA no puede reemplazar: descubrir por qué algo no funciona."]]],["Shots","list",["Gabriel to camera, clean audio","B-roll: A kid checking wires and testing again (Friday class footage)","On-screen text: \"guess, test, try again\" / \"tonight: how does that work?\""]],["Where","text","Studio. Filmed on Sunday studio day."],["Checklist","check",["Film on Sunday studio day","Cut to 45 to 75 seconds","Add on-screen text and subtitles","English caption, Spanish line","No prices, no pitch","Post on Kubot","Reply to comments in the first hour"]]],"s":{"hooks":["AI can't do this","There's one skill AI can't replace in your kid.","Guess. Test. Wrong. Try again.","It's not being good with screens.","What does your kid always want to take apart?"],"body":"There's one skill AI can't replace in your kid.\nAnd it's not being good with screens.\nIt's figuring out why something doesn't work.\nAI can write the answer.\nIt can't stand at the table with a wire in the wrong spot, and care enough to try again.\nThe kid who wants to see inside.\nThe kid who opens it up instead of asking for a new one.\nHonestly, it's the stuff a lot of us wished we had as kids.\nHere's the skill.\nGuess. Test. Wrong. Try again.\nEvery build runs on that loop.\nThe motor doesn't spin, so they check the wire.\nStill nothing, so they check the battery.\nThat loop is how builders think, and kids can start it young.\nTonight, point at one thing in your house.\nThe toaster. The car window.\nAsk, \"how do you think that works?\"\nLet them be wrong.\nWhat does your kid always want to take apart?","cta":"What does your kid always want to take apart? Waitlist link in bio.","src":"why-build-scripts.md #12 (reused as is)","kind":"reused","notes":"Gabriel's script, already filmed or filming on Sunday studio day.","fillins":"","format":""}},"personal":[{"time":"9:30 AM","label":"Trial Reel","desc":"Quote reel shown to non-followers","has":true,"title":"Day [X] of building Kubot: no store yet, so we're taking it to the street","s":{"hooks":["This week's goal: [the goal for the week]. Problem: we don't have a store open yet.","no store yet, so we went outside","You should show people the thing before it's finished.","We don't have a store yet. So we took a robot to the street.","One week of building Kubot, start to finish"],"body":"ON-SCREEN SERIES TAG (after the hook): Day [X] of building Kubot\n\n(1 HOOK)\nThis week's goal: [the goal for the week, e.g. get Miami parents to care about Kubot before the doors open].\nProblem: we don't have a store open yet.\nDay [X] of building Kubot.\n\n(2 RISING ACTION)\nAnd honestly? You should show people the thing before it's finished.\nSo Wednesday, we put a robot on the street in Miami.\n[B-ROLL: the robot on the street, parents stopping, reactions]\nWe asked parents, \"[the question you actually asked]\"\n[one honest line on how unprepared you were, e.g. first time walking up to strangers with a robot].\nFriday, Gabriel taught a kids class in Bal Harbour.\n[B-ROLL: kids building Cyberbricks cars, hands, Gabriel teaching]\n\n(3 SECOND CONFLICT)\nThen [a real setback from this week, e.g. a print that failed, parents saying no, the shoot running out of time].\n[how it felt, one line].\n\n(4 CLIMAX) [MUSIC: beat drop. Tip: use a song from one of your favorite movies]\n[the peak moment of the week, e.g. a kid's car moving for the first time].\n[B-ROLL: that exact moment, slow it down]\nRobots don't teach here. Kids build them.\n\n(5 RESOLUTION)\nSunday, studio day. [what you filmed, e.g. Why Build with Gabriel and the podcast].\n[the goal achieved, in a real result you saw this week].\nIf you want to see it when the doors open, the waitlist is in my bio.\nAnd if you're building something nobody can see yet, show them the week anyway.","cta":"If you want to see it when the
