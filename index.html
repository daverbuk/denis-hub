gram", "kind": "take", "min": 1080, "time": "6:00 PM", "verb": "Film + post", "acct": "Denis", "doneKey": "kubot-denis-posted-27-6:00 PM-Instagram", "story": "Pin the debate question as the first comment. Story 20 min after posting: share the Reel with a poll (\"Smart bet or bubble?\"). Reply 6:00 to 7:00 PM. Push day: DM the Reel to 5 to 10 founder friends and repost the best debate reply to Story the next morning.", "reply": "6:00 to 7:00 PM", "push": true, "linkScript": true, "start": 1080, "end": 1140}]}], "more": {"daily": [["Order", "Time (ET)", "Video", "Why this slot"], ["1st", "9:30 AM", "Test video (non-followers), a quote video", "Goes only to non-followers, so it does not compete with your follower-facing Reels. Its 24h insights are ready by 9:30 AM next day, right when you post the next trial."], ["2nd", "1:30 PM (every day)", "Follower Farming", "Midday share window that most 2026 studies rank strongly. Lands exactly 4 hours after the test video and at least 4.5 hours before the My Take, so its first push is not cut off."], ["3rd", "6:00 PM (Sun 7:00 PM)", "My Take", "Your best format goes in the best evening window you can still staff live. You reply 6:00 to 7:00 PM and stop by 7 to 8 PM."]], "windows": ["Test video: 9:30 to 10:00 AM (light, mostly non-followers).", "List: 1:30 to 2:15 PM (Wed Oct 14 until 1:55 PM).", "My Take: 6:00 to 7:00 PM (Wed until 6:55 PM, Sun 7:00 to 7:45 PM).", "TikTok: 7:00 to 7:20 PM (skip on Wednesdays).", "Everything else: 8:15 to 8:30 AM sweep the next day.", "Basis: Buffer reports that replying to comments can lift engagement by about 21% [DATA]. That replies in the *first hour* specifically matter more is common practitioner advice that I could not find a 2026 study for [GUESS]."], "metrics": [["Video type", "Check at 24h", "Check at 7 days", "\"Make more of this\"", "\"Change the hook\"", "\"Change the body or topic\""], ["My Take", "Skip rate, avg watch time, comments per 1K reach, sends per 1K reach, follows", "Total views, follows per 1K reach, sends per 1K reach, poll votes", "7-day views 1.5x M or more AND sends or comments per 1K at or above M. Repeat the topic angle within 7 days", "Skip rate 5+ points above your skip median (or over 40%) while avg watch time of those who stay is at or above M: the trend line in the first 2 seconds is not landing, so restate it as a bold claim", "Skip rate normal but avg watch time under 0.75x M, or the retention graph drops at \"Why am I doing it?\": tighten the middle and bring the bet in earlier"], ["Follower Farming", "Sends per 1K reach (main), shares, tag comments, skip rate", "Views, sends per 1K, follows per 1K", "24h sends per 1K at 1.25x M or more: reuse the identity frame (meter, \"tells me how disciplined you are\") on a new topic", "Skip rate 5+ points above median: change the identity line or the first meter visual", "Low skip but sends under 0.75x M: the list items are not relatable, so rewrite the items and keep the hook"], ["Test video (non-followers) (Trial)", "Trial views and shares vs previous trials (Instagram shows this), skip rate", "If shared to everyone: views, follows, sends per 1K", "Trial views 1.5x your test video median and shares at or above median: share to everyone, then cross-post next day", "Trial views under 0.75x test video median: open with the story moment first and the quote second, or pick a sharper quote", "Good views but few shares or follows: the story is not tied clearly enough to your own journey and the store"]], "rules": ["4 hours between the two follower-facing Reels (list and My Take), and 3 hours between the test video and the list. The schedule now uses 4 hours between the test video and the list, and 4.5 hours or more between the list and the My Take (5.5 hours on Sun Oct 18, 6.5 hours on Sat Oct 24 and Sun Oct 25).", "TikTok gets the list at 3:00 PM and the My Take at 7:00 PM. YouTube Shorts gets the list at 5:00 PM and the My Take at 8:00 PM. All four are scheduled ahead, and their comments are handled in the next morning's 8:15 AM sweep. Quote reels are cross-posted only after they win their trial.", "Film each script right before its post time.", "Push days: Tue, Wed, Thu (Oct 14, 15, 20, 21, 22, 27). These are the top 3 days in Buffer's data, and Sprout and ezUGC agree on midweek [DATA]. On push days you post your strongest My Take topic of the week, run the full 60 minute reply window, DM the Reel to 5 to 10 founder friends right after posting (sends per reach is the signal non-followers respond to most [DATA, Mosseri via Monty]), and repost the best debate reply to Stories the next morning [GUESS on the tactics].", "Monday: Strong secondary day (PostFast and Instapect find Monday good for Reels) [DATA]. Use it for your second-best My Take topic.", "Fri and Sat: Buffer and Sprout rank them weakest, while Oneirosea's ET data ranks Friday best [DATA, conflicting]. Treat them as normal days and use your lighter topics. Saturday's list now posts at 1:30 PM like every other day, to keep a 4 hour gap after the test video (this gives up PostFast's Saturday late-morning window [DATA]).", "Sunday: Studio day. Everything is prescheduled, and the My Take goes up at 7:00 PM, Oneirosea's Sunday ET peak [DATA].", "Default: the My Take goes up live at 6:00 PM, so you can work the first hour.", "Time test (2 days only): On Sat Oct 24 and Sun Oct 25, schedule the My Take for 8:00 PM with Meta's scheduler, set ahead of time. Compare them with Sat Oct 17 (6 PM) and Sun Oct 18 (7 PM) on 24h views, average watch time and sends per reach. Yes, the first hour of comment replies falls after hours on those two days. Pin the debate question in advance. Then either do an optional 15 minute phone check at 8:00 to 8:15 PM, or reply in the 8:15 AM sweep next morning. If 8 PM wins by less than 10%, keep 6 PM, because the live reply window is worth more [GUESS].", "TikTok and Shorts already go out after 7 PM. They are all scheduled, and their replies always happen at the 8:15 AM sweep.", "Wed Oct 14: Robot on the Street shoot 2:00 to 5:00 PM. personal call at 7:00 PM, plus the 7:30 to 8:00 PM block. List replies end 1:55 PM and bet replies end 6:55 PM. TikTok and Shorts replies move to Thu 8:15 AM.", "Fri Oct 16 and 23: Kubot class 3:30 to 5:00 PM in Bal Harbour. Leave by 2:45 PM. Shorts list moves to 4:00 PM, inside Buffer's Friday Shorts peak. Optional 5:10 PM Story: class behind the scenes (signed releases, first names only, as the calendar notes say). Post the My Take at 6:00 PM from your phone. The evening coaching call at 9:00 PM is after hours and does not affect anything.", "Sun Oct 18 and 25: Studio day. All Sunday posts are set up in Meta's scheduler, TikTok Studio and YouTube Studio by Saturday noon. Reply only on breaks and from 7:00 to 7:45 PM.", "Mon Oct 19 and 26: coaching call 3:00 to 4:00 PM. Heads up: on Mon Oct 26, the personal appointment (3:10 to 3:30 PM) overlaps the coaching call. You may want to move one of them. I did not touch your calendar.", "Kubot \"Post:\" items on the calendar (support post, Robot on the Street park/Aventura, Real Families parent testimonial, Why Build #2 and #6, podcast eps 1 and 2): I assumed these go out on the Kubot account. If any go out as a Collab on your personal account, they count as a follower-facing post. In that case, drop that day's list or keep the Collab at least 4 hours away from 1:30 PM and 6:00 PM (for example 9:00 AM) [GUESS]."], "conflicts": 0}, "deals": [], "dealSource": "", "scripts": [{"n": "1", "title": "Every business I quit gave me one skill, but each one gets more useful", "format": "100 in 100 storytime, 5-step story (v2)", "kind": "take", "hook": "I had [timeframe] to [a goal you actually hit]. And [the conflict].", "onscreen": ["every business I quit left me something"], "steps": [{"name": "Hook", "text": "I had [timeframe] to [a goal you actually hit, e.g. land the first client for the AI agency].\nAnd [the conflict, e.g. I'd never built an automation for anyone]."}, {"name": "Build up", "text": "Everyone says quitting means starting over.\nHonestly? I think quitting is underrated.\n[B-ROLL: old photos or clips from car washing and the marketing agency]\nI'd just walked away from [the venture you'd just left].\nSo I started with what I had.\n[first real action toward the goal, e.g. the first outreach you sent].\n[second action, e.g. teaching yourself the tool from scratch].\n[B-ROLL: laptop, notes, whatever you actually worked from]\nI was not ready. [one honest line on how unprepared you were]."}, {"name": "Twist", "text": "Then [the midpoint setback, e.g. a deal that fell through, a demo that broke, a big no].\n[how close you came to quitting this one too]."}, {"name": "Big moment", "text": "That's when [the one skill from the marketing agency] kicked in.\n[the moment that old skill turned it around].\nSame kid. Different door. Same skill in my pocket."}, {"name": "Ending", "text": "[the goal achieved, e.g. the first client signed].\nI didn't start from zero. I was collecting pieces.\nAnd every door I walked out of was handing me the key to the next one."}], "fill": "- [timeframe] + [a goal you actually hit]: must be a goal you really reached (not Kubot's opening, which hasn't happened)\n- [the conflict]: what made it hard, e.g. no experience, no clients\n- [the venture you'd just left]\n- [first real action] and [second action] toward the goal\n- [one honest line on how unprepared you were]\n- [the midpoint setback]: a real down moment, e.g. a deal that fell through or a big no\n- [how close you came to quitting]\n- [the one skill from the marketing agency] + [the moment it turned it around]\n- [the goal achieved]", "source": "https://annamackstack.substack.com/p/how-to-pivot-your-career-without", "status": "To record", "notes": "Story format v2 (5-step). Source idea: \"remix beats reinvent\", carry one skill into the next door.\nThe whole story is ONE goal you actually hit, saved by one skill from an earlier venture. Pick the clearest real example; the AI agency's first client is only a suggestion.\nDebatable line: \"I think quitting is underrated.\"\nThe resolution has to feel earned, so the setback has to be real and specific. If there wasn't a real down moment, pick a different goal.\n~50-60s. On-screen text on the hook and on \"Same skill in my pocket.\"\nDaily template: [Drive link]"}, {"n": "2", "title": "My life by age, but every stop gets more honest", "format": "Listicle, 5-step story (v2)", "kind": "list", "hook": "At [age] I wanted [the goal you set young]. Most of what I tried didn't work.", "onscreen": ["my life by age (most of it didn't work)"], "steps": [{"name": "Hook", "text": "At [age] I wanted [the goal you set young, e.g. to build something of my own].\nMost of what I tried didn't work."}, {"name": "Build up", "text": "And honestly? A messy timeline at 19 is a flex.\n[B-ROLL: the age on screen, big, over a photo from each stop]\n[Age]. Washing cars. [one line on what you were trying to do].\n[Age]. Marketing agency. [one line on what you were trying to do].\nI had no idea what I was doing. [one honest line on how unprepared you were].\n[Age]. Food delivery startup. [one line on what you were trying to do]."}, {"name": "Twist", "text": "Then [the lowest point on the timeline, e.g. the moment a venture ended or a bet that went wrong].\n[how it felt, one line]."}, {"name": "Big moment", "text": "[Age]. AI automation agency. [the moment it started working, or the lesson that clicked].\n[Age]. UGC. [the moment people started watching, or the lesson that clicked].\nEvery stop that didn't work handed something to the next one."}, {"name": "Ending", "text": "21. Building Kubot with Gabriel in Aventura Mall.\n[how this is the goal from the hook, in your words].\nAnd the only timeline that fails is the one where you stop adding ages to it."}], "fill": "- [age] + [the goal you set young], e.g. to build something of your own\n- [Age] at each stop: car washing, marketing agency, food delivery startup, AI agency, UGC\n- [one line on what you were trying to do] at car washing, the marketing agency and food delivery\n- [one honest line on how unprepared you were]\n- [the lowest point on the timeline]: a real one, e.g. a venture ending or a bet that went wrong + [how it felt]\n- [the moment it started working] for the AI agency and UGC\n- [how this is the goal from the hook, in your words]", "source": "https://x.com/cem_hasoglu/status/2109300474130108712", "status": "To record", "notes": "Story format v2 (5-step). Source: Cem's age-by-age list of tries and failures that added up.\nThe resolution is Kubot, so the goal in the hook has to be something building Kubot honestly fulfils (e.g. building something of your own, something real you can hold). Don't say it's open or give a date.\nDebatable line: \"a messy timeline at 19 is a flex.\"\nIf the lowest point is the same venture you use in #6 or #8, don't post them close together.\n~50-60s.\nDaily template: [Drive link]"}, {"n": "3", "title": "Would you rather quit your job or build on the side? The answer gets less obvious", "format": "Would-you-rather", "kind": "take", "hook": "Would you rather quit your job or keep it and build at night?", "onscreen": ["quit or keep the job?"], "steps": [{"name": "Hook", "text": "Would you rather quit your job or keep it and build at night?"}, {"name": "The middle", "text": "Hear me out.\nOption one. The\nburn-the-boats,\ntwo-weeks-notice,\nall-in-on-day-one\nfounder,\nwho has to win before rent is due.\nOR the\nboring-paycheck,\nbuild-after-work,\nstill-standing-next-year\nfounder,\nwho nobody claps for yet.\nMost people pick option one.\nI think for most people, that's the wrong answer.\nQuitting isn't the flex.\nStaying alive long enough to win is.\nEvery time I switched ventures, it came down to [how you decided when to end one venture and start the next].\nLike when [the moment you knew it was time to move on from one venture to the next].\nI didn't jump until [what had to be true before you jumped].\nSo be honest. Type one or type two?"}, {"name": "Ending", "text": "And whichever you pick, pick the one that keeps you in the game long enough to find out you were right."}], "fill": "- [how you decided when to end one venture and start the next]\n- [the moment you knew it was time to move on: which venture, what happened]\n- [what had to be true before you jumped]", "source": "https://x.com/TheHashton/status/2109687508816613384", "status": "To record", "notes": "Source idea: built to $100k/mo, still wishes he hadn't quit; now keeping a salary AND building. Do not mention his numbers on camera, they aren't yours.\nDebatable line: \"for most people, that's the wrong answer\" (option one).\nUses the BASED would-you-rather stacked-hyphen rhythm. Pause on \"OR\".\nThe hook says \"build at night\" (from the digest). That's the viewer's situation, not yours. You said late-night framing isn't true for you, so don't add any \"I built at 2am\" lines.\nIf your own answer was actually option one, flip the debatable line to match. Keep it honest.\n~40-50s."}, {"n": "4", "title": "The law of the first customer, but the last step is the one everyone skips", "format": "Name-the-law essay, 5-step story (v2)", "kind": "test", "hook": "At [age] I needed [my first paying car wash customer]. I had [the conflict].", "onscreen": ["stop building, go ask"], "steps": [{"name": "Hook", "text": "At [age] I needed [the goal, e.g. my first paying car wash customer].\nI had [the conflict, e.g. no customers, no website, no idea where to start]."}, {"name": "Build up", "text": "If money is your only reason, you'll quit in 3 weeks.\nAnd your first idea doesn't matter. Your first customer does.\n[B-ROLL: car washing footage or photos, buckets, the car you started with]\nSo I [first action you took to find a customer].\nThen [second action].\nI had no clue how to sell. [one honest line on how unprepared you were]."}, {"name": "Twist", "text": "Then [the moment you almost quit car washing, e.g. the first no, a job that went badly, a week with no one].\nThere's a 16-year-old who built a whole app for barbers before talking to a single barber.\nFive shops said they were interested. He never followed up.\nThree weeks later, he quit.\nI was about one week from being him."}, {"name": "Big moment", "text": "So [the follow-up or ask that changed it].\n[the first yes, and how it happened]."}, {"name": "Ending", "text": "[the goal achieved, e.g. first car washed, first money in hand].\nThat's the law of the first customer. Find them, build it, follow up.\nAnd the follow-up text you're too nervous to send might be the whole business."}], "fill": "- [age] + [the goal], e.g. your first paying car wash customer\n- [the conflict], e.g. no customers, no website\n- [first action] and [second action] you took to find a customer\n- [one honest line on how unprepared you were]\n- [the moment you almost quit car washing]: real, e.g. the first no or a week with nobody\n- \"I was about one week from being him\": keep only if that's true, otherwise cut it\n- [the follow-up or ask that changed it] + [the first yes, and how it happened]\n- [the goal achieved]", "source": "https://www.ar4x.store/blog/what-i-learnt-after-failing-my-first-startup", "status": "To record", "notes": "Story format v2 (5-step). Source: AR4X blog. The 16-year-old, 5 shops and 3 weeks come from that article, not from you. Credit it in the caption.\n\"Law of the first customer\" is a name made up for this video.\nDebatable lines: \"you'll quit in 3 weeks\" and \"your first idea doesn't matter, your first customer does.\"\nThe second conflict uses the article to raise the stakes, but it still needs your own real down moment first.\n~50-60s.\nDaily template: [Drive link]"}, {"n": "5", "title": "10/10 free skills but it gets increasingly more niche", "format": "10/10 progressively niche", "kind": "list", "hook": "You can learn almost anything for free now. Most people just won't.", "onscreen": ["free skills (niche edition)"], "steps": [{"name": "Hook", "text": "You can learn almost anything for free now. Most people just won't."}, {"name": "The list", "text": "10/10 free skills, but it gets increasingly more niche.\n1. Learning to cook from videos instead of ordering in\n2. Learning how to sell, because no school is ever going to teach you\n3. Basic video editing on your phone, to turn what you know into something people can actually see\n4. Talking to AI like it's your personal tutor\n5. Writing copy by studying the ads you already scroll past\n6. Building your first AI automation from free tutorials, to make one hour of work do the job of ten\n(That's how I got into it. [how you learned AI automation without a formal path, one line].)\n7. Cold messaging people way out of your league"}, {"name": "Ending", "text": "8. And learning how to learn, because once you can teach yourself one thing for free, nobody can ever gatekeep the next one from you"}], "fill": "- [how you learned AI automation without a formal path, one line]", "source": "https://higrowthnewsletter.substack.com/p/youre-alive-during-the-greatest-leverage", "status": "To record", "notes": "Source idea: the greatest leverage window in history, learning is nearly free and your own mix of experiences is the edge.\nDebatable lines at 2 (\"no school is going to teach you\") and 7 (\"people way out of your league\").\nLines 3 and 6 carry the \"to [outcome]\". 8 starts with And.\nThe aside after 6 is optional, cut it if it breaks the rhythm. If you keep it, keep it under 3 seconds (like \"okay that one's just me\").\nOn-screen 1-4 word labels: Cooking / Selling / Editing / AI tutor / Copywriting / Automations / Cold DMs / Learning to learn.\n~30-40s."}, {"n": "6", "title": "Guess which of my businesses failed, but each one gets harder to call", "format": "Perception quiz, 5-step story (v2)", "kind": "take", "hook": "Not everything I built worked. Guess which one. I wanted [goal]. And [conflict].", "onscreen": ["guess which one failed"], "steps": [{"name": "Hook", "text": "Not everything I built worked. Guess which one.\nI wanted [the goal for that venture, said without naming it].\nAnd [the conflict, e.g. I had no experience in that industry]."}, {"name": "Build up", "text": "Answer honestly in your head while I tell it.\nAnd honestly? Failing at 19 is the cheapest tuition you'll ever pay.\n[B-ROLL: quick cuts of every venture, car washing, agency, delivery, AI, UGC, so the viewer can't tell yet]\nSo I [first action you took, said vaguely enough not to give it away].\nThen [second action].\nI was not ready. [one honest line on how unprepared you were]."}, {"name": "Twist", "text": "Then [the setback that ended it, e.g. the money ran out, a partner left, the market said no].\n[how it felt, one line]."}, {"name": "Big moment", "text": "It was [WHICH VENTURE: your choice, only the one that's true].\nON-SCREEN: [the venture name]\nBut what I took from it was [the one thing you took from it that you still use].\nAnd that's exactly what I used in [the venture that came next]."}, {"name": "Ending", "text": "[the goal from the hook, reached later through the next venture].\nComment which one you guessed.\nAnd if you're in the middle of yours right now, it's not the end. It's the part you'll tell later."}], "fill": "- [WHICH VENTURE] didn't go how you wanted: your choice. The digest guessed food delivery, but don't assume it\n- [the goal for that venture, said without naming it]\n- [the conflict], e.g. no experience in that industry\n- [first action] and [second action], vague enough not to give away the answer\n- [one honest line on how unprepared you were]\n- [the setback that ended it]: real, e.g. money ran out, a partner left, the market said no + [how it felt]\n- [the one thing you took from it that you still use]\n- [the venture that came next] + [the goal from the hook, reached later through it]: only if that's actually true", "source": "https://x.com/BertrandDiouly/status/2109388851441434804", "status": "To record", "notes": "Story format v2 (5-step). The guess stays in the hook: \"Guess which one.\" The climax is the reveal.\nSource: Bertrand left Google in 2011, hit $100k months, then lost it all and is rebuilding. Inspiration only; none of his story or numbers go on camera.\nDebatable line: \"Failing at 19 is the cheapest tuition you'll ever pay.\"\nThe rising-action b-roll has to cover every venture so the answer stays hidden until the climax.\nThe resolution only works if the goal really was reached later. If it wasn't, change the goal in the hook to something you did reach.\nDon't use the same venture as #8.\nDaily template: [Drive link]\n~50-60s."}, {"n": "7", "title": "Learning maxxing 101, but each step gets more uncomfortable", "format": "Maxxing 101, 5-step story (v2)", "kind": "test", "hook": "I had to [learning goal]. And [how much you knew before].", "onscreen": ["learning maxxing 101 (story edition)"], "steps": [{"name": "Hook", "text": "I had to [the learning goal, e.g. learn robots and 3D printing well enough to explain them on camera for Kubot].\nAnd [how much you knew about it before, in one honest line]."}, {"name": "Build up", "text": "Learning in private is the slowest way to learn.\nWaiting until you're good to post? Wrong order.\n[B-ROLL: you with a printer, a robot kit, notes, the first thing you tried]\nSo I [first thing you did to learn it].\nThen I posted it before I was ready. [what the first post or video was].\nUGC taught me that. [one thing UGC taught you about posting before you're ready]."}, {"name": "Twist", "text": "Then [the midpoint setback, e.g. a post that flopped, a comment that called you out, a print or build that failed on camera].\n[how it felt, one line]."}, {"name": "Big moment", "text": "I kept posting. [what you did next].\n[the moment learning in public paid off, e.g. a comment, a question you could finally answer, someone who reached out].\nON-SCREEN: post what you're learning"}, {"name": "Ending", "text": "[the learning goal achieved, said plainly].\nAnd the version of you that's scared to post the bad first video is the only thing between you and the good tenth one."}], "fill": "- [the learning goal]: one you actually reached, e.g. explaining robots and 3D printing on camera\n- [how much you knew about it before, in one honest line]\n- [first thing you did to learn it]\n- [what the first post or video was]\n- [one thing UGC taught you about posting before you're ready]\n- [the midpoint setback]: real, e.g. a flop, a call-out comment, a failed build on camera + [how it felt]\n- [what you did next] + [the moment learning in public paid off]\n- [the learning goal achieved]", "source": "https://startupanatomy.substack.com/p/the-polymath-who-built-a-multi-million", "status": "To record", "notes": "Story format v2 (5-step). Source: Steph Smith taught herself to code, documented it, and each project made the next easier.\nDebatable lines: \"Learning in private is the slowest way to learn\" and \"Waiting until you're good to post? Wrong order.\"\nKeeps the maxxing flavor in the text hook and the fragments, now as a story.\nKubot mention is short and soft. No pitch, no date. Use real footage (a print, the Friday class), no staged late-night shots.\nDaily template: [Drive link]\n~45-55s."}, {"n": "8", "title": "The law of rerouted luck, but it gets more personal", "format": "Name-the-law essay, 5-step story (v2), quote reel", "kind": "test", "hook": "I was all in on [the venture that ended] to [the goal]. Then [the conflict].", "onscreen": ["it had to end"], "steps": [{"name": "Hook", "text": "I was all in on [the venture that ended] to [the goal you had for it].\nAnd [the conflict, e.g. it wasn't working the way it needed to]."}, {"name": "Build up", "text": "Some setbacks aren't lessons. They're redirects.\nAnd most people fight them way too long.\n[B-ROLL: real footage or screenshots from that venture]\nI [first action you took to save it].\nThen [second action].\n[one honest line on how in over your head you were]."}, {"name": "Twist", "text": "Then [the ending, e.g. the day it shut down or the moment you walked away].\n[how it felt at the time, one line]."}, {"name": "Big moment", "text": "But that ending is exactly what led to [the next venture it led to].\n[the moment you realized the ending had opened the next door].\nThat's the law of rerouted luck."}, {"name": "Ending", "text": "[what you have now that you wouldn't have had otherwise].\nCormac McCarthy said it best.\n\"You never know what worse luck your bad luck has saved you from.\"\nAnd the door that just closed on you might be the only reason you'll ever notice the one next to it."}], "fill": "- [the venture that ended] + [the goal you had for it]\n- [the conflict], e.g. it wasn't working the way it needed to\n- [first action] and [second action] you took to save it\n- [one honest line on how in over your head you were]\n- [the ending]: the real moment it ended + [how it felt at the time]\n- [the next venture it led to] + [the moment you realized it]\n- [what you have now that you wouldn't have had otherwise]", "source": "https://x.com/SahilBloom/status/2109027081090990129", "status": "To record", "notes": "Story format v2 (5-step). Quote reel: the quote is read word for word in the resolution: \"You never know what worse luck your bad luck has saved you from.\" It's Cormac McCarthy, via Sahil Bloom's Oct 10 post (source link). \"Law of rerouted luck\" (kept to match the title) is a name made up for this video.\nDebatable line: \"Some setbacks aren't lessons. They're redirects.\"\nPick an ending you're fine talking about (no investor or private details, no money figures). Don't use the same venture as #6.\nMusic tip: McCarthy wrote No Country for Old Men, but that film has almost no score, so pick a song from a movie you love instead.\n~50-60s.\nDaily template: [Drive link]"}, {"n": "9", "title": "10/10 young founder truths but it gets increasingly more niche", "format": "10/10 progressively niche", "kind": "list", "hook": "Nobody takes you seriously at 21. That's fair.", "onscreen": ["nobody takes you seriously at 21"], "steps": [{"name": "Hook", "text": "Nobody takes you seriously at 21. That's fair."}, {"name": "The list", "text": "10/10 young founder truths, but it gets increasingly more niche.\n1. Nobody owes you a shot\n2. Being talented doesn't earn you anything either\n3. Showing up more prepared than everyone in the room, to make them forget how old you are\n4. Your first yes comes from proof, not a pitch\n5. Respect gets earned in the follow-ups\n6. Finding a partner with the experience you don't have yet, to borrow trust until you've earned your own\n(That's Gabriel for me. [what Gabriel brings that you couldn't bring at 21].)\n7. Entitlement kills respect faster than failure ever will"}, {"name": "Ending", "text": "8. And walking into [the room you had to earn your way into for Kubot] at 21, knowing nobody handed you that spot, because you went and earned it"}], "fill": "- [what Gabriel brings that you couldn't bring at 21]\n- [the room you had to earn your way into for Kubot, e.g. a first meeting about Aventura Mall]", "source": "https://x.com/SahilBloom/status/2109677307422261391", "status": "To record", "notes": "Source: Sahil Bloom, \"nobody owes you anything\", entitlement kills respect faster than failure.\nDebatable lines at 2 (\"talent doesn't earn you anything\") and 7 (entitlement vs failure).\nLines 3 and 6 carry the \"to [outcome]\". 8 starts with And.\nKeep the Gabriel aside under 3 seconds or cut it. Get Gabriel's OK before you describe what he brings.\nNo lease terms, no money, no open date.\nOptional soft plug in the caption only, approved wording: \"Kubot is a hands-on robotics and AI education company where kids design, 3D print and program their own robots.\"\n~30-40s."}, {"n": "10", "title": "Day [X] of building Kubot: no store yet, so we're taking it to the street", "format": "Build-in-public diary (100 in 100 storytime), 5-step story (v2)", "kind": "kubot", "hook": "This week's goal: [the goal for the week]. Problem: we don't have a store open yet.", "onscreen": ["no store yet, so we went outside"], "steps": [{"name": "Hook", "text": "This week's goal: [the goal for the week, e.g. get Miami parents to care about Kubot before the doors open].\nProblem: we don't have a store open yet.\nDay [X] of building Kubot."}, {"name": "Build up", "text": "And honestly? You should show people the thing before it's finished.\nSo Wednesday, we put a robot on the street in Miami.\n[B-ROLL: the robot on the street, parents stopping, reactions]\nWe asked parents, \"[the question you actually asked]\"\n[one honest line on how unprepared you were, e.g. first time walking up to strangers with a robot].\nFriday, Gabriel taught a kids class in Bal Harbour.\n[B-ROLL: kids building Cyberbricks cars, hands, Gabriel teaching]"}, {"name": "Twist", "text": "Then [a real setback from this week, e.g. a print that failed, parents saying no, the shoot running out of time].\n[how it felt, one line]."}, {"name": "Big moment", "text": "[the peak moment of the week, e.g. a kid's car moving for the first time].\n[B-ROLL: that exact moment, slow it down]\nRobots don't teach here. Kids build them."}, {"name": "Ending", "text": "Sunday, studio day. [what you filmed, e.g. Why Build with Gabriel and the podcast].\n[the goal achieved, in a real result you saw this week].\nIf you want to see it when the doors open, the waitlist is in my bio.\nAnd if you're building something nobody can see yet, show them the week anyway."}], "fill": "- [X]: day number\n- [the goal for the week]\n- [the question you actually asked] on the street (calendar options: \"Would you let a robot teach your kid?\" Brickell, or \"Would your kid rather have an iPad or build a robot?\" park)\n- [one honest line on how unprepared you were]\n- [a real setback from this week], e.g. a failed print or a run of no's + [how it felt]\n- [the peak moment of the week], e.g. a kid's car moving for the first time\n- [what you filmed] on Sunday\n- [the goal achieved, in a real result you saw this week]: no invented numbers", "source": "Google Calendar, week of Oct 12 (no external link)", "status": "To record", "notes": "2026-10-13 test | Day X. Story format v2 (5-step). Now a past-tense RECAP: record it after Sunday Oct 18 so the setback, climax and result are real.\nReal events from the calendar: Wed Oct 14, 2-5 PM ET, Robot on the Street shoot (two episodes). Fri Oct 16, 3:30-5 PM ET, Bal Harbour class (90-min Cyberbricks, Gabriel teaches, Denis assists; releases at the door, first names only, no school names). Sun Oct 18, warehouse studio day (Why Build #2 and #6, podcast episode 2; episode 1 posts that day).\nDebatable line: \"show people the thing before it's finished.\"\nNo \"Day X\" as the text hook (your rule). The only plug is the waitlist line. No prices, no open date.\n~50-60s.\nDaily template: [Drive link]"}, {"n": "11", "title": "Commit for 6 months, but it gets harder than it sounds", "format": "Name-the-law essay (Dan Koe-style), 5-step story (v2), quote reel", "kind": "test", "hook": "\"All you have to do is commit for 6 months. That's not a lot. It's actually very little.\" I gave [timeframe] to [goal]. [conflict].", "onscreen": ["6 months is nothing"], "steps": [{"name": "Hook", "text": "\"All you have to do is commit for 6 months. That's not a lot. It's actually very little.\"\nI gave myself [timeframe] to [a goal you committed to and actually hit].\nAnd [the conflict, e.g. nothing about it was working yet]."}, {"name": "Build up", "text": "Two weeks isn't trying. It's sampling.\n[B-ROLL: you working on it, real footage or screenshots from that time]\nSo I [first action toward the goal].\nThen [second action].\n[one honest line on how unprepared you were].\nCar washing, the marketing agency, food delivery. [how long you gave each one before moving on]."}, {"name": "Twist", "text": "Around the halfway point, [the midpoint setback, e.g. a month with no results, a client loss, wanting to switch to something new].\n[the moment you almost quit]."}, {"name": "Big moment", "text": "I didn't switch. [what you did instead].\n[the moment it started working].\nThat's the 1% rule. Give one thing 1% of your life before you call it."}, {"name": "Ending", "text": "[the goal achieved].\nDan Koe put it perfectly. \"6 months is 1% of 50 years, and most people can't stick to something that will change the trajectory of their life for 2 weeks.\"\nAnd if 1% of your life feels like too much to give your dream, it might not be your dream yet."}], "fill": "- [timeframe] + [a goal you committed to and actually hit]: ideally about 6 months; if it wasn't, say the real length\n- [the conflict], e.g. nothing was working yet\n- [first action] and [second action]\n- [one honest line on how unprepared you were]\n- [how long you gave each one before moving on]: car washing, marketing agency, food delivery\n- [the midpoint setback] + [the moment you almost quit]\n- [what you did instead] + [the moment it started working]\n- [the goal achieved]", "source": "https://x.com/thedankoe/status/2108957692328849678", "status": "To record", "notes": "2026-10-13 test | Dan Koe. Story format v2 (5-step). Quote reel: Dan Koe's post is read word for word, split across the hook (first three sentences) and the resolution (the last sentence). Source: @thedankoe on X, Oct 10, 2026.\n\"The 1% rule\" is a name made up for this video.\nDebatable line: \"Two weeks isn't trying. It's sampling.\"\nThe goal must be one you really stuck with and hit. If no single goal had a clean ~6-month run, use the real length and keep the quote as Dan's point.\nIf you post this near #2, use different footage, since both walk through the timeline.\n~50-60s.\nDaily template: [Drive link]"}, {"n": "12", "title": "10/10 signs you were never meant for a 9 to 5, but it gets increasingly more niche", "format": "10/10 progressively niche (follower farm)", "kind": "list", "hook": "If you relate to at least three of these, you were never meant for a 9 to 5.", "onscreen": ["signs you were never meant for a 9 to 5 (niche edition)"], "steps": [{"name": "Hook", "text": "If you relate to at least three of these, you were never meant for a 9 to 5."}, {"name": "The list", "text": "1. You do your best work when nobody's telling you how\n2. You'd rather make less doing your own thing than more doing someone else's\n3. Your notes app is full of business ideas, to remind yourself the job was never the plan\n4. A meeting that could've been a text physically hurts you\n5. You learn more from one YouTube video than a whole week of training\n6. You turn every annoying problem into \"someone should build this,\" because your brain sees businesses where everyone else sees complaints\n7. \"Job security\" sounds more like a cage than a comfort\n8. And you've stopped asking if you're ready, and started asking how long you're willing to be bad at it"}, {"name": "Ending", "text": "Comment how many you got."}], "fill": "None (no personal details).", "source": "n/a (original Follower Farming)", "status": "To record", "notes": "2026-10-13 test | Follower farm. Broad 10/10 with the escalation title; describes the viewer instead of telling them what to do. Uses one of the alternate hooks already in your library (\"signs you were never meant for a 9 to 5\").\nDebatable lines at 2 (less money, your own thing) and 7 (job security is a cage). Expect the 9-to-5 defenders in the comments, which is the point. Keep it positive, nobody's the villain.\nLines 3 and 6 carry the outcome. 8 starts with And.\nOn-screen labels: Self-directed / Own thing / Idea notes / Meeting allergy / Self-taught / Problem spotter / Security cage / Ready vs willing.\n\"Comment how many you got\" is optional; on 10/10s you usually let the And line end it. Cut it if you want a clean ending.\nNo Kubot mention. Pure growth.\n~35-45s."}, {"n": "13", "title": "Getting addicted easily is a superpower, but only if you aim it", "format": "Quote reel (Trial Reel), 5-step story (v2)", "kind": "test", "hook": "\"If you get addicted to things easily, you have one of the rarest traits there is.\" I had [timeframe] to [the goal]. And [the conflict].", "onscreen": ["you get addicted easily? good."], "steps": [{"name": "Hook", "text": "\"If you get addicted to things easily, you have one of the rarest traits there is.\"\nDan Koe posted that, and it got me.\nBecause I had [timeframe] to [a goal you got obsessed with and actually hit, e.g. get good at short-form video].\nAnd [the conflict, e.g. everyone I was up against had years on me]."}, {"name": "Build up", "text": "I've always been the guy who could lose a whole day to [what you used to get hooked on, e.g. games, scrolling].\nHonestly? I don't think that's a flaw.\n\"Most people can't stay interested in anything for more than a week. You can lose 6 hours to something without noticing.\"\nSo I took those hours and pointed them at [the goal].\n[B-ROLL: you working on it, real screen recordings, notes, drafts from that time]\n[first real action toward the goal].\nThen [second real action].\n[one honest line on how bad you were at the start]."}, {"name": "Twist", "text": "Then [the midpoint setback, e.g. weeks of work with nothing to show for it].\n[one honest line on the old habit pulling you back]."}, {"name": "Big moment", "text": "\"Right now that goes to games, feeds, and whatever hooks you first. That's the only problem.\"\nDiscipline was never my problem. Aim was.\nSo I [what you did instead of quitting].\n[the moment it clicked].\n[B-ROLL: that exact moment, slowed down]"}, {"name": "Ending", "text": "[the goal achieved].\n\"Pick one hard thing actually worth being addicted to. A skill, your body, your work. Give it the same obsession for 2 years and you'll pass people who've been at it for 10.\"\nAnd the only thing I ever changed was what I was addicted to."}], "fill": "- [timeframe] + [a goal you got obsessed with and actually hit]: must be real and already achieved (not Kubot's opening)\n- [the conflict], e.g. people with a big head start\n- [what you used to get hooked on]: only if it's true for you; cut the line if not\n- [first real action] and [second real action] toward the goal\n- [one honest line on how bad you were at the start]\n- [the midpoint setback] + [the old habit pulling you back]\n- [what you did instead of quitting] + [the moment it clicked]\n- [the goal achieved]\n- B-roll: real footage or screenshots from that time", "source": "https://x.com/thedankoe/status/2109271564931797433", "status": "To record", "notes": "Post Thu Oct 15, 2026 | Day 21 | 9:30 AM Trial Reel, quote reel (IG #21)\nDan Koe, @thedankoe on X, Oct 11, 2026. Quote reel: his whole post is read word for word, split across the hook, rising action, climax and resolution (each quoted line is his, in order). Credit him in the caption.\nStory format v2 (5-step). The story is ONE real goal you got obsessed with and hit. Short-form video is only a suggestion.\nDebatable lines: \"Honestly? I don't think that's a flaw.\" and \"Discipline was never my problem. Aim was.\"\nDifferent from #11 (commit for 6 months): that one is about sticking with it, this one is about redirecting an obsession. Don't post them back to back.\n~50-60s.\nDaily template: [Drive link]"}, {"n": "14", "title": "Your gym split tells me how disciplined you are (gym rat edition)", "format": "Follower farm list (identity, progressive meter)", "kind": "list", "hook": "Your gym split tells me exactly how disciplined you are. Gym rat edition.", "onscreen": ["your gym split exposes you"], "steps": [{"name": "Hook", "text": "ON-SCREEN: a \"discipline meter\" that fills with each point (shown on screen, not spoken)."}, {"name": "The list", "text": "Your gym split tells me exactly how disciplined you are. Gym rat edition.\n1. Whatever the guy next to you is doing. You have a neighbor, not a split. [METER 10%]\n2. Full body, three days a week. Smartest split here, and nobody believes you train. [METER 25%]\n3. Bro split, to hit chest every Monday with the rest of the planet. [METER 40%]\n4. Push pull legs. [METER 55%]\n5. Upper lower. You read one study about it. [METER 65%]\n6. Push pull legs twice a week, to hit every muscle twice and still be on time for the rest of your life. [METER 80%]\n7. 5 AM, fasted, before anyone's awake. [METER 90%]\n8. And the same boring split you've run for a year without missing a week, because the best split is the one you never skip. [METER 100%]"}, {"name": "Ending", "text": "Tag the friend who's stuck at 10%."}], "fill": "None (no personal details).", "source": "n/a (original Follower Farming)", "status": "To record", "notes": "Post Thu Oct 15, 2026 | Day 21 | 1:30 PM Follower farm list (IG #21)\nIdentity list built for tags: the meter is the hook, everyone wants to see where they land. Bridges your old gym audience into the account without a Kubot mention.\nDescribe the viewer, don't prescribe. Debatable lines at 2 (full body is the smartest split) and 7 (5 AM fasted). Expect the PPL vs bro split fight in the comments.\nLines 3 and 6 carry the outcome. 8 starts with And.\nOn-screen labels: Copycat / Full body / Bro split / PPL / Upper lower / PPL x2 / 5 AM fasted / Never skips.\nStory prompt from the calendar: \"tag the friend who...\" slider 20 min after posting.\n~25-30s."}, {"n": "15", "title": "Meta bet $200 billion on a vibe report, and I'm making the same bet", "format": "Personal bet take", "kind": "take", "hook": "Meta just admitted they bet up to $200 billion on AI before they knew it would work.", "onscreen": ["they bet $200B on a vibe"], "steps": [{"name": "Hook", "text": "Meta just admitted they bet up to 200 billion dollars on AI before they knew it would work."}, {"name": "The middle", "text": "On a podcast this week, Zuckerberg said he asked his AI chief, \"Alex, are you sure this is going to work?\"\nAll Alex had was what he called a \"vibe report\" and some charts.\nTheir CFO kept warning him. If it's bad, it's \"really, really, really bad.\"\nThey did it anyway.\nBecause if you wait for proof, you're already late.\nSo yeah, I know how it looks. I'm 21, [your line, e.g. I skipped my third year of college], and I'm opening a robot store in Aventura Mall.\nNo vibe report. No charts. Just [what you actually have to go on, e.g. a kids class every Friday].\nWhy am I doing it?\nBecause proof shows up after the bet, not before it.\nI'm betting that by the time robots are obvious, it's too late to start.\nThe people building with this stuff now, while it still looks crazy, are the ones who'll be ready.\nAnd if I'm wrong, I'm wrong at 21. That's the cheapest time to be wrong."}, {"name": "Ending", "text": "So tell me. Is betting before there's proof smart, or just expensive?"}], "fill": "- [your line]: the real thing you gave up or risked to do this (the college line is from your Oct 7 approved script; keep it only if you still want to say it)\n- [what you actually have to go on]: something real you've seen, e.g. the Friday class or parents' reactions on the street. No numbers you can't back up.", "source": "https://qz.com/zuckerberg-meta-ai-spending-uncertainty-muse-wonder-101326", "status": "To record", "notes": "Post Thu Oct 15, 2026 | Day 21 | 6:00 PM Personal bet take, push day (IG #21)\nNews: Zuckerberg and Alexandr Wang on the Cheeky Pint podcast with John Collison (posted Mon Oct 12, 2026). Zuckerberg: \"We're going to write this check for like, I don't know, $100 billion, $200 billion... Alex, are you sure this is going to work?\" Wang: the best he had was a \"vibe report\" and some charts. CFO Susan Li pulled Wang aside more than once: \"If it's bad, it's really, really, really bad.\" Model planning runs a year ahead and data centers several years, so the money goes in before proof (PJFP summary: https://pjfp.com/muse-wonder-zuckerberg-alexandr-wang-meta-ai-bet/). Podcast: https://cheekypint.transistor.fm/\nSay \"up to 200 billion\", since he said \"100 billion, 200 billion\".\nDifferent angle from the robot bubble videos: this one is about betting before proof, not whether it's a bubble.\nKubot is one line, about 3 seconds. No prices, no pitch.\nPin the debate question as the first comment; Story poll \"Smart bet or bubble?\" 20 min after posting.\n~55-60s."}, {"n": "16", "title": "Pick a challenge too big for you, but it gets harder before it gets better", "format": "Quote reel (Trial Reel), 5-step story (v2)", "kind": "test", "hook": "\"Pick a challenge too big for who you are now.\" At [age] I tried to [the too-big challenge]. And [why it was too big for you].", "onscreen": ["pick something too big for you"], "steps": [{"name": "Hook", "text": "\"Pick a challenge too big for who you are now.\"\nDan Koe posted that, and [one line on why it hit you].\nAt [age], I tried to [a too-big challenge you actually pulled off, e.g. land the first client for the AI agency].\nAnd [why it was too big for who you were then, e.g. I'd never built an automation for anyone]."}, {"name": "Build up", "text": "\"That's how people change. A challenge above your level drags the new version of you out.\"\nHonestly? If your goal doesn't scare you a little, it's too small.\n[B-ROLL: real footage or screenshots from that time]\nSo I [first real action toward it].\nThen [second real action].\n\"It will suck. You'll fail constantly.\"\n[one honest line on how out of your depth you were]."}, {"name": "Twist", "text": "\"You'll feel like a fraud for months.\"\nFor me that was [the real moment you felt like a fraud].\n\"Your old self will beg you to stay the same.\"\nMine kept saying [what your old self was telling you, e.g. go back to what you already know]."}, {"name": "Big moment", "text": "I didn't go back. [what you did instead].\n[the moment the new version of you showed up].\n[B-ROLL: that exact moment, slowed down]"}, {"name": "Ending", "text": "[the challenge achieved, said plainly].\n\"But if you can pull this off, 10-20 times throughout your life, you will blow past everyone else.\"\nI'm 21. That was one.\nAnd the version of me who pulled it off didn't exist until I picked something too big for the old one."}], "fill": "- [one line on why the quote hit you]\n- [age] + [a too-big challenge you actually pulled off]: must already be achieved (not Kubot's opening, which hasn't happened)\n- [why it was too big for who you were then]\n- [first real action] and [second real action]\n- [one honest line on how out of your depth you were]\n- [the real moment you felt like a fraud]\n- [what your old self was telling you]: only if true for you\n- [what you did instead] + [the moment the new version of you showed up]\n- [the challenge achieved]\n- \"That was one\": keep only if you'd honestly count it as one of your big ones", "source": "https://x.com/thedankoe/status/2106788829189271668", "status": "To record", "notes": "Post Fri Oct 16, 2026 | Day 22 | 9:30 AM Trial Reel, quote reel (IG #22)\nDan Koe, @thedankoe on X, Oct 4, 2026 (his newest unused post; his only newer ones are already in #11 and #13). Quote reel: his whole post is read word for word, split across all five beats in order. Credit him in the caption.\nStory format v2 (5-step). The story is ONE real challenge that was above your level at the time and that you actually pulled off. The AI agency's first client is only a suggestion.\nDebatable line: \"If your goal doesn't scare you a little, it's too small.\"\nDifferent from #11 (sticking with it for 6 months) and #13 (aiming an obsession): this one is about choosing something bigger than you. Don't use the same story or footage as #1, which also suggests the AI agency's first client.\nNo fake hardship: no late-night or \"fraud at 2am\" lines.\n~50-60s.\nDaily template: [Drive link]"}, {"n": "17", "title": "Your Friday night tells me how serious you are (builder edition)", "format": "Follower farm list (identity, progressive meter)", "kind": "list", "hook": "Your Friday night tells me exactly how serious you are. Builder edition.", "onscreen": ["your Friday night exposes you"], "steps": [{"name": "Hook", "text": "ON-SCREEN: a \"serious meter\" that fills with each point (shown on screen, not spoken)."}, {"name": "The list", "text": "Your Friday night tells me exactly how serious you are. Builder edition.\n1. Couch, takeout, and a show you've already seen twice. You earned it. [METER 10%]\n2. Out every single Friday, no matter what. Fun, but your goals are on read. [METER 20%]\n3. Gym on Friday night, to have the whole place to yourself while everyone else is out. [METER 35%]\n4. Dinner with the friends who actually push you. [METER 50%]\n5. Watching business YouTube \"for research.\" [METER 60%]\n6. Planning next week on Friday, to walk into Monday already knowing what a win looks like. [METER 75%]\n7. Leaving the party early because you've got something to build in the morning. [METER 90%]\n8. And enjoying your Friday night without a drop of guilt, because you already did the work all week. [METER 100%]"}, {"name": "Ending", "text": "Tag the friend who's stuck at 10%."}], "fill": "None (no personal details).", "source": "n/a (original Follower Farming)", "status": "To record", "notes": "Post Fri Oct 16, 2026 | Day 22 | 1:30 PM Follower farm list (IG #22)\nPosts on a Friday, so the topic is the day itself: viewers check where their own night lands. Same meter mechanic as #14 (gym split) but a different identity, so space it from #14 visually (different meter color or label).\nDescribe the viewer, don't prescribe. Point 1 is the agreeable \"you earned it.\" Debatable lines at 2 (goals on read) and 7 (leaving the party early). Keep it positive; going out isn't the villain, and 8 makes that the payoff.\nLines 3 and 6 carry the outcome. 8 starts with And.\nOn-screen labels: Couch / Out every week / Empty gym / Right friends / \"Research\" / Monday plan / Leaves early / No guilt.\nNo Kubot mention. Pure growth.\n~25-30s."}, {"n": "18", "title": "Robots just got let out of the cage, and I'm betting on the kids who build them", "format": "Personal bet take", "kind": "take", "hook": "Robots just got let out of the cage.", "onscreen": ["they took the fence down"], "steps": [{"name": "Hook", "text": "Robots just got let out of the cage."}, {"name": "The middle", "text": "This week, South Korea gave 20 humanoid robots permission to work right next to people.\nNot behind a fence. Next to them.\nOn real job sites. Chips, cars, ships, and delivery.\nThe old rules were written for robots that stay behind a fence.\nNow they're testing what happens when they don't.\nMost people see that and think, there go the jobs.\nI see something else.\nSo yeah, I know how it looks. I'm 21, [your line, e.g. the real thing you gave up or risked to do this], and I'm opening a robot store in Aventura Mall with a guy who's taught kids robotics for over 10 years.\nWhy am I doing it?\nBecause the robots are coming out from behind the fence either way.\nMy bet is the people who'll be fine are the ones who learned how robots work as kids.\nNot scared of them. Not replaced by them. Building them.\nEvery Friday I watch [one real thing you've seen at the Friday class, e.g. a kid's robot moving for the first time].\nThat kid won't be scared of a robot at work one day. They'll be the one who knows how it works.\nAnd honestly, I'd rather be early to this than scared of it."}, {"name": "Ending", "text": "So tell me. Robots working right next to people. Exciting or terrifying?"}], "fill": "- [your line]: the real thing you gave up or risked to do this. Use a different one from #15 if both are posted close together.\n- [one real thing you've seen at the Friday class]: something that actually happened, first names only or none. No numbers you can't back up.", "source": "https://www.techspot.com/news/114215-south-korea-removes-safety-barriers-humanoid-robots-work.html", "status": "To record", "notes": "Post Fri Oct 16, 2026 | Day 22 | 6:00 PM Personal bet take (IG #22)\nNews: on Oct 13, 2026, South Korea's industry ministry, through its regulatory sandbox, approved an exemption to industrial robot safety rules so 20 bipedal humanoids from Robros can be tested in spaces shared with or next to human workers. Sites: Nepes (semiconductors), Sungwoo Hitech (automotive), HD Hyundai Samho (shipbuilding), Delivery Lab (logistics). Tasks (cut from the script for time, add back as on-screen text if you want): cleaning semiconductor packaging parts, positioning car body parts, stacking scaffolding brackets, moving refrigerated packaging. It runs under extra safety standards, and the data will be used to rewrite the robot safety rules more broadly. Also: Seoul Economic Daily, https://en.sedaily.com/finance/2026/10/14/korea-clears-safety-rules-to-put-20-humanoid-robots-on\nSay \"permission to work next to people\" and \"testing\", since it's a trial, not a full rollout. Don't say the fences are gone everywhere.\nDebatable angle: jobs fear vs. \"the kids who build them.\" Keep it positive, no villains.\nKubot is one line, about 3 seconds, plus the Friday class line. No prices, no pitch, no open date.\nDifferent from #15 (betting before proof): this one is about robots leaving the cage and who'll be ready.\nPin the debate question as the first comment; Story poll \"Exciting or terrifying?\" 20 min after posting.\n~55-65s."}, {"n": "19", "title": "You need to be lore-maxxing, but it gets more personal than it sounds", "format": "Quote reel (Trial Reel), 5-step story (v2)", "kind": "test", "hook": "\"You need to be lore-maxxing.\" At [age] I [the risk that started a chapter]. And [why it felt like a risk].", "onscreen": ["lore-maxxing"], "steps": [{"name": "Hook", "text": "\"You need to be lore-maxxing.\"\nDan Koe posted that, and [one line on why it hit you].\nAt [age], I [the risk that started a chapter you actually lived, e.g. quit the safe path / started the agency / said yes to Kubot].\nAnd [why it felt like a risk at the time]."}, {"name": "Build up", "text": "\"Taking risks.\"\nHonestly? Most people I know are collecting a resume, not a story.\n[B-ROLL: real footage or screenshots from that chapter]\nSo I [first real action toward it].\nThen [second real action].\n\"Failing miserably.\"\n[one honest line on a real fail from that chapter]."}, {"name": "Twist", "text": "\"Relentlessly strategizing and experimenting.\"\nThen [the midpoint setback, e.g. something that almost made you walk it back].\n[one honest line on the safer version of you pulling you back]."}, {"name": "Big moment", "text": "I didn't walk it back. [what you did instead].\n[the moment that chapter became real].\n[B-ROLL: that exact moment, slowed down]"}, {"name": "Ending", "text": "[where that chapter left you, said plainly].\n\"Nobody wants to die with a story that isn't worth telling.\"\nI'm 21. I'm still writing mine.\nAnd the only way to get a story worth telling is to live one."}], "fill": "- [one line on why the quote hit you]\n- [age] + [the risk that started a chapter you actually lived]: must be real and already done (not Kubot's opening)\n- [why it felt like a risk at the time]\n- [first real action] and [second real action]\n- [one honest line on a real fail from that chapter]\n- [the midpoint setback] + [the safer version of you pulling you back]\n- [what you did instead] + [the moment that chapter became real]\n- [where that chapter left you]\n- B-roll: real footage or screenshots from that chapter", "source": "https://x.com/thedankoe/status/2108230069441180079", "status": "To record", "notes": "Post Sat Oct 17, 2026 | Day 23 | 9:30 AM Trial Reel, quote reel (IG #23)\nDan Koe, @thedankoe on X, Oct 8, 2026. Quote reel: his whole post is read word for word, split across all five beats in order. Credit him in the caption.\nFull quote: \"You need to be lore-maxxing. Taking risks. Failing miserably. Relentlessly strategizing and experimenting. Nobody wants to die with a story that isn't worth telling.\"\nStory format v2 (5-step). The story is ONE real risk/chapter you already lived. Different from #11 (6-month commit), #13 (aiming an addiction), and #16 (picking something too big).\nDebatable line: \"Most people I know are collecting a resume, not a story.\"\nNo fake hardship. No late-night warehouse lines.\n~50-60s.\nDaily template: [Drive link]"}, {"n": "20", "title": "Your notes app tells me how ambitious you are (founder edition)", "format": "Follower farm list (identity, progressive meter)", "kind": "list", "hook": "Your notes app tells me exactly how ambitious you are. Founder edition.", "onscreen": ["your notes app exposes you"], "steps": [{"name": "Hook", "text": "ON-SCREEN: an \"ambition meter\" that fills with each point (shown on screen, not spoken)."}, {"name": "The list", "text": "Your notes app tells me exactly how ambitious you are. Founder edition.\n1. Grocery lists and random passwords. You're just living. [METER 10%]\n2. A half-written business idea from 2023 you'll \"come back to.\" [METER 20%]\n3. Voice notes to yourself at 11 PM, to catch the idea before it disappears. [METER 35%]\n4. A folder named \"content\" with 40 half hooks. [METER 50%]\n5. Competitor screenshots you swear you're not copying. [METER 60%]\n6. A running list of people to DM this week, to actually move something instead of just thinking about it. [METER 75%]\n7. Your whole business plan living in one note nobody else has seen. [METER 90%]\n8. And opening Notes every morning before you open Instagram, because the plan comes before the scroll. [METER 100%]"}, {"name": "Ending", "text": "Tag the friend who's stuck at 10%."}], "fill": "None (no personal details).", "source": "n/a (original Follower Farming)", "status": "To record", "notes": "Post Sat Oct 17, 2026 | Day 23 | 1:30 PM Follower farm list (IG #23)\nIdentity meter list, same mechanic as #14 (gym split) and #17 (Friday night) but a new identity: the notes app. Space it visually (different meter color/label: ambition meter).\nDescribe the viewer, don't prescribe. Point 1 is agreeable. Debatable lines at 2 (half-written idea from 2023) and 7 (business plan in one note). Lines 3 and 6 carry the outcome. 8 starts with And.\nOn-screen labels: Groceries / Old idea / 11 PM voice / Content folder / Screenshots / DM list / Secret plan / Notes first.\nNo Kubot mention. Pure growth. Tag friend CTA.\n~25-35s."}, {"n": "21", "title": "Anyone with a browser can train a robot now, and I'm betting on the kids who already build", "format": "Personal bet take", "kind": "take", "hook": "Anyone with a browser can help train a robot now.", "onscreen": ["train a robot from your browser"], "steps": [{"name": "Hook", "text": "Anyone with a browser can help train a robot now."}, {"name": "The middle", "text": "A platform called Axis Robotics let people teleoperate simulated robots from a laptop.\nAs of early October, over 229,000 people have contributed.\nMillions of trajectories. Millions of tiny lessons for physical AI.\nNo lab coat. No warehouse. Just a browser and a human teaching a machine how to move.\nMost people see that and think, cool science project.\nI see something else.\nSo yeah, I know how it looks. I'm 21, [your line, e.g. the real thing you gave up or risked to do this], and I'm opening a robot store in Aventura Mall with a guy who's taught kids for over 10 years.\nWhy am I doing it?\nBecause physical AI still needs human skills and human data.\nA robot doesn't learn how to pick up a cup from a tweet. It learns from people who can do the thing.\nMy bet is the kids who build with their hands now are the ones this wave actually needs.\nNot just prompt engineers. Builders.\nAnd if I'm wrong, at least I spent my twenties around kids who make things."}, {"name": "Ending", "text": "So tell me. Crowdsourcing robot training from a browser. The future, or a gimmick?"}], "fill": "- [your line]: the real thing you gave up or risked to do this. Use a different one from #15 and #18 if those post close together.", "source": "https://docs.axisrobotics.ai/", "status": "To record", "notes": "Post Sat Oct 17, 2026 | Day 23 | 6:00 PM Personal bet take (IG #23)\nNews: Axis Robotics docs (as of Oct 10, 2026) report 229,000+ global contributors, 7.3M+ trajectories, browser-based simulation teleop plus mobile ego-centric capture. Covered in Up North AI Oct 11, 2026: https://www.upnorth.ai/en/news/2026-10-11\nSay \"help train\" / \"teleoperate simulated robots from a browser\" carefully. Do NOT pitch crypto, tokens, or $AXIS. Soft bet only: physical AI needs human skills and data; kids who build will matter.\nDebatable close: future vs gimmick.\nKubot is one soft line (~3s). No prices, no hard open-date pitch (Dec 1 soft ok if you add it; keep it light).\nDifferent from #18 (robots out of the cage / jobs) and #15 (betting before proof): this one is about human data powering physical AI.\nPin the debate question as the first comment; Story poll \"Future or gimmick?\" 20 min after.\n~55-65s."}, {"n": "22", "title": "Write more until you're not confused, but it gets more personal than a habit tip", "format": "Quote reel (Trial Reel), 5-step story (v2)", "kind": "test", "hook": "\"Write more. Write to think.\" I started writing when [the confused moment]. And [why you were stuck].", "onscreen": ["write until you're not confused"], "steps": [{"name": "Hook", "text": "\"Write more. Write to think.\"\nDan Koe posted that, and [one line on why it hit you].\nI started writing when [the confused moment you actually lived, e.g. you couldn't explain what you were building].\nAnd [why you were stuck]."}, {"name": "Build up", "text": "\"Write until you're no longer confused.\"\nHonestly? Most people think writing is for writers. It's not. It's for people who are lost.\n[B-ROLL: real notes, drafts, Notion, voice-to-text from that time]\nSo  2 years ago. Write so you never lose what took you years to figure out. A simple writing habit can change absolutely everything.\"\nStory format v2 (5-step). The story is ONE real stretch where writing (notes, scripts, journals, offers) unstuck you. Different from lore-maxxing (#19), addiction (#13), and too-big challenge (#16).\nDebatable line: \"Most people think writing is for writers. It's not. It's for people who are lost.\"\nNo fake hardship. Keep personal details in brackets.\n~50-60s.\nDaily template: [Drive link]"}, {"n": "23", "title": "How you spend Sunday morning tells me if you're actually building (weekend edition)", "format": "Follower farm list (identity, progressive meter)", "kind": "list", "hook": "How you spend Sunday morning tells me if you're actually building. Weekend edition.", "onscreen": ["your Sunday morning exposes you"], "steps": [{"name": "Hook", "text": "ON-SCREEN: a \"builder meter\" that fills with each point (shown on screen, not spoken)."}, {"name": "The list", "text": "How you spend Sunday morning tells me if you're actually building. Weekend edition.\n1. Sleeping in until noon. You needed it. [METER 10%]\n2. Brunch plans locked by Thursday. Fun, but the week already owns you. [METER 20%]\n3. Gym first, to knock out the one thing you control before the day gets loud. [METER 35%]\n4. Coffee and a walk with no podcast. Just thinking. [METER 50%]\n5. Cleaning your desk like that's productivity. [METER 60%]\n6. Two deep hours on the one project that matters, to walk into Monday already ahead. [METER 75%]\n7. Saying no to a hang so you can finish something that actually moves the needle. [METER 90%]\n8. And enjoying your Sunday without a drop of guilt, because you already built something before lunch. [METER 100%]"}, {"name": "Ending", "text": "Tag the friend who's stuck at 10%."}], "fill": "None (no personal details).", "source": "n/a (original Follower Farming)", "status": "To record", "notes": "Post Sun Oct 18, 2026 | Day 24 | 1:30 cond real action].\n\"3) Your mind, for all of history, capped by how many rooms you could be in\"\n[one honest line on how limited that used to feel before social]."}, {"name": "Twist", "text": "Then [the midpoint setback, e.g. posting into the void / clients drying up / nobody watching].\n[one honest line on wanting to go back to selling time because it felt clearer]."}, {"name": "Big moment", "text": "\"Social media changed that completely.\"\nI didn't go back. [what you did instead].\n[the moment one piece of your mind reached past one room].\n[B-ROLL: that exact moment, slowed down]"}, {"name": "Ending", "text": "[where that shift left you, said plainly].\n\"A brain and an internet connection can change your life.\"\nI'm 21. I'm still selling what I figure out, not just my hours.\nAnd the room I'm in now is a lot bigger than the one I started in."}], "fill": "- [one line on why the quote hit you]\n- [the time-based thing you actually did] + [why that ceiling bothered you]\n- [first real move toward selling your mind] and [second real action]\n- [how limited \"rooms\" felt before social]\n- [the midpoint setback] + [wanting to go back to selling time]\n- [what you did instead] + [the moment one piece of your mind reached past one room]\n- [where that shift left you]\n- Keep the 1/2/3 quote lines exact and in order. B-roll from the old model and the new one.", "source": "https://x.com/thedankoe/status/2105288204483997980", "status": "To record", "notes": "Post Mon Oct 19, 2026 | Day 25 | 9:30 AM Trial Reel, quote reel (IG #25)\nDan Koe, @thedankoe on X, Sep 30, 2026. Quote reel: his whole post is read word for word, split across all five beats in order. Credit him in the caption.\nFull quote: \"There are 3 things you can sell: 1) Your time, capped at 24 hours 2) Your things, capped by inventory 3) Your mind, for all of history, capped by how many rooms you could be in Social media changed that completely. A brain and an internet connection can change your life.\"\nStory format v2 (5-step). The story is ONE real shift from selling time/things to putting your mind online (content, UGC, teaching what you know). Different from #19 lore, #22 writing habit, #13 addiction, #16 too-big.\nDebatable line: \"Trading hours for money feels safe until you do the math.\"\nNo invented revenue numbers. No Kubot prices.\n~50-60s.\nDaily template: [Drive link]"}, {"n": "26", "title": "How you explain what you do at a party tells me how clear your vision is (identity edition)", "format": "Follower farm list (identity, progressive meter)", "kind": "list", "hook": "How you explain what you do at a party tells me how clear your vision is. Identity edition.", "onscreen": ["your party intro exposes you"], "steps": [{"name": "Hook", "text": "ON-SCREEN: a \"clarity meter\" that fills with each point (shown on screen, not spoken)."}, {"name": "The list", "text": "How you explain what you do at a party tells me how clear your vision is. Identity edition.\n1. \"Uh, it's complicated.\" You just lost them. [METER 10%]\n2. Your job title, and nothing else. Safe, but forgettable. [METER 20%]\n3. What you do in one plain sentence, to a stranger who has zero context. [METER 35%]\n4. The problem you solve before the company name. [METER 50%]\n5. A story about one customer, not a pitch deck. [METER 60%]\n6. What you're building toward in under 10 seconds, to make someone lean in instead of nod politely. [METER 75%]\n7. Asking them a question back before they can change the subject. [METER 90%]\n8. And explaining it so simply your grandma would get it, because if she doesn't, neither does the room. [METER 100%]"}, {"name": "Ending", "text": "Tag the friend who's stuck at 10%."}], "fill": "None (no personal details).", "source": "n/a (original Follower Farming)", "status": "To record", "notes": "Post Mon Oct 19, 2026 | Day 25 | 1:30 PM Follower farm list (IG #25)\nIdentity meter list (clarity meter). Different from gym (#14), Friday night (#17), notes app (#20), Sunday morning (#23).\nDescribe, don't prescribe. Point 1 agreeable/relatable. Debatable at 2 (job title only) and 7 (question back). Lines 3 and 6 carry outcome. 8 starts with And.\nOn-screen labels: Complicated / Job title / One sentence / The problem / One story / 10 seconds / Asks back / Grandma clear.\nNo Kubot. Pure growth. Tag friend CTA.\n~25-35s."}, {"n": "27", "title": "AI agents just raised $12M to handle your billing, and I'm betting on the people who get this early", "format": "Personal bet take", "kind": "take", "hook": "AI agents just raised 12 million dollars to handle billing and payments.", "onscreen": ["agents that do the books"], "steps": [{"name": "Hook", "text": "AI agents just raised 12 million dollars to handle billing and payments."}, {"name": "The middle", "text": "Fragment announced a Series A led by FirstMark on October 14.\nThe pitch is simple. Let AI agents safely run billing, payments, and accounting.\nNot just chat. Actual money movement, with controls so they don't break the books.\nMost people hear that and think, cool, less busywork.\nI think about who wins when agents run more of the business.\nSo yeah, I know how it looks. I'm 21, [your line, e.g. the real thing you gave up or risked to do this], and I'm betting on people who understand AI and robots early, not just chatbots.\nWhy am I doing it?\nBecause the companies that win the next decade won't only talk to AI.\nThey'll let it operate. Carefully. With systems built for it.\nMy bet is the people who learn how this stuff works now are the ones who won't get steamrolled by it later.\nAnd if I'm wrong, I'd rather be early than explaining why I waited."}, {"name": "Ending", "text": "So tell me. AI agents running billing and payments. Liberating, or terrifying?"}], "fill": "- [your line]: the real thing you gave up or risked to do this. Different from nearby bet takes if possible.", "source": "https://finance.yahoo.com/technology/ai/articles/fragment-raises-12-million-series-221500073.html", "status": "To record", "notes": "Post Mon Oct 19, 2026 | Day 25 | 6:00 PM Personal bet take (IG #25)\nNews: Fragment raised $12M Series A announced Oct 14, 2026, led by FirstMark (BoxGroup participating). Total funding to $23M. Lets vertical AI companies automate customers' billing, payments, and accounting with correctness controls. Sources: https://finance.yahoo.com/technology/ai/articles/fragment-raises-12-million-series-221500073.html and https://firstmark.com/story/finance-for-agents-our-investment-in-fragment/\nSay the raise and use case carefully. Soft personal bet: agents will run more business ops; he's betting on people who understand AI/robots early, not just chatbots. Soft Kubot/AI-robots line only if it fits in [your line] space; no prices, no pitch.\nDifferent from #15 (Meta vibe report), #18 (cage), #21 (browser data), #24 (Nasdaq humanoid): this one is agents in finance/ops.\nPin debate question; Story poll \"Liberating or terrifying?\" 20 min after.\n~55-65s."}], "public": true, "storyDoc": ""};

  if (rest.length) html += '<div class="hdr">To record</div><div class="group">' + rest.map(function(s) { return scriptRow(s, up); }).join('') + '</div>';
  if (recL.length) html += '<div class="hdr">Recorded</div><div class="group">' + recL.map(function(s) { return scriptRow(s, up); }).join('') + '</div>';
  if (!list.length) html += '<div class="hdr">&nbsp;</div><div class="group"><div class="empty">No scripts of this type yet. New ones get written each morning.</div></div>';
  if (H.storyDoc) html += '<div class="hdr">Template</div><div class="group"><a class="row" href="' + esc(H.storyDoc) + '" target="_blank" rel="noopener"><span class="main title link">Story Template</span>' + CHEV + '</a></div>';
  el.innerHTML = html;
  el.querySelectorAll('.seg button').forEach(function(b) { b.addEventListener('click', function() { scKind = b.dataset.k; renderScripts(); }); });
  el.querySelectorAll('[data-script]').forEach(function(b) { b.addEventListener('click', function() { openScript(scriptByN(b.dataset.script)); }); });
  el.querySelectorAll('[data-rec]').forEach(function(b) { b.addEventListener('click', function(e) { e.stopPropagation(); set('hub-recorded-' + b.dataset.rec, !scriptRecorded(b.dataset.rec)); rerender(); }); });
}

/* ---------- DEALS ---------- */
let dealSeg = 'reply', showIgnore = false;
function dealRow(d) { return ""; }
function renderDeals() { return;
  const el = document.getElementById('s-deals');
  const segs = [['reply', 'Reply now'], ['waiting', 'Waiting'], ['done', 'Done']];

  const list = H.deals.filter(function(d) { return d.group === dealSeg; });

    if (showIgnore) html += '<div class="hdr">Ignored</div><div class="group">' + ig.map(dealRow).join('') + '</div>';
