<style>

<script>
const H = {"posts": {"start": "2026-10-14", "end": "2026-10-31", "substackPublish": "https://substack.com/", "days": {"2026-10-14": {"personal": [{"platform": "linkedin", "kind": "LinkedIn post", "text": "Every business I quit left something in my pocket.\n\nMost people say quitting means starting over.\nFair. It feels that way.\n\nBut here's what I've noticed.\nCar washing taught me [the skill car washing gave you].\nThe marketing agency taught me [the skill the agency gave you].\nFood delivery taught me [what food delivery taught you].\n\nNone of those businesses are what I do now.\nAll of them are in what I do now.\n\nWhen I started [the next venture], I wasn't starting from zero.\n[one honest line on how unprepared you still were].\nBut [the one old skill] is what got me [the first real win].\n\nHere's the part people argue with:\nI think quitting is underrated.\nNot quitting early. Quitting on purpose, and taking the skill with you.\n\nNow I'm 21, building Kubot with Gabriel.\nSame habit. Every door hands me a key.\n\nAnd the next door you walk through will use something you picked up at the last one.\n\nWhat did your last job or business leave you with?", "parts": null, "src": "Script #1 (My Take), every business I quit gave me one skill", "id": "post-2026-10-14-p-0"}, {"platform": "x", "kind": "X post", "text": "Every business I quit gave me one skill.\n\nCar washing. Marketing agency. Food delivery.\n\nNone of them are what I do now. All of them are in what I do now.\n\nQuitting is underrated. Quitting without taking the skill is the mistake.", "parts": null, "src": "Script #1", "id": "post-2026-10-14-p-1"}, {"platform": "x", "kind": "X thread (optional)", "text": "", "parts": ["Every business I quit left me something. Here's what each one gave me:", "Car washing: [the skill car washing gave you].", "Marketing agency: [the skill the agency gave you].", "Food delivery: [what food delivery taught you].", "Now I'm building Kubot with Gabriel. I didn't start from zero. I was collecting pieces.\n\nAnd every door I walked out of handed me the key to the next one."], "src": "Script #1 and #2 (my life by age)", "id": "post-2026-10-14-p-2"}, {"platform": "substack", "kind": "Substack note", "text": "Your first idea doesn't matter. Your first customer does.\n\nThe AR4X blog tells the story of a 16-year-old who built a whole app for barbers before talking to a single barber. Five shops said they were interested. He never followed up. Three weeks later, he quit.\n\nMy first car wash customer came from [the follow-up or ask that changed it].\n\nStop building. Go ask.", "parts": null, "src": "Script #4 (test video), the law of the first customer", "id": "post-2026-10-14-p-3"}], "kubot": [{"platform": "linkedin", "kind": "LinkedIn post", "text": "Last Friday we filmed a Kubot class in Bal Harbour.\n\nNo script. Just the room.\n\nKids walked in to a table of parts.\nCyberBricks, printed pieces, wires.\n\nGabriel doesn't hand them a manual and step back.\nHe [how Gabriel actually opens a class].\nAnd then he lets them get stuck for a minute.\n\nThe best part of the footage isn't the robot moving.\nIt's the quiet before it.\nSmall hands, wiring, trying again.\n\nMost people think kids and tech means screens.\nFair, that's what most of it is.\nI think building is the point.\n\nBuilding in public means showing the unpolished parts too.\nWe don't have a store open yet.\nWe do have Fridays.\n\nAnd by pickup, the robots were moving.", "parts": null, "src": "Kubot details, Oct 14 support post (Oct 9 class footage)", "id": "post-2026-10-14-k-0"}, {"platform": "x", "kind": "X post", "text": "Filmed a Friday Kubot class in Bal Harbour.\n\nKids walk in to a pile of parts. By pickup the robots are moving.\n\nThe best footage isn't the robot moving. It's the quiet before it.", "parts": null, "src": "Kubot details, Oct 14", "id": "post-2026-10-14-k-1"}], "kubotTitle": "Support, Friday class b-roll"}, "2026-10-15": {"personal": [{"platform": "linkedin", "kind": "LinkedIn post", "text": "Meta just admitted they bet up to 200 billion dollars on AI before they knew it would work.\n\nOn the Cheeky Pint podcast, Zuckerberg said he asked his AI chief, \"Alex, are you sure this is going to work?\"\nAll Alex had was what he called a \"vibe report\" and some charts.\nTheir CFO kept warning him.\nThey did it anyway.\n\nMost people would call that reckless.\nFair. With that much money, it might be.\n\nBut here's the founder lesson I took from it:\nproof shows up after the bet, not before it.\n\nI'm 21. [your line, e.g. the real thing you gave up or risked].\nI'm opening a robot store in Aventura Mall with Gabriel.\nNo vibe report. No charts.\nJust [what you actually have to go on, e.g. a kids class every Friday].\n\nIf you wait until something is obvious, you're already late.\nAnd if I'm wrong, I'm wrong at 21.\nThat's the cheapest time to be wrong.\n\nSo tell me. Is betting before there's proof smart, or just expensive?", "parts": null, "src": "Script #15 (My Take), Meta bet on a vibe report", "id": "post-2026-10-15-p-0"}, {"platform": "x", "kind": "X post", "text": "Meta bet up to 200 billion dollars on AI with a \"vibe report\" and some charts.\n\nProof shows up after the bet, not before it.\n\nI'm 21 and opening a robot store with no charts at all. If I'm wrong, I'm wrong at the cheapest age.", "parts": null, "src": "Script #15", "id": "post-2026-10-15-p-1"}, {"platform": "x", "kind": "X thread (optional)", "text": "", "parts": ["Your gym split tells me exactly how disciplined you are. Gym rat edition:", "Whatever the guy next to you is doing. You have a neighbor, not a split.\n\nFull body, three days a week. Smartest split here, and nobody believes you train.", "Bro split, to hit chest every Monday with the rest of the planet.\n\nUpper lower. You read one study about it.", "Push pull legs twice a week.\n\n5 AM, fasted, before anyone's awake.", "And the same boring split you've run for a year without missing a week. The best split is the one you never skip.\n\nWhere do you land?"], "src": "Script #14 (Follower Farming), gym split", "id": "post-2026-10-15-p-2"}, {"platform": "substack", "kind": "Substack note", "text": "\"If you get addicted to things easily, you have one of the rarest traits there is.\" Dan Koe\n\nMost people can't stay interested in anything for more than a week.\n\nI've lost whole days to [what you used to get hooked on]. I don't think that was the flaw.\nDiscipline was never my problem. Aim was.\n\nPick one hard thing worth being addicted to.", "parts": null, "src": "Script #13 (test video), quote from Dan Koe", "id": "post-2026-10-15-p-3"}], "kubot": [{"platform": "linkedin", "kind": "LinkedIn post", "text": "Would you let a robot teach your kid?\n\nWe put a robot on the street in Brickell and let it ask.\n\n[the best answer you got].\n[the answer that surprised you].\n\nPeople had opinions. Fast.\n\nThen Gabriel steps in:\n\"Robots don't teach here. Kids build them.\"\n\nThat's the whole idea behind Kubot.\nGabriel has spent 10 years teaching kids robotics.\nIn his classes, the kids do the building.\n\nHere's my debatable take:\na kid who builds a robot learns more than a kid a robot teaches.\n\nBuilding in public means asking the questions before the store is open.\nAnd actually listening to the answers.\n\nAnd the best answer we got wasn't a yes or a no. It was [the answer that made you rethink something].\n\nWhat would you say if the robot asked you?", "parts": null, "src": "Kubot details, Oct 15 option a. If Real Families goes up instead, adapt the Oct 20 draft.", "id": "post-2026-10-15-k-0"}, {"platform": "x", "kind": "X post", "text": "We put a robot on the street in Brickell and asked: would you let a robot teach your kid?\n\n[best answer].\n\nThen Gabriel: \"Robots don't teach here. Kids build them.\"\n\nWhat would you say?", "parts": null, "src": "Kubot details, Oct 15 option a", "id": "post-2026-10-15-k-1"}], "kubotTitle": "Open slot: Robot on the Street, Brickell (if filmed first)"}, "2026-10-16": {"personal": [{"platform": "linkedin", "kind": "LinkedIn post", "text": "Robots just got let out of the cage.\n\nThis week, South Korea gave 20 humanoid robots permission to work right next to people.\nNot behind a fence. Next to them.\nChips, cars, ships and delivery.\n\nMost people see that and think, there go the jobs.\nI understand. It's a real worry.\n\nI see something else.\n\nI'm 21. [your line, e.g. the real thing you gave up or risked].\nI'm opening a robot store in Aventura Mall with Gabriel, who has taught kids robotics for over 10 years.\n\nThe robots are coming out from behind the fence either way.\nMy bet is the people who'll be fine are the ones who learned how robots work as kids.\nNot scared of them. Not replaced by them. Building them.\n\nEvery Friday I watch [one real thing you've seen at the Friday class].\nThat kid won't be scared of a robot at work one day.\nThey'll be the one who knows how it works.\n\nAnd honestly, I'd rather be early to this than scared of it.\n\nRobots working right next to people. Exciting or terrifying?", "parts": null, "src": "Script #18 (My Take), robots out of the cage", "id": "post-2026-10-16-p-0"}, {"platform": "x", "kind": "X post", "text": "South Korea just let 20 humanoid robots work right next to people. No fence.\n\nMost people think: there go the jobs.\n\nMy bet: the people who'll be fine learned how robots work as kids.\n\nExciting or terrifying?", "parts": null, "src": "Script #18", "id": "post-2026-10-16-p-1"}, {"platform": "x", "kind": "X thread (optional)", "text": "", "parts": ["Your Friday night tells me exactly how serious you are. Builder edition:", "Couch, takeout and a show you've already seen twice. You earned it.\n\nOut every single Friday, no matter what. Fun, but your goals are on read.", "Gym on Friday night, to have the whole place to yourself.\n\nDinner with the friends who actually push you.", "Planning next week on Friday, so you walk into Monday knowing what a win looks like.\n\nLeaving the party early because you've got something to build in the morning.", "And enjoying your Friday night without a drop of guilt, because you already did the work all week.\n\nWhere do you land?"], "src": "Script #17 (Follower Farming), Friday night", "id": "post-2026-10-16-p-2"}, {"platform": "substack", "kind": "Substack note", "text": "\"Pick a challenge too big for who you are now.\" Dan Koe\n\nAt [age], I tried to [a too-big challenge you actually pulled off].\nI felt like a fraud for [how long].\nMy old self kept saying [what your old self was telling you].\n\nI'm 21. That was one.\nThe version of me who pulled it off didn't exist until I picked something too big.", "parts": null, "src": "Script #16 (test video), quote from Dan Koe", "id": "post-2026-10-16-p-3"}], "kubot": [{"platform": "linkedin", "kind": "LinkedIn post", "text": "We asked one parent a simple question at pickup:\n\"What did you notice in your kid today?\"\n\n\"[the parent's answer, word for word].\"\n\nThat's [parent's first name], right after a Friday class in Bal Harbour.\n\nI'm not going to explain it.\nBuilding in public means letting parents say it in their own words.\n\nWhat I will say:\nGabriel builds every class around kids making something real.\nThat day it was [what the kid built].\n\nYou might say one testimonial doesn't prove much.\nFair.\nBut I think one honest sentence from a parent beats anything we could write ourselves.\n\nAnd we're going to keep asking.", "parts": null, "src": "Calendar post Oct 16 (Oct 9 class testimonial)", "id": "post-2026-10-16-k-0"}, {"platform": "x", "kind": "X post", "text": "Asked a parent at pickup: \"What did you notice in your kid today?\"\n\n\"[the parent's answer].\"\n\nOne honest sentence beats anything we could write.", "parts": null, "src": "Calendar post Oct 16", "id": "post-2026-10-16-k-1"}], "kubotTitle": "What did you notice in your kid today?"}, "2026-10-17": {"personal": [{"platform": "linkedin", "kind": "LinkedIn post", "text": "Anyone with a browser can help train a robot now.\n\nA platform called Axis Robotics lets people teleoperate simulated robots from a laptop.\nAs of early October, over 229,000 people have contributed.\nNo lab coat. No warehouse.\nJust a human teaching a machine how to move.\n\nMost people see that and think, cool science project.\nFair. It does look like one.\n\nHere's what I see:\nphysical AI still needs human skills.\nA robot doesn't learn how to pick up a cup from a tweet.\nIt learns from people who can do the thing.\n\nI'm 21. [your line, e.g. the real thing you gave up or risked].\nI'm opening a robot store in Aventura Mall with Gabriel, who has taught kids for over 10 years.\n\nMy bet is the kids who build with their hands now are the ones this wave actually needs.\nNot just prompt engineers. Builders.\n\nAnd if I'm wrong, at least I spent my twenties around kids who make things.\n\nCrowdsourcing robot training from a browser. The future, or a gimmick?", "parts": null, "src": "Script #21 (My Take), train a robot from your browser", "id": "post-2026-10-17-p-0"}, {"platform": "x", "kind": "X post", "text": "Over 229,000 people have helped train robots from a browser on Axis Robotics.\n\nA robot doesn't learn to pick up a cup from a tweet. It learns from people who can do the thing.\n\nMy bet: kids who build with their hands are who this wave needs.", "parts": null, "src": "Script #21", "id": "post-2026-10-17-p-1"}, {"platform": "x", "kind": "X thread (optional)", "text": "", "parts": ["Your notes app tells me exactly how ambitious you are. Founder edition:", "Grocery lists and random passwords. You're just living.\n\nA half-written business idea from 2023 you'll \"come back to.\"", "Voice notes to yourself at 11 PM, to catch the idea before it disappears.\n\nA folder named \"content\" with 40 half hooks.", "A running list of people to DM this week.\n\nYour whole business plan living in one note nobody else has seen.", "And opening Notes every morning before you open Instagram, because the plan comes before the scroll.\n\nWhere do you land?"], "src": "Script #20 (Follower Farming), notes app", "id": "post-2026-10-17-p-2"}, {"platform": "substack", "kind": "Substack note", "text": "\"You need to be lore-maxxing.\" Dan Koe\n\nMost people I know are collecting a resume, not a story.\n\nAt [age], I [the risk that started a chapter you actually lived].\nIt [one honest line on a real fail from that chapter].\n\n\"Nobody wants to die with a story that isn't worth telling.\"\nI'm 21. I'm still writing mine.", "parts": null, "src": "Script #19 (test video), quote from Dan Koe", "id": "post-2026-10-17-p-3"}], "kubot": [{"platform": "linkedin", "kind": "LinkedIn post", "text": "Would your kid rather have an iPad or build a robot?\n\nWe sent a robot dog to a park to ask parents and kids.\n\nThe kids answered first. [the best kid answer].\nThe parents took longer. [the best parent answer].\n\nMost parents I talk to say screens aren't the enemy.\nI agree.\nBut using something and building something are not the same skill.\n\nThat's what Gabriel teaches at Kubot.\nThe robot dog asks the question.\nThe kids are the ones who build it.\n\nBuilding in public, week by week, before the store opens.\n\nAnd honestly, the kids' answers were the easy part. Watching the parents think about it was the real show.", "parts": null, "src": "Calendar post Oct 17 (Robot on the Street)", "id": "post-2026-10-17-k-0"}, {"platform": "x", "kind": "X post", "text": "Sent a robot dog to a park to ask: would your kid rather have an iPad or build a robot?\n\nKids answered fast. Parents took longer.\n\nRobots don't teach here. Kids build them.", "parts": null, "src": "Calendar post Oct 17", "id": "post-2026-10-17-k-1"}], "kubotTitle": "Robot on the Street: iPad or build a robot?"}, "2026-10-18": {"personal": [{"platform": "linkedin", "kind": "LinkedIn post", "text": "A humanoid robot just rang the Nasdaq closing bell.\n\nOn October 13, RoboStrategy brought Dyna Robotics' Taku to Times Square.\nA robot, on the public markets stage.\n\nMost people saw a cool photo.\nI get it. It was a cool photo.\n\nI saw the timeline speeding up.\nRobots aren't just lab demos anymore.\nThey're showing up where money already believes.\n\nI'm 21. [your line, e.g. the real thing you gave up or risked].\nI'm building a store in Aventura Mall so kids can learn to build robots while their parents shop.\n\nHere's the part people will push back on:\nI think robots go mainstream through public markets and malls at the same time.\nNot someday. Now.\n\nIf humanoids are ringing bells on Wall Street, the kids who understand them early won't be scared when they show up at work.\n\nAnd I'd rather teach kids how they work than wait for everyone else to panic.\n\nA robot on the Nasdaq stage. Hype, or the start of something real?", "parts": null, "src": "Script #24 (My Take), a humanoid rang the Nasdaq bell", "id": "post-2026-10-18-p-0"}, {"platform": "x", "kind": "X post", "text": "A humanoid robot just rang the Nasdaq closing bell.\n\nMost people saw a cool photo. I saw the timeline speeding up.\n\nRobots go mainstream through public markets and malls at the same time.\n\nHype, or the start of something real?", "parts": null, "src": "Script #24", "id": "post-2026-10-18-p-1"}, {"platform": "x", "kind": "X thread (optional)", "text": "", "parts": ["How you spend Sunday morning tells me if you're actually building. Weekend edition:", "Sleeping in until noon. You needed it.\n\nBrunch plans locked by Thursday. Fun, but the week already owns you.", "Gym first, to knock out the one thing you control before the day gets loud.\n\nCoffee and a walk with no podcast. Just thinking.", "Two deep hours on the one project that matters.\n\nSaying no to a hang so you can finish something that actually moves the needle.", "And enjoying your Sunday without a drop of guilt, because you already built something before lunch.\n\nWhere do you land?"], "src": "Script #23 (Follower Farming), Sunday morning", "id": "post-2026-10-18-p-2"}, {"platform": "substack", "kind": "Substack note", "text": "\"Write more. Write to think. Write until you're no longer confused.\" Dan Koe\n\nMost people think writing is for writers.\nIt's not. It's for people who are lost.\n\nI started writing when [the confused moment you actually lived].\nWhat it changed: [what writing changed for you, said plainly].", "parts": null, "src": "Script #22 (test video), quote from Dan Koe", "id": "post-2026-10-18-p-3"}, {"platform": "substack", "kind": "Substack long-form", "text": "TITLE: Betting before the proof: four robot and AI headlines from one week\nSUBTITLE: Why I'm 21 and opening a robot store while everyone waits for charts\n\nOUTLINE\n1. Intro: the week every headline said the same thing.\n2. Meta's \"vibe report\" (Script #15)\n   Up to 200 billion dollars on AI before they knew it would work.\n   Point: proof shows up after the bet, not before it.\n3. Robots out of the cage (Script #18)\n   South Korea lets 20 humanoids work next to people.\n   Point: the kids who build robots won't be scared of them at work.\n4. Training robots from a browser (Script #21)\n   Over 229,000 people on Axis Robotics.\n   Point: physical AI still needs human skills. Builders, not just prompt engineers.\n5. A humanoid on the Nasdaq stage (Script #24)\n   Taku rings the closing bell.\n   Point: robots go mainstream through public markets and malls at the same time.\n6. My bet: Kubot with Gabriel, and what I'm actually going on: [what you actually have to go on].\n7. Close: the question for readers. Where would you bet, and how early?\n\nDRAFT INTRO\nThis week, four headlines landed that all said the same thing.\n\nMeta admitted it bet up to 200 billion dollars on AI with what its AI chief called a \"vibe report\" and some charts.\nSouth Korea gave 20 humanoid robots permission to work right next to people. No fence.\nOver 229,000 people helped train robots from a browser.\nAnd a humanoid robot rang the Nasdaq closing bell.\n\nMost people read headlines like that and file them under \"interesting.\"\nFair. Most of us have a week to get through.\n\nI read them differently, because I've already placed my bet.\n\nI'm 21. [your line, e.g. the real thing you gave up or risked].\nI'm opening a robot store in Aventura Mall with Gabriel, who has taught kids robotics for over 10 years.\nFrom the outside, I know how that looks.\nNo charts. No vibe report. Just [what you actually have to go on].\n\nHere's the part I expect some of you to disagree with.\nI don't think the people who'll be fine in the next decade are the ones who wait for proof.\nI think it's the ones who learned how this stuff works before it was obvious.\nNot scared of robots. Not replaced by them. Building them.\n\nEvery one of this week's headlines is a version of that bet.\nMeta made it with billions. South Korea made it with a rule change. Axis made it with a browser.\nI'm making it with a store and a Friday class.\n\nIn this post, I'll go through each one, what I think it actually means, and where I could be wrong.\n\nAnd if I am wrong, I'm wrong at 21. That's the cheapest time to be.", "parts": null, "src": "The week's My Take scripts: #15, #18, #21, #24", "id": "post-2026-10-18-p-4"}], "kubot": [{"platform": "linkedin", "kind": "LinkedIn post", "text": "10 years of teaching kids robotics, in one conversation.\n\nGabriel is my partner at Kubot.\nI'm 21. He brings the experience I don't have yet.\n\nSo for our first podcast episode, I just asked him questions.\n[the question that got the best answer].\n\nThe thing that stuck with me:\n\"[Gabriel's best line from the episode].\"\n\nMost people think teaching kids tech is about the tech.\nI used to think that too.\nAfter this conversation, I think it's mostly about [what Gabriel says it's actually about].\n\nWe're building Kubot in public, and this is part of it.\nFull episode: [link].\n\nAnd if you've got a kid who takes everything apart, this one's for you.", "parts": null, "src": "Calendar post Oct 18 (podcast episode 1)", "id": "post-2026-10-18-k-0"}, {"platform": "x", "kind": "X post", "text": "Episode 1: 10 years of teaching kids robotics, in one conversation with Gabriel.\n\nBest line: \"[Gabriel's best line].\"\n\n[link]", "parts": null, "src": "Calendar post Oct 18", "id": "post-2026-10-18-k-1"}], "kubotTitle": "Podcast episode 1"}, "2026-10-19": {"personal": [{"platform": "linkedin", "kind": "LinkedIn post", "text": "AI agents just raised 12 million dollars to handle billing and payments.\n\nFragment announced a Series A led by FirstMark on October 14.\nThe idea: let AI agents safely run billing, payments and accounting.\nNot just chat. Actual money movement, with controls so they don't break the books.\n\nMost people hear that and think, cool, less busywork.\nThat's true. It is less busywork.\n\nI think about who wins when agents run more of the business.\n\nThe companies that win the next decade won't only talk to AI.\nThey'll let it operate.\nCarefully. With systems built for it.\n\nI'm 21. [your line, e.g. the real thing you gave up or risked].\nI'm betting on people who understand AI and robots early, not just chatbots.\n\nThe founder lesson for me:\nlearn how this stuff works now, so you don't get steamrolled by it later.\n\nAnd if I'm wrong, I'd rather be early than explaining why I waited.\n\nAI agents running billing and payments. Liberating, or terrifying?", "parts": null, "src": "Script #27 (My Take), AI agents for billing", "id": "post-2026-10-19-p-0"}, {"platform": "x", "kind": "X post", "text": "AI agents just raised 12 million dollars to run billing and payments.\n\nNot chat. Actual money movement.\n\nThe companies that win won't only talk to AI. They'll let it operate, carefully.\n\nLiberating, or terrifying?", "parts": null, "src": "Script #27", "id": "post-2026-10-19-p-1"}, {"platform": "x", "kind": "X thread (optional)", "text": "", "parts": ["How you explain what you do at a party tells me how clear your vision is:", "\"Uh, it's complicated.\" You just lost them.\n\nYour job title, and nothing else. Safe, but forgettable.", "What you do in one plain sentence, to a stranger with zero context.\n\nThe problem you solve before the company name.", "A story about one customer, not a pitch deck.\n\nAsking them a question back before they can change the subject.", "And explaining it so simply your grandma would get it, because if she doesn't, neither does the room.\n\nWhere do you land?"], "src": "Script #26 (Follower Farming), party intro", "id": "post-2026-10-19-p-2"}, {"platform": "substack", "kind": "Substack note", "text": "\"There are 3 things you can sell: your time, your things, your mind.\" Dan Koe\n\nI used to sell [the time-based thing you actually did].\nTrading hours for money feels safe until you do the math.\n\n\"A brain and an internet connection can change your life.\"\nI'm 21. I'm still selling what I figure out, not just my hours.", "parts": null, "src": "Script #25 (test video), quote from Dan Koe", "id": "post-2026-10-19-p-3"}], "kubot": [{"platform": "linkedin", "kind": "LinkedIn post", "text": "The best thing that can happen to your kid is a robot that doesn't work.\n\nEvery parent wants to fix it for them.\nThat's love.\n\nBut Gabriel says sometimes helping is the thing that slows them down.\n\nA robot that doesn't move isn't a bad grade.\nIt's information.\nIt tells them where to look next.\n\nSame with a 3D print that fails.\nA perfect print teaches them to press a button.\nA failed one teaches them how it actually works.\n\nThis is the part of Kubot I didn't understand before I watched Gabriel teach.\nHe waits.\nThen he asks, \"what have you tried?\"\n\nThat stuck feeling isn't failure.\nIt's the lesson.\n\nSo tonight, when your kid gets stuck, give it two minutes before you step in.\n\nAnd be honest. Do you jump in, or do you wait?", "parts": null, "src": "Why Build? #2 script", "id": "post-2026-10-19-k-0"}, {"platform": "x", "kind": "X post", "text": "The best thing that can happen to your kid is a robot that doesn't work.\n\nA failed print teaches more than a perfect one.\n\nGive them two minutes before you step in. Then ask, \"what have you tried?\"", "parts": null, "src": "Why Build? #2 script", "id": "post-2026-10-19-k-1"}], "kubotTitle": "Why Build? #2 Handling frustration"}, "2026-10-20": {"kubot": [{"platform": "linkedin", "kind": "LinkedIn post", "text": "Real Families, from last Friday's class in Bal Harbour.\n\nOne parent. One answer at pickup.\n\n\"[the parent's answer, word for word].\"\n\nThat's [parent's first name].\nTheir kid had just built [what the kid built].\n\nWe don't script these.\nNo actors, no staging. Just Gabriel's class and whoever's at pickup.\n\nI'll admit the debatable part:\nI trust a parent at pickup more than any review site.\n\nBuilding in public means showing the families, not just the robots.\n\nAnd [kid's first name] wanted to show us the robot again before they left.", "parts": null, "src": "Calendar post Oct 20 (Oct 16 class testimonial)", "id": "post-2026-10-20-k-0"}, {"platform": "x", "kind": "X post", "text": "Real Families. One parent at pickup, right after Friday class:\n\n\"[the parent's answer].\"\n\nNo script. No actors. Just Gabriel's class and whoever's at pickup.", "parts": null, "src": "Calendar post Oct 20", "id": "post-2026-10-20-k-1"}], "kubotTitle": "Real Families: parent testimonial"}, "2026-10-21": {"kubot": [{"platform": "linkedin", "kind": "LinkedIn post", "text": "Watch [his or her] face when [he or she] shows [their] mom.\n\nThat's the clip from Friday pickup.\n[kid's first name] runs up with a robot they built in Gabriel's class.\nExplains every part.\nThen the robot moves.\n\n[mom's first name] gave us one sentence:\n\"[her sentence, word for word].\"\n\nMost people would say the robot is the product.\nI get it.\nI think that look is the product.\n\nBuilding Kubot in public means we show you that part too.\n\nAnd it never gets old.", "parts": null, "src": "Kubot details, Oct 21", "id": "post-2026-10-21-k-0"}, {"platform": "x", "kind": "X post", "text": "Friday pickup. [kid's first name] shows [their] mom the robot they built.\n\nThen it moves.\n\nThat look is why we do this.", "parts": null, "src": "Kubot details, Oct 21", "id": "post-2026-10-21-k-1"}], "kubotTitle": "Real Families, Friday pickup"}, "2026-10-22": {"kubot": [{"platform": "linkedin", "kind": "LinkedIn post", "text": "I've watched shy kids change in one hour.\n\nNot because someone told them to speak up.\nHonestly, telling a shy kid to speak up almost never works.\n\nThe kid who hides behind mom at drop off.\nThe kid who won't say their name in the circle.\n\nThen they finish a robot.\nAnd someone asks how it works.\n\nGabriel pointed this out to me.\nThey're not talking about themselves anymore.\nThey're talking about the thing they made.\n\nThe robot takes the spotlight off them.\nAnd nobody in the room knows that robot better than they do.\n\nThat's confidence.\nIt comes from knowing something, not from being told to be brave.\n\nTonight, ask your kid to teach you how they made something. Anything.\n\nAnd then follow their steps exactly.", "parts": null, "src": "Why Build? #6 script", "id": "post-2026-10-22-k-0"}, {"platform": "x", "kind": "X post", "text": "Telling a shy kid to speak up almost never works.\n\nAsk them how their robot works instead.\n\nThey stop talking about themselves and start talking about what they made. That's where confidence comes from.", "parts": null, "src": "Why Build? #6 script", "id": "post-2026-10-22-k-1"}], "kubotTitle": "Why Build? #6 Confidence"}, "2026-10-23": {"kubot": [{"platform": "linkedin", "kind": "LinkedIn post", "text": "Watch their face when they show their parent.\n\nFriday class in Bal Harbour.\nThe kid shows the build.\nThe parent gives one answer.\n\n\"[the parent's answer, word for word].\"\nThat's [parent's first name].\n\nI could write a long post about why building matters.\nGabriel's been teaching kids robotics for 10 years, and he'd say it better.\n\nBut I think 30 seconds of a kid explaining their robot says more than either of us could.\n\nBuilding in public. One Friday at a time.\n\nAnd [kid's first name] already knows what they want to build next.", "parts": null, "src": "Calendar post Oct 23 (Oct 16 class testimonial)", "id": "post-2026-10-23-k-0"}, {"platform": "x", "kind": "X post", "text": "Watch their face when they show their parent.\n\nFriday class, Bal Harbour. The kid shows the build. The parent gives one answer.\n\n\"[the parent's answer].\"", "parts": null, "src": "Calendar post Oct 23", "id": "post-2026-10-23-k-1"}], "kubotTitle": "Watch their face when they show their parent"}, "2026-10-24": {"kubot": [{"platform": "linkedin", "kind": "LinkedIn post", "text": "Would you rather your kid use robots or build them?\n\nWe asked at the Aventura Mall walkway, with the mall's permission.\n\n[the best answer you got].\n[the answer that surprised you].\n\nMost people say \"both.\"\nFair. Probably the right answer.\n\nBut I'd push it one step:\nthe kids who build them will understand the ones they use.\n\nThat's what Gabriel teaches.\nRobots don't teach here. Kids build them.\n\nBuilding Kubot in public means taking these questions to the street, every week.\n\nAnd the answers keep getting better.", "parts": null, "src": "Calendar post Oct 24 (Robot on the Street, Aventura)", "id": "post-2026-10-24-k-0"}, {"platform": "x", "kind": "X post", "text": "Asked Aventura: would you rather your kid use robots or build them?\n\nMost people said both.\n\nThe kids who build them will understand the ones they use.", "parts": null, "src": "Calendar post Oct 24", "id": "post-2026-10-24-k-1"}], "kubotTitle": "Robot on the Street: use robots or build them?"}, "2026-10-25": {"kubot": [{"platform": "linkedin", "kind": "LinkedIn post", "text": "We asked Miami if they'd let a robot teach their kid.\n\nEpisode 2 of the Kubot podcast is Gabriel and me reacting to the best street answers.\n\nThe one that got Gabriel: \"[the answer, word for word].\"\nHis reaction: \"[Gabriel's line].\"\n\nI expected most people to say no.\n[what actually happened].\n\nHere's where we landed:\nthe question isn't whether robots should teach kids.\nIt's whether kids get to build them.\n\nBuilding in public includes the parts where we're wrong.\n\nFull episode: [link].", "parts": null, "src": "Calendar post Oct 25 (podcast episode 2)", "id": "post-2026-10-25-k-0"}, {"platform": "x", "kind": "X post", "text": "Episode 2: Gabriel and I react to the best street answers to \"would you let a robot teach your kid?\"\n\nThe one that got him: \"[the answer].\"\n\n[link]", "parts": null, "src": "Calendar post Oct 25", "id": "post-2026-10-25-k-1"}], "kubotTitle": "Podcast episode 2"}}}, "built": "Fri Oct 16, 2026, 3:04 PM ET", "days": [{"date": "2026-10-09", "label": "Fri Oct 9", "dow": "Fri", "dom": 9, "dayN": 15, "items": [{"id": "s-2026-10-09-0", "kind": "shoot", "min": 930, "time": "3:30 PM to 5:00 PM", "verb": "Shoot", "acct": "Kubot", "what": "Kubot hero shoot / Bal Harbour class", "doneKey": "hub-shoot-2026-10-09-0", "shots": ["Podcast ep. 1: Kid of the week candidate (with a parent on mic) (for Sun Oct 18)", "Podcast ep. 2: Kid of the week candidate (with a parent on mic) (for Sun Oct 25)", "Why Build? #10 Learning by doing: Friday class B-roll (for Mon Oct 12)", "Why Build? #3 Focus: timelapse of a quiet, focused room (for Thu Oct 15)", "Why Build? #2 Handling frustration: a robot failing and a kid fixing it (for Mon Oct 19)", "Why Build? #6 Confidence: a kid explaining their robot to camera (for Thu Oct 22)", "Testimonials post (cut from this class): Testimonials right after class: one parent answer plus kid b-roll, 30 to 45 seconds (for Fri Oct 16)"], "rules": [], "start": 930, "end": 1020}]}, {"date": "2026-10-10", "label": "Sat Oct 10", "dow": "Sat", "dom": 10, "dayN etails": {"sections": [{"title": "Plan", "rows": [["Goal", "Show a parent what a Friday class actually looks like, in about 30 seconds: kids walk in to a pile of parts and leave with a robot that moves. A parent should feel something even if they never visit Kubot."], ["Source", "the videographer's Fri Oct 9 Bal Harbour class footage, Day1 folder: [Drive link] (subfolders Interactions, DynamicShots, Wides)."], ["Length", "About 25 to 35 seconds, vertical."], ["Rules", "No prices, no pitch, no \"book now\". Soft close only: \"Waitlist link in bio.\" Signed photo and video release for every face, and always a parent's for kids. First names only, no school names."]]}, {"title": "Hook", "rows": [["Text on screen, option 1", "They walked in with a pile of parts."], ["Text on screen, option 2", "This is what a Friday class looks like."], ["Text on screen, option 3", "Pieces in. Robot out."], ["Opening shot", "The first time a robot moves, then cut back to the pile of parts."]]}, {"title": "Shots", "items": ["Wide of the room as kids arrive (Wides)", "Kids building: small hands on CyberBricks and 3D printed parts (Interactions)", "Close ups of hands wiring motors and chips", "Printed parts and prints on the table", "Robots moving for the first time, plus the kid's face right after", "Gabriel teaching: hands, face, parts board, kids reacting (DynamicShots)", "A quiet, focused moment (slow push or fixed wide)", "Before and after: parts pile, then the finished robot", "Kid showing a build to the camera or a parent (no interview framing)"]}, {"title": "Edit", "rows": [["0 to 2s", "Robot moves for the first time. Hook text on screen."], ["2 to 6s", "Wide: kids arriving, parts on the table."], ["6 to 14s", "Fast cuts of hands building, wiring and printed parts (about 1 second each, on the beat)."], ["14 to 20s", "Gabriel teaching close ups, kids leaning in."], ["20 to 27s", "Robots moving, kid reactions, one quiet focused shot."], ["27 to 32s", "Finished robot held up. End text:
