/* ---------- SHEETS ---------- */
const sheet = document.getElementById('sheet'), scrim = document.getElementById('scrim');
function closeSheet() { sheet.classList.remove('on'); scrim.classList.remove('on'); document.body.classList.remove('lock'); }
document.getElementById('sh-x').addEventListener('click', closeSheet); scrim.addEventListener('click', closeSheet);
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeSheet(); });
function showSheet(navTitle, bodyHtml) {
  document.getElementById('sh-navtitle').textContent = navTitle; document.getElementById('sh-body').innerHTML = bodyHtml; document.getElementById('sh-body').scrollTop = 0;
  sheet.classList.add('on'); scrim.classList.add('on'); document.body.classList.add('lock');
}
function fmtText(t) {
  return esc(t).replace(/\[(B-ROLL|MUSIC|SFX|CUT|ON-SCREEN|TEXT)([^\]]*)\]/g, '<span class="cue">($1$2)</span>').replace(/\[([^\]]+)\]/g, '<span class="fill">$1</span>');
}
function stepsHtml(s) {
  let h = '';
  if (s.onscreen && s.onscreen.length) h += '<div class="hdr">Text on screen</div><div class="group"><div class="cell"><div class="tx">' + s.onscreen.map(esc).join('\n') + '</div></div></div>';
  h += '<div class="hdr">Steps</div><div class="group">' + s.steps.map(function(st, i) { return '<div class="cell"><div class="stepn">Step ' + (i + 1) + ' \u00B7 <b>' + esc(st.name) + '</b></div><div class="tx">' + fmtText(st.text) + '</div></div>'; }).join('') + '</div>';
  if (/\[/.test(s.steps.map(function(x) { return x.text; }).join(''))) h += '<div class="legend-f"><span class="fill">Highlighted</span> = you fill this in</div>';
  return h;
}
function cellsHtml(pairs) { return '<div class="group">' + pairs.filter(function(p) { return p[1]; }).map(function(p) { return '<div class="cell"><div class="lbl">' + esc(p[0]) + '</div><div class="tx">' + p[1] + '</div></div>'; }).join('') + '</div>'; }
function headHtml(kind, title, meta) {
  return '<div class="sh-meta k-' + kind + '"><span class="dot"></span>' + esc(TYPES[kind].name) + (meta ? ' \u00B7 ' + esc(meta) : '') + '</div><div class="sh-title">' + esc(title) + '</div>';
}
function rerender() { renderToday(); renderCalendar(); renderScripts(); renderPosts(); }
function openSheet(it) {
  const links = linkedScripts(), done = get(it.doneKey); let body = '';
  if (it.linkScript) {
    const s = links[it.id] ? scriptByN(links[it.id]) : null;
    body += headHtml(it.kind, s ? s.title : TYPES[it.kind].name, it.time + ', film + post');
    if (s) body += '<div class="hdr">Hook</div>' + cellsHtml([['', '\u201C' + fmtText(s.hook) + '\u201D']]) + stepsHtml(s);
    else body += '<div class="hdr">&nbsp;</div><div class="group"><div class="empty">No script for this yet. New scripts get written each morning.</div></div>';
    body += '<div class="hdr">After posting</div>' + cellsHtml([['Story task', esc(it.story)], ['Reply to comments', esc(it.reply)]]);
  } else if (it.kind === 'kubot') {
    body += headHtml('kubot', it.what, 'post any time');
    if (it.hook || it.shot || it.note) body += '<div class="hdr">Post</div>' + cellsHtml([['Hook', it.hook ? '\u201C' + esc(it.hook) + '\u201D' : ''], ['Shot', esc(it.shot)], ['Note', esc(it.note)]]);
    if (it.steps && it.steps.length) body += '<div class="hdr">Script</div><div class="group"><div class="cell"><div class="stepn">Step 1 \u00B7 <b>Hook</b></div><div class="tx">' + esc(it.steps[0]) + '</div></div>' +
      (it.steps.length > 1 ? '<div class="cell"><div class="stepn">Step 2 \u00B7 <b>Say this</b></div><div class="tx">' + it.steps.slice(1).map(esc).join('\n') + '</div></div>' : '') + '</div>';
    if (it.details) body += detailsHtml(it);
    else if (it.caption) body += '<div class="hdr">Caption</div>' + cellsHtml([['Instagram', esc(it.caption)]]);
  } else if (it.kind === 'shoot') {
    body += headHtml('shoot', it.what, it.time);
    if (it.shots && it.shots.length) body += '<div class="hdr">Get these</div><div class="group">' + it.shots.map(function(x) { return '<div class="cell"><div class="tx">' + esc(x) + '</div></div>'; }).join('') + '</div>';
    if (it.rules && it.rules.length) body += '<div class="hdr">Remember</div><div class="group">' + it.rules.map(function(x) { return '<div class="cell"><div class="tx">' + esc(x) + '</div></div>'; }).join('') + '</div>';
  } else if (it.kind === 'deal') {
    body += dealBody(it.deal);
  }
  body += '<div class="group" style="margin-top:28px"><button type="button" class="actbtn' + (done ? ' undo' : '') + '" id="sh-done">' + (done ? 'Mark as Not Done' : 'Mark as Done') + '</button></div>';
  showSheet('', body);
  if (it.details) wireDetails(it);
  document.getElementById('sh-done').addEventListener('click', function() { toggleDone(it); closeSheet(); rerender(); });
}
/* ---------- Kubot detail sections (kubot-details.json) ---------- */
function secHtml(sec, ck) {
  let h = '<div class="hdr">' + esc(sec.title) + '</div>';
  if (sec.rows) h += cellsHtml(sec.rows.map(function(r) { return [r[0], fmtText(r[1]).replace(/(https?:\/\/[^\s<]+)/g, '<a class="link" href="$1" target="_blank" rel="noopener">$1</a>')]; }));
  if (sec.items) h += '<div class="group">' + sec.items.map(function(x, i) { return '<div class="cell"><div class="tx">' + (sec.title === 'Questions' ? (i + 1) + '. ' : '') + fmtText(x) + '</div></div>'; }).join('') + '</div>';
  if (sec.checks) h += '<div class="group">' + sec.checks.map(function(x, i) { const k = ck + i, on = get(k); return '<div class="cell kc-row" style="display:flex;align-items:center;padding-left:0"><button type="button" class="chk' + (on ? ' on' : '') + '" data-kchk="' + k + '" aria-label="Check off"><span>' + TICK + '</span></button><div class="tx" style="flex:1">' + fmtText(x) + '</div></div>'; }).join('') + '</div>';
  return h;
}
function detailsHtml(it) {
  const d = it.details, base = 'hub-kchk-' + it.id.slice(2);
  if (!d.options) return d.sections.map(function(s) { return secHtml(s, base + '-'); }).join('');
  let h = '<div class="hdr">Which one</div>' + cellsHtml([['', esc(d.rule)]]);
  h += '<div class="kseg" role="tablist">' + d.options.map(function(o, i) { return '<button type="button" role="tab" data-kopt="' + i + '"' + (i === 0 ? ' class="on"' : '') + '>' + esc(o.name) + '</button>'; }).join('') + '</div>';
  h += d.options.map(function(o, i) { return '<div class="kopt" data-kpane="' + i + '"' + (i ? ' hidden' : '') + '>' + o.sections.map(function(s) { return secHtml(s, base + '-o' + i + '-'); }).join('') + '</div>'; }).join('');
  return h;
}
function wireDetails(it) {
  const b = document.getElementById('sh-body');
  b.querySelectorAll('[data-kchk]').forEach(function(x) { x.addEventListener('click', function() { const on = !get(x.dataset.kchk); set(x.dataset.kchk, on); x.classList.toggle('on', on); }); });
  b.querySelectorAll('[data-kopt]').forEach(function(x) { x.addEventListener('click', function() {
    b.querySelectorAll('[data-kopt]').forEach(function(y) { y.classList.toggle('on', y === x); });
    b.querySelectorAll('[data-kpane]').forEach(function(p) { p.hidden = p.dataset.kpane !== x.dataset.kopt; });
  }); });
}
function dealBody(d) {
  return headHtml('deal', d.brand, d.group === 'reply' ? 'reply now' : d.group === 'waiting' ? 'waiting on them' : d.group === 'done' ? 'done' : 'ignored') +
    (d.risky ? '<div class="risk" style="padding:4px 4px 0;font-size:15px">Looks risky. ' + esc(d.verdict) + '</div>' : '') +
    '<div class="hdr">Next step</div>' + cellsHtml([['', esc(d.next)]]) +
    '<div class="hdr">Money</div>' + cellsHtml([['They offer', esc(d.theirs)], ['You asked', esc(d.ours)]]) +
    '<div class="hdr">Details</div>' + cellsHtml([['What it is', esc(d.offerType)], ['What they want', esc(d.deliv)], ['Contact', esc(d.contact)], ['Last activity', esc(d.last)], ['What happened last', esc(d.summary)], ['Notes', esc(d.notes)], ['Safety check', esc(d.verdict)]]);
}
function openDeal(d) { showSheet('', dealBody(d)); }
function openScript(s) {
  const rec = scriptRecorded(s.n);
  let body = headHtml(s.kind, s.title, s.status) + '<div class="hdr">Hook</div>' + cellsHtml([['', '\u201C' + fmtText(s.hook) + '\u201D']]) + stepsHtml(s);
  if (s.fill && s.fill !== 'None (no personal details).') body += '<div class="hdr">You fill these in</div>' + cellsHtml([['', esc(s.fill)]]);
  body += '<div class="hdr">Source</div>' + cellsHtml([['', /^https?:/.test(s.source) ? '<a class="link" href="' + esc(s.source) + '" target="_blank" rel="noopener">' + esc(s.source) + '</a>' : esc(s.source || '-')]]);
  body += '<div class="group" style="margin-top:28px"><button type="button" class="actbtn' + (rec ? ' undo' : '') + '" id="sh-rec">' + (rec ? 'Mark as Not Recorded' : 'Mark as Recorded') + '</button></div>';
  showSheet('', body);
  document.getElementById('sh-rec').addEventListener('click', function() { set('hub-recorded-' + s.n, !rec); closeSheet(); rerender(); });
}


/* ---------- POSTS (posts.json via posts.py) ---------- */
let postSide = 'personal';
let postSel = (TODAY >= H.posts.start && TODAY <= H.posts.end) ? TODAY : H.posts.start;
const PF = { linkedin: ['LinkedIn', 'pf-li'], x: ['X', 'pf-x'], substack: ['Substack', 'pf-substack'] };
function postText(d) { return d.parts ? d.parts.map(function(p, i) { return (i + 1) + '/' + d.parts.length + ' ' + p; }).join('\n\n') : d.text; }
function postOpenUrl(d) {
  if (d.platform === 'x') return 'https://x.com/intent/post?text=' + encodeURIComponent(d.parts ? '1/' + d.parts.length + ' ' + d.parts[0] : d.text);
  if (d.platform === 'linkedin') return 'https://www.linkedin.com/feed/?shareActive=true&text=' + encodeURIComponent(d.text);
  return d.kind === 'Substack long-form' ? H.posts.substackPublish : 'https://substack.com/notes';
}
function xLens(d) { return d.platform !== 'x' ? null : (d.parts ? d.parts.map(function(p, i) { return (i + 1 + '/' + d.parts.length + ' ' + p).length; }) : [d.text.length]); }
function firstLine(t) { return (t || '').split('\n').filter(function(l) { return l.trim(); })[0] || ''; }
function renderPosts() {
  const el = document.getElementById('s-posts'), day = (H.posts.days[postSel] || {}), list = day[postSide] || [];
  const all = Object.keys(H.posts.days).reduce(function(a, k) { return a.concat(H.posts.days[k].personal || [], H.posts.days[k].kubot || []); }, []);
  const posted = all.filter(function(d) { return get('hub-posted-' + d.id); }).length;
  let html = '<div class="large">Posts</div><div class="lede">' + posted + ' of ' + all.length + ' drafts posted. Nothing posts by itself.</div>';
  html += '<div class="seg" role="tablist">' + [['personal', 'Personal'], ['kubot', 'Kubot']].map(function(c) { return '<button type="button" class="' + (postSide === c[0] ? 'on' : '') + '" data-ps="' + c[0] + '">' + c[1] + '</button>'; }).join('') + '</div>';
  html += '<div class="calnav"><button type="button" class="navb" id="post-prev" aria-label="Previous day"' + (postSel <= H.posts.start ? ' disabled style="opacity:.3"' : '') + '><svg viewBox="0 0 10 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 1.5 1.5 9l7 7.5"/></svg></button>' +
    '<div class="calbl">' + esc(niceDate(postSel, { weekday: 'short', month: 'short' })) + '</div><button type="button" class="navb" id="post-next" aria-label="Next day"' + (postSel >= H.posts.end ? ' disabled style="opacity:.3"' : '') + '><svg viewBox="0 0 10 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 1.5 8.5 9l-7 7.5"/></svg></button>' +
    '<button type="button" class="todayb" id="post-today">Today</button></div>';
  if (postSide === 'kubot' && day.kubotTitle) html += '<div class="lede" style="margin-top:4px">From: ' + esc(day.kubotTitle) + '</div>';
  if (!list.length) html += '<div class="hdr">&nbsp;</div><div class="group"><div class="empty">Drafts appear once the script is written.</div></div>';
  ['linkedin', 'x', 'substack'].forEach(function(pf) {
    const ds = list.filter(function(d) { return d.platform === pf; }); if (!ds.length) return;
    html += '<div class="hdr">' + PF[pf][0] + '</div><div class="group">' + ds.map(function(d) {
      const on = get('hub-posted-' + d.id), L = xLens(d);
      return '<div class="rowwrap' + (on ? ' isdone' : '') + '"><button type="button" class="chk' + (on ? ' on' : '') + '" data-posted="' + d.id + '" aria-label="Mark posted"><span>' + TICK + '</span></button>' +
        '<button type="button" class="row" data-post="' + d.id + '"><span class="main"><span class="pbadge ' + PF[pf][1] + '"><i></i>' + esc(d.kind) + (on ? ' \u00B7 Posted' : '') + '</span>' +
        '<span class="title" style="display:block">' + esc(firstLine(d.parts ? d.parts[0] : d.text)) + '</span>' +
        '<span class="sub" style="display:block">' + (L ? (L.length > 1 ? L.length + ' posts, longest ' + Math.max.apply(null, L) : L[0]) + ' of 280 characters' : d.text.split(/\s+/).length + ' words') + '</span></span>' + CHEV + '</button></div>';
    }).join('') + '</div>';
  });
  el.innerHTML = html;
  el.querySelectorAll('[data-ps]').forEach(function(b) { b.addEventListener('click', function() { postSide = b.dataset.ps; renderPosts(); }); });
  document.getElementById('post-prev').addEventListener('click', function() { if (postSel > H.posts.start) { postSel = addDays(postSel, -1); renderPosts(); } });
  document.getElementById('post-next').addEventListener('click', function() { if (postSel < H.posts.end) { postSel = addDays(postSel, 1); renderPosts(); } });
  document.getElementById('post-today').addEventListener('click', function() { postSel = (TODAY >= H.posts.start && TODAY <= H.posts.end) ? TODAY : H.posts.start; renderPosts(); });
  el.querySelectorAll('[data-posted]').forEach(function(b) { b.addEventListener('click', function(e) { e.stopPropagation(); set('hub-posted-' + b.dataset.posted, !get('hub-posted-' + b.dataset.posted)); renderPosts(); }); });
  el.querySelectorAll('[data-post]').forEach(function(b) { b.addEventListener('click', function() { openPost(list.find(function(d) { return d.id === b.dataset.post; })); }); });
}
function copyText(t, btn) {
  const ok = function() { const o = btn.textContent; btn.textContent = 'Copied'; btn.classList.add('copied'); setTimeout(function() { btn.textContent = o; btn.classList.remove('copied'); }, 1400); };
  const fb = function() { const a = document.createElement('textarea'); a.value = t; a.style.position = 'fixed'; a.style.opacity = '0'; document.body.appendChild(a); a.select(); try { document.execCommand('copy'); } catch (e) {} a.remove(); ok(); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(ok, fb); else fb();
}
function openPost(d) {
  const key = 'hub-posted-' + d.id, on = get(key), L = xLens(d);
  let body = '<div class="sh-meta"><span class="pbadge ' + PF[d.platform][1] + '"><i></i>' + esc(d.kind) + '</span> \u00B7 ' + esc(niceDate(postSel, { weekday: 'short', month: 'short' })) + '</div><div class="sh-title">' + esc(firstLine(d.parts ? d.parts[0] : d.text)) + '</div>';
  if (d.parts) body += d.parts.map(function(p, i) { return '<div class="hdr">Post ' + (i + 1) + ' of ' + d.parts.length + ' <span class="pcount' + (L[i] > 280 ? ' bad' : '') + '">\u00B7 ' + L[i] + '/280</span></div>' + '<div class="group"><div class="cell"><div class="ptext">' + fmtText((i + 1) + '/' + d.parts.length + ' ' + p) + '</div></div></div>'; }).join('');
  else body += '<div class="hdr">Full text' + (L ? ' <span class="pcount' + (L[0] > 280 ? ' bad' : '') + '">\u00B7 ' + L[0] + '/280</span>' : ' \u00B7 ' + d.text.split(/\s+/).length + ' words') + '</div><div class="group"><div class="cell"><div class="ptext">' + fmtText(d.text) + '</div></div></div>';
  if (/\[/.test(postText(d))) body += '<div class="legend-f"><span class="fill">Highlighted</span> = fill in before posting</div>';
  if (d.src) body += '<div class="hdr">Built from</div>' + cellsHtml([['', esc(d.src)]]);
  body += '<div class="pbtns"><button type="button" class="actbtn" id="pp-copy">' + (d.parts ? 'Copy thread' : 'Copy') + '</button><a class="actbtn" id="pp-open" href="' + esc(postOpenUrl(d)) + '" target="_blank" rel="noopener" style="text-decoration:none">Open ' + PF[d.platform][0] + '</a></div>';
  if (d.parts) body += '<div class="legend-f">Open starts post 1. Add the rest as replies.</div>';
  else if (d.platform === 'substack') body += '<div class="legend-f">Substack has no prefill. Copy first, then paste.</div>';
  body += '<div class="group" style="margin-top:22px"><button type="button" class="actbtn' + (on ? ' undo' : '') + '" id="pp-posted">' + (on ? 'Mark as Not Posted' : 'Mark as Posted') + '</button></div>';
  showSheet('', body);
  document.getElementById('pp-copy').addEventListener('click', function() { copyText(postText(d), this); });
  document.getElementById('pp-posted').addEventListener('click', function() { set(key, !on); closeSheet(); renderPosts(); });
}

/* ---------- tabs ---------- */
function show(s) {
  document.querySelectorAll('.screen').forEach(function(x) { x.classList.toggle('on', x.id === 's-' + s); });
  document.querySelectorAll('#tabbar button').forEach(function(b) { b.classList.toggle('on', b.dataset.s === s); });
  window.scrollTo(0, 0); try { history.replaceState(null, '', location.search + '#' + s); } catch (e) {}
}
document.querySelectorAll('#tabbar button').forEach(function(b) { b.addEventListener('click', function() { show(b.dataset.s); }); });
rerender();
if (/^#(today|calendar|scripts|posts)$/.test(location.hash)) show(location.hash.slice(1));
</script>
